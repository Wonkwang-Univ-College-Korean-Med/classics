가하여 최적 용량을 정함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 4 「변증가감과 다계통조화」)"],"ss":{"composition":"그림 4-2 사생음四生飮의 모듈 구성 ①자음양혈滋陰養血 및 유간식풍柔肝息風 모듈 — 심, 간, 신의 음액과 혈을 보충하여 근본을 다짐 생지황, 백작약 : 생지황은 심·간·신경으로 들어가 자음청열滋陰淸熱하며 위기를 상하게 하지 않고 윤택함. 백작약은 혈을 기르고 음을 수렴하며 간을 부드럽게 하여 통증을 그치게 함. 두 약의 합용은 사물탕의 혈분 보약 구조를 계승하여 자음양혈滋陰養血의 근간을 이룸 ②중진잠양重鎭潛陽 및 익음렴정益陰斂精 모듈 — 허양虛陽을 가라앉히고 심신을 굳건히 수렴함 용골, 모려 : 용골은 심, 간경으로 들어가 떠오르는 양기를 가라앉히고 심신을 거두어 놀라움을 진정시키며 잠을 오게 함. 모려는 양기를 가라앉히고 수렴하며, 굳은 것을 부드럽게 하고 땀을 멈추고 담을 제거함. 이들은 화합하여 음을 더하고 양을 수렴하며 정신을 안정시키는 핵심 효능을 발휘함","master":"①질병 인식 및 병기의 핵심 신지병의 범위 : 정지情志 요인으로 인해 발생한 심신 질환으로, 중의학의 불면, 경계驚悸, 장조臟躁, 울증鬱證, 백합병百合病 등에 해당하며 양의학의 자율신경실조증, 우울증, 불안증, 강박증 등을 아우름 음허양항陰虛陽亢과 심신불교心腎不交 : 신음腎陰이 부족하여 심화心火를 제어하지 못하거나, 심음心陰이 손상되고 심양이 치솟아 음이 양을 거두지 못하는 음불렴양陰不斂陽이 병기의 핵심임. ‘마음이 신을 갈무리하지 못하면心不藏神’ 정신이 머물 곳이 없어 불안, 불면, 감정 다변 등의 제증상이 발생함 ②임상 표현의 다면성 분석 수면 장애 및 땀 분비 이상 : 심음이 손상되어 음불렴양陰不斂陽으로 불면이 오고, 위기衛氣와 영음營陰의 실조로 자한 및 도한이 발생함 건조 증상 및 오심번열 : 신음이 허하여 입마름, 인건咽乾, 비건鼻乾, 안건眼乾, 피부 건조 및 오심번열五心煩熱이 나타남 정신, 정서 및 전신 증상 : 수해髓海 부족으로 인한 두훈건망頭暈健忘(어지럼·건망), 비위 운화 장애로 인한 복창납매腹脹納呆(배가 더부룩하고 식욕이 없음), 담허膽虛로 인한 이노이경易怒易驚, 권태소수倦怠消瘦 등 오장육부의 연계적 병리를 동반함 ③치료 원칙 및 임상 겸증별 가감 활용 자음잠양滋陰潛陽과 대용량 생약 투여 : 흥분성 증상과 자율신경 실조를 가라앉히기 위해 단순한 안신安神에 그치지 않고 자음잠양滋陰潛陽을 대법大法으로 삼으며, 생지황, 生백작약, 生용골, 生모려 모두 생품生品을 각 50g씩 과감하게 투여하여 자음잠양 효과를 극대화함 임상 겸증별 세부 가감 원칙: 음허陰虛가 주증일 때(오심번열五心煩熱, 설홍소태舌紅少苔, 맥세삭脈細數) : 현삼을 더해 자음강화滋陰降火함 불면증 위주이고 순수 음허일 때(설건홍무태舌乾紅無苔, 맥세삭脈細數하고, 간울기체肝鬱氣滯와 습담濕痰이 없음): 산조인, 오미자, 백자인을 더함 불면증에 비허脾虛를 겸할 때(혀가 크고 치흔齒痕이 있으며 태백니苔白膩) : 합환화, 야교등을 더함 심화상염心火上炎이 주증일 때(가슴이 답답한 불면인 심번불매心煩不寐, 설첨적舌尖赤): 황련을 더해 청심제번淸心除煩함 자한, 도한, 비기허脾氣虛일 때 : 부소맥을 더함 음허가 매우 뚜렷할 때(설홍무태舌紅無苔, 맥세삭脈細數) : 산수유50~100g을 대량으로 더함 납매納呆(식욕부진), 복창腹脹, 애기噯氣 : 불수, 향연香櫞, 복령, 초삼선焦三仙, 지각을 더해 이기화위理氣和胃함 간양상요肝陽上擾가 뚜렷할 때(머리가 멍하고 팽창감이 있는 통증의 두혼창통頭昏脹痛, 혈압 상승): 석결명, 진주모를 더해 평간잠양平肝潛陽함 혈압이 낮을 때 : 지실을 더함 비허부종脾虛浮腫이 있을 때 : 복령, 백출, 산약을 더해 건비리습健脾利濕함 심계心悸가 주증일 때 : 山치자, 목단피를 더해 청심화淸心火함 곡소무상哭笑無常으로 울고 웃을 때 : 소맥, 대조를 더함 기능성 실명失明 발생 시 : 구기자, 당귀 등의 양간음약養肝陰藥을 더함 기능성 실어失語 발생 시 : 울금, 석창포 등 활담개규약豁痰開竅藥을 더함 감각운동 이상(사지추휵四肢抽搐, 지체마목肢體麻木) : 천련자를 더해 양간서근養肝舒筋함 간울기체肝鬱氣滯가 주증일 때 : 천련자, 울금 등을 더함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 자율신경실조·갱년기 증상은 국내 수요가 큰 영역이며 공개자료상 제품·특허가 확인되지 않아, 증상 척도 기반 탐색 연구로 시작할 수 있음 참고문헌 [1] 리자오,리티,루톈자오.루팡 교수의 사생음 활용 신지병 진료 경험李姣,李倜,盧天蛟.盧芳教授運用四生飮診治神志病經驗[J].중국위생표준관리中國衛生標準管理,2017,8(6):80-81."}},{"id":"4-3","ko":"곡청탕","hz":"穀淸湯","alias":"","master_ko":"장레이","master_hz":"張磊","tagline":"풍열지사風熱之邪로 인해 두부頭部에 발생한 제반 질환을 치료하는 처방","meta":{"주요 적응증":"풍열성 두통·어지럼·이명","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":224,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-3 곡청탕穀淸湯의 모듈 구성<\/p><h4>①경청산풍輕淸散風 모듈 — 가볍고 청열하는 성질로 두면부의 풍열 사기를 발산함<\/h4><p><b>박하, 국화, 선퇴, 만형자<\/b>: 박하는 신량산풍辛涼散風하고 청리두목淸利頭目함. 국화는 소풍청열疏風淸熱하여 명목明目함. 선퇴는 투진선열透疹宣熱하고 상행上行하여 이인명목利咽明目함. 만형자는 청리두목淸利頭目하고 거풍산사祛風散邪함. 이들은 성질이 가볍고 위로 떠오르며 서늘하게 흩어주는 작용으로 두면부의 풍열을 밖으로 배출함<\/p><h4>②청열사화淸熱瀉火 모듈 — 상초의 열세를 직접 끄고 화사火邪를 제어함<\/h4><p><b>황금, 감초<\/b>: 황금은 청열조습淸熱燥濕하고 사화해독瀉火解毒하여 상초의 실열을 내림. 감초는 청열해독하며 제약을 조화시킴. 이들은 처방 전체의 열세를 제어하는 청열사화의 축을 담당함<\/p><h4>③명목이수明目利水 모듈 — 간경肝經의 열을 식히고 눈을 밝게 하며 수기水氣를 소통시킴<\/h4><p><b>곡정초, 청상자, 결명자<\/b>: 곡정초는 소풍청열疏風淸熱하고 명목퇴예明目退翳함. 청상자는 청간사화淸肝瀉火하고 명목明目함. 결명자는 청간명목淸肝明目하고 윤장통변潤腸通便함. 이들은 간경의 열을 식히고 눈을 밝게 하며 두면부의 탁한 기운과 수기를 소통시키는 핵심 효능을 발휘함<\/p>"},{"k":"master","t":"장레이의 내과잡병 치료 8법","html":"<p>장레이는 외감병을 제외한 내과 질환인 ‘잡병雜病’이 표리表裏와 한열寒熱, 허실虛實, 음양陰陽이 서로 뒤섞여 복잡하고 치료가 까다롭다는 점에 주목하고, 이에 오랜 임상 경험을 바탕으로 내과 잡병을 다스리는 ‘치료 8법’과 각 법에 해당하는 구체적인 처방들을 정립함<\/p><h4>①경청법輕淸法<\/h4><p><b>적응증 및 병기<\/b>: 주로 풍열지사風熱之邪가 머리를 상하게 하여 발생한 두통, 두혼頭昏(머리가 맑지 않음), 두훈頭暈(어지럼), 이명, 안창眼脹, 코막힘, 비류탁체鼻流濁涕 등의 질환. 머리는 “제양지회諸陽之會”이자 “청양지부淸陽之府”이며, 풍風과 열熱은 양사陽邪로서 성질이 가볍고 위로 떠올라 머리를 쉽게 침범함. 《소문·태음양명론편》의<\/p><p class=\"quote\">“양수풍기陽受風氣……상어풍자傷於風者, 상선수지上先受之”에 근거함<\/p><p><b>치료 원칙<\/b>: 성질이 가볍고 위로 떠오르며 서늘하게 흩어주는 약물을 사용하여 양증陽證의 특성에 맞게 사기를 제거함. 특히 봄철에 발생하는 두부 질환에 효과가 좋다고 봄<\/p><p><b>대표 처방<\/b>: 곡청탕穀淸湯<\/p><p class=\"sub\"><b>가감 활용<\/b>: 안구의 창만脹滿에는 하고초를 가미하고, 두혼頭昏(머리가 맑지 않음)이 심할 때는 하엽을 가미하며, 두통이 심할 때는 천궁을 가미하고, 두훈頭暈(어지럼)이 심할 때는 구등을 가미하며, 코막힘이 심할 때는 창이자, 신이를 가미하고, 변비가 심할 때는 결명자를 중용하며, 음허가 심할 때는 현삼을 가미하고, 양항陽亢에는 生석결명 등을 가미함<\/p><h4>②척탁법滌濁法<\/h4><p><b>적응증 및 병기<\/b>: 탁사濁邪가 인체 내부에 정체되어 탁음이 조체阻滯하는 제반 증상. 《소문·탕액료례론》의<\/p><p class=\"quote\">“去菀陳莝…疏滌五臟”의 취지에 근거함. 잡병 중에서 탁사조체濁邪阻滯 증상이 매우 흔하며, 병의 핵심은 ‘탁濁’이고 처방의 핵심은 ‘척滌’에 있음<\/p><p><b>치료 원칙<\/b>: 탁사를 소통시키되 정기를 해치지 않도록 주의하며 서서히 도모함. 병증의 부위에 따라 4가지 방제를 나누어 활용함<\/p><p class=\"lbl2\">대표 처방<\/p><p class=\"sub\"><b>탁사조폐폐실청숙방濁邪阻肺肺失淸肅方<\/b>: 담, 습, 열이 폐를 막아 기침, 천식, 가슴 답답함, 누런 가래가 끈끈해 잘 안 나오는 증상 및 관련 폐암에 가감 활용. 조성과 용량은 노근30g, 동과인30g, 生의이인30g, 도인10g, 길경15g, 황금10g, 해부석30g, 炒정력자15g, 炒자소자3g, 마황3g, 生감초6g, 대추5개<\/p><p class=\"sub\"><b>탁사중조비실기운방濁邪中阻脾失其運方<\/b>: 기름진 음식 과다로 비만, 곤권困倦, 설태황니, 고지혈증, 당뇨 및 고혈압 성향이 있는 경우. 조성과 용량은 노근30g, 동과인30g, 生의이인30g, 도인10g, 制반하10g, 귤피10g, 복령12g, 택사10g,炒창출15g, 炒백출10g, 炒신곡10g, 치자10g, 生감초6g<\/p><p class=\"sub\"><b>간열비습탁사적착방肝熱脾濕濁邪積着方<\/b>: 만성 간질환 환자의 우측 옆구리 불편감, 복통, 소변 황색, 대변 이상, 간기능 이상, 비장 비대 등. 조성과 용량은 노근30g, 동과인30g, 生의이인30g, 도인10g, 별갑30g, 울금15g, 醋연호색15g, 패장초30g, 生맥아20g, 炮천산갑10g, 大패모10g, 하고초15g, 인진30g, 대황6g, 生감초6g<\/p><p class=\"sub\"><b>탁재하초방광실리방濁在下焦膀胱失利方<\/b>: 탁사가 하초에 머물러 소변이 탁하고 붉으며 잘 안 나오고, 아랫배나 회음부가 창통脹痛할 때. 조성과 용량은 백모근30g, 동과인30g, 生의이인30g, 도인10g, 연교10g, 적소두30g, 활석30g,懷우슬10g, 지룡10g, 호박琥珀3g(충복), 동규자冬葵子15g, 복령10g, 계지3g, 生감초6g<\/p><h4>③소리법疏利法<\/h4><p><b>적응증 및 병기<\/b>: 수습이 운화를 잃어 전신이 울창鬱脹한데 종腫인 듯하나 종이 아닌 경락인어經絡湮淤의 증후. 병정이 길고 검사상 이상이 없고 소변량은 정상이며 이뇨제를 복용하면 경감되고 약을 중지하면 다시 반복됨<\/p><p><b>치료 원칙<\/b>: 상황에 따라 5가지 기본방을 체계화하여 유연하게 활용함<\/p><p class=\"lbl2\">대표 처방<\/p><p class=\"sub\"><b>소보상겸방疏補相兼方<\/b>: 비허실운脾虛失運으로 수습이 정체되어 전신 울창鬱脹이 발생한 경우. 조성과 용량은 炒창출10g,炒백출10g, 복령10g, 저령10g, 청피6g, 진피6g, 炒지각6g, 炒지실6g, 택사10g, 목과30g, 生의이인30g, 적소두30g, 활석15g, 生감초3g<\/p><p class=\"sub\"><b>행기통락방行氣通絡方<\/b>: 경락기체經絡氣滯로 인해 전신 울창鬱脹이 발생하고 복창腹脹과 요소尿少는 없는 경우. 조성과 용량은 목과30g, 위령선10g, 백작약10g, 계지10g, 인동등30g, 사과락30g, 통초6g, 制향부자10g, 生의이인30g, 강활3g, 독활3g, 방풍3g, 生감초3g<\/p><p class=\"sub\"><b>화담통락방化痰通絡方<\/b>: 담, 습, 열, 어혈이 조체하여 수종 양상이 있는 경우. 조성과 용량은 淸반하10g, 진피10g, 복령30g,炒지실10g, 죽여10g, 택사15g, 사과락30g, 인동등30g, 生감초6g<\/p><p class=\"sub\"><b>소간건비리습통락방疏肝健脾利濕通絡方<\/b>: 간울비허肝鬱脾虛, 기기조체氣機阻滯, 수습실운水濕失運의 울창증鬱脹證으로 인한 안면과 하지 부종, 월경 전 유방 팽만, 급조이노急躁易怒 등. 조성과 용량은 시호10g, 백작약10g, 당귀10g,炒백출10g, 복령30g, 박하3g(後下), 制향부자15g, 목과30g, 生의이인30g, 生감초3g<\/p><p class=\"sub\"><b>화어통락방化瘀通絡方<\/b>: 수습정체로 피부에 범람하고 담, 어혈을 겸하여 경락이 불통할 때. 조성과 용량은 酒상지30g, 사과락30g, 강황6g, 목과30g, 生의이인30g, 통초6g, 制남성10g, 귤락10g, 계혈등30g, 당귀10g<\/p><h4>④달울법達鬱法<\/h4><p><b>적응증 및 병기<\/b>: 울증에 사용하며, 울결비체鬱結痞滯하여 응결되고 소통되지 않아서 발생. 외감육음外感六淫, 내상칠정內傷七情, 음식실당飮食失當, 역려지사疫癘之邪에 감촉되는 것 등은 모두 울鬱을 발생시킴<\/p><p><b>치료 원칙<\/b>: 《소문·육원정기대론》의 “목울달지木鬱達之, 토울탈지土鬱奪之, 화울발지火鬱發之” 원리에 근거하여 달울탕達鬱湯을 창방함<\/p><p><b>대표 처방<\/b>: 달울탕達鬱湯(위장관계·장-뇌축·소화기편 참조)<\/p><h4>⑤운통법運通法<\/h4><p><b>적응증 및 병기<\/b>: 부기불통腑氣不通 및 비기실운脾氣失運으로 인한 복창腹脹, 식욕부진, 식소, 애기噯氣, 대변불창大便不暢, 설태백후舌苔白厚, 맥은 태완怠緩 또는 침체沈滯<\/p><p><b>치료 원칙<\/b>: “부腑는 통하는 것을 순리로 삼고, 비脾는 운행하는 것을 건강으로 삼는다”는 원리에 근거함<\/p><p><b>대표 처방<\/b>: 운통탕運通湯. 조성과 용량은 빈랑10g, 炒견우자6g, 초두구6g, 백두구6g, 사인3g, 복령10g, 炒맥아15g,炒신곡10g, 炒산사15g<\/p><h4>⑥영동법靈動法<\/h4><p><b>적응증 및 병기<\/b>: 과도한 중제重劑를 쓰면 오히려 역효과가 나는 소허소실小虛小實의 내과 잡병(예: 약을 잘 견디지 못하는 위기허약胃氣虛弱 환자, 가벼운 외감 기침 등)<\/p><p><b>치료 원칙<\/b>: 용약의 성질이 가볍고 민첩한 처방과 약물을 사용. 약미가 적고 약량이 적거나 약의 종류는 많더라도 약량이 매우 적은 특징. 대표 고정 방제는 없으며 법에 따라 구성<\/p><h4>⑦섭리법燮理法<\/h4><p><b>적응증 및 병기<\/b>: 병증이 오래되고 병세는 중하지 않으나 음양陰陽, 기혈氣血, 장부臟腑 기능의 조화가 깨진 상태. ‘섭燮’은 화和, 리理, 조調의 뜻으로, 치법인 동시에 임상 전체를 관통하는 지도 사상임. 편성편쇠偏盛偏衰, 실평실비失平失秘 등의 구체적인 병기를 긴밀히 포착하여 조화로움을 도모함<\/p><p><b>치료 원칙<\/b>: 기기氣機와 조화를 이루는 처방을 유연하게 활용함<\/p><p class=\"lbl2\">대표 처방<\/p><p class=\"sub\"><b>산차탕山車湯<\/b>: 만성 설사를 다스리는 일음일양一陰一陽 이치의 경험방. 조성과 용량은 生산사15g, 炒산사15g,生차전자15g, 炒차전자15g. 병세에 따라 강활, 독활 각 3g을 가미하고, 복통에는 통사요방을 합방하며, 내부의 적열積熱에는 갈근금련탕을 합방하고, 비허에는 炒산약, 生산약 각 15g을 가미함<\/p><p class=\"sub\"><b>이가용골탕가미방二加龍骨湯加味方<\/b>: 음양실조陰陽失調로 인한 저열 등을 다스림. 조성과 용량은 制부자, 백작약, 生용골,生모려, 백미白薇, 生감초, 생강, 대추<\/p><h4>⑧고원법固元法<\/h4><p><b>적응증 및 병기<\/b>: 구병久病으로 인해 정기가 내탈內奪하였거나, 정허正虛가 마치 사기가 있는 것처럼 나타나는 증후. 인체의 근본인 원기元氣가 허약해지면 질병에 취약하고 낫기 어려우며, 정허를 외사外邪로 오인하여 잘못 치료하는 오류를 경계함<\/p><p><b>치료 원칙<\/b>: 토사자, 보골지, 음양곽, 산수유, 구기자, 인삼 등의 약물을 활용하여 기원氣元을 북돋고 보양함(단, 원기가 크게 허탈한 위급증에는 별도의 고원만위固元挽危 방약을 써야 함)<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">두통·어지럼·이명을 함께 다루는 처방으로, 국내에서는 단일 증상으로 좁힌 연구가 근거 확보에 유리<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 장레이.내과 잡병 치료 팔법內科雜病治療八法[J].허난중의河南中醫,2007,(2):32-34.<\/li><li class=\"ref\">[2] 양샹훙.국의대사 장레이의 폐계 질환 임상 치료 경험 및 용약 규율 연구國醫大師張磊治療肺系疾病的臨證經驗及用藥規律研究[D].광시중의약대학廣西中醫藥大學,2023.<\/li><li class=\"ref\">[3] 한제.장레이의 표리허실 변증에 따른 내과 잡병 팔법 탐구張磊表裏虛實辨治內科雜病八法探析[J].중국중의기초의학잡지中國中醫基礎醫學雜志,2016,22(4):494.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"곡정초穀精草30g","name":"곡정초穀精草","dose":"30g","base":"곡정초"},{"raw":"청상자靑葙子15g","name":"청상자靑葙子","dose":"15g","base":"청상자"},{"raw":"결명자10g","name":"결명자","dose":"10g","base":"결명자"},{"raw":"박하10g(後下)","name":"박하","dose":"10g(後下)","base":"박하"},{"raw":"국화10g(後下)","name":"국화","dose":"10g(後下)","base":"국화"},{"raw":"酒황금10g","name":"酒황금","dose":"10g","base":"황금"},{"raw":"만형자10g","name":"만형자","dose":"10g","base":"만형자"},{"raw":"선퇴6g","name":"선퇴","dose":"6g","base":"선퇴"},{"raw":"生감초6g","name":"生감초","dose":"6g","base":"감초"}],"notes":[],"핵심 효능":["경청한 약물을 사용하여 상부로 치솟은 풍열風熱의 사기를 가볍게 흩어지게 하고 발산시킴 (경청산풍輕淸散風)","상초에 치솟는 열세와 화사火邪를 직접 제어하고 청열함(청열사화淸熱瀉火)","두면부의 울체된 열세를 식히고 눈을 밝게 하며 두통과 어지럼을 진정시킴(명목지통明目止痛)"],"주치증":["풍열지사風熱之邪로 인해 두부頭部를 손상시켜 발생한 두통, 두혼頭昏(머리가 맑지 않음), 두훈頭暈(어지럼), 이명耳鳴, 안창眼脹, 비색鼻塞, 비류탁체鼻流濁涕 등 제반 질환"],"연구 확장 영역":["풍열형 두면부 질환 및 안이비인후과 질환의 항염증, 진통 작용, 안압 및 혈류 조절, 상초의 열증에 대한 자율신경계 반응 연구"],"R&D 포인트":["곡정초, 청상자, 결명자, 박하 등 경청상부輕淸上浮 약물의 시너지 기전을 통한 두면부 미세순환 개선 및 항염 작용 규명","풍열지사風熱之邪로 인한 두부 질환의 경청법輕淸法 응용 표준화 및 제형 현대화 연구"]},"modules":[{"name":"①경청산풍","hz":"輕淸散風","herbs":["박하","국화","선퇴","만형자"],"role":"가볍고 청열하는 성질로 두면부의 풍열 사기를 발산함"},{"name":"②청열사화","hz":"淸熱瀉火","herbs":["황금","감초"],"role":"상초의 열세를 직접 끄고 화사火邪를 제어함"},{"name":"③명목이수","hz":"明目利水","herbs":["곡정초","청상자","결명자"],"role":"간경肝經의 열을 식히고 눈을 밝게 하며 수기水氣를 소통시킴"}],"rd":[{"tag":"Headache","title":"풍열형 두통·두중감의 증상 개선","html":"<p>두면부 풍열 증상을 다스리는 경청법 처방임<\/p><p>두통 유형(긴장형·편두통 등)을 정의한 환자에서 두통 일수와 강도를 지표로 한 탐색 임상으로 효과 신호를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2007, 내과 잡병 8법), [3](2016, 8법 탐구))<\/p>"},{"tag":"Rhinosinusitis","title":"비색·탁한 콧물의 부비동염 증상","html":"<p>주치에 비색·탁한 콧물이 포함되고 폐계 질환 용약 규율 연구가 있음<\/p><p>만성 부비동염 증상 점수(SNOT-22)를 지표로 비강 질환 적응증 가능성을 검토 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2023, 폐계 질환 용약 규율))<\/p>"},{"tag":"Eye Strain","title":"곡정초·청상자·결명자의 안창·눈 피로 개선","html":"<p>명목 약재군(곡정초·청상자·결명자)의 눈 피로 개선을 확인함<\/p><p>다만 청상자의 동공 산대 등 안압 관련 위험은 기초 자료와 분리해 다루고 녹내장 환자는 대상에서 제외 (근거 유형: 간접 근거 | 근거: R&amp;D 논리 3 「명목이수와 간경열세 해소」, 본문 조성표)<\/p>"},{"tag":"Light-clearing Formula","title":"‘경청법’ 약재의 휘발 성분과 제형","html":"<p>박하·국화를 후하後下하는 처방임<\/p><p>휘발성 지표성분(멘톨 등)이 제조 과정에서 유지되는지 확인하고, 과립화 시 손실을 줄이는 공정 조건을 정해야 함 (근거 유형: 간접 근거 | 근거: 본문 조성표(후하 약재), R&amp;D 논리 4)<\/p>"}],"logic":[{"n":"1","title":"경청산풍輕淸散風과 두면산사頭面散邪","body":"성질이 가볍고 위로 떠오르는 약물로 두면부의 풍열 사기를 밖으로 배출함"},{"n":"2","title":"청열사화淸熱瀉火와 상초열세上焦熱勢 제어","body":"상초의 실열을 직접 끄고 화사火邪를 제어하여 열세를 안정시킴"},{"n":"3","title":"명목이수明目利水와 간경열세肝經熱勢 해소","body":"간경의 열을 식히고 눈을 밝게 하며 두면부의 탁한 기운을 소통시킴"},{"n":"4","title":"내과잡병 8법과 경청법輕淸法적용","body":"두면부 질환의 특성에 맞춘 경청법 응용으로 풍열 사기를 제어함"}],"field":4,"pages":[224,229],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["4-3","곡청탕","穀淸湯","","장레이","張磊","풍열지사風熱之邪로 인해 두부頭部에 발생한 제반 질환을 치료하는 처방","곡정초穀精草30g 청상자靑葙子15g 결명자10g 박하10g(後下) 국화10g(後下) 酒황금10g 만형자10g 선퇴6g 生감초6g","","핵심 효능 경청한 약물을 사용하여 상부로 치솟은 풍열風熱의 사기를 가볍게 흩어지게 하고 발산시킴 (경청산풍輕淸散風) 상초에 치솟는 열세와 화사火邪를 직접 제어하고 청열함(청열사화淸熱瀉火) 두면부의 울체된 열세를 식히고 눈을 밝게 하며 두통과 어지럼을 진정시킴(명목지통明目止痛)","주치증 풍열지사風熱之邪로 인해 두부頭部를 손상시켜 발생한 두통, 두혼頭昏(머리가 맑지 않음), 두훈頭暈(어지럼), 이명耳鳴, 안창眼脹, 비색鼻塞, 비류탁체鼻流濁涕 등 제반 질환","연구 확장 영역 풍열형 두면부 질환 및 안이비인후과 질환의 항염증, 진통 작용, 안압 및 혈류 조절, 상초의 열증에 대한 자율신경계 반응 연구","R&D 포인트 곡정초, 청상자, 결명자, 박하 등 경청상부輕淸上浮 약물의 시너지 기전을 통한 두면부 미세순환 개선 및 항염 작용 규명 풍열지사風熱之邪로 인한 두부 질환의 경청법輕淸法 응용 표준화 및 제형 현대화 연구","①경청산풍 輕淸散風 박하 국화 선퇴 만형자 가볍고 청열하는 성질로 두면부의 풍열 사기를 발산함","②청열사화 淸熱瀉火 황금 감초 상초의 열세를 직접 끄고 화사火邪를 제어함","③명목이수 明目利水 곡정초 청상자 결명자 간경肝經의 열을 식히고 눈을 밝게 하며 수기水氣를 소통시킴","경청산풍輕淸散風과 두면산사頭面散邪 성질이 가볍고 위로 떠오르는 약물로 두면부의 풍열 사기를 밖으로 배출함","청열사화淸熱瀉火와 상초열세上焦熱勢 제어 상초의 실열을 직접 끄고 화사火邪를 제어하여 열세를 안정시킴","명목이수明目利水와 간경열세肝經熱勢 해소 간경의 열을 식히고 눈을 밝게 하며 두면부의 탁한 기운을 소통시킴","내과잡병 8법과 경청법輕淸法적용 두면부 질환의 특성에 맞춘 경청법 응용으로 풍열 사기를 제어함","Headache 풍열형 두통·두중감의 증상 개선 두면부 풍열 증상을 다스리는 경청법 처방임 두통 유형(긴장형·편두통 등)을 정의한 환자에서 두통 일수와 강도를 지표로 한 탐색 임상으로 효과 신호를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2007, 내과 잡병 8법), [3](2016, 8법 탐구))","Rhinosinusitis 비색·탁한 콧물의 부비동염 증상 주치에 비색·탁한 콧물이 포함되고 폐계 질환 용약 규율 연구가 있음 만성 부비동염 증상 점수(SNOT-22)를 지표로 비강 질환 적응증 가능성을 검토 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2023, 폐계 질환 용약 규율))","Eye Strain 곡정초·청상자·결명자의 안창·눈 피로 개선 명목 약재군(곡정초·청상자·결명자)의 눈 피로 개선을 확인함 다만 청상자의 동공 산대 등 안압 관련 위험은 기초 자료와 분리해 다루고 녹내장 환자는 대상에서 제외 (근거 유형: 간접 근거 | 근거: R&D 논리 3 「명목이수와 간경열세 해소」, 본문 조성표)","Light-clearing Formula ‘경청법’ 약재의 휘발 성분과 제형 박하·국화를 후하後下하는 처방임 휘발성 지표성분(멘톨 등)이 제조 과정에서 유지되는지 확인하고, 과립화 시 손실을 줄이는 공정 조건을 정해야 함 (근거 유형: 간접 근거 | 근거: 본문 조성표(후하 약재), R&D 논리 4)"],"ss":{"composition":"그림 4-3 곡청탕穀淸湯의 모듈 구성 ①경청산풍輕淸散風 모듈 — 가볍고 청열하는 성질로 두면부의 풍열 사기를 발산함 박하, 국화, 선퇴, 만형자 : 박하는 신량산풍辛涼散風하고 청리두목淸利頭目함. 국화는 소풍청열疏風淸熱하여 명목明目함. 선퇴는 투진선열透疹宣熱하고 상행上行하여 이인명목利咽明目함. 만형자는 청리두목淸利頭目하고 거풍산사祛風散邪함. 이들은 성질이 가볍고 위로 떠오르며 서늘하게 흩어주는 작용으로 두면부의 풍열을 밖으로 배출함 ②청열사화淸熱瀉火 모듈 — 상초의 열세를 직접 끄고 화사火邪를 제어함 황금, 감초 : 황금은 청열조습淸熱燥濕하고 사화해독瀉火解毒하여 상초의 실열을 내림. 감초는 청열해독하며 제약을 조화시킴. 이들은 처방 전체의 열세를 제어하는 청열사화의 축을 담당함 ③명목이수明目利水 모듈 — 간경肝經의 열을 식히고 눈을 밝게 하며 수기水氣를 소통시킴 곡정초, 청상자, 결명자 : 곡정초는 소풍청열疏風淸熱하고 명목퇴예明目退翳함. 청상자는 청간사화淸肝瀉火하고 명목明目함. 결명자는 청간명목淸肝明目하고 윤장통변潤腸通便함. 이들은 간경의 열을 식히고 눈을 밝게 하며 두면부의 탁한 기운과 수기를 소통시키는 핵심 효능을 발휘함","master":"장레이는 외감병을 제외한 내과 질환인 ‘잡병雜病’이 표리表裏와 한열寒熱, 허실虛實, 음양陰陽이 서로 뒤섞여 복잡하고 치료가 까다롭다는 점에 주목하고, 이에 오랜 임상 경험을 바탕으로 내과 잡병을 다스리는 ‘치료 8법’과 각 법에 해당하는 구체적인 처방들을 정립함 ①경청법輕淸法 적응증 및 병기 : 주로 풍열지사風熱之邪가 머리를 상하게 하여 발생한 두통, 두혼頭昏(머리가 맑지 않음), 두훈頭暈(어지럼), 이명, 안창眼脹, 코막힘, 비류탁체鼻流濁涕 등의 질환. 머리는 “제양지회諸陽之會”이자 “청양지부淸陽之府”이며, 풍風과 열熱은 양사陽邪로서 성질이 가볍고 위로 떠올라 머리를 쉽게 침범함. 《소문·태음양명론편》의 “양수풍기陽受風氣……상어풍자傷於風者, 상선수지上先受之”에 근거함 치료 원칙 : 성질이 가볍고 위로 떠오르며 서늘하게 흩어주는 약물을 사용하여 양증陽證의 특성에 맞게 사기를 제거함. 특히 봄철에 발생하는 두부 질환에 효과가 좋다고 봄 대표 처방 : 곡청탕穀淸湯 가감 활용 : 안구의 창만脹滿에는 하고초를 가미하고, 두혼頭昏(머리가 맑지 않음)이 심할 때는 하엽을 가미하며, 두통이 심할 때는 천궁을 가미하고, 두훈頭暈(어지럼)이 심할 때는 구등을 가미하며, 코막힘이 심할 때는 창이자, 신이를 가미하고, 변비가 심할 때는 결명자를 중용하며, 음허가 심할 때는 현삼을 가미하고, 양항陽亢에는 生석결명 등을 가미함 ②척탁법滌濁法 적응증 및 병기 : 탁사濁邪가 인체 내부에 정체되어 탁음이 조체阻滯하는 제반 증상. 《소문·탕액료례론》의 “去菀陳莝…疏滌五臟”의 취지에 근거함. 잡병 중에서 탁사조체濁邪阻滯 증상이 매우 흔하며, 병의 핵심은 ‘탁濁’이고 처방의 핵심은 ‘척滌’에 있음 치료 원칙 : 탁사를 소통시키되 정기를 해치지 않도록 주의하며 서서히 도모함. 병증의 부위에 따라 4가지 방제를 나누어 활용함 대표 처방 탁사조폐폐실청숙방濁邪阻肺肺失淸肅方 : 담, 습, 열이 폐를 막아 기침, 천식, 가슴 답답함, 누런 가래가 끈끈해 잘 안 나오는 증상 및 관련 폐암에 가감 활용. 조성과 용량은 노근30g, 동과인30g, 生의이인30g, 도인10g, 길경15g, 황금10g, 해부석30g, 炒정력자15g, 炒자소자3g, 마황3g, 生감초6g, 대추5개 탁사중조비실기운방濁邪中阻脾失其運方 : 기름진 음식 과다로 비만, 곤권困倦, 설태황니, 고지혈증, 당뇨 및 고혈압 성향이 있는 경우. 조성과 용량은 노근30g, 동과인30g, 生의이인30g, 도인10g, 制반하10g, 귤피10g, 복령12g, 택사10g,炒창출15g, 炒백출10g, 炒신곡10g, 치자10g, 生감초6g 간열비습탁사적착방肝熱脾濕濁邪積着方 : 만성 간질환 환자의 우측 옆구리 불편감, 복통, 소변 황색, 대변 이상, 간기능 이상, 비장 비대 등. 조성과 용량은 노근30g, 동과인30g, 生의이인30g, 도인10g, 별갑30g, 울금15g, 醋연호색15g, 패장초30g, 生맥아20g, 炮천산갑10g, 大패모10g, 하고초15g, 인진30g, 대황6g, 生감초6g 탁재하초방광실리방濁在下焦膀胱失利方 : 탁사가 하초에 머물러 소변이 탁하고 붉으며 잘 안 나오고, 아랫배나 회음부가 창통脹痛할 때. 조성과 용량은 백모근30g, 동과인30g, 生의이인30g, 도인10g, 연교10g, 적소두30g, 활석30g,懷우슬10g, 지룡10g, 호박琥珀3g(충복), 동규자冬葵子15g, 복령10g, 계지3g, 生감초6g ③소리법疏利法 적응증 및 병기 : 수습이 운화를 잃어 전신이 울창鬱脹한데 종腫인 듯하나 종이 아닌 경락인어經絡湮淤의 증후. 병정이 길고 검사상 이상이 없고 소변량은 정상이며 이뇨제를 복용하면 경감되고 약을 중지하면 다시 반복됨 치료 원칙 : 상황에 따라 5가지 기본방을 체계화하여 유연하게 활용함 대표 처방 소보상겸방疏補相兼方 : 비허실운脾虛失運으로 수습이 정체되어 전신 울창鬱脹이 발생한 경우. 조성과 용량은 炒창출10g,炒백출10g, 복령10g, 저령10g, 청피6g, 진피6g, 炒지각6g, 炒지실6g, 택사10g, 목과30g, 生의이인30g, 적소두30g, 활석15g, 生감초3g 행기통락방行氣通絡方 : 경락기체經絡氣滯로 인해 전신 울창鬱脹이 발생하고 복창腹脹과 요소尿少는 없는 경우. 조성과 용량은 목과30g, 위령선10g, 백작약10g, 계지10g, 인동등30g, 사과락30g, 통초6g, 制향부자10g, 生의이인30g, 강활3g, 독활3g, 방풍3g, 生감초3g 화담통락방化痰通絡方 : 담, 습, 열, 어혈이 조체하여 수종 양상이 있는 경우. 조성과 용량은 淸반하10g, 진피10g, 복령30g,炒지실10g, 죽여10g, 택사15g, 사과락30g, 인동등30g, 生감초6g 소간건비리습통락방疏肝健脾利濕通絡方 : 간울비허肝鬱脾虛, 기기조체氣機阻滯, 수습실운水濕失運의 울창증鬱脹證으로 인한 안면과 하지 부종, 월경 전 유방 팽만, 급조이노急躁易怒 등. 조성과 용량은 시호10g, 백작약10g, 당귀10g,炒백출10g, 복령30g, 박하3g(後下), 制향부자15g, 목과30g, 生의이인30g, 生감초3g 화어통락방化瘀通絡方 : 수습정체로 피부에 범람하고 담, 어혈을 겸하여 경락이 불통할 때. 조성과 용량은 酒상지30g, 사과락30g, 강황6g, 목과30g, 生의이인30g, 통초6g, 制남성10g, 귤락10g, 계혈등30g, 당귀10g ④달울법達鬱法 적응증 및 병기 : 울증에 사용하며, 울결비체鬱結痞滯하여 응결되고 소통되지 않아서 발생. 외감육음外感六淫, 내상칠정內傷七情, 음식실당飮食失當, 역려지사疫癘之邪에 감촉되는 것 등은 모두 울鬱을 발생시킴 치료 원칙 : 《소문·육원정기대론》의 “목울달지木鬱達之, 토울탈지土鬱奪之, 화울발지火鬱發之” 원리에 근거하여 달울탕達鬱湯을 창방함 대표 처방 : 달울탕達鬱湯(위장관계·장-뇌축·소화기편 참조) ⑤운통법運通法 적응증 및 병기 : 부기불통腑氣不通 및 비기실운脾氣失運으로 인한 복창腹脹, 식욕부진, 식소, 애기噯氣, 대변불창大便不暢, 설태백후舌苔白厚, 맥은 태완怠緩 또는 침체沈滯 치료 원칙 : “부腑는 통하는 것을 순리로 삼고, 비脾는 운행하는 것을 건강으로 삼는다”는 원리에 근거함 대표 처방 : 운통탕運通湯. 조성과 용량은 빈랑10g, 炒견우자6g, 초두구6g, 백두구6g, 사인3g, 복령10g, 炒맥아15g,炒신곡10g, 炒산사15g ⑥영동법靈動法 적응증 및 병기 : 과도한 중제重劑를 쓰면 오히려 역효과가 나는 소허소실小虛小實의 내과 잡병(예: 약을 잘 견디지 못하는 위기허약胃氣虛弱 환자, 가벼운 외감 기침 등) 치료 원칙 : 용약의 성질이 가볍고 민첩한 처방과 약물을 사용. 약미가 적고 약량이 적거나 약의 종류는 많더라도 약량이 매우 적은 특징. 대표 고정 방제는 없으며 법에 따라 구성 ⑦섭리법燮理法 적응증 및 병기 : 병증이 오래되고 병세는 중하지 않으나 음양陰陽, 기혈氣血, 장부臟腑 기능의 조화가 깨진 상태. ‘섭燮’은 화和, 리理, 조調의 뜻으로, 치법인 동시에 임상 전체를 관통하는 지도 사상임. 편성편쇠偏盛偏衰, 실평실비失平失秘 등의 구체적인 병기를 긴밀히 포착하여 조화로움을 도모함 치료 원칙 : 기기氣機와 조화를 이루는 처방을 유연하게 활용함 대표 처방 산차탕山車湯 : 만성 설사를 다스리는 일음일양一陰一陽 이치의 경험방. 조성과 용량은 生산사15g, 炒산사15g,生차전자15g, 炒차전자15g. 병세에 따라 강활, 독활 각 3g을 가미하고, 복통에는 통사요방을 합방하며, 내부의 적열積熱에는 갈근금련탕을 합방하고, 비허에는 炒산약, 生산약 각 15g을 가미함 이가용골탕가미방二加龍骨湯加味方 : 음양실조陰陽失調로 인한 저열 등을 다스림. 조성과 용량은 制부자, 백작약, 生용골,生모려, 백미白薇, 生감초, 생강, 대추 ⑧고원법固元法 적응증 및 병기 : 구병久病으로 인해 정기가 내탈內奪하였거나, 정허正虛가 마치 사기가 있는 것처럼 나타나는 증후. 인체의 근본인 원기元氣가 허약해지면 질병에 취약하고 낫기 어려우며, 정허를 외사外邪로 오인하여 잘못 치료하는 오류를 경계함 치료 원칙 : 토사자, 보골지, 음양곽, 산수유, 구기자, 인삼 등의 약물을 활용하여 기원氣元을 북돋고 보양함(단, 원기가 크게 허탈한 위급증에는 별도의 고원만위固元挽危 방약을 써야 함)","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 두통·어지럼·이명을 함께 다루는 처방으로, 국내에서는 단일 증상으로 좁힌 연구가 근거 확보에 유리 참고문헌 [1] 장레이.내과 잡병 치료 팔법內科雜病治療八法[J].허난중의河南中醫,2007,(2):32-34. [2] 양샹훙.국의대사 장레이의 폐계 질환 임상 치료 경험 및 용약 규율 연구國醫大師張磊治療肺系疾病的臨證經驗及用藥規律研究[D].광시중의약대학廣西中醫藥大學,2023. [3] 한제.장레이의 표리허실 변증에 따른 내과 잡병 팔법 탐구張磊表裏虛實辨治內科雜病八法探析[J].중국중의기초의학잡지中國中醫基礎醫學雜志,2016,22(4):494."}},{"id":"4-4","ko":"전간촉효방","hz":"癲癎促效方","alias":"","master_ko":"위잉아오","master_hz":"餘瀛鼇","tagline":"잠진지간潛鎭止癎, 화담통락化痰通絡으로 난치성 전간을 치료하는 통치방","meta":{"주요 적응증":"난치성 뇌전증","확인된 연구자료 유형":"경험 보고","제형·제품화":"제제화 특허(취하)"},"page":230,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-4 전간촉효방癲癎促效方의 모듈 구성<\/p><h4>①잠진안신潛鎭安神 모듈 — 무겁고 가라앉는 성질로 불안정한 심신을 누르고 잠재움<\/h4><p><b>모려, 용치<\/b>: 모려는 평간잠양平肝潛陽하고 중진녕신重鎭寧神함. 용치는 진경안신鎭驚安神하고 영심잠양寧心潛陽함. 이들은 중진지제의 특성으로 위로 치솟는 기와 놀란 마음을 가라앉힘<\/p><h4>②화담개규化痰開竅 모듈 — 완담을 제거하고 기를 내려 심규와 뇌락을 뚫어줌<\/h4><p><b>백반, 울금, 담남성, 반하, 행인<\/b>: 백반은 화완담化頑痰하고 화를 누그러뜨리며, 울금은 개울산결開鬱散結함. 백반과 울금은 백금환白金丸의 구성약물이며, 최적의 배합 비율은 4:1이고, 특히 백반은 반드시 선전先煎하여 화기를 빼야 함. 담남성은 청화화담淸火化痰하고 진경, 항경련 작용을 함. 반하와 행인은 조습화담燥濕化痰 및 강기화담降氣化痰하여 뇌락의 막힌 탁사濁邪를 제거함<\/p><h4>③활혈통락活血通絡 모듈 — 혈액 순환을 돕고 뇌락의 어혈을 제거함<\/h4><p><b>단삼, 계혈등, 도인<\/b>: 단삼은 활혈거어活血祛瘀, 안신安神하고, 계혈등은 통경활락通經活絡하며, 도인은 행기파어行氣破瘀함. 이들은 전간의 주요 병리 요소인 ‘어혈’을 제거하여 뇌락의 소통을 돕고 발작을 방지함<\/p>"},{"k":"master","t":"위잉아오의 난치성 전간 치료","html":"<h4>①병인병기 인식<\/h4><p>뇌, 간, 비의 실조로 인해 발생하며, 비허로 인한 담 생성과 간기울결肝氣鬱結로 인한 양의 상항上亢이 결합하여, 담탁이 상충하여 뇌의 규방을 막고 뇌락이 어혈로 막혀 정신을 주관하는 뇌신이 기능을 잃어 발생함<\/p><p>병성은 실증이 허증보다 많고 열증이 한증보다 많으며, 병리 요소는 주로 ‘담痰’과 ‘어瘀’임<\/p><h4>②치료원칙과 치법<\/h4><p>임상에서 완급緩急이나 표본標本을 따지지 않고 전반적으로 간비肝脾를 조리하는 것을 위주로 함<\/p><p>사실보허瀉實補虛, 조화음양調和陰陽 위주로 치료함. 사법을 보법보다 더 비중 있게 두고, 음양을 조화시키되 음을 자양하는 것보다 양을 내리는 것에 더 치중<\/p><p>주된 치법은 잠진지간潛鎭止癎, 화담통락化痰通絡<\/p><p>원발성 전간은 개규開竅, 안신安神, 영심寧心에 주목하고, 속발성 전간은 원발 병인 치료를 병행함<\/p><h4>③전간촉효방의 임상 가감<\/h4><p><b>탁독濁毒 배출 필요 시<\/b>: 대황 3~6g 가미<\/p><p><b>뇌 외상이 원인일 때<\/b>: 적작약12g, 백작약12g, 토별충6g, 生포황10g, 홍화10g, 천궁15g, 당귀12g을 가미하여 활락산어活絡散瘀<\/p><p><b>추휵抽搐이 심할 때<\/b>: 구등10g, 강잠12g, 지룡10g을 가미하여 지경止痙<\/p><p>담탁痰濁이 심하여 두목불청頭目不淸, 곤권산중困倦酸重, 흉민胸悶, 구오嘔惡일 때: 川패모6g, 浙패모6g, 죽여10g, 석창포10g, 원지10g, 진피6g을 가미하여 강기화담개규降氣化痰開竅를 강화<\/p><p><b>심신心神 손상으로 심계불안心悸不安, 야매불녕夜寐不寧일 때<\/b>: 태자삼10g, 맥문동10g, 오미자10g, 炒산조인20g을 가미하여 익기양음녕신益氣養陰寧神<\/p><p><b>발작 후 또는 평시에 어지럼, 두통을 동반할 때<\/b>: 진교秦艽10g, 백지10g, 천궁15g을 가미<\/p><p><b>발작 전 환청, 환시<\/b>: 진주모30g(先煎)을 가미하여 잠진안신潛鎭安神<\/p><h4>④제형 및 복용법 응용<\/h4><p><b>급성기<\/b>: 발작이 빈번하므로 탕제로 제어하되, 호박분 1~3g을 나누어 충복하면 효능을 증강함<\/p><p>간헐기에는 환제나 산제로 바꿔 복용하며, 증상이 안정된 후에도 3-6개월간 꾸준히 복용함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품은 확인되지 않음. 대사 명의로 뇌전증 치료 중약 정제(모려·용치·백반·울금·담남성·도인 등)와 축약 조성물 (5종) 특허를 출원해 이 처방의 제제화를 시도했으나, 두 출원 모두 2023년 취하 간주됨[2][3]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">제제화 특허 출원까지 진행되었으므로, 국내에서는 항경련제 병용 시 발작 빈도 변화와 상호작용 자료를 우선 확보해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 리훙타오,리저,펑레이,등.위잉아오의 난치성 간질 치료 경험餘瀛鼇治療難治性癲癇經驗[J].중의잡지中醫雜志,2015,56(1):14-16.<\/li><li class=\"ref\">[2] 위잉아오余瀛鼇.뇌전증 치료에 활용하는 중약 편제一種用於治療癲癇的中藥片劑:CN110946964A[P/OL].<a href=\"https://patents.google.com/patent/CN110946964A.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN110946964A.<\/a><\/li><li class=\"ref\">[3] 위잉아오余瀛鼇.뇌전증 치료에 활용하는 중약 조성물一種用於治療癲癇的中藥組合物:CN110917314A[P/OL].<a href=\"https://patents.google.com/patent/CN110917314A.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN110917314A.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"모려30g(先煎)","name":"모려","dose":"30g(先煎)","base":"모려"},{"raw":"용치24g(先煎)","name":"용치","dose":"24g(先煎)","base":"용치"},{"raw":"백반2.5g(先煎)","name":"백반","dose":"2.5g(先煎)","base":"백반"},{"raw":"울금10g","name":"울금","dose":"10g","base":"울금"},{"raw":"苦행인10g","name":"苦행인","dose":"10g","base":"행인"},{"raw":"도인10g","name":"도인","dose":"10g","base":"도인"},{"raw":"담남성6g","name":"담남성","dose":"6g","base":"담남성"},{"raw":"法반하6g","name":"法반하","dose":"6g","base":"반하"},{"raw":"단삼15g","name":"단삼","dose":"15g","base":"단삼"},{"raw":"계혈등15g","name":"계혈등","dose":"15g","base":"계혈등"}],"notes":[],"핵심 효능":["중진지제重鎭之劑를 사용하여 떠오르는 간양을 누르고 놀란 마음을 진정시키며 정신을 안정시킴 (잠진안신潛鎭安神)","완담頑痰을 제거하고 기를 소통시켜 막힌 심규와 뇌락을 열어줌(화담개규化痰開竅)","어혈을 제거하고 경락을 소통시켜 발작을 억제하고 정기를 보존함(활혈통락活血通絡)"],"주치증":["난치성 전간癲癎"],"연구 확장 영역":["난치성 뇌전증 및 경련성 질환의 항경련·진정 작용, 중추신경계 신경보호 효과, 뇌혈류 개선 및 항염증·항산화 기전 연구"],"R&D 포인트":["백금환白金丸 가미방의 유효성분(백반과 울금 배합 비율 등)에 따른 항경련 및 신경세포 보호 기전 규명","전간 치료를 위한 잠진화담법潛鎭化痰法 응용 표준화 및 제형 현대화(탕제, 환산제 전환) 연구"]},"modules":[{"name":"①잠진안신","hz":"潛鎭安神","herbs":["모려","용치"],"role":"무겁고 가라앉는 성질로 불안정한 심신을 누르고 잠재움"},{"name":"②화담개규","hz":"化痰開竅","herbs":["백반","울금","담남성","반하","행인"],"role":"완담을 제거하고 기를 내려 심규와 뇌락을 뚫어줌"},{"name":"③활혈통락","hz":"活血通絡","herbs":["단삼","계혈등","도인"],"role":"혈액 순환을 돕고 뇌락의 어혈을 제거함"}],"rd":[{"tag":"Drug-resistant Epilepsy","title":"난치성 뇌전증의 항경련제 병용 효과","html":"<p>난치성 뇌전증은 적절히 선택·투여한 항발작약 2가지 요법에 실패한 경우로 정의됨 (국제뇌전증퇴치연맹 기준)<\/p><p>이 기준을 충족하고 기존 항발작약을 임의로 줄이지 않은 환자에서 월간 발작 빈도 50% 감소율을 지표로 한 후향적 증례 분석부터 시작 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2015, 난치성 뇌전증(간질) 치료 경험))<\/p>"},{"tag":"Alum Safety","title":"백반(명반) 장기 복용의 알루미늄 노출","html":"<p>백반白礬은 알루미늄 화합물이어서 장기 복용 시 축적 우려가 있음<\/p><p>혈중 알루미늄 농도 모니터링과 백반 제외 조성의 효과 비교가 필요하며, 백반의 장기 경구 사용 가능 여부가 확인되기 전에는 임상 제언을 증례 분석 수준으로 제한 (근거 유형: 간접 근거 | 근거: 본문 조성표)<\/p>"},{"tag":"Phlegm Module","title":"담남성·반하의 항경련 기여","html":"<p>화담 약재(담남성·반하·행인)의 항경련 효과를 펜틸렌테트라졸 유도 발작 모델에서 확인함<\/p><p><b>이로써 ‘완담 제거’를 발작 역치 상승으로 구체화 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 2 「화담개규와 완담 제거」)<\/p>"},{"tag":"Drug Interaction","title":"항경련제와의 약물 상호작용","html":"<p>대부분의 환자가 항경련제를 복용 중임<\/p><p>혈중 항경련제 농도 변화(간 대사효소 영향)를 확인하는 상호작용 연구가 효능 연구보다 먼저 필요 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4 「잠진화담법과 난치성 전간 제어」)<\/p>"}],"logic":[{"n":"1","title":"잠진안신潛鎭安神과 간양肝陽조절","body":"무겁고 가라앉는 성질로 불안정한 심신을 누르고 잠재움"},{"n":"2","title":"화담개규化痰開竅와 완담頑痰제거","body":"완담을 제거하고 기를 내려 심규와 뇌락을 뚫어줌"},{"n":"3","title":"활혈통락活血通絡과 어혈 제거","body":"혈액 순환을 돕고 뇌락의 어혈을 제거하여 발작을 억제함"},{"n":"4","title":"잠진화담법潛鎭化痰法과 난치성 전간癲癎 제어","body":"간비조리肝脾調理와 사실보허瀉實補虛 원리로 頑痰하고 화를 누그러뜨리며, 울금은 개울산결開鬱散結함. 백반과 울금은 백금환白金丸의 구성약물이며, 최적의 배합 비율은 4:1이고, 특히 백반은 반드시 선전先煎하여 화기를 빼야 함. 담남성은 청화화담淸火化痰하고 진경, 항경련 작용을 함. 반하와 행인은 조습화담燥濕化痰 및 강기화담降氣化痰하여 뇌락의 막힌 탁사濁邪를 제거함 ③활혈통락活血通絡 모듈 — 혈액 순환을 돕고 뇌락의 어혈을 제거함 단삼, 계혈등, 도인 : 단삼은 활혈거어活血祛瘀, 안신安神하고, 계혈등은 통경활락通經活絡하며, 도인은 행기파어行氣破瘀함. 이들은 전간의 주요 병리 요소인 ‘어혈’을 제거하여 뇌락의 소통을 돕고 발작을 방지함","master":"①병인병기 인식 뇌, 간, 비의 실조로 인해 발생하며, 비허로 인한 담 생성과 간기울결肝氣鬱結로 인한 양의 상항上亢이 결합하여, 담탁이 상충하여 뇌의 규방을 막고 뇌락이 어혈로 막혀 정신을 주관하는 뇌신이 기능을 잃어 발생함 병성은 실증이 허증보다 많고 열증이 한증보다 많으며, 병리 요소는 주로 ‘담痰’과 ‘어瘀’임 ②치료원칙과 치법 임상에서 완급緩急이나 표본標本을 따지지 않고 전반적으로 간비肝脾를 조리하는 것을 위주로 함 사실보허瀉實補虛, 조화음양調和陰陽 위주로 치료함. 사법을 보법보다 더 비중 있게 두고, 음양을 조화시키되 음을 자양하는 것보다 양을 내리는 것에 더 치중 주된 치법은 잠진지간潛鎭止癎, 화담통락化痰通絡 원발성 전간은 개규開竅, 안신安神, 영심寧心에 주목하고, 속발성 전간은 원발 병인 치료를 병행함 ③전간촉효방의 임상 가감 탁독濁毒 배출 필요 시 : 대황 3~6g 가미 뇌 외상이 원인일 때 : 적작약12g, 백작약12g, 토별충6g, 生포황10g, 홍화10g, 천궁15g, 당귀12g을 가미하여 활락산어活絡散瘀 추휵抽搐이 심할 때 : 구등10g, 강잠12g, 지룡10g을 가미하여 지경止痙 담탁痰濁이 심하여 두목불청頭目不淸, 곤권산중困倦酸重, 흉민胸悶, 구오嘔惡일 때: 川패모6g, 浙패모6g, 죽여10g, 석창포10g, 원지10g, 진피6g을 가미하여 강기화담개규降氣化痰開竅를 강화 심신心神 손상으로 심계불안心悸不安, 야매불녕夜寐不寧일 때 : 태자삼10g, 맥문동10g, 오미자10g, 炒산조인20g을 가미하여 익기양음녕신益氣養陰寧神 발작 후 또는 평시에 어지럼, 두통을 동반할 때 : 진교秦艽10g, 백지10g, 천궁15g을 가미 발작 전 환청, 환시 : 진주모30g(先煎)을 가미하여 잠진안신潛鎭安神 ④제형 및 복용법 응용 급성기 : 발작이 빈번하므로 탕제로 제어하되, 호박분 1~3g을 나누어 충복하면 효능을 증강함 간헐기에는 환제나 산제로 바꿔 복용하며, 증상이 안정된 후에도 3-6개월간 꾸준히 복용함","rd":"","china":"중국 제품화 현황 허가 제품은 확인되지 않음. 대사 명의로 뇌전증 치료 중약 정제(모려·용치·백반·울금·담남성·도인 등)와 축약 조성물 (5종) 특허를 출원해 이 처방의 제제화를 시도했으나, 두 출원 모두 2023년 취하 간주됨[2][3] 시사점 제제화 특허 출원까지 진행되었으므로, 국내에서는 항경련제 병용 시 발작 빈도 변화와 상호작용 자료를 우선 확보해야 함 참고문헌 [1] 리훙타오,리저,펑레이,등.위잉아오의 난치성 간질 치료 경험餘瀛鼇治療難治性癲癇經驗[J].중의잡지中醫雜志,2015,56(1):14-16. [2] 위잉아오余瀛鼇.뇌전증 치료에 활용하는 중약 편제一種用於治療癲癇的中藥片劑:CN110946964A[P/OL]. https://patents.google.com/patent/CN110946964A. [3] 위잉아오余瀛鼇.뇌전증 치료에 활용하는 중약 조성물一種用於治療癲癇的中藥組合物:CN110917314A[P/OL]. https://patents.google.com/patent/CN110917314A."}},{"id":"4-5","ko":"활혈안신탕","hz":"活血安神湯","alias":"","master_ko":"류쭈이","master_hz":"劉祖貽","tagline":"익기활혈益氣活血과 중진안신重鎭安神으로 어조뇌락증瘀阻腦絡證을 치료하는 처방","meta":{"주요 적응증":"혈관성 두통, 뇌손상 후 증후군","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":234,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-5 활혈안신탕活血安神湯의 모듈 구성<\/p><h4>①익기활혈益氣活血 모듈 — 기의 추동력으로 혈행을 돕고 뇌락의 어혈을 제거함<\/h4><p><b>황기, 단삼, 포황, 연호색, 천궁<\/b>: 황기는 비·폐경으로 들어가 익기益氣하여 기혈의 운행을 돕고 활혈작용을 증강함. 단삼, 포황, 연호색, 천궁은 활혈거어活血祛瘀하여 뇌락을 소통시킴<\/p><h4>②중진안신重鎭安神 모듈 — 무겁고 가라앉는 성질로 위로 치솟는 기세와 불안정한 뇌신을 묵직하게 누름<\/h4><p><b>용골, 모려, 전갈<\/b>: 용골과 모려는 중진안신重鎭安神하여 뇌신을 가라앉힘. 전갈은 평간식풍平肝息風하여 통증을 멈추고 내풍을 진정시킴<\/p><h4>③양심안신養心安神 모듈 — 심신을 영양하고 마음을 편안하게 함<\/h4><p><b>산조인, 수오등<\/b>: 산조인과 수오등은 양심안신養心安神하여 허손된 심신을 보양하고 불안과 불안정을 완화함<\/p><h4>④조화제약調和諸藥 모듈 — 제반 약물의 약성을 조화롭게 이끔<\/h4><p><b>감초<\/b>: 감초는 제반 약물을 조화롭게 융화시킴<\/p>"},{"k":"master","t":"류쭈이의 어조뇌락증 치료","html":"<h4>①병인병기 인식<\/h4><p>뇌진탕, 뇌손상 후 증후군, 뇌동맥경화증, 혈관성 두통 등은 중의학의 ‘두통’, ‘두풍頭風’ 범주에 속하며 일정 단계에서 공통적으로 어조뇌락증瘀阻腦絡證을 나타냄<\/p><h4>②치료원칙과 치법<\/h4><p><b>이병동치異病同治 원칙<\/b>: 서로 다른 질병이라도 병기가 같으면 활혈통락을 위주로 동일하게 치료함<\/p><p class=\"lbl2\">3대 치료 방법<\/p><p class=\"sub\"><b>기혈동치氣血同治<\/b>: 대량의 활혈통락약에 황기를 배합하여 기분과 혈분을 함께 다스림<\/p><p class=\"sub\"><b>형신동치形神同治<\/b>: 뇌는 원신지부元神之府이므로, 뇌락의 어혈 치료(형形)와 산조인, 수오등, 용골, 모려를 통한 안신(신神) 을 병행하여 마음이 편안해지면 뇌락의 어혈도 쉽게 풀리도록 유도함<\/p><p class=\"sub\"><b>심간동치心肝同治<\/b>: 뇌신 불안으로 동반되는 간풍을 제어하기 위해 전갈을 배합하여 심과 간을 함께 다스림<\/p><h4>③활혈안신탕의 임상 가감<\/h4><p class=\"lbl2\">질환별 맞춤 가감<\/p><p class=\"sub\"><b>뇌진탕 초기(조열구고潮熱口苦, 설질암홍舌質黯紅)<\/b>: 황기를 빼고, 생지황, 목단피, 지골피, 백작약을 가미<\/p><p class=\"sub\"><b>뇌동맥경화증<\/b>: 연호색을 빼고, 익모초, 산사, 구등을 가미<\/p><p class=\"sub\"><b>혈관성 두통<\/b>: 황기를 빼고, 백작약, 구등, 노봉방을 가미<\/p><p class=\"sub\"><b>혈관성 치매<\/b>: 석창포, 울금, 원지를 가미<\/p><p class=\"sub\"><b>파킨슨병<\/b>: 귀판, 별갑을 가미<\/p><p class=\"lbl2\">겸증兼證에 따른 가감<\/p><p class=\"sub\"><b>간풍상요肝風上擾를 겸할 때<\/b>: 황기를 빼고, 백작약, 구등, 하고초, 석결명을 가미<\/p><p class=\"sub\"><b>간신음허肝腎陰虛를 겸할 때<\/b>: 황기를 빼고, 구기자, 여정자, 생지황, 맥문동을 가미<\/p><p class=\"sub\"><b>신양부족腎陽不足을 겸할 때<\/b>: 음양곽, 파극천, 녹각상鹿角霜을 가미<\/p><p class=\"sub\"><b>담습상범痰濕上泛을 겸할 때<\/b>: 석창포, 法반하, 진피, 택사를 가미<\/p><p class=\"lbl2\">증상별 대증對症 가감<\/p><p class=\"sub\"><b>두통 부위별<\/b>: 전두부는 백지, 신이를 가미하고, 두정부는 만형자를 가미하며, 양측부는 천궁의 용량을 증량하고, 침부枕部는 갈근을 가미<\/p><p class=\"sub\"><b>현훈오심眩暈惡心<\/b>: 法반하, 진피, 백출, 택사를 가미<\/p><p class=\"sub\"><b>납소納少<\/b>: 맥아, 계내금, 산사를 가미<\/p><p class=\"sub\"><b>완복작창脘腹作脹<\/b>: 불수, 대복피를 가미<\/p><p class=\"sub\"><b>변당便溏<\/b>: 의이인, 복령을 가미<\/p><p class=\"sub\"><b>대변건결大便乾結<\/b>: 여정자, 결명자를 가미<\/p><p class=\"sub\"><b>흉민흉통胸悶胸痛<\/b>: 강향降香, 괄루각瓜蔞殼을 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">뇌진탕 후 증후군은 표준 치료가 부족한 영역으로, 공개자료상 제품·특허가 확인되지 않아 국내 개발을 검토할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 류쭈이,저우선,부셴춘.활혈안신탕의 어조뇌락증 235례 치료 총결活血安神湯治療瘀阻腦絡證235例總結[J].후난중의잡지湖南中醫雜志,1996,(1):2-3+7.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"황기30g","name":"황기","dose":"30g","base":"황기"},{"raw":"단삼15g","name":"단삼","dose":"15g","base":"단삼"},{"raw":"生포황15g","name":"生포황","dose":"15g","base":"포황"},{"raw":"연호색15g","name":"연호색","dose":"15g","base":"연호색"},{"raw":"천궁10g","name":"천궁","dose":"10g","base":"천궁"},{"raw":"산조인15g","name":"산조인","dose":"15g","base":"산조인"},{"raw":"生용골( 先煎) 30g","name":"生용골( 先煎)","dose":"30g","base":"용골"},{"raw":"生모려( 先煎) 30g","name":"生모려( 先煎)","dose":"30g","base":"모려"},{"raw":"수오등30g","name":"수오등","dose":"30g","base":"수오등"},{"raw":"전갈3g","name":"전갈","dose":"3g","base":"전갈"},{"raw":"감초5g","name":"감초","dose":"5g","base":"감초"}],"notes":[],"핵심 효능":["보기를 통해 기혈순환을 돕고 활혈화어로 뇌락을 소통시킴(익기활혈益氣活血)","양심안신養心安神하고, 중진약重鎭藥으로 진정시켜 경련과 통증을 완화함(중진안신重鎭安神)","기혈, 형신, 심간을 종합 조율하여 어혈을 풀고 뇌신腦神을 안정시킴(기혈氣血, 형신形神, 심간동치心肝同治)"],"주치증":["혈관성 두통, 뇌진탕, 뇌손상 후 증후군, 뇌동맥경화증의 어조뇌락증瘀阻腦絡證"],"연구 확장 영역":["뇌혈관 질환 및 뇌손상 후유증의 혈류 개선, 진정과 항경련 및 신경보호 효과, 만성 두통 및 뇌동맥경화증에 대한 항염증과 항산화 기전 연구"],"R&D 포인트":["뇌락어조腦絡瘀阻에 대한 익기활혈 및 중진안신 배합의 뇌혈류 개선 및 진통, 진정 효능 기전 규명","대뇌 미세혈관 혈류량(CBF) 증가 및 뇌혈관 연축 억제를 통한 뇌혈류역학적 기전 규명","신경세포 아폽토시스 억제 및 NF-κB/Nrf2 관련 항염증·항산화 경로 조절을 통한 뇌손상 보호 효과 탐색","흥분성, 억제성 신경전달물질(Glutamate/GABA) 불균형 조절을 통한 중추신경계 진정, 항불안 작용 기전 검증"]},"modules":[{"name":"①익기활혈","hz":"益氣活血","herbs":["황기","단삼","포황","연호색","천궁"],"role":"기의 추동력으로 혈행을 돕고 뇌락의 어혈을 제거함"},{"name":"②중진안신","hz":"重鎭安神","herbs":["용골","모려","전갈"],"role":"무겁고 가라앉는 성질로 위로 치솟는 기세와 불안정한 뇌신을 묵직하게 누름"},{"name":"③양심안신","hz":"養心安神","herbs":["산조인","수오등"],"role":"심신을 영양하고 마음을 편안하게 함"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":"제반 약물의 약성을 조화롭게 이끔"}],"rd":[{"tag":"Post-concussion Syndrome","title":"뇌진탕 후 증후군의 두통·수면·인지 증상","html":"<p>어조뇌락증 235례 치료 경험 정리가 있으나 1996년 보고임<\/p><p>표준 치료가 부족한 뇌진탕 후 증후군을 대상으로 두통·수면·인지 증상 척도(RPQ)를 지표로 한 현대적 재현 연구가 개발 가치가 큼 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](1996, 235례 치료 경험 정리))<\/p>"},{"tag":"Vascular Headache","title":"혈관성 두통(편두통)의 발작 빈도 감소","html":"<p>황기·단삼·천궁·포황의 익기활혈 배합이 편두통 등 혈관성 두통의 월간 두통 일수를 줄이는지 확인함<\/p><p>예방 치료 탐색 임상이 적합하며, 뇌진탕 후 증후군과는 별도 임상군으로 설계 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 1 「익기활혈과 뇌락소통」, 본문 주치증)<\/p>"},{"tag":"Sleep & Mood","title":"산조인·수오등·용골·모려의 수면 개선","html":"<p>‘형신동치’를 뇌손상 후 흔한 불면·불안 증상의 개선으로 해석함<\/p><p><b>수면 지표(PSQI)를 별도의 평가 축으로 설정 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 2·3 「중진안신」·「형신심간동치」)<\/p>"},{"tag":"Antiplatelet Interaction","title":"항혈소판제 병용 시 출혈 위험","html":"<p>포황·단삼·천궁 등 활혈 약재가 많음<\/p><p>뇌혈관 질환자가 흔히 복용하는 항혈소판제와 병용할 때 출혈 지표(출혈 시간·혈소판 기능)를 점검해야 함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"익기활혈益氣活血과 뇌락소통腦絡疏通","body":"보기의 추동력으로 혈행을 돕고 막힌 뇌혈관의 어혈을 제거함"},{"n":"2","title":"중진안신重鎭安神과 평간식풍平肝息風","body":"무겁고 가라앉는 성질로 위로 치솟는 기세와 불안정한 뇌신을 누름"},{"n":"3","title":"양심안신養心安神과 형신심간동치形神心肝同治","body":"심신을 영양하고 형체와 정신, 심과 간을 종합적으로 조화시킴"},{"n":"4","title":"이병동치異病同治와 어조뇌락瘀阻腦絡 제어","body":"병기가 같은 제반 뇌질환에 대해 활혈통락과 형신동치를 적용함"}],"field":4,"pages":[234,237],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["4-5","활혈안신탕","活血安神湯","","류쭈이","劉祖貽","익기활혈益氣活血과 중진안신重鎭安神으로 어조뇌락증瘀阻腦絡證을 치료하는 처방","황기30g 단삼15g 生포황15g 연호색15g 천궁10g 산조인15g 生용골( 先煎) 30g 生모려( 先煎) 30g 수오등30g 전갈3g 감초5g","","핵심 효능 보기를 통해 기혈순환을 돕고 활혈화어로 뇌락을 소통시킴(익기활혈益氣活血) 양심안신養心安神하고, 중진약重鎭藥으로 진정시켜 경련과 통증을 완화함(중진안신重鎭安神) 기혈, 형신, 심간을 종합 조율하여 어혈을 풀고 뇌신腦神을 안정시킴(기혈氣血, 형신形神, 심간동치心肝同治)","주치증 혈관성 두통, 뇌진탕, 뇌손상 후 증후군, 뇌동맥경화증의 어조뇌락증瘀阻腦絡證","연구 확장 영역 뇌혈관 질환 및 뇌손상 후유증의 혈류 개선, 진정과 항경련 및 신경보호 효과, 만성 두통 및 뇌동맥경화증에 대한 항염증과 항산화 기전 연구","R&D 포인트 뇌락어조腦絡瘀阻에 대한 익기활혈 및 중진안신 배합의 뇌혈류 개선 및 진통, 진정 효능 기전 규명 대뇌 미세혈관 혈류량(CBF) 증가 및 뇌혈관 연축 억제를 통한 뇌혈류역학적 기전 규명 신경세포 아폽토시스 억제 및 NF-κB/Nrf2 관련 항염증·항산화 경로 조절을 통한 뇌손상 보호 효과 탐색 흥분성, 억제성 신경전달물질(Glutamate/GABA) 불균형 조절을 통한 중추신경계 진정, 항불안 작용 기전 검증","①익기활혈 益氣活血 황기 단삼 포황 연호색 천궁 기의 추동력으로 혈행을 돕고 뇌락의 어혈을 제거함","②중진안신 重鎭安神 용골 모려 전갈 무겁고 가라앉는 성질로 위로 치솟는 기세와 불안정한 뇌신을 묵직하게 누름","③양심안신 養心安神 산조인 수오등 심신을 영양하고 마음을 편안하게 함","④조화제약 調和諸藥 감초 제반 약물의 약성을 조화롭게 이끔","익기활혈益氣活血과 뇌락소통腦絡疏通 보기의 추동력으로 혈행을 돕고 막힌 뇌혈관의 어혈을 제거함","중진안신重鎭安神과 평간식풍平肝息風 무겁고 가라앉는 성질로 위로 치솟는 기세와 불안정한 뇌신을 누름","양심안신養心安神과 형신심간동치形神心肝同治 심신을 영양하고 형체와 정신, 심과 간을 종합적으로 조화시킴","이병동치異病同治와 어조뇌락瘀阻腦絡 제어 병기가 같은 제반 뇌질환에 대해 활혈통락과 형신동치를 적용함","Post-concussion Syndrome 뇌진탕 후 증후군의 두통·수면·인지 증상 어조뇌락증 235례 치료 경험 정리가 있으나 1996년 보고임 표준 치료가 부족한 뇌진탕 후 증후군을 대상으로 두통·수면·인지 증상 척도(RPQ)를 지표로 한 현대적 재현 연구가 개발 가치가 큼 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](1996, 235례 치료 경험 정리))","Vascular Headache 혈관성 두통(편두통)의 발작 빈도 감소 황기·단삼·천궁·포황의 익기활혈 배합이 편두통 등 혈관성 두통의 월간 두통 일수를 줄이는지 확인함 예방 치료 탐색 임상이 적합하며, 뇌진탕 후 증후군과는 별도 임상군으로 설계 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1 「익기활혈과 뇌락소통」, 본문 주치증)","Sleep & Mood 산조인·수오등·용골·모려의 수면 개선 ‘형신동치’를 뇌손상 후 흔한 불면·불안 증상의 개선으로 해석함 수면 지표(PSQI)를 별도의 평가 축으로 설정 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 2·3 「중진안신」·「형신심간동치」)","Antiplatelet Interaction 항혈소판제 병용 시 출혈 위험 포황·단삼·천궁 등 활혈 약재가 많음 뇌혈관 질환자가 흔히 복용하는 항혈소판제와 병용할 때 출혈 지표(출혈 시간·혈소판 기능)를 점검해야 함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)"],"ss":{"composition":"그림 4-5 활혈안신탕活血安神湯의 모듈 구성 ①익기활혈益氣活血 모듈 — 기의 추동력으로 혈행을 돕고 뇌락의 어혈을 제거함 황기, 단삼, 포황, 연호색, 천궁 : 황기는 비·폐경으로 들어가 익기益氣하여 기혈의 운행을 돕고 활혈작용을 증강함. 단삼, 포황, 연호색, 천궁은 활혈거어活血祛瘀하여 뇌락을 소통시킴 ②중진안신重鎭安神 모듈 — 무겁고 가라앉는 성질로 위로 치솟는 기세와 불안정한 뇌신을 묵직하게 누름 용골, 모려, 전갈 : 용골과 모려는 중진안신重鎭安神하여 뇌신을 가라앉힘. 전갈은 평간식풍平肝息風하여 통증을 멈추고 내풍을 진정시킴 ③양심안신養心安神 모듈 — 심신을 영양하고 마음을 편안하게 함 산조인, 수오등 : 산조인과 수오등은 양심안신養心安神하여 허손된 심신을 보양하고 불안과 불안정을 완화함 ④조화제약調和諸藥 모듈 — 제반 약물의 약성을 조화롭게 이끔 감초 : 감초는 제반 약물을 조화롭게 융화시킴","master":"①병인병기 인식 뇌진탕, 뇌손상 후 증후군, 뇌동맥경화증, 혈관성 두통 등은 중의학의 ‘두통’, ‘두풍頭風’ 범주에 속하며 일정 단계에서 공통적으로 어조뇌락증瘀阻腦絡證을 나타냄 ②치료원칙과 치법 이병동치異病同治 원칙 : 서로 다른 질병이라도 병기가 같으면 활혈통락을 위주로 동일하게 치료함 3대 치료 방법 기혈동치氣血同治 : 대량의 활혈통락약에 황기를 배합하여 기분과 혈분을 함께 다스림 형신동치形神同治 : 뇌는 원신지부元神之府이므로, 뇌락의 어혈 치료(형形)와 산조인, 수오등, 용골, 모려를 통한 안신(신神) 을 병행하여 마음이 편안해지면 뇌락의 어혈도 쉽게 풀리도록 유도함 심간동치心肝同治 : 뇌신 불안으로 동반되는 간풍을 제어하기 위해 전갈을 배합하여 심과 간을 함께 다스림 ③활혈안신탕의 임상 가감 질환별 맞춤 가감 뇌진탕 초기(조열구고潮熱口苦, 설질암홍舌質黯紅) : 황기를 빼고, 생지황, 목단피, 지골피, 백작약을 가미 뇌동맥경화증 : 연호색을 빼고, 익모초, 산사, 구등을 가미 혈관성 두통 : 황기를 빼고, 백작약, 구등, 노봉방을 가미 혈관성 치매 : 석창포, 울금, 원지를 가미 파킨슨병 : 귀판, 별갑을 가미 겸증兼證에 따른 가감 간풍상요肝風上擾를 겸할 때 : 황기를 빼고, 백작약, 구등, 하고초, 석결명을 가미 간신음허肝腎陰虛를 겸할 때 : 황기를 빼고, 구기자, 여정자, 생지황, 맥문동을 가미 신양부족腎陽不足을 겸할 때 : 음양곽, 파극천, 녹각상鹿角霜을 가미 담습상범痰濕上泛을 겸할 때 : 석창포, 法반하, 진피, 택사를 가미 증상별 대증對症 가감 두통 부위별 : 전두부는 백지, 신이를 가미하고, 두정부는 만형자를 가미하며, 양측부는 천궁의 용량을 증량하고, 침부枕部는 갈근을 가미 현훈오심眩暈惡心 : 法반하, 진피, 백출, 택사를 가미 납소納少 : 맥아, 계내금, 산사를 가미 완복작창脘腹作脹 : 불수, 대복피를 가미 변당便溏 : 의이인, 복령을 가미 대변건결大便乾結 : 여정자, 결명자를 가미 흉민흉통胸悶胸痛 : 강향降香, 괄루각瓜蔞殼을 가미","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 뇌진탕 후 증후군은 표준 치료가 부족한 영역으로, 공개자료상 제품·특허가 확인되지 않아 국내 개발을 검토할 수 있음 참고문헌 [1] 류쭈이,저우선,부셴춘.활혈안신탕의 어조뇌락증 235례 치료 총결活血安神湯治療瘀阻腦絡證235例總結[J].후난중의잡지湖南中醫雜志,1996,(1):2-3+7."}},{"id":"4-6","ko":"소조정현탕","hz":"疏調定眩湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"소조기기疏調氣機와 평간잠양平肝潛陽으로 두면부의 현훈眩暈을 치료하는 처방","meta":{"주요 적응증":"각종 어지럼(현훈)","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":238,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-6 소조정현탕疏調定眩湯의 모듈 구성<\/p><h4>①소조간비신疏調肝脾腎 모듈 — 간, 비, 신의 기기를 소통시키고 기혈의 생화지원을 보양함<\/h4><p><b>시호, 울금, 향부자, 지실, 박하<\/b>: 시호, 울금, 향부자, 지실은 간기의 울결을 풀고 기기를 소통시키며 승강의 균형을 이룸. 박하는 간경을 소통시키고 청리두목淸利頭目함<\/p><p><b>단삼, 천궁<\/b>: 활혈거어活血祛瘀하여 기체로 인한 혈행 장애를 소통시킴<\/p><p><b>산약, 음양곽<\/b>: 산약은 비위의 생화지원을 돕고, 음양곽은 온보신양溫補腎陽하여 후천과 선천을 함께 보양함<\/p><h4>②식풍화담息風化痰 모듈 — 내풍을 평정하고 담습의 원인을 차단하여 청규를 열어줌<\/h4><p><b>천마<\/b>: 평간식풍平肝息風하여 두현頭眩을 멈추게 함<\/p><p><b>복령, 택사<\/b>: 이수삼습利水滲濕하여 담음의 근원을 없애고 습탁을 소변으로 배출함<\/p><p><b>만형자<\/b>: 산풍열散風熱하며 상청두목上淸頭目하여 어지러움을 완화함<\/p><h4>③평간잠양平肝潛陽 모듈 — 위로 치솟는 간양과 동요하는 내풍을 무겁게 가라앉힘<\/h4><p><b>석결명, 용골<\/b>: 중진잠양重鎭潛陽의 성질로 위로 치솟는 양항陽亢을 묵직하게 누름<\/p><p><b>백작약<\/b>: 유간안신柔肝安神하고 평억간양平抑肝陽함<\/p><h4>④조화제약調和諸藥 모듈 — 제반 약물의 약성을 조화롭게 이끔<\/h4><p><b>감초<\/b>: 제반 약물을 조화롭게 융화시킴<\/p>"},{"k":"master","t":"장전의 현훈 치료","html":"<h4>①병인병기 인식<\/h4><p>현훈의 병위病位는 뇌수청규腦髓淸竅에 있으며, 근본적으로는 풍風, 화火, 담痰, 어瘀, 허虛에 의해 발생함<\/p><p>특히 기기의 이상 승강이 핵심 병기로 작용하며, 간양상항肝陽上亢, 비허생담脾虛生痰, 신정휴손腎精虧損이 복합적으로 얽혀 나타남<\/p><h4>②치료원칙과 치법<\/h4><p><b>소조기기疏調氣機, 승강평형升降平衡<\/b>: 전신의 기기를 조리하여 간기의 소설 기능을 회복시키고, 승강의 균형을 맞추는 것을 치료의 핵심으로 삼음<\/p><h4>③표본겸치標本兼治와 가감 활용<\/h4><p><b>풍風을 겸할 때<\/b>: 외풍에는 방풍, 형개, 질려, 선퇴 등으로 풍사를 흩어내고, 내풍에서 간양肝陽이 움직일 때는 석결명, 용골, 진주모 등으로 평간잠양하고, 수불함목水不涵木일 때는 구기자, 산수유 등으로 보신음補腎陰하고, 두충, 상기생, 속단, 우슬 등으로 보간신補肝腎함<\/p><p><b>화火를 겸할 때<\/b>: 소조기기로 간의 소설을 정상화하여 울결된 화를 풀고, 간화상염肝火上炎에는 치자, 하고초 등으로 청열淸熱함. 화사로 인해 진액이 졸여져 담이 생겼을 때는 황금, 죽여, 상백피, 괄루인 등으로 청화열담淸化熱痰함<\/p><p><b>담痰을 겸할 때<\/b>: 한담寒痰에는 진피, 반하, 석창포 등으로 온화溫化하고, 열담熱痰에는 황금, 죽여, 상백피, 괄루인 등으로 청화淸化함. 비를 튼튼히 하여 생담의 원인을 끊고, 이미 생긴 담은 화담化痰, 척담滌痰, 활담豁痰하여 중초가 습에 막히는 폐단을 해소함<\/p><p><b>어瘀를 겸할 때<\/b>: 홍화, 도인 등을 배합함. 어혈이 심할 때는 오공, 오초사로 통락通絡하고, 수질, 토별충으로 파혈축어破血逐瘀함. 저혈압으로 인한 현훈에는 보기補氣와 함께 활혈화어를 하되 혈행 무력으로 인한 어혈 형성에 주의함. 노인이나 허약자는 파혈약의 과용을 경계하며 심혈관 위험(혈관 파열 등)을 예방함<\/p><p><b>허虛를 겸할 때<\/b>: 기허 경증에는 완보법緩補法을 사용하며, 태자삼, 황기, 당삼 등을 활용하고, 보기할 때는 지각과 같은 행기약을 배합함. 신정 부족에는 구기자, 산수유, 산약 등을 사용하며, “선보음자善補陰者, 필어양중구음必於陽中求陰”의 원칙에 따라 음양곽淫羊藿을 배합하여 신정의 화생을 돕고 그 생성을 지속시킴<\/p><p class=\"lbl2\">핵심 대약對藥<\/p><p class=\"sub\"><b>만형자-갈근<\/b>: 청리두목淸利頭目하며, 두훈頭暈(어지럼), 두혼頭昏(머리가 맑지 않음), 두목불청頭目不淸 개선<\/p><p class=\"sub\"><b>저령-택사<\/b>: 이수삼습利水滲濕하며, 내림프수종(Endolymphatic Hydrops)에 의한 현훈 증상 치료<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">어지럼 대상 처방은 국내 한방 제제(반하백출천마탕 등)와 겹치므로, 소조기기탕 골격의 차별점을 비교 연구로 확인해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 천샤오윈,주젠핑,톈위안,등.소조정현탕의 현훈 치료 경험 분석疏調定眩湯治療眩暈的經驗分析[J].윈난중의중약잡지雲南中醫中藥雜志,2023,44(10):98-101.<\/li><li class=\"ref\">[2] 루신위.국의대사 장전의 소조정현탕에 의한 후순환 허혈성 현훈(풍담상요형) 치료 임상 연구國醫大師張震疏調定眩湯治療後循環缺血性眩暈(風痰上擾型)的臨床研究[D].윈난중의약대학雲南中醫藥大學,2024.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"北시호","name":"北시호","dose":"","base":"시호"},{"raw":"울금","name":"울금","dose":"","base":"울금"},{"raw":"단삼","name":"단삼","dose":"","base":"단삼"},{"raw":"천궁","name":"천궁","dose":"","base":"천궁"},{"raw":"백작약","name":"백작약","dose":"","base":"백작약"},{"raw":"지실","name":"지실","dose":"","base":"지실"},{"raw":"복령","name":"복령","dose":"","base":"복령"},{"raw":"산약","name":"산약","dose":"","base":"산약"},{"raw":"향부자","name":"향부자","dose":"","base":"향부자"},{"raw":"음양곽","name":"음양곽","dose":"","base":"음양곽"},{"raw":"석결명","name":"석결명","dose":"","base":"석결명"},{"raw":"용골","name":"용골","dose":"","base":"용골"},{"raw":"천마","name":"천마","dose":"","base":"천마"},{"raw":"만형자","name":"만형자","dose":"","base":"만형자"},{"raw":"택사","name":"택사","dose":"","base":"택사"},{"raw":"박하","name":"박하","dose":"","base":"박하"},{"raw":"生감초","name":"生감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["간·비·신의 장부 기기를 조리하여 전신의 기를 소통시키고 생화지원을 보양함(소조간비신疏調肝脾腎)","내풍을 평정하고 담음과 습탁을 제거하여 뇌락과 청규를 소통시킴(식풍화담息風化痰)","위로 치솟는 간양을 가라앉히고 어지러움을 진정시킴(평간잠양平肝潛陽)"],"주치증":["풍風, 화火, 담痰, 어瘀, 허虛에 의해 발생하는 다양한 원인의 현훈眩暈. 고혈압, 저혈압, 메니에르병, 척추기저동맥 혈류부전, 경추증, 이석증, 전정前庭신경염, 전정성 편두통, 뇌동맥경화증 등에서 나타나는 현훈"],"연구 확장 영역":["뇌혈관 순환 장애 및 전정계 이상으로 인한 현훈의 혈류 개선, 신경보호 및 항고혈압·항산화 기전 연구"],"R&D 포인트":["뇌혈류역학 개선 및 척추기저동맥 혈류량 증가를 통한 현훈 제어 기전 규명","소조기기 방제의 전정前庭 신경핵 및 중추 평형 조절 기전에 대한 약력학적 연구"]},"modules":[{"name":"①소조간비신","hz":"疏調肝脾腎","herbs":["박하","단삼","천궁","산약","음양곽"],"role":"간, 비, 신의 기기를 소통시키고 기혈의 생화지원을 보양함"},{"name":"②식풍화담","hz":"息風化痰","herbs":["천마","복령","택사","만형자"],"role":"내풍을 평정하고 담습의 원인을 차단하여 청규를 열어줌"},{"name":"③평간잠양","hz":"平肝潛陽","herbs":["석결명","용골","백작약"],"role":"위로 치솟는 간양과 동요하는 내풍을 무겁게 가라앉힘"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":"제반 약물의 약성을 조화롭게 이끔"}],"rd":[{"tag":"Posterior Circulation Vertigo","title":"후순환 허혈성 현훈의 임상 효과","html":"<p>후순환 허혈성 현훈은 뇌졸중 등 혈관 위험의 진단·관리가 우선임<\/p><p>표준 진단 체계로 위험군을 선별·관리한 환자에서 어지럼 장애 척도(DHI)를 주요 지표로, 추골기저동맥 혈류는 보조 지표로 한 무작위 대조 임상을 검토 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2024, 후순환 허혈성 현훈 임상 연구))<\/p>"},{"tag":"Vestibular Disorders","title":"메니에르병·전정성 편두통 등 원인별 효과 구분","html":"<p>주치 범위에 고혈압부터 이석증까지 원인이 다른 현훈이 섞여 있음<\/p><p>원인 질환별로 반응을 나누어 분석해 우선 적응증을 정하는 것이 필요 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2023, 현훈 치료 경험 분석), 본문 주치증)<\/p>"},{"tag":"Wind–Phlegm Module","title":"천마·택사·복령의 식풍화담 효과","html":"<p>천마(가스트로딘)와 택사·복령 배합의 전정 기능 회복 효과를 전정 손상 모델에서 확인함<\/p><p><b>이를 통해 ‘식풍화담’을 전정 보상 촉진으로 구체화 (근거 유형<\/b>: 간접 근거 | 근거: R&amp;D 논리 2 「식풍화담과 청규개통」, 본문 조성표)<\/p>"},{"tag":"Formula Platform","title":"소조기기탕 골격과 현훈 가감 약재의 구분","html":"<p>17종 중 시호·울금·단삼·천궁·백작약·지실·향부자 등은 소조기기탕 골격과 겹침<\/p><p>공통 골격과 현훈 특화 약재(천마·석결명·만형자·택사)를 구분해 플랫폼형 개발로 연결 (근거 유형: 간접 근거 | 근거: 본문 조성표(소조기기탕과 비교), R&amp;D 논리 4)<\/p>"}],"logic":[{"n":"1","title":"소조간비신疏調肝脾腎과 기기소통氣機疏通","body":"간, 비, 신의 기기를 조리하여 전신의 기를 소통시키고 생화지원을 보양함"},{"n":"2","title":"식풍화담息風化痰과 청규개통淸竅開通","body":"내풍을 평정하고 담음과 습탁을 제거하여 뇌락과 청규를 소통시킴"},{"n":"3","title":"평간잠양平肝潛陽과 진정안신鎭靜安神","body":"위로 치솟는 간양을 가라앉히고 어지러움을 진정시킴"},{"n":"4","title":"소조기기법疏調氣機法과 다원적 현훈 제어","body":"풍風, 화火, 담痰, 어瘀, 허虛의 복합 병기에 맞춘 표본겸치와 기기 소통을 적용함"}],"field":4,"pages":[238,242],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["4-6","소조정현탕","疏調定眩湯","","장전","張震","소조기기疏調氣機와 평간잠양平肝潛陽으로 두면부의 현훈眩暈을 치료하는 처방","北시호 울금 단삼 천궁 백작약 지실 복령 산약 향부자 음양곽 석결명 용골 천마 만형자 택사 박하 生감초","","핵심 효능 간·비·신의 장부 기기를 조리하여 전신의 기를 소통시키고 생화지원을 보양함(소조간비신疏調肝脾腎) 내풍을 평정하고 담음과 습탁을 제거하여 뇌락과 청규를 소통시킴(식풍화담息風化痰) 위로 치솟는 간양을 가라앉히고 어지러움을 진정시킴(평간잠양平肝潛陽)","주치증 풍風, 화火, 담痰, 어瘀, 허虛에 의해 발생하는 다양한 원인의 현훈眩暈. 고혈압, 저혈압, 메니에르병, 척추기저동맥 혈류부전, 경추증, 이석증, 전정前庭신경염, 전정성 편두통, 뇌동맥경화증 등에서 나타나는 현훈","연구 확장 영역 뇌혈관 순환 장애 및 전정계 이상으로 인한 현훈의 혈류 개선, 신경보호 및 항고혈압·항산화 기전 연구","R&D 포인트 뇌혈류역학 개선 및 척추기저동맥 혈류량 증가를 통한 현훈 제어 기전 규명 소조기기 방제의 전정前庭 신경핵 및 중추 평형 조절 기전에 대한 약력학적 연구","①소조간비신 疏調肝脾腎 박하 단삼 천궁 산약 음양곽 간, 비, 신의 기기를 소통시키고 기혈의 생화지원을 보양함","②식풍화담 息風化痰 천마 복령 택사 만형자 내풍을 평정하고 담습의 원인을 차단하여 청규를 열어줌","③평간잠양 平肝潛陽 석결명 용골 백작약 위로 치솟는 간양과 동요하는 내풍을 무겁게 가라앉힘","④조화제약 調和諸藥 감초 제반 약물의 약성을 조화롭게 이끔","소조간비신疏調肝脾腎과 기기소통氣機疏通 간, 비, 신의 기기를 조리하여 전신의 기를 소통시키고 생화지원을 보양함","식풍화담息風化痰과 청규개통淸竅開通 내풍을 평정하고 담음과 습탁을 제거하여 뇌락과 청규를 소통시킴","평간잠양平肝潛陽과 진정안신鎭靜安神 위로 치솟는 간양을 가라앉히고 어지러움을 진정시킴","소조기기법疏調氣機法과 다원적 현훈 제어 풍風, 화火, 담痰, 어瘀, 허虛의 복합 병기에 맞춘 표본겸치와 기기 소통을 적용함","Posterior Circulation Vertigo 후순환 허혈성 현훈의 임상 효과 후순환 허혈성 현훈은 뇌졸중 등 혈관 위험의 진단·관리가 우선임 표준 진단 체계로 위험군을 선별·관리한 환자에서 어지럼 장애 척도(DHI)를 주요 지표로, 추골기저동맥 혈류는 보조 지표로 한 무작위 대조 임상을 검토 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2024, 후순환 허혈성 현훈 임상 연구))","Vestibular Disorders 메니에르병·전정성 편두통 등 원인별 효과 구분 주치 범위에 고혈압부터 이석증까지 원인이 다른 현훈이 섞여 있음 원인 질환별로 반응을 나누어 분석해 우선 적응증을 정하는 것이 필요 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2023, 현훈 치료 경험 분석), 본문 주치증)","Wind–Phlegm Module 천마·택사·복령의 식풍화담 효과 천마(가스트로딘)와 택사·복령 배합의 전정 기능 회복 효과를 전정 손상 모델에서 확인함 이를 통해 ‘식풍화담’을 전정 보상 촉진으로 구체화 (근거 유형 : 간접 근거 | 근거: R&D 논리 2 「식풍화담과 청규개통」, 본문 조성표)","Formula Platform 소조기기탕 골격과 현훈 가감 약재의 구분 17종 중 시호·울금·단삼·천궁·백작약·지실·향부자 등은 소조기기탕 골격과 겹침 공통 골격과 현훈 특화 약재(천마·석결명·만형자·택사)를 구분해 플랫폼형 개발로 연결 (근거 유형: 간접 근거 | 근거: 본문 조성표(소조기기탕과 비교), R&D 논리 4)"],"ss":{"composition":"그림 4-6 소조정현탕疏調定眩湯의 모듈 구성 ①소조간비신疏調肝脾腎 모듈 — 간, 비, 신의 기기를 소통시키고 기혈의 생화지원을 보양함 시호, 울금, 향부자, 지실, 박하 : 시호, 울금, 향부자, 지실은 간기의 울결을 풀고 기기를 소통시키며 승강의 균형을 이룸. 박하는 간경을 소통시키고 청리두목淸利頭目함 단삼, 천궁 : 활혈거어活血祛瘀하여 기체로 인한 혈행 장애를 소통시킴 산약, 음양곽 : 산약은 비위의 생화지원을 돕고, 음양곽은 온보신양溫補腎陽하여 후천과 선천을 함께 보양함 ②식풍화담息風化痰 모듈 — 내풍을 평정하고 담습의 원인을 차단하여 청규를 열어줌 천마 : 평간식풍平肝息風하여 두현頭眩을 멈추게 함 복령, 택사 : 이수삼습利水滲濕하여 담음의 근원을 없애고 습탁을 소변으로 배출함 만형자 : 산풍열散風熱하며 상청두목上淸頭目하여 어지러움을 완화함 ③평간잠양平肝潛陽 모듈 — 위로 치솟는 간양과 동요하는 내풍을 무겁게 가라앉힘 석결명, 용골 : 중진잠양重鎭潛陽의 성질로 위로 치솟는 양항陽亢을 묵직하게 누름 백작약 : 유간안신柔肝安神하고 평억간양平抑肝陽함 ④조화제약調和諸藥 모듈 — 제반 약물의 약성을 조화롭게 이끔 감초 : 제반 약물을 조화롭게 융화시킴","master":"①병인병기 인식 현훈의 병위病位는 뇌수청규腦髓淸竅에 있으며, 근본적으로는 풍風, 화火, 담痰, 어瘀, 허虛에 의해 발생함 특히 기기의 이상 승강이 핵심 병기로 작용하며, 간양상항肝陽上亢, 비허생담脾虛生痰, 신정휴손腎精虧損이 복합적으로 얽혀 나타남 ②치료원칙과 치법 소조기기疏調氣機, 승강평형升降平衡 : 전신의 기기를 조리하여 간기의 소설 기능을 회복시키고, 승강의 균형을 맞추는 것을 치료의 핵심으로 삼음 ③표본겸치標本兼治와 가감 활용 풍風을 겸할 때 : 외풍에는 방풍, 형개, 질려, 선퇴 등으로 풍사를 흩어내고, 내풍에서 간양肝陽이 움직일 때는 석결명, 용골, 진주모 등으로 평간잠양하고, 수불함목水不涵木일 때는 구기자, 산수유 등으로 보신음補腎陰하고, 두충, 상기생, 속단, 우슬 등으로 보간신補肝腎함 화火를 겸할 때 : 소조기기로 간의 소설을 정상화하여 울결된 화를 풀고, 간화상염肝火上炎에는 치자, 하고초 등으로 청열淸熱함. 화사로 인해 진액이 졸여져 담이 생겼을 때는 황금, 죽여, 상백피, 괄루인 등으로 청화열담淸化熱痰함 담痰을 겸할 때 : 한담寒痰에는 진피, 반하, 석창포 등으로 온화溫化하고, 열담熱痰에는 황금, 죽여, 상백피, 괄루인 등으로 청화淸化함. 비를 튼튼히 하여 생담의 원인을 끊고, 이미 생긴 담은 화담化痰, 척담滌痰, 활담豁痰하여 중초가 습에 막히는 폐단을 해소함 어瘀를 겸할 때 : 홍화, 도인 등을 배합함. 어혈이 심할 때는 오공, 오초사로 통락通絡하고, 수질, 토별충으로 파혈축어破血逐瘀함. 저혈압으로 인한 현훈에는 보기補氣와 함께 활혈화어를 하되 혈행 무력으로 인한 어혈 형성에 주의함. 노인이나 허약자는 파혈약의 과용을 경계하며 심혈관 위험(혈관 파열 등)을 예방함 허虛를 겸할 때 : 기허 경증에는 완보법緩補法을 사용하며, 태자삼, 황기, 당삼 등을 활용하고, 보기할 때는 지각과 같은 행기약을 배합함. 신정 부족에는 구기자, 산수유, 산약 등을 사용하며, “선보음자善補陰者, 필어양중구음必於陽中求陰”의 원칙에 따라 음양곽淫羊藿을 배합하여 신정의 화생을 돕고 그 생성을 지속시킴 핵심 대약對藥 만형자-갈근 : 청리두목淸利頭目하며, 두훈頭暈(어지럼), 두혼頭昏(머리가 맑지 않음), 두목불청頭目不淸 개선 저령-택사 : 이수삼습利水滲濕하며, 내림프수종(Endolymphatic Hydrops)에 의한 현훈 증상 치료","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 어지럼 대상 처방은 국내 한방 제제(반하백출천마탕 등)와 겹치므로, 소조기기탕 골격의 차별점을 비교 연구로 확인해야 함 참고문헌 [1] 천샤오윈,주젠핑,톈위안,등.소조정현탕의 현훈 치료 경험 분석疏調定眩湯治療眩暈的經驗分析[J].윈난중의중약잡지雲南中醫中藥雜志,2023,44(10):98-101. [2] 루신위.국의대사 장전의 소조정현탕에 의한 후순환 허혈성 현훈(풍담상요형) 치료 임상 연구國醫大師張震疏調定眩湯治療後循環缺血性眩暈(風痰上擾型)的臨床研究[D].윈난중의약대학雲南中醫藥大學,2024."}},{"id":"4-7","ko":"고침무우탕","hz":"高枕無憂湯","alias":"","master_ko":"왕치","master_hz":"王琦","tagline":"교통음양交通陰陽과 조간안혼調肝安魂으로 만성 불면증을 치료하는 처방","meta":{"주요 적응증":"만성 불면","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":243,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-7 고침무우탕高枕無憂湯의 모듈 구성<\/p><h4>①교통음양交通陰陽 모듈 — 천지의 음양소장陰陽消長 이치를 응용하여 위기衛氣의 승강 순행을 유도함<\/h4><p><b>하고초, 반하<\/b>: 하고초는 지극한 양기를 얻어 생장하고, 반하는 지극한 음기를 얻어 생장하므로, 두 약재를 배합하면 간위肝胃를 조화롭게 하고 음양의 균형을 맞추어 영위營衛를 질서 있게 순행시킴<\/p><h4>②조간안혼調肝安魂 모듈 — 간을 소통시키고 정신을 안정시켜 혼을 갈무리함<\/h4><p><b>소엽, 백합, 합환피<\/b>: 소엽은 신온기박辛溫氣薄하여 기기를 소통시키고 영혈을 조화롭게 함. 백합은 감미롭고 서늘하여 심신을 윤조하고 놀라거나 가슴이 두근거리는 증상을 진정시킴. 합환피는 감평甘平하며 안신해울安神解鬱함. 세 약물 모두 낮에 피고 밤에 지는 생태적 특성이 있어 수면 리듬과 연관된 약물로 해석됨<\/p>"},{"k":"master","t":"왕치의 만성 불면증 치료","html":"<h4>①심병증審病證, 조병기抓病機 — 병증을 살피고 병기를 파악<\/h4><p>만성 불면의 병인은 복잡하나, 핵심 병기를 정확히 파악하여 수면을 조리하는 것을 치료의 근본으로 삼아야 함. 불면이 다른 질환(예: 발기부전 초기, 만성 비뇨기계 감염 등)을 유발한 경우, 수면 문제를 해결하면 동반 질환의 회복에도 도움이 된다는 ‘치병구본治病求本’의 사상을 강조함<\/p><h4>②교통음양交通陰陽, 조간안혼調肝安魂<\/h4><p>만성 불면의 근본 원인은 위기가 음으로 들어가지 못하고 양에만 머무는 ‘위불입음衛不入陰’과 ‘음양실교陰陽失交’에 있음<\/p><p>간은 장혼藏魂하는데 칠정불화七情不和, 정지상해情志傷害로 간기울결肝氣鬱結 및 화화化火하면 양기가 위로 뜨고 혼이 정처를 잃어 잠들지 못하므로 교통음양과 함께 간을 조율해야 함<\/p><h4>③체질감별을 중시하고, 체질-질병-변증을 결합<\/h4><p><b>변체가미辨體加味<\/b>: 환자의 선천적 체질 특성에 따른 맞춤 가미<\/p><p class=\"sub\"><b>기허체질氣虛體質<\/b>: 당삼, 황기 가미<\/p><p class=\"sub\"><b>양허체질陽虛體質<\/b>: 육종용, 음양곽 가미<\/p><p class=\"sub\"><b>음허체질陰虛體質<\/b>: 생지황, 석곡 가미<\/p><p class=\"sub\"><b>담습체질痰濕體質<\/b>: 진피, 반하 가미<\/p><p class=\"sub\"><b>습열체질濕熱體質<\/b>: 황백, 창출 가미<\/p><p class=\"sub\"><b>혈어체질血瘀體質<\/b>: 도인, 홍화 가미<\/p><p class=\"sub\"><b>기울체질氣鬱體質<\/b>: 지각, 시호 가미<\/p><p><b>변증가미辨證加味<\/b>: 현재 나타나는 세부 병증 및 장부 부조화에 따른 가미<\/p><p class=\"sub\"><b>간울혈허肝鬱血虛<\/b>: 시호, 당귀, 백작약 가미<\/p><p class=\"sub\"><b>간울화화肝鬱化火<\/b>: 치자, 목단피, 시호, 용골, 모려 가미<\/p><p class=\"sub\"><b>담열내요痰熱內擾<\/b>: 죽여, 지실, 귤홍 가미<\/p><h4>④기타<\/h4><p><b>여성 불면의 충임衝任 조절<\/b>: 여성 환자는 월경 전후의 기혈 성쇠를 고려하여, 월경 전에는 이기활혈청열理氣活血淸熱(예: 향부자, 목단피 등) 약재를 추가하고, 월경 후에는 익기양혈益氣養血(예: 하수오, 아교 등) 약재를 추가함<\/p><p><b>내외동치內外同治<\/b>: 인체의 수면을 주관하는 경락인 양교맥陽蹻脈과 음교맥陰蹻脈이 발뒤꿈치에서 기원한다는 원리에 착안하여, 내복약 찌꺼기를 이용한 취침 전 족욕을 병행함으로써 족부 경락을 자극해 위기의 입음을 돕고 치료 효과를 높임<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">5종 간결 처방이고 공개자료상 중국 제품이 확인되지 않아 불면 대상 국내 개발 후보로 검토할 만하나, 제제화 가능성은 지표성분·제형 연구로 따로 확인해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 장민.왕치 교수의 변체-변병-변증 결합 학술사상과 임상 경험 총결 및 만성 불면 치료 임상 연구王琦教授辨體—辨病—辨證相結合學術思想與臨床經驗總結及治療慢性失眠的臨床研究[D].베이징중의약대학北京中醫藥大學,2011.<\/li><li class=\"ref\">[2] 리링루,니청,장옌,등.제12강: 불면 치료의 사고와 방법 갱신第十二講更新失眠治療的思路與方法[J].중의약통보中醫藥通報,2013,12(6):4-9.<\/li><li class=\"ref\">[3] 니청.왕치 교수의 주병주방 학술사상과 임상 경험 총결 및 알레르기성 비염 치료 임상 연구王琦教授主病主方學術思想和臨床經驗總結及治療變異性鼻炎的臨床研究[D].베이징중의약대학北京中醫藥大學,2011.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"반하","name":"반하","dose":"","base":"반하"},{"raw":"하고초","name":"하고초","dose":"","base":"하고초"},{"raw":"소엽","name":"소엽","dose":"","base":"소엽"},{"raw":"백합","name":"백합","dose":"","base":"백합"},{"raw":"합환피","name":"합환피","dose":"","base":"합환피"}],"notes":[],"핵심 효능":["음양의 기세를 조율하고 위기衛氣를 양에서 음으로 들어오게 하여 수면 리듬을 회복시킴 (교통음양交通陰陽)","간의 기기를 소통시키고 혈을 조화롭게 하여 혼魂이 안식할 수 있도록 함(조간안혼調肝安魂)"],"주치증":["만성 불면증, 신혼불안神魂不安을 동반하는 각종 정지情志 및 수면장애 질환"],"연구 확장 영역":["뇌내 신경전달물질 조절, 중추 수면-각성 주기 안정화 및 항불안·항우울 기전 연구"],"R&D 포인트":["낮에 피고 밤에 지는 생태적 특성을 가진 약물들의 위기입음衛氣入陰 유도 기전 규명","위기衛氣의 순행 주기에 미치는 중약의 조절 효과 및 뇌파(EEG) 분석 연구"]},"modules":[{"name":"①교통음양","hz":"交通陰陽","herbs":["하고초","반하"],"role":"천지의 음양소장陰陽消長 이치를 응용하여 위기衛氣의 승강 순행을 유도함"},{"name":"②조간안혼","hz":"調肝安魂","herbs":["소엽","백합","합환피"],"role":"간을 소통시키고 정신을 안정시켜 혼을 갈무리함"}],"rd":[{"tag":"Chronic Insomnia","title":"만성 불면증의 수면 지표 임상","html":"<p>만성 불면 치료 임상 연구가 포함된 학위논문이 있고 처방이 5종으로 간결하지만 제제화가 곧바로 쉽다고 단정할 수는 없음<\/p><p>제형 검토와 함께, 불면 심각도 지수(ISI)와 활동기록계 수면 효율을 지표로 한 무작위 대조 임상이 다음 단계 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](2011, 만성 불면 치료 임상 연구), [2](2013, 불면 치료 관점과 방법))<\/p>"},{"tag":"Herb Pair","title":"반하·하고초 약대의 수면 조절 기전","html":"<p>반하·하고초는 ‘교통음양’으로 불면에 쓰여 온 대표 약대임<\/p><p>두 약재의 배합이 수면–각성 주기와 관련 신경전달물질에 미치는 영향을 단미 대비 비교 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 1 「교통음양과 위기입음」, 본문 조성표)<\/p>"},{"tag":"Constitution-based","title":"체질 유형별 처방 반응성","html":"<p>‘변체–변병–변증’ 결합 진료를 검증하려면 체질 판정 도구로 환자를 분류한 뒤 체질별 반응률 차이를 분석해야 함<\/p><p><b>이것이 맞춤 치료의 근거가 됨 (근거 유형<\/b>: 임상 경험 보고 | 근거: R&amp;D 논리 3 「체질감별 가미와 병증결합」, 참고문헌 [1][3])<\/p>"},{"tag":"Foot Bath","title":"약재 찌꺼기 족욕 병행의 부가 효과","html":"<p>내복 후 남은 약재로 취침 전 족욕을 하는 ‘내외동치’의 부가 효과를 내복 단독 대 내복+족욕 비교로 확인함<\/p><p>이로써 비용이 적은 보조 요법의 근거를 얻을 수 있음(약액을 다시 쓰는 족욕은 위생· 피부 안전성을 별도로 검토) (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4 「내외동치와 경락자극」)<\/p>"}],"logic":[{"n":"1","title":"교통음양交通陰陽과 위기입음衛氣入陰","body":"음양의 기세를 조율하여 위기로 하여금 양에서 음으로 들어오게 함으로써 수면 생체 리듬을 회복시킴"},{"n":"2","title":"조간안혼調肝安魂과 기기소통氣機疏通","body":"간의 기기를 소통시키고 혈을 조화롭게 하여 혼이 안식할 수 있도록 함"},{"n":"3","title":"체질감별 가미와 병증결합病證結合","body":"환자의 선천적 체질과 세부 장부 부조화를 결합하여 맞춤형 불면 치료를 도모함"},{"n":"4","title":"내외동치內外同治와 경락자극","body":"내복약 찌꺼기를 이용한 취침 전 족욕을 병행하여 족부 경락을 자극하고 위기입음을 도움"}],"field":4,"pages":[243,246],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["4-7","고침무우탕","高枕無憂湯","","왕치","王琦","교통음양交通陰陽과 조간안혼調肝安魂으로 만성 불면증을 치료하는 처방","반하 하고초 소엽 백합 합환피","","핵심 효능 음양의 기세를 조율하고 위기衛氣를 양에서 음으로 들어오게 하여 수면 리듬을 회복시킴 (교통음양交通陰陽) 간의 기기를 소통시키고 혈을 조화롭게 하여 혼魂이 안식할 수 있도록 함(조간안혼調肝安魂)","주치증 만성 불면증, 신혼불안神魂不安을 동반하는 각종 정지情志 및 수면장애 질환","연구 확장 영역 뇌내 신경전달물질 조절, 중추 수면-각성 주기 안정화 및 항불안·항우울 기전 연구","R&D 포인트 낮에 피고 밤에 지는 생태적 특성을 가진 약물들의 위기입음衛氣入陰 유도 기전 규명 위기衛氣의 순행 주기에 미치는 중약의 조절 효과 및 뇌파(EEG) 분석 연구","①교통음양 交通陰陽 하고초 반하 천지의 음양소장陰陽消長 이치를 응용하여 위기衛氣의 승강 순행을 유도함","②조간안혼 調肝安魂 소엽 백합 합환피 간을 소통시키고 정신을 안정시켜 혼을 갈무리함","교통음양交通陰陽과 위기입음衛氣入陰 음양의 기세를 조율하여 위기로 하여금 양에서 음으로 들어오게 함으로써 수면 생체 리듬을 회복시킴","조간안혼調肝安魂과 기기소통氣機疏通 간의 기기를 소통시키고 혈을 조화롭게 하여 혼이 안식할 수 있도록 함","체질감별 가미와 병증결합病證結合 환자의 선천적 체질과 세부 장부 부조화를 결합하여 맞춤형 불면 치료를 도모함","내외동치內外同治와 경락자극 내복약 찌꺼기를 이용한 취침 전 족욕을 병행하여 족부 경락을 자극하고 위기입음을 도움","Chronic Insomnia 만성 불면증의 수면 지표 임상 만성 불면 치료 임상 연구가 포함된 학위논문이 있고 처방이 5종으로 간결하지만 제제화가 곧바로 쉽다고 단정할 수는 없음 제형 검토와 함께, 불면 심각도 지수(ISI)와 활동기록계 수면 효율을 지표로 한 무작위 대조 임상이 다음 단계 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](2011, 만성 불면 치료 임상 연구), [2](2013, 불면 치료 관점과 방법))","Herb Pair 반하·하고초 약대의 수면 조절 기전 반하·하고초는 ‘교통음양’으로 불면에 쓰여 온 대표 약대임 두 약재의 배합이 수면–각성 주기와 관련 신경전달물질에 미치는 영향을 단미 대비 비교 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1 「교통음양과 위기입음」, 본문 조성표)","Constitution-based 체질 유형별 처방 반응성 ‘변체–변병–변증’ 결합 진료를 검증하려면 체질 판정 도구로 환자를 분류한 뒤 체질별 반응률 차이를 분석해야 함 이것이 맞춤 치료의 근거가 됨 (근거 유형 : 임상 경험 보고 | 근거: R&D 논리 3 「체질감별 가미와 병증결합」, 참고문헌 [1][3])","Foot Bath 약재 찌꺼기 족욕 병행의 부가 효과 내복 후 남은 약재로 취침 전 족욕을 하는 ‘내외동치’의 부가 효과를 내복 단독 대 내복+족욕 비교로 확인함 이로써 비용이 적은 보조 요법의 근거를 얻을 수 있음(약액을 다시 쓰는 족욕은 위생· 피부 안전성을 별도로 검토) (근거 유형: 신규 연구가설 | 근거: R&D 논리 4 「내외동치와 경락자극」)"],"ss":{"composition":"그림 4-7 고침무우탕高枕無憂湯의 모듈 구성 ①교통음양交通陰陽 모듈 — 천지의 음양소장陰陽消長 이치를 응용하여 위기衛氣의 승강 순행을 유도함 하고초, 반하 : 하고초는 지극한 양기를 얻어 생장하고, 반하는 지극한 음기를 얻어 생장하므로, 두 약재를 배합하면 간위肝胃를 조화롭게 하고 음양의 균형을 맞추어 영위營衛를 질서 있게 순행시킴 ②조간안혼調肝安魂 모듈 — 간을 소통시키고 정신을 안정시켜 혼을 갈무리함 소엽, 백합, 합환피 : 소엽은 신온기박辛溫氣薄하여 기기를 소통시키고 영혈을 조화롭게 함. 백합은 감미롭고 서늘하여 심신을 윤조하고 놀라거나 가슴이 두근거리는 증상을 진정시킴. 합환피는 감평甘平하며 안신해울安神解鬱함. 세 약물 모두 낮에 피고 밤에 지는 생태적 특성이 있어 수면 리듬과 연관된 약물로 해석됨","master":"①심병증審病證, 조병기抓病機 — 병증을 살피고 병기를 파악 만성 불면의 병인은 복잡하나, 핵심 병기를 정확히 파악하여 수면을 조리하는 것을 치료의 근본으로 삼아야 함. 불면이 다른 질환(예: 발기부전 초기, 만성 비뇨기계 감염 등)을 유발한 경우, 수면 문제를 해결하면 동반 질환의 회복에도 도움이 된다는 ‘치병구본治病求本’의 사상을 강조함 ②교통음양交通陰陽, 조간안혼調肝安魂 만성 불면의 근본 원인은 위기가 음으로 들어가지 못하고 양에만 머무는 ‘위불입음衛不入陰’과 ‘음양실교陰陽失交’에 있음 간은 장혼藏魂하는데 칠정불화七情不和, 정지상해情志傷害로 간기울결肝氣鬱結 및 화화化火하면 양기가 위로 뜨고 혼이 정처를 잃어 잠들지 못하므로 교통음양과 함께 간을 조율해야 함 ③체질감별을 중시하고, 체질-질병-변증을 결합 변체가미辨體加味 : 환자의 선천적 체질 특성에 따른 맞춤 가미 기허체질氣虛體質 : 당삼, 황기 가미 양허체질陽虛體質 : 육종용, 음양곽 가미 음허체질陰虛體質 : 생지황, 석곡 가미 담습체질痰濕體質 : 진피, 반하 가미 습열체질濕熱體質 : 황백, 창출 가미 혈어체질血瘀體質 : 도인, 홍화 가미 기울체질氣鬱體質 : 지각, 시호 가미 변증가미辨證加味 : 현재 나타나는 세부 병증 및 장부 부조화에 따른 가미 간울혈허肝鬱血虛 : 시호, 당귀, 백작약 가미 간울화화肝鬱化火 : 치자, 목단피, 시호, 용골, 모려 가미 담열내요痰熱內擾 : 죽여, 지실, 귤홍 가미 ④기타 여성 불면의 충임衝任 조절 : 여성 환자는 월경 전후의 기혈 성쇠를 고려하여, 월경 전에는 이기활혈청열理氣活血淸熱(예: 향부자, 목단피 등) 약재를 추가하고, 월경 후에는 익기양혈益氣養血(예: 하수오, 아교 등) 약재를 추가함 내외동치內外同治 : 인체의 수면을 주관하는 경락인 양교맥陽蹻脈과 음교맥陰蹻脈이 발뒤꿈치에서 기원한다는 원리에 착안하여, 내복약 찌꺼기를 이용한 취침 전 족욕을 병행함으로써 족부 경락을 자극해 위기의 입음을 돕고 치료 효과를 높임","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 5종 간결 처방이고 공개자료상 중국 제품이 확인되지 않아 불면 대상 국내 개발 후보로 검토할 만하나, 제제화 가능성은 지표성분·제형 연구로 따로 확인해야 함 참고문헌 [1] 장민.왕치 교수의 변체-변병-변증 결합 학술사상과 임상 경험 총결 및 만성 불면 치료 임상 연구王琦教授辨體—辨病—辨證相結合學術思想與臨床經驗總結及治療慢性失眠的臨床研究[D].베이징중의약대학北京中醫藥大學,2011. [2] 리링루,니청,장옌,등.제12강: 불면 치료의 사고와 방법 갱신第十二講更新失眠治療的思路與方法[J].중의약통보中醫藥通報,2013,12(6):4-9. [3] 니청.왕치 교수의 주병주방 학술사상과 임상 경험 총결 및 알레르기성 비염 치료 임상 연구王琦教授主病主方學術思想和臨床經驗總結及治療變異性鼻炎的臨床研究[D].베이징중의약대학北京中醫藥大學,2011."}},{"id":"4-8","ko":"조기활혈안혼탕","hz":"調氣活血安魂湯","alias":"","master_ko":"쑨광룽","master_hz":"孫光榮","tagline":"중화中和 사상과 화중운비和中運脾 이론을 응용하여 만성 불면증을 치료하는 처방","meta":{"주요 적응증":"만성 불면","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":247,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-8 조기활혈안혼탕調氣活血安魂湯의 모듈 구성<\/p><h4>①안전중초安奠中焦 및 익기화혈益氣和血 모듈 — 중초를 견고히 하고 기혈을 고르게 함<\/h4><p><b>서양삼(또는 인삼, 태자삼, 당삼), 황기, 단삼<\/b>: 중초를 견고히 하고 원기를 북돋우며, 익기조혈益氣調血하여 경락을 소통시킴<\/p><h4>②교통음양交通陰陽 및 조화기기調和氣機 모듈 — 음양을 조화시키고 위기의 순행을 유도함<\/h4><p><b>백합, 자소엽<\/b>: 양음익기養陰益氣, 안신해울安神解鬱하는 백합과 기기를 소통시키는 자소엽이 합하여 동정動靜을 결합하고 음양을 조화시킴<\/p><p><b>반하, 하고초<\/b>: 반하는 음을 머금어 위기를 음으로 이끌고, 하고초는 양을 거두어들여 일수일인一收一引으로 교통심신交通心腎함<\/p><h4>③영심안신寧心安神 및 보익간신補益肝腎 모듈 — 심신을 안정시키고 정혈을 보충함<\/h4><p><b>산조인, 복신<\/b>: 혈을 길러 간을 편안하게 하고 심신을 진정시킴<\/p><p><b>상기생, 여정자, 우슬<\/b>: 신을 보하고 정혈을 채움<\/p><h4>④화담개규化痰開竅 및 청열소적淸熱消積 모듈 — 담을 삭이고 울체를 풀며 적체를 해소함<\/h4><p><b>울금, 석창포<\/b>: 담을 삭이고 규를 열어주며 심신을 열어줌<\/p><p><b>진주모<\/b>: 간을 진정시키고 심신을 안정시킴<\/p><p><b>신곡, 연교<\/b>: 식적을 없애고 열을 흩어뜨리며 심신을 고요하게 함<\/p><p><b>지각, 죽여<\/b>: 기를 내려 담을 삭이고 심신을 안정시킴<\/p><h4>⑤조화제약調和諸藥 모듈 — 약성을 조율함<\/h4><p><b>감초<\/b>: 제반 약물을 조화시킴<\/p>"},{"k":"master","t":"쑨광룽의 만성 불면증 치료","html":"<h4>①병인병기와 치료원칙<\/h4><p>기본 병기는 심신불교心腎不交와 음양리합陰陽離合에 있음. 중초 비위가 운화 기능을 정상적으로 수행하면 수화가 상교하여 정상 수면에 이르지만, 운화 기능에 편차가 생겨 기기의 승강이 원활하지 못하고 상하가 서로 소통하지 못하면 심신불교로 이어져 불면이 발생함. 총 치료 원칙은 ‘화즉안和則安’이며, 상정上靜, 중화中和, 하창下暢을 목적으로 함<\/p><h4>②중화사상中和思想과 화중운비和中運脾 이론<\/h4><p><b>중화 사상의 본질<\/b>: 인체 생리의 핵심은 평형과 조화에 있으며, 치법 역시 지나치거나 모자라지 않게 기기의 승강출입과 음양의 치우침을 바로잡아 태평한 상태를 이루는 것을 근간으로 함<\/p><p>상정上靜, 중화中和, 하창下暢의 의미<\/p><p class=\"sub\"><b>상정(上靜, 머리와 상초를 편안하고 고요하게 함)<\/b>: 심心과 신神이 있는 상초는 맑고 고요해야 잠이 들 수 있으므로, 번조와 열을 가라앉혀 정신과 혼이 안식할 수 있도록 함<\/p><p class=\"sub\"><b>중화(中和, 중초 비위를 조화롭고 평평하게 함)<\/b>: 인체의 중심이자 기기 승강의 추축인 비위를 든든히 지키고 한열의 편차를 조율하여 전신의 기혈 평형을 유지함<\/p><p class=\"sub\"><b>하창(下暢, 하초와 경락을 소통시키고 아래로 원활히 통하게 함)<\/b>: 신腎과 하초의 기운을 다스려 수화水火가 상교하게 하고, 발과 하체로 기혈이 소통되도록 유도함<\/p><p class=\"lbl2\">화중운비和中運脾의 핵심 활용<\/p><p class=\"sub\"><b>수중守中<\/b>: 비위는 인체의 중심이자 기기 승강의 축이므로, 비위의 기쇠氣衰를 파악하고 그 중심을 든든히 지켜 승강의 평형을 유지함<\/p><p class=\"sub\"><b>화중和中<\/b>: 비위에 나타나는 한열寒熱의 편차와 동태적 변화에 맞추어 약물의 성질을 조율함으로써 치우친 기기를 화평하게 함 운중運中: 비위와 타 장부(심, 신, 간 등)의 상호 관계를 유기적으로 고려하여 기혈을 다스리고 전신의 수화水火와 음양을 조화시킴<\/p><h4>③치법治法 및 방의方義로의 구체적 전개<\/h4><p><b>중초 중심의 전신 조절<\/b>: 불면증 치료 시 머리나 심장에만 국한하지 않고, 후천지본인 비위를 안정시키는 것을 치료의 출발점으로 삼음<\/p><p><b>동정결합動靜結合과 승강조화<\/b>: 동적인 약물(기기를 소통시키는 자소엽, 반하 등)과 정적인 약물(마음을 가라앉히는 백합, 산조인 등)을 배합하여 인체의 기기가 막힘없이 오르내리도록 유도함<\/p><p><b>수화상교水火相交의 매개<\/b>: 중초 비위의 운화가 원활해야 상하의 수화水火(심장의 화와 신장의 수)가 자연스럽게 교제하여 불면이 근본적으로 치유된다는 임상 논리를 관통함<\/p><h4>④임상 가감 활용<\/h4><p><b>중초 운화 과도 및 열태熱態<\/b>: 치자12-15g, 담두시10-12g을 더하고, 연교, 진주모, 하고초, 백합, 여정자의 용량을 증량함<\/p><p><b>음허진휴陰虛津虧 및 화불강火不降<\/b>: 맥문동12-15g, 생지황12-15g을 더하거나, 자석5-10g을 추가하고 지백지황환을 탕·환으로 병용함<\/p><p><b>중초 운화 불급 및 한태寒態<\/b>: 여정자를 제거하고 두충12g, 구기자12g, 용안육10-12g, 백출12g, 육계(後下)3-5g을 더하며, 백합, 하고초, 진주모의 용량을 줄이고 서양삼을 인삼10g으로 교체하거나 계부지황환을 탕·환으로 병용함<\/p><p><b>허태虛態 여부<\/b>: 허태가 뚜렷하면 서양삼과 황기 용량을 증량하고, 허태가 뚜렷하지 않으면 서양삼을 소량의 태자삼과 소량의 황기로 교체함<\/p><p><b>담열 및 적체積滯<\/b>: 신곡과 연교의 용량을 증량하고 炒산사를 추가하거나 보화환을 합방함. 울열이 심할 때에는 치자6-10g, 담두시15-18g을 더함<\/p><p><b>안신 약물 증량<\/b>: 불면 증상이 줄지 않으면 표적 약물인 산조인 용량을 증량하고, 합환화9-12g 또는 야교등20-30g 등을 더함<\/p><h4>⑤태파결합態靶結合 및 현대 중서의 결합<\/h4><p>환자의 거시적 질병 상태(태態, 허·실·한·열·담·어 등)와 현대 약리적 진정·최면 효능을 가진 표적 약물(파약靶藥, 백합· 진주모·산조인 등)을 유기적으로 결합하여 치료함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">고침무우탕과 골격이 겹치므로 두 처방을 함께 비교하는 연구로 효율을 높일 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 쑹둥훙,린전,양젠위.국의대사 쑨광룽의 중화사상과 화중운비 이론에 기반한 조기활혈안혼탕의 불면 치료基於國醫大師孫光榮中和思想與和中運脾理論運用調氣活血安魂湯治療不寐[J].허난중의河南中醫,2026,46(2):258-264.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"서양삼(또는 인삼, 태자삼, 당삼) 10~12g","name":"서양삼(또는 인삼, 태자삼, 당삼)","dose":"10~12g","base":"서양삼"},{"raw":"황기6~10g","name":"황기","dose":"6~10g","base":"황기"},{"raw":"단삼10g","name":"단삼","dose":"10g","base":"단삼"},{"raw":"백합12~30g","name":"백합","dose":"12~30g","base":"백합"},{"raw":"자소엽5~8g","name":"자소엽","dose":"5~8g","base":"자소엽"},{"raw":"淸반하6~10g","name":"淸반하","dose":"6~10g","base":"반하"},{"raw":"하고초10~20g","name":"하고초","dose":"10~20g","base":"하고초"},{"raw":"산조인15~30g","name":"산조인","dose":"15~30g","base":"산조인"},{"raw":"복신12g","name":"복신","dose":"12g","base":"복신"},{"raw":"지각10g","name":"지각","dose":"10g","base":"지각"},{"raw":"죽여10~12g","name":"죽여","dose":"10~12g","base":"죽여"},{"raw":"진주모18~30g","name":"진주모","dose":"18~30g","base":"진주모"},{"raw":"울금10g","name":"울금","dose":"10g","base":"울금"},{"raw":"석창포6~8g","name":"석창포","dose":"6~8g","base":"석창포"},{"raw":"신곡10~15g","name":"신곡","dose":"10~15g","base":"신곡"},{"raw":"연교6~12g","name":"연교","dose":"6~12g","base":"연교"},{"raw":"상기생12g","name":"상기생","dose":"12g","base":"상기생"},{"raw":"여정자12~15g","name":"여정자","dose":"12~15g","base":"여정자"},{"raw":"懷우슬10g","name":"懷우슬","dose":"10g","base":"우슬"},{"raw":"감초5g","name":"감초","dose":"5g","base":"감초"}],"notes":[],"핵심 효능":["원기를 북돋우고 기혈을 조화롭게 하여 경락을 소통시킴(익기화혈益氣和血)","인체의 기기 승강출입을 조절하고 음양의 균형을 이룸(평보음양平補陰陽)","상하의 수화水火가 상교하여 심신이 서로 통하게 함(교통심신交通心腎)","정신을 안정시키고 혼魂이 안식할 수 있도록 함(영심안신寧心安神)"],"주치증":["만성 불면증 및 신혼불안神魂不安을 동반하는 각종 수면 장애 질환"],"연구 확장 영역":["불안장애, 우울증을 동반한 수면장애, 갱년기 증후군 및 심신불교心腎不交를 수반한 신경쇠약 제반 질환"],"R&D 포인트":["삼류, 황기, 단삼 조합이 기혈의 불균형과 경락소통  신규 연구가설 | 근거: R&D 논리 4 「화담개규와 청열소적」)"],"ss":{"composition":"그림 4-8 조기활혈안혼탕調氣活血安魂湯의 모듈 구성 ①안전중초安奠中焦 및 익기화혈益氣和血 모듈 — 중초를 견고히 하고 기혈을 고르게 함 서양삼(또는 인삼, 태자삼, 당삼), 황기, 단삼 : 중초를 견고히 하고 원기를 북돋우며, 익기조혈益氣調血하여 경락을 소통시킴 ②교통음양交通陰陽 및 조화기기調和氣機 모듈 — 음양을 조화시키고 위기의 순행을 유도함 백합, 자소엽 : 양음익기養陰益氣, 안신해울安神解鬱하는 백합과 기기를 소통시키는 자소엽이 합하여 동정動靜을 결합하고 음양을 조화시킴 반하, 하고초 : 반하는 음을 머금어 위기를 음으로 이끌고, 하고초는 양을 거두어들여 일수일인一收一引으로 교통심신交通心腎함 ③영심안신寧心安神 및 보익간신補益肝腎 모듈 — 심신을 안정시키고 정혈을 보충함 산조인, 복신 : 혈을 길러 간을 편안하게 하고 심신을 진정시킴 상기생, 여정자, 우슬 : 신을 보하고 정혈을 채움 ④화담개규化痰開竅 및 청열소적淸熱消積 모듈 — 담을 삭이고 울체를 풀며 적체를 해소함 울금, 석창포 : 담을 삭이고 규를 열어주며 심신을 열어줌 진주모 : 간을 진정시키고 심신을 안정시킴 신곡, 연교 : 식적을 없애고 열을 흩어뜨리며 심신을 고요하게 함 지각, 죽여 : 기를 내려 담을 삭이고 심신을 안정시킴 ⑤조화제약調和諸藥 모듈 — 약성을 조율함 감초 : 제반 약물을 조화시킴","master":"①병인병기와 치료원칙 기본 병기는 심신불교心腎不交와 음양리합陰陽離合에 있음. 중초 비위가 운화 기능을 정상적으로 수행하면 수화가 상교하여 정상 수면에 이르지만, 운화 기능에 편차가 생겨 기기의 승강이 원활하지 못하고 상하가 서로 소통하지 못하면 심신불교로 이어져 불면이 발생함. 총 치료 원칙은 ‘화즉안和則安’이며, 상정上靜, 중화中和, 하창下暢을 목적으로 함 ②중화사상中和思想과 화중운비和中運脾 이론 중화 사상의 본질 : 인체 생리의 핵심은 평형과 조화에 있으며, 치법 역시 지나치거나 모자라지 않게 기기의 승강출입과 음양의 치우침을 바로잡아 태평한 상태를 이루는 것을 근간으로 함 상정上靜, 중화中和, 하창下暢의 의미 상정(上靜, 머리와 상초를 편안하고 고요하게 함) : 심心과 신神이 있는 상초는 맑고 고요해야 잠이 들 수 있으므로, 번조와 열을 가라앉혀 정신과 혼이 안식할 수 있도록 함 중화(中和, 중초 비위를 조화롭고 평평하게 함) : 인체의 중심이자 기기 승강의 추축인 비위를 든든히 지키고 한열의 편차를 조율하여 전신의 기혈 평형을 유지함 하창(下暢, 하초와 경락을 소통시키고 아래로 원활히 통하게 함) : 신腎과 하초의 기운을 다스려 수화水火가 상교하게 하고, 발과 하체로 기혈이 소통되도록 유도함 화중운비和中運脾의 핵심 활용 수중守中 : 비위는 인체의 중심이자 기기 승강의 축이므로, 비위의 기쇠氣衰를 파악하고 그 중심을 든든히 지켜 승강의 평형을 유지함 화중和中 : 비위에 나타나는 한열寒熱의 편차와 동태적 변화에 맞추어 약물의 성질을 조율함으로써 치우친 기기를 화평하게 함 운중運中: 비위와 타 장부(심, 신, 간 등)의 상호 관계를 유기적으로 고려하여 기혈을 다스리고 전신의 수화水火와 음양을 조화시킴 ③치법治法 및 방의方義로의 구체적 전개 중초 중심의 전신 조절 : 불면증 치료 시 머리나 심장에만 국한하지 않고, 후천지본인 비위를 안정시키는 것을 치료의 출발점으로 삼음 동정결합動靜結合과 승강조화 : 동적인 약물(기기를 소통시키는 자소엽, 반하 등)과 정적인 약물(마음을 가라앉히는 백합, 산조인 등)을 배합하여 인체의 기기가 막힘없이 오르내리도록 유도함 수화상교水火相交의 매개 : 중초 비위의 운화가 원활해야 상하의 수화水火(심장의 화와 신장의 수)가 자연스럽게 교제하여 불면이 근본적으로 치유된다는 임상 논리를 관통함 ④임상 가감 활용 중초 운화 과도 및 열태熱態 : 치자12-15g, 담두시10-12g을 더하고, 연교, 진주모, 하고초, 백합, 여정자의 용량을 증량함 음허진휴陰虛津虧 및 화불강火不降 : 맥문동12-15g, 생지황12-15g을 더하거나, 자석5-10g을 추가하고 지백지황환을 탕·환으로 병용함 중초 운화 불급 및 한태寒態 : 여정자를 제거하고 두충12g, 구기자12g, 용안육10-12g, 백출12g, 육계(後下)3-5g을 더하며, 백합, 하고초, 진주모의 용량을 줄이고 서양삼을 인삼10g으로 교체하거나 계부지황환을 탕·환으로 병용함 허태虛態 여부 : 허태가 뚜렷하면 서양삼과 황기 용량을 증량하고, 허태가 뚜렷하지 않으면 서양삼을 소량의 태자삼과 소량의 황기로 교체함 담열 및 적체積滯 : 신곡과 연교의 용량을 증량하고 炒산사를 추가하거나 보화환을 합방함. 울열이 심할 때에는 치자6-10g, 담두시15-18g을 더함 안신 약물 증량 : 불면 증상이 줄지 않으면 표적 약물인 산조인 용량을 증량하고, 합환화9-12g 또는 야교등20-30g 등을 더함 ⑤태파결합態靶結合 및 현대 중서의 결합 환자의 거시적 질병 상태(태態, 허·실·한·열·담·어 등)와 현대 약리적 진정·최면 효능을 가진 표적 약물(파약靶藥, 백합· 진주모·산조인 등)을 유기적으로 결합하여 치료함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 고침무우탕과 골격이 겹치므로 두 처방을 함께 비교하는 연구로 효율을 높일 수 있음 참고문헌 [1] 쑹둥훙,린전,양젠위.국의대사 쑨광룽의 중화사상과 화중운비 이론에 기반한 조기활혈안혼탕의 불면 치료基於國醫大師孫光榮中和思想與和中運脾理論運用調氣活血安魂湯治療不寐[J].허난중의河南中醫,2026,46(2):258-264."}},{"id":"4-9","ko":"가미통기산","hz":"加味通氣散","alias":"","master_ko":"장즈위안","master_hz":"張志遠","tagline":"청기淸氣의 승발, 기혈의 소통, 청규淸竅와 현부玄府의 개통으로, 이명耳鳴 및 이롱耳聾을 치료하는 처방","meta":{"주요 적응증":"이명, 난청","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":252,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-9 가미통기산加味通氣散의 모듈 구성<\/p><h4>①승산개규升散開竅, 소창기기疏暢氣機 모듈 — 기기를 소통시키고 청기를 끌어올려 규竅를 열어줌<\/h4><p><b>시호<\/b>: 성질이 승산하여 소양경과 궐음경의 기기를 소통시키며, 청기淸氣를 끌어올리고 규를 여는 이명·이롱 치료의 요약要藥임<\/p><p><b>석창포<\/b>: 방향芳香의 성질로 구규九竅를 통하게 하고 이목을 밝게 하며, 시호와 함께 이규현부耳竅玄府를 개통함<\/p><h4>②행기활혈行氣活血, 거어생신祛瘀生新 모듈 — 기를 소통시키고 어혈을 제거하여 새로운 혈액의 생성을 촉진함<\/h4><p><b>단삼<\/b>: 혈액을 순환시키고 어혈을 없애며 새로운 혈액이 생성되도록 도움<\/p><p><b>천궁<\/b>: 혈중의 기약血中之氣藥으로서 승발하여 발산하는 성질이 있어 온갖 풍을 없애고 기를 조절하며, 현부를 여는 기초 약물인 풍약風藥의 역할을 겸함<\/p><p><b>향부자<\/b>: 간기를 소통시키고 소설疏泄을 돕는 이기서간理氣舒肝 효능이 있어, 무형의 기를 소설창달疏泄暢達하고 기의 운행을 통해 활혈을 촉진함<\/p>"},{"k":"master","t":"장즈위안의 이명, 이롱 치료","html":"<h4>①병인병기 이론<\/h4><p><b>현부玄府 개념의 귀 질환耳科 적용<\/b>: 《내경》에서 원래 땀구멍을 뜻하던 ‘현부’는 금대 유하간劉河間에 이르러 온몸에 미치지 않는 곳이 없는 무처불도無處不到하는 기기 승강출입 활동의 구조적 기초 개념으로 확장됨. 대사는 이를 귀 질환 치료에 접목하여 ‘이과현부설耳科玄府說’을 정립함<\/p><p><b>청호현부聽戶玄府의 옹폐와 이명·이롱<\/b>: 《소문현기원병식素問玄機原病式》의 이론에 근거하여, 수쇠화실水衰火實로 인해 열이 상초에 울체되거나 맥기脈氣가 흘러도 귀에서 발산되지 못하면, 청기淸氣와 신기神氣가 선통하지 못하고, 소리를 듣는 문인 ‘청호현부聽戶玄府’가 막히게 되어 이명과 이롱이 발생한다고 봄<\/p><h4>②가미통기산의 치료 원칙 및 효능 해설<\/h4><p><b>치료의 핵심은 ‘통通’<\/b>: 본 병은 허실의 구분이 있고 치료의 보사補瀉가 다르나, 궁극적인 요체는 오직 하나의 ‘통通’자에 있음. 즉, 막힌 청호현부를 개통하여 정기가 원활히 흐르게 해야 귀가 자양되어 증상이 저절로 멎게 됨<\/p><p><b>풍약風藥의 신승발산辛升發散과 현부 개통<\/b>: “높은 정수리 위에는 오직 풍만이 이를 수 있다高顚之上, 唯風可到”는 원리에 따라, 시호와 천궁 같은 풍약 성분의 신승발산 및 유통 특성을 활용하여 미세한 조직인 현부를 효과적으로 개통함. 이는 단순한 활혈거어活血祛瘀 약의 투여와는 차별화되는 고유의 약리적 작용을 발휘함<\/p><p><b>기혈 조화와 현부 상시 개통<\/b>: 행기行氣하는 향부자와 활혈거어하는 단삼, 천궁을 배합하여 기혈을 조화롭게 하고, 현부가 항상 열려 있도록 함<\/p><h4>③현대 의학적 미세순환과의 상관성 및 약리 기전<\/h4><p><b>현부 폐색과 내이 미세순환 장애의 동등성<\/b>: 현대 의학의 내이 미세순환 장애(혈관 경련, 혈전 형성, 국소 허혈 및 산소 공급 부족)는 중의학의 현부 폐색 병리와 상관성이 있다고 봄<\/p><p><b>가미통기산의 미세순환 개선 효과<\/b>: 가미통기산은 미세순환을 개선하고 혈류량을 높여 내이 조직의 산소 공급을 돕고 손상된 조직의 회복을 촉진한다고 설명함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">이명·난청은 국내 한의·한방 치료 수요가 크나 이 처방은 근거가 1편뿐이므로 증례 축적이 우선<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 정궈칭.이과 현부설 및 가미통기산의 현부 개통 미세순환 기전-장즈위안 학술 경험 시리즈(1)耳科玄府說及加味通氣散開通玄府的微循環機制-張志遠學術經驗系列(一)[J].중의약학간中醫藥學刊,2006,(1):18-20.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"시호9~15g","name":"시호","dose":"9~15g","base":"시호"},{"raw":"석창포9~15g","name":"석창포","dose":"9~15g","base":"석창포"},{"raw":"향부자12~18g","name":"향부자","dose":"12~18g","base":"향부자"},{"raw":"천궁9~15g","name":"천궁","dose":"9~15g","base":"천궁"},{"raw":"단삼15~30g","name":"단삼","dose":"15~30g","base":"단삼"}],"notes":[],"핵심 효능":["기와 혈을 원활하게 소통시켜 막힌 규竅를 열어줌(행기활혈통규行氣活血通竅)","이규耳竅와 미세 구조인 현부玄府를 열어 청규를 자양함(개통이규현부開通耳竅玄府)"],"주치증":["이명耳鳴, 이롱耳聾 등 각종 귀 질환"],"연구 확장 영역":["돌발성 난청, 소음성 난청, 노인성 난청, 내이內耳 미세순환 장애 관련 질환 등"],"R&D 포인트":["시호, 천궁 등 풍약風藥의 미세순환 개선 작용을 통한 현부玄府 개통 기전 분석","가미통기산의 내이 미세순환 개선, 혈류량 증가 및 조직 산소 공급 효과 연구","중의학의 ‘현부玄府’ 이론과 현대 의학의 ‘내이 미세순환 장애’ 병리 기전 간의 상관성 검증"]},"modules":[{"name":"①승산개규 · 소창기기","hz":"升散開竅 · 疏暢氣機","herbs":["시호","석창포"],"role":"기기를 소통시키고 청기를 끌어올려 규竅를 열어줌"},{"name":"②행기활혈 · 거어생신","hz":"行氣活血 · 祛瘀生新","herbs":["단삼","천궁","향부자"],"role":"기를 소통시키고 어혈을 제거하여 새로운 혈액의 생성을 촉진함"}],"rd":[{"tag":"Tinnitus","title":"만성 이명의 이명 장애 지수","html":"<p><b>근거<\/b> 가 2006년 학술 경험 1편임<\/p><p>만성 이명 환자에서 이명 장애 지수(THI)와 청력 검사 변화를 정리하는 증례 분석으로 효과 신호를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2006, 이과 현부설과 가미통기산))<\/p>"},{"tag":"Sudden Hearing Loss","title":"돌발성 난청 표준치료 병용","html":"<p>돌발성 난청은 즉시 청력검사와 스테로이드 표준치료가 필요한 질환임<\/p><p>치료가 지연되지 않는 조건에서만 병용을 검토하고, ‘현부 개통’과 와우 혈류 장애의 연결은 직접 근거가 없는 가설임을 전제로 청력 회복률을 비교 (근거 유형: 임상 경험 보고 | 근거: R&amp;D 논리 2·3, 참고문헌 [1])<\/p>"},{"tag":"Cochlear Protection","title":"단삼·천궁의 와우 산화 손상 보호","html":"<p>소음 또는 약물 유발 청력 손상 모델에서 와우 유모세포 보존과 산화 스트레스 지표를 측정함<\/p><p><b>이로써 활혈 약재의 와우 보호 효과를 확인 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 3 「이과현부설과 폐색 치료」)<\/p>"},{"tag":"Simple Formula","title":"5종 간결 처방의 제제화 이점","html":"<p>시호·석창포·향부자·천궁·단삼 5종의 간결한 구성이어서 지표성분(살비아놀산· 사이코사포닌 등) 표준화와 과립화가 쉬움<\/p><p><b>제제 개발을 빠르게 시작할 수 있는 후보 (근거 유형<\/b>: 신규 연구가설 | 근거: 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"승산개규升散開竅와 현부개통玄府開通","body":"기기를 부드럽게 소통시키고 청기를 끌어올려 이규와 현부를 열어줌"},{"n":"2","title":"행기활혈行氣活血과 거어생신祛瘀生新","body":"기를 소통시키고 어혈을 풀어 새로운 혈액이 살아나도록 함"},{"n":"3","title":"이과현부설耳科玄府說과 폐색閉塞 치료","body":"청기가 통하지 못해 막힌 청호현부를 열어 이명과 이롱을 치료함"},{"n":"4","title":"풍약신승風藥辛升과 경락통행經絡通行","body":"신승발산의 성질을 활용하여 머리와 귀의 미세 구조인 현부에 도달하여 소통시킴"}],"field":4,"pages":[252,255],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["4-9","가미통기산","加味通氣散","","장즈위안","張志遠","청기淸氣의 승발, 기혈의 소통, 청규淸竅와 현부玄府의 개통으로, 이명耳鳴 및 이롱耳聾을 치료하는 처방","시호9~15g 석창포9~15g 향부자12~18g 천궁9~15g 단삼15~30g","","핵심 효능 기와 혈을 원활하게 소통시켜 막힌 규竅를 열어줌(행기활혈통규行氣活血通竅) 이규耳竅와 미세 구조인 현부玄府를 열어 청규를 자양함(개통이규현부開通耳竅玄府)","주치증 이명耳鳴, 이롱耳聾 등 각종 귀 질환","연구 확장 영역 돌발성 난청, 소음성 난청, 노인성 난청, 내이內耳 미세순환 장애 관련 질환 등","R&D 포인트 시호, 천궁 등 풍약風藥의 미세순환 개선 작용을 통한 현부玄府 개통 기전 분석 가미통기산의 내이 미세순환 개선, 혈류량 증가 및 조직 산소 공급 효과 연구 중의학의 ‘현부玄府’ 이론과 현대 의학의 ‘내이 미세순환 장애’ 병리 기전 간의 상관성 검증","①승산개규 · 소창기기 升散開竅 · 疏暢氣機 시호 석창포 기기를 소통시키고 청기를 끌어올려 규竅를 열어줌","②행기활혈 · 거어생신 行氣活血 · 祛瘀生新 단삼 천궁 향부자 기를 소통시키고 어혈을 제거하여 새로운 혈액의 생성을 촉진함","승산개규升散開竅와 현부개통玄府開通 기기를 부드럽게 소통시키고 청기를 끌어올려 이규와 현부를 열어줌","행기활혈行氣活血과 거어생신祛瘀生新 기를 소통시키고 어혈을 풀어 새로운 혈액이 살아나도록 함","이과현부설耳科玄府說과 폐색閉塞 치료 청기가 통하지 못해 막힌 청호현부를 열어 이명과 이롱을 치료함","풍약신승風藥辛升과 경락통행經絡通行 신승발산의 성질을 활용하여 머리와 귀의 미세 구조인 현부에 도달하여 소통시킴","Tinnitus 만성 이명의 이명 장애 지수 근거 가 2006년 학술 경험 1편임 만성 이명 환자에서 이명 장애 지수(THI)와 청력 검사 변화를 정리하는 증례 분석으로 효과 신호를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2006, 이과 현부설과 가미통기산))","Sudden Hearing Loss 돌발성 난청 표준치료 병용 돌발성 난청은 즉시 청력검사와 스테로이드 표준치료가 필요한 질환임 치료가 지연되지 않는 조건에서만 병용을 검토하고, ‘현부 개통’과 와우 혈류 장애의 연결은 직접 근거가 없는 가설임을 전제로 청력 회복률을 비교 (근거 유형: 임상 경험 보고 | 근거: R&D 논리 2·3, 참고문헌 [1])","Cochlear Protection 단삼·천궁의 와우 산화 손상 보호 소음 또는 약물 유발 청력 손상 모델에서 와우 유모세포 보존과 산화 스트레스 지표를 측정함 이로써 활혈 약재의 와우 보호 효과를 확인 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 3 「이과현부설과 폐색 치료」)","Simple Formula 5종 간결 처방의 제제화 이점 시호·석창포·향부자·천궁·단삼 5종의 간결한 구성이어서 지표성분(살비아놀산· 사이코사포닌 등) 표준화와 과립화가 쉬움 제제 개발을 빠르게 시작할 수 있는 후보 (근거 유형 : 신규 연구가설 | 근거: 본문 조성표)"],"ss":{"composition":"그림 4-9 가미통기산加味通氣散의 모듈 구성 ①승산개규升散開竅, 소창기기疏暢氣機 모듈 — 기기를 소통시키고 청기를 끌어올려 규竅를 열어줌 시호 : 성질이 승산하여 소양경과 궐음경의 기기를 소통시키며, 청기淸氣를 끌어올리고 규를 여는 이명·이롱 치료의 요약要藥임 석창포 : 방향芳香의 성질로 구규九竅를 통하게 하고 이목을 밝게 하며, 시호와 함께 이규현부耳竅玄府를 개통함 ②행기활혈行氣活血, 거어생신祛瘀生新 모듈 — 기를 소통시키고 어혈을 제거하여 새로운 혈액의 생성을 촉진함 단삼 : 혈액을 순환시키고 어혈을 없애며 새로운 혈액이 생성되도록 도움 천궁 : 혈중의 기약血中之氣藥으로서 승발하여 발산하는 성질이 있어 온갖 풍을 없애고 기를 조절하며, 현부를 여는 기초 약물인 풍약風藥의 역할을 겸함 향부자 : 간기를 소통시키고 소설疏泄을 돕는 이기서간理氣舒肝 효능이 있어, 무형의 기를 소설창달疏泄暢達하고 기의 운행을 통해 활혈을 촉진함","master":"①병인병기 이론 현부玄府 개념의 귀 질환耳科 적용 : 《내경》에서 원래 땀구멍을 뜻하던 ‘현부’는 금대 유하간劉河間에 이르러 온몸에 미치지 않는 곳이 없는 무처불도無處不到하는 기기 승강출입 활동의 구조적 기초 개념으로 확장됨. 대사는 이를 귀 질환 치료에 접목하여 ‘이과현부설耳科玄府說’을 정립함 청호현부聽戶玄府의 옹폐와 이명·이롱 : 《소문현기원병식素問玄機原病式》의 이론에 근거하여, 수쇠화실水衰火實로 인해 열이 상초에 울체되거나 맥기脈氣가 흘러도 귀에서 발산되지 못하면, 청기淸氣와 신기神氣가 선통하지 못하고, 소리를 듣는 문인 ‘청호현부聽戶玄府’가 막히게 되어 이명과 이롱이 발생한다고 봄 ②가미통기산의 치료 원칙 및 효능 해설 치료의 핵심은 ‘통通’ : 본 병은 허실의 구분이 있고 치료의 보사補瀉가 다르나, 궁극적인 요체는 오직 하나의 ‘통通’자에 있음. 즉, 막힌 청호현부를 개통하여 정기가 원활히 흐르게 해야 귀가 자양되어 증상이 저절로 멎게 됨 풍약風藥의 신승발산辛升發散과 현부 개통 : “높은 정수리 위에는 오직 풍만이 이를 수 있다高顚之上, 唯風可到”는 원리에 따라, 시호와 천궁 같은 풍약 성분의 신승발산 및 유통 특성을 활용하여 미세한 조직인 현부를 효과적으로 개통함. 이는 단순한 활혈거어活血祛瘀 약의 투여와는 차별화되는 고유의 약리적 작용을 발휘함 기혈 조화와 현부 상시 개통 : 행기行氣하는 향부자와 활혈거어하는 단삼, 천궁을 배합하여 기혈을 조화롭게 하고, 현부가 항상 열려 있도록 함 ③현대 의학적 미세순환과의 상관성 및 약리 기전 현부 폐색과 내이 미세순환 장애의 동등성 : 현대 의학의 내이 미세순환 장애(혈관 경련, 혈전 형성, 국소 허혈 및 산소 공급 부족)는 중의학의 현부 폐색 병리와 상관성이 있다고 봄 가미통기산의 미세순환 개선 효과 : 가미통기산은 미세순환을 개선하고 혈류량을 높여 내이 조직의 산소 공급을 돕고 손상된 조직의 회복을 촉진한다고 설명함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 이명·난청은 국내 한의·한방 치료 수요가 크나 이 처방은 근거가 1편뿐이므로 증례 축적이 우선 참고문헌 [1] 정궈칭.이과 현부설 및 가미통기산의 현부 개통 미세순환 기전-장즈위안 학술 경험 시리즈(1)耳科玄府說及加味通氣散開通玄府的微循環機制-張志遠學術經驗系列(一)[J].중의약학간中醫藥學刊,2006,(1):18-20."}},{"id":"4-10","ko":"백맥안신음","hz":"百麥安神飮","alias":"","master_ko":"루즈정","master_hz":"路志正","tagline":"심음부족心陰不足, 기음양허氣陰兩虛로 인한 신경증, 범불안장애를 치료하는 처방","meta":{"주요 적응증":"신경증, 범불안장애, 갱년기 증후군","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":256,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-10 백맥안신음百麥安神飮의 모듈 구성<\/p><h4>①익기화영益氣和營, 완급지통緩急止痛 모듈 — 심비의 기혈을 보하고 장조臟躁의 급박한 증상을 완화함<\/h4><p><b>소맥<\/b>: 간경의 객열을 끄고 심음心陰을 기르며 장조를 완화시킴<\/p><p><b>감초<\/b>: 비기를 보하고 위를 조화롭게 하며 심화心火를 사하고 완급지통함<\/p><p><b>대조<\/b>: 기를 보하고 비위 기능을 도우며 혈을 길러 마음을 편안하게 함<\/p><h4>②양음청열養陰淸熱, 안신정지安神定志 모듈 — 음혈을 자양하고 허열을 끄며 정신을 안정시킴<\/h4><p><b>백합<\/b>: 성질이 미한微寒하여 내부에 쌓인 허열을 내리고 심신을 안정시키며 백합병 치료의 요약要藥임<\/p><p><b>연자육<\/b>: 비를 보하고 마음을 안정시키며 양혈화영養血和營을 도움<\/p><p><b>야교등<\/b>: 심신을 맑게 하고 경락을 소통시키며 안신정지 효능을 더함<\/p>"},{"k":"master","t":"루즈정의 신경증 치료","html":"<h4>①병인병기 이론<\/h4><p><b>질환의 범주<\/b>: ‘울증鬱證’, ‘허로虛勞’, ‘백합병百合病’, ‘장조臟躁’, ‘궐증厥證’, ‘매핵기梅核氣’ 등의 범주에 속하며, 양의학의 신경쇠약, 신경증, 갱년기 증후군 및 범불안장애 등과 유사함<\/p><p><b>발병 기전<\/b>: 현대 사회의 극심한 스트레스와 칠정七情의 손상으로 인해 발생하며, 주로 사려思慮 과다로 심음心陰이 소모되거나, 구병으로 음혈이 고갈되어 심신을 영양하지 못해 발생함. 또한 노심상비勞心傷脾로 기혈이 허손되고 심신이 불안정해지거나, 습열내울濕熱內鬱로 간의 소설과 비의 운화가 실조되어 심·간·비·폐·신 등의 장부 음양기혈이 실조되는 것이 핵심 병기임<\/p><p><b>허다사소虛多邪少의 특성<\/b>: 본 병은 주로 허증이 많으며, 사려과다로 심음이 손상되고 간기가 화목하지 못해 정신황홀, 수면불안, 탄식, 비상욕곡悲傷欲哭 등의 증상이 나타남<\/p><h4>②백맥안신음의 치료 원칙 및 효능 해설<\/h4><p><b>《금궤요략》 처방의 융합과 응용<\/b>: 《금궤요략》의 ‘감맥대조탕’과 ‘백합탕’의 방의方意를 취하여 구성함. 《소문素問· 장기법시론藏氣法時論》의 “간고급肝苦急, 급식감이완지急食甘以緩之” 및 《영추靈樞·오미五味》의 “심병자의식맥心病者宜食麥”의 취지에 근거하여 소맥, 대조, 감초를 배합함<\/p><p><b>양음養陰 위주의 본치本治와 안신安神<\/b>: 백합의 미한微寒한 성질로 허열을 끄고, 소맥, 연자육, 야교등, 대조를 더해 양심음養心陰, 익심기益心氣, 청허열淸虛熱, 완급緩急, 안신정지安神定志의 효능을 발휘함. 약물 구성을 양음養陰<\/p><p>위주로 하여 근본을 다스리고, 안신약재를 보조로 하여 심신을 안정시킴<\/p><h4>③임상 변증 요령 및 가감 주의점<\/h4><p><b>전형적 증후<\/b>: 신지불녕神志不寧, 정신황홀精神恍惚, 비상욕곡悲傷欲哭, 불능자주不能自主, 심번이조心煩易躁, 실면다몽失眠多夢(불면·꿈이 많음), 심계기단心悸氣短, 다한多汗, 맥세삭무력脈細數無力 등을 보이면서 심음부족心陰不足, 허열내요虛熱內擾 또는 기음양허氣陰兩虛, 심신실양心神失養에 속하는 경우에 적용함<\/p><p>겸증 가감:<\/p><p class=\"sub\"><b>기울氣鬱이 있을 때<\/b>: 합환화 가미<\/p><p class=\"sub\"><b>담탁痰濁이 있을 때<\/b>: 죽여, 생강 가미<\/p><p class=\"sub\"><b>습조濕阻가 있을 때<\/b>: 곽경藿梗, 하경荷梗 가미<\/p><p class=\"sub\"><b>간혈허肝血虛가 있을 때<\/b>: 산조인, 당귀 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품·신약 임상은 없음. 같은 이름의 ‘백맥안신’ 탕·음료 특허가 개인 명의로 공개되어 있으나 대사와의 관련은 확인되지 않음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">식품 겸용 약재가 많지만 식품 사용 경험이 의약품 장기 안전성이나 건강기능식품 기능성 인정을 뜻하지는 않으므로 별도 검토가 필요하며, 동명 특허가 있어 국내 출원 시 조성 차이를 명확히 해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 줘즈밍,쩌우진산,천리쥐안.백맥안신음의 범불안장애 보조 치료 효과百麥安神飮對廣泛性焦慮障礙的輔助治療作用[J].임상정신의학잡지臨床精神醫學雜志,2010,20(5):331-332.<\/li><li class=\"ref\">[2] 천리칭.백맥안신음의 신경증 치료百麥安神飮治療神經官能症[J].대중건강(학술판)大家健康(學術版),2014,8(20):41.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"백합30g","name":"백합","dose":"30g","base":"백합"},{"raw":"淮소맥30g","name":"淮소맥","dose":"30g","base":"소맥"},{"raw":"연자육15g","name":"연자육","dose":"15g","base":"연자육"},{"raw":"대조10g","name":"대조","dose":"10g","base":"대조"},{"raw":"야교등15g","name":"야교등","dose":"15g","base":"야교등"},{"raw":"감초6g","name":"감초","dose":"6g","base":"감초"}],"notes":[],"핵심 효능":["심비心脾의 기와 심음心陰을 함께 보충함(익기양음益氣養陰)","체내의 허열을 식히고 정신을 안정시킴(청열안신淸熱安神)"],"주치증":["신경쇠약, 신경증, 범불안장애, 갱년기 증후군 등"],"연구 확장 영역":["신경증, 범불안장애, 우울증, 갱년기 증후군, 만성 피로 증후군 등"],"R&D 포인트":["감맥대조탕과 백합탕의 방의方意 융합 기전 분석","심음부족 및 허열내요虛熱內擾 병리 모델에 대한 양심음養心陰, 청허열淸虛熱 작용 검증","신경증 및 범불안장애 환자의 임상 유효성 및 복약 순응도 변화 평가"]},"modules":[{"name":"①익기화영 · 완급지통","hz":"益氣和營 · 緩急止痛","herbs":["소맥","감초","대조"],"role":"심비의 기혈을 보하고 장조臟躁의 급박한 증상을 완화함"},{"name":"②양음청열 · 안신정지","hz":"養陰淸熱 · 安神定志","herbs":["백합","연자육","야교등"],"role":"음혈을 자양하고 허열을 끄며 정신을 안정시킴"}],"rd":[{"tag":"Generalized Anxiety","title":"범불안장애의 보조 치료","html":"<p>범불안장애 보조 치료 효과를 보고한 임상 연구가 있음<\/p><p>항불안제 병용 시 HAMA 점수 변화와 약물 감량 가능성을 지표로 한 무작위 대조 임상으로 재현 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](2010, 범불안장애 보조 치료 효과))<\/p>"},{"tag":"Food-grade Herbs","title":"식품 겸용 약재 구성과 장기 복용 안전성 확인","html":"<p>백합·소맥·연자육·대조·감초 등 식품으로도 쓰이는 약재가 많지만, 식품 사용 경험과 의약품으로서의 장기 복용 안전성, 건강기능식품 기능성 인정은 서로 다른 검토 사항임<\/p><p>감초의 가성알도스테론증(저칼륨혈증·고혈압)을 포함한 장기 안전성 자료를 먼저 확보 (근거 유형: 간접 근거 | 근거: 본문 조성표)<\/p>"},{"tag":"Formula Fusion","title":"감맥대조탕·백합탕 융합의 차별성","html":"<p>감맥대조탕과 백합탕을 합친 구성임<\/p><p>각 원방 대비 불안·불면 개선 효과를 비교하여 융합 처방의 추가 이득을 확인 (근거 유형: 간접 근거 | 근거: R&amp;D 논리 3 「방의융합과 허열내요 제어」)<\/p>"},{"tag":"Menopause","title":"갱년기 증후군의 정서·수면 증상","html":"<p>주치에 갱년기 증후군이 포함되어 있음<\/p><p>갱년기 여성의 불안·불면·홍조를 Kupperman 지수로 평가하는 탐색 임상으로 적응증 확장 가능성을 확인 (근거 유형: 임상 경험 보고 | 근거: 본문 주치증, 참고문헌[2](2014, 신경증 치료))<\/p>"}],"logic":[{"n":"1","title":"익기양음益氣養陰과 심비기혈心脾氣血 보충","body":"심비의 기를 보하고 심음을 기르며 장조臟躁의 급박한 증상을 완화함"},{"n":"2","title":"청열안신淸熱安神과 양음정지養陰定志","body":"내부에 쌓인 허열을 내리고 음혈을 자양하여 정신을 고요하게 안정시킴"},{"n":"3","title":"방의융합方意融合과 허열내요虛熱內擾 제어","body":"감맥대조탕과 백합탕의 방의를 융합하여 양심음과 청허열을 도모함"},{"n":"4","title":"허다사소虛多邪少와 양음본치養陰本治","body":"허증 위주의 병태에 대해 양음보양을 근본으로 삼고 안신을 보조하여 다스림"}],"field":4,"pages":[256,259],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["4-10","백맥안신음","百麥安神飮","","루즈정","路志正","심음부족心陰不足, 기음양허氣陰兩虛로 인한 신경증, 범불안장애를 치료하는 처방","백합30g 淮소맥30g 연자육15g 대조10g

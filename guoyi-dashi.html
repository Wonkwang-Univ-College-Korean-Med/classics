이 허손되고 심신이 불안정해지거나, 습열내울濕熱內鬱로 간의 소설과 비의 운화가 실조되어 심·간·비·폐·신 등의 장부 음양기혈이 실조되는 것이 핵심 병기임 허다사소虛多邪少의 특성 : 본 병은 주로 허증이 많으며, 사려과다로 심음이 손상되고 간기가 화목하지 못해 정신황홀, 수면불안, 탄식, 비상욕곡悲傷欲哭 등의 증상이 나타남 ②백맥안신음의 치료 원칙 및 효능 해설 《금궤요략》 처방의 융합과 응용 : 《금궤요략》의 ‘감맥대조탕’과 ‘백합탕’의 방의方意를 취하여 구성함. 《소문素問· 장기법시론藏氣法時論》의 “간고급肝苦急, 급식감이완지急食甘以緩之” 및 《영추靈樞·오미五味》의 “심병자의식맥心病者宜食麥”의 취지에 근거하여 소맥, 대조, 감초를 배합함 양음養陰 위주의 본치本治와 안신安神 : 백합의 미한微寒한 성질로 허열을 끄고, 소맥, 연자육, 야교등, 대조를 더해 양심음養心陰, 익심기益心氣, 청허열淸虛熱, 완급緩急, 안신정지安神定志의 효능을 발휘함. 약물 구성을 양음養陰 위주로 하여 근본을 다스리고, 안신약재를 보조로 하여 심신을 안정시킴 ③임상 변증 요령 및 가감 주의점 전형적 증후 : 신지불녕神志不寧, 정신황홀精神恍惚, 비상욕곡悲傷欲哭, 불능자주不能自主, 심번이조心煩易躁, 실면다몽失眠多夢(불면·꿈이 많음), 심계기단心悸氣短, 다한多汗, 맥세삭무력脈細數無力 등을 보이면서 심음부족心陰不足, 허열내요虛熱內擾 또는 기음양허氣陰兩虛, 심신실양心神失養에 속하는 경우에 적용함 겸증 가감: 기울氣鬱이 있을 때 : 합환화 가미 담탁痰濁이 있을 때 : 죽여, 생강 가미 습조濕阻가 있을 때 : 곽경藿梗, 하경荷梗 가미 간혈허肝血虛가 있을 때 : 산조인, 당귀 가미","rd":"","china":"중국 제품화 현황 허가 제품·신약 임상은 없음. 같은 이름의 ‘백맥안신’ 탕·음료 특허가 개인 명의로 공개되어 있으나 대사와의 관련은 확인되지 않음 시사점 식품 겸용 약재가 많지만 식품 사용 경험이 의약품 장기 안전성이나 건강기능식품 기능성 인정을 뜻하지는 않으므로 별도 검토가 필요하며, 동명 특허가 있어 국내 출원 시 조성 차이를 명확히 해야 함 참고문헌 [1] 줘즈밍,쩌우진산,천리쥐안.백맥안신음의 범불안장애 보조 치료 효과百麥安神飮對廣泛性焦慮障礙的輔助治療作用[J].임상정신의학잡지臨床精神醫學雜志,2010,20(5):331-332. [2] 천리칭.백맥안신음의 신경증 치료百麥安神飮治療神經官能症[J].대중건강(학술판)大家健康(學術版),2014,8(20):41."}},{"id":"5-1","ko":"소황지해탕","hz":"蘇黃止咳湯","alias":"","master_ko":"차오언샹","master_hz":"晁恩祥","tagline":"기도 과민반응을 완화하고 경련성 기침을 조절하는 호흡기 난치 질환의 전략 처방","meta":{"주요 적응증":"기침 이형 천식, 감염 후 기침","확인된 연구자료 유형":"연구 축적 (논문 471편)","제형·제품화":"캡슐(중성약, 9미)·과립 3상"},"page":261,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-1 소황지해탕蘇黃止咳湯의 모듈 구성<\/p><h4>①완급해경緩急解痙 모듈 — 기관지 경련 및 과민성 차단<\/h4><p><b>지룡, 선퇴<\/b>: 예민해진 기관지의 경련을 풀고, 외부 자극에 민감하게 반응하여 발생하는 기침을 해소<\/p><p><b>오미자<\/b>: 과도하게 발산되는 기운을 모으고, 기관지 점막을 윤택하게 하여 오래된 기침을 멈춤<\/p><h4>②선폐강기宣肺降氣 모듈 — 폐기의 조절<\/h4><p><b>마황<\/b>: 폐 기운을 열어 기도를 확장<\/p><p><b>행인<\/b>: 마황의 선발 작용을 조율하며, 치솟은 폐기를 아래로 내리고 가래를 삭임<\/p><p><b>자소자, 자완, 전호, 비파엽<\/b>: 치솟는 기침 기운을 아래로 내리고 점액 배출을 도움<\/p><h4>③소풍리인疏風利咽 모듈 — 상기도 자극인자 제거 및 인후 소통<\/h4><p><b>자소엽<\/b>: 마황의 발산 작용을 도와 풍사風邪를 흩어내며, 자소자의 강기降氣 작용과 조화를 이뤄 폐기의 승강升降 순환을 완성<\/p><p><b>우방자<\/b>: 인후부의 감각신경 민감도를 낮추어 ‘간질거리는 기침’의 연쇄 고리를 차단<\/p>"},{"k":"data","t":"임상 데이터 기반의 처방 표준화 근거","html":"<p><b>데이터 분석<\/b> : 100여 건의 선행 연구와 임상 데이터를 마이닝한 결과, 자완(1위), 지룡(2위), 행인(3위) 순으로 높은 사용 빈도를 보임<\/p><p><b>통계적 시사점<\/b> : 다빈도 약재 상위 15종 가운데 자완, 지룡, 행인, 자소엽, 오미자, 선퇴, 자소자, 비파엽, 우방자, 마황, 전호 등 소황지해탕 구성 약재와 중첩되는 약재가 다수 확인됨. 이는 소황지해탕이 대사의 만성 기침 치료 경험을 대표적으로 반영한 처방임을 보여주는 근거로 볼 수 있음<\/p><div class=\"chart\"><p class=\"cap\">사용 빈도 상위 약재(막대: 짙은 색 = 처방 구성 약재)<\/p><div class=\"bar own\"><span>자완<\/span><i style=\"width:100.0%\"><\/i><b>819<\/b><\/div><div class=\"bar own\"><span>지룡<\/span><i style=\"width:99.6%\"><\/i><b>816<\/b><\/div><div class=\"bar own\"><span>행인<\/span><i style=\"width:99.5%\"><\/i><b>815<\/b><\/div><div class=\"bar own\"><span>자소엽<\/span><i style=\"width:98.4%\"><\/i><b>806<\/b><\/div><div class=\"bar\"><span>감초<\/span><i style=\"width:97.7%\"><\/i><b>800<\/b><\/div><div class=\"bar own\"><span>오미자<\/span><i style=\"width:97.7%\"><\/i><b>800<\/b><\/div><div class=\"bar own\"><span>선퇴<\/span><i style=\"width:97.7%\"><\/i><b>800<\/b><\/div><div class=\"bar own\"><span>자소자<\/span><i style=\"width:94.4%\"><\/i><b>773<\/b><\/div><div class=\"bar own\"><span>비파엽<\/span><i style=\"width:91.7%\"><\/i><b>751<\/b><\/div><div class=\"bar own\"><span>우방자<\/span><i style=\"width:87.4%\"><\/i><b>716<\/b><\/div><div class=\"bar own\"><span>마황<\/span><i style=\"width:84.5%\"><\/i><b>692<\/b><\/div><div class=\"bar\"><span>백과<\/span><i style=\"width:60.2%\"><\/i><b>493<\/b><\/div><div class=\"bar\"><span>절패모<\/span><i style=\"width:52.1%\"><\/i><b>427<\/b><\/div><div class=\"bar\"><span>산수유<\/span><i style=\"width:35.8%\"><\/i><b>293<\/b><\/div><div class=\"bar own\"><span>전호<\/span><i style=\"width:31.3%\"><\/i><b>256<\/b><\/div><\/div>"},{"k":"master","t":"차오언샹의 ‘풍해風咳’ 치료 시스템","html":"<p class=\"quote\">“풍해는 단순한 염증성 기침이 아닌, 기도의 과민성이 극대화된 상태”<\/p><p><b>현대적 매핑<\/b> : 기침 이형 천식, 상기도 감염 후 기침, 상기도 기침 증후군<\/p><p><b>R&amp;D 타깃<\/b> : 기침 반사궁(Cough Reflex Arc)의 감각신경 과민성 및 기침 역치(Cough Threshold)<\/p><h4>①임상적 표현형 (Clinical Phenotype)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>주요 특징<\/th><th>객관적 평가지표<\/th><\/tr><\/thead><tbody><tr><td>유발 요인<\/td><td>찬 공기, 대화, 웃음, 냄새, 담배 연기<\/td><td>Airway Hyper-reactivity<\/td><\/tr><tr><td>감각 양상<\/td><td>참을 수 없는 인후부의 가려움 (기침의 전구 증상)<\/td><td>TRP Channel (TRPV1, TRPA1)<\/td><\/tr><tr><td>기침 양상<\/td><td>가래 없는 마른기침, 본인 의지로 억제 불가(경련성)<\/td><td>Cough Frequency &amp; Intensity<\/td><\/tr><tr><td>동반 증상<\/td><td>코막힘, 콧물, 인후통 (알레르기 비염 동반 빈도 높음)<\/td><td>Allergic Rhinitis Comorbidity<\/td><\/tr><\/tbody><\/table><\/div><h4>②맞춤형 치료 전략<\/h4><div class=\"tbl\"><table><thead><tr><th>전략 모듈<\/th><th>임상 상황<\/th><th>핵심 치법 및 대응 약재<\/th><\/tr><\/thead><tbody><tr><td>[Module A] 원인 차단<\/td><td>외감(감기) 및 환경 자극 찬 공기, 건조함 등 외부 요인이 뚜렷할 때<\/td><td>· <b>산풍散風<\/b>: 마황, 선퇴, 지룡<br>· <b>한·열·조 조절<\/b>: 소엽, 금은화, 맥문동 등<\/td><\/tr><tr><td>[Module B] 증상 제어<\/td><td>발작적 기침, 인후 과민성 기도 경련과 목의 가려움이 극심할 때<\/td><td>· <b>해경解痙<\/b>: 지룡, 전갈, 오미자<br>· <b>리인利咽<\/b>: 우방자, 사간, 길경<br>· <b>선폐宣肺<\/b>: 자완, 행인<\/td><\/tr><tr><td>[Module C] 근본 조절<\/td><td>만성 기침 및 전신 허약 스트레스성 기침이나 기운 소모가 심할 때<\/td><td>· <b>평간平肝<\/b>: 지룡, 구등, 국화<br>· <b>보익補益<\/b>: 오미자, 산수유, 태자삼<\/td><\/tr><\/tbody><\/table><\/div>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모 및 정량적 위상<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 471 편 발표(소황지해탕 및 소황지해캡슐 관련, 대부분 9미 캡슐 연구)<\/td><td>최근 5 년간 143편 발표(과립 제3상 CTR20250655 진행 중)<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><p>* 최근 5년 연구 키워드는 증상 개선 외에 면역·신경 조절 기전으로 넓어지고 있음<\/p><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">CVA(기침 이형 천식)<\/span> <span class=\"kw\">AECOPD<\/span><\/td><td>천식 급성기 및 만성 기침 관리의 보조 요법으로 연구가 집중됨<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">ICS/LABA(흡입제)<\/span> <span class=\"kw\">몬테루카스트<\/span><\/td><td>양약 단독 투여 시의 한계를 보완하는 ‘스테로이드 절감 (Steroid-sparing)’ 전략<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">FeNO(호기 산화질소)<\/span> <span class=\"kw\">IL-6<\/span> <span class=\"kw\">TNF-α<\/span><\/td><td>객관적 바이오마커를 통한 치료 반응성 정량화 연구 활발<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">메타분석<\/span><\/td><td>다중 성분-다중 타깃(Multi-target)의 복합 기전 규명 고도화<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2024~2025)<\/h4><p>* 후속과제 기획 및 근거자료로 활용 가능한 최근 주요 연구임<\/p><p class=\"row\">신경성 염증 차단 기전 <b>2025, 장연영 등<\/b><\/p><p>MAPK/ERK 경로 억제를 통해 P물질(SP), CGRP 등 신경 매개 물질을 조절함<\/p><p><b>의미<\/b> 9미 캡슐이 동물 모델에서 ‘풍해’의 핵심인 신경계 민감도를 낮출 가능성을 보인 비임상 결과<\/p><p class=\"row\">다중 경로 네트워크 약리학 <b>2025, 주월 등<\/b><\/p><p>루테올린, 퀘르세틴 등 핵심 성분이 AGE/RAGE, PI3K/Akt 경로에 동시 개입함<\/p><p><b>의미<\/b> 단순 진해제가 아닌 전신적 염증 환경을 개선하는 복합 기전을 네트워크 약리학으로 예측<\/p><p class=\"row\">대규모 메타 분석 <b>2024, 황견 등<\/b><\/p><p>환자 2,571명 대상 분석 결과, 양방 병용 시 임상 총유효율 유의하게 상승(OR=4.46)<\/p><p><b>의미<\/b> 포함된 연구에서 병용 치료의 효과 개선 가능성이 관찰됨(안전성은 별도 검토 필요)<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p><b>원처방(탕제)<\/b>: 본문 조성의 11미(炙마황·자소엽·자소자·행인·자완·전호·비파엽·지룡·선퇴·오미자·우방자) 허가 중성약 소황지해캡슐蘇黃止咳膠囊: 행인·자완이 빠진 9미. 허가번호 Z20080014(베이징캉얼푸제약北京康而福藥業, 허가번호 기준 2008년)로 처음 허가되었고 베이징하이옌제약(양쯔강 계열, 허가번호 기준 2010년의 Z20103075, 2020년 재등록)도 생산하며, 국가 건강보험 급여 목록(을류)·국가 필수의약품 목록에 포함[13][15][16]. 설명서에는 COPD·폐암 등에 대한 유효성 자료와 65세 이상·18세 미만 환자 및 소아 기침 이형 천식에 대한 사용 근거가 없다고 명시됨[15] 허가 중성약 설명서 요점[15]<\/p><div class=\"tbl\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>제품명<\/td><td>소황지해캡슐 蘇黃止咳膠囊 (Sūhuáng Zhǐké Jiāonáng)<\/td><\/tr><tr><td>허가<\/td><td>처방약 허가번호 Z20080014(베이징캉얼푸제약)·Z20103075(베이징하이옌제약)<\/td><\/tr><tr><td>효능·적응증<\/td><td>소풍선폐疏風宣肺·지해리인止咳利咽풍사범폐風邪犯肺·폐기실선肺氣失宣으로 인한 기침·인후 가려움, 감기 후 기침 및 기침 이형 천식<\/td><\/tr><tr><td>용법·용량<\/td><td>1회 3캡슐, 1일 3회, 7~14일<\/td><\/tr><tr><td>금기·주의<\/td><td>· 임부 금기<br>· 복용 중 맵고 자극적인 음식을 피함<br>· 고혈압·심장병 환자와 운동선수는 신중 투여<\/td><\/tr><\/tbody><\/table><\/div><p><b>개발 중 제제<\/b>: 소황지해과립은 성인·소아 임상을 마치고 성인 제3상(CTR20250655)이 진행 중이며[12], 과립 제조·품질 기준 특허가 2024년 등록됨[14](과립은 캡슐과 같은 9미 조성·배합비이며 제형과 추출 공정만 다름) 연구문헌: 「연구 동향」의 논문 수와 참고문헌 [6]~[11]은 대부분 9미 캡슐에 대한 연구이므로, 11미 원처방의 결과로 그대로 옮겨 읽을 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">중국 제품이 적응증·제형 확장 단계에 있어 그대로 개발하면 후발이 되므로, 국내는 FeNO 층화 등 객관 지표 기반 근거로 차별화하고 수입·기술도입 가능성도 함께 검토해야 함. COPD·소아는 허가 효능이 아닌 연구 중인 영역임<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 차오언샹.“풍해”의 증상 및 치료 탐구 “風咳”證治探要[J].장쑤중의약江蘇中醫藥,2008,40(7):8-9.<\/li><li class=\"ref\">[2] 우지취안,천옌.차오언샹의 기침이형천식(CVA) 치료 경험 晁恩祥治療咳嗽變異型哮喘經驗[J].베이징중의北京中醫,2006,25(11):657-658.<\/li><li class=\"ref\">[3] 리지장,한윈등.차오언샹의 풍해 치료 임상경험 분석 晁恩祥治療風咳的臨床經驗探析[J].장시중의약江西中醫藥,2010,41(331):13-14.<\/li><li class=\"ref\">[4] 샤오신양,양다오원.차오언샹의 만성 기침 치료 경험 晁恩祥治療慢性咳嗽的經驗[J].베이징중의약北京中醫藥,2010,29(5):337-338.<\/li><li class=\"ref\">[5] 왕신추,장훙춘,천옌.차오언샹의 “풍해” 변증 치료 경험 소개 晁恩祥辨治“風咳”經驗介紹[J].베이징중의약北京中醫藥,2010,29(9):667-668.<\/li><li class=\"ref\">[6] 장옌잉,탕밍원,예샤오단등.네트워크 약리학 및 실험 검증에 기반한 소황지해교낭의 알레르기성 기침 치료 작용 기전 연구基於網絡藥理學和實驗驗證探討蘇黃止咳膠囊治療變應性咳嗽的作用機制[J].중약신약여임상약리中藥新藥與臨床藥理,2025,36(10):1720-1736.<\/li><li class=\"ref\">[7] 저우웨,류줴,우루나등.네트워크 약리학 및 분자 도킹에 기반한 소황지해교낭의 기관지 천식 치료 작용 기전 연구基於網絡藥理學與分子對接研究蘇黃止咳膠囊治療支氣管哮喘的作用機制[J].후난중의잡지湖南中醫雜誌,2025,41(05):143-150.<\/li><li class=\"ref\">[8] 왕춘후이,야오관평.메타분석, 네트워크 약리학 및 분자 도킹 기술에 기반한 소황지해교낭의 만성폐쇄성폐질환 치료 효과 및 작용 기전 탐구基於Meta分析和網絡藥理學及分子對接技術探討蘇黃止咳膠囊治療慢性阻塞性肺疾病的療效及作用機制[J].선양의학원학보瀋陽醫學院學報,2024,26(06):597-605.<\/li><li class=\"ref\">[9] 황쥐안,두뱌오,인룽등.성인 기침이형천식 치료에 있어 소황지해교낭의 유효성 및 안전성에 대한 체계적 평가蘇黃止咳膠囊治療成人咳嗽變異性哮喘有效性與安全性系統評價[J].중국약업中國藥業,2024,33(11):101-107.<\/li><li class=\"ref\">[10] 안단,우루,리위등.만성 폐쇄성 폐질환 급성 악화기 환자에 대한 소황지해교낭의 임상효과蘇黃止咳膠囊對慢性阻塞性肺疾病急性加重期患者的臨床療效[J].중성약中成藥,2023,45(05):1493-1497.<\/li><li class=\"ref\">[11] 리원궈,양리평,지밍옌,등.소황지해교낭과 항생제 병용 투여가 COPD 급성 악화 환자의 임상 효능 및 면역 기능에 ","base":"우방자"}],"notes":["※ 대사의 원처방(11미)임. 허가 중성약 소황지해캡슐은 행인·자완이 빠진 9미로 조성이 다르므로, 본문의 캡슐","연구·임상 결과를 원처방에 그대로 적용할 수 없음"],"핵심 효능":["풍사風邪 제거 및 폐 기운 소통(소풍선폐疏風宣肺)","기관지 경련 이완(완급해경緩急解痙)","기침을 그치게 하고 인후를 소통함(지해리인止咳利咽)"],"주치증":["기침 이형 천식, 상기도 감염 후 기침, 풍사범폐형風邪犯肺型 반복성 마른기침"],"연구 확장 영역":["만성 폐쇄성 폐질환 급성 악화(AECOPD), 감염 후 기침, 수술 후 기침, 기관지확장증 등"],"R&D 포인트":["‘기도 과민성(Airway Hyper-responsiveness)’ 및 ‘신경성 염증(Neurogenic Inflammation)’ 차단 기전 연구의 유망한 연구 소재"]},"modules":[{"name":"①완급해경","hz":"緩急解痙","herbs":["지룡","선퇴","오미자"],"role":"기관지 경련 및 과민성 차단"},{"name":"②선폐강기","hz":"宣肺降氣","herbs":["마황","행인","자소자","자완","전호","비파엽"],"role":"폐기의 조절"},{"name":"③소풍리인","hz":"疏風利咽","herbs":["자소엽","우방자"],"role":"상기도 자극인자 제거 및 인후 소통"}],"rd":[{"tag":"Cough Hypersensitivity","title":"기침 과민 증후군 표적: TRP 채널·신경성 염증","html":"<p>9미 소황지해캡슐이 동물 모델에서 MAPK/ERK 경로를 억제해 P물질·CGRP 등 신경 매개 물질을 조절했다는 결과가 있음<\/p><p>이를 근거로 ‘풍해風咳’를 현대적 개념인 기침 과민 증후군으로 정의하고 캡사이신 기침 역치를 객관 지표로 삼아 원처방(11미) 효과를 검증하는 방향<\/p><p><b>검증 설계<\/b> 기니피그 구연산·캡사이신 기침 모델에서 기침 횟수와 TRPV1/TRPA1·SP·CGRP를 측정하고, 임상에서는 객관적 기침 빈도(기침 모니터)와 레스터 기침 설문(LCQ)을 1차 지표로, 캡사이신 기침 유발 시험(C2/C5)은 기전 보조 지표로 설정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [6](2025, 신경성 염증 기전), 본문 「임상적 표현형」 표(TRP 채널)<\/p>"},{"tag":"Patient Segmentation","title":"기침 이형 천식과 감염 후 기침의 반응 차이","html":"<p>현재 진행 중인 소황지해과립 제3상 임상(CTR20250655)이 감염 후 기침과 기침 이형 천식을 함께 다루고 있음<\/p><p>두 아형의 반응 차이가 공개되면 국내 연구의 대상 환자 선정에 바로 활용할 수 있으며, 호기 산화질소(FeNO)로 호산구성·비호산구성을 나누어 반응을 비교하는 설계가 유효하되, 기침 이형 천식과 감염 후 기침은 병태와 FeNO 해석이 다르므로 대상 아형을 섞지 않고 각각 분석<\/p><p><b>검증 설계<\/b> 아형별로 따로 모집하고, 기침 이형 천식군은 FeNO로 층화하여 기침 증상 점수 개선률을 비교<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [12](CTR20250655 제3상 임상 등록 정보), 본문 「평가 지표」(FeNO)<\/p>"},{"tag":"Steroid-sparing Combination","title":"흡입 스테로이드·몬테루카스트 병용 근거의 질 향상","html":"<p>9미 캡슐에 대한 환자 2,571명 메타분석에서 병용 시 총유효율이 높았고(OR=4.46) 성인 기침 이형 천식 체계적 평가도 있으나 대부분 ‘총유효율’ 중심임<\/p><p>기침 증상 점수·재발률·흡입 스테로이드 용량 감소 같은 국제 표준 지표로 다시 평가해야 해외에서도 인정받는 근거가 됨<\/p><p><b>검증 설계<\/b> 흡입 스테로이드 사용 중 안정 상태인 환자에서 악화·폐기능 감시와 기존 치료 유지 규칙을 둔 단계적 감량 설계로 스테로이드 절감 효과를 평가하고, 12주 후 재발률을 추적<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [9](2024, 체계적 평가), 본문 High-Impact ③(메타분석)<\/p>"},{"tag":"Upper Airway & Rhinitis","title":"인후 가려움·비염 동반 환자군","html":"<p>인후 가려움이 기침의 전구 증상이고 알레르기 비염 동반 빈도가 높다는 임상 표현형이 있음<\/p><p>이를 근거로 상기도 기침 증후군 동반 환자를 별도 대상으로 정하고 우방자·선퇴의 이인利咽 작용을 인후 감각 과민 지표로 확인<\/p><p><b>검증 설계<\/b> 비염 동반 기침 환자에서 비염 증상 점수(TNSS)와 기침 점수를 함께 측정하는 하위군 분석<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> 본문 「임상적 표현형」 표(동반 증상, 감각 양상)<\/p>"},{"tag":"Lifecycle","title":"제품 수명주기와 국내 개발 방향","html":"<p>소황지해캡슐(9미)은 2008년 처음 허가된 뒤 건강보험 급여 목록과 국가 필수의약품 목록에 포함된 대형 품목이며, 과립 제형 제3상과 COPD 급성 악화기 병용 임상이 이어져 적응증·제형 확장 단계에 있음(COPD·소아는 허가 효능이 아닌 연구 영역)<\/p><p>따라서 국내는 중국 제품의 확장 방향과 겹치지 않는 적응증과 근거 설계를 고르는 것이 중요<\/p><p><b>검증 설계<\/b> COPD 급성 악화 환자에서 항생제 병용 시 회복 기간·재입원율을 지표로 한 중국 근거를 정리하고, 국내 미충족 수요가 큰 적응증을 선정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [10](2023), [11](2022, COPD 급성 악화 병용), [13] (제품 정보)<\/p>"}],"logic":[{"n":"1","title":"종풍논치從風論治","body":"바람이 기침의 시작"},{"n":"2","title":"선강득의宣降得宜","body":"폐는 열고 내려야 함"},{"n":"3","title":"식풍해경息風解痙","body":"경련을 잡는 충류 약재"},{"n":"4","title":"인후문호咽喉門戶","body":"목구멍이 대문"},{"n":"5","title":"구해치신久咳治腎","body":"오래된 기침은 신장에서 치료"}],"field":5,"pages":[261,268],"evidence":"연구 축적 (논문 471편)","product":"캡슐(중성약, 9미)· 과립 3상","status":"허가 중성약","s":["5-1","소황지해탕","蘇黃止咳湯","","차오언샹","晁恩祥","기도 과민반응을 완화하고 경련성 기침을 조절하는 호흡기 난치 질환의 전략 처방","炙마황10g 자소엽10g 자소자10g 행인10g 자완10g 전호10g 비파엽10g 지룡10g 선퇴10g 오미자10g 우방자10g","※ 대사의 원처방(11미)임. 허가 중성약 소황지해캡슐은 행인·자완이 빠진 9미로 조성이 다르므로, 본문의 캡슐 연구·임상 결과를 원처방에 그대로 적용할 수 없음","핵심 효능 풍사風邪 제거 및 폐 기운 소통(소풍선폐疏風宣肺) 기관지 경련 이완(완급해경緩急解痙) 기침을 그치게 하고 인후를 소통함(지해리인止咳利咽)","주치증 기침 이형 천식, 상기도 감염 후 기침, 풍사범폐형風邪犯肺型 반복성 마른기침","연구 확장 영역 만성 폐쇄성 폐질환 급성 악화(AECOPD), 감염 후 기침, 수술 후 기침, 기관지확장증 등","R&D 포인트 ‘기도 과민성(Airway Hyper-responsiveness)’ 및 ‘신경성 염증(Neurogenic Inflammation)’ 차단 기전 연구의 유망한 연구 소재","①완급해경 緩急解痙 지룡 선퇴 오미자 기관지 경련 및 과민성 차단","②선폐강기 宣肺降氣 마황 행인 자소자 자완 전호 비파엽 폐기의 조절","③소풍리인 疏風利咽 자소엽 우방자 상기도 자극인자 제거 및 인후 소통","종풍논치從風論治 바람이 기침의 시작","선강득의宣降得宜 폐는 열고 내려야 함","식풍해경息風解痙 경련을 잡는 충류 약재","인후문호咽喉門戶 목구멍이 대문","구해치신久咳治腎 오래된 기침은 신장에서 치료","Cough Hypersensitivity 기침 과민 증후군 표적: TRP 채널·신경성 염증 9미 소황지해캡슐이 동물 모델에서 MAPK/ERK 경로를 억제해 P물질·CGRP 등 신경 매개 물질을 조절했다는 결과가 있음 이를 근거로 ‘풍해風咳’를 현대적 개념인 기침 과민 증후군으로 정의하고 캡사이신 기침 역치를 객관 지표로 삼아 원처방(11미) 효과를 검증하는 방향 검증 설계 기니피그 구연산·캡사이신 기침 모델에서 기침 횟수와 TRPV1/TRPA1·SP·CGRP를 측정하고, 임상에서는 객관적 기침 빈도(기침 모니터)와 레스터 기침 설문(LCQ)을 1차 지표로, 캡사이신 기침 유발 시험(C2/C5)은 기전 보조 지표로 설정 근거 직접 연구 근거 참고문헌 [6](2025, 신경성 염증 기전), 본문 「임상적 표현형」 표(TRP 채널)","Patient Segmentation 기침 이형 천식과 감염 후 기침의 반응 차이 현재 진행 중인 소황지해과립 제3상 임상(CTR20250655)이 감염 후 기침과 기침 이형 천식을 함께 다루고 있음 두 아형의 반응 차이가 공개되면 국내 연구의 대상 환자 선정에 바로 활용할 수 있으며, 호기 산화질소(FeNO)로 호산구성·비호산구성을 나누어 반응을 비교하는 설계가 유효하되, 기침 이형 천식과 감염 후 기침은 병태와 FeNO 해석이 다르므로 대상 아형을 섞지 않고 각각 분석 검증 설계 아형별로 따로 모집하고, 기침 이형 천식군은 FeNO로 층화하여 기침 증상 점수 개선률을 비교 근거 직접 연구 근거 참고문헌 [12](CTR20250655 제3상 임상 등록 정보), 본문 「평가 지표」(FeNO)","Steroid-sparing Combination 흡입 스테로이드·몬테루카스트 병용 근거의 질 향상 9미 캡슐에 대한 환자 2,571명 메타분석에서 병용 시 총유효율이 높았고(OR=4.46) 성인 기침 이형 천식 체계적 평가도 있으나 대부분 ‘총유효율’ 중심임 기침 증상 점수·재발률·흡입 스테로이드 용량 감소 같은 국제 표준 지표로 다시 평가해야 해외에서도 인정받는 근거가 됨 검증 설계 흡입 스테로이드 사용 중 안정 상태인 환자에서 악화·폐기능 감시와 기존 치료 유지 규칙을 둔 단계적 감량 설계로 스테로이드 절감 효과를 평가하고, 12주 후 재발률을 추적 근거 직접 연구 근거 참고문헌 [9](2024, 체계적 평가), 본문 High-Impact ③(메타분석)","Upper Airway & Rhinitis 인후 가려움·비염 동반 환자군 인후 가려움이 기침의 전구 증상이고 알레르기 비염 동반 빈도가 높다는 임상 표현형이 있음 이를 근거로 상기도 기침 증후군 동반 환자를 별도 대상으로 정하고 우방자·선퇴의 이인利咽 작용을 인후 감각 과민 지표로 확인 검증 설계 비염 동반 기침 환자에서 비염 증상 점수(TNSS)와 기침 점수를 함께 측정하는 하위군 분석 근거 신규 연구가설 본문 「임상적 표현형」 표(동반 증상, 감각 양상)","Lifecycle 제품 수명주기와 국내 개발 방향 소황지해캡슐(9미)은 2008년 처음 허가된 뒤 건강보험 급여 목록과 국가 필수의약품 목록에 포함된 대형 품목이며, 과립 제형 제3상과 COPD 급성 악화기 병용 임상이 이어져 적응증·제형 확장 단계에 있음(COPD·소아는 허가 효능이 아닌 연구 영역) 따라서 국내는 중국 제품의 확장 방향과 겹치지 않는 적응증과 근거 설계를 고르는 것이 중요 검증 설계 COPD 급성 악화 환자에서 항생제 병용 시 회복 기간·재입원율을 지표로 한 중국 근거를 정리하고, 국내 미충족 수요가 큰 적응증을 선정 근거 직접 연구 근거 참고문헌 [10](2023), [11](2022, COPD 급성 악화 병용), [13] (제품 정보)"],"ss":{"composition":"그림 5-1 소황지해탕蘇黃止咳湯의 모듈 구성 ①완급해경緩急解痙 모듈 — 기관지 경련 및 과민성 차단 지룡, 선퇴 : 예민해진 기관지의 경련을 풀고, 외부 자극에 민감하게 반응하여 발생하는 기침을 해소 오미자 : 과도하게 발산되는 기운을 모으고, 기관지 점막을 윤택하게 하여 오래된 기침을 멈춤 ②선폐강기宣肺降氣 모듈 — 폐기의 조절 마황 : 폐 기운을 열어 기도를 확장 행인 : 마황의 선발 작용을 조율하며, 치솟은 폐기를 아래로 내리고 가래를 삭임 자소자, 자완, 전호, 비파엽 : 치솟는 기침 기운을 아래로 내리고 점액 배출을 도움 ③소풍리인疏風利咽 모듈 — 상기도 자극인자 제거 및 인후 소통 자소엽 : 마황의 발산 작용을 도와 풍사風邪를 흩어내며, 자소자의 강기降氣 작용과 조화를 이뤄 폐기의 승강升降 순환을 완성 우방자 : 인후부의 감각신경 민감도를 낮추어 ‘간질거리는 기침’의 연쇄 고리를 차단","data":"데이터 분석 : 100여 건의 선행 연구와 임상 데이터를 마이닝한 결과, 자완(1위), 지룡(2위), 행인(3위) 순으로 높은 사용 빈도를 보임 통계적 시사점 : 다빈도 약재 상위 15종 가운데 자완, 지룡, 행인, 자소엽, 오미자, 선퇴, 자소자, 비파엽, 우방자, 마황, 전호 등 소황지해탕 구성 약재와 중첩되는 약재가 다수 확인됨. 이는 소황지해탕이 대사의 만성 기침 치료 경험을 대표적으로 반영한 처방임을 보여주는 근거로 볼 수 있음 사용 빈도 상위 약재(막대: 짙은 색 = 처방 구성 약재) 자완 819 지룡 816 행인 815 자소엽 806 감초 800 오미자 800 선퇴 800 자소자 773 비파엽 751 우방자 716 마황 692 백과 493 절패모 427 산수유 293 전호 256","master":"“풍해는 단순한 염증성 기침이 아닌, 기도의 과민성이 극대화된 상태” 현대적 매핑 : 기침 이형 천식, 상기도 감염 후 기침, 상기도 기침 증후군 R&D 타깃 : 기침 반사궁(Cough Reflex Arc)의 감각신경 과민성 및 기침 역치(Cough Threshold) ①임상적 표현형 (Clinical Phenotype) 구분 주요 특징 객관적 평가지표 유발 요인 찬 공기, 대화, 웃음, 냄새, 담배 연기 Airway Hyper-reactivity 감각 양상 참을 수 없는 인후부의 가려움 (기침의 전구 증상) TRP Channel (TRPV1, TRPA1) 기침 양상 가래 없는 마른기침, 본인 의지로 억제 불가(경련성) Cough Frequency & Intensity 동반 증상 코막힘, 콧물, 인후통 (알레르기 비염 동반 빈도 높음) Allergic Rhinitis Comorbidity ②맞춤형 치료 전략 전략 모듈 임상 상황 핵심 치법 및 대응 약재 [Module A] 원인 차단 외감(감기) 및 환경 자극 찬 공기, 건조함 등 외부 요인이 뚜렷할 때 · 산풍散風 : 마황, 선퇴, 지룡 · 한·열·조 조절 : 소엽, 금은화, 맥문동 등 [Module B] 증상 제어 발작적 기침, 인후 과민성 기도 경련과 목의 가려움이 극심할 때 · 해경解痙 : 지룡, 전갈, 오미자 · 리인利咽 : 우방자, 사간, 길경 · 선폐宣肺 : 자완, 행인 [Module C] 근본 조절 만성 기침 및 전신 허약 스트레스성 기침이나 기운 소모가 심할 때 · 평간平肝 : 지룡, 구등, 국화 · 보익補益 : 오미자, 산수유, 태자삼","rd":"","evidence":"①연구 규모 및 정량적 위상 Total Papers(15yrs) Recent Focus(5yrs) 총 471 편 발표(소황지해탕 및 소황지해캡슐 관련, 대부분 9미 캡슐 연구) 최근 5 년간 143편 발표(과립 제3상 CTR20250655 진행 중) ②연구 키워드로 본 R&D 가이던스(최근 5개년 분석) * 최근 5년 연구 키워드는 증상 개선 외에 면역·신경 조절 기전으로 넓어지고 있음 구분 핵심 키워드 R&D 인사이트 주치증 CVA(기침 이형 천식) AECOPD 천식 급성기 및 만성 기침 관리의 보조 요법으로 연구가 집중됨 병용 전략 ICS/LABA(흡입제) 몬테루카스트 양약 단독 투여 시의 한계를 보완하는 ‘스테로이드 절감 (Steroid-sparing)’ 전략 평가 지표 FeNO(호기 산화질소) IL-6 TNF-α 객관적 바이오마커를 통한 치료 반응성 정량화 연구 활발 방법론 네트워크 약리학 메타분석 다중 성분-다중 타깃(Multi-target)의 복합 기전 규명 고도화 ③High-Impact 연구 하이라이트(2024~2025) * 후속과제 기획 및 근거자료로 활용 가능한 최근 주요 연구임 신경성 염증 차단 기전 2025, 장연영 등 MAPK/ERK 경로 억제를 통해 P물질(SP), CGRP 등 신경 매개 물질을 조절함 의미 9미 캡슐이 동물 모델에서 ‘풍해’의 핵심인 신경계 민감도를 낮출 가능성을 보인 비임상 결과 다중 경로 네트워크 약리학 2025, 주월 등 루테올린, 퀘르세틴 등 핵심 성분이 AGE/RAGE, PI3K/Akt 경로에 동시 개입함 의미 단순 진해제가 아닌 전신적 염증 환경을 개선하는 복합 기전을 네트워크 약리학으로 예측 대규모 메타 분석 2024, 황견 등 환자 2,571명 대상 분석 결과, 양방 병용 시 임상 총유효율 유의하게 상승(OR=4.46) 의미 포함된 연구에서 병용 치료의 효과 개선 가능성이 관찰됨(안전성은 별도 검토 필요)","china":"중국 제품화 현황 원처방(탕제) : 본문 조성의 11미(炙마황·자소엽·자소자·행인·자완·전호·비파엽·지룡·선퇴·오미자·우방자) 허가 중성약 소황지해캡슐蘇黃止咳膠囊: 행인·자완이 빠진 9미. 허가번호 Z20080014(베이징캉얼푸제약北京康而福藥業, 허가번호 기준 2008년)로 처음 허가되었고 베이징하이옌제약(양쯔강 계열, 허가번호 기준 2010년의 Z20103075, 2020년 재등록)도 생산하며, 국가 건강보험 급여 목록(을류)·국가 필수의약품 목록에 포함[13][15][16]. 설명서에는 COPD·폐암 등에 대한 유효성 자료와 65세 이상·18세 미만 환자 및 소아 기침 이형 천식에 대한 사용 근거가 없다고 명시됨[15] 허가 중성약 설명서 요점[15] 항목 내용 제품명 소황지해캡슐 蘇黃止咳膠囊 (Sūhuáng Zhǐké Jiāonáng) 허가 처방약 허가번호 Z20080014(베이징캉얼푸제약)·Z20103075(베이징하이옌제약) 효능·적응증 소풍선폐疏風宣肺·지해리인止咳利咽풍사범폐風邪犯肺·폐기실선肺氣失宣으로 인한 기침·인후 가려움, 감기 후 기침 및 기침 이형 천식 용법·용량 1회 3캡슐, 1일 3회, 7~14일 금기·주의 · 임부 금기 · 복용 중 맵고 자극적인 음식을 피함 · 고혈압·심장병 환자와 운동선수는 신중 투여 개발 중 제제 : 소황지해과립은 성인·소아 임상을 마치고 성인 제3상(CTR20250655)이 진행 중이며[12], 과립 제조·품질 기준 특허가 2024년 등록됨[14](과립은 캡슐과 같은 9미 조성·배합비이며 제형과 추출 공정만 다름) 연구문헌: 「연구 동향」의 논문 수와 참고문헌 [6]~[11]은 대부분 9미 캡슐에 대한 연구이므로, 11미 원처방의 결과로 그대로 옮겨 읽을 수 없음 시사점 중국 제품이 적응증·제형 확장 단계에 있어 그대로 개발하면 후발이 되므로, 국내는 FeNO 층화 등 객관 지표 기반 근거로 차별화하고 수입·기술도입 가능성도 함께 검토해야 함. COPD·소아는 허가 효능이 아닌 연구 중인 영역임 참고문헌 [1] 차오언샹.“풍해”의 증상 및 치료 탐구 “風咳”證治探要[J].장쑤중의약江蘇中醫藥,2008,40(7):8-9. [2] 우지취안,천옌.차오언샹의 기침이형천식(CVA) 치료 경험 晁恩祥治療咳嗽變異型哮喘經驗[J].베이징중의北京中醫,2006,25(11):657-658. [3] 리지장,한윈등.차오언샹의 풍해 치료 임상경험 분석 晁恩祥治療風咳的臨床經驗探析[J].장시중의약江西中醫藥,2010,41(331):13-14. [4] 샤오신양,양다오원.차오언샹의 만성 기침 치료 경험 晁恩祥治療慢性咳嗽的經驗[J].베이징중의약北京中醫藥,2010,29(5):337-3 폐를 윤택하게 함<\/h4><p><b>태자삼, 맥문동, 오미자<\/b>: 생맥음生脈飮의 구조를 계승함. 태자삼은 인삼의 온조한 폐단을 피하여 청보淸補하는 지위로 폐와 비토脾土를 보함. 맥문동은 위액을 기르고 폐를 윤택하게 하며, 오미자는 폐신肺腎의 기를 수렴하고 진액을 생기게 함. 세 약의 합용으로 양음익기養陰益氣의 근간을 이룸<\/p><h4>②배토생금培土生金 및 보익폐신補益肺腎 모듈 — 비·폐·신의 기능을 유기적으로 연계하여 폐와 신을 보익함<\/h4><p><b>황정, 산수유<\/b>: 황정은 비위를 보하고 폐음과 신정을 윤택하게 보익함. 산수유는 간과 신의 음액을 수렴하는 동시에 폐기도 수렴하며, 정기를 수렴하되 사기는 수렴하지 않음. 이들은 비토를 다지고 금수金水를 상생시켜 폐와 신을 튼튼하게 함<\/p><h4>③조화제약調和諸藥 및 산감화음酸甘化陰 모듈 — 약성 사이의 균형을 맞추고 진액 화생을 보조함<\/h4><p><b>감초<\/b>: 제약諸藥의 성질을 조화롭게 하고, 오미자, 산수유의 신맛과 어우러져 단맛으로 산감화음酸甘化陰의 효능을 극대화함. 평보平補의 탕액 속에서 비위의 기를 북돋우고 전체 처방의 완만하고 지속적인 보익력을 안정적으로 유지함<\/p>"},{"k":"master","t":"차오언샹의 만성 폐쇄성 폐질환, 폐암 치료","html":"<p class=\"lbl2\">1) 진료 사상<\/p><h4>①중서의 결합과 분기별 맞춤 치료<\/h4><p><b>보조 진단 수용<\/b>: 현대 의학의 CT, 폐기능 검사, 혈액 검사 등을 사진四診의 연장선으로 수용하여, 환자의 신체 상태, 병기, 예후를 정확히 파악하여 적절한 치료법을 선택함<\/p><p class=\"lbl2\">단계별 치료 원칙<\/p><p class=\"sub\"><b>초기<\/b>: 수술을 위주로 하고, 병리 분기에 따라 적절한 수술 후 보조 치료를 시행하며, 수술 후 환자는 중의 치료로 증상을 개선하고 재발과 전이를 예방함<\/p><p class=\"sub\"><b>방사선, 화학요법 및 표적 치료기<\/b>: 중의약으로 부작용을 줄이고 효과를 증강시킴<\/p><p class=\"sub\"><b>말기 및 고령 환자<\/b>: 중의약 치료를 위주로 하고 종양과 평화롭게 공존하는 ‘대병연년帶病延年’을 도모<\/p><h4>②병인병기 — 본허표실本虛標實<\/h4><p><b>병인과 병기<\/b>: 폐암의 병인을 허虛, 담痰, 어瘀, 독毒의 4가지로 요약하며, 병기는 기음휴허氣陰虧虛, 담어호결痰瘀互結, 독사적취毒邪積聚로 봄<\/p><p><b>본과 표의 관계<\/b>: 전신은 허증으로 주로 폐와 비의 기음휴허氣陰虧虛이며, 국소는 실증으로 담응痰凝, 혈어血瘀, 독취毒聚로 구성됨. 치료는 시기에 따라 부정扶正과 거사祛邪의 비중을 조절함<\/p><h4>③변증입법과 처방의 도출<\/h4><p>복잡한 증후 속에서 주증主症을 파악하여 변증하고, 치료 대법을 세운 뒤 처방과 약물이 도출되는 엄격한 임상 원칙 (이법방약理法方藥의 일치, 개인 경험의 한계 극복, 완급의 조절)을 강조함<\/p><p class=\"lbl2\">2) 용약 특징<\/p><h4>①양음익기養陰益氣를 대법으로 삼고 겸증에 따라 가감<\/h4><p><b>기본방<\/b>: 기음양허氣陰兩虛, 폐비휴허肺脾虧虛의 병기를 다스리는 양음익기방을 기본방으로 사용<\/p><p>단계별, 겸증별 가감<\/p><p class=\"sub\"><b>수술 후 체력 저하<\/b>: 황기, 당귀, 계혈등, 산약, 계내금, 사인, 초삼선焦三仙 등을 더해 익기양혈益氣養血 및 건비화위健脾和胃화학요법 부작용: 골수 억제, 식욕 부진, 구토, 변비 등이 나타날 때 황기, 당귀, 계혈등, 구기자, 죽여, 황련, 소엽, 사인, 화마인을 더해 강역지구降逆止嘔 및 행기통부行氣通腑<\/p><p class=\"sub\"><b>방사성 폐렴 및 폐섬유화<\/b>: 급성 방사성 폐렴은 중의학의 폐옹肺癰 범주로 보아 ‘급할 때는 그 표를 다스린다急則治其標’는 원칙에 따라 천금위경방千金葦莖方 가미방(의이인, 노근, 동과인, 길경, 황금, 어성초, 금교맥, 행인, 자완, 자소자,炙비파엽, 귤홍, 감초 등)으로 청폐화담淸肺化痰, 강기평천降氣平喘함. 만성 안정기나 폐섬유화(폐위肺痿)에는 양음익기방에 평천平喘 및 활혈화어活血化瘀 약물을 가미함<\/p><p class=\"sub\"><b>말기 및 쇠약 환자<\/b>: 중약 조리를 위주로 종양과 평화롭게 공존하는 대병연년帶病延年을 도모함. 기음양허氣陰兩虛, 담어호결痰瘀互結, 독탁내온毒濁內蘊을 다스리기 위해 양음익기방에 소자, 백개자, 지룡, 백부, 백과, 금교맥, 어성초, 백화사설초, 반지련半枝蓮 등을 더해 삶의 질을 높이고 생존 기간을 연장함<\/p><h4>②증증결합證症結合을 통해 병증의 핵심을 직접 겨냥<\/h4><p>폐암은 변증상 주로 기음부족氣陰不足에 속하나 개별 증상이 두드러져 삶의 질을 떨어뜨리므로 증증결합證症結合원칙에 따라 주증을 겨냥한 가감을 병행함<\/p><p class=\"sub\"><b>흉통<\/b>: ‘통하지 않으면 아프다不通則痛’는 이론에 따라 천궁, 단삼, 계혈등 등 활혈화어活血化瘀, 지통止痛 약물과 함께 계지, 해백薤白으로 통양산결通陽散結하고, 행기지통行氣止痛의 명약인 연호색延胡索을 추가하여 병증의 핵심을 직접 겨냥함<\/p><p class=\"sub\"><b>불면<\/b>: 양혈안신養血安神, 중진안신重鎭安神의 炒산조인, 生용골, 生모려 등을 추가<\/p><p class=\"sub\"><b>인후 통증, 가려움<\/b>: 길경, 우방자, 사간을 추가해 이인利咽하고 지통止痛<\/p><p class=\"sub\"><b>구갈<\/b>: 석곡, 사삼으로 생진지갈生津止渴<\/p><p class=\"sub\"><b>위산 역류, 속쓰림<\/b>: 해표소, 煅와릉자로 제산制酸<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품은 없음. 이 처방(태자삼·맥문동·오미자·황정·산수유)에 삼칠·자완·소자·행인·백과·지룡 등을 더한 13종 확장 조성 특허가 베이징둥팡윈자제약 명의로 출원 공개되어 심사 중이며, 적응증을 특발성 폐섬유증 완화기로 제시함[3]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">중국에서는 소황지해과립 특허를 낸 둥팡윈자 계열 기업이 특발성 폐섬유증으로 제품화를 준비하고 있으므로, 국내는 원방 6종 조성으로 COPD·폐암 지지요법 근거를 확보해 대상 질환을 달리하는 전략이 유효. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕멍차오,루퉁,왕신추,등.국의대사 차오언샹의 양음익기법에 의한 안정기 만성폐쇄성폐질환 50례 임상 관찰以國醫大師晁恩祥養陰益氣法治療穩定期慢性阻塞性肺疾病50例臨床觀察[J].베이징중의약北京中醫藥,2023,42(5):497-500.<\/li><li class=\"ref\">[2] 정수쥔,왕신추,자시화,등.국의대사 차오언샹의 폐암 변증 치료 경험國醫大師晁恩祥辨治肺癌經驗[J].중화중의약잡지中華中醫藥雜志,2022,37(7):3855-3857.<\/li><li class=\"ref\">[3] 차오언샹晁恩祥 등.중약 조성물 및 양음익기 약물 제제一種中藥組合物和養陰益氣的藥物製劑:CN119235998A[P/OL].<a href=\"https://patents.google.com/patent/CN119235998A.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN119235998A.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"태자삼15g","name":"태자삼","dose":"15g","base":"태자삼"},{"raw":"맥문동15g","name":"맥문동","dose":"15g","base":"맥문동"},{"raw":"오미자10g","name":"오미자","dose":"10g","base":"오미자"},{"raw":"황정10g","name":"황정","dose":"10g","base":"황정"},{"raw":"산수유10g","name":"산수유","dose":"10g","base":"산수유"},{"raw":"生감초10g","name":"生감초","dose":"10g","base":"감초"}],"notes":[],"핵심 효능":["폐비신肺脾腎의 기음氣陰을 보익하고 정기를 북돋아 저항력을 높임(익기양음益氣養陰, 부정고본扶正固本)","폐를 윤택하게 하고 진액을 생성함(윤폐생진潤肺生津)","배토생금培土生金과 금수상생金水相生의 이치를 구현하여 오장육부의 생리 기능을 정상화함"],"주치증":["만성 폐쇄성 폐질환(COPD) 안정기, 폐암 수술 후 및 방사선·화학요법 이후의 종기허쇠宗氣虛衰, 폐신의 기음양허氣陰兩虛, 폐창肺脹, 천증喘證, 만성 기침과 호흡곤란"],"연구 확장 영역":["COPD 안정기, 만성 호흡기 질환의 회복기 관리, 폐기능 개선, 종양 환자의 삶의 질 향상 및 기능 회복"],"R&D 포인트":["생맥음 배합(태자삼·맥문동·오미자)의 폐기와 폐음 동시 회복 기전","황정과 산수유를 통한 폐비신의 기음 보익 및 배토생금, 금수상생 메커니즘","AQP1, AQP5 발현 조절, 기도 수분 항상성 개선 및 폐기능 회복과 관련된 천연물 소재 연구"]},"modules":[{"name":"①양음익기 · 건비윤폐","hz":"養陰益氣 · 健脾潤肺","herbs":["태자삼","맥문동","오미자"],"role":"상초와 중초의 기음을 보익하고 폐를 윤택하게 함"},{"name":"②배토생금 · 보익폐신","hz":"培土生金 · 補益肺腎","herbs":["황정","산수유"],"role":"비·폐·신의 기능을 유기적으로 연계하여 폐와 신을 보익함"},{"name":"③조화제약 · 산감화음","hz":"調和諸藥 · 酸甘化陰","herbs":["감초"],"role":"약성 사이의 균형을 맞추고 진액 화생을 보조함"}],"rd":[{"tag":"Stable COPD","title":"안정기 COPD의 증상·운동 능력 개선","html":"<p>안정기 COPD 50례 임상 관찰이 있음<\/p><p>CAT 점수·6분 보행 거리·연간 급성 악화 횟수를 지표로 한 무작위 대조 임상으로 재현하여 근거 수준을 높임 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](2023, 안정기 COPD 50례))<\/p>"},{"tag":"Lung Cancer Supportive Care","title":"폐암 수술·항암 후 피로와 기침","html":"<p>폐암 변증 치료 경험이 있음<\/p><p>수술 또는 항암 치료 후 기음양허 환자의 암 관련 피로(FACT-F)와 기침 증상을 지표로 한 지지요법 연구가 적합(폐암 지지요법과 COPD 적응증의 근거는 분리) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2022, 폐암 변증 치료 경험))<\/p>"},{"tag":"Shengmai Lineage","title":"생맥음 골격 대비 황정·산수유 가미의 차별성","html":"<p>태자삼·맥문동·오미자의 생맥음 골격에 황정·산수유를 더한 구조임<\/p><p>생맥음 대비 폐기능과 피로 개선의 추가 이득을 비교하여 처방 고유의 가치를 확인 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&amp;D 논리 1·2)<\/p>"},{"tag":"Airway Hydration","title":"아쿠아포린 조절과 건조성 기침","html":"<p>본문 R&amp;D 포인트의 AQP1·AQP5 조절 가설을 COPD 모델의 기도 점액 성상과 폐 수분 균형으로 검증함<\/p><p>이를 통해 ‘양음’을 기도 수분 항상성으로 구체화(AQP1·AQP5는 탐색적 기전 가설) (근거 유형: 신규 연구가설 | 근거: 본문 R&amp;D 포인트(AQP1·AQP5), R&amp;D 논리 3)<\/p>"}],"logic":[{"n":"1","t  1·2)","Airway Hydration 아쿠아포린 조절과 건조성 기침 본문 R&D 포인트의 AQP1·AQP5 조절 가설을 COPD 모델의 기도 점액 성상과 폐 수분 균형으로 검증함 이를 통해 ‘양음’을 기도 수분 항상성으로 구체화(AQP1·AQP5는 탐색적 기전 가설) (근거 유형: 신규 연구가설 | 근거: 본문 R&D 포인트(AQP1·AQP5), R&D 논리 3)"],"ss":{"composition":"그림 5-2 양음익기방養陰益氣方의 모듈 구성 ①양음익기養陰益氣 및 건비윤폐健脾潤肺 모듈 — 상초와 중초의 기음을 보익하고 폐를 윤택하게 함 태자삼, 맥문동, 오미자 : 생맥음生脈飮의 구조를 계승함. 태자삼은 인삼의 온조한 폐단을 피하여 청보淸補하는 지위로 폐와 비토脾土를 보함. 맥문동은 위액을 기르고 폐를 윤택하게 하며, 오미자는 폐신肺腎의 기를 수렴하고 진액을 생기게 함. 세 약의 합용으로 양음익기養陰益氣의 근간을 이룸 ②배토생금培土生金 및 보익폐신補益肺腎 모듈 — 비·폐·신의 기능을 유기적으로 연계하여 폐와 신을 보익함 황정, 산수유 : 황정은 비위를 보하고 폐음과 신정을 윤택하게 보익함. 산수유는 간과 신의 음액을 수렴하는 동시에 폐기도 수렴하며, 정기를 수렴하되 사기는 수렴하지 않음. 이들은 비토를 다지고 금수金水를 상생시켜 폐와 신을 튼튼하게 함 ③조화제약調和諸藥 및 산감화음酸甘化陰 모듈 — 약성 사이의 균형을 맞추고 진액 화생을 보조함 감초 : 제약諸藥의 성질을 조화롭게 하고, 오미자, 산수유의 신맛과 어우러져 단맛으로 산감화음酸甘化陰의 효능을 극대화함. 평보平補의 탕액 속에서 비위의 기를 북돋우고 전체 처방의 완만하고 지속적인 보익력을 안정적으로 유지함","master":"1) 진료 사상 ①중서의 결합과 분기별 맞춤 치료 보조 진단 수용 : 현대 의학의 CT, 폐기능 검사, 혈액 검사 등을 사진四診의 연장선으로 수용하여, 환자의 신체 상태, 병기, 예후를 정확히 파악하여 적절한 치료법을 선택함 단계별 치료 원칙 초기 : 수술을 위주로 하고, 병리 분기에 따라 적절한 수술 후 보조 치료를 시행하며, 수술 후 환자는 중의 치료로 증상을 개선하고 재발과 전이를 예방함 방사선, 화학요법 및 표적 치료기 : 중의약으로 부작용을 줄이고 효과를 증강시킴 말기 및 고령 환자 : 중의약 치료를 위주로 하고 종양과 평화롭게 공존하는 ‘대병연년帶病延年’을 도모 ②병인병기 — 본허표실本虛標實 병인과 병기 : 폐암의 병인을 허虛, 담痰, 어瘀, 독毒의 4가지로 요약하며, 병기는 기음휴허氣陰虧虛, 담어호결痰瘀互結, 독사적취毒邪積聚로 봄 본과 표의 관계 : 전신은 허증으로 주로 폐와 비의 기음휴허氣陰虧虛이며, 국소는 실증으로 담응痰凝, 혈어血瘀, 독취毒聚로 구성됨. 치료는 시기에 따라 부정扶正과 거사祛邪의 비중을 조절함 ③변증입법과 처방의 도출 복잡한 증후 속에서 주증主症을 파악하여 변증하고, 치료 대법을 세운 뒤 처방과 약물이 도출되는 엄격한 임상 원칙 (이법방약理法方藥의 일치, 개인 경험의 한계 극복, 완급의 조절)을 강조함 2) 용약 특징 ①양음익기養陰益氣를 대법으로 삼고 겸증에 따라 가감 기본방 : 기음양허氣陰兩虛, 폐비휴허肺脾虧虛의 병기를 다스리는 양음익기방을 기본방으로 사용 단계별, 겸증별 가감 수술 후 체력 저하 : 황기, 당귀, 계혈등, 산약, 계내금, 사인, 초삼선焦三仙 등을 더해 익기양혈益氣養血 및 건비화위健脾和胃화학요법 부작용: 골수 억제, 식욕 부진, 구토, 변비 등이 나타날 때 황기, 당귀, 계혈등, 구기자, 죽여, 황련, 소엽, 사인, 화마인을 더해 강역지구降逆止嘔 및 행기통부行氣通腑 방사성 폐렴 및 폐섬유화 : 급성 방사성 폐렴은 중의학의 폐옹肺癰 범주로 보아 ‘급할 때는 그 표를 다스린다急則治其標’는 원칙에 따라 천금위경방千金葦莖方 가미방(의이인, 노근, 동과인, 길경, 황금, 어성초, 금교맥, 행인, 자완, 자소자,炙비파엽, 귤홍, 감초 등)으로 청폐화담淸肺化痰, 강기평천降氣平喘함. 만성 안정기나 폐섬유화(폐위肺痿)에는 양음익기방에 평천平喘 및 활혈화어活血化瘀 약물을 가미함 말기 및 쇠약 환자 : 중약 조리를 위주로 종양과 평화롭게 공존하는 대병연년帶病延年을 도모함. 기음양허氣陰兩虛, 담어호결痰瘀互結, 독탁내온毒濁內蘊을 다스리기 위해 양음익기방에 소자, 백개자, 지룡, 백부, 백과, 금교맥, 어성초, 백화사설초, 반지련半枝蓮 등을 더해 삶의 질을 높이고 생존 기간을 연장함 ②증증결합證症結合을 통해 병증의 핵심을 직접 겨냥 폐암은 변증상 주로 기음부족氣陰不足에 속하나 개별 증상이 두드러져 삶의 질을 떨어뜨리므로 증증결합證症結合원칙에 따라 주증을 겨냥한 가감을 병행함 흉통 : ‘통하지 않으면 아프다不通則痛’는 이론에 따라 천궁, 단삼, 계혈등 등 활혈화어活血化瘀, 지통止痛 약물과 함께 계지, 해백薤白으로 통양산결通陽散結하고, 행기지통行氣止痛의 명약인 연호색延胡索을 추가하여 병증의 핵심을 직접 겨냥함 불면 : 양혈안신養血安神, 중진안신重鎭安神의 炒산조인, 生용골, 生모려 등을 추가 인후 통증, 가려움 : 길경, 우방자, 사간을 추가해 이인利咽하고 지통止痛 구갈 : 석곡, 사삼으로 생진지갈生津止渴 위산 역류, 속쓰림 : 해표소, 煅와릉자로 제산制酸","rd":"","china":"중국 제품화 현황 허가 제품은 없음. 이 처방(태자삼·맥문동·오미자·황정·산수유)에 삼칠·자완·소자·행인·백과·지룡 등을 더한 13종 확장 조성 특허가 베이징둥팡윈자제약 명의로 출원 공개되어 심사 중이며, 적응증을 특발성 폐섬유증 완화기로 제시함[3] 시사점 중국에서는 소황지해과립 특허를 낸 둥팡윈자 계열 기업이 특발성 폐섬유증으로 제품화를 준비하고 있으므로, 국내는 원방 6종 조성으로 COPD·폐암 지지요법 근거를 확보해 대상 질환을 달리하는 전략이 유효. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 왕멍차오,루퉁,왕신추,등.국의대사 차오언샹의 양음익기법에 의한 안정기 만성폐쇄성폐질환 50례 임상 관찰以國醫大師晁恩祥養陰益氣法治療穩定期慢性阻塞性肺疾病50例臨床觀察[J].베이징중의약北京中醫藥,2023,42(5):497-500. [2] 정수쥔,왕신추,자시화,등.국의대사 차오언샹의 폐암 변증 치료 경험國醫大師晁恩祥辨治肺癌經驗[J].중화중의약잡지中華中醫藥雜志,2022,37(7):3855-3857. [3] 차오언샹晁恩祥 등.중약 조성물 및 양음익기 약물 제제一種中藥組合物和養陰益氣的藥物製劑:CN119235998A[P/OL]. https://patents.google.com/patent/CN119235998A."}},{"id":"5-3","ko":"견효탕","hz":"蠲哮湯","alias":"","master_ko":"훙광샹","master_hz":"洪廣祥","tagline":"담어痰瘀를 제거하고 폐기肺氣를 내려 효천의 발작을 제어하는 난치성 기침, 천식의 핵심 처방","meta":{"주요 적응증":"기관지 천식 급성 발작","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"견효편(중성약)"},"page":274,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-3 견효탕蠲哮湯의 모듈 구성<\/p><h4>①사폐통부瀉肺通腑 모듈 — 폐기肺氣를 가라앉히고 대장을 소통시킴<\/h4><p><b>정력자<\/b>: 폐기를 강력하게 아래로 내리고, 담음과 수기를 제거하여 막힌 기도를 소통시킴<\/p><p><b>生대황<\/b>: 폐와 표리 관계인 대장의 부기腑氣를 통하게 하여, 장관의 탁기를 아래로 배출시킴으로써, 상역하는 폐기가 자연스럽게 내려가도록 유도<\/p><h4>②사담리기瀉痰理氣 모듈 — 기기 순환 개선 및 담음의 실증 제거<\/h4><p><b>청피, 진피<\/b>: 울체된 간기肝氣와 폐기를 풀고 기체氣滯로 인해 정체된 진액이 담음으로 변하는 것을 막고 가래를 삭임<\/p><p><b>빈랑<\/b>: 기를 강하게 아래로 끌어내리고, 장관 및 호흡기의 기체와 담적을 밀어냄<\/p><p><b>모형자<\/b>: 폐기를 소통시켜 기침을 그치게 하고, 가래 배출을 용이하게 하여 평천平喘 작용을 보완<\/p><h4>③척어해표滌瘀解表 모듈 — 어혈, 알레르기 반응을 제거하고 표한을 방어<\/h4><p><b>귀전우<\/b>: 활혈거어活血祛瘀 및 항알레르기 작용을 통해 기도의 염증과 어혈을 제거하며, 대황과 시너지를 이루어 어혈 제거 효과 강화<\/p><p><b>생강<\/b>: 외부의 풍한風寒과 내부 수음水飮을 발산시키는 동시에, 정력자와 대황 등 고한苦寒한 약재로부터 위장을 보호<\/p>"},{"k":"master","t":"훙광샹의 기관지 천식 치료","html":"<h4>①병인병기 인식<\/h4><p><b>담어복폐痰瘀伏肺와 숙근夙根<\/b>: 숙담宿痰과 어혈瘀血이 서로 엉켜 흉중에 잠복하여 천식 발작의 근본 원인인 숙근을 형성함<\/p><p><b>폐기옹색肺氣壅塞과 주요 모순<\/b>: 천식 발작기에는 폐중의 옹색지기壅塞之氣가 가장 주된 모순으로 작용하여 기도의 과도한 수축과 경련을 일으킴<\/p><p><b>풍담상역風痰上逆과 묵은 엉킴<\/b>: 풍사風邪와 담열痰熱이 결합하거나 기체혈어氣滯血瘀로 인해 담어痰瘀가 상역하여 발작적이고 완고한 효천을 유발함<\/p><h4>②치료 원칙 및 핵심 사상<\/h4><p><b>치기위선治氣爲先의 대원칙<\/b>: 발작기의 주요 모순인 옹색지기를 우선적으로 해결하며, 기가 순조로우면 담이 사라지고 기가 원활하면 혈이 살아나 최종적으로 담소어산痰消瘀散을 달성함<\/p><p><b>치폐불원온治肺不遠溫과의 융합<\/b>: 발작기의 치기위선과 완화기의 온양호위溫陽護衛 및 전 과정 온법을 결합하여 전인적인 치료를 완성함<\/p><p><b>이병동치異病同治의 확장<\/b>: 담어복폐와 폐기옹색이 나타나는 만성 폐질환 전반에 걸쳐 본 학술사상을 적용할 수 있음<\/p><h4>③단계별 및 증상별 치법 활용<\/h4><p><b>사폐제옹瀉肺除壅과 고강苦降<\/b>: 《내경內經》의 ‘폐는 기가 위로 치솟는 것을 괴로워하니, 급히 쓴맛을 취하여 이를 내려주어야 한다肺苦氣上逆, 急食苦以瀉之’는 이론에 근거하여 고강하는 약물을 활용해 상역하는 기를 내림<\/p><p><b>통부사폐通腑瀉肺의 결합<\/b>: 폐와 대장의 표리 관계를 이용하여 대황으로 장부를 통하게 하여 탁기를 아래로 내려 폐기의 숙강을 유도함<\/p><p class=\"lbl2\">변증 가감 및 맞춤형 배오<\/p><p class=\"sub\"><b>한담효寒痰哮<\/b>: 건강, 세신을 더해 온화함<\/p><p class=\"sub\"><b>열담효熱痰哮<\/b>: 황금, 어성초를 더해 청열함<\/p><p class=\"sub\"><b>표한증表寒證<\/b>: 生마황, 소엽을 더해 해표산한함<\/p><p class=\"sub\"><b>과민·알레르기 증상<\/b>: 선퇴, 신이, 백선피, 지부자 등을 가미함<\/p><p class=\"sub\"><b>대변 상태에 따른 조절<\/b>: 대변불통 시 生대황(後下), 대변이 묽을 때 熟대황을 사용<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>견효탕은 장중약업江中藥業이 정제(견효편蠲哮片)로 제품화하였으며, 대사 명의 제조 특허(2007년 장중약업에 이전, 2013년 존속기간 만료)와 화룬장중의 지문 크로마토그램 특허(2026년 등록)가 확인됨[3][4]. 견효편의 허가 조성은 원처방 8미에서 귀전우를 제외한 7미로 구성 허가 중성약 설명서 요점[5][6]<\/p><div class=\"tbl\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>제품명<\/td><td>견효편 蠲哮片 (Juānxiào Piàn)<\/td><\/tr><tr><td>허가·규격<\/td><td>처방약, 필름코팅정 1정 0.3g, 중국약전 수재(원명 정천령定喘靈) 허가번호 Z10960033(장중약업江中藥業)<\/td><\/tr><tr><td>효능· 적응증<\/td><td>사폐제옹瀉肺除壅·척담거어滌痰祛瘀·이기평천利氣平喘기관지 천식 급성 발작기의 열효熱哮 담어복폐증痰瘀伏肺證(거친 호흡, 가래 끓는 소리, 발작성 기침, 누렇고 진한 가래)<\/td><\/tr><tr><td>용법·용량<\/td><td>식후 1회 8정, 1일 3회, 7일을 1주기로 함 10세 미만 소아는 1회 3~5정<\/td><\/tr><tr><td>금기·주의<\/td><td>· 임부, 오래 앓아 허약하거나 비위가 약하고 변이 묽은 환자 금기<br>· 심·뇌·간·신 합병증이 있거나 천식 지속 상태인 중증 환자, 천식 허증 환자 금기<br>· 감염이 동반되면 항균제를 함께 씀<br>· 복용 후 묽은 변·가벼운 복통이 나타날 수 있음(설명서에는 정상 반응으로 기재)<\/td><\/tr><\/tbody><\/table><\/div><p class=\"boxlbl\">시사점<\/p><p class=\"box\">제조 특허가 만료되어 조성 자체는 자유롭게 쓸 수 있으므로, 국내는 정제와 탕제의 조성 차이를 확인하고 급성 발작기 병용 근거를 확보하는 것이 출발점이며, 국내 공정서에 없는 모형자는 대체 약재를 검토해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 천싱화,천젠젠.견효탕의 기관지 천식 치료 임상 연구蠲哮湯治療支氣管哮喘的臨床研究[J].후난중의약도보湖南中醫藥導報,1996,(1):11-14.<\/li><li class=\"ref\">[2] 커스원,쩡리전,리사오펑,등.국의대사 훙광샹의 “치담치어이치기위선” 학술사상에 대한 고찰淺析國醫大師洪廣祥“治痰治瘀以治氣爲先”學術思想[J].중화 중의약잡지中華中醫藥雜志,2020,35(1):176-179.<\/li><li class=\"ref\">[3] 훙광샹洪廣祥.천식을 치료하는 중성약 및 생산방법一種治療哮喘病中成藥及其生產方法:CN1054978C[P/OL].<a href=\"https://patents.google.com/patent/CN1054978C.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN1054978C.<\/a><\/li><li class=\"ref\">[4] 화룬장중약업華潤江中藥業.견효편 지문도 및 건립방법蠲哮片指紋圖譜及其建立方法:CN117783363B[P/OL].<a href=\"https://patents.google.com/patent/CN117783363B.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN117783363B.<\/a><\/li><li class=\"ref\">[5] 중국의약정보조회플랫폼中國醫藥信息查詢平臺.견효편蠲哮片 약품 정보(성분·규격·용법·주의사항)[DB/OL].<a href=\"https://www.dayi.org.cn/drug/1022229.\" target=\"_blank\" rel=\"noopener\">https://www.dayi.org.cn/drug/1022229.<\/a><\/li><li class=\"ref\">[6] 약원망藥源網.국약준자 Z10960033 견효편蠲哮片(장중약업江中藥業)[DB/OL].<a href=\"https://www.yaopinnet.com/z33/Z10960033.htm.\" target=\"_blank\" rel=\"noopener\">https://www.yaopinnet.com/z33/Z10960033.htm.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"정력자10g","name":"정력자","dose":"10g","base":"정력자"},{"raw":"청피10g","name":"청피","dose":"10g","base":"청피"},{"raw":"진피10g","name":"진피","dose":"10g","base":"진피"},{"raw":"빈랑10g","name":"빈랑","dose":"10g","base":"빈랑"},{"raw":"生대황10 로 내리고, 담음과 수기를 제거하여 막힌 기도를 소통시킴 生대황 : 폐와 표리 관계인 대장의 부기腑氣를 통하게 하여, 장관의 탁기를 아래로 배출시킴으로써, 상역하는 폐기가 자연스럽게 내려가도록 유도 ②사담리기瀉痰理氣 모듈 — 기기 순환 개선 및 담음의 실증 제거 청피, 진피 : 울체된 간기肝氣와 폐기를 풀고 기체氣滯로 인해 정체된 진액이 담음으로 변하는 것을 막고 가래를 삭임 빈랑 : 기를 강하게 아래로 끌어내리고, 장관 및 호흡기의 기체와 담적을 밀어냄 모형자 : 폐기를 소통시켜 기침을 그치게 하고, 가래 배출을 용이하게 하여 평천平喘 작용을 보완 ③척어해표滌瘀解表 모듈 — 어혈, 알레르기 반응을 제거하고 표한을 방어 귀전우 : 활혈거어活血祛瘀 및 항알레르기 작용을 통해 기도의 염증과 어혈을 제거하며, 대황과 시너지를 이루어 어혈 제거 효과 강화 생강 : 외부의 풍한風寒과 내부 수음水飮을 발산시키는 동시에, 정력자와 대황 등 고한苦寒한 약재로부터 위장을 보호","master":"①병인병기 인식 담어복폐痰瘀伏肺와 숙근夙根 : 숙담宿痰과 어혈瘀血이 서로 엉켜 흉중에 잠복하여 천식 발작의 근본 원인인 숙근을 형성함 폐기옹색肺氣壅塞과 주요 모순 : 천식 발작기에는 폐중의 옹색지기壅塞之氣가 가장 주된 모순으로 작용하여 기도의 과도한 수축과 경련을 일으킴 풍담상역風痰上逆과 묵은 엉킴 : 풍사風邪와 담열痰熱이 결합하거나 기체혈어氣滯血瘀로 인해 담어痰瘀가 상역하여 발작적이고 완고한 효천을 유발함 ②치료 원칙 및 핵심 사상 치기위선治氣爲先의 대원칙 : 발작기의 주요 모순인 옹색지기를 우선적으로 해결하며, 기가 순조로우면 담이 사라지고 기가 원활하면 혈이 살아나 최종적으로 담소어산痰消瘀散을 달성함 치폐불원온治肺不遠溫과의 융합 : 발작기의 치기위선과 완화기의 온양호위溫陽護衛 및 전 과정 온법을 결합하여 전인적인 치료를 완성함 이병동치異病同治의 확장 : 담어복폐와 폐기옹색이 나타나는 만성 폐질환 전반에 걸쳐 본 학술사상을 적용할 수 있음 ③단계별 및 증상별 치법 활용 사폐제옹瀉肺除壅과 고강苦降 : 《내경內經》의 ‘폐는 기가 위로 치솟는 것을 괴로워하니, 급히 쓴맛을 취하여 이를 내려주어야 한다肺苦氣上逆, 急食苦以瀉之’는 이론에 근거하여 고강하는 약물을 활용해 상역하는 기를 내림 통부사폐通腑瀉肺의 결합 : 폐와 대장의 표리 관계를 이용하여 대황으로 장부를 통하게 하여 탁기를 아래로 내려 폐기의 숙강을 유도함 변증 가감 및 맞춤형 배오 한담효寒痰哮 : 건강, 세신을 더해 온화함 열담효熱痰哮 : 황금, 어성초를 더해 청열함 표한증表寒證 : 生마황, 소엽을 더해 해표산한함 과민·알레르기 증상 : 선퇴, 신이, 백선피, 지부자 등을 가미함 대변 상태에 따른 조절 : 대변불통 시 生대황(後下), 대변이 묽을 때 熟대황을 사용","rd":"","china":"중국 제품화 현황 견효탕은 장중약업江中藥業이 정제(견효편蠲哮片)로 제품화하였으며, 대사 명의 제조 특허(2007년 장중약업에 이전, 2013년 존속기간 만료)와 화룬장중의 지문 크로마토그램 특허(2026년 등록)가 확인됨[3][4]. 견효편의 허가 조성은 원처방 8미에서 귀전우를 제외한 7미로 구성 허가 중성약 설명서 요점[5][6] 항목 내용 제품명 견효편 蠲哮片 (Juānxiào Piàn) 허가·규격 처방약, 필름코팅정 1정 0.3g, 중국약전 수재(원명 정천령定喘靈) 허가번호 Z10960033(장중약업江中藥業) 효능· 적응증 사폐제옹瀉肺除壅·척담거어滌痰祛瘀·이기평천利氣平喘기관지 천식 급성 발작기의 열효熱哮 담어복폐증痰瘀伏肺證(거친 호흡, 가래 끓는 소리, 발작성 기침, 누렇고 진한 가래) 용법·용량 식후 1회 8정, 1일 3회, 7일을 1주기로 함 10세 미만 소아는 1회 3~5정 금기·주의 · 임부, 오래 앓아 허약하거나 비위가 약하고 변이 묽은 환자 금기 · 심·뇌·간·신 합병증이 있거나 천식 지속 상태인 중증 환자, 천식 허증 환자 금기 · 감염이 동반되면 항균제를 함께 씀 · 복용 후 묽은 변·가벼운 복통이 나타날 수 있음(설명서에는 정상 반응으로 기재) 시사점 제조 특허가 만료되어 조성 자체는 자유롭게 쓸 수 있으므로, 국내는 정제와 탕제의 조성 차이를 확인하고 급성 발작기 병용 근거를 확보하는 것이 출발점이며, 국내 공정서에 없는 모형자는 대체 약재를 검토해야 함 참고문헌 [1] 천싱화,천젠젠.견효탕의 기관지 천식 치료 임상 연구蠲哮湯治療支氣管哮喘的臨床研究[J].후난중의약도보湖南中醫藥導報,1996,(1):11-14. [2] 커스원,쩡리전,리사오펑,등.국의대사 훙광샹의 “치담치어이치기위선” 학술사상에 대한 고찰淺析國醫大師洪廣祥“治痰治瘀以治氣爲先”學術思想[J].중화 중의약잡지中華中醫藥雜志,2020,35(1):176-179. [3] 훙광샹洪廣祥.천식을 치료하는 중성약 및 생산방법一種治療哮喘病中成藥及其生產方法:CN1054978C[P/OL]. https://patents.google.com/patent/CN1054978C. [4] 화룬장중약업華潤江中藥業.견효편 지문도 및 건립방법蠲哮片指紋圖譜及其建立方法:CN117783363B[P/OL]. https://patents.google.com/patent/CN117783363B. [5] 중국의약정보조회플랫폼中國醫藥信息查詢平臺.견효편蠲哮片 약품 정보(성분·규격·용법·주의사항)[DB/OL]. https://www.dayi.org.cn/drug/1022229. [6] 약원망藥源網.국약준자 Z10960033 견효편蠲哮片(장중약업江中藥業)[DB/OL]. https://www.yaopinnet.com/z33/Z10960033.htm."}},{"id":"5-4","ko":"보원탕","hz":"補元湯","alias":"","master_ko":"훙광샹","master_hz":"洪廣祥","tagline":"보익종기補益宗氣와 삼장동치三臟同治를 통해 만성 폐쇄성 폐질환(COPD) 안정기를 치료하는 처방","meta":{"주요 적응증":"COPD 안정기","확인된 연구자료 유형":"연구 축적 (논문 32편)","제형·제품화":"—"},"page":279,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-4 보원탕補元湯의 모듈 구성<\/p><h4>①보기익기補氣益氣 및 승양거함升陽擧陷 모듈 — 폐비의 기를 보충하고 하함된 대기를 끌어올림<\/h4><p><b>황기, 당삼, 백출, 감초<\/b>: 보중익기탕의 기본 구조를 바탕으로, 대량의 황기와 당삼, 백출, 감초를 통해 종기의 화생원을 충실히 하고, 비기를 굳건히 함<\/p><p><b>승마, 시호<\/b>: 승양거함升陽擧陷하여 하함된 기를 끌어올리고, 비위의 승청升淸 기능을 도움<\/p><h4>②조기화중調氣和中 및 양혈활혈養血活血 모듈 — 기의 흐름을 조절하고 약물의 정체를 막으며 혈액 순환을 도움<\/h4><p><b>진피<\/b>: 진피로 이기화중理氣和中하여 다량의 보기약으로 인해서 기가 체류하는 것을 방지함<\/p><p><b>당귀<\/b>: 당귀로 양혈활혈하여 기행혈행氣行血行을 돕고 보익 작용을 보조함<\/p><h4>③보신납기補腎納氣 및 섭납원기攝納元氣 모듈 — 신장을 보하여 원기를 굳건히 하고 납기納氣 기능을 강화함<\/h4><p><b>산수유, 쇄양<\/b>: 보중익기탕에 보신 약물인 산수유와 쇄양을 가미하여 폐비신 삼장을 동시에 보익하면서 원기를 굳건히 하고 납기 기능을 강화함<\/p>"},{"k":"master","t":"훙광샹의 만성 폐쇄성 폐질환 치료","html":"<h4>①병인병기 인식 — 종기허쇠宗氣虛衰와 폐비신의 실사失司<\/h4><p class=\"lbl2\">종기허쇠와 COPD 발병의 중심 고리<\/p><p class=\"sub\">종기宗氣는 선천의 원기, 폐가 흡수한 자연의 청기, 비위가 운화한 수곡정기가 흉중기해에 모여 형성되는 인체 모든 기의 근본이자 총강임<\/p><p class=\"sub\">대사는 종기의 허쇠가 폐비신 삼장의 기능 저하와 직결되며, 이것이 COPD의 발생, 발전, 악화 전 과정을 관통하는 핵심 병기라고 보았음. 종기가 부족하면 폐의 호흡 기능과 주리腠理 고섭固攝이 무너지고 전신 기혈 운행에 장애가 발생함<\/p><p>견폐지병見肺之病, 당선실비當先實脾과 폐비신의 삼장동치三臟同治<\/p><p class=\"sub\">오행의 원리에 따라 토능생금土能生金하므로 비는 폐의 모母가 되며, 폐가 일신의 기를 주관하는 전제는 비위가 기혈생화지원氣血生化之源으로서 역할을 다할 때 가능함<\/p><p class=\"sub\">COPD가 장기화되면 폐병이 비를 상하게 하고, 나아가 신까지 미쳐 폐비신 삼장三臟이 모두 허손되며, 수액 대사가 무너져 담음과 어혈이 내생하게 됨<\/p><p class=\"lbl2\">위양허약衛陽虛弱과 담어복폐痰瘀伏肺<\/p><p class=\"sub\">위기衛氣는 중초에서 기원하여 폐의 선발宣發을 통해 체표를 방어하므로, 비위 기능의 허약은 위양의 부족으로 이어져 외부의 사기를 방어하지 못하는 상태를 초래함<\/p><p class=\"sub\">비위의 승강升降 기전이 엉키면서 생긴 담탁痰濁과 어혈瘀血이 기도를 폐색하고 담어복폐痰瘀伏肺하여, 이것이 다시 양기를 손상하여 질병을 만성화시키는 악순환을 형성함<\/p><p class=\"lbl2\">호흡근 쇠약 및 영양 장애와의 연계<\/p><p class=\"sub\">횡격막 무력으로 인한 호흡근 쇠약, 전신 영양 장애 및 면역력 저하는 단순한 국소적 근육 약화가 아니라, 전신 기혈의 총본산인 종기가 극도로 허쇠해진 국면을 반영하는 병리적 현상임<\/p><h4>②치료원칙과 치법 — 허실병치虛實幷治와 두절생담지원杜絕生痰之源<\/h4><p><b>보허사실補虛瀉實과 폐비신의 삼장동치三臟同治<\/b>: 본허표실의 병기에 맞추어, 본치本治로써 종기宗氣를 북돋우고 폐비신 삼장을 함께 다스리며, 표치標治로써 담痰과 어瘀를 제거하여 기도를 열어주는 허실병치虛實幷治의 원칙을 확립함<\/p><p><b>치담치어治痰治瘀는 치기治氣가 우선<\/b>: 담痰과 어瘀가 비록 중요한 병리 산물이지만, 그 생성이 기氣의 허약과 승강升降실조에 기인하므로 단순히 가래를 삭이고 어혈을 제거하는 방식에서 벗어나, 기氣를 다스려 담어痰瘀의 근본 원인을 차단하는 두절생담지원杜絕生痰之源을 강조함<\/p><p><b>승함탕升陷湯의 한계 극복과 보원탕補元湯<\/b>: 승함탕이 흉중의 기를 일시적으로 끌어올리는 데는 유용하나 비위를 근본적으로 튼튼히 하는 힘이 약하다는 점을 간파하고, 보중익기탕을 중심에 두어 온보溫補와 승제升提의 효과를 함께 얻도록 처방 체계를 구성함<\/p><h4>③단계별 변증가감<\/h4><p><b>기본 치료<\/b>: 보원탕補元湯을 통한 종기宗氣 보익<\/p><p class=\"sub\">보중익기탕에 산수유, 쇄양 등의 보신약補腎藥을 가미하여 폐비신 삼장을 동시 보익함. 특히 生황기를 30-50g 대량 사용하여 고표固表, 승양升陽하고 폐비신 동치의 핵심 동력을 확보하고, 승마, 시호로 상행을 도우며 진피로 보약에 의한 정체를 막음<\/p><p class=\"lbl2\">증상별 가감<\/p><p class=\"sub\"><b>위양허약衛陽虛弱, 외감 방어 시<\/b>: 익기호위탕益氣護衛湯(옥병풍산+계지탕+이선탕二仙湯)을 사용하여 위양衛陽을 굳건히 함. 양허陽虛가 심할 때는 보골지補骨脂, 호로파葫蘆巴로 대체(온양호위탕溫陽護衛湯)<\/p><p class=\"sub\"><b>담음痰飮, 담탁痰濁 내정內停 시<\/b>: 영계출감탕(복령30g 이상)을 활용하여 수습을 다스리고, 담痰이 교결되어 거칠어졌을 때는 천민탕千緡湯, 몽석곤담탕礞石滾痰湯 등으로 뚜렷한 표실標實을 먼저 해소함<\/p><p class=\"sub\"><b>급성기 담어조색痰瘀阻塞 시<\/b>: 맹목적인 보기가 기도를 더욱 막는 애사礙邪를 경계하고, 대황 등을 통한 통부설담법通腑泄痰法이나 도홍사물탕, 견효탕蠲哮湯 등의 활혈화어, 선폐평천宣肺平喘 약물을 먼저 써서 길을 터준 뒤 보기를 시행함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모 및 정량적 위상<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 32 편 발표<\/td><td>최근 5 년간 21편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">만성 폐쇄성 폐질환<\/span> <span class=\"kw\">소기도 기능장애<\/span> <span class=\"kw\">기관지확장증<\/span> <span class=\"kw\">저산소성 폐혈관 리모델링<\/span> <span class=\"kw\">골격근 위축<\/span> <span class=\"kw\">골다공증<\/span><\/td><td>폐 및 호흡기 질환 관리에 집중하며, 종기부족宗氣不足 및 비신脾腎의 선후천先後天 이론 기반의 소기도 기능 개선, 호흡기 외 합병증(골격근 위축·골다공증)으로 적응증 확장 연구<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">와위臥位 조기 재활 운동 병용<\/span> <span class=\"kw\">견효탕과 병용<\/span> <span class=\"kw\">양약 병용 보조<\/span><\/td><td>운동 재활 요법 및 중약 복합 투여를 통한 폐 기능 회복, 기도 리모델링 억제 및 장내 세균총 조절 등 중서의 결합 효과 증대 전략 탐색<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">P62/Keap1/Nrf2<\/span> <span class=\"kw\">IL-6/STAT3<\/span> <span class=\"kw\">NLRP3 염증소체<\/span> <span class=\"kw\">HIF-1/NOR-1<\/span> <span class=\"kw\">Treg/Th17 세포<\/span> <span class=\"kw\">m6A 메틸화 METTL3/WTAP<\/span><\/td><td>산화 스트레스, 기도 점액 과분비, 염증소체 및 자가포식 조절, 후성유전학적 메틸화 지표 등 정량화된 객관적 바이오마커 기전 연구<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">분자 도킹<\/span> <span class=\"kw\">이병동치異病同治<\/span> <span class=\"kw\">동물 모델(COPD/골다공증)<\/span> <span class=\"kw\">임상 무작위 대조 연구<\/span><\/td><td>다중 성분-다중 타깃(Multi-target)의 이병동치 기전 규명 고도화 및 세포·동물 실험과 임상 검증을 결합한 통합 연구 체계 구축<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2025-2026 최신 연구)<\/h4><p class=\"row\">P62/Keap1/Nrf2 경로 통한 골격근 위축 개선 기전 <b>2026, 陳剛 등<\/b><\/p><p>P62, Nrf2 발현을 상향 조절하고 Keap1 발현을 하향 조절하여 SOD, CAT 활성을 높임으로써, 산화 스트레스를 조절해 폐 및 근육 조직 손상을 완화하고 악력과 체중을 개선함<\/p><p><b>의미<\/b> 보원탕이 P62/Keap1/Nrf2 경로를 통해 만성 폐쇄성 폐질환 합병 골격근 위축을 개선하는 분자 기전을 동물 모델에서 제시함<\/p><p class=\"row\">IL-6/STAT3 경로 조절을 통한 기도 점액 과분비 억제 <b>2025, 謝榮芳 등<\/b><\/p><p>IL-6/STAT3 신호전달경로를 억제하여 MUC5AC, MMP-9, NE 발현을 낮추고 배세포 개체수를 줄임으로써, COPD 질환 모델의 폐 기능 및 기도 점액 과분비를 유의하게 개선함<\/p><p><b>의미<\/b> 보원탕이 기도 염증을 억제하고 점액 과분비를 개선하는 분자 표적 및 신호전달경로를 비임상 모델에서 제시함<\/p><p class=\"row\">네트워크 약리학 기반 ‘이병동치’ 분자 기전 <b>2025, 盧梓鋌 등<\/b><\/p><p>퀘르세틴 등 6가지 핵심 성분과 TNF 등 10개 핵심 표적을 발굴하여, AGE-RAGE, TNF 등 신호전달경로를 조절할 것으로 예측함(네트워크 약리학)<\/p><p><b>의미<\/b> 시스템 생물학 관점에서 보원탕이 다성분·다표적·다경로를 통해 COPD와 기관지확장증을 이병동치하는 복합 기전을 예측함<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">연구 축적(32편)에도 공개자료상 중국 제품·특허가 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 같은 대사의 견효편이 제품화된 사례는 기업 협력 모델로 참고할 수 있음. 한글로 검색하면 동음의 고방 보원탕保元湯과 섞이므로 한자명으로 구분해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 류리,후춘메이,류메이녠,등.“견폐지병, 당선실비”에 기반한 국의대사 훙광샹의 만성 폐쇄성 폐질환 치료 경험 탐구基於“見肺之病，當先實脾”探討國醫大師洪廣祥論治慢性阻塞性肺疾病經驗[J].장시중의약대학학보江西中醫藥大學學報,2026,38(3):29-32.<\/li><li class=\"ref\">[2] 장펀펀,왕위룽,셰룽팡,등.국의대사 훙광샹의 종기 보익에 따른 만성 폐쇄성 폐질환 안정기 치료 경험에 대한 고찰國醫大師洪廣祥從補益宗氣論治慢性阻塞性肺病穩定期經驗淺析[J].중의약통보中醫藥通報,2024,23(2):9-12.<\/li><li class=\"ref\">[3] 왕리화,장위안빙,란즈후이,등.국의대사 훙광샹 교수의 만성 폐쇄성 폐질환 치료 경험國醫大師洪廣祥教授治療慢性阻塞性肺疾病經驗[J].중화중의약잡지中華中醫藥雜志,2016,31(7):2590-2592.<\/li><li class=\"ref\">[4] 왕리화.훙광샹의 종기 이론을 활용한 만성 폐쇄성 폐질환 안정기 치료 경험 계승 및 임상 연구洪廣祥運用宗氣理論治療慢性阻塞性肺疾病穩定期的經驗繼承與臨床研究[D].난징중의약대학南京中醫藥大學,2012.<\/li><li class=\"ref\">[5] 천강,셰룽팡,황춘옌,천스위,왕위하오,장산,란즈후이.보원탕이 P62/Keap1/Nrf2 신호경로를 통해 산화스트레스를 조절하여 COPD 랫드의 골격근 위축을 개 선하는 작용기전補元湯經P62/Keap1/Nrf2信號通路調控氧化應激改善COPD大鼠骨骼肌萎縮的作用機制[J].시진국의국약時珍國醫國藥,2026,37(1):27-32.<\/li><li class=\"ref\">[6] 셰룽팡,리먀오먀오,황춘옌,란즈후이.보원탕이 IL-6/STAT3 신호경로를 조절하여 COPD 랫드의 기도 점액 과다분비에 미치는 영향補元湯調控IL-6/STAT3信號通路對COPD大鼠氣道黏液高分泌的影響[J].중화중의약잡지中華中醫藥雜志,2025,40(2):619-624.<\/li><li class=\"ref\">[7] 루쯔팅,황이웨이,셰룽팡,쑨위신,주링,왕웨이팅,란즈후이.네트워크 약리학과 분자 도킹에 기반한 보원탕의 ‘이병동치’에 따른 만성폐쇄성폐질환과 기관지확장 증 치료 기전 연구基於網絡藥理學和分子對接的補元湯“異病同治”慢性阻塞性肺疾病和支氣管擴張症的機制研究[J].중국병원용약평가와분석中國醫院用藥評價與分析,2025,25(1):25-32.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"生황기30~50g","name":"生황기","dose":"30~50g","base":"황기"},{"raw":"당삼30g","name":"당삼","dose":"30g","base":"당삼"},{"raw":"백출10g","name":"백출","dose":"10g","base":"백출"},{"raw":"炙감초6g","name":"炙감초","dose":"6g","base":"감초"},{"raw":"진피10g","name":"진피","dose":"10g","base":"진피"},{"raw":"당귀10g","name":"당귀","dose":"10g","base":"당귀"},{"raw":"승마10g","name":"승마","dose":"10g","base":"승마"},{"raw":"시호10g","name":"시호","dose":"10g","base":"시호"},{"raw":"산수유10g","name":"산수유","dose":"10g","base":"산수유"},{"raw":"쇄양10g","name":"쇄양","dose":"10g","base":"쇄양"}],"notes":[],"핵심 효능":["비·폐의 기를 굳건히 하여 흉중의 종기宗氣를 충실히 북돋음(건비보종健脾補宗)","선천의 원기를 북돋우고 신정을 보충하여 폐의 허손을 다스리고 근본을 튼튼히 함(배원고본培元固本)","진액의 정체를 막고 수습의 원천을 차단하여 담음의 생성을 막음(두절생담杜絕生痰)"],"주치증":["만성 폐쇄성 폐질환(COPD) 안정기, 폐창肺脹, 천증喘證, 종기허쇠宗氣虛衰, 폐비신허손肺脾腎虛損, 동즉기촉動則氣促, 횡격막과 호흡 관련 근육의 무력 등"],"연구 확장 영역":["만성 폐쇄성 폐질환(COPD) 안정기, 폐창, 천증, 호흡근 쇠약 및 운동내성 저하, COPD 동반 전신 영양장애"],"R&D 포인트":["황기, 당삼, 백출, 쇄양, 산수유 배합에 따른 종기宗氣의 보익 및 호흡근 쇠약 개선 기전","승마, 시호, 진피, 당귀 배합을 통한 승양거함升陽擧陷 및 보이불체補而不滯 메커니즘","폐비신 삼장동치 및 두절생담 전략을 통한 담어복폐痰瘀伏肺 차단 및 급성 악화 억제"]},"modules":[{"name":"①보기익기 · 승양거함","hz":"補氣益氣 · 升陽擧陷","herbs":["황기","당삼","백출","감초","승마","시호"],"role":"폐비의 기를 보충하고 하함된 대기를 끌어올림"},{"name":"②조기화중 · 양혈활혈","hz":"調氣和中 · 養血活血","herbs":["진피","당귀"],"role":"기의 흐름을 조절하고 약물의 정체를 막으며 혈액 순환을 도움"},{"name":"③보신납기 · 섭납원기","hz":"補腎納氣 · 攝納元氣","herbs":["산수유","쇄양"],"role":"신장을 보하여 원기를 굳건히 하고 납기納氣 기능을 강화함"}],"rd":[{"tag":"Skeletal Muscle Wasting","title":"COPD 동반 골격근 위축 개선","html":"<p>보원탕이 P62/Keap1/Nrf2 경로를 통해 산화 스트레스를 줄여 COPD 랫드의 골격근 위축을 개선했다는 결과는 ‘종기宗氣 보익’과 호흡·사지 근력 회복을 직접 연결하는 근거임<\/p><p>근감소 동반 COPD를 가장 차별화된 적응증으로 설정<\/p><p><b>검증 설계<\/b> 담배연기+LPS 유도 COPD 랫드에서 근섬유 단면적과 Nrf2 경로를 측정하고, 임상에서는 6분 보행 거리·악력·대퇴사두근 단면적(초음파)을 1차 지표로 한 무작위 대조 임상<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [5](2026, P62/Keap1/Nrf2 골격근 위축)<\/p>"},{"tag":"Mucus Hypersecretion","title":"객담 과다형 COPD의 점액 과분비 억제","html":"<p>IL-6/STAT3 신호 억제로 MUC5AC·MMP-9·호중구 엘라스타제 발현과 배세포 수를 줄였다는 결과가 있음<\/p><p>이를 근거로 만성 기관지염형(객담 과다) COPD 환자를 선별하면 효과가 더 분명하게 드러날 수 있음<\/p><p><b>검증 설계<\/b> 객담량과 기침·객담 설문(CASA-Q)을 1차 지표로, 객담 내 MUC5AC를 바이오마커로 측정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [6](2025, IL-6/STAT3 점액 과분비)<\/p>"},{"tag":"Rehabilitation Combination","title":"호흡 재활 운동과의 병용","html":"<p>본문 연구 동향에서 와위 조기 재활 운동과의 병용이 제시되었고 종기 이론에 따른 안정기 COPD 임상 연구가 있음<\/p><p>표준 호흡 재활 프로그램에 보원탕을 더했을 때 운동 능력 향상 폭이 커지는지를 확인하는 병용 임상이 현실적<\/p><p><b>검증 설계<\/b> 8~12주 호흡 재활 단독 대 재활+보원탕 무작위 비교, 1차 지표 6분 보행 거리(최소 임상 중요 차이를 반영해 표본 수 산정), 2차 지표 CAT·mMRC 호흡곤란 점수<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 본문 「병용 전략」 표, 참고문헌 [4](종기 이론 임상 연구)<\/p>"},{"tag":"Continuum of Care","title":"안정기–급성기 연속 치료와 이병동치","html":"<p>네트워크 약리학으로 COPD와 기관지확장증의 이병동치 기전이 예측되었고 견효탕과의 병용이 언급되나, 안정기 보원탕 임상과 급성 악화기 치료는 별도 프로토콜로 분리함<\/p><p>급성 악화기 견효탕 적용은 표준 진료에 더한 추가 근거를 쌓는 범위로 제한<\/p><p><b>검증 설계<\/b> 안정기 보원탕군 12개월 관찰에서 연간 중등도 이상 급성 악화 횟수와 입원율을 1차 지표로 설정(급성 악화기 병용은 별도 연구)<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [7](2025, 이병동치 기전), [1][2](COPD 치료 경험), 본문 「병용 전략」<\/p>"}],"logic":[{"n":"1","title":"건비보종健脾補宗과 배원고본培元固本","body":"대량의 보기약과 비위 보강을 통해 종기의 화생원을 충실히 하고 폐비신 삼장을 함께 다스림"},{"n":"2","title":"승양거함升陽擧陷과 보이불체補而不滯","body":"하함된 대기를 끌어올리고 이기화중을 통해 다량의 보기약으로 인한 체류를 방지함"},{"n":"3","title":"두절생담지원杜絕生痰之源과 담어차단痰瘀遮斷","body":"수습의 원천을 차단하여 담음의 생성을 막고 기를 다스려 담어복폐痰瘀伏肺를 예방함"},{"n":"4","title":"허실병치虛實幷治와 삼장동치三臟同治","body":"본허표실의 병태에 대응하여 근본을 다스리는 보법과 국소의 표실을 해결하는 치법을 병행함"}],"field":5,"pages":[279,285],"evidence":"연구 축적 (논문 32편)","product":"—","status":"확인된 제품·특허 없음","s":["5-4","보원탕","補元湯","","훙광샹","洪廣祥","보익종기補益宗氣와 삼장동치三臟同治를 통해 만성 폐쇄성 폐질환(COPD) 안정기를 치료하는 처방","生황기30~50g 당삼30g 백출10g 炙감초6g 진피10g 당귀10g 승마10g 시호10g 산수유10g 쇄양10g","","핵심 효능 비·폐의 기를 굳건히 하여 흉중의 종기宗氣를 충실히 북돋음(건비보종健脾補宗) 선천의 원기를 북돋우고 신정을 보충하여 폐의 허손을 다스리고 근본을 튼튼히 함(배원고본培元固本) 진액의 정체를 막고 수습의 원천을 차단하여 담음의 생성을 막음(두절생담杜絕生痰)","주치증 만성 폐쇄성 폐질환(COPD) 안정기, 폐창肺脹, 천증喘證, 종기허쇠宗氣虛衰, 폐비신허손肺脾腎虛損, 동즉기촉動則氣促, 횡격막과 호흡 관련 근육의 무력 등","연구 확장 영역 만성 폐쇄성 폐질환(COPD) 안정기, 폐창, 천증, 호흡근 쇠약 및 운동내성 저하, COPD 동반 전신 영양장애","R&D 포인트 황기, 당삼, 백출, 쇄양, 산수유 배합에 따른 종기宗氣의 보익 및 호흡근 쇠약 개선 기전 승마, 시호, 진피, 당귀 배합을 통한 승양거함升陽擧陷 및 보이불체補而不滯 메커니즘 폐비신 삼장동치 및 두절생담 전략을 통한 담어복폐痰瘀伏肺 차단 및 급성 악화 억제","①보기익기 · 승양거함 補氣益氣 · 升陽擧陷 황기 당삼 백출 감초 승마 시호 폐비의 기를 보충하고 하함된 대기를 끌어올림","②조기화중 · 양혈활혈 調氣和中 · 養血活血 진피 당귀 기의 흐름을 조절하고 약물의 정체를 막으며 혈액 순환을 도움","③보신납기 · 섭납원기 補腎納氣 · 攝納元氣 산수유 쇄양 신장을 보하여 원기를 굳건히 하고 납기納氣 기능을 강화함","건비보종健脾補宗과 배원고본培元固本 대량의 보기약과 비위 보강을 통해 종기의 화생원을 충실히 하고 폐비신 삼장을 함께 다스림","승양거함升陽擧陷과 보이불체補而不滯 하함된 대기를 끌어올리고 이기화중을 통해 다량의 보기약으로 인한 체류를 방지함","두절생담지원杜絕生痰之源과 담어차단痰瘀遮斷 수습의 원천을 차단하여 담음의 생성을 막고 기를 다스려 담어복폐痰瘀伏肺를 예방함","허실병치虛實幷治와 삼장동치三臟同治 본허표실의 병태에 대응하여 근본을 다스리는 보법과 국소의 표실을 해결하는 치법을 병행함","Skeletal Muscle Wasting COPD 동반 골격근 위축 개선 보원탕이 P62/Keap1/Nrf2 경로를 통해 산화 스트레스를 줄여 COPD 랫드의 골격근 위축을 개선했다는 결과는 ‘종기宗氣 보익’과 호흡·사지 근력 회복을 직접 연결하는 근거임 근감소 동반 COPD를 가장 차별화된 적응증으로 설정 검증 설계 담배연기+LPS 유도 COPD 랫드에서 근섬유 단면적과 Nrf2 경로를 측정하고, 임상에서는 6분 보행 거리·악력·대퇴사두근 단면적(초음파)을 1차 지표로 한 무작위 대조 임상 근거 직접 연구 근거 참고문헌 [5](2026, P62/Keap1/Nrf2 골격근 위축)","Mucus Hypersecretion 객담 과다형 COPD의 점액 과분비 억제 IL-6/STAT3 신호 억제로 MUC5AC·MMP-9·호중구 엘라스타제 발현과 배세포 수를 줄였다는 결과가 있음 이를 근거로 만성 기관지염형(객담 과다) COPD 환자를 선별하면 효과가 더 분명하게 드러날 수 있음 검증 설계 객담량과 기침·객담 설문(CASA-Q)을 1차 지표로, 객담 내 MUC5AC를 바이오마커로 측정 근거 직접 연구 근거 참고문헌 [6](2025, IL-6/STAT3 점액 과분비)","Rehabilitation Combination 호흡 재활 운동과의 병용 본문 연구 동향에서 와위 조기 재활 운동과의 병용이 제시되었고 종기 이론에 따른 안정기 COPD 임상 연구가 있음 표준 호흡 재활 프로그램에 보원탕을 더했을 때 운동 능력 향상 폭이 커지는지를 확인하는 병용 임상이 현실적 검증 설계 8~12주 호흡 재활 단독 대 재활+보원탕 무작위 비교, 1차 지표 6분 보행 거리(최소 임상 중요 차이를 반영해 표본 수 산정), 2차 지표 CAT·mMRC 호흡곤란 점수 근거 직접 연구 근거 본문 「병용 전략」 표, 참고문헌 [4](종기 이론 임상 연구)","Continuum of Care 안정기–급성기 연속 치료와 이병동치 네트워크 약리학으로 COPD와 기관지확장증의 이병동치 기전이 예측되었고 견효탕과의 병용이 언급되나, 안정기 보원탕 임상과 급성 악화기 치료는 별도 프로토콜로 분리함 급성 악화기 견효탕 적용은 표준 진료에 더한 추가 근거를 쌓는 범위로 제한 검증 설계 안정기 보원탕군 12개월 관찰에서 연간 중등도 이상 급성 악화 횟수와 입원율을 1차 지표로 설정(급성 악화기 병용은 별도 연구) 근거 직접 연구 근거 참고문헌 [7](2025, 이병동치 기전), [1][2](COPD 치료 경험), 본문 「병용 전략」"],"ss":{"composition":"그림 5-4 보원탕補元湯의 모듈 구성 ①보기익기補氣益氣 및 승양거함升陽擧陷 모듈 — 폐비의 기를 보충하고 하함된 대기를 끌어올림 황기, 당삼, 백출, 감초 : 보중익기탕의 기본 구조를 바탕으로, 대량의 황기와 당삼, 백출, 감초를 통해 종기의 화생원을 충실히 하고, 비기를 굳건히 함 승마, 시호 : 승양거함升陽擧陷하여 하함된 기를 끌어올리고, 비위의 승청升淸 기능을 도움 ②조기화중調氣和中 및 양혈활혈養血活血 모듈 — 기의 흐름을 조절하고 약물의 정체를 막으며 혈액 순환을 도움 진피 : 진피로 이기화중理氣和中하여 다량의 보기약으로 인해서 기가 체류하는 것을 방지함 당귀 : 당귀로 양혈활혈하여 기행혈행氣行血行을 돕고 보익 작용을 보조함 ③보신납기補腎納氣 및 섭납원기攝納元氣 모듈 — 신장을 보하여 원기를 굳건히 하고 납기納氣 기능을 강화함 산수유, 쇄양 : 보중익기탕에 보신 약물인 산수유와 쇄양을 가미하여 폐비신 삼장을 동시에 보익하면서 원기를 굳건히 하고 납기 기능을 강화함","master":"①병인병기 인식 — 종기허쇠宗氣虛衰와 폐비신의 실사失司 종기허쇠와 COPD 발병의 중심 고리 종기宗氣는 선천의 원기, 폐가 흡수한 자연의 청기, 비위가 운화한 수곡정기가 흉중기해에 모여 형성되는 인체 모든 기의 근본이자 총강임 대사는 종기의 허쇠가 폐비신 삼장의 기능 저하와 직결되며, 이것이 COPD의 발생, 발전, 악화 전 과정을 관통하는 핵심 병기라고 보았음. 종기가 부족하면 폐의 호흡 기능과 주리腠理 고섭固攝이 무너지고 전신 기혈 운행에 장애가 발생함 견폐지병見肺之病, 당선실비當先實脾과 폐비신의 삼장동치三臟同治 오행의 원리에 따라 토능생금土能生金하므로 비는 폐의 모母가 되며, 폐가 일신의 기를 주관하는 전제는 비위가 기혈생화지원氣血生化之源으로서 역할을 다할 때 가능함 COPD가 장기화되면 폐병이 비를 상하게 하고, 나아가 신까지 미쳐 폐비신 삼장三臟이 모두 허손되며, 수액 대사가 무너져 담음과 어혈이 내생하게 됨 위양허약衛陽虛弱과 담어복폐痰瘀伏肺 위기衛氣는 중초에서 기원하여 폐의 선발宣發을 통해 체표를 방어하므로, 비위 기능의 허약은 위양의 부족으로 이어져 외부의 사기를 방어하지 못하는 상태를 초래함 비위의 승강升降 기전이 엉키면서 생긴 담탁痰濁과 어혈瘀血이 기도를 폐색하고 담어복폐痰瘀伏肺하여, 이것이 다시 양기를 손상하여 질병을 만성화시키는 악순환을 형성함 호흡근 쇠약 및 영양 장애와의 연계 횡격막 무력으로 인한 호흡근 쇠약, 전신 영양 장애 및 면역력 저하는 단순한 국소적 근육 약화가 아니라, 전신 기혈의 총본산인 종기가 극도로 허쇠해진 국면을 반영하는 병리적 현상임 ②치료원칙과 치법 — 허실병치虛實幷治와 두절생담지원杜絕生痰之源 보허사실補虛瀉實과 폐비신의 삼장동치三臟同治 : 본허표실의 병기에 맞추어, 본치本治로써 종기宗氣를 북돋우고 폐비신 삼장을 함께 다스리며, 표치標治로써 담痰과 어瘀를 제거하여 기도를 열어주는 허실병치虛實幷治의 원칙을 확립함 치담치어治痰治瘀는 치기治氣가 우선 : 담痰과 어瘀가 비록 중요한 병리 산물이지만, 그 생성이 기氣의 허약과 승강升降실조에 기인하므로 단순히 가래를 삭이고 어혈을 제거하는 방식에서 벗어나, 기氣를 다스려 담어痰瘀의 근본 원인을 차단하는 두절생담지원杜絕生痰之源을 강조함 승함탕升陷湯의 한계 극복과 보원탕補元湯 : 승함탕이 흉중의 기를 일시적으로 끌어올리는 데는 유용하나 비위를 근본적으로 튼튼히 하는 힘이 약하다는 점을 간파하고, 보중익기탕을 중심에 두어 온보溫補와 승제升提의 효과를 함께 얻도록 처방 체계를 구성함 ③단계별 변증가감 기본 치료 : 보원탕補元湯을 통한 종기宗氣 보익 보중익기탕에 산수유, 쇄양 등의 보신약補腎藥을 가미하여 폐비신 삼장을 동시 보익함. 특히 生황기를 30-50g 대량 사용하여 고표固表, 승양升陽하고 폐비신 동치의 핵심 동력을 확보하고, 승마, 시호로 상행을 도우며 진피로 보약에 의한 정체를 막음 증상별 가감 위양허약衛陽虛弱, 외감 방어 면 동음의 고방 보원탕保元湯과 섞이므로 한자명으로 구분해야 함 참고문헌 [1] 류리,후춘메이,류메이녠,등.“견폐지병, 당선실비”에 기반한 국의대사 훙광샹의 만성 폐쇄성 폐질환 치료 경험 탐구基於“見肺之病，當先實脾”探討國醫大師洪廣祥論治慢性阻塞性肺疾病經驗[J].장시중의약대학학보江西中醫藥大學學報,2026,38(3):29-32. [2] 장펀펀,왕위룽,셰룽팡,등.국의대사 훙광샹의 종기 보익에 따른 만성 폐쇄성 폐질환 안정기 치료 경험에 대한 고찰國醫大師洪廣祥從補益宗氣論治慢性阻塞性肺病穩定期經驗淺析[J].중의약통보中醫藥通報,2024,23(2):9-12. [3] 왕리화,장위안빙,란즈후이,등.국의대사 훙광샹 교수의 만성 폐쇄성 폐질환 치료 경험國醫大師洪廣祥教授治療慢性阻塞性肺疾病經驗[J].중화중의약잡지中華中醫藥雜志,2016,31(7):2590-2592. [4] 왕리화.훙광샹의 종기 이론을 활용한 만성 폐쇄성 폐질환 안정기 치료 경험 계승 및 임상 연구洪廣祥運用宗氣理論治療慢性阻塞性肺疾病穩定期的經驗繼承與臨床研究[D].난징중의약대학南京中醫藥大學,2012. [5] 천강,셰룽팡,황춘옌,천스위,왕위하오,장산,란즈후이.보원탕이 P62/Keap1/Nrf2 신호경로를 통해 산화스트레스를 조절하여 COPD 랫드의 골격근 위축을 개 선하는 작용기전補元湯經P62/Keap1/Nrf2信號通路調控氧化應激改善COPD大鼠骨骼肌萎縮的作用機制[J].시진국의국약時珍國醫國藥,2026,37(1):27-32. [6] 셰룽팡,리먀오먀오,황춘옌,란즈후이.보원탕이 IL-6/STAT3 신호경로를 조절하여 COPD 랫드의 기도 점액 과다분비에 미치는 영향補元湯調控IL-6/STAT3信號通路對COPD大鼠氣道黏液高分泌的影響[J].중화중의약잡지中華中醫藥雜志,2025,40(2):619-624. [7] 루쯔팅,황이웨이,셰룽팡,쑨위신,주링,왕웨이팅,란즈후이.네트워크 약리학과 분자 도킹에 기반한 보원탕의 ‘이병동치’에 따른 만성폐쇄성폐질환과 기관지확장 증 치료 기전 연구基於網絡藥理學和分子對接的補元湯“異病同治”慢性阻塞性肺疾病和支氣管擴張症的機制研究[J].중국병원용약평가와분석中國醫院用藥評價與分析,2025,25(1):25-32."}},{"id":"5-5","ko":"온폐전","hz":"溫肺煎","alias":"","master_ko":"훙광샹","master_hz":"洪廣祥","tagline":"한사객폐寒邪客肺와 기양허약氣陽虛弱을 다스려 만성 폐계 질환을 치료하는 온법溫法의 대표 처방","meta":{"주요 적응증":"만성 기관지염, 만성 기침","확인된 연구자료 유형":"경험 보고","제형·제품화":"같은 계열 특허 (만료)"},"page":286,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-5 온폐전溫肺煎의 모듈 구성<\/p><h4>①온폐산한溫肺散寒 및 해표거사解表祛邪 모듈 — 폐의 한사를 흩어내고 표증을 풀어줌<\/h4><p><b>生마황, 생강, 세신<\/b>: 마황으로 체표의 한사를 제거하고 폐기를 열어주며, 생강과 세신을 배합하여 온폐산한과 통규지해의 효과를 배가함<\/p><h4>②온화한담溫化寒痰 및 지해평천止咳平喘 모듈 — 한담寒痰을 삭이고 기침과 천식을 진정시킴<\/h4><p><b>반하<\/b>: 조습화담燥濕化痰하고 한담을 삭여주며 기침을 멎게 함<\/p><p><b>자완, 관동화<\/b>: 폐를 촉촉하게 하고 상역하는 기를 아래로 내리며, 가래를 삭이고 기침을 멎게 함(윤폐하기潤肺下氣, 온폐화담溫肺化痰)<\/p><h4>③선폐통규宣肺通竅 및 화담지해化痰止咳 모듈 — 코와 기도를 소통시키고 담을 삭여 기침을 멈춤<\/h4><p><b>왜지차, 천장각<\/b>: 왜지차는 쓴맛으로 기를 아래로 내려 담음을 삭이고 기침을 멎게 하며, 천장각은 폐기를 열어주어 코와 기도를 소통시킴<\/p>"},{"k":"master","t":"훙광샹의 “치폐불원온治肺不遠溫” 이론","html":"<h4>①치폐불원온의 학술적 개념<\/h4><p class=\"lbl2\">치폐불원온의 의미<\/p><p class=\"sub\">‘폐를 치료함에 있어 온법溫法을 떠나서는 안 된다’는 대사의 대표적인 학술사상<\/p><p class=\"sub\">만성 폐계질환의 치료에서 온법을 기본 치료 원칙으로 삼아 폐의 선발, 숙강 기능과 양기를 회복시키는 것을 강조<\/p><p class=\"sub\">적용 대상은 만성 기관지염, 기침 이형 천식(CVA), 만성 기침 등 반복적으로 재발하는 만성 폐계질환<\/p><p class=\"lbl2\">온법溫法의 구성<\/p><p class=\"sub\"><b>온산溫散<\/b>: 풍한을 발산하여 폐표를 소통<\/p><p class=\"sub\"><b>온선溫宣<\/b>: 폐기의 선발 기능을 회복<\/p><p class=\"sub\"><b>온화溫化<\/b>: 한담寒痰과 담음痰飮을 따뜻하게 화하여 제거<\/p><p class=\"sub\"><b>온통溫通<\/b>: 폐기와 기도의 울체를 소통<\/p><p class=\"sub\"><b>온보溫補<\/b>: 기양氣陽을 보하고 폐·신의 양기를 도와 정기를 회복하며 재발을 예방<\/p><h4>②병인병기<\/h4><p><b>본本<\/b>: 기양허약氣陽虛弱<\/p><p class=\"sub\">만성 폐질환의 근본 병기는 기양허약이며, 폐양허肺陽虛가 중심<\/p><p class=\"sub\">오래된 기침은 폐기를 손상시키고 비·신까지 영향을 미쳐 양허가 심화<\/p><p class=\"sub\">폐양이 허하면 위기衛氣가 약해져 외사를 방어하지 못하고 쉽게 감기에 걸림<\/p><p><b>표標<\/b>: 한사객폐寒邪客肺<\/p><p class=\"sub\">풍한이나 한사가 허약한 폐를 직접 침범하여 폐기의 선발숙강 기능을 막음<\/p><p class=\"sub\">한사는 음사陰邪이므로 폐양을 더욱 손상시키고 한담寒痰을 형성함<\/p><p class=\"sub\">기침, 흰 묽은 가래, 오한, 흉민, 야간과 새벽 기침 등의 증상이 나타남<\/p><p class=\"lbl2\">병리 특징<\/p><p class=\"sub\">본허표실本虛標實의 구조를 이룸<\/p><p class=\"sub\">기양허약은 재발의 주요 내인이며, 한사객폐는 급성 발작의 직접 원인<\/p><p class=\"sub\">담음은 양기를 손상시키고 양허는 다시 담음을 생성하는 악순환을 형성<\/p><h4>③폐양肺陽 이론과 치폐불원온의 핵심 인식<\/h4><p class=\"lbl2\">폐양肺陽의 존재와 역할<\/p><p class=\"sub\">대사가 임상에서 강조한 핵심 개념으로, 폐에도 양기가 존재한다고 설명<\/p><p class=\"sub\">폐양은 폐기의 선발숙강을 유지하고 위기를 충실하게 하여 외사를 방어<\/p><p class=\"sub\">폐양이 충실해야 정상적인 폐의 선발숙강으로 진액이 고루 퍼져 담음의 형성을 방지<\/p><p class=\"lbl2\">폐양허의 임상 특징<\/p><p class=\"sub\">평소 추위를 많이 타고 쉽게 감기에 걸림<\/p><p class=\"sub\">자한, 피로, 기력 저하가 동반되기 쉬움<\/p><p class=\"sub\">찬 공기, 기온 변화, 비를 맞거나 찬 음식을 먹으면 기침이 쉽게 유발 및 악화됨<\/p><p class=\"sub\">겨울과 봄에 증상이 반복적으로 심해지는 경향을 보임<\/p><h4>④치칙치법治則治法<\/h4><p><b>급성기 치료<\/b>: 급즉치표急則治標<\/p><p class=\"sub\">온폐산한溫肺散寒을 중심으로 풍한을 제거<\/p><p class=\"sub\">선폐지해宣肺止咳로 폐기의 선발숙강 기능을 회복<\/p><p class=\"sub\">강기화담降氣化痰으로 한담과 담음을 제거하여 기침과 천식을 완화<\/p><p><b>회복기 치료<\/b>: 완즉치본緩則治本<\/p><p class=\"sub\">익기고표益氣固表로 위기를 보하고 외사에 대한 저항력을 높임<\/p><p class=\"sub\">조화영위調和營衛로 폐위 기능을 회복<\/p><p class=\"sub\">익기온양益氣溫陽으로 폐양과 기양을 보강<\/p><p><b>장기 관리<\/b>: 표본동치標本同治<\/p><p class=\"sub\">보비익폐補脾益肺를 중시하여 배토생금培土生金의 원리를 적용<\/p><p class=\"sub\">비의 운화 기능을 강화하여 폐기를 보하고 재발을 예방<\/p><p class=\"sub\"><b>증상<\/b> 이 소실된 이후에도 체질 개선을 위한 치료를 지속<\/p><h4>⑤온폐전의 임상 활용<\/h4><p class=\"lbl2\">변증 가감 원칙<\/p><p class=\"sub\">한사가 심하면 생강을 건강으로 교체하여 온중산한을 강화<\/p><p class=\"sub\">기침이 심하면 정력자, 자소자, 청피, 진피 등을 가미<\/p><p class=\"sub\">기허하면 황기, 당삼, 백출 등을 가미하여 익기고표<\/p><p class=\"sub\">양허하면 음양곽, 보골지, 쇄양 등을 가미하여 온양보신<\/p><p class=\"sub\">비허하면 사군자탕, 육군자탕 등을 합방하여 보비익폐<\/p><p class=\"sub\">비염, 비색이 있으면 신이화, 창이자, 백지 등을 가미하여 선통비규<\/p><p class=\"sub\">울열이나 습담이 겸하면 황금, 석고, 어성초 또는 이진탕 등을 병용하여 변증 가감<\/p><p class=\"lbl2\">임상 활용 특징<\/p><p class=\"sub\">초진에는 온폐전으로 표증을 제거하고 기침과 담을 빠르게 완화<\/p><p class=\"sub\">증상 호전 후에는 옥병풍산, 익기호위탕益氣護衛湯(경험방), 보중익기탕 등을 합방하여 폐기와 위기를 보강<\/p><p class=\"sub\">최종적으로 재발 감소와 체질 개선을 치료의 목표로 삼음<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>이 처방 이름의 제품은 확인되지 않음. 대사 명의의 한해寒咳 치료 중성약(과립) 특허가 마황·생강·세신·자완·관동화· 법반하를 공유하는 같은 계열 조성(신이·창이자 추가)이며, 2010년 장중약업으로 이전된 뒤 2020년 존속기간이 만료됨<\/p><ol class=\"refs\"><li class=\"ref\">[5]<\/li><\/ol><p class=\"boxlbl\">시사점<\/p><p class=\"box\">핵심 조성이 만료 특허로 공개되어 권리 부담은 없으나 신규성도 없으므로, 국내는 한랭 유발 기침 대상 용도와 탕제·과립 간 효과 비교로 접근해야 하며, 국내 공정서에 없는 왜지차·천장각은 대체 약재를 검토해야 함<\/p><ol class=\"refs\"><li class=\"ref\">참고문헌<\/li><li class=\"ref\">[1] 왕팡.데이터 마이닝에 기반한 국의대사 훙광샹의 온폐전 병안 회고적 연구基於數據挖掘的國醫大師洪廣祥運用溫肺煎病案的回顧性研究[D].장시중의약대학江西中醫藥大學,2019.<\/li><li class=\"ref\">[2] 리메이링,리잉샤.온폐전의 만성 기관지염 치료 경험에 대한 고찰溫肺煎治療慢性支氣管炎經驗淺析[J].중국민족민간의약中國民族民間醫藥,2016,25(22):39-40.<\/li><li class=\"ref\">[3] 류나.온폐전의 한사객폐증 만성 기침 치료 임상 응용溫肺煎治療慢性咳嗽寒邪客肺證的臨床運用[J].세계최신의학정보문적世界最新醫學信息文摘,2019,19(24):149+151.<\/li><li class=\"ref\">[4] 룽젠,양위핑,쉐한룽.온폐전의 기침 변이형 천식 치료 임상 응용 고찰溫肺煎治療咳嗽變異性哮喘的臨床運用探析[J].장시중의약江西中醫藥,2022,53(10):28-29.<\/li><li class=\"ref\">[5] 훙광샹洪廣祥.한해를 치료하는 중성약 및 제조방법一種治療寒咳的中成藥及其製備方法:CN1103224C[P/OL].<a href=\"https://patents.google.com/patent/CN1103224C.\" target=\"_blank\" rel=\"noopener\" "확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":291,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-6 건해녕乾咳寧의 모듈 구성<\/p><h4>①간폐위肝肺胃의 기기조절 및 강역하기降逆下氣 모듈 — 간폐위의 기기를 조절하고 거슬러 오르는 기를 내려 기침을 멈춤<\/h4><p><b>청피, 선복화, 비파엽<\/b>: 청피는 소간파기疏肝破氣하고 과도하게 치솟는 간의 상승 기세를 제어하고, 선복화는 소담축수消痰逐水하면서 기를 아래로 내리며, 비파엽은 폐위肺胃의 화를 끄고 기를 아래로 내리며 담을 제거하여 화담지해化痰止咳함. 이 세 약물이 유기적으로 결합하여 상부로 치밀어 오르는 전신 기기의 하강 축을 바로잡아 상역하는 기세를 근본적으로 제압함<\/p><h4>②외풍산사外風散邪 및 선폐통규宣肺通竅 모듈 — 풍사를 흩어내고 코와 목의 기도를 열어줌<\/h4><p><b>자소엽, 행인, 길경, 신이, 창이자<\/b>: 자소엽은 향기가 짙고 성질이 가벼워 피모를 열어 사기를 흩어내고 폐기를 열어주며 상기도를 소통시킴. 행인과 길경은 하나는 아래로 끄는 숙강肅降을 담당하고 하나는 위로 열어주는 선발宣發을 담당하여, 일선일강一宣一降의 배오로 폐의 선숙 기능을 극대화함. 여기에 신이와 창이자의 통규 작용을 더해 코와 인후 부위에 엉긴 풍한 사기를 제거하고 국소 미세순환을 개선함<\/p><h4>③청열조습淸熱燥濕 및 조화제약調和諸藥 모듈 — 열을 끄고 습을 제거하며, 약성을 조화롭게 함<\/h4><p><b>황금, 감초<\/b>: 황금은 고한苦寒한 성질로 상역하는 화열火熱을 끄고 조습燥濕 작용을 발휘하여 인후의 작열감과 염증성 충혈을 다스림. 감초는 인후를 부드럽게 감싸고 해독하며, 처방 내의 강력한 맵고 쓴 약물들이 위장관에 자극을 주지 않도록 전체의 성질을 조화롭게 하여 장기 복용의 안정성을 확보함<\/p>"},{"k":"master","t":"훙광샹의 만성 기침 치료","html":"<h4>①총병기 인식 — 기역에 의한 기침과 오장상관五臟相關의 심층 원리<\/h4><p>《소문素問·해론咳論》의 “오장육부는 모두 사람으로 하여금 기침하게 하며, 홀로 폐만 그런 것이 아니다”라는 원리에 기반하여 만성 기침의 병기를 전신적 관점에서 재해석함 만성 기침의 근본적인 병기는 단순한 폐계의 국소적 부종이나 점막 손상에 국한되지 않고, 전신 기기의 승강출입 부조화로 인해 기가 위로 치솟아 발생하는 기역에 의한 기침에 있다고 봄. 즉, 인체 생리의 중심 축인 간, 폐, 위의 기능 실조가 상호 인과관계로 얽혀 고질적인 기침을 양산하는 병리적 메커니즘을 제시함<\/p><h4>②간, 폐, 위의 병리적 상호작용과 인과 구조<\/h4><p><b>폐위상통肺胃相通과 기기하강의 붕괴<\/b>: 폐와 위는 모두 아래로 내려가는 성질(강降)을 공유하므로, 위기胃氣가 화평하지 못하고 거슬러 오르면 폐의 숙강 기능이 연쇄적으로 무너져 기침을 유발함. 임상에서 흔히 나타나는 위식도 역류성 기침이나 소화기 증상 동반 기침이 바로 이 구조에서 비롯됨 간목상역肝木上逆과 기화상충氣火相衝: 간은 풍화風火의 장기로서 승발升發을 주관하는데, 정서적 스트레스나 억울抑鬱로 인해 간기肝氣가 지나치게 상승하면 그 화열이 폐를 범하여 건조하고 발작적인 기침을 촉발함 풍風, 화火, 담痰, 기氣의 상호 결집: 기기가 울체되어 발생한 간화가 호흡기의 진액을 태우면 진액이 말라 끈끈한 담이 형성되고, 기의 순환장애로 치솟는 기역이 발생하며, 인후부 감각을 과민하게 만드는 풍의 사기가 가세함. 즉, 풍, 화, 담, 기의 병리적 요인이 서로를 유발하며 기도를 지속적으로 자극하므로 병정이 길어지고 난치화됨<\/p><h4>③치료원칙과 핵심 치법 — 간폐위 기의 조화와 승강조절의 철학<\/h4><p>만성 기침을 치료할 때 단순히 기침을 억제하는 진해제나 수렴약 위주의 ‘견수치폐見嗽治肺’의 좁은 시야를 철저히 경계함 소간기疏肝氣, 이폐기理肺氣, 강위기降胃氣의 3대 치법을 확립하여, 간의 상승과 폐, 위의 하강이 정교하게 맞물려 돌아가는 기기 승강의 정상화를 치료의 대원칙으로 삼음. 이를 통해 약물이 일시적인 대증 치료에 머무르지 않고 질병의 근본 고리를 해체하도록 설계함<\/p><h4>④임상적 활용 및 변증 가감<\/h4><p>기본방인 건해녕을 축으로 하여, 환자의 정밀한 임상 양상에 따라 풍風, 열熱, 허虛, 어瘀를 겸한 복합 증후에 유연하고 입체적으로 대응함<\/p><p class=\"sub\"><b>인후 가려움 및 피부 가려움이 심할 때<\/b>: 오매, 백선피, 선퇴 등을 가미하여 식풍지양息風止癢인후가 건조하고 아플 때: 목호접木蝴蝶, 우방자, 현삼 등을 가미하여 양음청열養陰淸熱 강화 범산泛酸 및 애역呃逆 등 위기상역이 있을 때: 대자석 등을 가미하여 평간화위平肝和胃 도모 가래가 적고 백색이며 부맥浮脈일 때: 마황, 세신, 法반하, 천장각 등을 가미하여 온폐산한溫肺散寒 강화 습열濕熱 경향이 뚜렷할 때: 마황연교적소두탕麻黃連翹赤小豆湯 등을 합방하여 청열리습淸熱利濕기허氣虛 및 표허表虛를 겸할 때: 옥병풍산 등을 합방하여 익기고표益氣固表 시행 성정이 급하고 화를 잘 낼 때: 대합산黛蛤散 등을 합방하여 평간잠양平肝潛陽 시행<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">같은 대사의 한해 중성약 특허와 신이·창이자를 공유하지만 별개 처방이며, 상기도 기침 증후군 대상 국내 연구가 검색되지 않아 신규 주제로 활용 가능<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 쉬징.건해녕을 기본방으로 한 만성 마른기침 변증 치료以乾咳寧爲基本方辨治慢性乾咳[J].상하이중의약잡지上海中醫藥雜志,2006,(3):10-11.<\/li><li class=\"ref\">[2] 자오리윈.훙광샹의 만성 기침 치료 경험에 대한 고찰洪廣祥治療慢性咳嗽經驗拾隅[J].장시중의약江西中醫藥,2006,(1):5-6+12.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"청피","name":"청피","dose":"","base":"청피"},{"raw":"행인","name":"행인","dose":"","base":"행인"},{"raw":"길경","name":"길경","dose":"","base":"길경"},{"raw":"자소엽","name":"자소엽","dose":"","base":"자소엽"},{"raw":"선복화","name":"선복화","dose":"","base":"선복화"},{"raw":"비파엽","name":"비파엽","dose":"","base":"비파엽"},{"raw":"신이","name":"신이","dose":"","base":"신이"},{"raw":"창이자","name":"창이자","dose":"","base":"창이자"},{"raw":"황금","name":"황금","dose":"","base":"황금"},{"raw":"감초","name":"감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["간기를 소통시키고 폐기와 위기를 조화롭게 가라앉힘(소간리폐강위疏肝理肺降胃)","거슬러 오르는 기를 내려 인후의 가려움과 발작성 기침을 멈춤(강역지해降逆止咳)","풍사를 제거하고 코와 목의 기도를 소통시키며 담을 제거(소풍통규화담疏風通竅化痰)"],"주치증":["만성 건해乾咳, 인후 가려움으로 인한 기침, 인후 이물감, 후비루 증후군(PNDS) 양상, 위식도 역류성 기침, 기침 이형 천식(CVA), 흉민胸悶 등"],"연구 확장 영역":["원인 불명의 만성 난치성 기침, 상기도 감염 후 기침, 비염 및 인후염 동반 만성 기침, 흉부 부교감신경 과민성 질환"],"R&D 포인트":["청피, 선복화, 비파엽의 배합이 발휘하는 간폐위肝肺胃의 기기 조절과 강역降逆 메커니즘","자소엽, 행인, 길경의 선발宣發 및 숙강肅降 작용을 통한 호흡기 점막 염증 완화, 기도 저항성 개선 및 점액섬모 청소율(MCC) 개선","신이, 창이자, 황금의 항염 및 항알레르기 작용을 통한 상기도(비강-인후두) 과민성 억제 및 신경원성 염증 억제 기전","미주신경 말초 수용체 및 인후두 감각신경의 과흥분 차단을 통한 발작성 기침 반응 차단 및 기관지 과반응성(BHR) 조절 효과 규명"]},"modules":[{"name":"①간폐위 · 의 기기조절 · 강역하기","hz":"肝肺胃 · 降逆下氣","herbs":["청피","선복화","비파엽"],"role":"간폐위의 기기를 조절하고 거슬러 오르는 기를 내려 기침을 멈춤"},{"name":"②외풍산사 · 선폐통규","hz":"外風散邪 · 宣肺通竅","herbs":["자소엽","행인","길경","신이","창이자"],"role":"풍사를 흩어내고 코와 목의 기도를 열어줌"},{"name":"③청열조습 · 조화제약","hz":"淸熱燥濕 · 調和諸藥","herbs":["황금","감초"],"role":"열을 끄고 습을 제거하며, 약성을 조화롭게 함"}],"rd":[{"tag":"Upper Airway Cough","title":"후비루·인후 이물감 동반 만성 마른기침","html":"<p>주치에 후비루 증후군 양상과 인후 이물감이 포함되어 있음 상기도 기침 증후군 환자를 대상으로 기침 점수와 후비루 증상을 함께 평가하는 탐색 임상이 적합하며, 상기도 기침 증후군·위식도 역류·신경 감작 중 상기도 기침 증후군을 1순위 적응증으로 정함 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1] (2006, 만성 마른기침 변증 치료), [2](만성 기침 치료 경험))<\/p>"},{"tag":"Reflux Cough","title":"위식도 역류성 기침의 ‘강위降胃’ 효과","html":"<p>소간리폐강위 원칙을 위식도 역류성 기침에 적용함 양성자펌프억제제 병용 시 기침 개선과 역류 증상(GERD-Q) 변화를 확인 (위산억제제가 필요 없는 환자에게는 병용하지 않음) (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 1 「소간리폐강위와 강역지해」, 본문 주치증)<\/p>"},{"tag":"Cough Hypersensitivity","title":"인후 가려움 기침의 기침 반사 과민","html":"<p>인후 가려움으로 유발되는 마른기침을 캡사이신 기침 역치로 평가함 선복화·비파엽·행인 등 강기 약재가 기침 반사 과민을 낮추는지 확인 (근거 유형: 신규 연구가설 | 근거: 본문 주치증, 조성표)<\/p>"},{"tag":"Nasal–Airway Link","title":"신이·창이자의 비강–기도 연계 효과","html":"<p>비강 염증이 기침을 유발하는 경로를 고려함 신이·창이자 등 통규 약재가 비강 염증과 기침 반사를 동시에 줄이는지 비염 동반 기침 모델에서 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「일선일강과 점막보호」)<\/p>"}],"logic":[{"n":"1","title":"소간리폐강위疏肝理肺降胃와 강역지해降逆止咳","body":"상부로 치솟는 기기를 제어하고 간폐위의 하강 축을 바로잡음"},{"n":"2","title":"일선일강一宣一降과 점막보호粘膜保護","body":"선발숙강과 통규 작용으로 상기도 미세순환을 개선함"},{"n":"3","title":"신경원성 염증 억제와 과민반응 차단","body":"황금의 청열조습과 신이, 창이자의 항염·항알레르기 작용으로 상기도 과민성을 제어함"},{"n":"4","title":"오장상관五臟相關과 기역氣逆제어","body":"단순 진해제 위주의 견수치폐見嗽治肺에서 벗어나 전신 기기의 승강출입 부조화를 해소함"}],"field":5,"pages":[291,295 그림 5-6 건해녕乾咳寧의 모듈 구성 ①간폐위肝肺胃의 기기조절 및 강역하기降逆下氣 모듈 — 간폐위의 기기를 조절하고 거슬러 오르는 기를 내려 기침을 멈춤 청피, 선복화, 비파엽 : 청피는 소간파기疏肝破氣하고 과도하게 치솟는 간의 상승 기세를 제어하고, 선복화는 소담축수消痰逐水하면서 기를 아래로 내리며, 비파엽은 폐위肺胃의 화를 끄고 기를 아래로 내리며 담을 제거하여 화담지해化痰止咳함. 이 세 약물이 유기적으로 결합하여 상부로 치밀어 오르는 전신 기기의 하강 축을 바로잡아 상역하는 기세를 근본적으로 제압함 ②외풍산사外風散邪 및 선폐통규宣肺通竅 모듈 — 풍사를 흩어내고 코와 목의 기도를 열어줌 자소엽, 행인, 길경, 신이, 창이자 : 자소엽은 향기가 짙고 성질이 가벼워 피모를 열어 사기를 흩어내고 폐기를 열어주며 상기도를 소통시킴. 행인과 길경은 하나는 아래로 끄는 숙강肅降을 담당하고 하나는 위로 열어주는 선발宣發을 담당하여, 일선일강一宣一降의 배오로 폐의 선숙 기능을 극대화함. 여기에 신이와 창이자의 통규 작용을 더해 코와 인후 부위에 엉긴 풍한 사기를 제거하고 국소 미세순환을 개선함 ③청열조습淸熱燥濕 및 조화제약調和諸藥 모듈 — 열을 끄고 습을 제거하며, 약성을 조화롭게 함 황금, 감초 : 황금은 고한苦寒한 성질로 상역하는 화열火熱을 끄고 조습燥濕 작용을 발휘하여 인후의 작열감과 염증성 충혈을 다스림. 감초는 인후를 부드럽게 감싸고 해독하며, 처방 내의 강력한 맵고 쓴 약물들이 위장관에 자극을 주지 않도록 전체의 성질을 조화롭게 하여 장기 복용의 안정성을 확보함","master":"①총병기 인식 — 기역에 의한 기침과 오장상관五臟相關의 심층 원리 《소문素問·해론咳論》의 “오장육부는 모두 사람으로 하여금 기침하게 하며, 홀로 폐만 그런 것이 아니다”라는 원리에 기반하여 만성 기침의 병기를 전신적 관점에서 재해석함 만성 기침의 근본적인 병기는 단순한 폐계의 국소적 부종이나 점막 손상에 국한되지 않고, 전신 기기의 승강출입 부조화로 인해 기가 위로 치솟아 발생하는 기역에 의한 기침에 있다고 봄. 즉, 인체 생리의 중심 축인 간, 폐, 위의 기능 실조가 상호 인과관계로 얽혀 고질적인 기침을 양산하는 병리적 메커니즘을 제시함 ②간, 폐, 위의 병리적 상호작용과 인과 구조 폐위상통肺胃相通과 기기하강의 붕괴 : 폐와 위는 모두 아래로 내려가는 성질(강降)을 공유하므로, 위기胃氣가 화평하지 못하고 거슬러 오르면 폐의 숙강 기능이 연쇄적으로 무너져 기침을 유발함. 임상에서 흔히 나타나는 위식도 역류성 기침이나 소화기 증상 동반 기침이 바로 이 구조에서 비롯됨 간목상역肝木上逆과 기화상충氣火相衝: 간은 풍화風火의 장기로서 승발升發을 주관하는데, 정서적 스트레스나 억울抑鬱로 인해 간기肝氣가 지나치게 상승하면 그 화열이 폐를 범하여 건조하고 발작적인 기침을 촉발함 풍風, 화火, 담痰, 기氣의 상호 결집: 기기가 울체되어 발생한 간화가 호흡기의 진액을 태우면 진액이 말라 끈끈한 담이 형성되고, 기의 순환장애로 치솟는 기역이 발생하며, 인후부 감각을 과민하게 만드는 풍의 사기가 가세함. 즉, 풍, 화, 담, 기의 병리적 요인이 서로를 유발하며 기도를 지속적으로 자극하므로 병정이 길어지고 난치화됨 ③치료원칙과 핵심 치법 — 간폐위 기의 조화와 승강조절의 철학 만성 기침을 치료할 때 단순히 기침을 억제하는 진해제나 수렴약 위주의 ‘견수치폐見嗽治肺’의 좁은 시야를 철저히 경계함 소간기疏肝氣, 이폐기理肺氣, 강위기降胃氣의 3대 치법을 확립하여, 간의 상승과 폐, 위의 하강이 정교하게 맞물려 돌아가는 기기 승강의 정상화를 치료의 대원칙으로 삼음. 이를 통해 약물이 일시적인 대증 치료에 머무르지 않고 질병의 근본 고리를 해체하도록 설계함 ④임상적 활용 및 변증 가감 기본방인 건해녕을 축으로 하여, 환자의 정밀한 임상 양상에 따라 풍風, 열熱, 허虛, 어瘀를 겸한 복합 증후에 유연하고 입체적으로 대응함 인후 가려움 및 피부 가려움이 심할 때 : 오매, 백선피, 선퇴 등을 가미하여 식풍지양息風止癢인후가 건조하고 아플 때: 목호접木蝴蝶, 우방자, 현삼 등을 가미하여 양음청열養陰淸熱 강화 범산泛酸 및 애역呃逆 등 위기상역이 있을 때: 대자석 등을 가미하여 평간화위平肝和胃 도모 가래가 적고 백색이며 부맥浮脈일 때: 마황, 세신, 法반하, 천장각 등을 가미하여 온폐산한溫肺散寒 강화 습열濕熱 경향이 뚜렷할 때: 마황연교적소두탕麻黃連翹赤小豆湯 등을 합방하여 청열리습淸熱利濕기허氣虛 및 표허表虛를 겸할 때: 옥병풍산 등을 합방하여 익기고표益氣固表 시행 성정이 급하고 화를 잘 낼 때: 대합산黛蛤散 등을 합방하여 평간잠양平肝潛陽 시행","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 같은 대사의 한해 중성약 특허와 신이·창이자를 공유하지만 별개 처방이며, 상기도 기침 증후군 대상 국내 연구가 검색되지 않아 신규 주제로 활용 가능 참고문헌 [1] 쉬징.건해녕을 기본방으로 한 만성 마른기침 변증 치료以乾咳寧爲基本方辨治慢性乾咳[J].상하이중의약잡지上海中醫藥雜志,2006,(3):10-11. [2] 자오리윈.훙광샹의 만성 기침 치료 경험에 대한 고찰洪廣祥治療慢性咳嗽經驗拾隅[J].장시중의약江西中醫藥,2006,(1):5-6+12."}},{"id":"5-7","ko":"소옹거부생기탕","hz":"消癰去腐生肌湯","alias":"","master_ko":"훙광샹","master_hz":"洪廣祥","tagline":"폐비肺脾의 양허와 담어痰瘀의 축결에 의한 기관지확장증 완화기를 치료하는 대표 처방","meta":{"주요 적응증":"기관지확장증 완화기","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":296,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-7 소옹거부생기탕消癰去腐生肌湯의 모듈 구성<\/p><h4>①보기익종補氣益宗 및 폐비동치肺脾同治 모듈 — 폐와 비장의 허손을 보하고 종기宗氣를 북돋워 가래의 근원을 차단함<\/h4><p><b>황기, 당삼, 백출, 감초, 당귀, 승마, 시호, 진피<\/b>: 황기는 상행하여 폐기를 돕고 종기宗氣를 북돋우며, “옹저癰疽와 오래 낫지 않는 창양瘡瘍을 치료하고 배농지통排膿止痛”하는 폐락의 소옹消癰 작용을 겸함. 당삼과 백출은 비를 튼튼히 하여 생화의 근원을 세워주고, 당귀, 진피, 감초로 기혈을 조화롭게 함. 여기에 승마와 시호를 더해 익기益氣와 승양升陽이 한데 어우러지게 함으로써, 전신 기기를 정돈하고 진액이 정체되어 담이 되는 근본 원인을 차단함<\/p><h4>②배농소옹排膿消癰 및 활혈화어活血化瘀 모듈 — 장옹의 고방 원리를 이병동치로 응용하여 폐옹의 화농성 병변과 어혈을 제거함<\/h4><p><b>의이인, 부자, 패장초, 대황, 목단피, 도인, 길경<\/b>: 《금궤요략》의 의이인부자패장산과 대황목단피탕의 원리를 차용함. 의이인, 패장초, 부자는 온양溫陽의 힘으로 습담을 제거하고 배농을 도우며, 대황, 목단피, 도인은 어혈을 깨뜨리고 열을 내려 폐락의 울체를 풀고 미세순환을 개선함. 길경은 직달直達하여 약세를 위로 이끌어 폐의 병소에 도달하게 함<\/p><h4>③거부생기去腐生肌 및 수렴조화收斂調和 모듈 — 손상된 폐 조직의 화농성 산물을 제거하고 새살이 돋아나게 함<\/h4><p><b>백급, 합환피<\/b>: 백급은 썩은 조직을 없애고 어혈을 흩어내며 새살을 돋게 하고 출혈을 막는 핵심 약재이며, 합환피는 소옹消癰과 생기生肌 효과를 더욱 배가하여 처방의 완성도를 높임<\/p>"},{"k":"master","t":"훙광샹의 기관지확장증(완화기) 치료","html":"<h4>①병기 인식 — 담痰, 어瘀, 화火, 조燥의 교결과 폐비동치肺脾同治<\/h4><p>기관지확장증의 본질은 본허표실本虛標實이며, 그 실증은 담痰, 어瘀, 화火, 조燥가 서로 엉킨 폐내 내옹內癰 양상임<\/p><p>병의 근본 원인은 폐와 비의 기양허약氣陽虛弱에 있으므로, 단순히 가래를 제거하거나 기침을 멈추는 대증 치료를 지양하고, 반드시 폐와 비를 함께 다스리는 폐비동치肺脾同治를 대원칙으로 삼음<\/p><h4>②섭생과 치료의 축 — 보기익종補氣益宗과 절담지원絶痰之源<\/h4><p>흉중의 대기인 종기宗氣가 허약하면 호흡과 기혈 운행이 무너져 담음과 어혈이 쉽게 정체됨<\/p><p>따라서 보중익기탕류의 감온甘溫한 약물을 활용하여 종기宗氣를 북돋우고 비를 살려 청기가 위로 오르게 함으로써, 가래가 생성되는 원천을 차단하는 절담지원絶痰之源의 철학을 구현함<\/p><h4>③고방의 융합과 이병동치異病同治의 응용<\/h4><p>《금궤요략》의 의이인부자패장산 및 대황목단피탕 등 장옹腸癰 치료 처방의 원리를, ‘폐와 대장은 표리 관계’라는 이치에 근거하여 폐옹肺癰인 기관지확장증에 과감히 도입함으로써 이병동치異病同治의 묘미를 살림<\/p><p>보기補氣와 온양溫陽, 배농排膿과 활혈活血을 유기적으로 결합하여, 쇠약해진 기력을 북돋우는 동시에 폐내의 오래된 화농성 병변과 어혈을 해소함<\/p><h4>④임상적 활용 및 변증 가감<\/h4><p>소옹거부생기탕을 기본방으로 하여 환자의 세부 임상 양상에 유연하게 대응함<\/p><p class=\"sub\"><b>기와 음이 모두 허할 때<\/b>: 당삼을 태자삼으로 바꾸거나 맥문동을 가미하여 양음생진養陰生津 강화<\/p><p class=\"sub\"><b>평소 간화肝火가 성하고 성정이 급할 때<\/b>: 부자를 빼고 백두옹, 진피秦皮 등을 가미하여 청간사화淸肝瀉火 도모<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">기관지확장증은 국내에서도 치료 선택지가 적은 질환이나, 17종 대처방이어서 처방 단순화 연구가 개발의 전제<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 옌자오치,쉬이펑,리커커,등.국의대사 훙광샹의 “보허사실,폐비동치”에 따른 기관지확장증 완화기 치료 경험國醫大師洪廣祥從“補虛瀉實，肺脾同治”論治支氣管擴張症緩解期經驗[J].시진국의국약時珍國醫國藥,2023,34(8):1997-1999.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"生황기30g","name":"生황기","dose":"30g","base":"황기"},{"raw":"당삼30g","name":"당삼","dose":"30g","base":"당삼"},{"raw":"백출15g","name":"백출","dose":"15g","base":"백출"},{"raw":"炙감초10g","name":"炙감초","dose":"10g","base":"감초"},{"raw":"당귀10g","name":"당귀","dose":"10g","base":"당귀"},{"raw":"승마10g","name":"승마","dose":"10g","base":"승마"},{"raw":"北시호10g","name":"北시호","dose":"10g","base":"시호"},{"raw":"진피10g","name":"진피","dose":"10g","base":"진피"},{"raw":"의이인30g","name":"의이인","dose":"30g","base":"의이인"},{"raw":"熟부자10g","name":"熟부자","dose":"10g","base":"부자"},{"raw":"패장초15g","name":"패장초","dose":"15g","base":"패장초"},{"raw":"生대황10g","name":"生대황","dose":"10g","base":"대황"},{"raw":"목단피10g","name":"목단피","dose":"10g","base":"목단피"},{"raw":"도인10g","name":"도인","dose":"10g","base":"도인"},{"raw":"길경30g","name":"길경","dose":"30g","base":"길경"},{"raw":"백급3g","name":"백급","dose":"3g","base":"백급"},{"raw":"합환피30g","name":"합환피","dose":"30g","base":"합환피"}],"notes":["※ 熟부자와 백급은 십팔반(烏頭反白及) 배합으로 중국약전(2020·2025)에서 함께 쓰지 않도록 하는 조합임"],"핵심 효능":["폐와 비장을 함께 다스려 기와 양기를 보하고 농을 배출함(폐비동치肺脾同治, 보기온양補氣溫陽, 배농소옹排膿消癰)","담과 어혈을 없애고 괴사 조직 제거와 조직 회복을 도모함(거담화어祛痰化瘀, 거부생기去腐生肌)","종기宗氣를 북돋워 가래의 생성 근원을 차단함(보종익기補宗益氣, 절담지원絶痰之源)"],"주치증":["기관지확장증 완화기, 만성 기침, 반복적인 객담 배출 또는 미량의 각혈, 폐내 고정성 수포음, 만성 염증성 호흡기 손상 등"],"연구 확장 영역":["만성 화농성 호흡기 질환, 폐 손상 후 조직 섬유화 및 복구 지연, 호흡기 점막 만성 염증 및 궤양성 병변, 난치성 기관지확장증 관리"],"R&D 포인트":["황기, 당삼, 백출 등의 배합이 발휘하는 폐비동치 및 전신 면역, 대사 기능 조절 메커니즘","의이인, 패장초, 부자의 배합을 통한 호흡기 국소 혈류 개선, 화농성 삼출물 흡수 촉진 및 소염 배농 작용","대황, 목단피, 도인의 항염증 및 항혈전 작용을 통한 폐락肺絡의 미세순환 개선, 어혈 해소 및 섬유화 억제 기전","백급과 합환피의 점막 보호, 세포 증식 촉진 및 조직 재생 작용을 통한 기관지 점막 손상 부위의 조기 치유 효과 규명"]},"modules":[{"name":"①보기익종 · 폐비동치","hz":"補氣益宗 · 肺脾同治","herbs":["황기","당삼","백출","감초","당귀","승마","시호","진피"],"role":"폐와 비장의 허손을 보하고 종기宗氣를 북돋워 가래의 근원을 차단함"},{"name":"②배농소옹 · 활혈화어","hz":"排膿消癰 · 活血化瘀","herbs":["의이인","부자","패장초","대황","목단피","도인","길경"],"role":"장옹의 고방 원리를 이병동치로 응용하여 폐옹의 화농성 병변과 어혈을 제거함"},{"name":"③거부생기 · 수렴조화","hz":"去腐生肌 · 收斂調和","herbs":["백급","합환피"],"role":"손상된 폐 조직의 화농성 산물을 제거하고 새살이 돋아나게 함"}],"rd":[{"tag":"Bronchiectasis","title":"기관지확장증 완화기의 급성 악화 감소","html":"<p>‘보허사실, 폐비동치’에 따른 기관지확장증 완화기 치료 경험이 있음<\/p><p>연간 급성 악화 횟수와 객담량·삶의 질(QOL-B)을 지표로 한 장기 관찰 연구가 적합 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](기관지확장증 완화기 치료 경험))<\/p>"},{"tag":"Formula Composition","title":"보원탕 골격과 배농·활혈 모듈의 결합","html":"<p>황기·당삼·백출·승마·시호·진피·당귀는 보원탕 골격과 겹치고 의이인·패장초·부자 (의이인부자패장산), 대황·목단피·도인(대황목단피탕)이 더해진 구조임<\/p><p><b>보익 모듈과 배농 모듈의 기여를 나누어 확인 (근거 유형<\/b>: 간접 근거 | 근거: 본문 조성표, R&amp;D 논리 4 「이병동치와 폐옹치법」)<\/p>"},{"tag":"Sputum & Infection","title":"객담 배출과 녹농균 등 만성 감염 관리","html":"<p>길경 30g 등 배농 약재의 객담 배출 효과를 확인함<\/p><p>만성 세균 집락(녹농균 등) 환자의 객담 세균량과 항생제 사용량은 탐색적 관찰 지표로만 둠 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「배농소옹과 활혈화어」)<\/p>"},{"tag":"Safety","title":"","html":"<p>熟부자·백급 배합과 生대황 포함 대처방의 안전성<\/p><p>熟부자(아코니틴 계열)와 백급은 십팔반에 해당해 중국약전에서 함께 쓰지 않도록 하는 배합이고 生대황도 포함된 17종 대처방임<\/p><p>원방 조성을 먼저 확인한 뒤 심전도·전해질·간신 기능을 포함한 안전성 계획과 처방 단순화를 검토해야 하며, 배합 금기 문제를 해결하기 전에는 제품화·임상 연구를 권고하지 않음 (근거 유형: 간접 근거 | 근거: 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"보기익종補氣益宗과 폐비동치肺脾同治","body":"폐와 비의 허손을 보하고 종기宗氣를 북돋워 가래의 근원을 차단함"},{"n":"2","title":"배농소옹排膿消癰과 활혈화어活血化瘀","body":"폐락의 울체를 풀고 미세순환을 개선함"},{"n":"3","title":"거부생기去腐生肌와 점막재생","body":"썩은 조직을 제거하고 손상된 기관지 점막의 새살이 돋게 함"},{"n":"4","title":"이병동치異病同治와 폐옹치법肺癰治法","body":"장옹 치료 원리를 폐옹에 응용하여 보기·온양과 배농· 활혈을 유기적으로 결합함"}],"field":5,"pages":[296,299],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["5-7","소옹거부생기탕","消癰去腐生肌湯","","훙광샹","洪廣祥","폐비肺脾의 양허와 담어痰瘀의 축결에 의한 기관지확장증 완화기를 치료하는 대표 처방","生황기30g 당삼30g 백출15g 炙감초10g 당귀10g 승마10g 北시호10g 진피10g 의이인30g 熟부자10g 패장초15g 生대황10g 목단피10g 도인10g 길경30g 백급3g 합환피30g","※ 熟부자와 백급은 십팔반(烏頭反白及) 배합으로 중국약전(2020·2025)에서 함께 쓰지 않도록 하는 조합임","핵심 효능 폐와 비장을 함께 다스려 기와 양기를 보하고 농을 배출함(폐비동치肺脾同治, 보기온양補氣溫陽, 배농소옹排膿消癰) 담과 어혈을 없애고 괴사 조직 제거와 조직 회복을 도모함(거담화어祛痰化瘀, 거부생기去腐生肌) 종기宗氣를 북돋워 가래의 생성 근원을 차단함(보종익기補宗益氣, 절담지원絶痰之源)","주치증 기관지확장증 완화기, 만성 기침, 반복적인 객담 배출 또는 미량의 각혈, 폐내 고정성 수포음, 만성 염증성 호흡기 손상 등","연구 확장 영역 만성 화농성 호흡기 질환, 폐 손상 후 조직 섬유화 및 복구 지연, 호흡기 점막 만성 염증 및 궤양성 병변, 난치성 기관지확장증 관리","R&D 포인트 황기, 당삼, 백출 등의 배합이 발휘하는 폐비동치 및 전신 면역, 대사 기능 조절 메커니즘 의이인, 패장초, 부자의 배합을 통한 호흡기 국소 혈류 개선, 화농성 삼출물 흡수 촉진 및 소염 배농 작용 대황, 목단피, 도인의 항염증 및 항혈전 작용을 통한 폐락肺絡의 미세순환 개선, 어혈 해소 및 섬유화 억제 기전 백급과 합환피의 점막 보호, 세포 증식 촉진 및 조직 재생 작용을 통한 기관지 점막 손상 부위의 조기 치유 효과 규명","①보기익종 · 폐비동치 補氣益宗 · 肺脾同治 황기 당삼 백출 감초 당귀 승마 시호 진피 폐와 비장의 허손을 보하고 종기宗氣를 북돋워 가래의 근원을 차단함","②배농소옹 · 활혈화어 排膿消癰 · 活血化瘀 의이인 부자 패장초 대황 목단피 도인 길경 장옹의 고방 원리를 이병동치로 응용하여 폐옹의 화농성 병변과 어혈을 제거함","③거부생기 · 수렴조화 去腐生肌 · 收斂調和 백급 합환피 손상된 폐 조직의 화농성 산물을 제거하고 새살이 돋아나게 함","보기익종補氣益宗과 폐비동치肺脾同治 폐와 비의 허손을 보하고 종기宗氣를 북돋워 가래의 근원을 차단함","배농소옹排膿消癰과 활혈화어活血化瘀 폐락의 울체를 풀고 미세순환을 개선함","거부생기去腐生肌와 점막재생 썩은 조직을 제거하고 손상된 기관지 점막의 새살이 돋게 함","이병동치異病同治와 폐옹치법肺癰治法 장옹 치료 원리를 폐옹에 응용하여 보기·온양과 배농· 활혈을 유기적으로 결합함","Bronchiectasis 기관지확장증 완화기의 급성 악화 감소 ‘보허사실, 폐비동치’에 따른 기관지확장증 완화기 치료 경험이 있음 연간 급성 악화 횟수와 객담량·삶의 질(QOL-B)을 지표로 한 장기 관찰 연구가 적합 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](기관지확장증 완화기 치료 경험))","Formula Composition 보원탕 골격과 배농·활혈 모듈의 결합 황기·당삼·백출·승마·시호·진피·당귀는 보원탕 골격과 겹치고 의이인·패장초·부자 (의이인부자패장산), 대황·목단피·도인(대황목단피탕)이 더해진 구조임 보익 모듈과 배농 모듈의 기여를 나누어 확인 (근거 유형 : 간접 근거 | 근거: 본문 조성표, R&D 논리 4 「이병동치와 폐옹치법」)","Sputum & Infection 객담 배출과 녹농균 등 만성 감염 관리 길경 30g 등 배농 약재의 객담 배출 효과를 확인함 만성 세균 집락(녹농균 등) 환자의 객담 세균량과 항생제 사용량은 탐색적 관찰 지표로만 둠 (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「배농소옹과 활혈화어」)","Safety  熟부자·백급 배합과 生대황 포함 대처방의 안전성 熟부자(아코니틴 계열)와 백급은 십팔반에 해당해 중국약전에서 함께 쓰지 않도록 하는 배합이고 生대황도 포함된 17종 대처방임 원방 조성을 먼저 확인한 뒤 심전도·전해질·간신 기능을 포함한 안전성 계획과 처방 단순화를 검토해야 하며, 배합 금기 문제를 해결하기 전에는 제품화·임상 연구를 권고하지 않음 (근거 유형: 간접 근거 | 근거: 본문 조성표)"],"ss":{"composition":"그림 5-7 소옹거부생기탕消癰去腐生肌湯의 모듈 구성 ①보기익종補氣益宗 및 폐비동치肺脾同治 모듈 — 폐와 비장의 허손을 보하고 종기宗氣를 북돋워 가래의 근원을 차단함 황기, 당삼, 백출, 감초, 당귀, 승마, 시호, 진피 : 황기는 상행하여 폐기를 돕고 종기宗氣를 북돋우며, “옹저癰疽와 오래 낫지 않는 창양瘡瘍을 치료하고 배농지통排膿止痛”하는 폐락의 소옹消癰 작용을 겸함. 당삼과 백출은 비를 튼튼히 하여 생화의 근원을 세워주고, 당귀, 진피, 감초로 기혈을 조화롭게 함. 여기에 승마와 시호를 더해 익기益氣와 승양升陽이 한데 어우러지게 함으로써, 전신 기기를 정돈하고 진액이 정체되어 담이 되는 근본 원인을 차단함 ②배농소옹排膿消癰 및 활혈화어活血化瘀 모듈 — 장옹의 고방 원리를 이병동치로 응용하여 폐옹의 화농성 병변과 어혈을 제거함 의이인, 부자, 패장초, 대황, 목단피, 도인, 길경 : 《금궤요략》의 의이인부자패장산과 대황목단피탕의 원리를 차용함. 의이인, 패장초, 부자는 온양溫陽의 힘으로 습담을 제거하고 배농을 도우며, 대황, 목단피, 도인은 어혈을 깨뜨리고 열을 내려 폐락의 울체를 풀고 미세순환을 개선함. 길경은 직달直達하여 약세를 위로 이끌어 폐의 병소에 도달하게 함 ③거부생기去腐生肌 및 수렴조화收斂調和 모듈 — 손상된 폐 조직의 화농성 산물을 제거하고 새살이 돋아나게 함 백급, 합환피 : 백급은 썩은 조직을 없애고 어혈을 흩어내며 새살을 돋게 하고 출혈을 막는 핵심 약재이며, 합환피는 소옹消癰과 생기生肌 효과를 더욱 배가하여 처방의 완성도를 높임","master":"①병기 인식 — 담痰, 어瘀, 화火, 조燥의 교결과 폐비동치肺脾同治 기관지확장증의 본질은 본허표실本虛標實이며, 그 실증은 담痰, 어瘀, 화火, 조燥가 서로 엉킨 폐내 내옹內癰 양상임 병의 근본 원인은 폐와 비의 기양허약氣陽虛弱에 있으므로, 단순히 가래를 제거하거나 기침을 멈추는 대증 치료를 지양하고, 반드시 폐와 비를 함께 다스리는 폐비동치肺脾同治를 대원칙으로 삼음 ②섭생과 치료의 축 — 보기익종補氣益宗과 절담지원絶痰之源 흉중의 대기인 종기宗氣가 허약하면 호흡과 기혈 운행이 무너져 담음과 어혈이 쉽게 정체됨 따라서 보중익기탕류의 감온甘溫한 약물을 활용하여 종기宗氣를 북돋우고 비를 살려 청기가 위로 오르게 함으로써, 가래가 생성되는 원천을 차단하는 절담지원絶痰之源의 철학을 구현함 ③고방의 융합과 이병동치異病同治의 응용 《금궤요략》의 의이인부자패장산 및 대황목단피탕 등 장옹腸癰 치료 처방의 원리를, ‘폐와 대장은 표리 관계’라는 이치에 근거하여 폐옹肺癰인 기관지확장증에 과감히 도입함으로써 이병동치異病同治의 묘미를 살림 보기補氣와 온양溫陽, 배농排膿과 활혈活血을 유기적으로 결합하여, 쇠약해진 기력을 북돋우는 동시에 폐내의 오래된 화농성 병변과 어혈을 해소함 ④임상적 활용 및 변증 가감 소옹거부생기탕을 기본방으로 하여 환자의 세부 임상 양상에 유연하게 대응함 기와 음이 모두 허할 때 : 당삼을 태자삼으로 바꾸거나 맥문동을 가미하여 양음생진養陰生津 강화 평소 간화肝火가 성하고 성정이 급할 때 : 부자를 빼고 백두옹, 진피秦皮 등을 가미하여 청간사화淸肝瀉火 도모","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 기관지확장증은 국내에서도 치료 선택지가 적은 질환이나, 17종 대처방이어서 처방 단순화 연구가 개발의 전제 참고문헌 [1] 옌자오치,쉬이펑,리커커,등.국의대사 훙광샹의 “보허사실,폐비동치”에 따른 기관지확장증 완화기 치료 경험國醫大師洪廣祥從“補虛瀉實，肺脾同治”論治支氣管擴張症緩解期經驗[J].시진국의국약時珍國醫國藥,2023,34(8):1997-1999."}},{"id":"5-8","ko":"삼패지해탕","hz":"蔘貝止咳湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"풍사에 의한 기침과 인후 가려움증을 치료하고 폐의 승강 기능을 회복시키는 처방","meta":{"주요 적응증":"풍열·담열형 기침","확인된 연구자료 유형":"경험 보고","제형·제품화":"동명 제품 (조성 미확인)"},"page":300,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-8 삼패지해탕蔘貝止咳湯의 모듈 구성<\/p><h4>①청폐윤폐淸肺潤肺 모듈 — 폐의 열을 내리고 폐를 윤택하게 하여 기침을 진정시킴<\/h4><p><b>北사삼, 패모, 백부, 행인<\/b>: 北사삼이 폐음肺陰을 보하고 허열을 식히며 진액을 생성하고, 패모가 폐경으로 들어가 열을 내리고 담을 제거하여 기침을 멈추며, 백부가 폐를 윤택하게 하고 기침을 멈추는 진해 작용을 수행하고, 행인이 폐기를 아래로 내려주어 기침과 천식을 완화함으로써, 폐음부족으로 인한 허열과 담열을 다스리고 기침을 진정시킴<\/p><h4>②선폐지해宣肺止咳 모듈 — 폐기를 열어주고 선강宣降을 회복함<\/h4><p><b>전호, 관동화, 자완<\/b>: 전호가 폐기를 선통宣通하여 풍열을 내리고, 관동화가 폐를 윤택하게 하고 담을 삭여 기침을 멈추며, 자완이 폐를 윤택하게 하고 담을 배출하여, 폐의 선발숙강宣發肅降 기능을 회복시켜 기기를 순조롭게 소통시키고 기침을 멈춤<\/p><h4>③소풍해표疏風解表 모듈 — 풍사를 제거하고 표증을 해소함<\/h4><p><b>연교, 방풍, 형개, 박하<\/b>: 연교가 열독을 내리고 인후의 종통을 완화하며, 방풍이 풍사를 제거하고 외감 표증을 해소하며, 형개가 가볍게 발산하여 풍사를 소산시키고 인후를 편안하게 하며, 박하가 청량한 성질로 상초의 열을 풀고 인후의 가려움과 울체를 해소함으로써, 풍사를 제거하고 외감의 표증을 해소하여 인후의 가려움과 자극을 완화함<\/p><h4>④조습화담燥濕化痰 모듈 — 습과 담을 제거함<\/h4><p><b>복령, 法반하, 진피<\/b>: 복령이 건비하고 습을 삼출시켜 담습의 생성을 차단하고, 반하가 조습화담하여 뭉친 담을 삭이고 상역하는 기기를 내리며, 진피가 기를 소통시키고 습을 말려 담을 없애줌으로써, 체내의 습탁濕濁을 말리고 담을 삭여 기침의 원인을 제거함<\/p><h4>⑤조화제약調和諸藥 모듈 — 제반 약성의 균형을 맞추고 조화시킴<\/h4><p><b>감초<\/b>: 제반 약재를 조화롭게 융화시키고 중초를 완화하여 처방의 균형을 유지함<\/p>"},{"k":"master","t":"장전의 기침(해수咳嗽) 치료","html":"<h4>①풍열범폐風熱犯肺와 담열온폐痰熱蘊肺가 기침의 핵심 병리 기전<\/h4><p>외감 풍사風邪와 열사熱邪가 폐에 침습하거나 체내의 담열痰熱이 뭉치면 폐의 선강宣降 기능이 실조되어 기침이 오래도록 낫지 않음<\/p><p>특히 인후나 흉골 뒤가 간질거리며 발작하는 기침은 풍사와 담열이 결합한 특징적 양상임<\/p><h4>②청폐淸肺와 거풍祛風, 선강宣降의 유기적 결합<\/h4><p>단순한 진해거담鎭咳祛痰에 그치지 않고, 소풍해표疏風解表와 청폐윤폐淸肺潤肺를 동시에 시행하여 병의 원인인 풍열과 표면의 증상인 기침을 함께 다스림<\/p><p>폐의 승강 기능을 바로잡아 기기를 아래로 순조롭게 하강시킴<\/p><h4>③폐비동치肺脾同治<\/h4><p>담의 근원이 되는 비위의 습체濕滯 현상을 함께 고려하여 복령, 반하, 진피 등으로 조습화담燥濕化痰하여 재발을 방지함<\/p><h4>④현대 약리 및 임상 지표 검증<\/h4><p><b>항염 및 진해거담<\/b>: 패모 등의 유효 성분이 중추·말초 기침 반사를 억제하고 염증을 완화하는 것으로 알려져 있음<\/p><p><b>기도의 미세환경 개선<\/b>: 기도의 과민성을 낮추고 염증성 사이토카인 발현을 억제하여 상기도 감염 및 감염 후 기침 환자에서 임상 개선이 보고됨<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>같은 이름의 삼패지해과립參貝止咳顆粒이 윈난텅충둥팡훙제약 제품으로 판매되고 있으나(포장 디자인 특허로 확인), 장전 처방과 같은 조성인지는 공개 자료로 확인되지 않음[2]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">동명 제품이 있으므로 국내 연구·특허에서는 대사명과 15종 조성을 명시해 구분해야 하며, 동명 제품의 조성 확인이 선행되어야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 주젠핑,톈위안,톈춘훙.국의대사 장전 교수의 삼패지해탕 임상활용 경험 채록國醫大師張震教授臨床運用蔘貝止咳湯經驗擷英[J].서부중의약西部中醫藥,2024,37(4):46-49.<\/li><li class=\"ref\">[2] 윈난텅충둥팡훙제약雲南騰衝東方紅製藥.약상자(삼패지해과립)藥盒(參貝止咳顆粒):CN307188481S[P/OL].<a href=\"https://patents.google.com/patent/CN307188481S.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN307188481S.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"北사삼","name":"北사삼","dose":"","base":"사삼"},{"raw":"浙패모","name":"浙패모","dose":"","base":"패모"},{"raw":"백부","name":"백부","dose":"","base":"백부"},{"raw":"행인","name":"행인","dose":"","base":"행인"},{"raw":"전호","name":"전호","dose":"","base":"전호"},{"raw":"관동화","name":"관동화","dose":"","base":"관동화"},{"raw":"자완","name":"자완","dose":"","base":"자완"},{"raw":"연교","name":"연교","dose":"","base":"연교"},{"raw":"방풍","name":"방풍","dose":"","base":"방풍"},{"raw":"형개","na

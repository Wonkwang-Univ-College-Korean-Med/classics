662B[P/OL]. https://patents.google.com/patent/CN112107662B. [11] 리뎬구이李佃貴 등.위축성 위염 동반 장상피화생·이형증식을 치료하는 중약一種治療萎縮性胃炎伴腸上皮化生及不典型增生的中藥:CN103230519A[P/OL]. https://patents.google.com/patent/CN103230519A. [12] 허베이성중의약과학원河北省中醫藥科學院.일측다평법에 기반한 화탁해독소간방 성분 함량 검출방법一種基於一測多評法的化濁解毒疏肝方中成分含量的檢測方法:CN116818940B[P/OL]. https://patents.google.com/patent/CN116818940B."}},{"id":"1-2","ko":"소옹궤득강","hz":"消癰潰得康","alias":"(궤득강과립潰得康顆粒)","master_ko":"저우쉐원","master_hz":"周學文","tagline":"위장 점막의 울열鬱熱과 독사毒邪를 풀어 염증을 다스리고, 외과의 소消·탁托·보補 치법을 응용하여 위옹胃癰을 치료하는 처방","meta":{"주요 적응증":"소화성 궤양 활동기","확인된 연구자료 유형":"연구 축적 (논문 45편)","제형·제품화":"궤득강과립 (중성약, 12미)"},"page":20,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-2 소옹궤득강消癰潰得康의 모듈 구성<\/p><h4>①청열해독, 청열화위淸熱和胃 모듈 — 중초의 습열과 독사를 제거하고 위장 열독을 해소함<\/h4><p><b>황련, 포공영, 고삼, 浙패모<\/b>: 황련은 중초의 습열과 화울火鬱을 내려 위장 실증을 다스리고, 포공영은 청열해독 및 산결소옹散結消癰하며, 고삼은 청열조습淸熱燥濕하여 습독창양濕毒瘡瘍을 다스림. 浙패모는 청열산결소종淸熱散結消腫하여 창옹종독瘡癰腫毒을 치료함<\/p><h4>②보기탁독補氣托毒, 생기회복生肌回復 모듈 — 비위脾胃의 정기를 북돋우고 독사를 체외로 배출하며 궤양 부위의 치유를 촉진함<\/h4><p><b>황기, 인삼, 삼칠<\/b>: 황기는 보기승양補氣升陽하고 탁독생기托毒生肌하여 비위의 정기를 돋우고, 인삼은 대보원기大補元氣, 건비익기健脾益氣, 고탈생진固脫生津하고 비위를 보양하며, 삼칠은 활혈화어活血化瘀 및 지통止痛 작용을 겸하여 상처의 회복을 도움<\/p><h4>③수렴제산收斂制酸, 소종생기消腫生肌 모듈 — 위산을 억제하고 궤양면을 보호하며 종기를 가라앉히고 새살을 돋게 함<\/h4><p><b>오적골, 백급, 백렴<\/b>: 오적골은 수렴제산收斂制酸하여 위산 분비를 억제하고 궤양 부위를 보호하며, 백급과 백렴은 수렴지혈收斂止血, 소종산결消腫散結 및 생기렴창生肌斂瘡 작용을 통해 궤양 창면의 조속한 유합을 촉진함<\/p><h4>④화습행기化濕行氣, 개위소만開胃消滿 모듈 — 중초의 탁한 습사를 걷어내고 기기氣機를 소통시켜 더부룩함과 통증을 해소함<\/h4><p><b>백두구<\/b>: 중초의 탁한 습사를 화하고 기기를 소통시키며, 비위의 운화력을 도와 뱃속의 더부룩함과 답답함을 해소함<\/p><h4>⑤소간해울疏肝解鬱, 이기조화理氣調和 모듈 — 간과 위의 기체를 풀고 기기 승강을 바로잡음<\/h4><p><b>시호<\/b>: 청해울열淸解鬱熱하고 승거양기升擧陽氣하여 간과 위의 기세를 조화롭게 이끌어 기기 실조를 개선함<\/p><h4>⑥조화제약調和諸藥, 완급지통緩急止痛 모듈 — 제반 약물의 편성偏性을 조화시키고 복통을 완화함<\/h4><p><b>감초<\/b>: 완급지통, 사화해독瀉火解毒하고 제반 약물의 성질을 부드럽게 융화시킴<\/p>"},{"k":"master","t":"저우쉐원의 위옹胃癰 치료","html":"<h4>①병기 인식 — 독열울위毒熱鬱胃 이론과 이옹론치以癰論治<\/h4><p><b>고대 문헌의 계승과 내옹內癰 개념 정립<\/b>: 《내경》의 위완옹胃脘癰 병기(기역어위氣逆於胃, 인영열성人迎熱盛, 한열여학寒熱如瘧, 신피갑착身皮甲錯 등)와 《제병원후론諸病源候論》의 육부불합六腑不合 및 한습·음기 울적으로 인한 화열생성化熱生成 과정을 계승함. 위장 점막의 붉고 부어오르는 궤양 양상이 외과 옹종의 홍紅, 종腫, 열熱, 통痛및 부육궤란腐肉潰爛 특징과 일치한다는 점에 착안하여 소화성 궤양을 ‘내옹內癰’으로 정의하고 이옹론치以癰論治의 학술적 관점을 확립함<\/p><p><b>병인과 독열毒熱의 형성<\/b>: Hp 감염, 불규칙한 식이, 정지실조情志失調, 흡연, 음주, 약물 자극, 담즙 역류 등이 모두 독사毒邪에 해당함. 이 독사가 위장에 침입하여 비·위·간 등의 장부 기능을 실조시키고 기기승강氣機升降을 방해하여 오래 머물다 열로 화함으로써 독열울위毒熱鬱胃 병증을 일으킨다고 봄 병인별 특성 및 전변: 간위울열肝胃鬱熱은 위기실화胃氣實火와 온울화화溫鬱化火로 인해 발생하며, 공복 시 통증이 심하고 식후에 완화되는 실열實熱의 특성을 보임. 또한 병사가 오래되면 기가 허해지고 위막胃膜이 실양失養되어 궤양이 수렴하기 어렵게 됨<\/p><h4>②치료의 핵심 — 외과적 소消·탁托·보補 치법의 내과적 응용과 시기별 활용<\/h4><p><b>소법消法(활동기 초기/미성농기未成膿期)<\/b>: 독사가 처음 침입하여 정사교쟁正邪交爭하고 열독이 뭉친 초기 단계에 적용하며, 옹종을 흩어지게 하고 독사가 결합하여 고름이 되는 것을 방지함. 청열해독, 활혈화어活血化瘀, 거어지통祛瘀止痛을 기본 원칙으로 삼음 탁법托法(활동기 중기/성농기成膿期): 병정이 오래되어 정기가 손상되고 독사가 안으로 함몰될 위험이 있을 때 적용함. 보기제補氣劑와 투농외출透膿外出(또는 탁독배농托毒排膿)의 약물을 배합하여 정기를 돋우고 독사를 체외로 원활히 배출시킴<\/p><p><b>보법補法(회복기·반흔기瘢痕期)<\/b>: 독사가 이미 제거되었으나 오랜 병사로 인해 비위의 정기가 크게 허손된 단계에 적용함. 익기건비益氣健脾, 탁독생기托毒生肌를 도모하여 쇠약해진 비위 기능을 보양하고 궤양 창면의 조속한 유합과 재생을 촉진함<\/p><h4>③담화역위膽火逆胃와 담즙 역류성 위염의 통합적 학설<\/h4><p><b>담화역위 및 위락손상胃絡損傷<\/b>: “실은 담에 있고 역은 위에 있다實在膽而逆在胃”, “간담의 화가 거슬러 위로 올라가 위에 들어간다肝膽之火逆入於胃”는 이론에 근거하여 담즙 역류성 위염의 발병을 담수위역膽水胃逆, 위락손상胃絡損傷으로 설명함 담위동치膽胃同治: 단순한 국소 역류 치료에서 벗어나 이담청열利膽淸熱, 영락호막寧絡護膜의 법을 적용하여 담즙 분비 조절과 위점막 염증 회복을 동시에 도모함<\/p><h4>④위음허胃陰虛 및 위산 결핍증에 대한 치법<\/h4><p><b>감한생진甘寒生津 및 산감화음酸甘化陰<\/b>: 병정이 길어져 위음허胃陰虛가 나타날 때, 작약감초탕芍藥甘草湯과 익위탕益胃湯 등을 활용하여 산감화음酸甘化陰 및 감한생진甘寒生津을 도모하며 상심桑椹, 오매烏梅 등으로 위점막 회복을 촉진함<\/p><h4>⑤위축성 위염萎縮性胃炎 및 Hp 제어 원칙<\/h4><p><b>공격 인자와 방어 인자의 균형<\/b>: Hp는 위점막 손상의 주요 공격 인자이며, 한편으로는 “정기재내正氣在內, 사불가간邪不可干”의 방어 인자 강화가 중요함 항균 및 면역 조절 약물 활용: 포공영, 고삼, 황련, 삼칠, 백화사설초 등의 약물이 지닌 Hp 억제 작용과 면역 기능 증강 작용을 결합하여 조직 복구를 도모함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 45 편 발표<\/td><td>최근 5 년간 14편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">활동기 위궤양<\/span> <span class=\"kw\">소화성궤양<\/span> <span class=\"kw\">Hp 관련 궤양<\/span> <span class=\"kw\">독열치옹毒熱致癰<\/span><\/td><td>‘독열치옹’ 병인론 기반의 활동기 위궤양 특화 치료전략<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">궤득강潰得康<\/span> <span class=\"kw\">건비화위健脾和胃<\/span> <span class=\"kw\">탁부생기托腐生肌<\/span> <span class=\"kw\">구성 약재 제거( 拆方)<\/span><\/td><td>치료원리·구성별 구성 약재 제거(拆方)를 통한 핵심 약효군 및 최적 처방 규명<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">NLRP3/Caspase-1<\/span> <span class=\"kw\">GSDMD<\/span> <span class=\"kw\">PKA/cAMP<\/span> <span class=\"kw\">CREB<\/span> <span class=\"kw\">세포사멸<\/span><\/td><td>염증에서 세포 파이롭토시스·세포사멸 중심의 분자기전 평가로 고도화<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">데이터마이닝<\/span> <span class=\"kw\">상태–표적 의학(태파의학態靶醫學)<\/span> <span class=\"kw\">세포·동물실험<\/span><\/td><td>‘독열’ 병인론과 현대 분자표적·신호경로를 연결하는 융합 R&amp;D<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2024 최신연구)<\/h4><p class=\"row\">“독열치옹毒熱致癰”의 병인·병기와 단계별 치료체계 확립 <b>2024, 陳力銘 등<\/b><\/p><p>상태–표적 의학(태파의학態靶醫學)을 기반으로 활동기 위궤양을 “위옹胃癰”으로 규정하고, 독열온결기毒熱蘊結期 → 독열상정기毒熱傷正期 → 정허독련기正虛毒戀期의 3단계 병기 변화를 제시. 이에 따라 청열해독淸熱解毒·소옹생기消癰生肌를 기본 치법으로 하고, 단계별로 청열해독·탁부생기托腐生肌·건비화위健脾和胃를 차별 적용하여 소옹궤득강消癰潰得康을 대표 처방으로 제시<\/p><p><b>의미<\/b> 전통적인 “독열치옹” 병인론을 상태–표적 의학의 ‘태態–파靶 동조’ 프레임으로 재구성하여, 활동기 위궤양의 병기·치법· 처방을 하나의 치료체계로 연결<\/p><p class=\"row\">NLRP3 염증소체–세포 파이롭토시스와 “독열毒熱” 병리기전 연결 <b>2024, 段金江 등<\/b><\/p><p>활동기 소화성궤양의 염증반응 → NLRP3 염증소체 활성화 → Caspase-1 생성 → 세포 파이롭토시스 → IL-1β·IL-18·HMGB1 방출 → 연쇄적 염증반응이라는 병리과정을 제시<\/p><p><b>의미<\/b> “독열”을 단순한 중의학적 병인 개념에 머물게 하지 않고, NLRP3/Caspase-1 매개 세포 파이롭토시스라는 현대 면역· 염증기전과 연결할 수 있는 병리학적 근거를 제시<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>궤득강과립潰得康顆粒이 허가번호 Z10970079로 허가된 중성약으로 확인됨[11]. 설명서의 성분은 12미(황련·포공영· 고삼·삼칠·황기·절패모·백급·백렴·해표초·두구·사인·감초)로, 본문 원처방(13종)의 인삼·시호가 없고 사인이 더해져 있어 제품 연구의 결과를 원처방에 그대로 옮길 수 없음. 신약 임상 등록(CTR)과 별도 특허는 확인되지 않음 허가 중성약 설명서 요점[11]<\/p><div class=\"tbl\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>제품명<\/td><td>궤득강과립 潰得康顆粒 (Kuìdékāng Kēlì)<\/td><\/tr><tr><td>허가<\/td><td>허가번호 Z10970079<\/td><\/tr><tr><td>효능·적응증<\/td><td>청열화위淸熱和胃·제산지통制酸止痛울열증鬱熱證 위완통(명치 작열감·신물 역류·트림·변비)<\/td><\/tr><tr><td>용법·용량<\/td><td>공복에 1회 10g, 1일 2회, 6주를 1주기로 함<\/td><\/tr><tr><td>금기·주의<\/td><td>· 임부 금기<br>· 위한통胃寒痛에는 맞지 않음<br>· 복용 중 보익 중약을 함께 쓰지 않음<br>· 만성질환자·소아·노약자는 의사 지도 아래 복용, 3일 복용 후 개선이 없으면 진료<br>· 이상반응은 ‘명확하지 않음’으로 기재<\/td><\/tr><\/tbody><\/table><\/div><p class=\"boxlbl\">시사점<\/p><p class=\"box\">중국에서 이미 허가된 중성약이므로 국내는 원료·처방 정보가 공개된 상태에서 시작할 수 있으며, 헬리코박터 제균 병용 등 중국 제품이 다루지 않은 적응증으로 차별화하는 것이 현실적<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 저우치.이옹논치 소화성 궤양의 이론 연구以癰論治消化性潰瘍的理論研究[J].랴오닝중의잡지遼寧中醫雜志,2005,(10):100-101.<\/li><li class=\"ref\">[2] 톈언밍.저우쉐원 교수의 소화성 궤양 치료 임상 경험周學文教授治療消化性潰瘍的臨床經驗[D].랴오닝중의약대학遼寧中醫藥大學,2013.<\/li><li class=\"ref\">[3] 바이광.저우쉐원 교수의 비위병 치료 학술사상에 대한 탐구周學文教授治療脾胃病學術思想淺探[J].중의약학간中醫藥學刊,2005,(3):407-411.<\/li><li class=\"ref\">[4] 저우쉐원.위궤양 활동기의 중의 변증 치료胃潰瘍活動期的中醫證治[J].중화중의약학간中華中醫藥學刊,2007,(9):1775-1776.<\/li><li class=\"ref\">[5] 류린,왕추이제,정훙신,등.“이효증인”소옹궤득강의 위궤양 위독열증 치료 무작위 이중맹검 대조 임상시험“以效證因”消癰潰得康治療胃潰瘍胃毒熱證的隨機雙盲對照臨床試驗[J].세계과학기술(중의약현대화)世界科學技術(中醫藥現代化),2012,14(2):1399-1404.<\/li><li class=\"ref\">[6] 딩후이민,샤오징둥.HP 관련 소화성 궤양의 발생·발전 기전과 중의 독열 이론의 잠재적 연관성 탐구HP相關消化性潰瘍的發生發展機制與中醫毒熱理論潛在關聯探討[J].랴 오닝중의약대학학보遼寧中醫藥大學學報,2022,24(4):108-112.<\/li><li class=\"ref\">[7] 왕신위,류궈정,샤오징둥.저우쉐원 등 11명 국의대사의 소화성 궤양 치료 요점周學文等11位國醫大師論治消化性潰瘍的擷萃[J].실용중의내과잡지實用中醫內科雜志,2024,38(2):11-13.<\/li><li class=\"ref\">[8] 리위펑,왕추이제,저우쉐원,등.소옹궤득강 과립의 활동기 위궤양 270례 치료消癰潰得康顆粒治療活動期胃潰瘍270例[J].중의연구中醫研究,2011,24(1):35-37.<\/li><li class=\"ref\">[9] 천리밍,류궈정,양숴,리옌,쑨양양,볜웨닝,자오이린,샤오징둥.태표의학에 기반한 독열이론의 위궤양 활동기 이옹논치 탐구基於態靶醫學探討毒熱理論以癰論治胃潰瘍活動期[J].중국실험방제학잡지中國實驗方劑學雜志,2024,30(18):217-227.<\/li><li class=\"ref\">[10] 돤진장,저우리제,왕신위,샤오징둥.NLRP3 염증소체 활성화로 유발된 GES-1 세포 파이롭토시스에 기반한 소화성 궤양 ‘독열’ 병리 변화 기전 탐구基於NLRP3炎症小體活化導致GES-1細胞焦亡探討消化性潰瘍“毒熱”病理演變機制[J].랴오닝중의약대학학보遼寧中醫藥大學學報,2024,26(3):37-41.<\/li><li class=\"ref\">[11] 약지데이터藥智數據.궤득강과립潰得康顆粒 설명서(국약준자 Z10970079)[DB/OL].<a href=\"https://db.yaozh.com/instruct/14368804.html.\" target=\"_blank\" rel=\"noopener\">https://db.yaozh.com/instruct/14368804.html.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"황련","name":"황련","dose":"","base":"황련"},{"raw":"황기","name":"황기","dose":"","base":"황기"},{"raw":"포공영","name":"포공영","dose":"","base":"포공영"},{"raw":"고삼","name":"고삼","dose":"","base":"고삼"},{"raw":"浙패모","name":"浙패모","dose":"","base":"패모"},{"raw":"오적골","name":"오적골","dose":"","base":"오적골"},{"raw":"삼칠","name":"삼칠","dose":"","base":"삼칠"},{"raw":"백급","name":"백급","dose":"","base":"백급"},{"raw":"백렴","name":"백렴","dose":"","base":"백렴"},{"raw":"백두구","name":"백두구","dose":"","base":"백두구"},{"raw":"인삼","name":"인삼","dose":"","base":"인삼"},{"raw":"시호","name":"시호","dose":"","base":"시호"},{"raw":"감초","name":"감초","dose":"","base":"감초"}],"notes":["※ 중성약으로 개발되면서 원래 조성에 있던 인삼, 시호가 빠지고 사인이 추가됨"],"핵심 효능":["위장에 정체된 독열毒熱을 해소함(청열화위淸熱和胃)","위옹의 종기를 없애고 새살이 돋아나게 함(탁독생기托毒生肌)","비위를 보익하고 위산을 억제하며 궤양 부위를 수렴함(건비렴창健脾斂瘡, 제산지통制酸止痛)"],"주치증":["소화성 궤양 활동기, 울열증鬱熱證으로 인한 위완통, 작열감, 반산返酸, 트림, 변비, 위점막 미란 및 궤양 등"],"연구 확장 영역":["만성 위염, 소화성 궤양 활동기 및 회복기 관리, 항염 및 위 점막 보호, 헬리코박터 파일로리(Hp) 관련 위장관 질환"],"R&D 포인트":["황련과 황기의 배합이 발휘하는 항균, 항염, 면역 조절 및 위 점막 보호 기전 분석","‘소消·탁托·보補’ 외과 치법의 내과적 응용에 따른 궤양 치유 촉진 작용","위산 분비 억제, 미세순환 개선 및 헬리코박터 파일로리(Hp) 억제 효과 검증"]},"modules":[{"name":"①청열해독 · 청열화위","hz":"淸熱和胃","herbs":["황련","포공영","고삼","浙패모"],"role":"중초의 습열과 독사를 제거하고 위장 열독을 해소함"},{"name":"②보기탁독 · 생기회복","hz":"補氣托毒 · 生肌回復","herbs":["황기","인삼","삼칠"],"role":"비위脾胃의 정기를 북돋우고 독사를 체외로 배출하며 궤양 부위의 치유를 촉진함"},{"name":"③수렴제산 · 소종생기","hz":"收斂制酸 · 消腫生肌","herbs":["오적골","백급","백렴"],"role":"위산을 억제하고 궤양면을 보호하며 종기를 가라앉히고 새살을 돋게 함"},{"name":"④화습행기 · 개위소만","hz":"化濕行氣 · 開胃消滿","herbs":["백두구"],"role":"중초의 탁한 습사를 걷어내고 기기氣機를 소통시켜 더부룩함과 통증을 해소함"},{"name":"⑤소간해울 · 이기조화","hz":"疏肝解鬱 · 理氣調和","herbs":["시호"],"role":"간과 위의 기체를 풀고 기기 승강을 바로잡음"},{"name":"⑥조화제약 · 완급지통","hz":"調和諸藥 · 緩急止痛","herbs":["감초"],"role":"제반 약물의 편성偏性을 조화시키고 복통을 완화함"}],"rd":[{"tag":"Pyroptosis & H. pylori","title":"NLRP3–세포 파이롭토시스 기반 활동기 궤양 염증 제어","html":"<p>‘독열毒熱’을 위상피세포(GES-1)의 NLRP3/Caspase-1 매개 세포 파이롭토시스로 설명한 연구를 근거로, 궤득강과립이 IL-1β·IL-18·HMGB1 방출을 억제하는지 확인함 Hp 감염 궤양에서는 표준 4제 제균요법에 더했을 때(add-on) 제균율과 궤양 치유율이 높아지는지 평가<\/p><p><b>검증 설계<\/b> Hp 감염 동물모델 및 GES-1 세포에서 NLRP3·Caspase-1·GSDMD 측정, 임상에서는 4제 제균요법 단독 대 병용으로 제균율·치유율 비교<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [10](2024, NLRP3 세포 파이롭토시스), [6](Hp와 독열 이론)<\/p>"},{"tag":"Stage-Matched Therapy","title":"궤양 병기별 맞춤 투약 프로토콜(검증 전 가설)","html":"<p>독열온결기→독열상정기→정허독련기의 3단계 병기 구분을 내시경 병기(활동기 A1–A2, 치유기 H1–H2, 반흔기 S1–S2)에 1:1로 대응시키는 것은 검증 전 가설임 먼저 두 병기 체계의 대응 관계를 내시경 자료로 확인하고, 단계마다 청열해독약과 탁독생기·보기약의 비중을 달리하는 투약 프로토콜을 설계하여 궤양 치유의 질과 재발률로 평가<\/p><p><b>검증 설계<\/b> 치유 판정을 반흔기 질적 치유(S2 도달률)와 12개월 재발률로 설정하여 PPI 단독 치료와 차별화되는 지점을 보여줌<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [9](2024, 3단계 병기와 단계별 치법), [4](위궤양 활동기 변증 치료)<\/p>"},{"tag":"Clinical Positioning","title":"허가 제품(潰得康顆粒) 기반 PPI 병용 근거 확대","html":"<p>원 처방은 이미 12미 ‘潰得康顆粒’(허가번호 Z10970079, 원방의 인삼·시호가 빠지고 사인이 더해짐)으로 제품화되었고 무작위 이중맹검 시험과 270례 임상 보고는 과립에 대한 것이어서 원방 효과로 그대로 옮길 수 없음 새 기전 연구보다 PPI 표준치료와의 병용에서 점막 재생의 질과 재발 억제라는 차별점을 평가하는 것이 현실적인 다음 단계<\/p><p><b>검증 설계<\/b> PPI 단독 대 PPI+과립 무작위 비교, 1차 지표는 8주 내시경 치유율과 12개월 재발률, 2차 지표는 증상 점수·점막 조직 재생 지표<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [5](2012, 무작위 이중맹검 대조시험), [8](270례),[11](제품 정보)<\/p>"},{"tag":"Bile Reflux Gastritis","title":"담즙역류성 위염으로 적응증 확장","html":"<p>‘담화역위膽火逆胃’와 담위동치 이론을 담즙산에 의한 위점막 손상으로 재해석함 담즙역류성 위염으로 적응증을 넓히되, 제품화 과정에서 원 처방의 시호·인삼이 빠졌으므로 시호 가미 여부에 따른 효과 차이를 함께 비교하는 것이 핵심<\/p><p><b>검증 설계<\/b> 담즙산 유도 위점막 손상 모델에서 제품 조성 대 시호 가미 조성의 점막 보호 효과와 위 배출 기능을 비교<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> 본문 조성 비고(인삼·시호 제외, 사인 추가), Master’s Thought ③ 「담화역위와 담즙 역류성 위염」<\/p>"}],"logic":[{"n":"1","title":"독열울위毒熱鬱胃와 이옹론치以癰論治","body":"위장 점막의 열독울결을 외과적 옹저에 비유하여 염증을 다스림"},{"n":"2","title":"소消·탁托·보補 치법의 시기별 응용","body":"초기 소법에서 중·후기 탁법과 보법으로 이어지는 단계별 치료"},{"n":"3","title":"수렴제산收斂制酸과 공격·방어 균형","body":"위산을 억제하고 궤양면을 보호하며 방어 인자를 강화함"},{"n":"4","title":"담화역위膽火逆胃와 기기승강氣機升降 조화","body":"담즙 역류를 막고 간위肝胃의 기기를 소통시킴"}],"field":1,"pages":[20,26],"evidence":"연구 축적 (논문 45편)","product":"궤득강과립 (중성약, 12미)","status":"허가 중성약","s":["1-2","소옹궤득강","消癰潰得康","(궤득강과립潰得康顆粒)","저우쉐원","周學文","위장 점막의 울열鬱熱과 독사毒邪를 풀어 염증을 다스리고, 외과의 소消·탁托·보補 치법을 응용하여 위옹胃癰을 치료하는 처방","황련 황기 포공영 고삼 浙패모 오적골 삼칠 백급 백렴 백두구 인삼 시호 감초","※ 중성약으로 개발되면서 원래 조성에 있던 인삼, 시호가 빠지고 사인이 추가됨","핵심 효능 위장에 정체된 독열毒熱을 해소함(청열화위淸熱和胃) 위옹의 종기를 없애고 새살이 돋아나게 함(탁독생기托毒生肌) 비위를 보익하고 위산을 억제하며 궤양 부위를 수렴함(건비렴창健脾斂瘡, 제산지통制酸止痛)","주치증 소화성 궤양 활동기, 울열증鬱熱證으로 인한 위완통, 작열감, 반산返酸, 트림, 변비, 위점막 미란 및 궤양 등","연구 확장 영역 만성 위염, 소화성 궤양 활동기 및 회복기 관리, 항염 및 위 점막 보호, 헬리코박터 파일로리(Hp) 관련 위장관 질환","R&D 포인트 황련과 황기의 배합이 발휘하는 항균, 항염, 면역 조절 및 위 점막 보호 기전 분석 ‘소消·탁托·보補’ 외과 치법의 내과적 응용에 따른 궤양 치유 촉진 작용 위산 분비 억제, 미세순환 개선 및 헬리코박터 파일로리(Hp) 억제 효과 검증","①청열해독 · 청열화위 淸熱和胃 황련 포공영 고삼 浙패모 중초의 습열과 독사를 제거하고 위장 열독을 해소함","②보기탁독 · 생기회복 補氣托毒 · 生肌回復 황기 인삼 삼칠 비위脾胃의 정기를 북돋우고 독사를 체외로 배출하며 궤양 부위의 치유를 촉진함","③수렴제산 · 소종생기 收斂制酸 · 消腫生肌 오적골 백급 백렴 위산을 억제하고 궤양면을 보호하며 종기를 가라앉히고 새살을 돋게 함","④화습행기 · 개위소만 化濕行氣 · 開胃消滿 백두구 중초의 탁한 습사를 걷어내고 기기氣機를 소통시켜 더부룩함과 통증을 해소함","⑤소간해울 · 이기조화 疏肝解鬱 · 理氣調和 시호 간과 위의 기체를 풀고 기기 승강을 바로잡음","⑥조화제약 · 완급지통 調和諸藥 · 緩急止痛 감초 제반 약물의 편성偏性을 조화시키고 복통을 완화함","독열울위毒熱鬱胃와 이옹론치以癰論治 위장 점막의 열독울결을 외과적 옹저에 비유하여 염증을 다스림","소消·탁托·보補 치법의 시기별 응용 초기 소법에서 중·후기 탁법과 보법으로 이어지는 단계별 치료","수렴제산收斂制酸과 공격·방어 균형 위산을 억제하고 궤양면을 보호하며 방어 인자를 강화함","담화역위膽火逆胃와 기기승강氣機升降 조화 담즙 역류를 막고 간위肝胃의 기기를 소통시킴","Pyroptosis & H. pylori NLRP3–세포 파이롭토시스 기반 활동기 궤양 염증 제어 ‘독열毒熱’을 위상피세포(GES-1)의 NLRP3/Caspase-1 매개 세포 파이롭토시스로 설명한 연구를 근거로, 궤득강과립이 IL-1β·IL-18·HMGB1 방출을 억제하는지 확인함 Hp 감염 궤양에서는 표준 4제 제균요법에 더했을 때(add-on) 제균율과 궤양 치유율이 높아지는지 평가 검증 설계 Hp 감염 동물모델 및 GES-1 세포에서 NLRP3·Caspase-1·GSDMD 측정, 임상에서는 4제 제균요법 단독 대 병용으로 제균율·치유율 비교 근거 직접 연구 근거 참고문헌 [10](2024, NLRP3 세포 파이롭토시스), [6](Hp와 독열 이론)","Stage-Matched Therapy 궤양 병기별 맞춤 투약 프로토콜(검증 전 가설) 독열온결기→독열상정기→정허독련기의 3단계 병기 구분을 내시경 병기(활동기 A1–A2, 치유기 H1–H2, 반흔기 S1–S2)에 1:1로 대응시키는 것은 검증 전 가설임 먼저 두 병기 체계의 대응 관계를 내시경 자료로 확인하고, 단계마다 청열해독약과 탁독생기·보기약의 비중을 달리하는 투약 프로토콜을 설계하여 궤양 치유의 질과 재발률로 평가 검증 설계 치유 판정을 반흔기 질적 치유(S2 도달률)와 12개월 재발률로 설정하여 PPI 단독 치료와 차별화되는 지점을 보여줌 근거 임상 경험 보고 참고문헌 [9](2024, 3단계 병기와 단계별 치법), [4](위궤양 활동기 변증 치료)","Clinical Positioning 허가 제품(潰得康顆粒) 기반 PPI 병용 근거 확대 원 처방은 이미 12미 ‘潰得康顆粒’(허가번호 Z10970079, 원방의 인삼·시호가 빠지고 사인이 더해짐)으로 제품화되었고 무작위 이중맹검 시험과 270례 임상 보고는 과립에 대한 것이어서 원방 효과로 그대로 옮길 수 없음 새 기전 연구보다 PPI 표준치료와의 병용에서 점막 재생의 질과 재발 억제라는 차별점을 평가하는 것이 현실적인 다음 단계 검증 설계 PPI 단독 대 PPI+과립 무작위 비교, 1차 지표는 8주 내시경 치유율과 12개월 재발률, 2차 지표는 증상 점수·점막 조직 재생 지표 근거 직접 연구 근거 참고문헌 [5](2012, 무작위 이중맹검 대조시험), [8](270례),[11](제품 정보)","Bile Reflux Gastritis 담즙역류성 위염으로 적응증 확장 ‘담화역위膽火逆胃’와 담위동치 이론을 담즙산에 의한 위점막 손상으로 재해석함 담즙역류성 위염으로 적응증을 넓히되, 제품화 과정에서 원 처방의 시호·인삼이 빠졌으므로 시호 가미 여부에 따른 효과 차이를 함께 비교하는 것이 핵심 검증 설계 담즙산 유도 위점막 손상 모델에서 제품 조성 대 시호 가미 조성의 점막 보호 효과와 위 배출 기능을 비교 근거 신규 연구가설 본문 조성 비고(인삼·시호 제외, 사인 추가), Master’s Thought ③ 「담화역위와 담즙 역류성 위염」"],"ss":{"composition":"그림 1-2 소옹궤득강消癰潰得康의 모듈 구성 ①청열해독, 청열화위淸熱和胃 모듈 — 중초의 습열과 독사를 제거하고 위장 열독을 해소함 황련, 포공영, 고삼, 浙패모 : 황련은 중초의 습열과 화울火鬱을 내려 위장 실증을 다스리고, 포공영은 청열해독 및 산결소옹散結消癰하며, 고삼은 청열조습淸熱燥濕하여 습독창양濕毒瘡瘍을 다스림. 浙패모는 청열산결소종淸熱散結消腫하여 창옹종독瘡癰腫毒을 치료함 ②보기탁독補氣托毒, 생기회복生肌回復 모듈 — 비위脾胃의 정기를 북돋우고 독사를 체외로 배출하며 궤양 부위의 치유를 촉진함 황기, 인삼, 삼칠 : 황기는 보기승양補氣升陽하고 탁독생기托毒生肌하여 비위의 정기를 돋우고, 인삼은 대보원기大補元氣, 건비익기健脾益氣, 고탈생진固脫生津하고 비위를 보양하며, 삼칠은 활혈화어活血化瘀 및 지통止痛 작용을 겸하여 상처의 회복을 도움 ③수렴제산收斂制酸, 소종생기消腫生肌 모듈 — 위산을 억제하고 궤양면을 보호하며 종기를 가라앉히고 새살을 돋게 함 오적골, 백급, 백렴 : 오적골은 수렴제산收斂制酸하여 위산 분비를 억제하고 궤양 부위를 보호하며, 백급과 백렴은 수렴지혈收斂止血, 소종산결消腫散結 및 생기렴창生肌斂瘡 작용을 통해 궤양 창면의 조속한 유합을 촉진함 ④화습행기化濕行氣, 개위소만開胃消滿 모듈 — 중초의 탁한 습사를 걷어내고 기기氣機를 소통시켜 더부룩함과 통증을 해소함 백두구 : 중초의 탁한 습사를 화하고 기기를 소통시키며, 비위의 운화력을 도와 뱃속의 더부룩함과 답답함을 해소함 ⑤소간해울疏肝解鬱, 이기조화理氣調和 모듈 — 간과 위의 기체를 풀고 기기 승강을 바로잡음 시호 : 청해울열淸解鬱熱하고 승거양기升擧陽氣하여 간과 위의 기세를 조화롭게 이끌어 기기 실조를 개선함 ⑥조화제약調和諸藥, 완급지통緩急止痛 모듈 — 제반 약물의 편성偏性을 조화시키고 복통을 완화함 감초 : 완급지통, 사화해독瀉火解毒하고 제반 약물의 성질을 부드럽게 융화시킴","master":"①병기 인식 — 독열울위毒熱鬱胃 이론과 이옹론치以癰論治 고대 문헌의 계승과 내옹內癰 개념 정립 : 《내경》의 위완옹胃脘癰 병기(기역어위氣逆於胃, 인영열성人迎熱盛, 한열여학寒熱如瘧, 신피갑착身皮甲錯 등)와 《제병원후론諸病源候論》의 육부불합六腑不合 및 한습·음기 울적으로 인한 화열생성化熱生成 과정을 계승함. 위장 점막의 붉고 부어오르는 궤양 양상이 외과 옹종의 홍紅, 종腫, 열熱, 통痛및 부육궤란腐肉潰爛 특징과 일치한다는 점에 착안하여 소화성 궤양을 ‘내옹內癰’으로 정의하고 이옹론치以癰論治의 학술적 관점을 확립함 병인과 독열毒熱의 형성 : Hp 감염, 불규칙한 식이, 정지실조情志失調, 흡연, 음주, 약물 자극, 담즙 역류 등이 모두 독사毒邪에 해당함. 이 독사가 위장에 침입하여 비·위·간 등의 장부 기능을 실조시키고 기기승강氣機升降을 방해하여 오래 머물다 열로 화함으로써 독열울위毒熱鬱胃 병증을 일으킨다고 봄 병인별 특성 및 전변: 간위울열肝胃鬱熱은 위기실화胃氣實火와 온울화화溫鬱化火로 인해 발생하며, 공복 시 통증이 심하고 식후에 완화되는 실열實熱의 특성을 보임. 또한 병사가 오래되면 기가 허해지고 위막胃膜이 실양失養되어 궤양이 수렴하기 어렵게 됨 ②치료의 핵심 — 외과적 소消·탁托·보補 치법의 내과적 응용과 시기별 활용 소법消法(활동기 초기/미성농기未成膿期) : 독사가 처음 침입하여 정사교쟁正邪交爭하고 열독이 뭉친 초기 단계에 적용하며, 옹종을 흩어지게 하고 독사가 결합하여 고름이 되는 것을 방지함. 청열해독, 활혈화어活血化瘀, 거어지통祛瘀止痛을 기본 원칙으로 삼음 탁법托法(활동기 중기/성농기成膿期): 병정이 오래되어 정기가 손상되고 독사가 안으로 함몰될 위험이 있을 때 적용함. 보기제補氣劑와 투농외출透膿外出(또는 탁독배농托毒排膿)의 약물을 배합하여 정기를 돋우고 독사를 체외로 원활히 배출시킴 보법補法(회복기·반흔기瘢痕期) : 독사가 이미 제거되었으나 오랜 병사로 인해 비위의 정기가 크게 허손된 단계에 적용함. 익기건비益氣健脾, 탁독생기托毒生肌를 도모하여 쇠약해진 비위 기능을 보양하고 궤양 창면의 조속한 유합과 재생을 촉진함 ③담화역위膽火逆胃와 담즙 역류성 위염의 통합적 학설 담화역위 및 위락손상胃絡損傷 : “실은 담에 있고 역은 위에 있다實在膽而逆在胃”, “간담의 화가 거슬러 위로 올라가 위에 들어간다肝膽之火逆入於胃”는 이론에 근거하여 담즙 역류성 위염의 발병을 담수위역膽水胃逆, 위락손상胃絡損傷으로 설명함 담위동치膽胃同治: 단순한 국소 역류 치료에서 벗어나 이담청열利膽淸熱, 영락호막寧絡護膜의 법을 적용하여 담즙 분비 조절과 위점막 염증 회복을 동시에 도모함 ④위음허胃陰虛 및 위산 결핍증에 대한 치법 감한생진甘寒生津 및 산감화음酸甘化陰 : 병정이 길어져 위음허胃陰虛가 나타날 때, 작약감초탕芍藥甘草湯과 익위탕益胃湯 등을 활용하여 산감화음酸甘化陰 및 감한생진甘寒生津을 도모하며 상심桑椹, 오매烏梅 등으로 위점막 회복을 촉진함 ⑤위축성 위염萎縮性胃炎 및 Hp 제어 원칙 공격 인자와 방어 인자의 균형 : Hp는 위점막 손상의 주요 공격 인자이며, 한편으로는 “정기재내正氣在內, 사불가간邪不可干”의 방어 인자 강화가 중요함 항균 및 면역 조절 약물 활용: 포공영, 고삼, 황련, 삼칠, 백화사설초 등의 약물이 지닌 Hp 억제 작용과 면역 기능 증강 작용을 결합하여 조직 복구를 도모함","rd":"","evidence":"①연구 규모 Total Papers(15yrs) Recent Focus(5yrs) 총 45 편 발표 최근 5 년간 14편 발표 ②연구 키워드로 본 R&D 가이던스(최근 5개년 분석) 구분 핵심 키워드 R&D 인사이트 주치증 활동기 위궤양 소화성궤양 Hp 관련 궤양 독열치옹毒熱致癰 ‘독열치옹’ 병인론 기반의 활동기 위궤양 특화 치료전략 병용 전략 궤득강潰得康 건비화위健脾和胃 탁부생기托腐生肌 구성 약재 제거( 拆方) 치료원리·구성별 구성 약재 제거(拆方)를 통한 핵심 약효군 및 최적 처방 규명 평가 지표 NLRP3/Caspase-1 GSDMD PKA/cAMP CREB 세포사멸 염증에서 세포 파이롭토시스·세포사멸 중심의 분자기전 평가로 고도화 방법론 네트워크 약리학 데이터마이닝 상태–표적 의학(태파의학態靶醫學) 세포·동물실험 ‘독열’ 병인론과 현대 분자표적·신호경로를 연결하는 융합 R&D ③High-Impact 연구 하이라이트(2024 최신연구) “독열치옹毒熱致癰”의 병인·병기와 단계별 치료체계 확립 2024, 陳力銘 등 상태–표적 의학(태파의학態靶醫學)을 기반으로 활동기 위궤양을 “위옹胃癰”으로 규정하고, 독열온결기毒熱蘊結期 → 독열상정기毒熱傷正期 → 정허독련기正虛毒戀期의 3단계 병기 변화를 제시. 이에 따라 청열해독淸熱解毒·소옹생기消癰生肌를 기본 치법으로 하고, 단계별로 청열해독·탁부생기托腐生肌·건비화위健脾和胃를 차별 적용하여 소옹궤득강消癰潰得康을 대표 처방으로 제시 의미 전통적인 “독열치옹” 병인론을 상태–표적 의학의 ‘태態–파靶 동조’ 프레임으로 재구성하여, 활동기 위궤양의 병기·치법· 처방을 하나의 치료체계로 연결 NLRP3 염증소체–세포 파이롭토시스와 “독열毒熱” 병리기전 연결 2024, 段金江 등 활동기 소화성궤양의 염증반응 → NLRP3 염증소체 활성화 → Caspase-1 생성 → 세포 파이롭토시스 → IL-1β·IL-18·HMGB1 방출 → 연쇄적 염증반응이라는 병리과정을 제시 의미 “독열”을 단순한 중의학적 병인 개념에 머물게 하지 않고, NLRP3/Caspase-1 매개 세포 파이롭토시스라는 현대 면역· 염증기전과 연결할 수 있는 병리학적 근거를 제시","china":"중국 제품화 현황 궤득강과립潰得康顆粒이 허가번호 Z10970079로 허가된 중성약으로 확인됨[11]. 설명서의 성분은 12미(황련·포공영· 고삼·삼칠·황기·절패모·백급·백렴·해표초·두구·사인·감초)로, 본문 원처방(13종)의 인삼·시호가 없고 사인이 더해져 있어 제품 연구의 결과를 원처방에 그대로 옮길 수 없음. 신약 임상 등록(CTR)과 별도 특허는 확인되지 않음 허가 중성약 설명서 요점[11] 항목 내용 제품명 궤득강과립 潰得康顆粒 (Kuìdékāng Kēlì) 허가 허가번호 Z10970079 효능·적응증 청열화위淸熱和胃·제산지통制酸止痛울열증鬱熱證 위완통(명치 작열감·신물 역류·트림·변비) 용법·용량 공복에 1회 10g, 1일 2회, 6주를 1주기로 함 금기·주의 · 임부 금기 · 위한통胃寒痛에는 맞지 않음 · 복용 중 보익 중약을 함께 쓰지 않음 · 만성질환자·소아·노약자는 의사 지도 아래 복용, 3일 복용 후 개선이 없으면 진료 · 이상반응은 ‘명확하지 않음’으로 기재 시사점 중국에서 이미 허가된 중성약이므로 국내는 원료·처방 정보가 공개된 상태에서 시작할 수 있으며, 헬리코박터 제균 병용 등 중국 제품이 다루지 않은 적응증으로 차별화하는 것이 현실적 참고문헌 [1] 저우치.이옹논치 소화성 궤양의 이론 연구以癰論治消化性潰瘍的理論研究[J].랴오닝중의잡지遼寧中醫雜志,2005,(10):100-101. [2] 톈언밍.저우쉐원 교수의 소화성 궤양 치료 임상 경험周學文教授治療消化性潰瘍的臨床經驗[D].랴오닝중의약대학遼寧中醫藥大學,2013. [3] 바이광.저우쉐원 교수의 비위병 치료 학술사상에 대한 탐구周學文教授治療脾胃病學術思想淺探[J].중의약학간中醫藥學刊,2005,(3):407-411. [4] 저우쉐원.위궤양 활동기의 중의 변증 치료胃潰瘍活動期的中醫證治[J].중화중의약학간中華中醫藥學刊,2007,(9):1775-1776. [5] 류린,왕추이제,정훙신,등.“이효증인”소옹궤득강의 위궤양 위독열증 치료 무작위 이중맹검 대조 임상시험“以效證因”消癰潰得康治療胃潰瘍胃毒熱證的隨機雙盲對照臨床試驗[J].세계과학기술(중의약현대화)世界科學技術(中醫藥現代化),2012,14(2):1399-1404. [6] 딩후이민,샤오징둥.HP 관련 소화성 궤양의 발생·발전 기전과 중의 독열 이론의 잠재적 연관성 탐구HP相關消化性潰瘍的發生發展機制與中醫毒熱理論潛在關聯探討[J].랴 오닝중의약대학학보遼寧中醫藥大學學報,2022,24(4):108-112. [7] 왕신위,류궈정,샤오징둥.저우쉐원 등 11명 국의대사의 소화성 궤양 치료 요점周學文等11位國醫大師論治消化性潰瘍的擷萃[J].실용중의내과잡지實用中醫內科雜志,2024,38(2):11-13. [8] 리위펑,왕추이제,저우쉐원,등.소옹궤득강 과립의 활동기 위궤양 270례 치료消癰潰得康顆粒治療活動期胃潰瘍270例[J].중의연구中醫研究,2011,24(1):35-37. [9] 천리밍,류궈정,양숴,리옌,쑨양양,볜웨닝,자오이린,샤오징둥.태표의학에 기반한 독열이론의 위궤양 활동기 이옹논치 탐구基於態靶醫學探討毒熱理論以癰論治胃潰瘍活動期[J].중국실험방제학잡지中國實驗方劑學雜志,2024,30(18):217-227. [10] 돤진장,저우리제,왕신위,샤오징둥.NLRP3 염증소체 활성화로 유발된 GES-1 세포 파이롭토시스에 기반한 소화성 궤양 ‘독열’ 병리 변화 기전 탐구基於NLRP3炎症小體活化導致GES-1細胞焦亡探討消化性潰瘍“毒熱”病理演變機制[J].랴오닝중의약대학학보遼寧中醫藥大學學報,2024,26(3):37-41. [11] 약지데이터藥智數據.궤득강과립潰得康顆粒 설명서(국약준자 Z10970079)[DB/OL]. https://db.yaozh.com/instruct/14368804.html."}},{"id":"1-3","ko":"소조기기탕","hz":"疏調氣機湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"간의 소설 기능을 회복하고 비신脾腎을 조화롭게 다스려 전신 기기의 울체를 풀고 기혈의 조화를 도모하는 처방","meta":{"주요 적응증":"간울·기기실조, 정서성 소화장애·우울","확인된 연구자료 유형":"연구 축적 (논문 27편)","제형·제품화":"—"},"page":27,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-3 소조기기탕疏調氣機湯의 모듈 구성<\/p><h4>①서간해울舒肝解鬱 및 소창기기疏暢氣機 모듈 — 간의 소설 기능을 회복하고 전신 기기의 승강을 조율함<\/h4><p><b>시호, 향부자, 울금<\/b>: 시호는 승발청양升發淸陽하고 소해간울疏解肝鬱하여 군약으로 작용함. 향부자는 간울을 풀고 간의 거슬러 오르는 기세를 다스리며, 울금은 기분과 혈분을 두루 소통시켜 행기해울行氣解鬱함. 이 약물들은 시호의 서간해울 및 소창기기 작용을 강력하게 보조함<\/p><h4>②양신건비養腎健脾 및 선후천고본先後天固本 모듈 — 비의 운화와 신의 정원精元을 보양하여 기기 조절의 기반을 다짐<\/h4><p><b>백출, 음양곽, 복령<\/b>: 백출은 비를 보하고 조습하며, 음양곽은 온보신양溫補腎陽하고 정수를 북돋움. 복령은 비를 보하고 습을 삼출함. 이 약물들은 선천과 후천의 본을 보호하여 소조疏調 치법의 목적을 완성할 수 있도록 돕는 신약의 역할을 수행함<\/p><h4>③이기화혈理氣和血 및 기기조화氣機調和 모듈 — 기의 울체로 인해 발생한 혈의 체류를 풀고 상하 기기를 소통시킴<\/h4><p><b>단삼, 천궁, 지각, 백작약<\/b>: 단삼과 천궁은 활혈거어活血祛瘀하며, 지각은 이기관중理氣寬中하고 시호와 배오되어 일승일강一升一降으로 승청강탁升淸降濁함. 백작약은 감초와 배오되어 산감화음酸甘化陰하며 유간양혈완급柔肝養血緩急함<\/p><h4>④조화제약調和諸藥 모듈 — 약물의 편성을 조화시키고 오장육부의 기기를 원활히 함<\/h4><p><b>박하, 감초<\/b>: 박하는 행기개울行氣開鬱하고, 감초는 보비익기補脾益氣하고 제반 약물의 성질을 조화롭게 융화시킴<\/p>"},{"k":"master","t":"장전의 소조기기疏調氣機 이론","html":"<h4>①병기 인식 — 기기실조氣機失調와 ‘일체양익一體兩翼’의 장부 연계<\/h4><p>인체의 생리적 상층과 하층, 오장육부의 기능은 기의 승강출입 운동에 의존하며, 그 중심 축은 간의 소설 기능에 있음<\/p><p>정지내상이나 현대적 생활환경의 스트레스는 간의 소설실직疏泄失職을 유발하여 기기울체氣機鬱滯를 일으키고, 이는 다시 비토를 억누르고 신의 정원을 손상시켜 전신 다기관의 기능 장애로 이어짐<\/p><h4>②치료의 핵심 — ‘간이 주체이고, 비신은 양측 날개以肝爲主體, 脾腎爲兩翼’라는 일체양익의 철학<\/h4><p>소조기기疏調氣機의 핵심은 간기肝氣의 서전舒展에 있으며, 이를 뒷받침하기 위해 후천의 본인 비와 선천의 본인 신을 양 날개로 삼아 전신 기혈의 균형을 도모함<\/p><p>단순한 대증 치료를 지양하고, 기의 울체와 혈의 어지러움을 동시에 다스려 질병의 근본 고리를 해체함<\/p><h4>③임상적 활용 및 변증 가감<\/h4><p>소조기기탕을 기본방으로 하여 환자의 세부 임상 양상에 유연하게 대응함<\/p><p class=\"sub\"><b>기허氣虛할 때<\/b>: 황기, 태자삼, 당삼, 산약, 대조 가미<\/p><p class=\"sub\"><b>혈허血虛할 때<\/b>: 당귀, 지황, 하수오, 아교, 계원 가미<\/p><p class=\"sub\"><b>음허陰虛할 때<\/b>: 사삼, 현삼, 맥문동, 황정, 여정자, 구기자 가미<\/p><p class=\"sub\"><b>양허陽虛할 때<\/b>: 부편, 육계, 녹각상, 파극천, 보골지, 익지인 가미<\/p><p class=\"sub\"><b>허열虛熱이 있을 때<\/b>: 지모, 황백, 지골피 가미<\/p><p class=\"sub\"><b>혈열血熱이 있을 때<\/b>: 생지, 목단피, 자초 가미<\/p><p class=\"sub\"><b>습열濕熱이 있을 때<\/b>: 인진호, 의이인, 통초 가미<\/p><p class=\"sub\"><b>열독熱毒이 있을 때<\/b>: 은화, 연교, 포공영, 패장초 가미<\/p><p class=\"sub\"><b>위기상역胃氣上逆이 있을 때<\/b>: 지실로 교체, 법반하, 대자석 가미<\/p><p class=\"sub\"><b>혈어血瘀가 있을 때<\/b>: 도인, 홍화 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 27 편 발표<\/td><td>최근 5 년간 21편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">신경염증<\/span> <span class=\"kw\">뇌혈관질환<\/span> <span class=\"kw\">갑상선질환<\/span> <span class=\"kw\">소화기질환<\/span> <span class=\"kw\">대사질환<\/span> <span class=\"kw\">종양<\/span><\/td><td>소조기기疏調氣機 기반의 전신성·복합질환 대응 전략으로 적응증 확대<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">소조기기疏調氣機+기혈동조氣血同調<\/span> <span class=\"kw\">심신동치心身同治<\/span> <span class=\"kw\">일체양익一體兩翼+칼슘 도베실레이트(Calcium<\/span> <span class=\"kw\">Dobesilate)<\/span> <span class=\"kw\">계지복령캡슐 등<\/span><\/td><td>기체 조절을 중심으로 기존 치료와의 병용 가능성 탐색<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">Mer/STAT1/SOCS<\/span> <span class=\"kw\">NOX4/ROS/NF-κB<\/span> <span class=\"kw\">TGF-β1<\/span> <span class=\"kw\">대사체<\/span> <span class=\"kw\">CA724<\/span> <span class=\"kw\">HPLC 지표성분<\/span><\/td><td>염증·산화스트레스·대사 이상을 포괄하는 객관적 바이오마커 기반 검증<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">분자도킹<\/span> <span class=\"kw\">대사체학<\/span> <span class=\"kw\">데이터마이닝<\/span> <span class=\"kw\">HPLC<\/span><\/td><td>복합처방의 다중 표적 규명과 성분·품질 표준화를 결합한 R&amp;D 고도화<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2025~2026 최신연구)<\/h4><p class=\"row\">Mer/STAT1/SOCS 기반 신경염증 조절 기전 <b>2026, 李宗武 등<\/b><\/p><p>소조기기탕이 Mer·SOCS3를 증가시키고 JAK1·p-STAT1을 억제하여 미세아교세포의 M1/M2 분극을 조절함<\/p><p><b>의미<\/b> 미세아교세포 염증반응을 억제하고 혈액-뇌 장벽 및 뇌조직 손상을 완화하는 구체적 신경보호 기전 제시<\/p><p class=\"row\">소조기기탕의 내분비질환 임상 적용 <b>2025, 陳怡鑫 등<\/b><\/p><p>소간해울疏肝解鬱, 조보비신調補脾腎, 이기화혈理氣和血을 기반으로 무증상 갑상선기능저하증에 적용한 임상 경험을 제시<\/p><p><b>의미<\/b> 소조기기의 적용 범위를 갑상선 기능 이상 및 대사성 질환의 초기 단계로 확장할 가능성 제시<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">공개자료상 중국 제품이 확인되지 않은 처방이므로 국내 개발을 검토할 수 있으며, 소조기기탕은 문헌 근거(27편)가 있어 정서성 소화장애를 대상으로 한 제제화 연구를 먼저 시작할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 톈춘훙,톈위안,장잉제 등.“소조기기” 학술사상과 임상경험 정리 및 연구“疏調氣機”學術思想和臨床經驗整理與研究[J].윈난중의중약잡지,2013,34(12):3-5.<\/li><li class=\"ref\">[2] 장다바오,장이민,장춘옌 등.국의대사 장전의 소조기기탕을 활용한 중의 울병 치료에 관한 탐구國醫大師張震疏調氣機湯治療中醫鬱病探討[J].윈난중의중 약잡지,2021,42(12):12-14.<\/li><li class=\"ref\">[3] 리쭝우,첸차오,리충후이,저우샤오한,샤위보,두중융,뤄원.Mer/STAT1/SOCS를 통한 미세아교세포 염증 조절에 기반한 장전의 소조기기탕의 뇌출혈 랫드 신경 염증 개선 기전 탐구基於Mer/STAT1/SOCS調控小膠質細胞炎症探討張震疏調氣機湯改善腦出血大鼠神經炎症的機制[J].중약재中藥材,2026,(5):1306-1313.<\/li><li class=\"ref\">[4] 천이신,류찬셴,판이단,판위안.소조기기탕을 활용한 무증상 갑상선기능저하증 치료 의안 예시運用疏調氣機湯治療亞臨床甲狀腺功能減退症驗案舉隅[J].중 국민족민간의약中國民族民間醫藥,2025,34(1):69-72.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"시호10g","name":"시호","dose":"10g","base":"시호"},{"raw":"향부자10g","name":"향부자","dose":"10g","base":"향부자"},{"raw":"울금10g","name":"울금","dose":"10g","base":"울금"},{"raw":"단삼10g","name":"단삼","dose":"10g","base":"단삼"},{"raw":"천궁10g","name":"천궁","dose":"10g","base":"천궁"},{"raw":"지각10g","name":"지각","dose":"10g","base":"지각"},{"raw":"백작약12g","name":"백작약","dose":"12g","base":"백작약"},{"raw":"백출10g","name":"백출","dose":"10g","base":"백출"},{"raw":"음양곽15g","name":"음양곽","dose":"15g","base":"음양곽"},{"raw":"복령15g","name":"복령","dose":"15g","base":"복령"},{"raw":"박하6g","name":"박하","dose":"6g","base":"박하"},{"raw":"감초6g","name":"감초","dose":"6g","base":"감초"}],"notes":[],"핵심 효능":["간을 주체主體로 하여 억눌린 기운을 펴고 울체를 풀어줌(서간해울舒肝解鬱)","전신의 막힌 기기를 소통시켜 상하 승강을 회복함(소창기기疏暢氣機)","기와 혈을 함께 다스려 울체를 해소하고 혈맥을 통하게 함(이기화혈理氣和血)"],"주치증":["간울불서肝鬱不舒와 기기실조증氣機失調證, 정지내상情志內傷으로 인한 흉민, 우울抑鬱, 만성 위염, 폐렴, 갑상선기능저하증, 악성 종양, 심부전, 중풍 후유증, 수종, 우울증 등"],"연구 확장 영역":["정서적 스트레스에 수반되는 만성 심신 질환, 자율신경실조증, 대사성 및 면역계 질환, 전신 다기관 기기 울체 제반 질환"],"R&D 포인트":["시호, 향부자, 울금 등의 배합이 발휘하는 소간해울疏肝解鬱 및 기기조율 작용의 기전 분석","‘일체양익一體兩翼’ 이론에 따른 간, 비, 신 조화를 통한 전신 기혈 순환 개선","이기활혈理氣活血(단삼, 천궁) 및 산감화음酸甘化陰(백작약, 감초) 배합의 미세순환 조절 및 신경-내분비-면역 축의 상호작용 조절 기전 분석","현대 심신상관(Psychosomatic) 질환 모델에서의 항불안, 항우울 및 자율신경계 반응 조절의 유효성 검증"]},"modules":[{"name":"①서간해울 · 소창기기","hz":"舒肝解鬱 · 疏暢氣機","herbs":["시호","향부자","울금"],"role":"간의 소설 기능을 회복하고 전신 기기의 승강을 조율함"},{"name":"②양신건비 · 선후천고본","hz":"養腎健脾 · 先後天固本","herbs":["백출","음양곽","복령"],"role":"비의 운화와 신의 정원精元을 보양하여 기기 조절의 기반을 다짐"},{"name":"③이기화혈 · 기기조화","hz":"理氣和血 · 氣機調和","herbs":["단삼","천궁","지각","백작약"],"role":"기의 울체로 인해 발생한 혈의 체류를 풀고 상하 기기를 소통시킴"},{"name":"④조화제약","hz":"調和諸藥","herbs":["박하","감초"],"role":"약물의 편성을 조화시키고 오장육부의 기기를 원활히 함"}],"rd":[{"tag":"Neuroinflammation","title":"미세아교세포 분극 조절을 통한 신경염증 적응증","html":"<p>뇌출혈 랫드에서 Mer·SOCS3를 늘리고 JAK1·p-STAT1을 억제해 미세아교세포의 M1/M2 분극을 조절했다는 결과는 뇌출혈 모델에 한정된 것임<\/p><p>같은 기전이 울병鬱病(우울·불안) 모델에서도 작동하는지는 미검증 가설로 두고 확인하여 ‘정서 스트레스–신경염증’을 하나의 기전 축으로 연결<\/p><p><b>검증 설계<\/b> 만성 예측불가 스트레스(CUMS) 모델에서 행동 지표와 해마 미세아교세포 분극, Mer/STAT1/SOCS 발현을 함께 측정하고 SSRI를 대조약으로 설정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [3](2026, Mer/STAT1/SOCS), [2](2021, 울병 치료)<\/p>"},{"tag":"Thyroid & Metabolism","title":"무증상 갑상선기능저하증 등 초기 내분비 이상","html":"<p>무증상 갑상선기능저하증에 적용한 증례 보고가 있음<\/p><p>호르몬 보충 대상이 아닌 TSH 경도 상승 환자에서 피로·우울 증상과 TSH·갑상선 자가항체 변화를 보는 소규모 탐색 임상으로 시작하는 것이 현실적이며, 갑상선 호르몬 보충이 필요한 환자의 기존 진료·추적을 대체하지 않음<\/p><p><b>검증 설계<\/b> 단일기관 탐색 임상(12주)으로 TSH·FT4·TPOAb와 피로·우울 척도를 측정하여 효과 크기를 추정한 뒤 무작위 대조 설계로 확대<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [4](2025, 무증상 갑상선기능저하증 증례), 본문 「High-Impact」 ②<\/p>"},{"tag":"Microcirculation","title":"단삼·천궁 배합의 미세혈관 합병증 병용 치료","html":"<p>본문 연구 동향에서 칼슘 도베실레이트와의 병용과 NOX4/ROS/NF-κB 지표가 제시됨<\/p><p>당뇨망막병증 등 미세혈관 합병증에서 기존 혈관 보호제와 병용했을 때 산화스트레스 지표와 미세순환이 추가로 개선되는지 검증<\/p><p><b>검증 설계<\/b> 당뇨 랫드 망막에서 혈관 누출·NOX4·ROS를 측정하고, 임상에서는 칼슘 도베실레이트 단독 대 병용으로 비교<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 본문 「병용 전략」·「평가 지표」 표<\/p>"},{"tag":"Indication Focus & QC","title":"적응증 범위 축소와 지표성분 표준화","html":"<p>주치 범위가 우울증부터 심부전·종양까지 지나치게 넓어 개발 우선순위가 흐려짐<\/p><p><b>근거<\/b> 가 있는 신경염증(뇌출혈)·울병·무증상 갑상선기능저하증 세 축으로 좁히되 근거가 가장 앞선 신경염증·울병 축을 1순위 적응증으로 정하고(무증상 갑상선기능저하증은 후순위), 12종 약재 복합처방의 품질은 HPLC 지표성분으로 고정하는 것이 선행 과제<\/p><p><b>검증 설계<\/b> 1순위 적응증(울병)에 맞춰 전임상 패키지(효력·독성·품질)를 구성<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> 본문 주치증, 「방법론」(HPLC 지표성분) 표<\/p>"}],"logic":[{"n":"1","title":"서간해울과 기기조달","body":"간의 소설 기능을 회복하고 전신 기기의 승강을 조율함"},{"n":"2","title":"선후천고본과 일체양익","body":"비의 운화와 신의 정원을 보양하여 기기 조절의 기반을 다짐"},{"n":"3","title":"활혈거어와 산감화음","body":"혈의 체류를 풀고 상하 기기와 미세순환을 소통시킴"},{"n":"4","title":"종합적 기기 조율과 심신동치","body":"행기, 활혈, 보익의 유기적 결합을 통해 정서적 스트레스와 전신 다기관 울체를 제어함"}],"field":1,"pages":[27,32],"evidence":"연구 축적 (논문 27편)","product":"—","status":"확인된 제품·특허 없음","s":["1-3","소조기기탕","疏調氣機湯","","장전","張震","간의 소설 기능을 회복하고 비신脾腎을 조화롭게 다스려 전신 기기의 울체를 풀고 기혈의 조화를 도모하는 처방","시호10g 향부자10g 울금10g 단삼10g 천궁10g 지각10g 백작약12g 백출10g 음양곽15g 복령15g 박하6g 감초6g","","핵심 효능 간을 주체主體로 하여 억눌린 기운을 펴고 울체를 풀어줌(서간해울舒肝解鬱) 전신의 막힌 기기를 소통시켜 상하 승강을 회복함(소창기기疏暢氣機) 기와 혈을 함께 다스려 울체를 해소하고 혈맥을 통하게 함(이기화혈理氣和血)","주치증 간울불서肝鬱不舒와 기기실조증氣機失調證, 정지내상情志內傷으로 인한 흉민, 우울抑鬱, 만성 위염, 폐렴, 갑상선기능저하증, 악성 종양, 심부전, 중풍 후유증, 수종, 우울증 등","연구 확장 영역 정서적 스트레스에 수반되는 만성 심신 질환, 자율신경실조증, 대사성 및 면역계 질환, 전신 다기관 기기 울체 제반 질환","R&D 포인트 시호, 향부자, 울금 등의 배합이 발휘하는 소간해울疏肝解鬱 및 기기조율 작용의 기전 분석 ‘일체양익一體兩翼’ 이론에 따른 간, 비, 신 조화를 통한 전신 기혈 순환 개선 이기활혈理氣活血(단삼, 천궁) 및 산감화음酸甘化陰(백작약, 감초) 배합의 미세순환 조절 및 신경-내분비-면역 축의 상호작용 조절 기전 분석 현대 심신상관(Psychosomatic) 질환 모델에서의 항불안, 항우울 및 자율신경계 반응 조절의 유효성 검증","①서간해울 · 소창기기 舒肝解鬱 · 疏暢氣機 시호 향부자 울금 간의 소설 기능을 회복하고 전신 기기의 승강을 조율함","②양신건비 · 선후천고본 養腎健脾 · 先後天固本 백출 음양곽 복령 비의 운화와 신의 정원精元을 보양하여 기기 조절의 기반을 다짐","③이기화혈 · 기기조화 理氣和血 · 氣機調和 단삼 천궁 지각 백작약 기의 울체로 인해 발생한 혈의 체류를 풀고 상하 기기를 소통시킴","④조화제약 調和諸藥 박하 감초 약물의 편성을 조화시키고 오장육부의 기기를 원활히 함","서간해울과 기기조달 간의 소설 기능을 회복하고 전신 기기의 승강을 조율함","선후천고본과 일체양익 비의 운화와 신의 정원을 보양하여 기기 조절의 기반을 다짐","활혈거어와 산감화음 혈의 체류를 풀고 상하 기기와 미세순환을 소통시킴","종합적 기기 조율과 심신동치 행기, 활혈, 보익의 유기적 결합을 통해 정서적 스트레스와 전신 다기관 울체를 제어함","Neuroinflammation 미세아교세포 분극 조절을 통한 신경염증 적응증 뇌출혈 랫드에서 Mer·SOCS3를 늘리고 JAK1·p-STAT1을 억제해 미세아교세포의 M1/M2 분극을 조절했다는 결과는 뇌출혈 모델에 한정된 것임 같은 기전이 울병鬱病(우울·불안) 모델에서도 작동하는지는 미검증 가설로 두고 확인하여 ‘정서 스트레스–신경염증’을 하나의 기전 축으로 연결 검증 설계 만성 예측불가 스트레스(CUMS) 모델에서 행동 지표와 해마 미세아교세포 분극, Mer/STAT1/SOCS 발현을 함께 측정하고 SSRI를 대조약으로 설정 근거 직접 연구 근거 참고문헌 [3](2026, Mer/STAT1/SOCS), [2](2021, 울병 치료)","Thyroid & Metabolism 무증상 갑상선기능저하증 등 초기 내분비 이상 무증상 갑상선기능저하증에 적용한 증례 보고가 있음 호르몬 보충 대상이 아닌 TSH 경도 상승 환자에서 피로·우울 증상과 TSH·갑상선 자가항체 변화를 보는 소규모 탐색 임상으로 시작하는 것이 현실적이며, 갑상선 호르몬 보충이 필요한 환자의 기존 진료·추적을 대체하지 않음 검증 설계 단일기관 탐색 임상(12주)으로 TSH·FT4·TPOAb와 피로·우울 척도를 측정하여 효과 크기를 추정한 뒤 무작위 대조 설계로 확대 근거 임상 경험 보고 참고문헌 [4](2025, 무증상 갑상선기능저하증 증례), 본문 「High-Impact」 ②","Microcirculation 단삼·천궁 배합의 미세혈관 합병증 병용 치료 본문 연구 동향에서 칼슘 도베실레이트와의 병용과 NOX4/ROS/NF-κB 지표가 제시됨 당뇨망막병증 등 미세혈관 합병증에서 기존 혈관 보호제와 병용했을 때 산화스트레스 지표와 미세순환이 추가로 개선되는지 검증 검증 설계 당뇨 랫드 망막에서 혈관 누출·NOX4·ROS를 측정하고, 임상에서는 칼슘 도베실레이트 단독 대 병용으로 비교 근거 직접 연구 근거 본문 「병용 전략」·「평가 지표」 표","Indication Focus & QC 적응증 범위 축소와 지표성분 표준화 주치 범위가 우울증부터 심부전·종양까지 지나치게 넓어 개발 우선순위가 흐려짐 근거 가 있는 신경염증(뇌출혈)·울병·무증상 갑상선기능저하증 세 축으로 좁히되 근거가 가장 앞선 신경염증·울병 축을 1순위 적응증으로 정하고(무증상 갑상선기능저하증은 후순위), 12종 약재 복합처방의 품질은 HPLC 지표성분으로 고정하는 것이 선행 과제 검증 설계 1순위 적응증(울병)에 맞춰 전임상 패키지(효력·독성·품질)를 구성 근거 신규 연구가설 본문 주치증, 「방법론」(HPLC 지표성분) 표"],"ss":{"composition":"그림 1-3 소조기기탕疏調氣機湯의 모듈 구성 ①서간해울舒肝解鬱 및 소창기기疏暢氣機 모듈 — 간의 소설 기능을 회복하고 전신 기기의 승강을 조율함 시호, 향부자, 울금 : 시호는 승발청양升發淸陽하고 소해간울疏解肝鬱하여 군약으로 작용함. 향부자는 간울을 풀고 간의 거슬러 오르는 기세를 다스리며, 울금은 기분과 혈분을 두루 소통시켜 행기해울行氣解鬱함. 이 약물들은 시호의 서간해울 및 소창기기 작용을 강력하게 보조함 ②양신건비養腎健脾 및 선후천고본先後天固本 모듈 — 비의 운화와 신의 정원精元을 보양하여 기기 조절의 기반을 다짐 백출, 음양곽, 복령 : 백출은 비를 보하고 조습하며, 음양곽은 온보신양溫補腎陽하고 정수를 북돋움. 복령은 비를 보하고 습을 삼출함. 이 약물들은 선천과 후천의 본을 보호하여 소조疏調 치법의 목적을 완성할 수 있도록 돕는 신약의 역할을 수행함 ③이기화혈理氣和血 및 기기조화氣機調和 모듈 — 기의 울체로 인해 발생한 혈의 체류를 풀고 상하 기기를 소통시킴 단삼, 천궁, 지각, 백작약 : 단삼과 천궁은 활혈거어活血祛瘀하며, 지각은 이기관중理氣寬中하고 시호와 배오되어 일승일강一升一降으로 승청강탁升淸降濁함. 백작약은 감초와 배오되어 산감화음酸甘化陰하며 유간양혈완급柔肝養血緩急함 ④조화제약調和諸藥 모듈 — 약물의 편성을 조화시키고 오장육부의 기기를 원활히 함 박하, 감초 : 박하는 행기개울行氣開鬱하고, 감초는 보비익기補脾益氣하고 제반 약물의 성질을 조화롭게 융화시킴","master":"①병기 인식 — 기기실조氣機失調와 ‘일체양익一體兩翼’의 장부 연계 인체의 생리적 상층과 하층, 오장육부의 기능은 기의 승강출입 운동에 의존하며, 그 중심 축은 간의 소설 기능에 있음 정지내상이나 현대적 생활환경의 스트레스는 간의 소설실직疏泄失職을 유발하여 기기울체氣機鬱滯를 일으키고, 이는 다시 비토를 억누르고 신의 정원을 손상시켜 전신 다기관의 기능 장애로 이어짐 ②치료의 핵심 — ‘간이 주체이고, 비신은 양측 날개以肝爲主體, 脾腎爲兩翼’라는 일체양익의 철학 소조기기疏調氣機의 핵심은 간기肝氣의 서전舒展에 있으며, 이를 뒷받침하기 위해 후천의 본인 비와 선천의 본인 신을 양 날개로 삼아 전신 기혈의 균형을 도모함 단순한 대증 치료를 지양하고, 기의 울체와 혈의 어지러움을 동시에 다스려 질병의 근본 고리를 해체함 ③임상적 활용 및 변증 가감 소조기기탕을 기본방으로 하여 환자의 세부 임상 양상에 유연하게 대응함 기허氣虛할 때 : 황기, 태자삼, 당삼, 산약, 대조 가미 혈허血虛할 때 : 당귀, 지황, 하수오, 아교, 계원 가미 음허陰虛할 때 : 사삼, 현삼, 맥문동, 황정, 여정자, 구기자 가미 양허陽虛할 때 : 부편, 육계, 녹각상, 파극천, 보골지, 익지인 가미 허열虛熱이 있을 때 : 지모, 황백, 지골피 가미 혈열血熱이 있을 때 : 생지, 목단피, 자초 가미 습열濕熱이 있을 때 : 인진호, 의이인, 통초 가미 열독熱毒이 있을 때 : 은화, 연교, 포공영, 패장초 가미 위기상역胃氣上逆이 있을 때 : 지실로 교체, 법반하, 대자석 가미 혈어血瘀가 있을 때 : 도인, 홍화 가미","rd":"","evidence":"①연구 규모 Total Papers(15yrs) Recent Focus(5yrs) 총 27 편 발표 최근 5 년간 21편 발표 ②연구 키워드로 본 R&D 가이던스(최근 5개년 분석) 구분 핵심 키워드 R&D 인사이트 주치증 신경염증 뇌혈관질환 갑상선질환 소화기질환 대사질환 종양 소조기기疏調氣機 기반의 전신성·복합질환 대응 전략으로 적응증 확대 병용 전략 소조기기疏調氣機+기혈동조氣血同調 심신동치心身同治 일체양익一體兩翼+칼슘 도베실레이트(Calcium Dobesilate) 계지복령캡슐 등 기체 조절을 중심으로 기존 치료와의 병용 가능성 탐색 평가 지표 Mer/STAT1/SOCS NOX4/ROS/NF-κB TGF-β1 대사체 CA724 HPLC 지표성분 염증·산화스트레스·대사 이상을 포괄하는 객관적 바이오마커 기반 검증 방법론 네트워크 약리학 분자도킹 대사체학 데이터마이닝 HPLC 복합처방의 다중 표적 규명과 성분·품질 표준화를 결합한 R&D 고도화 ③High-Impact 연구 하이라이트(2025~2026 최신연구) Mer/STAT1/SOCS 기반 신경염증 조절 기전 2026, 李宗武 등 소조기기탕이 Mer·SOCS3를 증가시키고 JAK1·p-STAT1을 억제하여 미세아교세포의 M1/M2 분극을 조절함 의미 미세아교세포 염증반응을 억제하고 혈액-뇌 장벽 및 뇌조직 손상을 완화하는 구체적 신경보호 기전 제시 소조기기탕의 내분비질환 임상 적용 2025, 陳怡鑫 등 소간해울疏肝解鬱, 조보비신調補脾腎, 이기화혈理氣和血을 기반으로 무증상 갑상선기능저하증에 적용한 임상 경험을 제시 의미 소조기기의 적용 범위를 갑상선 기능 이상 및 대사성 질환의 초기 단계로 확장할 가능성 제시","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 공개자료상 중국 제품이 확인되지 않은 처방이므로 국내 개발을 검토할 수 있으며, 소조기기탕은 문헌 근거(27편)가 있어 정서성 소화장애를 대상으로 한 제제화 연구를 먼저 시작할 수 있음 참고문헌 [1] 톈춘훙,톈위안,장잉제 등.“소조기기” 학술사상과 임상경험 정리 및 연구“疏調氣機”學術思想和臨床經驗整理與研究[J].윈난중의중약잡지,2013,34(12):3-5. [2] 장다바오,장이민,장춘옌 등.국의대사 장전의 소조기기탕을 활용한 중의 울병 치료에 관한 탐구國醫大師張震疏調氣機湯治療中醫鬱病探討[J].윈난중의중 약잡지,2021,42(12):12-14. [3] 리쭝우,첸차오,리충후이,저우샤오한,샤위보,두중융,뤄원.Mer/STAT1/SOCS를 통한 미세아교세포 염증 조절에 기반한 장전의 소조기기탕의 뇌출혈 랫드 신경 염증 개선 기전 탐구基於Mer/STAT1/SOCS調控小膠質細胞炎症探討張震疏調氣機湯改善腦出血大鼠神經炎症的機制[J].중약재中藥材,2026,(5):1306-1313. [4] 천이신,류찬셴,판이단,판위안.소조기기탕을 활용한 무증상 갑상선기능저하증 치료 의안 예시運用疏調氣機湯治療亞臨床甲狀腺功能減退症驗案舉隅[J].중 국민족민간의약中國民族民間醫藥,2025,34(1):69-72."}},{"id":"1-4","ko":"화간해독탕","hz":"化肝解毒湯","alias":"","master_ko":"저우중잉","master_hz":"周仲瑛","tagline":"습열어독濕熱瘀毒을 제거하여 만성 B형간염, 간암을 치료하는 핵심 처방","meta":{"주요 적응증":"만성 B형간염, B형간염 관련 간암","확인된 연구자료 유형":"경험 보고","제형·제품화":"관련 특허(소멸)"},"page":33,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-4 화간해독탕化肝解毒湯의 모듈 구성<\/p><h4>①청화해독淸化解毒 모듈 — 간·담경의 습열을 식히고 독소를 풀어냄<\/h4><p><b>호장<\/b>: 차가운 성질과 쓴맛으로 간·담경에 작용하여, 열을 내리고 습을 말리며 간락肝絡의 어혈과 독소를 강력하게 풀어냄<\/p><p><b>평지목<\/b>: 간에 울체된 습열을 소변으로 배출시키고 어혈을 없애며, 기운을 소통시켜 해독 작용을 도움<\/p><p><b>반지련<\/b>: 열독을 식히고 혈분에 잠복한 어혈을 제거하며, 간 조직의 악성 염증과 뭉친 독기를 풀어냄<\/p><h4>②분소리습分消利濕 모듈 — 습열성 염증을 분산시키고 해독을 지원함<\/h4><p><b>토복령<\/b>: 간경으로 들어가 탁한 습열과 어독을 분소分消하여 독소를 제거<\/p><p><b>수분초<\/b>: 간·담의 열독을 집중적으로 내려 습열성 황달과 염증을 진정시키고, 청화해독 모듈의 작용을 적극 지원함<\/p><h4>③조양화중調養和中 모듈 — 간, 비장을 보양하고 위장을 보호함<\/h4><p><b>흑요두<\/b>: 비장과 신장의 기운을 함께 북돋아 습열을 분산시키고, 간에 쌓인 해로운 독성을 완화함<\/p><p><b>감초<\/b>: 중초의 기운을 다독여 쓴 약으로 인한 위장 손상을 막고, 모든 약재의 독성을 해독·조화시킴<\/p><h4>④통락행어通絡行瘀 모듈 — 혈분을 식히고 약효를 간으로 집중시킴<\/h4><p><b>관중<\/b>: 간경의 혈을 식혀주고 어혈을 풀어주어, 간 내부의 혈액순환 장애와 염증성 통증을 완화함<\/p><p><b>편강황<\/b>: 따뜻하고 매운 성질로 뭉친 기혈을 뚫어주어, 찬 약재들이 혈액을 정체시키지 않도록 도우며, 약을 간으로 정확히 유인<\/p>"},{"k":"master","t":"저우중잉의 만성 B형간염, 간암 치료","html":"<h4>①습열어독濕熱瘀毒이 B형간염, 간암의 핵심 병리 기초<\/h4><p>만성 B형간염과 간암은 병의 진행이 완만하고 경과가 길어, 역독疫毒이 간체肝體에 침습하여 깊은 혈분血分으로 직입直入함<\/p><p>간은 혈을 저장하고 소설疏泄하는 장부인데, 역독이 오래 머물면 기혈의 순환을 막아 혈어血瘀가 발생하고, 어혈이 오래되어 열을 더하고 열과 어혈이 결합하여 어독瘀毒이 되는 병리적 악순환을 형성함<\/p><h4>②청화습열淸化濕熱, 해독화어解毒化瘀의 치료 법칙<\/h4><p>간락肝絡 내에 어혈과 열독이 오랫동안 엉켜 결합하면, 암독癌毒으로 발전하고, 이 어독瘀毒은 간을 손상시켜 간암으로 진행됨<\/p><p>따라서 대사는 단순한 소간疏肝에 그치지 않고, 청화습열淸化濕熱과 해독화어解毒化瘀를 치료의 기본으로 삼아, 화간해독化肝解毒 치료법을 확립함<\/p><h4>③거사즉우부정祛邪即寓扶正 — 사기를 몰아내는 것이 곧 정기를 보하는 것<\/h4><p>만성 B형간염 및 간암은 사기邪氣가 왕성하고 정기正氣가 약해진 사성정허邪盛正虛의 상태이나, 병의 전반적인 병기 진행상 사실邪實이 주된 모순임<\/p><p>보약을 남용하기보다 처방의 거사祛邪 작용을 통해 간락의 어독을 제거하면, 간의 소설 기능이 회복되어 스스로 정기를 회복함<\/p><p>다만 회복 및 공고 단계에서는 간·비·신을 보양하는 약재(황기·백출·생지황 등)를 적절히 배합함<\/p><h4>④현대 약리 및 임상 지표 검증<\/h4><p><b>항바이러스 및 간 보호<\/b>: 호장, 반지련은 B형간염 바이러스(HBV) 항원 및 HBV-DNA를 억제하고 세포 면역을 높인다는 실험 보고가 있음<\/p><p><b>항간섬유화 및 항암 기전<\/b>: 단삼, 강황, 황기, 감초 등은 간성상세포(HSC)의 증식과 활성화를 막아 간섬유화 진행을 억제하고 간세포 손상과 염증 반응을 줄이는 것으로 보고됨<\/p><p><b>임상 성과<\/b>: 전통 중의학의 열熱·독毒·어瘀 관점과 현대의 항염·항바이러스·항섬유화 기전을 결합하여, 간기능 지표 (ALT/AST) 정상화 및 바이러스 음전(HBsAg/HBV-DNA 음성화)에서 치료효과를 보고함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>이 처방 자체의 제품은 없음. 대사가 개발한 만성 B형간염 복방 과립(간득강과립肝得康顆粒) 특허가 호장·반지련· 수분초를 공유하는 관련 조성이며, 2024년 연차료 미납으로 권리가 소멸됨[3]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">관련 특허가 소멸되어 권리 부담은 없지만 공개 문헌이므로 동일 조성의 국내 특허는 어렵고, 항바이러스제 병용 시 간섬유화 개선 등 용도·병용 발명으로 접근해야 함. 국내 공정서(약전·규격집)에 없는 수분초·평지목이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 류춘레이,자오무쿤,청룽둬. 저우중잉의 화간해독탕을 이용한 B형간염 치료 경험周仲瑛用化肝解毒湯治療乙型肝炎經驗[J].의학연구 및 교육醫學研究與教育,2010,27(1):63-64.<\/li><li class=\"ref\">[2] 관위제,스쥔,위안팡,등.“어독”에 기반한 화간해독탕의 B형간염 연관 원발성 간암 치료 효과 및 기전 고찰基於“瘀毒”探析化肝解毒湯治療乙肝相關性原發性肝癌[J].윈난중의약잡지雲南中醫中藥雜志,2025,46(8):16-19.<\/li><li class=\"ref\">[3] 저우중잉周仲瑛 등.만성 B형 바이러스성 간염을 치료하는 복방제제 및 제조방법一種治療慢性乙型病毒性肝炎的複方製劑及其製備方法:CN100441210C [P/OL].<a href=\"https://patents.google.com/patent/CN100441210C.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN100441210C.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"호장15g","name":"호장","dose":"15g","base":"호장"},{"raw":"평지목平地木15g","name":"평지목平地木","dose":"15g","base":"평지목"},{"raw":"반지련15g","name":"반지련","dose":"15g","base":"반지련"},{"raw":"토복령20g","name":"토복령","dose":"20g","base":"토복령"},{"raw":"수분초垂盆草20g","name":"수분초垂盆草","dose":"20g","base":"수분초"},{"raw":"관중10g","name":"관중","dose":"10g","base":"관중"},{"raw":"片강황10g","name":"片강황","dose":"10g","base":"강황"},{"raw":"흑요두黑料豆10g","name":"흑요두黑料豆","dose":"10g","base":"흑요두"},{"raw":"生감초3g","name":"生감초","dose":"3g","base":"감초"}],"notes":[],"핵심 효능":["열을 내리고 습을 제거(청열화습淸熱化濕)","간에 쌓인 독소를 제거(화해간독化解肝毒)","혈분을 식히고 혈액순환을 원활히 함(양혈활혈涼血活血)"],"주치증":["만성 B형간염, 만성 B형간염 관련 간암의 습열어독증濕熱瘀毒證"],"연구 확장 영역":["만성 HBV 감염자, 간섬유화 및 간경변증, 비알코올성 지방간, 난치성 재발성 황달, 간암 수술/TACE 후 잔여 염증 및 재발 방지 관리"],"R&D 포인트":["HBV-DNA 복제 경로를 차단하고 염증성 사이토카인 연쇄반응을 조절하여 잔여 염증 및 바이러스 활성 완화","항산화 효소 시스템 활성화와 세포막 안정화를 통해 간세포 괴사 및 손상을 예방하고 담즙 분비 촉진","TGF-β1/Smad 신호전달 경로를 억제하여 간성상세포의 활성을 제어하고 콜라겐 축적을 차단하여 간섬유화 및 간경화 진행을 억제하는 치료 소재"]},"modules":[{"name":"①청화해독","hz":"淸化解毒","herbs":["호장","평지목","반지련"],"role":"간·담경의 습열을 식히고 독소를 풀어냄"},{"name":"②분소리습","hz":"分消利濕","herbs":["토복령","수분초"],"role":"습열성 염증을 분산시키고 해독을 지원함"},{"name":"③조양화중","hz":"調養和中","herbs":["흑요두","감초"],"role":"간, 비장을 보양하고 위장을 보호함"},{"name":"④통락행어","hz":"通絡行瘀","herbs":["관중","편강황"],"role":"혈분을 식히고 약효를 간으로 집중시킴"}],"rd":[{"tag":"Antiviral Adjunct","title":"핵산유사체 병용 시 HBsAg 감소 보조 효과","html":"<p>단독 항바이러스 신약보다는 엔테카비르 등 표준 핵산유사체를 유지하는 병용 연구가 현실적임<\/p><p>HBV-DNA 억제(항바이러스 효과)와 HBsAg 정량 감소(면역 관해 지표)를 구분해 평가하고 치료 상태(치료 경험 없음·핵산유사체 유지 중)로 층화해야 함. 호장 등 개별 약재의 항바이러스 활성은 성분 수준에서 먼저 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](경험 보고), 주치증(습열어독증))<\/p>"},{"tag":"Hepatoprotection","title":"수분초·평지목의 간세포 보호 효과 검증","html":"<p>수분초垂盆草는 중국에서 ALT 강하 목적으로 널리 쓰이는 약재임<\/p><p>처방 전체와 수분초 제외 처방을 비교하여 간효소(ALT·AST) 정상화에 대한 기여도를 확인하는 구성 약재 제거(拆方) 연구로 핵심 약재를 좁힘 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 2 「청화해독과 해독화어」)<\/p>"},{"tag":"Anti-fibrosis","title":"간섬유화 진행 억제와 비침습 지표 연계","html":"<p>CCl4 또는 담관결찰 섬유화 모델에서 간성상세포 활성(α-SMA)과 콜라겐 침착을 평가함<\/p><p>임상에서는 간경도(FibroScan)와 혈청 섬유화 지표(APRI·FIB-4)로 연결하여 만성 간염–간경변 이행 억제 효과를 확인 (근거 유형: 신규 연구가설 | 근거: 본문 「연구 확장 영역」(간섬유화·간경변), R&amp;D 포인트)<\/p>"},{"tag":"Post-HCC Care","title":"B형간염 관련 간암 치료 후 재발 억제 보조(후속 연구가설)","html":"<p>‘어독瘀毒’ 관점의 간암 치료 고찰은 병기 해석이며 재발 예방 효과를 보인 임상 근거는 아님<\/p><p>표준 항암·감시 치료를 그대로 유지한 상태에서 간절제·TACE 이후 투여 환자의 무재발 생존을 후향적 코호트로 탐색하는 후속 연구가설로 둠(표준 치료를 대체하지 않음) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2025, 어독 기반 간암 치료 고찰))<\/p>"}],"logic":[{"n":"1","title":"습열어독濕熱瘀毒","body":"독소가 간을 깊이 침습하여 악성 병리로 발전"},{"n":"2","title":"청화해독淸化解毒과 해독화어解毒化瘀","body":"염증과 어혈을 동시에 풀어줌"},{"n":"3","title":"거사즉우부정祛邪即寓扶正","body":"사기를 몰아내는 것이 곧 정기를 살리는 길"},{"n":"4","title":"임상 지표 검증","body":"전통 중의학과 현대 바이오마커의 융합"}],"field":1,"pages":[33,37],"evidence":"경험 보고","product":"관련 특허(소멸)","status":"특허 출원 이력","s":["1-4","화간해독탕","化肝解毒湯","","저우중잉","周仲瑛","습열어독濕熱瘀毒을 제거하여 만성 B형간염, 간암을 치료하는 핵심 처방","호장15g 평지목平地木15g 반지련15g 토복령20g 수분초垂盆草20g 관중10g 片강황10g 흑요두黑料豆10g 生감초3g","","핵심 효능 열을 내리고 습을 제거(청열화습淸熱化濕) 간에 쌓인 독소를 제거(화해간독化解肝毒) 혈분을 식히고 혈액순환을 원활히 함(양혈활혈涼血活血)","주치증 만성 B형간염, 만성 B형간염 관련 간암의 습열어독증濕熱瘀毒證","연구 확장 영역 만성 HBV 감염자, 간섬유화 및 간경변증, 비알코올성 지방간, 난치성 재발성 황달, 간암 수술/TACE 후 잔여 염증 및 재발 방지 관리","R&D 포인트 HBV-DNA 복제 경로를 차단하고 염증성 사이토카인 연쇄반응을 조절하여 잔여 염증 및 바이러스 활성 완화 항산화 효소 시스템 활성화와 세포막 안정화를 통해 간세포 괴사 및 손상을 예방하고 담즙 분비 촉진 TGF-β1/Smad 신호전달 경로를 억제하여 간성상세포의 활성을 제어하고 콜라겐 축적을 차단하여 간섬유화 및 간경화 진행을 억제하는 치료 소재","①청화해독 淸化解毒 호장 평지목 반지련 간·담경의 습열을 식히고 독소를 풀어냄","②분소리습 分消利濕 토복령 수분초 습열성 염증을 분산시키고 해독을 지원함","③조양화중 調養和中 흑요두 감초 간, 비장을 보양하고 위장을 보호함","④통락행어 通絡行瘀 관중 편강황 혈분을 식히고 약효를 간으로 집중시킴","습열어독濕熱瘀毒 독소가 간을 깊이 침습하여 악성 병리로 발전","청화해독淸化解毒과 해독화어解毒化瘀 염증과 어혈을 동시에 풀어줌","거사즉우부정祛邪即寓扶正 사기를 몰아내는 것이 곧 정기를 살리는 길","임상 지표 검증 전통 중의학과 현대 바이오마커의 융합","Antiviral Adjunct 핵산유사체 병용 시 HBsAg 감소 보조 효과 단독 항바이러스 신약보다는 엔테카비르 등 표준 핵산유사체를 유지하는 병용 연구가 현실적임 HBV-DNA 억제(항바이러스 효과)와 HBsAg 정량 감소(면역 관해 지표)를 구분해 평가하고 치료 상태(치료 경험 없음·핵산유사체 유지 중)로 층화해야 함. 호장 등 개별 약재의 항바이러스 활성은 성분 수준에서 먼저 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](경험 보고), 주치증(습열어독증))","Hepatoprotection 수분초·평지목의 간세포 보호 효과 검증 수분초垂盆草는 중국에서 ALT 강하 목적으로 널리 쓰이는 약재임 처방 전체와 수분초 제외 처방을 비교하여 간효소(ALT·AST) 정상화에 대한 기여도를 확인하는 구성 약재 제거(拆方) 연구로 핵심 약재를 좁힘 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 2 「청화해독과 해독화어」)","Anti-fibrosis 간섬유화 진행 억제와 비침습 지표 연계 CCl4 또는 담관결찰 섬유화 모델에서 간성상세포 활성(α-SMA)과 콜라겐 침착을 평가함 임상에서는 간경도(FibroScan)와 혈청 섬유화 지표(APRI·FIB-4)로 연결하여 만성 간염–간경변 이행 억제 효과를 확인 (근거 유형: 신규 연구가설 | 근거: 본문 「연구 확장 영역」(간섬유화·간경변), R&D 포인트)","Post-HCC Care B형간염 관련 간암 치료 후 재발 억제 보조(후속 연구가설) ‘어독瘀毒’ 관점의 간암 치료 고찰은 병기 해석이며 재발 예방 효과를 보인 임상 근거는 아님 표준 항암·감시 치료를 그대로 유지한 상태에서 간절제·TACE 이후 투여 환자의 무재발 생존을 후향적 코호트로 탐색하는 후속 연구가설로 둠(표준 치료를 대체하지 않음) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2025, 어독 기반 간암 치료 고찰))"],"ss":{"composition":"그림 1-4 화간해독탕化肝解毒湯의 모듈 구성 ①청화해독淸化解毒 모듈 — 간·담경의 습열을 식히고 독소를 풀어냄 호장 : 차가운 성질과 쓴맛으로 간·담경에 작용하여, 열을 내리고 습을 말리며 간락肝絡의 어혈과 독소를 강력하게 풀어냄 평지목 : 간에 울체된 습열을 소변으로 배출시키고 어혈을 없애며, 기운을 소통시켜 해독 작용을 도움 반지련 : 열독을 식히고 혈분에 잠복한 어혈을 제거하며, 간 조직의 악성 염증과 뭉친 독기를 풀어냄 ②분소리습分消利濕 모듈 — 습열성 염증을 분산시키고 해독을 지원함 토복령 : 간경으로 들어가 탁한 습열과 어독을 분소分消하여 독소를 제거 수분초 : 간·담의 열독을 집중적으로 내려 습열성 황달과 염증을 진정시키고, 청화해독 모듈의 작용을 적극 지원함 ③조양화중調養和中 모듈 — 간, 비장을 보양하고 위장을 보호함 흑요두 : 비장과 신장의 기운을 함께 북돋아 습열을 분산시키고, 간에 쌓인 해로운 독성을 완화함 감초 : 중초의 기운을 다독여 쓴 약으로 인한 위장 손상을 막고, 모든 약재의 독성을 해독·조화시킴 ④통락행어通絡行瘀 모듈 — 혈분을 식히고 약효를 간으로 집중시킴 관중 : 간경의 혈을 식혀주고 어혈을 풀어주어, 간 내부의 혈액순환 장애와 염증성 통증을 완화함 편강황 : 따뜻하고 매운 성질로 뭉친 기혈을 뚫어주어, 찬 약재들이 혈액을 정체시키지 않도록 도우며, 약을 간으로 정확히 유인","master":"①습열어독濕熱瘀毒이 B형간염, 간암의 핵심 병리 기초 만성 B형간염과 간암은 병의 진행이 완만하고 경과가 길어, 역독疫毒이 간체肝體에 침습하여 깊은 혈분血分으로 직입直入함 간은 혈을 저장하고 소설疏泄하는 장부인데, 역독이 오래 머물면 기혈의 순환을 막아 혈어血瘀가 발생하고, 어혈이 오래되어 열을 더하고 열과 어혈이 결합하여 어독瘀毒이 되는 병리적 악순환을 형성함 ②청화습열淸化濕熱, 해독화어解毒化瘀의 치료 법칙 간락肝絡 내에 어혈과 열독이 오랫동안 엉켜 결합하면, 암독癌毒으로 발전하고, 이 어독瘀毒은 간을 손상시켜 간암으로 진행됨 따라서 대사는 단순한 소간疏肝에 그치지 않고, 청화습열淸化濕熱과 해독화어解毒化瘀를 치료의 기본으로 삼아, 화간해독化肝解毒 치료법을 확립함 ③거사즉우부정祛邪即寓扶正 — 사기를 몰아내는 것이 곧 정기를 보하는 것 만성 B형간염 및 간암은 사기邪氣가 왕성하고 정기正氣가 약해진 사성정허邪盛正虛의 상태이나, 병의 전반적인 병기 진행상 사실邪實이 주된 모순임 보약을 남용하기보다 처방의 거사祛邪 작용을 통해 간락의 어독을 제거하면, 간의 소설 기능이 회복되어 스스로 정기를 회복함 다만 회복 및 공고 단계에서는 간·비·신을 보양하는 약재(황기·백출·생지황 등)를 적절히 배합함 ④현대 약리 및 임상 지표 검증 항바이러스 및 간 보호 : 호장, 반지련은 B형간염 바이러스(HBV) 항원 및 HBV-DNA를 억제하고 세포 면역을 높인다는 실험 보고가 있음 항간섬유화 및 항암 기전 : 단삼, 강황, 황기, 감초 등은 간성상세포(HSC)의 증식과 활성화를 막아 간섬유화 진행을 억제하고 간세포 손상과 염증 반응을 줄이는 것으로 보고됨 임상 성과 : 전통 중의학의 열熱·독毒·어瘀 관점과 현대의 항염·항바이러스·항섬유화 기전을 결합하여, 간기능 지표 (ALT/AST) 정상화 및 바이러스 음전(HBsAg/HBV-DNA 음성화)에서 치료효과를 보고함","rd":"","china":"중국 제품화 현황 이 처방 자체의 제품은 없음. 대사가 개발한 만성 B형간염 복방 과립(간득강과립肝得康顆粒) 특허가 호장·반지련· 수분초를 공유하는 관련 조성이며, 2024년 연차료 미납으로 권리가 소멸됨[3] 시사점 관련 특허가 소멸되어 권리 부담은 없지만 공개 문헌이므로 동일 조성의 국내 특허는 어렵고, 항바이러스제 병용 시 간섬유화 개선 등 용도·병용 발명으로 접근해야 함. 국내 공정서(약전·규격집)에 없는 수분초·평지목이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 류춘레이,자오무쿤,청룽둬. 저우중잉의 화간해독탕을 이용한 B형간염 치료 경험周仲瑛用化肝解毒湯治療乙型肝炎經驗[J].의학연구 및 교육醫學研究與教育,2010,27(1):63-64. [2] 관위제,스쥔,위안팡,등.“어독”에 기반한 화간해독탕의 B형간염 연관 원발성 간암 치료 효과 및 기전 고찰基於“瘀毒”探析化肝解毒湯治療乙肝相關性原發性肝癌[J].윈난중의약잡지雲南中醫中藥雜志,2025,46(8):16-19. [3] 저우중잉周仲瑛 등.만성 B형 바이러스성 간염을 치료하는 복방제제 및 제조방법一種治療慢性乙型病毒性肝炎的複方製劑及其製備方法:CN100441210C [P/OL]. https://patents.google.com/patent/CN100441210C."}},{"id":"1-5","ko":"운비탕","hz":"運脾湯","alias":"","master_ko":"왕쯔리","master_hz":"王自立","tagline":"비의 운화運化를 살려 중초의 승강升降을 바로잡는 건비조운健脾助運의 명방","meta":{"주요 적응증":"비허불운형 위완통·소화장애","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":38,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-5 운비탕運脾湯의 모듈 구성<\/p><h4>①익기건비益氣健脾 모듈 — 기운을 북돋아 비장의 운화 기반을 조성함<\/h4><p><b>당삼<\/b>: 성질이 평하고 상초와 중초로 들어가 비위의 기운을 보함 백출: 습을 말려 비장을 실하게 하고, 비장의 기운을 완화하고 진액을 생성하며, 소화를 촉진함 선학초: 비장의 기운을 보하되 성질이 치우치지 않아 보약의 자니滋膩한 폐단을 일으키지 않고, 지혈 및 수렴 작용을 겸함<\/p><h4>②삼습화중滲濕和中 모듈 — 비장의 탁한 수습을 배출하여 정체를 해소<\/h4><p><b>복령<\/b>: 비위 기능을 강화하고 체내의 습을 소변 등을 통해 배출함. 당삼, 백출과 배합하여 보하되 체하지 않게 돕는 상제 작용을 이룸<\/p><h4>③조기행체調氣行滯 모듈 — 기운의 소통을 활성화하여 뭉친 기기를 뚫어줌 - 운비의 핵심<\/h4><p><b>불수<\/b>: 간기肝氣를 소통시키고, 중초의 기기 정체를 풀어내어 목극토木克土를 방지함 지각: 침강하고 내려주는 성질이 강하여 중초의 기운을 풀어주고, 기운을 하강시켜 답답하게 부푼 것을 내림. 백출의 상승, 보익 작용과 지각의 하강, 행기 작용이 상제相濟하여 중초의 승강운동을 정상화함<\/p><h4>④방향성비芳香醒脾, 소식消食 모듈 — 비장을 깨우고 음식 정체를 소화<\/h4><p><b>맥아<\/b>: 소화를 도와 중초를 안정시키며, 간기를 소통시킴 석창포: 비장을 깨우고 습을 날려 위장을 안정시킴. 발산하는 향기로 중초의 침체된 기운을 환기함<\/p>"},{"k":"master","t":"왕쯔리의 운비運脾 이론","html":"<h4>①비실건운脾失健運, 승강실상升降失常이 비위병의 핵심 병리 기전<\/h4><p>비는 승청升淸을 주도하고 위는 강탁降濁을 주도하며, 중초는 전신 기기 승강의 중심 축樞紐 역할을 담당함 비기脾氣가 손상되면 운화가 마비되고 승강 순환이 꺾이게 됨 비허脾虛가 본질이 되어 이차적으로 담음痰飮, 습조濕阻, 식적食積, 기체氣滯, 혈어血瘀 등의 실증이 병합하는 허실협잡虛實夾雜의 양상을 띰<\/p><h4>②이운위건以運爲健, 이운위보以運爲補의 치료 법칙<\/h4><p>대사는 “비장을 튼튼히 하려면 먼저 비장을 운화시켜야 하고, 비장을 운화시키려면 반드시 기를 조절해야 한다”는 핵심 원칙을 제시함 그러나, 기운을 보하는 자니滋膩한 약재만 사용하면 오히려 중초의 기기를 막아 비위 기능을 더 마비시킬 수 있음 따라서 기기를 소통시켜 운화를 촉진하는 것 자체가 비장을 가장 튼튼하게 보하는 길이라 봄<\/p><h4>③지각枳殼과 백출白朮의 상수위용相須爲用<\/h4><p>처방 중 지각은 기를 순환시켜 운비를 이끄는 핵심 약재로, 증상에 따라 소운小運 10-15g, 중운中運 20-30g, 대운大運35-60g(최대 80g)으로 구분하여 사용함 백출은 비허脾虛의 정도 및 변비 유무에 따라 15-120g까지 용량을 다양하게 사용함 지각의 소(消·행기行氣)와 백출의 보(補·건비健脾)가 결합하여 보하면서도 체하지 않고, 소통시키면서도 정기가 다치지 않는 보운동거補運同擧를 실행함<\/p><h4>④시시고호위기時時顧護胃氣(항상 위장을 보호함)<\/h4><p>병의 경과와 관계없이 항상 위장의 기운을 살피는 것을 최우선으로 삼음 약성이 지나치게 고한苦寒한 약재로 위장을 상하게 하거나, 너무 건조한 재료로 진액을 말리거나, 지나치게 보하여 운화를 방해하는 것을 철저히 경계함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">제품·특허가 없는 경험방이므로 근거가 경험 보고 수준임을 감안해, 비허형 기능성 소화불량 증례 분석부터 시작하는 것이 적절<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕위,왕젠창.왕쯔리 주임의사의 운비사상 임상 응용王自立主任醫師運脾思想臨床應用[J].서부중의약西部中醫藥,2018,31(3):39-41.<\/li><li class=\"ref\">[2] 왕위.왕쯔리 주임의사의 운비사상 탐구王自立主任醫師運脾思想探悉[J].서부중의약西部中醫藥,2014,27(3):50-52.<\/li><li class=\"ref\">[3] 톈쉬둥,장찬쥔,우정취안,등.왕쯔리 학술사상 시리즈 연구의 ‘운비사상’ 탐구王自立學術思想系列研究之“運脾思想”探悉[J].중국중의약정보잡지中國中醫藥信息雜志,2007(11):81-82.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당삼10~30g","name":"당삼","dose":"10~30g","base":"당삼"},{"raw":"炒백출30g","name":"炒백출","dose":"30g","base":"백출"},{"raw":"복령10g","name":"복령","dose":"10g","base":"복령"},{"raw":"불수10g","name":"불수","dose":"10g","base":"불수"},{"raw":"炒지각30g","name":"炒지각","dose":"30g","base":"지각"},{"raw":"석창포15g","name":"석창포","dose":"15g","base":"석창포"},{"raw":"炒맥아15g","name":"炒맥아","dose":"15g","base":"맥아"},{"raw":"선학초15~30g","name":"선학초","dose":"15~30g","base":"선학초"}],"notes":[],"핵심 효능":["비장을 튼튼히 하여 운화 기능을 도움(건비조운健脾助運)"],"주치증":["비위의 운화 기능 실조로 인한 위완통胃脘痛, 위장 질환 등의 비허불운증脾虛不運證"],"연구 확장 영역":["만성 위염, 소화성 궤양, 궤양성 대장염, 위장관 기능 장애, 역류성 식도염, 신부전에 동반된 오심· 구토, 식욕부진, 근육병성 사지무력"],"R&D 포인트":["중초의 기기승강氣機升降 순환을 회복시켜 위장관 평활근 수축력을 조절하고, 위 배출 및 장관 수축 운동 촉진","담즙 및 소화효소 분비를 촉진하고 장점막의 영양소 흡수 기능을 개선하여 영양소의 체내 이용률 개선","고용량 보약 복용 시 발생하는 소화 장애 및 장관 체증을 예방하고, 약물 대사 및 소화관 투과성을 최적화하는 한방 융합 치료 소재"]},"modules":[{"name":"①익기건비","hz":"益氣健脾","herbs":["당삼","백출","선학초"],"role":"기운을 북돋아 비장의 운화 기반을 조성함"},{"name":"②삼습화중","hz":"滲濕和中","herbs":["복령"],"role":"비장의 탁한 수습을 배출하여 정체를 해소"},{"name":"③조기행체","hz":"調氣行滯","herbs":["불수","지각"],"role":"기운의 소통을 활성화하여 뭉친 기기를 뚫어줌 - 운비의 핵심"},{"name":"④방향성비 · 소식","hz":"芳香醒脾 · 消食","herbs":["맥아","석창포"],"role":"비장을 깨우고 음식 정체를 소화"}],"rd":[{"tag":"Functional Dyspepsia","title":"기능성 소화불량(식후불편증후군)의 위 배출 개선","html":"<p>비허불운증의 증상(식후 더부룩함·조기 포만감)은 기능성 소화불량의 식후불편증후군과 겹침 위 배출 호기검사와 위 수용성 이완 지표로 효과를 평가하고, 대용량 炒지각(30g)을 운동 촉진의 핵심 약재 후보로 검증 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1][2](운비 사상), 본문 조성표)<\/p>"},{"tag":"Appetite & Nutrition","title":"노인·항암치료 중 식욕부진과 영양 상태 개선","html":"<p>연구 확장 영역에 식욕부진과 신부전성 오심·구토가 포함되어 있으나 노인·항암치료 관련 식욕부진은 원인이 다른 별도 적응증임 한 집단(예: 노인 식욕부진)으로 좁히고, 체중·식사 섭취량·영양 평가 도구(MNA 등) 를 함께 써서 맥아·석창포 배합의 식욕 개선 효과를 탐색(혈청 알부민은 단독 영양 지표로 쓰지 않음) (근거 유형: 신규 연구가설 | 근거: 본문 「연구 확장 영역」, R&amp;D 논리 2 「이운위건, 이운위보」)<\/p>"},{"tag":"Herb-pair Study","title":"지각–백출(枳朮) 약대의 용량비 최적화","html":"<p>炒지각 30g과 炒백출 30g의 1:1 배합은 지출환枳朮丸 계열의 구성임 용량비를 달리한 약대가 위장관 운동에 미치는 효과를 비교하여 처방 단순화와 제제화의 출발점으로 삼음 (근거 유형: 간접 근거 | 근거: R&amp;D 논리 3 「지각과 백출의 상수위용」)<\/p>"},{"tag":"Tolerability","title":"보익제 장기 복용 시 소화 부담 감소 효과","html":"<p>‘이운위보以運爲補’ 관점에서 사군자탕류 보익 처방에 운비탕을 병용했을 때 복부 팽만·식욕 저하 등 위장 부작용이 줄어드는지를 비교함 이 비교로 단독 치료제보다 병용 보조제로서의 가능성을 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](운비 사상 탐구), R&amp;D 논리 4)<\/p>"}],"logic":[{"n":"1","title":"비실건운脾失健運과 승강실상升降失常","body":"비위 기능 저하로 중초의 순환이 막힘"},{"n":"2","title":"이운위건以運爲健과 이운위보以運爲補","body":"소통시켜 운화하는 것이 곧 비장을 보하는 길임"},{"n":"3","title":"지각과 백출의 상수위용相須爲用","body":"보補와 소消의 조화를 통한 보운동거補運同擧"},{"n":"4","title":"시시고호위기時時顧護胃氣","body":"항상 위장의 기운을 보호함"}],"field":1,"pages":[38,41],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["1-5","운비탕","運脾湯","","왕쯔리","王自立","비의 운화運化를 살려 중초의 승강升降을 바로잡는 건비조운健脾助運의 명방","당삼10~30g 炒백출30g 복령10g 불수10g 炒지각30g 석창포15g 炒맥아15g 선학초15~30g","","핵심 효능 비장을 튼튼히 하여 운화 기능을 도움(건비조운健脾助運)","주치증 비위의 운화 기능 실조로 인한 위완통胃脘痛, 위장 질환 등의 비허불운증脾虛不運證","연구 확장 영역 만성 위염, 소화성 궤양, 궤양성 대장염, 위장관 기능 장애, 역류성 식도염, 신부전에 동반된 오심· 구토, 식욕부진, 근육병성 사지무력","R&D 포인트 중초의 기기승강氣機升降 순환을 회복시켜 위장관 평활근 수축력을 조절하고, 위 배출 및 장관 수축 운동 촉진 담즙 및 소화효소 분비를 촉진하고 장점막의 영양소 흡수 기능을 개선하여 영양소의 체내 이용률 개선 고용량 보약 복용 시 발생하는 소화 장애 및 장관 체증을 예방하고, 약물 대사 및 소화관 투과성을 최적화하는 한방 융합 치료 소재","①익기건비 益氣健脾 당삼 백출 선학초 기운을 북돋아 비장의 운화 기반을 조성함","②삼습화중 滲濕和中 복령 비장의 탁한 수습을 배출하여 정체를 해소","③조기행체 調氣行滯 불수 지각 기운의 소통을 활성화하여 뭉친 기기를 뚫어줌 - 운비의 핵심","④방향성비 · 소식 芳香醒脾 · 消食 맥아 석창포 비장을 깨우고 음식 정체를 소화","비실건운脾失健運과 승강실상升降失常 비위 기능 저하로 중초의 순환이 막힘","이운위건以運爲健과 이운위보以運爲補 소통시켜 운화하는 것이 곧 비장을 보하는 길임","지각과 백출의 상수위용相須爲用 보補와 소消의 조화를 통한 보운동거補運同擧","시시고호위기時時顧護胃氣 항상 위장의 기운을 보호함","Functional Dyspepsia 기능성 소화불량(식후불편증후군)의 위 배출 개선 비허불운증의 증상(식후 더부룩함·조기 포만감)은 기능성 소화불량의 식후불편증후군과 겹침 위 배출 호기검사와 위 수용성 이완 지표로 효과를 평가하고, 대용량 炒지각(30g)을 운동 촉진의 핵심 약재 후보로 검증 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1][2](운비 사상), 본문 조성표)","Appetite & Nutrition 노인·항암치료 중 식욕부진과 영양 상태 개선 연구 확장 영역에 식욕부진과 신부전성 오심·구토가 포함되어 있으나 노인·항암치료 관련 식욕부진은 원인이 다른 별도 적응증임 한 집단(예: 노인 식욕부진)으로 좁히고, 체중·식사 섭취량·영양 평가 도구(MNA 등) 를 함께 써서 맥아·석창포 배합의 식욕 개선 효과를 탐색(혈청 알부민은 단독 영양 지표로 쓰지 않음) (근거 유형: 신규 연구가설 | 근거: 본문 「연구 확장 영역」, R&D 논리 2 「이운위건, 이운위보」)","Herb-pair Study 지각–백출(枳朮) 약대의 용량비 최적화 炒지각 30g과 炒백출 30g의 1:1 배합은 지출환枳朮丸 계열의 구성임 용량비를 달리한 약대가 위장관 운동에 미치는 효과를 비교하여 처방 단순화와 제제화의 출발점으로 삼음 (근거 유형: 간접 근거 | 근거: R&D 논리 3 「지각과 백출의 상수위용」)","Tolerability 보익제 장기 복용 시 소화 부담 감소 효과 ‘이운위보以運爲補’ 관점에서 사군자탕류 보익 처방에 운비탕을 병용했을 때 복부 팽만·식욕 저하 등 위장 부작용이 줄어드는지를 비교함 이 비교로 단독 치료제보다 병용 보조제로서의 가능성을 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](운비 사상 탐구), R&D 논리 4)"],"ss":{"composition":"그림 1-5 운비탕運脾湯의 모듈 구성 ①익기건비益氣健脾 모듈 — 기운을 북돋아 비장의 운화 기반을 조성함 당삼 : 성질이 평하고 상초와 중초로 들어가 비위의 기운을 보함 백출: 습을 말려 비장을 실하게 하고, 비장의 기운을 완화하고 진액을 생성하며, 소화를 촉진함 선학초: 비장의 기운을 보하되 성질이 치우치지 않아 보약의 자니滋膩한 폐단을 일으키지 않고, 지혈 및 수렴 작용을 겸함 ②삼습화중滲濕和中 모듈 — 비장의 탁한 수습을 배출하여 정체를 해소 복령 : 비위 기능을 강화하고 체내의 습을 소변 등을 통해 배출함. 당삼, 백출과 배합하여 보하되 체하지 않게 돕는 상제 작용을 이룸 ③조기행체調氣行滯 모듈 — 기운의 소통을 활성화하여 뭉친 기기를 뚫어줌 - 운비의 핵심 불수 : 간기肝氣를 소통시키고, 중초의 기기 정체를 풀어내어 목극토木克土를 방지함 지각: 침강하고 내려주는 성질이 강하여 중초의 기운을 풀어주고, 기운을 하강시켜 답답하게 부푼 것을 내림. 백출의 상승, 보익 작용과 지각의 하강, 행기 작용이 상제相濟하여 중초의 승강운동을 정상화함 ④방향성비芳香醒脾, 소식消食 모듈 — 비장을 깨우고 음식 정체를 소화 맥아 : 소화를 도와 중초를 안정시키며, 간기를 소통시킴 석창포: 비장을 깨우고 습을 날려 위장을 안정시킴. 발산하는 향기로 중초의 침체된 기운을 환기함","master":"①비실건운脾失健運, 승강실상升降失常이 비위병의 핵심 병리 기전 비는 승청升淸을 주도하고 위는 강탁降濁을 주도하며, 중초는 전신 기기 승강의 중심 축樞紐 역할을 담당함 비기脾氣가 손상되면 운화가 마비되고 승강 순환이 꺾이게 됨 비허脾虛가 본질이 되어 이차적으로 담음痰飮, 습조濕阻, 식적食積, 기체氣滯, 혈어血瘀 등의 실증이 병합하는 허실협잡虛實夾雜의 양상을 띰 ②이운위건以運爲健, 이운위보以運爲補의 치료 법칙 대사는 “비장을 튼튼히 하려면 먼저 비장을 운화시켜야 하고, 비장을 운화시키려면 반드시 기를 조절해야 한다”는 핵심 원칙을 제시함 그러나, 기운을 보하는 자니滋膩한 약재만 사용하면 오히려 중초의 기기를 막아 비위 기능을 더 마비시킬 수 있음 따라서 기기를 소통시켜 운화를 촉진하는 것 자체가 비장을 가장 튼튼하게 보하는 길이라 봄 ③지각枳殼과 백출白朮의 상수위용相須爲用 처방 중 지각은 기를 순환시켜 운비를 이끄는 핵심 약재로, 증상에 따라 소운小運 10-15g, 중운中運 20-30g, 대운大運35-60g(최대 80g)으로 구분하여 사용함 백출은 비허脾虛의 정도 및 변비 유무에 따라 15-120g까지 용량을 다양하게 사용함 지각의 소(消·행기行氣)와 백출의 보(補·건비健脾)가 결합하여 보하면서도 체하지 않고, 소통시키면서도 정기가 다치지 않는 보운동거補運同擧를 실행함 ④시시고호위기時時顧護胃氣(항상 위장을 보호함) 병의 경과와 관계없이 항상 위장의 기운을 살피는 것을 최우선으로 삼음 약성이 지나치게 고한苦寒한 약재로 위장을 상하게 하거나, 너무 건조한 재료로 진액을 말리거나, 지나치게 보하여 운화를 방해하는 것을 철저히 경계함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 제품·특허가 없는 경험방이므로 근거가 경험 보고 수준임을 감안해, 비허형 기능성 소화불량 증례 분석부터 시작하는 것이 적절 참고문헌 [1] 왕위,왕젠창.왕쯔리 주임의사의 운비사상 임상 응용王自立主任醫師運脾思想臨床應用[J].서부중의약西部中醫藥,2018,31(3):39-41. [2] 왕위.왕쯔리 주임의사의 운비사상 탐구王自立主任醫師運脾思想探悉[J].서부중의약西部中醫藥,2014,27(3):50-52. [3] 톈쉬둥,장찬쥔,우정취안,등.왕쯔리 학술사상 시리즈 연구의 ‘운비사상’ 탐구王自立學術思想系列研究之“運脾思想”探悉[J].중국중의약정보잡지中國中醫藥信息雜志,2007(11):81-82."}},{"id":"1-6","ko":"귀작운비탕","hz":"歸芍運脾湯","alias":"","master_ko":"왕쯔리","master_hz":"王自立","tagline":"양혈유간養血柔肝, 건비운비健脾運脾를 통해 간울비허형肝鬱脾虛型 만성 위축성 위염을 치료하는 핵심처방","meta":{"주요 적응증":"간울비허형 만성 위축성 위염","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":42,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-6 귀작운비탕歸芍運脾湯의 모듈 구성<\/p><h4>①유간양혈柔肝養血 모듈 — 간혈을 채워 간체를 부드럽게 하고 울체를 해소함<\/h4><p><b>당귀<\/b>: 혈중지기약血中之氣藥으로 간, 심, 비경으로 들어가 음혈陰血을 보하고 혈액순환을 촉진함<\/p><p><b>백작약<\/b>: 간음肝陰을 수렴하고 유간지통柔肝止痛하며, 당귀와 상제하여 강장剛臟인 간을 부드럽게 만듦<\/p><h4>②건비운비健脾運脾 모듈 — 비를 튼튼히 하고 운화기능을 복원<\/h4><p><b>당삼<\/b>: 중초 비위의 기를 보하여 운화의 중심 기틀을 바로잡음<\/p><p><b>백출<\/b>: 비장을 튼튼히 하고 습을 말리며, 기의 승발升發을 돕고 당삼의 작용을 보완함<\/p><p><b>복령<\/b>: 비위 기능을 강화하고 체내의 습을 소변 등을 통해 배출하며, 비위의 운화 기능을 완전하게 함<\/p><h4>③이기화위理氣和胃 모듈 — 중초 기기의 승강을 조절하고 습탁을 제거<\/h4><p><b>불수<\/b>: 간경과 비경에 작용하여 울체된 간기를 풀고, 가슴과 위장에 뭉친 기운을 소통시킴<\/p><p><b>지각<\/b>: 중초의 막힌 기운을 내려, 위장의 답답함과 복부 팽만감을 완화함<\/p><p><b>맥아<\/b>: 식체를 소화시키고 건비하는 한편, 간의 생발生發 성질에 순응하여 뭉친 간기를 완화함<\/p><p><b>석창포<\/b>: 방향성 약재로 위장에 갇힌 습탁濕濁을 제거하고, 비장을 깨워 위장의 기운을 편안하게 조화시킴<\/p><h4>④수렴재생收斂再生 모듈 — 위점막 미세순환을 개선하고 조직 복구를 촉진함<\/h4><p><b>선학초<\/b>: 궤양면을 수렴하고 보허강장補虛强壯 작용으로 위점막 미세혈관 순환을 개선하고 상처받은 미세 조직과 위샘 변성을 복구함<\/p>"},{"k":"master","t":"왕쯔리의 만성 위축성 위염 치료","html":"<h4>①간울비허肝鬱脾虛가 만성 위축성 위염의 핵심 병리 기초<\/h4><p>만성 위축성 위염은 병의 경과가 길고 장기화되기 쉬워, 스트레스나 정지불수情志不遂로 인해 간기肝氣가 뭉치기 쉬움<\/p><p>간은 체음이용양體陰而用陽의 특성을 지닌 강장剛臟인데, 간기가 울체되면 목극토木克土 현상으로 비위脾胃를 침범하여 승강기기가 꼬이고 생화지원生化之源이 막혀 위점막이 영양을 잃고 위축됨<\/p><h4>②‘치간필유간治肝必柔肝, 유간선양간柔肝先養肝’의 치료 법칙<\/h4><p>기존의 일방적인 소간疏肝, 이기理氣, 청열淸熱, 공벌攻伐 위주의 약재는 오히려 간의 음혈陰血을 손상시켜 병세를 악화시키기 쉬움<\/p><p>따라서 대사는 “간을 다스리려면 반드시 유간柔肝해야 하고, 유간하려면 먼저 양간養肝해야 한다”는 관점을 제시하여, 당귀와 백작약으로 영혈을 보하고 간체를 부드럽게 하는 유간운비柔肝運脾 치료법을 확립함<\/p><h4>③배토제목培土制木, 보이불체補而不滯, 소이불조疏而不燥<\/h4><p>간을 부드럽게 하는 동시에 보비補脾하는 약재(당삼, 백출, 복령)를 투여하여 목木이 토土를 침범하는 악순환을 차단함<\/p><p>영혈을 보하되 기혈이 정체되거나 뭉치지 않게 하고, 울체된 기운을 소통시키되 약성이 지나치게 건조해져 음혈이나 정기를 상하는 일이 없도록 약재를 정교하게 조율함<\/p><h4>④현대 약리 및 임상 지표 검증<\/h4><p><b>위점막 보호 및 항염증 기전<\/b>: 당귀, 백작약, 당삼 등의 복합 작용은 위점막 미세혈관의 혈류량을 증가시키고 PGE2 합성을 촉진하여 위점막 장벽을 보호하는 것으로 해석됨<\/p><p><b>조직학적 변성 개선<\/b>: 선학초, 당귀, 지각 등은 만성 위축성 위염의 주요 병리 지표인 위샘 위축(Atrophy), 장상피화생 (Intestinal Metaplasia), 이형증식(Dysplasia)을 억제하고 점막 재생을 돕는 것으로 보고됨<\/p><p><b>임상 성과<\/b>: 3개월 치료 과정을 통해 위장 팽만, 통증, 트림 등의 증상 개선율(93.33%)뿐만 아니라 내시경 및 조직병리학적 개선율(90.00%)에서 대조군(비타민/위점막 보호제) 대비 유의미하게 높은 치료 효과를 보고함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">임상·실험 보고가 있으나 공개자료상 제품화 사례가 확인되지 않으며, 운비탕과 함께 간울비허형 위축성 위염 제제로 묶어 검토할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 톈쉬둥,수진,우정취안,등.왕쯔리의 “치간필유간, 유간선양간”사상 탐구王自立“治肝必柔肝,柔肝先養肝”思想探悉[J].중국중의약정보잡지中國中醫藥信息雜志,2008,(2):85-86.<\/li><li class=\"ref\">[2] 리징.귀작운비탕의 간울비허형 만성 위축성 위염 치료 임상 효능 관찰歸芍運脾湯治療肝鬱脾虛型慢性萎縮性胃炎的臨床療效觀察[D].감숙중의학원甘肅中醫學院,2014.<\/li><li class=\"ref\">[3] 수진,우정취안,왕위,등.명로중의 왕쯔리 운비 계열 처방의 방증 지식 데이터 마이닝 연구名老中醫王自立運脾系列方劑方證知識數據挖掘研究[J].서부중의 약西部中醫藥,2013,26(2):45-48.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당귀15g- 30g","name":"당귀15g-","dose":"30g","base":"당귀15g-"},{"raw":"炒백작약15g- 30g","name":"炒백작약15g-","dose":"30g","base":"백작약15g-"},{"raw":"당삼30g","name":"당삼","dose":"30g","base":"당삼"},{"raw":"炒백출30g","name":"炒백출","dose":"30g","base":"백출"},{"raw":"복령10g","name":"복령","dose":"10g","base":"복령"},{"raw":"불수15g","name":"불수","dose":"15g","base":"불수"},{"raw":"炒지각30g","name":"炒지각","dose":"30g","base":"지각"},{"raw":"炒맥아15g","name":"炒맥아","dose":"15g","base":"맥아"},{"raw":"석창포15g","name":"석창포","dose":"15g","base":"석창포"},{"raw":"선학초30g","name":"선학초","dose":"30g","base":"선학초"}],"notes":[],"핵심 효능":["간혈을 보하고 간을 부드럽게 함(양혈유간養血柔肝)","비를 튼튼히 하고 운화 기능을 복원(건비운비健脾運脾)","기체를 풀어 위의 기기를 원활하게 조절(이기화위理氣和胃)"],"주치증":["간울비허형肝鬱脾虛型 만성 위축성 위염의 위완통胃脘痛, 위비胃痞, 조잡嘈雜, 토산吐酸"],"연구 확장 영역":["만성 위축성 위염의 위점막 궤양 및 위샘 위축의 개선, 장상피화생 및 이형증식(상피내 종양성 병변) 억제, 위점막 미세혈관 재생"],"R&D 포인트":["당귀, 작약의 유간柔肝 작용을 통해 간문맥 및 위점막 미세혈관의 혈류량을 증가시켜 조직 영양 공급 및 산소 공급을 촉진","단순한 공벌攻伐을 탈피한 건비운비健脾運脾 작용을 통해 EGF, VEGF 등 성장인자와 밀착연접 단백질의 발현을 조절하여 위점막 장벽 손상 회복","만성 염증성 사이토카인 억제 및 산화 스트레스 감소를 통해 위축성 위염 및 장상피화생 등의 병리적 조직 변성을 제어하는 천연물 신약 소재"]},"modules":[{"name":"①유간양혈","hz":"柔肝養血","herbs":["당귀","백작약"],"role":"간혈을 채워 간체를 부드럽게 하고 울체를 해소함"},{"name":"②건비운비","hz":"健脾運脾","herbs":["당삼","백출","복령"],"role":"비를 튼튼히 하고 운화기능을 복원"},{"name":"③이기화위","hz":"理氣和胃","herbs":["불수","지각","맥아","석창포"],"role":"중초 기기의 승강을 조절하고 습탁을 제거"},{"name":"④수렴재생","hz":"收斂再生","herbs":["선학초"],"role":"위점막 미세순환을 개선하고 조직 복구를 촉진함"}],"rd":[{"tag":"Add-on Comparison","title":"당귀·백작약 가미에 따른 위점막 혈류 개선 비교","html":"<p>귀작운비탕은 운비탕에 당귀·백작약을 더한 처방임<\/p><p>운비탕 대비 가미 효과(위점막 혈류·조직 산소화)를 직접 비교하는 설계가 이 처방만의 차별점을 보여주는 가장 직접적인 방법 (근거 유형: 임상 경험 보고 | 근거: 본문 조성표(운비탕과 비교), 참고문헌 [1](유간·양간 사상))<\/p>"},{"tag":"CAG Clinical Endpoints","title":"간울비허형 만성 위축성 위염의 객관 지표 임상","html":"<p>임상 관찰 학위논문이 있음<\/p><p>증상 점수 외에 병리 등급(위축·장상피화생)과 혈청 펩시노겐 I/II 비, 가스트린-17을 객관 지표로 추가한 재현 연구로 근거 수준을 높이되, 점막 혈류 개선과 위축· 장상피화생 회복은 나타나는 시기가 다르므로 단계를 나누어 평가 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2014, 임상 효능 관찰))<\/p>"},{"tag":"Stress–Gut Model","title":"스트레스 동반 위축성 위염 모델에서 점막 장벽 회복","html":"<p>구속 스트레스와 위축성 위염을 결합한 복합 모델로 ‘목극토木克土’ 병기를 재현함<\/p><p>밀착연접 단백질과 EGF·VEGF 변화를 측정하여 정서 요인이 동반된 위축성 위염에 특화된 처방임을 확인(구속 스트레스 복합 모델은 병기 재현의 간접 근거이며 임상 직접성에는 한계가 있음) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](처방–증후 데이터 마이닝), R&amp;D 논리 1·2)<\/p>"}],"logic":[{"n":"1","title":"간울비허肝鬱脾虛와 목극토木克土","body":"정서적 스트레스가 비위 기능을 손상시킴"},{"n":"2","title":"유간운비柔肝運脾와 배토제목培土制木","body":"간을 부드럽게 하고 비를 보살펴 악순환을 차단함"},{"n":"3","title":"보이불체補而不滯와 소이불조疏而不燥","body":"보하되 정체되지 않고 소통시키되 건조하지 않음"}],"field":1,"pages":[42,45],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["1-6","귀작운비탕","歸芍運脾湯","","왕쯔리","王自立","양혈유간養血柔肝, 건비운비健脾運脾를 통해 간울비허형肝鬱脾虛型 만성 위축성 위염을 치료하는 핵심처방","당귀15g- 30g 炒백작약15g- 30g 당삼30g 炒백출30g 복령10g 불수15g 炒지각30g 炒맥아15g 석창포15g 선학초30g","","핵심 효능 간혈을 보하고 간을 부드럽게 함(양혈유간養血柔肝) 비를 튼튼히 하고 운화 기능을 복원(건비운비健脾運脾) 기체를 풀어 위의 기기를 원활하게 조절(이기화위理氣和胃)","주치증 간울비허형肝鬱脾虛型 만성 위축성 위염의 위완통胃脘痛, 위비胃痞, 조잡嘈雜, 토산吐酸","연구 확장 영역 만성 위축성 위염의 위점막 궤양 및 위샘 위축의 개선, 장상피화생 및 이형증식(상피내 종양성 병변) 억제, 위점막 미세혈관 재생","R&D 포인트 당귀, 작약의 유간柔肝 작용을 통해 간문맥 및 위점막 미세혈관의 혈류량을 증가시켜 조직 영양 공급 및 산소 공급을 촉진 단순한 공벌攻伐을 탈피한 건비운비健脾運脾 작용을 통해 EGF, VEGF 등 성장인자와 밀착연접 단백질의 발현을 조절하여 위점막 장벽 손상 회복 만성 염증성 사이토카인 억제 및 산화 스트레스 감소를 통해 위축성 위염 및 장상피화생 등의 병리적 조직 변성을 제어하는 천연물 신약 소재","①유간양혈 柔肝養血 당귀 백작약 간혈을 채워 간체를 부드럽게 하고 울체를 해소함","②건비운비 健脾運脾 당삼 백출 복령 비를 튼튼히 하고 운화기능을 복원","③이기화위 理氣和胃 불수 지각 맥아 석창포 중초 기기의 승강을 조절하고 습탁을 제거","④수렴재생 收斂再生 선학초 위점막 미세순환을 개선하고 조직 복구를 촉진함","간울비허肝鬱脾虛와 목극토木克土 정서적 스트레스가 비위 기능을 손상시킴","유간운비柔肝運脾와 배토제목培土制木 간을 부드럽게 하고 비를 보살펴 악순환을 차단함","보이불체補而不滯와 소이불조疏而不燥 보하되 정체되지 않고 소통시키되 건조하지 않음","Add-on Comparison 당귀·백작약 가미에 따른 위점막 혈류 개선 비교 귀작운비탕은 운비탕에 당귀·백작약을 더한 처방임 운비탕 대비 가미 효과(위점막 혈류·조직 산소화)를 직접 비교하는 설계가 이 처방만의 차별점을 보여주는 가장 직접적인 방법 (근거 유형: 임상 경험 보고 | 근거: 본문 조성표(운비탕과 비교), 참고문헌 [1](유간·양간 사상))","CAG Clinical Endpoints 간울비허형 만성 위축성 위염의 객관 지표 임상 임상 관찰 학위논문이 있음 증상 점수 외에 병리 등급(위축·장상피화생)과 혈청 펩시노겐 I/II 비, 가스트린-17을 객관 지표로 추가한 재현 연구로 근거 수준을 높이되, 점막 혈류 개선과 위축· 장상피화생 회복은 나타나는 시기가 다르므로 단계를 나누어 평가 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2014, 임상 효능 관찰))","Stress–Gut Model 스트레스 동반 위축성 위염 모델에서 점막 장벽 회복 구속 스트레스와 위축성 위염을 결합한 복합 모델로 ‘목극토木克土’ 병기를 재현함 밀착연접 단백질과 EGF·VEGF 변화를 측정하여 정서 요인이 동반된 위축성 위염에 특화된 처방임을 확인(구속 스트레스 복합 모델은 병기 재현의 간접 근거이며 임상 직접성에는 한계가 있음) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](처방–증후 데이터 마이닝), R&D 논리 1·2)"],"ss":{"composition":"그림 1-6 귀작운비탕歸芍運脾湯의 모듈 구성 ①유간양혈柔肝養血 모듈 — 간혈을 채워 간체를 부드럽게 하고 울체를 해소함 당귀 : 혈중지기약血中之氣藥으로 간, 심, 비경으로 들어가 음혈陰血을 보하고 혈액순환을 촉진함 백작약 : 간음肝陰을 수렴하고 유간지통柔肝止痛하며, 당귀와 상제하여 강장剛臟인 간을 부드럽게 만듦 ②건비운비健脾運脾 모듈 — 비를 튼튼히 하고 운화기능을 복원 당삼 : 중초 비위의 기를 보하여 운화의 중심 기틀을 바로잡음 백출 : 비장을 튼튼히 하고 습을 말리며, 기의 승발升發을 돕고 당삼의 작용을 보완함 복령 : 비위 기능을 강화하고 체내의 습을 소변 등을 통해 배출하며, 비위의 운화 기능을 완전하게 함 ③이기화위理氣和胃 모듈 — 중초 기기의 승강을 조절하고 습탁을 제거 불수 : 간경과 비경에 작용하여 울체된 간기를 풀고, 가슴과 위장에 뭉친 기운을 소통시킴 지각 : 중초의 막힌 기운을 내려, 위장의 답답함과 복부 팽만감을 완화함 맥아 : 식체를 소화시키고 건비하는 한편, 간의 생발生發 성질에 순응하여 뭉친 간기를 완화함 석창포 : 방향성 약재로 위장에 갇힌 습탁濕濁을 제거하고, 비장을 깨워 위장의 기운을 편안하게 조화시킴 ④수렴재생收斂再生 모듈 — 위점막 미세순환을 개선하고 조직 복구를 촉진함 선학초 : 궤양면을 수렴하고 보허강장補虛强壯 작용으로 위점막 미세혈관 순환을 개선하고 상처받은 미세 조직과 위샘 변성을 복구함","master":"①간울비허肝鬱脾虛가 만성 위축성 위염의 핵심 병리 기초 만성 위축성 위염은 병의 경과가 길고 장기화되기 쉬워, 스트레스나 정지불수情志不遂로 인해 간기肝氣가 뭉치기 쉬움 간은 체음이용양體陰而用陽의 특성을 지닌 강장剛臟인데, 간기가 울체되면 목극토木克土 현상으로 비위脾胃를 침범하여 승강기기가 꼬이고 생화지원生化之源이 막혀 위점막이 영양을 잃고 위축됨 ②‘치간필유간治肝必柔肝, 유간선양간柔肝先養肝’의 치료 법칙 기존의 일방적인 소간疏肝, 이기理氣, 청열淸熱, 공벌攻伐 위주의 약재는 오히려 간의 음혈陰血을 손상시켜 병세를 악화시키기 쉬움 따라서 대사는 “간을 다스리려면 반드시 유간柔肝해야 하고, 유간하려면 먼저 양간養肝해야 한다”는 관점을 제시하여, 당귀와 백작약으로 영혈을 보하고 간체를 부드럽게 하는 유간운비柔肝運脾 치료법을 확립함 ③배토제목培土制木, 보이불체補而不滯, 소이불조疏而不燥 간을 부드럽게 하는 동시에 보비補脾하는 약재(당삼, 백출, 복령)를 투여하여 목木이 토土를 침범하는 악순환을 차단함 영혈을 보하되 기혈이 정체되거나 뭉치지 않게 하고, 울체된 기운을 소통시키되 약성이 지나치게 건조해져 음혈이나 정기를 상하는 일이 없도록 약재를 정교하게 조율함 ④현대 약리 및 임상 지표 검증 위점막 보호 및 항염증 기전 : 당귀, 백작약, 당삼 등의 복합 작용은 위점막 미세혈관의 혈류량을 증가시키고 PGE2 합성을 촉진하여 위점막 장벽을 보호하는 것으로 해석됨 조직학적 변성 개선 : 선학초, 당귀, 지각 등은 만성 위축성 위염의 주요 병리 지표인 위샘 위축(Atrophy), 장상피화생 (Intestinal Metaplasia), 이형증식(Dysplasia)을 억제하고 점막 재생을 돕는 것으로 보고됨 임상 성과 : 3개월 치료 과정을 통해 위장 팽만, 통증, 트림 등의 증상 개선율(93.33%)뿐만 아니라 내시경 및 조직병리학적 개선율(90.00%)에서 대조군(비타민/위점막 보호제) 대비 유의미하게 높은 치료 효과를 보고함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 임상·실험 보고가 있으나 공개자료상 제품화 사례가 확인되지 않으며, 운비탕과 함께 간울비허형 위축성 위염 제제로 묶어 검토할 수 있음 참고문헌 [1] 톈쉬둥,수진,우정취안,등.왕쯔리의 “치간필유간, 유간선양간”사상 탐구王自立“治肝必柔肝,柔肝先養肝”思想探悉[J].중국중의약정보잡지中國中醫藥信息雜志,2008,(2):85-86. [2] 리징.귀작운비탕의 간울비허형 만성 위축성 위염 치료 임상 효능 관찰歸芍運脾湯治療肝鬱脾虛型慢性萎縮性胃炎的臨床療效觀察[D].감숙중의학원甘肅中醫學院,2014. [3] 수진,우정취안,왕위,등.명로중의 왕쯔리 운비 계열 처방의 방증 지식 데이터 마이닝 연구名老中醫王自立運脾系列方劑方證知識數據挖掘研究[J].서부중의 약西部中醫藥,2013,26(2):45-48."}},{"id":"1-7","ko":"향사온중탕","hz":"香砂溫中湯","alias":"","master_ko":"리전화","master_hz":"李振華","tagline":"보중건비補中健脾, 화위강기和胃降氣, 소간양간疏肝養肝을 통해 만성 위축성 위염을 치료하는 대표 처방","meta":{"주요 적응증":"비위허한형 만성 위축성 위염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":46,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-7 향사온중탕香砂溫中湯의 모듈 구성<\/p><h4>①건비양위健脾養胃 모듈 — 중초의 기운을 보하고 비위의 운화 기반을 튼튼히 다짐<\/h4><p><b>백출<\/b>: 비기脾氣를 크게 보하고 습을 말려 중초 운화의 중심축을 다짐 복령: 비장을 돕고 삼습滲濕하여 약재들이 보하되 정체되지 않도록 유도 감초: 중초를 따뜻하게 보하고 비위 기운을 다독이며 약재를 조화시킴<\/p><h4>②이기강기理氣降氣, 조습화담燥濕化痰 모듈 — 기체氣滯를 풀어 위기를 내리고 담습을 해소함<\/h4><p><b>진피<\/b>: 기운을 소통시키고 습을 말려 이진탕二陳湯의 핵심 작용을 수행함 반하: 뭉친 담습痰濕을 삭이고 상역하는 위기를 아래로 내림 후박: 가슴과 위장의 울체된 기를 내려주어 답답함과 복부 팽만감을 해소<\/p><p><b>지각<\/b>: 중초의 기기를 순환시키고 답답한 기운을 내림<\/p><h4>③방향성비芳香醒脾, 온중화위溫中和胃 모듈 — 방향성으로 비장을 깨우고, 따뜻하게 하여 한습寒濕을 제거<\/h4><p><b>목향<\/b>: 장관의 기체氣滯를 소통시켜 통증을 완화하고 비장의 운화를 도움 사인: 방향성으로 비장을 깨우고 위장을 편안하게 함<\/p><h4>④소간유간疏肝柔肝, 온통위양溫通胃陽 모듈 — 울체된 간기를 소통시키고 중초의 양기를 통하게 하여 간-비위의 기기를 균형 있게 조화시킴<\/h4><p><b>향부자<\/b>: 간경의 울체된 기를 풀어 가슴과 위장의 뭉친 기기를 소통시킴 오약: 기혈순환을 촉진하고 찬 기운을 제거하여 중초의 냉통을 완화함 백작약: 간음을 수렴하고 유간지통柔肝止痛하며, 계지의 발산 성질이 음혈을 상하지 않도록 조절함<\/p><p><b>계지<\/b>: 비위의 양기를 따뜻하게 운화시켜 담음과 한습을 제거하고 혈맥을 소통시킴<\/p>"},{"k":"master","t":"리전화의 만성 위축성 위염 치료","html":"<h4>①인허치실因虛致實, 허실협잡虛實夾雜이 만성 위축성 위염의 핵심 병리 기전<\/h4><p>만성 위축성 위염은 병의 경과가 길고 비위기허脾胃氣虛가 본질이며, 이로 인해 담습痰濕, 식적食積, 기체氣滯 등의 실증이 병합하는 허실협잡의 양상을 띰 간기울결肝氣鬱結이 비위의 운화를 방해하거나, 비위가 허약해진 것이 간기의 소통을 막는 병리적 악순환이 지속되어, 위점막 영양 공급이 차단되고 위축이 진행됨<\/p><h4>②비의건脾宜健, 위의화胃宜和, 간의소肝宜疏의 삼각 치료 법칙<\/h4><p>대사는 단순히 보하거나 사하는 치료법을 지양하고, 비는 건비健脾하고, 위는 조화롭게 화위和胃시키며, 간은 소간疏肝시키는 종합적 치료 기전을 강조함 보약 중심의 처방에 기를 순환시키는 이기약理氣藥과 간을 부드럽게 하는 유간약柔肝藥을 정교하게 배합하여 보하되 체하지 않는 선순환을 이끌어냄<\/p><h4>③계지와 백작약의 일산일수一散一收 조율<\/h4><p>계지의 신산辛散한 성질로 중초의 양기를 깨우고, 백작약의 수렴하는 성질로 간혈을 보하여 두 약재가 음양의 균형을 맞춤<\/p><p>이를 통해 강한 온열 약재가 간의 음혈이나 진액을 상하게 하는 부작용을 줄임<\/p><h4>④현대 초미세구조 및 생화학 지표 검증<\/h4><p><b>위점막 세포기구 복구<\/b>: 전자현미경 관찰 결과, 치료 후 위 전정부胃竇 G세포의 분비과립 공포화 현상이 개선되고 미토콘드리아 및 조면소포체(RER) 등 세포 내 초미세구조가 정화, 재생됨을 확인 에너지 대사 및 내분비 정상화: 감소해 있던 에너지 대사 효소(ICD, LDH)를 정상화하고, 과항진된 교감신경, 카테콜아민 (CA, NE) 수치를 안정시킴 임상 성과: 국책 연구 결과, 임상 증상 완화는 물론 위점막 위샘 위축 역전율에서 높은 치료 효과를 보고하여 위축성 위염의 역전 가능성을 제시함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">향사육군자탕 계열과 겹치는 구성이어서 국내 기존 한방 제제와의 차별점(온중 강화)을 먼저 정리해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 궈수윈.리전화의 만성 위축성 위염 진료 사고와 방약郭淑雲.李振華診治慢性萎縮性胃炎的思路與方藥[J].랴오닝중의잡지遼寧中醫雜志,2010,37(10):1883-1884.<\/li><li class=\"ref\">[2] 리정성,황칭.국의대사 리전화 교수의 만성 위축성 위염에 대한 임상 및 실험 연구李鄭生,黃淸.國醫大師李振華教授對慢性萎縮性胃炎的臨床與實驗研究[C].허난중의학원 리전화학술사상연구소河南中醫學院李振華學術思想研究所,2010:176-181.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"炒백출10g","name":"炒백출","dose":"10g","base":"백출"},{"raw":"복령12g","name":"복령","dose":"12g","base":"복령"},{"raw":"진피10g","name":"진피","dose":"10g","base":"진피"},{"raw":"制반하10g","name":"制반하","dose":"10g","base":"반하"},{"raw":"향부자10g","name":"향부자","dose":"10g","base":"향부자"},{"raw":"사인8g","name":"사인","dose":"8g","base":"사인"},{"raw":"川후박10g","name":"川후박","dose":"10g","base":"후박"},{"raw":"계지5g","name":"계지","dose":"5g","base":"계지"},{"raw":"백작약10g","name":"백작약","dose":"10g","base":"백작약"},{"raw":"오약10g","name":"오약","dose":"10g","base":"오약"},{"raw":"지각10g","name":"지각","dose":"10g","base":"지각"},{"raw":"목향6g","name":"목향","dose":"6g","base":"목향"},{"raw":"炙감초3g","name":"炙감초","dose":"3g","base":"감초"}],"notes":[],"핵심 효능":["비장을 튼튼히 하고 중초의 기운을 보함(보중건비補中健脾)","위를 편안하게 하고 기를 아래로 내림(화위강기和胃降氣)","울체된 간기를 소통시키고 간의 음혈을 보강(소간양간疏肝養肝)"],"주치증":["만성 위축성 위염, 표재성 위염, 역류성 식도염, 십이지장염 등의 비위기허脾胃氣虛 및 양허증陽虛證(위완통胃脘痛, 위비胃痞, 납매식소納呆食少(식욕부진·식사량 감소))"],"연구 확장 영역":["만성 위축성 위염의 위샘 위축 역전, 위점막 초미세구조(선세포 및 세포소기관) 복구, 신경내분비계 및 에너지 대사 조절, 자유라디칼(LPO) 억제 및 세포 내 자가포식/재생 유도"],"R&D 포인트":["위장관 평활근 수축 조절 및 신경전달물질 매개를 통한 위 배출 기능 개선, 위장관 운동성 장애 개선","위점막 상피세포 내 미토콘드리아 손상 억제, ATP 생성 촉진 및 에너지 대사 경로 조절을 통한 위장관 대사 기능 회복","염증성 사이토카인 차단, 항산화 효소 활성화, 위점막 점액 분비 촉진을 통한 위점막 위축 및 장상피화생 미세환경 개선 천연물 치료 소재"]},"modules":[{"name":"①건비양위","hz":"健脾養胃","herbs":["백출","복령","감초"],"role":"중초의 기운을 보하고 비위의 운화 기반을 튼튼히 다짐"},{"name":"②이기강기 · 조습화담","hz":"理氣降氣 · 燥濕化痰","herbs":["진피","반하","후박","지각"],"role":"기체氣滯를 풀어 위기를 내리고 담습을 해소함"},{"name":"③방향성비 · 온중화위","hz":"芳香醒脾 · 溫中和胃","herbs":["목향","사인"],"role":"방향성으로 비장을 깨우고, 따뜻하게 하여 한습寒濕을 제거"},{"name":"④소간유간 · 온통위양","hz":"疏肝柔肝 · 溫通胃陽","herbs":["향부자","오약","백작약","계지"],"role":"울체된 간기를 소통시키고 중초의 양기를 통하게 하여 간-비위의 기기를 균형 있게 조화시킴"}],"rd":[{"tag":"Ultrastructure","title":"위점막 초미세구조 회복 결과의 재현 검증","html":"<p>과거 국책 연구에서 G세포 분비과립 공포화 개선과 미토콘드리아 초미세구조 회복이 보고되었음 이를 현재 기준(전자현미경 정량 분석, 표준화된 위축 모델)으로 재현하여 기존 성과의 신뢰도를 확보 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](임상·실험 연구))<\/p>"},{"tag":"Cold-pattern Biomarker","title":"비위허한형 에너지 대사 이상의 지표화","html":"<p>‘허한虛寒’을 객관화하기 위해 위점막 ATP·AMPK 등 에너지 대사 지표와 심박변이도 (HRV) 등 자율신경 지표를 함께 측정함 온중 처방 투여 전후 변화로 증형 진단 지표를 탐색(에너지 대사 지표의 임상적 의미는 별도 검증 필요) (근거 유형: 임상 경험 보고 | 근거: 본문 「연구 확장 영역」 (에너지 대사 조절), 참고문헌 [2])<\/p>"},{"tag":"Herb Pair","title":"계지–백작약 배합의 위장 운동·진경 효과","html":"<p>계지 5g과 백작약 10g(1:2)의 배합은 계지탕 골격의 ‘일산일수一散一收’ 구조임 단미 대비 배합의 위 평활근 진경과 위 배출 조절 효과를 비교하여 처방 내 역할을 확인 (근거 유형: 간접 근거 | 근거: R&amp;D 논리 3 「계지와 백작약의 일산일수」)<\/p>"},{"tag":"Reversal Endpoint","title":"위샘 위축 역전율을 1차 지표로 한 임상","html":"<p>보고된 위축 역전 효과를 확인하려면 6~12개월 투여 후 표준화된 생검(OLGA 병기 체계)과 맹검 병리 판독, 대조군을 갖춘 무작위 대조 임상이 필요함 이것이 천연물 신약 개발의 핵심 근거가 됨 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](진료 관

관절염(CIA) 모델에서 MTX 단독 / 익신견비환 단독 / 병용 비교 후, 임상에서는 MTX 병용 무작위 대조로 ACR20 반응률과 DAS28, 말초혈액 Th17/Treg 비율을 측정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [5](2026, SDF-1/CXCR4), 본문 「병용 전략」 (메토트렉세이트)<\/p>"},{"tag":"Bone Erosion","title":"파골세포 분화 억제를 통한 관절 골미란 진행 차단","html":"<p>본문 연구 동향에서 파골세포·ephrinB2·JAK2/STAT3가 평가 지표로 제시됨 증상 개선보다 영상학적 골미란 진행 억제를 차별화 지표로 삼아 RANKL/OPG 축과 파골세포 분화 억제를 확인<\/p><p><b>검증 설계<\/b> CIA 랫드에서 micro-CT 골미란 점수와 TRAP 염색 파골세포 수를 측정하고, 임상에서는 1년 방사선 진행(mTSS) 변화를 2차 지표로 설정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 본문 「평가 지표」 표(파골세포·ephrinB2·JAK2/STAT3)<\/p>"},{"tag":"Bone Loss Comorbidity","title":"신허형 류마티스 관절염의 이차성 골다공증 동반 관리","html":"<p>숙지황·음양곽·골쇄보 등 보신약 구성은 관절 염증과 함께 진행하는 전신 골소실 관리로 연결할 수 있음<\/p><p>신허형으로 분류된 환자를 선별하여 골밀도와 골대사 표지자(CTX·P1NP)를 함께 추적하는 설계가 적합<\/p><p><b>검증 설계<\/b> 신허형 변증 기준으로 선별한 RA 환자에서 12개월 골밀도(DXA)와 CTX·P1NP 변화를 관찰<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 본문 주치증(신허형 RA·골다공증), 참고문헌 [4](류마티스 치료 학술사상)<\/p>"},{"tag":"Restricted Herbs","title":"천산갑·심골풍 등 국내 공정서에 없는 약재의 대체","html":"<p>炮천산갑은 모든 종이 국제거래협약(CITES) 부속서 I에 등재되어 2020년 중국약전에서도 빠졌고, 현행 허가 제품(20미)에서도 빠져 있음. 반면 심골풍尋骨風은 아리스톨로크산 함유 약재로 현행 제품에 남아 있어 설명서에 신장 손상 경고가 붙어 있음<\/p><p>오초사와 함께 국내 공정서(대한민국약전·대한민국약전외한약(생약)규격집)에 수재되어 있지 않으므로, 이들 약재를 뺀 조성으로 국내 개발을 시작해야 하며, 이렇게 바꾼 조성에는 기존 제품의 유효성 자료를 그대로 적용할 수 없음<\/p><p><b>검증 설계<\/b> 현행 제품 조성(20미)과 원처방(21종) 대조 → 천산갑·심골풍·오초사 제외 조성의 효력을 원처방과 비교 → 신기능을 포함한 독성·규격 자료와 원료 확보 계획을 새로 구축<\/p><p class=\"row\">근거 <span class=\"chip\">제품·허가 자료<\/span> 본문 조성표, 참고문헌 [6](제품 정보), [7](심골풍 제외 개량 조성 특허), [10](현행 제품 설명서)<\/p>"}],"logic":[{"n":"1","title":"충약수척蟲藥搜剔, 찬투척사鑽透剔邪","body":"대량의 충류약으로 뼛속 깊이 침입한 사기를 샅샅이 뒤져 제거함"},{"n":"2","title":"구통다어久痛多瘀, 구통입락久痛入絡","body":"낙맥이 어조瘀阻되고 담어가 교결하여 골격과 관절을 침식함"},{"n":"3","title":"익신장독益腎壯督, 보신배본補腎培本","body":"신을 보익하고 독맥을 튼튼하게 하여 본本을 다스림"},{"n":"4","title":"공보겸시·표본동치攻補兼施,標本同治","body":"거사와 보익을 병행하여 정기 손상을 방지하고 장기 치료를 도모함"}],"field":2,"pages":[84,90],"evidence":"연구 축적 (논문 110편)","product":"익신견비환 (중성약, 20미)","status":"허가 중성약","s":["2-1","익신견비환","益腎蠲痹丸","","주량춘","朱良春","익신장독益腎壯督과 충류약蟲類藥을 활용한 수풍척사搜風剔邪, 견비통락蠲痹通絡으로 완비頑痹를 치료하는 처방","숙지황 생지황 음양곽 골쇄보 당귀 계혈등 연호색 토별충 炮천산갑 심골풍尋骨風 노관초老鸛草 서장경 호장 율초葎草 녹함초鹿銜草 전갈 麩炒강잠 오공 酒지룡 淸炒노봉방 酒오초사","※ 대사의 원처방 조성임. 현행 허가 제품 익신견비환은 천산갑이 빠진 20미이며, 아리스톨로크산을 함유한 심골풍은 포함되어 있음(「중국 제품화 현황」 참조)","핵심 효능 신양을 온보하여 양기를 북돋우고 근골을 온양함(온보신양溫補腎陽) 신장을 보익하고 독맥을 튼튼하게 하여 전신의 양기를 북돋우고 방어력을 강화함(익신장독益腎壯督) 충류약의 특성을 활용해 깊이 침입한 풍사 및 각종 사기를 찾아내 제거함(수풍척사搜風剔邪) 비증을 풀고 경락을 소통시켜 기혈의 순환을 원활하게 함(견비통락蠲痹通絡)","주치증 완비頑痹. 손가락의 조조강직, 관절 통증, 홍종, 굴신불리, 근육 통증, 척추 경직 및 기형 등","연구 확장 영역 류마티스 관절염, 골관절염, 강직성 척추염, 통풍 등 각종 만성 난치성 류마티스 질환","R&D 포인트 대량의 충류약에 포함된 이종 단백질, 아미노산 및 생물학적 활성 물질의 면역 조절 및 관절 활막 염증 억제 기전 분석 낙맥어조絡脈瘀阻 및 골수 침범 병기에 따른 파혈산결破血散結 및 연골세포 증식 억제·회복 작용 검증 장기 투여 시의 약물 대사 안정성 확보 및 뼈·관절 파괴 예방 제제 최적화","①익신양음 · 보신장골 益腎養陰 · 補腎壯骨 생지황 숙지황 음양곽 골쇄보 당귀 계혈등 연호색 토별충 근본을 다스려 뼈와 신장을 보함","②보혈활혈 · 거풍통락 補血活血 · 祛風通絡 포천산갑 심골풍 노관초 서장경 호장 율초 녹함초 기혈을 소통시키고 경락의 풍습을 제거함","③수풍척사 · 견비통락 搜風剔邪 · 蠲痹通絡 전갈 강잠 오공 지룡 노봉방 오초사 충류 약의 특성을 활용하여 깊숙이 침입한 사기를 찾아내 제거함","충약수척蟲藥搜剔, 찬투척사鑽透剔邪 대량의 충류약으로 뼛속 깊이 침입한 사기를 샅샅이 뒤져 제거함","구통다어久痛多瘀, 구통입락久痛入絡 낙맥이 어조瘀阻되고 담어가 교결하여 골격과 관절을 침식함","익신장독益腎壯督, 보신배본補腎培本 신을 보익하고 독맥을 튼튼하게 하여 본本을 다스림","공보겸시·표본동치攻補兼施,標本同治 거사와 보익을 병행하여 정기 손상을 방지하고 장기 치료를 도모함","Th17/Treg Immunomodulation SDF-1/CXCR4 경로 기반 면역 불균형 교정 익신견비환 약물 투여 동물의 골수액이 SDF-1/CXCR4–PI3K/Akt 신호를 억제해 Th17 관련 인자(RORγt·IL-17)를 낮추고 Treg 관련 인자(FoxP3·IL-10)를 높였다는 결과가 있음 이를 근거로 메토트렉세이트에 충분히 반응하지 않는 류마티스 관절염 환자에서 병용 효과와 Th17/Treg 비율의 바이오마커 가능성을 함께 검증 검증 설계 콜라겐 유도 관절염(CIA) 모델에서 MTX 단독 / 익신견비환 단독 / 병용 비교 후, 임상에서는 MTX 병용 무작위 대조로 ACR20 반응률과 DAS28, 말초혈액 Th17/Treg 비율을 측정 근거 직접 연구 근거 참고문헌 [5](2026, SDF-1/CXCR4), 본문 「병용 전략」 (메토트렉세이트)","Bone Erosion 파골세포 분화 억제를 통한 관절 골미란 진행 차단 본문 연구 동향에서 파골세포·ephrinB2·JAK2/STAT3가 평가 지표로 제시됨 증상 개선보다 영상학적 골미란 진행 억제를 차별화 지표로 삼아 RANKL/OPG 축과 파골세포 분화 억제를 확인 검증 설계 CIA 랫드에서 micro-CT 골미란 점수와 TRAP 염색 파골세포 수를 측정하고, 임상에서는 1년 방사선 진행(mTSS) 변화를 2차 지표로 설정 근거 직접 연구 근거 본문 「평가 지표」 표(파골세포·ephrinB2·JAK2/STAT3)","Bone Loss Comorbidity 신허형 류마티스 관절염의 이차성 골다공증 동반 관리 숙지황·음양곽·골쇄보 등 보신약 구성은 관절 염증과 함께 진행하는 전신 골소실 관리로 연결할 수 있음 신허형으로 분류된 환자를 선별하여 골밀도와 골대사 표지자(CTX·P1NP)를 함께 추적하는 설계가 적합 검증 설계 신허형 변증 기준으로 선별한 RA 환자에서 12개월 골밀도(DXA)와 CTX·P1NP 변화를 관찰 근거 임상 경험 보고 본문 주치증(신허형 RA·골다공증), 참고문헌 [4](류마티스 치료 학술사상)","Restricted Herbs 천산갑·심골풍 등 국내 공정서에 없는 약재의 대체 炮천산갑은 모든 종이 국제거래협약(CITES) 부속서 I에 등재되어 2020년 중국약전에서도 빠졌고, 현행 허가 제품(20미)에서도 빠져 있음. 반면 심골풍尋骨風은 아리스톨로크산 함유 약재로 현행 제품에 남아 있어 설명서에 신장 손상 경고가 붙어 있음 오초사와 함께 국내 공정서(대한민국약전·대한민국약전외한약(생약)규격집)에 수재되어 있지 않으므로, 이들 약재를 뺀 조성으로 국내 개발을 시작해야 하며, 이렇게 바꾼 조성에는 기존 제품의 유효성 자료를 그대로 적용할 수 없음 검증 설계 현행 제품 조성(20미)과 원처방(21종) 대조 → 천산갑·심골풍·오초사 제외 조성의 효력을 원처방과 비교 → 신기능을 포함한 독성·규격 자료와 원료 확보 계획을 새로 구축 근거 제품·허가 자료 본문 조성표, 참고문헌 [6](제품 정보), [7](심골풍 제외 개량 조성 특허), [10](현행 제품 설명서)"],"ss":{"composition":"그림 2-1 익신견비환益腎蠲痹丸의 모듈 구성 ①익신양음益腎養陰, 보신장골補腎壯骨 모듈 — 근본을 다스려 뼈와 신장을 보함 생지황, 숙지황, 음양곽, 골쇄보 : 생지황과 숙지황은 신정을 보하고, 음양곽과 골쇄보는 신양을 보하며 근골을 강화하여, 신허를 보완하고 근골을 튼튼하게 함 ②보혈활혈補血活血, 거풍통락祛風通絡 모듈 — 기혈을 소통시키고 경락의 풍습을 제거함 당귀, 계혈등, 연호색, 토별충, 포천산갑, 심골풍, 노관초, 서장경, 호장, 율초, 녹함초: 당귀·계혈등은 혈을 보하고 혈행을 원활하게 하며, 연호색·토별충·포천산갑은 어혈을 풀고 경락을 소통시켜 통증을 다스림. 심골풍·노관초·서장경· 호장·율초·녹함초는 풍습을 제거하고 경락을 소통시켜 비증을 해소함 ③수풍척사搜風剔邪, 견비통락蠲痹通絡 모듈 — 충류 약의 특성을 활용하여 깊숙이 침입한 사기를 찾아내 제거함 전갈, 강잠, 오공, 지룡, 노봉방, 오초사 : 생체 활성 물질이 풍부한 혈육유정血肉有情의 충류약으로, 수풍척사, 견비통락의 작용을 하여 깊숙이 침입한 사기를 찾아내 제거함","master":"①완비頑痹의 병인병기 이론 질환의 범주와 특징 : 류마티스 관절염, 강직성 척추염 등 만성 난치성 비증을 ‘완비頑痹’로 규정함. 일반 비증과 달리 병정이 길고 반복되며 통증·종창·강직 등이 지속되고, 병사가 경락을 넘어 근골과 관절 깊숙이 침입한다고 봄 ‘사구四久’를 핵심 병기로 제시 : “구통입락久痛入絡, 구통다어久痛多瘀, 구병다허久病多虛, 구필급신久必及腎”을 완비의 병리적 특징으로 봄. 오래된 통증은 낙맥으로 깊어지고 어혈이 생기며, 장기간의 질병은 기혈을 소모하여 허증을 초래하고, 결국 간신肝腎에 영향을 미친다고 인식함 정허사련正虛邪戀과 허실착잡 : 정기正氣가 부족한 상태에서 풍風, 한寒, 습濕, 열熱 등의 외사가 침입하여 경락을 막고, 습이 오래되면 담이 되고, 혈행이 막히면 어혈이 형성되어 담어痰瘀가 관절에 유착함. 따라서 정허正虛와 사실邪實이 함께 존재하는 병증으로 봄 ②익신장독益腎壯督, 견비통락蠲痹通絡의 치료 원칙 익신장독益腎壯督으로 본本을 치료 : 만성 완비는 오래될수록 신腎과 양기陽氣가 손상된다고 보아 신을 보하고 독맥을 튼튼하게 하여 양기를 북돋우는 것을 치료의 근본으로 삼음 견비통락蠲痹通絡으로 표標를 치료 : 풍한습 등의 외사와 담어痰瘀로 막힌 경락을 소통시켜 통증과 종창을 제거함. 즉 익신장독과 견비통락을 병행하여 본허표실本虛標實을 함께 치료함 표본동치標本同治, 공 염, 쇼그렌 증후군","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":91,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-2 배보신양탕培補腎陽湯의 모듈 구성<\/p><h4>①온보신양溫補腎陽 모듈 — 신양을 온화하게 보하여 명문화命門火를 북돋움<\/h4><p><b>음양곽, 선모<\/b>: 음양곽은 보신장양補腎壯陽하고 강근골强筋骨하여 신양을 온화하게 보하며, 선모는 온신장양溫腎壯陽하고 거한습祛寒濕하여 음양곽과 배합되어 신양을 따뜻하게 돕고 하초의 한습을 제거함<\/p><h4>②자음양혈생양滋陰養血生陽 모듈 — 음혈을 자양하고 간신을 보강해서 양기가 생겨나는 물질적 근원을 제공함<\/h4><p><b>산약, 구기자<\/b>: 산약은 익기양음益氣養陰하고 보비폐신補脾肺腎하여 비·폐·신을 보하고, 구기자는 자보간신滋補肝腎하고 익정益精하여 간신의 음정陰精을 보함. 두 약을 배합하여 음정을 보충함으로써 온양약의 편조偏燥한 성질을 완화하고 음중구양陰中求陽의 배합 원칙을 뒷받침함<\/p><h4>③반본환원조화反本還元調和 모듈 — 선천의 정혈과 후천의 기혈을 원천적으로 대보大補하고 약성을 조화롭게 함<\/h4><p><b>자하거, 감초<\/b>: 자하거는 온신보정溫腎補精하고 익기양혈益氣養血하는 혈육유정血肉有情의 약으로서 신정과 기혈을 보하고, 감초는 보비익기補脾益氣하고 조화제약調和諸藥하여 비위를 보하고 처방 내 약물의 성질을 조화시킴<\/p>"},{"k":"master","t":"주량춘의 신양허쇠腎陽虛衰 비증痹證 치료","html":"<h4>①병기 인식 — 신독공허腎督空虛와 원양쇠약元陽衰弱<\/h4><p><b>본本과 표標의 파악<\/b>: 만성 난치성 비증에서는 신腎과 독맥督脈의 허손을 병의 근본으로 보고, 신양허쇠腎陽虛衰와 신독공허腎督空虛를 중요한 병기로 파악함. 정허正虛를 바탕으로 풍한습열 등의 외사가 침입하고 담어痰瘀가 경락에 정체되어 통증과 관절의 기능장애를 일으킨다고 봄<\/p><p><b>부자, 육계 남용의 경계<\/b>: 신양허쇠라고 하여 부자, 육계 등 온열조열溫熱燥熱한 약물을 과도하게 사용하면, 도리어 신음腎陰을 상하게 하고 진액을 말려 ‘독화毒火’를 일으키므로 신중해야 함을 강조함<\/p><h4>②치료 원칙 — 온이불조溫而不燥와 음중구양陰中求陽<\/h4><p><b>온이불조<\/b>: “온보하되 약성이 강하고 조열한 온양약을 과도하게 사용하지 않고, 신양을 보하면서도 음액을 손상시키지 않는다”는 치료 원칙을 주장함. 음양곽, 선모의 온평溫平한 온양약으로 명문화의 불길을 점진적으로 되살림<\/p><p><b>음중구양<\/b>: 장경악의 이론을 발전시켜, 구기자, 산약과 같은 자음보정滋陰補精 약재를 함께 배합함. 이는 양기가 생성될 바탕인 음혈陰血을 두텁게 해서 “양기가 음의 조력을 얻어 그 생화生化가 무궁해지도록” 유도하고 온양약의 건조한 부작용을 완화함<\/p><p><b>혈육유정血肉有情의 반본환원反本還元<\/b>: 자하거를 핵심 약재로 사용해서 선천의 정기와 후천의 기혈을 동시에 원천적으로 복원함. 호르몬 균형과 면역 기능 회복에 기여하는 것으로 해석함<\/p><h4>③질환별 특수 변증 사상 및 임상 응용<\/h4><p><b>강직성 척추염<\/b>: ‘익신장독益腎壯督’을 본치本治로 삼아 척추 변형을 막고, 풍한습열 및 어혈을 제거하는 약재를 배합해서 ‘견비통락蠲痹通絡’을 달성함. 장기적인 스테로이드 투여로 인한 부신피질 기능 위축을 배보신양탕으로 보완해서 약물 감량 때 나타나는 리바운드 현상을 완화함<\/p><p><b>류마티스 관절염 속발 골다공증<\/b>: ‘신주골생수腎主骨生髓’ 원칙에 따라 신을 보하고 신양을 북돋워 골수와 근골을 보강함. 골대사를 개선해서 파골세포의 과도한 활성을 억제하고 골밀도를 유지하는 것을 목표로 함<\/p><p><b>건조증후군(쇼그렌 증후군)<\/b>: 단지 자음윤조滋陰潤燥하는 진액 약재만 사용하면 비위가 약해지고 진액이 기화氣化되지 못함. ‘양능화음陽能化陰, 기능화진氣能化津’ 기전에 따라 배보신양탕의 온양한 기운으로 체내 진액 분비를 촉진하는 음양병보陰陽並補 치료법을 제시함<\/p><p><b>허성 고혈압 및 난치성 내과 질환<\/b>: 음양양허陰陽兩虛 및 허양상요虛陽上擾로 발생하는 난치성 고혈압, 만성 피로, 월경불순 등에 원양元陽을 뿌리부터 조율해서 상하, 음양의 균형을 되찾아줌<\/p><h4>④증상 및 병태에 따른 가감<\/h4><p class=\"lbl2\">신음부족 및 간신음허가 현저할 때<\/p><p class=\"sub\"><b>신음부족이 심할 때<\/b>: 생지황, 숙지황 각 15g, 여정자10g, 백합12g 추가<\/p><p class=\"sub\"><b>간신음허를 겸할 때<\/b>: 生백작약, 사원자 각 10g 추가<\/p><p><b>비신양허脾腎陽虛로 대변이 묽거나 설사할 때<\/b>: 보골지, 익지인, 녹각상, 炒백출 각 10g 추가<\/p><p class=\"lbl2\">강직성 척추염 및 관절 질환<\/p><p class=\"sub\"><b>한사寒邪가 우세할 때<\/b>: 계지12g, 세신8g 추가<\/p><p class=\"sub\"><b>풍사風邪가 우세할 때<\/b>: 해풍등12g, 독활12g 추가<\/p><p class=\"sub\"><b>습사濕邪가 우세할 때<\/b>: 의이인15g, 창출12g, 生백출12g 추가<\/p><p class=\"sub\"><b>열사熱邪가 우세할 때<\/b>: 한수석10g, 복령15g, 지모12g 추가<\/p><p class=\"sub\"><b>관절 요통 및 어혈이 극심할 때<\/b>: 노봉방, 토별충, 오초사 각 10g 추가<\/p><p class=\"lbl2\">건조증후군 및 기타 동반 증상 가감<\/p><p class=\"sub\"><b>심번, 불면, 심계를 동반할 때<\/b>: 당삼, 炒백출, 용안육, 당귀 각 10g, 炒산조인20g 추가<\/p><p class=\"sub\"><b>허양상요虛陽上擾로 인한 고혈압<\/b>: 生모려30g, 자패치15g, 현삼20g 추가<\/p><p class=\"sub\"><b>부종을 동반할 때<\/b>: 숙부편, 炒백출, 복령 각 10g 추가<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">강직성 척추염 대상 한의·한방 치료 수요는 있으나 공개자료상 제품·특허가 확인되지 않아, 익신견비환과의 비교 관점에서 보신 강화 처방의 위치를 정리하는 것이 우선<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕팡,정푸쩡.주량춘의 류마티스 관절염 이차성 골다공증 치료 학술사상朱良春治療類風濕關節炎繼發骨質疏松症學術思想[J].중국중의기초의학잡지中國中醫基礎醫學雜志,2021,27(5):742-744+764.<\/li><li class=\"ref\">[2] 저우수베이,정푸쩡,잔쥔핑.국의대사 주량춘의 배보신양탕을 활용한 강직성 척추염치료 임상 경험國醫大師朱良春運用培補腎陽湯治療强直性脊柱炎臨床經驗[J].시진국의국약時珍國醫國藥,2020,31(4):966-967.<\/li><li class=\"ref\">[3] 위즈모우,리샹,추이란,등.주량춘 교수의 배보신양탕을 활용한 ‘음양병보’ 건조증후군 치료 경험 소개朱良春教授培補腎陽湯“陰陽並補”治療乾燥綜合征經驗介紹[J].세계중서의결합잡지世界中西醫結合雜志,2019,14(3):340-343.<\/li><li class=\"ref\">[4] 뤼쩌캉,리이썬.‘배보신양탕’의 방의와 활용 경험培補腎陽湯方義與應用體會[J].환구중의약環球中醫藥,2015,8(12):1509-1510.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"음양곽15g","name":"음양곽","dose":"15g","base":"음양곽"},{"raw":"선모10g","name":"선모","dose":"10g","base":"선모"},{"raw":"산약15g","name":"산약","dose":"15g","base":"산약"},{"raw":"구기자10g","name":"구기자","dose":"10g","base":"구기자"},{"raw":"자하거6~10g","name":"자하거","dose":"6~10g","base":"자하거"},{"raw":"炙감초5g","name":"炙감초","dose":"5g","base":"감초"}],"notes":[],"핵심 효능":["신양을 온화하게 보하여 명문화命門火를 북돋움(온보신양溫補腎陽)","음을 자양하고 정精을 보익하여 음중구양陰中求陽을 도모함(자음익정滋陰益精)","후천의 근본인 비위를 튼튼히 하여 선천의 원기를 보충함(건비배원健脾培元)"],"주치증":["신양허쇠腎陽虛衰, 명문화쇠命門火衰, 신음양양허腎陰陽兩虛로 인한 만성 난치성 질환. 강직성 척추염, 류마티스 관절염 및 속발성 골다공증, 쇼그렌 증후군, 허성 고혈압, 완고성 불면증, 천식, 월경불순, 양위陽痿, 만성 신장병, 만성 피로 등"],"연구 확장 영역":["류마티스 관절염 및 난치성 관절질환, 속발성 골 손실 및 골다공증 방지, 강직성 척추염의 척추 관절 변형 억제, 쇼그렌 증후군의 외분비선 기능 회복 및 음양병보陰陽並補 요법, 시상하부-뇌하수체-부신축(HPA Axis) 기능 조절, 장기 스테로이드 투여 후 리바운드 완화"],"R&D 포인트":["음양곽, 선모 배합의 HPA 축 및 성호르몬 관련 내분비 기능 조절과 부신피질 호르몬 분비 조절 작용을 검증","산약, 구기자의 음중구양陰中求陽 기전을 통한 선모, 음양곽의 온조溫燥한 약성 완화 및 면역세포 보호 효과를 규명","자하거, 감초 배합의 반본환원反本還元 효과, 정혈 보충 및 면역 항상성 조절 효과를 검증","온이불조溫而不燥한 배합을 통한 장기 투여 때 부작용 발생 가능성 감소 및 체내 음양 자율 항상성 회복 능력을 탐색함"]},"modules":[{"name":"①온보신양","hz":"溫補腎陽","herbs":["음양곽","선모"],"role":"신양을 온화하게 보하여 명문화命門火를 북돋움"},{"name":"②자음양혈생양","hz":"滋陰養血生陽","herbs":["산약","구기자"],"role":"음혈을 자양하고 간신을 보강해서 양기가 생겨나는 물질적 근원을 제공함"},{"name":"③반본환원조화","hz":"反本還元調和","herbs":["자하거","감초"],"role":"선천의 정혈과 후천의 기혈을 원천적으로 대보大補하고 약성을 조화롭게 함"}],"rd":[{"tag":"HPA & Sex Hormone","title":"음양곽·선모 배합의 내분비 조절과 신양허 지표화","html":"<p>음양곽·선모는 이선탕二仙湯 계열의 온신양 약대임<\/p><p>코르티솔 일중 리듬·DHEA-S·성호르몬의 변화 양상을 투여 전후로 탐색하되, ‘신양허’를 코르티솔 등 단일 지표와 1:1로 대응시키지 않음 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&amp;D 논리 1 「온보신양」)<\/p>"},{"tag":"Sjögren's Syndrome","title":"쇼그렌 증후군의 음양병보 치료 효과 탐색","html":"<p>‘음양병보’로 건조증후군을 치료한 경험이 보고되었음<\/p><p>타액 분비량·쉬르머 검사·ESSPRI 점수를 지표로 한 증례 분석부터 시작하여 전향 연구 가능성을 판단 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](2019, 건조증후군 치료 경험))<\/p>"},{"tag":"Placenta Hominis","title":"자하거의 기여도와 대체 조성","html":"<p>자하거(사람 태반)는 ‘혈육유정’ 보익의 핵심 약재이지만 국내 공정서(대한민국약전· 대한민국약전외한약(생약)규격집)에 수재되어 있지 않은 인체 유래 원료임<\/p><p>자하거 유무에 따른 내분비·골대사 지표 차이를 비교하여 기여도를 확인하고 대체 조성을 정해야 함(인체 유래 원료의 사용 적법성과 안전성 검토가 선행되어야 함) (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 3 「혈육유정」)<\/p>"},{"tag":"Spondyloarthritis & Bone","title":"강직성 척추염과 이차성 골다공증 동반 관리","html":"<p>강직성 척추염과 류마티스 관절염 이차성 골다공증에 적용한 경험이 있음<\/p><p>질병 활성도(BASDAI)와 골밀도를 함께 추적하는 관찰 연구로 ‘보신’의 근골 보호 효과를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2021, 이차성 골다공증), [2](2020, 강직성 척추염))<\/p>"}],"logic":[{"n":"1","title":"온보신양溫補腎陽과 명문화命門火 점진 부양","body":"하초의 한습을 제거하고 신양을 부드럽게 덥힘"},{"n":"2","title":"자음양혈생양滋陰養血生陽과 음중구양陰中求陽","body":"정혈을 채우고 온양약의 조열한 성질을 감싸 완화함"},{"n":"3","title":"반본환원조화反本還元調和와 혈육유정血肉有情","body":"정혈을 원천 대보하고 약물의 체내 흡수를 도모함"},{"n":"4","title":"온이불조溫而不燥와 장기 투여 안정성","body":"맹렬한 조열약을 배제하고 부드러운 온양 체계로 지속적인 자가 치유를 유도함"}],"field":2,"pages":[91,95],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-2","배보신양탕","培補腎陽湯","","주량춘","朱良春","신양腎陽 부양과 정혈精血 보충으로 뼈·관절 기능과 면역 균형의 회복을 도모하여 관절염, 강직성 척추염, 자가면역질환을 치료하는 처방","음양곽15g 선모10g 산약15g 구기자10g 자하거6~10g 炙감초5g","","핵심 효능 신양을 온화하게 보하여 명문화命門火를 북돋움(온보신양溫補腎陽) 음을 자양하고 정精을 보익하여 음중구양陰中求陽을 도모함(자음익정滋陰益精) 후천의 근본인 비위를 튼튼히 하여 선천의 원기를 보충함(건비배원健脾培元)","주치증 신양허쇠腎陽虛衰, 명문화쇠命門火衰, 신음양양허腎陰陽兩虛로 인한 만성 난치성 질환. 강직성 척추염, 류마티스 관절염 및 속발성 골다공증, 쇼그렌 증후군, 허성 고혈압, 완고성 불면증, 천식, 월경불순, 양위陽痿, 만성 신장병, 만성 피로 등","연구 확장 영역 류마티스 관절염 및 난치성 관절질환, 속발성 골 손실 및 골다공증 방지, 강직성 척추염의 척추 관절 변형 억제, 쇼그렌 증후군의 외분비선 기능 회복 및 음양병보陰陽並補 요법, 시상하부-뇌하수체-부신축(HPA Axis) 기능 조절, 장기 스테로이드 투여 후 리바운드 완화","R&D 포인트 음양곽, 선모 배합의 HPA 축 및 성호르몬 관련 내분비 기능 조절과 부신피질 호르몬 분비 조절 작용을 검증 산약, 구기자의 음중구양陰中求陽 기전을 통한 선모, 음양곽의 온조溫燥한 약성 완화 및 면역세포 보호 효과를 규명 자하거, 감초 배합의 반본환원反本還元 효과, 정혈 보충 및 면역 항상성 조절 효과를 검증 온이불조溫而不燥한 배합을 통한 장기 투여 때 부작용 발생 가능성 감소 및 체내 음양 자율 항상성 회복 능력을 탐색함","①온보신양 溫補腎陽 음양곽 선모 신양을 온화하게 보하여 명문화命門火를 북돋움","②자음양혈생양 滋陰養血生陽 산약 구기자 음혈을 자양하고 간신을 보강해서 양기가 생겨나는 물질적 근원을 제공함","③반본환원조화 反本還元調和 자하거 감초 선천의 정혈과 후천의 기혈을 원천적으로 대보大補하고 약성을 조화롭게 함","온보신양溫補腎陽과 명문화命門火 점진 부양 하초의 한습을 제거하고 신양을 부드럽게 덥힘","자음양혈생양滋陰養血生陽과 음중구양陰中求陽 정혈을 채우고 온양약의 조열한 성질을 감싸 완화함","반본환원조화反本還元調和와 혈육유정血肉有情 정혈을 원천 대보하고 약물의 체내 흡수를 도모함","온이불조溫而不燥와 장기 투여 안정성 맹렬한 조열약을 배제하고 부드러운 온양 체계로 지속적인 자가 치유를 유도함","HPA & Sex Hormone 음양곽·선모 배합의 내분비 조절과 신양허 지표화 음양곽·선모는 이선탕二仙湯 계열의 온신양 약대임 코르티솔 일중 리듬·DHEA-S·성호르몬의 변화 양상을 투여 전후로 탐색하되, ‘신양허’를 코르티솔 등 단일 지표와 1:1로 대응시키지 않음 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&D 논리 1 「온보신양」)","Sjögren's Syndrome 쇼그렌 증후군의 음양병보 치료 효과 탐색 ‘음양병보’로 건조증후군을 치료한 경험이 보고되었음 타액 분비량·쉬르머 검사·ESSPRI 점수를 지표로 한 증례 분석부터 시작하여 전향 연구 가능성을 판단 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](2019, 건조증후군 치료 경험))","Placenta Hominis 자하거의 기여도와 대체 조성 자하거(사람 태반)는 ‘혈육유정’ 보익의 핵심 약재이지만 국내 공정서(대한민국약전· 대한민국약전외한약(생약)규격집)에 수재되어 있지 않은 인체 유래 원료임 자하거 유무에 따른 내분비·골대사 지표 차이를 비교하여 기여도를 확인하고 대체 조성을 정해야 함(인체 유래 원료의 사용 적법성과 안전성 검토가 선행되어야 함) (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 3 「혈육유정」)","Spondyloarthritis & Bone 강직성 척추염과 이차성 골다공증 동반 관리 강직성 척추염과 류마티스 관절염 이차성 골다공증에 적용한 경험이 있음 질병 활성도(BASDAI)와 골밀도를 함께 추적하는 관찰 연구로 ‘보신’의 근골 보호 효과를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2021, 이차성 골다공증), [2](2020, 강직성 척추염))"],"ss":{"composition":"그림 2-2 배보신양탕培補腎陽湯의 모듈 구성 ①온보신양溫補腎陽 모듈 — 신양을 온화하게 보하여 명문화命門火를 북돋움 음양곽, 선모 : 음양곽은 보신장양補腎壯陽하고 강근골强筋骨하여 신양을 온화하게 보하며, 선모는 온신장양溫腎壯陽하고 거한습祛寒濕하여 음양곽과 배합되어 신양을 따뜻하게 돕고 하초의 한습을 제거함 ②자음양혈생양滋陰養血生陽 모듈 — 음혈을 자양하고 간신을 보강해서 양기가 생겨나는 물질적 근원을 제공함 산약, 구기자 : 산약은 익기양음益氣養陰하고 보비폐신補脾肺腎하여 비·폐·신을 보하고, 구기자는 자보간신滋補肝腎하고 익정益精하여 간신의 음정陰精을 보함. 두 약을 배합하여 음정을 보충함으로써 온양약의 편조偏燥한 성질을 완화하고 음중구양陰中求陽의 배합 원칙을 뒷받침함 ③반본환원조화反本還元調和 모듈 — 선천의 정혈과 후천의 기혈을 원천적으로 대보大補하고 약성을 조화롭게 함 자하거, 감초 : 자하거는 온신보정溫腎補精하고 익기양혈益氣養血하는 혈육유정血肉有情의 약으로서 신정과 기혈을 보하고, 감초는 보비익기補脾益氣하고 조화제약調和諸藥하여 비위를 보하고 처방 내 약물의 성질을 조화시킴","master":"①병기 인식 — 신독공허腎督空虛와 원양쇠약元陽衰弱 본本과 표標의 파악 : 만성 난치성 비증에서는 신腎과 독맥督脈의 허손을 병의 근본으로 보고, 신양허쇠腎陽虛衰와 신독공허腎督空虛를 중요한 병기로 파악함. 정허正虛를 바탕으로 풍한습열 등의 외사가 침입하고 담어痰瘀가 경락에 정체되어 통증과 관절의 기능장애를 일으킨다고 봄 부자, 육계 남용의 경계 : 신양허쇠라고 하여 부자, 육계 등 온열조열溫熱燥熱한 약물을 과도하게 사용하면, 도리어 신음腎陰을 상하게 하고 진액을 말려 ‘독화毒火’를 일으키므로 신중해야 함을 강조함 ②치료 원칙 — 온이불조溫而不燥와 음중구양陰中求陽 온이불조 : “온보하되 약성이 강하고 조열한 온양약을 과도하게 사용하지 않고, 신양을 보하면서도 음액을 손상시키지 않는다”는 치료 원칙을 주장함. 음양곽, 선모의 온평溫平한 온양약으로 명문화의 불길을 점진적으로 되살림 음중구양 : 장경악의 이론을 발전시켜, 구기자, 산약과 같은 자음보정滋陰補精 약재를 함께 배합함. 이는 양기가 생성될 바탕인 음혈陰血을 두텁게 해서 “양기가 음의 조력을 얻어 그 생화生化가 무궁해지도록” 유도하고 온양약의 건조한 부작용을 완화함 혈육유정血肉有情의 반본환원反本還元 : 자하거를 핵심 약재로 사용해서 선천의 정기와 후천의 기혈을 동시에 원천적으로 복원함. 호르몬 균형과 면역 기능 회복에 기여하는 것으로 해석함 ③질환별 특수 변증 사상 및 임상 응용 강직성 척추염 : ‘익신장독益腎壯督’을 본치本治로 삼아 척추 변형을 막고, 풍한습열 및 어혈을 제거하는 약재를 배합해서 ‘견비통락蠲痹通絡’을 달성함. 장기적인 스테로이드 투여로 인한 부신피질 기능 위축을 배보신양탕으로 보완해서 약물 감량 때 나타나는 리바운드 현상을 완화함 류마티스 관절염 속발 골다공증 : ‘신주골생수腎主骨生髓’ 원칙에 따라 신을 보하고 신양을 북돋워 골수와 근골을 보강함. 골대사를 개선해서 파골세포의 과도한 활성을 억제하고 골밀도를 유지하는 것을 목표로 함 건조증후군(쇼그렌 증후군) : 단지 자음윤조滋陰潤燥하는 진액 약재만 사용하면 비위가 약해지고 진액이 기화氣化되지 못함. ‘양능화음陽能化陰, 기능화진氣能化津’ 기전에 따라 배보신양탕의 온양한 기운으로 체내 진액 분비를 촉진하는 음양병보陰陽並補 치료법을 제시함 허성 고혈압 및 난치성 내과 질환 : 음양양허陰陽兩虛 및 허양상요虛陽上擾로 발생하는 난치성 고혈압, 만성 피로, 월경불순 등에 원양元陽을 뿌리부터 조율해서 상하, 음양의 균형을 되찾아줌 ④증상 및 병태에 따른 가감 신음부족 및 간신음허가 현저할 때 신음부족이 심할 때 : 생지황, 숙지황 각 15g, 여정자10g, 백합12g 추가 간신음허를 겸할 때 : 生백작약, 사원자 각 10g 추가 비신양허脾腎陽虛로 대변이 묽거나 설사할 때 : 보골지, 익지인, 녹각상, 炒백출 각 10g 추가 강직성 척추염 및 관절 질환 한사寒邪가 우세할 때 : 계지12g, 세신8g 추가 풍사風邪가 우세할 때 : 해풍등12g, 독활12g 추가 습사濕邪가 우세할 때 : 의이인15g, 창출12g, 生백출12g 추가 열사熱邪가 우세할 때 : 한수석10g, 복령15g, 지모12g 추가 관절 요통 및 어혈이 극심할 때 : 노봉방, 토별충, 오초사 각 10g 추가 건조증후군 및 기타 동반 증상 가감 심번, 불면, 심계를 동반할 때 : 당삼, 炒백출, 용안육, 당귀 각 10g, 炒산조인20g 추가 허양상요虛陽上擾로 인한 고혈압 : 生모려30g, 자패치15g, 현삼20g 추가 부종을 동반할 때 : 숙부편, 炒백출, 복령 각 10g 추가","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 강직성 척추염 대상 한의·한방 치료 수요는 있으나 공개자료상 제품·특허가 확인되지 않아, 익신견비환과의 비교 관점에서 보신 강화 처방의 위치를 정리하는 것이 우선 참고문헌 [1] 왕팡,정푸쩡.주량춘의 류마티스 관절염 이차성 골다공증 치료 학술사상朱良春治療類風濕關節炎繼發骨質疏松症學術思想[J].중국중의기초의학잡지中國中醫基礎醫學雜志,2021,27(5):742-744+764. [2] 저우수베이,정푸쩡,잔쥔핑.국의대사 주량춘의 배보신양탕을 활용한 강직성 척추염치료 임상 경험國醫大師朱良春運用培補腎陽湯治療强直性脊柱炎臨床經驗[J].시진국의국약時珍國醫國藥,2020,31(4):966-967. [3] 위즈모우,리샹,추이란,등.주량춘 교수의 배보신양탕을 활용한 ‘음양병보’ 건조증후군 치료 경험 소개朱良春教授培補腎陽湯“陰陽並補”治療乾燥綜合征經驗介紹[J].세계중서의결합잡지世界中西醫結合雜志,2019,14(3):340-343. [4] 뤼쩌캉,리이썬.‘배보신양탕’의 방의와 활용 경험培補腎陽湯方義與應用體會[J].환구중의약環球中醫藥,2015,8(12):1509-1510."}},{"id":"2-3","ko":"비통탕","hz":"痹通湯","alias":"","master_ko":"주량춘","master_hz":"朱良春","tagline":"신양허손腎陽虛損과 담어조체痰瘀阻滯의 병기를 다스려, 성인 스틸병(AOSD) 및 각종 비증痹證을 치료하는 처방","meta":{"주요 적응증":"성인 스틸병, 각종 비증痹證","확인된 연구자료 유형":"경험 보고","제형·제품화":"같은 계열 특허 (거절)"},"page":96,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-3 비통탕痹通湯의 모듈 구성<\/p><h4>①보신조양補腎助陽, 보혈활혈補血活血 모듈 — 신양을 돕고 혈을 보충하며 혈행을 원활하게 하여 기혈 순행의 토대를 마련함<\/h4><p><b>당귀<\/b>: 혈을 보하고 혈행을 원활하게 하여 기혈 순행을 도움<\/p><p><b>계혈등<\/b>: 혈을 보하고 혈행을 활발하게 하며 경락을 소통시킴<\/p><p><b>노봉방<\/b>: 신양을 돕고 몸의 근본적인 양기를 북돋우며 체내의 풍한습사風寒濕邪를 제거함<\/p><h4>②통락화어通絡化瘀 모듈 — 위령선과 충류 약물을 배합하여 경락을 소통시키고, 깊숙이 정체된 어혈과 사기를 제거함<\/h4><p><b>위령선<\/b>: 경락을 소통시키고 비증으로 인한 관절의 굴신불리와 통증을 완화함<\/p><p><b>토별충, 강잠, 오초사<\/b>: 투과력이 강한 충류 약물의 특성을 활용하여 경락 깊숙이 침입한 사기를 제거하고 어혈을 풀어 기혈의 순행을 도움<\/p><h4>③조화제약調和諸藥 모듈 — 여러 약재의 약성을 조화롭게 함<\/h4><p><b>감초<\/b>: 여러 약재의 약성을 조화시키고 처방 전체의 배합을 조절함<\/p>"},{"k":"master","t":"주량춘의 성인 스틸병 치료","html":"<h4>①병인병기 이론<\/h4><p><b>질환의 범주<\/b>: 전통 의학 고전에 성인 스틸병(AOSD)이라는 명칭은 없으나, 임상적 특징에 따라 ‘비병痹病’, ‘열비熱痹’, ‘풍습열風濕熱’, ‘온병溫病’ 등의 범주로 봄<\/p><p><b>신양허腎陽虛가 병의 근본<\/b>: 신은 선천의 본으로 신양은 인체 양기와 생명 활동의 근본 동력임. 대사는 신양이 허쇠하면 온몸의 방어력과 기화 능력이 저하되어 외사를 스스로 물리치지 못하게 되므로, 신양허가 본 병의 근본 원인이 된다고 봄<\/p><p><b>담어호결痰瘀互結과 증상 발현<\/b>: 풍·한·습·열의 사기가 침입한 뒤 정기가 이를 극복하지 못해 체내 진액이 응결되어 담痰이 되고, 이 담과 열이 서로 엉켜 기혈 순행을 가로막아 어혈瘀血을 형성함. 이 어혈이 경맥과 관절 사이에 교착되어 발열, 관절 종통, 피하 홍반 등의 증상을 일으킴<\/p><h4>②비통탕의 효능 해설<\/h4><p><b>보신조양補腎助陽<\/b>: 신양을 돕고 몸의 근본적인 양기를 북돋워 전신의 기화 기능과 면역 방어력을 끌어올림. 성인 스틸병이나 난치성 비증처럼 고열과 전신 염증이 반복될 때, 단순히 염증을 끄는 소염 위주의 접근에서 벗어나 근본적인 양기를 북돋움으로써 인체 스스로 사기를 밖으로 몰아내도록 유도하는 치료 전략임<\/p><p><b>화어통락化瘀通絡<\/b>: 담어조체痰瘀阻滯로 인해 경락과 관절 깊숙이 막힌 기혈과 묵은 어혈을 소통시킴. 위령선과 투과력이 강한 충류 약물(토별충, 강잠, 오초사)을 동원하여 뼈마디 사이와 깊은 혈맥의 미세순환을 가로막는 어혈을 샅샅이 뒤져서 수척搜剔하고, 막힌 기혈을 소통시킴으로써 통증과 종창을 해소함<\/p><p><b>견열투량見熱投涼의 전통적 오류 타파<\/b>: 발열 증상이 나타날 때 무조건 한량寒涼한 약재로 열을 끄려 하면 인체의 소중한 양기가 더욱 손상되어 병세를 악화시킨다고 보았음. 이에 반하여 온양溫陽과 함께 부정거사扶正祛邪의 도를 취함<\/p><h4>③겸증 가감<\/h4><p><b>한사寒邪가 성할 때<\/b>: 계지, 세신 등을 가미함<\/p><p><b>풍사風邪가 성할 때<\/b>: 해풍등, 독활 등을 가미함<\/p><p><b>습사濕邪가 성할 때<\/b>: 의이인, 토복령, 창출, 生백출 등을 가미함<\/p><p><b>열사熱邪가 성할 때<\/b>: 한수석, 복령, 지모 등을 가미함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품은 확인되지 않음. 같은 이름의 비통탕痹通湯 특허 출원(난퉁량춘중의약임상연구소)과 비통탕痹痛湯 특허 출원 (주량춘)이 계혈등·토별충·강잠·오초사·노봉방 등 충류 약재를 공유하는 같은 계열 조성이나, 두 출원 모두 심사에서 거절됨(2014·2021년)[2][3]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">같은 계열 조성이 중국에서 공개되었으나 권리화되지 않았으므로, 국내는 스틸병 등 용도 중심으로 접근하되 국내 출원 전 선행 문헌을 검토해야 하며, 국내 공정서에 없는 오초사는 대체 약재를 검토해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 진하오린,주완화,저우쯔펑,등.국의대사의 성인 스틸병 치료 경험國醫大師治療成人斯蒂爾病的經驗[J].후난중의약대학학보湖南中醫藥大學學報,2023,43(2):185-188.<\/li><li class=\"ref\">[2] 주량춘朱良春 등.비통탕 및 그 용도痹通湯及其用途:CN109453283A[P/OL].<a href=\"https://patents.google.com/patent/CN109453283A.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN109453283A.<\/a><\/li><li class=\"ref\">[3] 주량춘朱良春.비통탕 및 그 용도痹痛湯及其用途:CN102552630A[P/OL].<a href=\"https://patents.google.com/patent/CN102552630A.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN102552630A.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당귀10g","name":"당귀","dose":"10g","base":"당귀"},{"raw":"계혈등30g","name":"계혈등","dose":"30g","base":"계혈등"},{"raw":"위령선30g","name":"위령선","dose":"30g","base":"위령선"},{"raw":"토별충10g","name":"토별충","dose":"10g","base":"토별충"},{"raw":"강잠10g","name":"강잠","dose":"10g","base":"강잠"},{"raw":"오초사10g","name":"오초사","dose":"10g","base":"오초사"},{"raw":"노봉방10g","name":"노봉방","dose":"10g","base":"노봉방"},{"raw":"감초6g","name":"감초","dose":"6g","base":"감초"}],"notes":[],"핵심 효능":["신을 보하고 양기를 도와 전신의 기화 기능과 방어 기능을 강화함(보신조양補腎助陽)","담어痰瘀로 막힌 경락을 소통시키고 깊숙이 정체된 어혈을 제거함(화어통락化瘀通絡)"],"주치증":["성인 스틸병(AOSD), 류마티스 관절염, 요추 간판 탈출증, 경피증, 신경성 두통, 월경 불순 등 각종 난치성 비증痹證"],"연구 확장 영역":["자가면역성 질환, 류마티스 관절염, 만성 염증성 질환, 난치성 통증 질환 등"],"R&D 포인트":["오초사, 토별충, 강잠, 노봉방 등 충류 약물의 수척搜剔 작용이 면역염증 반응 및 관절종통 완화에 미치는 기전 분석","계혈등, 당귀 등의 보혈 및 혈행 개선 작용이 만성 염증 조직의 미세순환 회복에 미치는 영향 연구","온양溫陽 및 부정扶正 배합이 스테로이드 감량 가능성과 이상반응에 미치는 병용 효  침입한 사기를 제거하고 어혈을 풀어 기혈의 순행을 도움 ③조화제약調和諸藥 모듈 — 여러 약재의 약성을 조화롭게 함 감초 : 여러 약재의 약성을 조화시키고 처방 전체의 배합을 조절함","master":"①병인병기 이론 질환의 범주 : 전통 의학 고전에 성인 스틸병(AOSD)이라는 명칭은 없으나, 임상적 특징에 따라 ‘비병痹病’, ‘열비熱痹’, ‘풍습열風濕熱’, ‘온병溫病’ 등의 범주로 봄 신양허腎陽虛가 병의 근본 : 신은 선천의 본으로 신양은 인체 양기와 생명 활동의 근본 동력임. 대사는 신양이 허쇠하면 온몸의 방어력과 기화 능력이 저하되어 외사를 스스로 물리치지 못하게 되므로, 신양허가 본 병의 근본 원인이 된다고 봄 담어호결痰瘀互結과 증상 발현 : 풍·한·습·열의 사기가 침입한 뒤 정기가 이를 극복하지 못해 체내 진액이 응결되어 담痰이 되고, 이 담과 열이 서로 엉켜 기혈 순행을 가로막아 어혈瘀血을 형성함. 이 어혈이 경맥과 관절 사이에 교착되어 발열, 관절 종통, 피하 홍반 등의 증상을 일으킴 ②비통탕의 효능 해설 보신조양補腎助陽 : 신양을 돕고 몸의 근본적인 양기를 북돋워 전신의 기화 기능과 면역 방어력을 끌어올림. 성인 스틸병이나 난치성 비증처럼 고열과 전신 염증이 반복될 때, 단순히 염증을 끄는 소염 위주의 접근에서 벗어나 근본적인 양기를 북돋움으로써 인체 스스로 사기를 밖으로 몰아내도록 유도하는 치료 전략임 화어통락化瘀通絡 : 담어조체痰瘀阻滯로 인해 경락과 관절 깊숙이 막힌 기혈과 묵은 어혈을 소통시킴. 위령선과 투과력이 강한 충류 약물(토별충, 강잠, 오초사)을 동원하여 뼈마디 사이와 깊은 혈맥의 미세순환을 가로막는 어혈을 샅샅이 뒤져서 수척搜剔하고, 막힌 기혈을 소통시킴으로써 통증과 종창을 해소함 견열투량見熱投涼의 전통적 오류 타파 : 발열 증상이 나타날 때 무조건 한량寒涼한 약재로 열을 끄려 하면 인체의 소중한 양기가 더욱 손상되어 병세를 악화시킨다고 보았음. 이에 반하여 온양溫陽과 함께 부정거사扶正祛邪의 도를 취함 ③겸증 가감 한사寒邪가 성할 때 : 계지, 세신 등을 가미함 풍사風邪가 성할 때 : 해풍등, 독활 등을 가미함 습사濕邪가 성할 때 : 의이인, 토복령, 창출, 生백출 등을 가미함 열사熱邪가 성할 때 : 한수석, 복령, 지모 등을 가미함","rd":"","china":"중국 제품화 현황 허가 제품은 확인되지 않음. 같은 이름의 비통탕痹通湯 특허 출원(난퉁량춘중의약임상연구소)과 비통탕痹痛湯 특허 출원 (주량춘)이 계혈등·토별충·강잠·오초사·노봉방 등 충류 약재를 공유하는 같은 계열 조성이나, 두 출원 모두 심사에서 거절됨(2014·2021년)[2][3] 시사점 같은 계열 조성이 중국에서 공개되었으나 권리화되지 않았으므로, 국내는 스틸병 등 용도 중심으로 접근하되 국내 출원 전 선행 문헌을 검토해야 하며, 국내 공정서에 없는 오초사는 대체 약재를 검토해야 함 참고문헌 [1] 진하오린,주완화,저우쯔펑,등.국의대사의 성인 스틸병 치료 경험國醫大師治療成人斯蒂爾病的經驗[J].후난중의약대학학보湖南中醫藥大學學報,2023,43(2):185-188. [2] 주량춘朱良春 등.비통탕 및 그 용도痹通湯及其用途:CN109453283A[P/OL]. https://patents.google.com/patent/CN109453283A. [3] 주량춘朱良春.비통탕 및 그 용도痹痛湯及其用途:CN102552630A[P/OL]. https://patents.google.com/patent/CN102552630A."}},{"id":"2-4","ko":"피부해독탕","hz":"皮膚解毒湯","alias":"","master_ko":"쉬안궈웨이","master_hz":"禤國維","tagline":"습독내온濕毒內蘊, 조독어체燥毒瘀滯하여 발생하는 완고성 습진, 건선 등 난치성 피부질환을 치료하는 처방","meta":{"주요 적응증":"완고성 습진, 건선, 두드러기","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"관련 특허 (유효·소멸)"},"page":100,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-4 피부해독탕皮膚解毒湯의 모듈 구성<\/p><h4>①양혈투진해독涼血透疹解毒 모듈 — 혈분의 열독을 식히고 피부 발진의 투발을 돕는 핵심 약물<\/h4><p><b>자초<\/b>: 양혈涼血하며 혈분血分의 열독을 투발透發시킴 토복령: 피부와 근골 간의 습독濕毒을 전적으로 제거함<\/p><h4>②파혈행기破血行氣, 거어독祛瘀毒 모듈 — 깊이 박힌 어혈과 고질적인 독기를 무너뜨림<\/h4><p><b>아출<\/b>: 성질이 따뜻해 파혈행기破血行氣하며, 깊이 엉킨 만성 습독과 어혈을 깨뜨려 흩어지게 함<\/p><h4>③자음윤조滋陰潤燥, 거풍지양祛風止癢 모듈 — 진액을 보호하고 풍사와 습사를 몰아내어 가려움을 다스림<\/h4><p><b>오매<\/b>: 본래 산렴·생진 작용을 하나, 난치성 피부병에서 독기를 수렴하고 치료를 돕는 묘약으로 작용 소엽, 방풍, 서장경: 거풍祛風하고 통락通絡하며, 특히 소엽은 특유의 행기발산行氣發散 작용으로 체표의 풍사를 몰아낼 뿐만 아니라, 어류와 갑각류 등 단백질성 발물發物에서 기인하는 해어하독解魚蝦毒 효능을 발휘하여 알레르기성·면역성 독소의 활성화를 억제하고 염증 확산을 원천적으로 제어함<\/p><h4>④조화제약調和諸藥 모듈 — 처방 전체의 약성을 조율하고 맹렬한 약독을 제어함<\/h4><p><b>감초<\/b>: 제약諸藥을 조화롭게 어우르며, 준맹한 파혈·해독 약물의 편성을 완화하고 약독藥毒을 풀어줌<\/p>"},{"k":"master","t":"쉬안궈웨이의 습진, 건선 치료","html":"<h4>①병인병기 이론 — 완고한 피부질환의 핵심 병기<\/h4><p>습독내온濕毒內蘊과 조독어체燥毒瘀滯<\/p><p class=\"sub\">습진 초기에는 청열리습淸熱利濕 해독법이 유효하나, 병이 오래되면 습사濕邪가 깊이 피부와 근육 사이에 엉켜 독毒으로 변함 건선은 혈조血燥가 본本이 되고, 한조지사寒燥之邪가 울체되면서 열로 화하며, 진행기의 혈열독조血熱毒燥와 정체기의 어독응체瘀毒凝滯가 병기를 구성함 조燥·독毒·어瘀가 핵심 병기임<\/p><p>구병입락久病入絡과 낙맥척독絡脈剔毒<\/p><p class=\"sub\">오래된 피부병은 반드시 낙맥絡脈에 미치므로, 《임증지남의안臨證指南醫案》의 가르침에 따라 충류 약물(지룡, 선퇴 등) 을 배오하여 낙맥 속의 깊은 독을 파헤쳐 배출함 단, 충독蟲毒을 다스리는 소엽 등의 해독 약물이 반드시 동반되어야 함<\/p><h4>②치료 원칙 — 해독화어解毒化瘀와 내외합치內外合治<\/h4><p>해독화어解毒化瘀 및 이습통락利濕通絡<\/p><p class=\"sub\">단순히 청열이나 보혈에 그치지 않고, 굳어진 어혈과 독소를 깨뜨리며 경락을 소통시키는 치법을 원칙으로 함<\/p><p>내외합치內外合治와 중서결합<\/p><p class=\"sub\"><b>만성 습진<\/b>: 획흔요법劃痕療法, 취홍요법吹烘療法, 광선 조사 요법 시행 건선: 뇌공등다감편雷公藤多苷片 등 병용<\/p><h4>③임상 증상에 따른 가감 법식<\/h4><p><b>풍열편성風熱偏盛<\/b>: 방풍, 금은화, 상엽을 가미하여 소풍청열지양疏風淸熱止癢혈열편성血熱偏盛: 수우각, 목단피, 적작약을 가미하여 양혈활혈涼血活血열독편성熱毒偏盛: 백화사설초, 석상백石上柏, 구절차九節茶, 반지련半枝蓮을 가미하여 청열해독 혈어血瘀가 심할 때: 도인, 홍화, 삼릉, 택란을 가미하여 활혈화어活血化瘀혈허풍조血虛風燥: 사삼, 맥문동, 단삼, 계혈등을 가미하여 양혈활혈윤조養血活血潤燥습열濕熱을 겸할 때: 고삼, 백선피, 서장경을 가미하여 청열리습지양淸熱利濕止癢여성 충임불조衝任不調: 여정자, 익모초, 토사자를 가미하여 조화충임調和衝任위장 불편 시: 오매를 제거하고 연호색 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품은 없음. 대사가 공동 발명한 건선 치료 조성물 특허 2건(광둥성중의원 계열)이 오매·아출·토복령·자초·감초를 공유하는 관련 조성으로, 1건(CN105213971B)은 유효, 1건(CN101632827B)은 2024년 연차료 미납으로 소멸[4][5]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">건선 대상 핵심 약재 조합이 이미 중국 특허로 공개되어 있으므로, 국내는 습진·두드러기 등 다른 적응증이나 외용 제형으로 차별화하는 것이 유리<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 천젠훙,왕신,쉬안궈웨이.쉬안궈웨이 교수의 피부해독탕을 활용한 난치성 습진 치료 경험皮膚解毒湯治療頑固性濕疹經驗擷萃[J].랴오닝중의약대학학보遼寧中醫藥大學學報,2010,12(7):131-132.<\/li><li class=\"ref\">[2] 어우양웨이취안,판루이창,리훙이.쉬안궈웨이 교수의 피부해독탕을 활용한 건선 치료 경험 소개禤國維教授運用皮膚解毒湯治療銀屑病經驗介紹[J].신중의新中醫,2014,46(6):28-29.<\/li><li class=\"ref\">[3] 천젠훙.피부해독탕의 혈허풍조형 만성 습진 치료 임상 연구皮膚解毒湯治療血虛風燥型慢性濕疹臨床研究[J].중국현대의생中國現代醫生,2016,54(14):140-142.<\/li><li class=\"ref\">[4] 루촨젠盧傳堅·쉬안궈웨이禤國維 등.건선을 치료하는 중약 조성물治療銀屑病的中藥組合物:CN105213971B[P/OL].<a href=\"https://patents.google.com/patent/CN105213971B.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN105213971B.<\/a><\/li><li class=\"ref\">[5] 루촨젠盧傳堅·쉬안궈웨이禤國維 등.건선을 치료하는 중약 조성물 및 제조방법一種治療銀屑病的中藥組合物及其製備方法:CN101632827B[P/OL].<a href=\"https://patents.google.com/patent/CN101632827B.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN101632827B.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"오매","name":"오매","dose":"","base":"오매"},{"raw":"아출","name":"아출","dose":"","base":"아출"},{"raw":"토복령","name":"토복령","dose":"","base":"토복령"},{"raw":"자초","name":"자초","dose":"","base":"자초"},{"raw":"소엽","name":"소엽","dose":"","base":"소엽"},{"raw":"방풍","name":"방풍","dose":"","base":"방풍"},{"raw":"서장경","name":"서장경","dose":"","base":"서장경"},{"raw":"감초","name":"감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["독을 풀어주고 어혈을 없앰(해독화어解毒化瘀)","습을 제거하고 경락을 소통시킴(이습통락利濕通絡)"],"주치증":["완고성 습진, 건선, 두드러기 등 풍습열독風濕熱毒에 의한 피부질환"],"연구 확장 영역":["난치성 습진, 건선, 피부 과민반응 및 난치성 소양증 질환"],"R&D 포인트":["오매의 산렴酸斂 및 해독·생진 작용에 따른 피부 장벽 회복 및 소양증 제어 효능 분석","자초의 양혈투진涼血透疹과 토복령의 피부·근골 습독 제거 기전 검증","아출의 파혈행기破血行氣 및 어독瘀毒을 해소하는 작용에 따른 미세순환 개선 효과 연구","충류 약물(지룡, 선퇴 등) 및 해독 약물의 배오에 따른 낙맥絡脈 척독剔毒 효능 분석"]},"modules":[{"name":"①양혈투진해독","hz":"涼血透疹解毒","herbs":["자초","토복령"],"role":"혈분의 열독을 식히고 피부 발진 온濕毒內蘊과 조독어체燥毒瘀滯 습진 초기에는 청열리습淸熱利濕 해독법이 유효하나, 병이 오래되면 습사濕邪가 깊이 피부와 근육 사이에 엉켜 독毒으로 변함 건선은 혈조血燥가 본本이 되고, 한조지사寒燥之邪가 울체되면서 열로 화하며, 진행기의 혈열독조血熱毒燥와 정체기의 어독응체瘀毒凝滯가 병기를 구성함 조燥·독毒·어瘀가 핵심 병기임 구병입락久病入絡과 낙맥척독絡脈剔毒 오래된 피부병은 반드시 낙맥絡脈에 미치므로, 《임증지남의안臨證指南醫案》의 가르침에 따라 충류 약물(지룡, 선퇴 등) 을 배오하여 낙맥 속의 깊은 독을 파헤쳐 배출함 단, 충독蟲毒을 다스리는 소엽 등의 해독 약물이 반드시 동반되어야 함 ②치료 원칙 — 해독화어解毒化瘀와 내외합치內外合治 해독화어解毒化瘀 및 이습통락利濕通絡 단순히 청열이나 보혈에 그치지 않고, 굳어진 어혈과 독소를 깨뜨리며 경락을 소통시키는 치법을 원칙으로 함 내외합치內外合治와 중서결합 만성 습진 : 획흔요법劃痕療法, 취홍요법吹烘療法, 광선 조사 요법 시행 건선: 뇌공등다감편雷公藤多苷片 등 병용 ③임상 증상에 따른 가감 법식 풍열편성風熱偏盛 : 방풍, 금은화, 상엽을 가미하여 소풍청열지양疏風淸熱止癢혈열편성血熱偏盛: 수우각, 목단피, 적작약을 가미하여 양혈활혈涼血活血열독편성熱毒偏盛: 백화사설초, 석상백石上柏, 구절차九節茶, 반지련半枝蓮을 가미하여 청열해독 혈어血瘀가 심할 때: 도인, 홍화, 삼릉, 택란을 가미하여 활혈화어活血化瘀혈허풍조血虛風燥: 사삼, 맥문동, 단삼, 계혈등을 가미하여 양혈활혈윤조養血活血潤燥습열濕熱을 겸할 때: 고삼, 백선피, 서장경을 가미하여 청열리습지양淸熱利濕止癢여성 충임불조衝任不調: 여정자, 익모초, 토사자를 가미하여 조화충임調和衝任위장 불편 시: 오매를 제거하고 연호색 가미","rd":"","china":"중국 제품화 현황 허가 제품은 없음. 대사가 공동 발명한 건선 치료 조성물 특허 2건(광둥성중의원 계열)이 오매·아출·토복령·자초·감초를 공유하는 관련 조성으로, 1건(CN105213971B)은 유효, 1건(CN101632827B)은 2024년 연차료 미납으로 소멸[4][5] 시사점 건선 대상 핵심 약재 조합이 이미 중국 특허로 공개되어 있으므로, 국내는 습진·두드러기 등 다른 적응증이나 외용 제형으로 차별화하는 것이 유리 참고문헌 [1] 천젠훙,왕신,쉬안궈웨이.쉬안궈웨이 교수의 피부해독탕을 활용한 난치성 습진 치료 경험皮膚解毒湯治療頑固性濕疹經驗擷萃[J].랴오닝중의약대학학보遼寧中醫藥大學學報,2010,12(7):131-132. [2] 어우양웨이취안,판루이창,리훙이.쉬안궈웨이 교수의 피부해독탕을 활용한 건선 치료 경험 소개禤國維教授運用皮膚解毒湯治療銀屑病經驗介紹[J].신중의新中醫,2014,46(6):28-29. [3] 천젠훙.피부해독탕의 혈허풍조형 만성 습진 치료 임상 연구皮膚解毒湯治療血虛風燥型慢性濕疹臨床研究[J].중국현대의생中國現代醫生,2016,54(14):140-142. [4] 루촨젠盧傳堅·쉬안궈웨이禤國維 등.건선을 치료하는 중약 조성물治療銀屑病的中藥組合物:CN105213971B[P/OL]. https://patents.google.com/patent/CN105213971B. [5] 루촨젠盧傳堅·쉬안궈웨이禤國維 등.건선을 치료하는 중약 조성물 및 제조방법一種治療銀屑病的中藥組合物及其製備方法:CN101632827B[P/OL]. https://patents.google.com/patent/CN101632827B."}},{"id":"2-5","ko":"소좌탕","hz":"消痤湯","alias":"","master_ko":"쉬안궈웨이","master_hz":"禤國維","tagline":"신음腎陰 부족과 상화相火 왕성, 폐위혈열肺胃血熱로 발생하는 여드름을 치료하는 처방","meta":{"주요 적응증":"여드름","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":104,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-5 소좌탕消痤湯의 모듈 구성<\/p><h4>①자신사화滋腎瀉火 모듈 — 신음을 보충하고 과도한 상화를 내림<\/h4><p><b>여정자, 한련초<\/b>: 음과 양의 조화를 이루는 이지환二至丸의 구성을 이루어 간신肝腎을 자양하고 혈열을 식혀주며 허화虛火를 내림<\/p><p><b>지모, 황백<\/b>: 신수腎水를 보하고 신화腎火를 내리며 한편으로는 보하고 한편으로는 사하는 방식으로 신의 음양 평형을 조정함<\/p><h4>②청열해독산결淸熱解毒散結 모듈 — 폐위肺胃의 열독을 식히고 옹종癰腫을 풀어줌<\/h4><p><b>어성초, 포공영, 연교<\/b>: 폐의 열을 식히고 독을 풀어주며 옹종을 풀어주고 부기를 가라앉힘<\/p><h4>③양혈활혈涼血活血 모듈 — 혈분의 열을 내리고 어혈을 풀어줌<\/h4><p><b>생지황<\/b>: 혈분으로 들어가 영음營陰을 자양하고 혈열血熱을 시원하게 식혀주어 열독熱毒이 혈맥을 타고 몰리는 것을 막음<\/p><p><b>단삼<\/b>: 반드시 후하後下하여 사용. 활혈거어活血祛瘀하며 염증 억제 및 흉터와 결절 제거에 기여<\/p><h4>④조화제약調和諸藥 모듈 — 약성을 조율하고 열을 내림<\/h4><p><b>감초<\/b>: 제반 약재를 조화롭게 어우르며 해독 작용을 발휘하고 다른 약물의 강한 성질을 완화함<\/p>"},{"k":"master","t":"쉬안궈웨이의 여드름 치료","html":"<h4>①병인병기 이론 — 여드름 발병의 근본 기전<\/h4><p>여드름의 근본적인 병기를 신음부족腎陰不足과 상화망동相火妄動으로 파악함<\/p><p>선천적인 장부 비대칭과 후천적인 섭생의 부조화가 겹쳐 폐위肺胃에 열이 몰리고 혈열血熱이 성해진 것으로 봄<\/p><p>정신적 스트레스로 인한 기체혈어氣滯血瘀가 더해져 열독熱毒이 결합하고 피부 경락을 막아 멍울과 농포가 형성되는 것으로 병기를 세밀하게 분석함<\/p><p>중국 링난嶺南(광둥·광시 일대) 지역의 고온다습한 기후와 매운 음식이나 기름진 음식의 과도한 섭취가 증상을 악화시키는 요인으로 작용함<\/p><h4>②치료 원칙과 치법<\/h4><p>자신강화滋腎降火, 양혈해독涼血解毒, 산결통락散結通絡을 핵심 치료 원칙으로 삼음<\/p><p>신음腎陰을 보충하여 치솟는 허화虛火를 끄고 폐위의 울열과 혈분의 열독을 제거함<\/p><p>맺힌 덩어리를 풀어내어 기혈의 순환을 원활하게 유도하는 산결통락의 방법을 병행함<\/p><p>환자의 체질과 거주 지역, 계절의 변화를 종합적으로 고려하는 삼인제의三因制宜의 철학을 바탕으로 처방의 경중과 가감을 조절함<\/p><h4>③임상 증상에 따른 소좌탕의 가감<\/h4><p><b>양증陽證의 구진丘疹, 농포膿皰<\/b>: 백선피, 백화사설초, 황금, 하고초를 가미하여 청열해독, 소종지통消腫止痛<\/p><p><b>음증陰證의 무통無痛, 단단한 결절, 낭종囊腫<\/b>: 진피, 육계, 당귀를 가미하여 온경화담溫經化痰<\/p><p><b>반음반양증半陰半陽證으로 통증이 가볍고 양증과 음증이 혼재<\/b>: 단삼, 浙패모를 가미하여 활혈산어소종活血散瘀消腫<\/p><p><b>습열상증濕熱上蒸하여 안면에 기름기가 많고 흉배부에 구진, 농포<\/b>: 인진, 포사엽을 가미하여 청열리습淸熱利濕<\/p><p><b>대변비결大便秘結<\/b>: 대황, 지실을 가미하여 통폐사열通肺瀉熱<\/p><p><b>대변이 질퍽하고 시원하지 않으며 태황니苔黃膩<\/b>: 생지황을 빼고, 토복령, 인진을 가미하여 이습청열해독利濕淸熱解毒<\/p><p><b>불면다몽不眠多夢<\/b>: 합환피, 복신을 가미하여 영심안신寧心安神<\/p><p><b>구건구고口乾口苦(입이 마르고 씀), 폐위열성肺胃熱盛<\/b>: 生석고, 지골피를 가미하여 청폐위지열淸肺胃之熱<\/p><p><b>낭종, 결절 심할 때<\/b>: 하고초, 浙패모, 아출 가미하여 소종산결消腫散結<\/p><p><b>유지 분비 과다<\/b>: 상엽, 의이인, 비파엽, 측백엽, 산사山楂 가미<\/p><p><b>농종 반복<\/b>: 오미소독음五味消毒飮 합방<\/p><p><b>취합성聚合性 여드름<\/b>: 백화사설초, 석상백, 야국화를 가미하여 청열해독산결淸熱解毒散結<\/p><p><b>여성 월경전月經前, 월경 중일 때 가감<\/b>: 월경 전에는 시호, 향부자를 가미하고, 월경 중에는 단삼을 빼고 익모초 가미<\/p><h4>④특징적인 용약<\/h4><p><b>단삼<\/b>: 거어생신과 통락의 효과를 지니며, 대용량(매회 20~50g)으로 활용하여 효과를 높임. 대사는 탄시논丹蔘酮(tanshinone)의 파괴를 막기 위해 반드시 나중에 넣는 후하後下 방식을 취함<\/p><p><b>상엽<\/b>: 감고한甘苦寒하여 폐와 간경에 들어가며, 승산升散하는 성질로 가볍게 두면부까지 도달하므로 인경약引經藥으로 작용<\/p><p><b>백화사설초<\/b>: 습사濕邪와 열독熱毒이 겹친 결절, 낭종, 흉터형 여드름에 청열리습淸熱利濕과 양혈해독涼血解毒을 위해 적극 배오함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품·신약 임상은 없음. 대사 명의의 여드름 조성물 특허(CN109481575A)가 있으나 이 처방과 조성이 달라 별개로 판단됨<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">여드름은 국내 한방 피부과 수요가 큰 영역이며 공개자료상 이 처방의 중국 제품이 확인되지 않아, 이지환 골격의 자음 처방으로 국내 제제화를 검토할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 관시훙.쉬안궈웨이 명로중의의 여드름 진료 경험 발굴 연구禤國維名老中醫痤瘡診療經驗挖掘研究[D].광저우중의약대학廣州中醫藥大學,2012.<\/li><li class=\"ref\">[2] 자수린,판루이창,등.국의대사 쉬안궈웨이 교수의 자음청열법에 따른 여드름 치료 이론 탐구國醫大師禤國維教授滋陰淸熱法治療痤瘡理論探討[J].난징중 의약대학학보南京中醫藥大學學報,2016,32(3):207-209.<\/li><li class=\"ref\">[3] 량자펀,장량,리훙이,등.국의대사 쉬안궈웨이의 ‘삼인제의’에 따른 링난 지역 여드름 변증 치료 경험國醫大師禤國維“三因制宜”辨治嶺南地區痤瘡經驗[J]. 광저우중의약대학학보廣州中醫藥大學學報,2020,37(6):1155-1158.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"여정자20g","name":"여정자","dose":"20g","base":"여정자"},{"raw":"한련초20g","name":"한련초","dose":"20g","base":"한련초"},{"raw":"생지황15g","name":"생지황","dose":"15g","base":"생지황"},{"raw":"단삼25g","name":"단삼","dose":"25g","base":"단삼"},{"raw":"지모12g","name":"지모","dose":"12g","base":"지모"},{"raw":"포공영15g","name":"포공영","dose":"15g","base":"포공영"},{"raw":"연교15g","name":"연교","dose":"15g","base":"연교"},{"raw":"황백12g","name":"황백","dose":"12g","base":"황백"},{"raw":"어성초20g","name":"어성초","dose":"20g","base":"어성초"},{"raw":"감초5g","name":"감초","dose":"5g","base":"감초"}],"notes":[],"핵심 효능":["신음을 채우고 상화相火를 내림(자신사화滋腎瀉火)","혈을 서늘하게 식히고 독을 풀어줌(양혈해독涼血解毒)"],"주치증":["신음腎陰이 부족하고 상화相火가 왕성한 여드름, 안면의 구진丘疹, 농포膿皰, 결절結節, 낭종囊腫등"],"연구 확장 영역":["반복 재발하는 여드름, 청소년기 및 스트레스와 내분비 불균형이 있는 성인기 여성 여드름, 습열형濕熱型 및 음허화왕형陰虛火旺型 난치성 여드름"],"R&D 포인트":["이지환二至丸의 배오에 따른 신음자양腎陰滋養 및 양방향 내분비 조절 기전 분석","지모와 황백의 보수사화補水瀉火 작용을 통한 신의 음양 평형 조정 효과 검증","포공영·어성초 등 청열해독 약물의 여드름균 억제 기전 분석"]},"modules":[{"name":"①자신사화","hz":"滋腎瀉火","herbs":["여정자","한련초","지모","황백"],"role":"신음을 보충하고 과도한 상화를 내림"},{"name":"②청열해독산결","hz":"淸熱解毒散結","herbs":["어성초","포공영","연교"],"role":"폐위肺胃의 열독을 식히고 옹종癰腫을 풀어줌"},{"name":"③양혈활혈","hz":"涼血活血","herbs":["생지황","단삼"],"role":"혈분의 열을 내리고 어혈을 풀어줌"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":"약성을 조율하고 열을 내림"}],"rd":[{"tag":"Hormonal Acne","title":"성인 여성 호르몬성 여드름의 내분비 지표","html":"<p>자음청열법(이지환·지모·황백)에 따른 여드름 치료 이론이 정리되어 있음<\/p><p>월경 전 악화형 성인 여성 여드름 환자에서 다낭성 난소 증후군 등 내분비 질환을 먼저 감별한 뒤 병변 수와 혈청 테스토스테론·DHEA-S를 함께 측정하는 탐색 임상이 적합(호르몬 변화를 처방 효과로 전제하지 않음) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2016, 자음청열법 이론))<\/p>"},{"tag":"Sebum Control","title":"피지 분비량을 지표로 한 보수사화 효과 검증","html":"<p>‘보수사화’를 피지 분비 억제로 해석함<\/p><p>피지 측정기(세부미터)로 투여 전후 피지량을 정량화하면 증형 개념을 객관 지표로 연결할 수 있음 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「보수사화와 음양 평형」)<\/p>"},{"tag":"Anti-C. acnes","title":"어성초·포공영·연교의 여드름균 억제 활성","html":"<p>청열해독 약재군(어성초·포공영·연교·황백)의 여드름균(Cutibacterium acnes) 최소 억제 농도와 염증 유도 억제를 시험관에서 먼저 확인함<\/p><p><b>항생제 내성 문제를 보완하는 외용·내복 병용 가능성을 검토 (근거 유형<\/b>: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 3 「폐위혈열과 청열해독산결」)<\/p>"},{"tag":"Regional Pattern","title":"링난嶺南 지역 증형 분포와 한국 환자 적용성","html":"<p>링난(광둥) 지역의 기후·체질을 고려한 ‘삼인제의’ 경험임<\/p><p>한국 환자에서도 신음허·상화왕 증형이 같은 비율로 나타나는지 확인한 뒤 적용 대상을 정하는 것이 필요(지역 비교는 후순위 과제) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](2020, 삼인제의 변증 치료), [1](진료 경험 발굴))<\/p>"}],"logic":[{"n":"1","title":"자신사화滋腎瀉火와 양방향 평형","body":"신음腎陰을 보충하고 과도한 상화相火를 내리며 음양을 조율함"},{"n":"2","title":"보수사화補水瀉火와 음양 평형","body":"신수腎水를 보하고 신화腎火를 다스림"},{"n":"3","title":"폐위혈열肺胃血熱과 청열해독산결","body":"폐위의 울열을 식히고 옹종을 풀어줌"},{"n":"4","title":"활혈거어活血祛瘀와 후하後下용법","body":"단삼을 대용량으로 활용하여 흉터와 결절을 제거함"}],"field":2,"pages":[104,108],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-5","소좌탕","消痤湯","","쉬안궈웨이","禤國維","신음腎陰 부족과 상화相火 왕성, 폐위혈열肺胃血熱로 발생하는 여드름을 치료하는 처방","여정자20g 한련초20g 생지황15g 단삼25g 지모12g 포공영15g 연교15g 황백12g 어성초20g 감초5g","","핵심 효능 신음을 채우고 상화相火를 내림(자신사화滋腎瀉火) 혈을 서늘하게 식히고 독을 풀어줌(양혈해독涼血解毒)","주치증 신음腎陰이 부족하고 상화相火가 왕성한 여드름, 안면의 구진丘疹, 농포膿皰, 결절結節, 낭종囊腫등","연구 확장 영역 반복 재발하는 여드름, 청소년기 및 스트레스와 내분비 불균형이 있는 성인기 여성 여드름, 습열형濕熱型 및 음허화왕형陰虛火旺型 난치성 여드름","R&D 포인트 이지환二至丸의 배오에 따른 신음자양腎陰滋養 및 양방향 내분비 조절 기전 분석 지모와 황백의 보수사화補水瀉火 작용을 통한 신의 음양 평형 조정 효과 검증 포공영·어성초 등 청열해독 약물의 여드름균 억제 기전 분석","①자신사화 滋腎瀉火 여정자 한련초 지모 황백 신음을 보충하고 과도한 상화를 내림","②청열해독산결 淸熱解毒散結 어성초 포공영 연교 폐위肺胃의 열독을 식히고 옹종癰腫을 풀어줌","③양혈활혈 涼血活血 생지황 단삼 혈분의 열을 내리고 어혈을 풀어줌","④조화제약 調和諸藥 감초 약성을 조율하고 열을 내림","자신사화滋腎瀉火와 양방향 평형 신음腎陰을 보충하고 과도한 상화相火를 내리며 음양을 조율함","보수사화補水瀉火와 음양 평형 신수腎水를 보하고 신화腎火를 다스림","폐위혈열肺胃血熱과 청열해독산결 폐위의 울열을 식히고 옹종을 풀어줌","활혈거어活血祛瘀와 후하後下용법 단삼을 대용량으로 활용하여 흉터와 결절을 제거함","Hormonal Acne 성인 여성 호르몬성 여드름의 내분비 지표 자음청열법(이지환·지모·황백)에 따른 여드름 치료 이론이 정리되어 있음 월경 전 악화형 성인 여성 여드름 환자에서 다낭성 난소 증후군 등 내분비 질환을 먼저 감별한 뒤 병변 수와 혈청 테스토스테론·DHEA-S를 함께 측정하는 탐색 임상이 적합(호르몬 변화를 처방 효과로 전제하지 않음) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2016, 자음청열법 이론))","Sebum Control 피지 분비량을 지표로 한 보수사화 효과 검증 ‘보수사화’를 피지 분비 억제로 해석함 피지 측정기(세부미터)로 투여 전후 피지량을 정량화하면 증형 개념을 객관 지표로 연결할 수 있음 (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「보수사화와 음양 평형」)","Anti-C. acnes 어성초·포공영·연교의 여드름균 억제 활성 청열해독 약재군(어성초·포공영·연교·황백)의 여드름균(Cutibacterium acnes) 최소 억제 농도와 염증 유도 억제를 시험관에서 먼저 확인함 항생제 내성 문제를 보완하는 외용·내복 병용 가능성을 검토 (근거 유형 : 신규 연구가설 | 근거: 본문 조성표, R&D 논리 3 「폐위혈열과 청열해독산결」)","Regional Pattern 링난嶺南 지역 증형 분포와 한국 환자 적용성 링난(광둥) 지역의 기후·체질을 고려한 ‘삼인제의’ 경험임 한국 환자에서도 신음허·상화왕 증형이 같은 비율로 나타나는지 확인한 뒤 적용 대상을 정하는 것이 필요(지역 비교는 후순위 과제) (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](2020, 삼인제의 변증 치료), [1](진료 경험 발굴))"],"ss":{"composition":"그림 2-5 소좌탕消痤湯의 모듈 구성 ①자신사화滋腎瀉火 모듈 — 신음을 보충하고 과도한 상화를 내림 여정자, 한련초 : 음과 양의 조화를 이루는 이지환二至丸의 구성을 이루어 간신肝腎을 자양하고 혈열을 식혀주며 허화虛火를 내림 지모, 황백 : 신수腎水를 보하고 신화腎火를 내리며 한편으로는 보하고 한편으로는 사하는 방식으로 신의 음양 평형을 조정함 ②청열해독산결淸熱解毒散結 모듈 — 폐위肺胃의 열독을 식히고 옹종癰腫을 풀어줌 어성초, 포공영, 연교 : 폐의 열을 식히고 독을 풀어주며 옹종을 풀어주고 부기를 가라앉힘 ③양혈활혈涼血活血 모듈 — 혈분의 열을 내리고 어혈을 풀어줌 생지황 : 혈분으로 들어가 영음營陰을 자양하고 혈열血熱을 시원하게 식혀주어 열독熱毒이 혈맥을 타고 몰리는 것을 막음 단삼 : 반드시 후하後下하여 사용. 활혈거어活血祛瘀하며 염증 억제 및 흉터와 결절 제거에 기여 ④조화제약調和諸藥 모듈 — 약성을 조율하고 열을 내림 감초 : 제반 약재를 조화롭게 어우르며 해독 작용을 발휘하고 다른 약물의 강한 성질을 완화함","master":"①병인병기 이론 — 여드름 발병의 근본 기전 여드름의 근본적인 병기를 신음부족腎陰不足과 상화망동相火妄動으로 파악함 선천적인 장부 비대칭과 후천적인 섭생의 부조화가 겹쳐 폐위肺胃에 열이 몰리고 혈열血熱이 성해진 것으로 봄 정신적 스트레스로 인한 기체혈어氣滯血瘀가 더해져 열독熱毒이 결합하고 피부 경락을 막아 멍울과 농포가 형성되는 것으로 병기를 세밀하게 분석함 중국 링난嶺南(광둥·광시 일대) 지역의 고온다습한 기후와 매운 음식이나 기름진 음식의 과도한 섭취가 증상을 악화시키는 요인으로 작용함 ②치료 원칙과 치법 자신강화滋腎降火, 양혈해독涼血解毒, 산결통락散結通絡을 핵심 치료 원칙으로 삼음 신음腎陰을 보충하여 치솟는 허화虛火를 끄고 폐위의 울열과 혈분의 열독을 제거함 맺힌 덩어리를 풀어내어 기혈의 순환을 원활하게 유도하는 산결통락의 방법을 병행함 환자의 체질과 거주 지역, 계절의 변화를 종합적으로 고려하는 삼인제의三因制宜의 철학을 바탕으로 처방의 경중과 가감을 조절함 ③임상 증상에 따른 소좌탕의 가감 양증陽證의 구진丘疹, 농포膿皰 : 백선피, 백화사설초, 황금, 하고초를 가미하여 청열해독, 소종지통消腫止痛 음증陰證의 무통無痛, 단단한 결절, 낭종囊腫 : 진피, 육계, 당귀를 가미하여 온경화담溫經化痰 반음반양증半陰半陽證으로 통증이 가볍고 양증과 음증이 혼재 : 단삼, 浙패모를 가미하여 활혈산어소종活血散瘀消腫 습열상증濕熱上蒸하여 안면에 기름기가 많고 흉배부에 구진, 농포 : 인진, 포사엽을 가미하여 청열리습淸熱利濕 대변비결大便秘結 : 대황, 지실을 가미하여 통폐사열通肺瀉熱 대변이 질퍽하고 시원하지 않으며 태황니苔黃膩 : 생지황을 빼고, 토복령, 인진을 가미하여 이습청열해독利濕淸熱解毒 불면다몽不眠多夢 : 합환피, 복신을 가미하여 영심안신寧心安神 구건구고口乾口苦(입이 마르고 씀), 폐위열성肺胃熱盛 : 生석고, 지골피를 가미하여 청폐위지열淸肺胃之熱 낭종, 결절 심할 때 : 하고초, 浙패모, 아출 가미하여 소종산결消腫散結 유지 분비 과다 : 상엽, 의이인, 비파엽, 측백엽, 산사山楂 가미 농종 반복 : 오미소독음五味消毒飮 합방 취합성聚合性 여드름 : 백화사설초, 석상백, 야국화를 가미하여 청열해독산결淸熱解毒散結 여성 월경전月經前, 월경 중일 때 가감 : 월경 전에는 시호, 향부자를 가미하고, 월경 중에는 단삼을 빼고 익모초 가미 ④특징적인 용약 단삼 : 거어생신과 통락의 효과를 지니며, 대용량(매회 20~50g)으로 활용하여 효과를 높임. 대사는 탄시논丹蔘酮(tanshinone)의 파괴를 막기 위해 반드시 나중에 넣는 후하後下 방식을 취함 상엽 : 감고한甘苦寒하여 폐와 간경에 들어가며, 승산升散하는 성질로 가볍게 두면부까지 도달하므로 인경약引經藥으로 작용 백화사설초 : 습사濕邪와 열독熱毒이 겹친 결절, 낭종, 흉터형 여드름에 청열리습淸熱利濕과 양혈해독涼血解毒을 위해 적극 배오함","rd":"","china":"중국 제품화 현황 허가 제품·신약 임상은 없음. 대사 명의의 여드름 조성물 특허(CN109481575A)가 있으나 이 처방과 조성이 달라 별개로 판단됨 시사점 여드름은 국내 한방 피부과 수요가 큰 영역이며 공개자료상 이 처방의 중국 제품이 확인되지 않아, 이지환 골격의 자음 처방으로 국내 제제화를 검토할 수 있음 참고문헌 [1] 관시훙.쉬안궈웨이 명로중의의 여드름 진료 경험 발굴 연구禤國維名老中醫痤瘡診療經驗挖掘研究[D].광저우중의약대학廣州中醫藥大學,2012. [2] 자수린,판루이창,등.국의대사 쉬안궈웨이 교수의 자음청열법에 따른 여드름 치료 이론 탐구國醫大師禤國維教授滋陰淸熱法治療痤瘡理論探討[J].난징중 의약대학학보南京中醫藥大學學報,2016,32(3):207-209. [3] 량자펀,장량,리훙이,등.국의대사 쉬안궈웨이의 ‘삼인제의’에 따른 링난 지역 여드름 변증 치료 경험國醫大師禤國維“三因制宜”辨治嶺南地區痤瘡經驗[J]. 광저우중의약대학학보廣州中醫藥大學學報,2020,37(6):1155-1158."}},{"id":"2-6","ko":"억면탕","hz":"抑免湯","alias":"","master_ko":"루팡","master_hz":"盧芳","tagline":"혈분열독血分熱毒을 청리淸理하고 습어濕瘀를 배출하여 자가면역성 피부 질환의 과도한 면역반응을 억제하는 처방","meta":{"주요 적응증":"자가면역성 피부질환, IgA 혈관염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":109,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-6 억면탕抑免湯의 모듈 구성<\/p><h4>①청열양혈淸熱涼血, 산어투열散瘀透熱 모듈 — 혈분의 열을 식히고 어혈을 풀어 열이 외부로 투발되도록 함<\/h4><p><b>생지황, 연교<\/b>: 생지황은 대용량으로 배합하여 자음생진滋陰生津하고 혈분의 열을 식히며, 연교는 경청輕淸한 성질로 영분營分의 열을 기분氣分으로 투달시켜 투열전기透熱轉氣를 도모함<\/p><p><b>목단피, 적작약<\/b>: 목단피가 사혈중복화瀉血中伏火하여 혈중에 잠복한 열을 제거하고, 적작약은 행혈화어行血化瘀하여 혈을 식히되 어혈을 남기지 않고 어혈을 풀되 출혈을 유발하지 않게 함<\/p><h4>②청열리습淸熱利濕, 사하해독瀉下解毒 모듈 — 습열濕熱·독열毒熱 등 체내 사기를 사하瀉下하여 대소변으로 배출함<\/h4><p><b>토대황, 호장<\/b>: 토대황이 청열사하淸熱瀉下, 지혈해독止血解毒하고, 호장이 청열리습淸熱利濕, 산어지통散瘀止痛하여 서로 다른 작용을 상호보완함. 이를 통해 습열을 제거하고 어혈을 풀어 기혈의 순행을 도움<\/p><h4>③청열조습淸熱燥濕, 거풍통락祛風通絡 모듈 — 기분의 습열을 제거하고 경락을 소통시켜 가려움과 통증을 완화함<\/h4><p><b>황금, 서장경<\/b>: 황금은 상초, 중초의 열을 내리고 기분氣分의 습열을 청리淸理, 조습燥濕하며, 서장경은 신온辛溫한 성질로 거풍화습祛風化濕, 지통지양止痛止癢하며 한량한 약재들의 한응寒凝을 방지함<\/p><h4>④행기리습行氣利濕, 해독소종解毒消腫 모듈 — 기기의 소통을 돕고 습을 제거하여 부종을 가라앉히며 독을 풀어줌<\/h4><p><b>토황기<\/b>: 행기리습行氣利濕, 해독소종解毒消腫하여 체내 습열의 사기가 하규下竅를 통해 원활히 배출되도록 도움<\/p>"},{"k":"master","t":"루팡의 자가면역 질환 치료","html":"<h4>①영위불화榮衛不和, 피육고부皮肉枯腐의 근본 병태와 습열독어濕熱毒瘀 삼자 결합의 병기 체계<\/h4><p>자가면역 및 알레르기성 피부 질환의 근본 원인을 ‘영위불화榮衛不和’로 진단하고, 그 결과 국부 표피와 근육에 양분이 공급되지 않아 기질적 변성이 일어나는 ‘피육고부皮肉枯腐’ 현상에 주목함<\/p><p>발병 기전의 핵심은 습열濕熱, 독열毒熱, 혈어血瘀의 삼자 상호결합에 있음. 외감 풍한습열의 사기가 온열, 습열 체질, 정서적 울체, 고지방과 매운 음식 섭취 등 내인과 맞물려 체내에 결착됨<\/p><p>습濕은 점체黏滯하여 질환을 장기화시키고, 열熱은 기진을 손상시키며 풍을 일으켜 혈분을 혼란시킴. 열이 오래 울체되면 독毒으로 화하여 조직을 손상시키고 염증 반응(발반, 구진, 풍단)을 유발함<\/p><p>습열과 열독이 혈맥을 침범하면 혈행이 둔화되고 진액이 졸아들어 혈어血瘀가 형성됨. 대사는 “어혈이 머무는 곳에 반드시 복양伏陽이 있다”고 보아, 어혈과 열독이 서로를 부채질하며 정기正氣 손상과 사기邪氣 번성을 동반하는 허실착잡虛實錯雜의 복합 병태를 형성함을 규정함<\/p><h4>②변병과 변증의 유기적 결합을 통한 ‘면역 억제’의 학술적 구현<\/h4><p>양의학의 명확한 질환 진단(변병) 및 면역학적 기전 연구와 중의학의 체질, 증후 분석(변증)을 결합하는 ‘변병변증결합辨病辨證結合’ 치료 모델을 정립함<\/p><p>자가면역 질환 치료 시 양의학의 호르몬(스테로이드) 및 면역억제제 투여가 초래하는 면역 기능 저하, 감염 위험 증대, 대사 장애, 만월안滿月顔, 골다공증 및 약물 중단 후 리바운드 현상의 단점을 깊이 인지함<\/p><p>이에 대응하여 단일 면역 세포의 무차별적 억제가 아닌, 중약 복합물의 다각적 조절 작용을 이용함. 과활성화된 면역 세포(Th17, B세포)와 염증성 사이토카인의 과도한 발현을 선택적으로 억제하는 동시에 인체의 정기正氣를 보존하여 자율 면역 안정성을 도모하는 ‘중의학적 면역 억제요법’을 주장함<\/p><h4>③청열이불응淸熱而不凝, 혈수동치血水同治 및 통변사하通便瀉下의 배오 묘미<\/h4><p><b>청열이불응淸熱而不凝<\/b>: 대량의 한량寒涼한 청열약(생지황, 연교, 토대황, 적작약 등)을 사용하면 열독은 꺾이나 약성이 차가워 혈액과 기혈이 뭉치는 ‘한응寒凝’의 부작용이 발생할 수 있음. 대사는 신온辛溫한 서장경을 배합하여 차가운 성질을 조율하고 경락을 소통시키는 정교한 배오를 완성함<\/p><p><b>혈수동치血水同治와 상제상성相制相成<\/b>: 토대황과 호장을 배합하여 어혈(血)과 습열(水)을 동시에 치료함. 토대황의 청열사하淸熱瀉下, 지혈止血 효능과 호장의 청열리습淸熱利濕, 산어지통散瘀止痛 효능이 결합하여 지혈하면서도 어혈을 남기지 않는 상호작용을 일으키며, 미세혈관 투과성을 감소시키고 어혈과 습열을 동시에 제거함<\/p><p><b>기표투발肌表透發과 사하배독瀉下排毒의 상하 조율<\/b>: 연교를 통해 기표와 영분의 복열을 밖으로 흩뜨려 투열전기透熱轉氣시키는 한편, 토대황, 호장, 토황기를 통해 습열과 열독을 대변과 소변으로 하향 배출시킴으로써 사기가 체내에 머물 공간을 없애는 ‘상투하배上透下排’의 입체적 치료 통로를 확보함<\/p><h4>④병증, 병위 및 질환 특성에 따른 정밀 가감 체계<\/h4><p class=\"lbl2\">IgA 혈관염 및 자반성 신장염<\/p><p class=\"sub\"><b>신장 손상(자반성 신장염) 수반 시<\/b>: 황기, 현삼, 천초茜草를 추가하여 익기양음益氣養陰, 양혈지혈涼血止血함<\/p><p class=\"sub\"><b>출혈량이 많거나 출혈이 멈추지 않을 때<\/b>: 구판교龜板膠, 녹각교鹿角膠를 가하여 음혈을 보강하고 지혈함<\/p><p class=\"sub\"><b>관절 통증 및 굴신불리 시<\/b>: 계혈등, 청풍등靑風藤, 목과木瓜를 추가하여 서근활락舒筋活絡함<\/p><p class=\"sub\"><b>복통 동반 시<\/b>: 귤핵, 오약을 추가하여 소간행기지통疏肝行氣止痛함<\/p><p class=\"lbl2\">은진癮疹 및 난치성 가려움증<\/p><p class=\"sub\"><b>풍사風邪가 우세할 때<\/b>: 방풍, 강활을 추가하여 거풍지양祛風止癢함<\/p><p class=\"sub\"><b>습사濕邪가 우세할 때<\/b>: 패란, 방기, 복령을 추가하여 분리습열分利濕熱함<\/p><p class=\"sub\"><b>국소 가려움증이 극심할 때(외용 세제洗劑 병용)<\/b>: 형개30g, 방풍30g, 지골피30g, 망초50g, 백반30g, 천초30g을 탕전하여 온/냉 습포 세척을 병행함<\/p><p class=\"lbl2\">건선 및 피부 질환<\/p><p class=\"sub\"><b>어혈이 견고하고 설질이 자암紫暗할 때<\/b>: 삼릉, 아출을 추가하여 파어산결破瘀散結함<\/p><p class=\"sub\"><b>피부 건조 및 균열 동반 시<\/b>: 당귀를 추가하고 생지황 용량을 증량하여 양음윤조養陰潤燥함<\/p><p class=\"sub\"><b>심번불면心煩不眠 및 설첨홍舌尖紅<\/b>: 산조인, 복령, 연자심, 담죽엽을 추가하여 청심안신淸心安神함<\/p><p class=\"lbl2\">병위별 인경약 추가<\/p><p class=\"sub\"><b>두면부頭面部<\/b>: 천궁, 만형자, 능소화淩霄花 추가<\/p><p class=\"sub\"><b>상지上肢<\/b>: 상지桑枝, 계지 추가<\/p><p class=\"sub\"><b>하지下肢<\/b>: 川우슬 추가(습열이 심할 때는 황백, 창출을 더 추가함)<\/p><p class=\"sub\"><b>표피 및 피부 깊은 층<\/b>: 마황 소량 또는 백지, 갈근 추가<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">자가면역 피부질환 대상 경험방으로 공개자료상 제품·특허가 확인되지 않으며, 면역억제 작용의 안전성 자료부터 확보해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 중샤위안,박용수,훠자민,등.억면탕을 활용한 습열혈어형 알레르기성 자반증 치료運用抑免湯治療濕熱血瘀型過敏性紫癜[J].닝샤의과대학학보寧夏醫科大學學報,2023,45(9):964-966.<\/li><li class=\"ref\">[2] 정이,중샤위안.국의대사 루팡의 억면탕을 활용한 두드러기 치료 경험國醫大師盧芳運用抑免湯治療蕁麻疹的經驗[J].저장중의약대학학보浙江中醫藥大學學報,2022,46(5):515-518.<\/li><li class=\"ref\">[3] 리자오,리광,리티,등.국의대사 루팡의 자가면역성 질환 치료 경험國醫大師盧芳治療自身免疫性疾病經驗[J].후난중의잡지湖南中醫雜志,2021,37(1):31-33.<\/li><li class=\"ref\">[4] 박용수,왕보,쑤멍,등.국의대사 루팡의 억면탕을 활용한 습열혈어형 건선 치료 경험國醫大師盧芳運用抑免湯治療濕熱血瘀型銀屑病經驗[J].저장중의약대 학학보浙江中醫藥大學學報,2018,42(7):516-518+521.<\/li><li class=\"ref\">[5] 박용수,왕보,쑤멍,등.국의대사 루팡의 억면탕을 활용한 류마티스 면역 관련 피부 손상 치료 경험國醫大師盧芳運用抑免湯治療風濕免疫相關性皮損的經驗[J].시진국의국약時珍國醫國藥,2018,29(6):1460-1461.<\/li><li class=\"ref\">[6] 박용수,왕보,쑤멍,등.국의대사 루팡의 억면탕을 활용한 자가면역성 피부 손상 변증 치료 경험國醫大師盧芳運用抑免湯辨治自身免疫性皮損經驗[J].상하이 중의약잡지上海中醫藥雜志,2018,52(5):2-4+1.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"생지황30g","name":"생지황","dose":"30g","base":"생지황"},{"raw":"연교15g","name":"연교","dose":"15g","base":"연교"},{"raw":"목단피15g","name":"목단피","dose":"15g","base":"목단피"},{"raw":"적작약15g","name":"적작약","dose":"15g","base":"적작약"},{"raw":"토대황土大黃15g","name":"토대황土大黃","dose":"15g","base":"토대황"},{"raw":"호장15g","name":"호장","dose":"15g","base":"호장"},{"raw":"황금10g","name":"황금","dose":"10g","base":"황금"},{"raw":"서장경15g","name":"서장경","dose":"15g","base":"서장경"},{"raw":"토황기土黃芪15g","name":"토황기土黃芪","dose":"15g","base":"토황기"}],"notes":[],"핵심 효능":["혈분血分의 울열鬱熱과 독열毒熱을 식히고 삭임(청열양혈해독淸熱涼血解毒)","어혈을 풀어 경락을 통하게 하여 통증과 염증 반응을 해소함(화어통락지통化瘀通絡止痛)","습열濕熱과 독소를 대변과 소변을 통해 하향 배출함(이습사하배독利濕瀉下排毒)","풍사風邪를 흩뜨려 가려움을 잡고, 청열약에 의한 한응寒凝을 방지함(거풍지양방응祛風止癢防凝)"],"주치증":["IgA 혈관염, 두드러기, 건선, 자가면역성 피부 질환(전신성 홍반성 루푸스, 경피증, 피부근염, 베체트병 등). 영위불화榮衛不和, 습열혈어濕熱血瘀, 독열내치毒熱內熾 증형"],"연구 확장 영역":["알레르기성 혈관염, 만성 난치성 피부 질환, 자가면역 질환의 스테로이드 감량 및 반동 방지, 면역억제제 치료에 대한 보조요법 연구"],"R&D 포인트":["생지황, 연교, 목단피, 적작약 배합의 Th1/Th2 및 Th17/Treg 면역세포 균형 조절 및 염증성 사이토카인(TNF-α, IL-6, IL-17) 발현, 분비조절 효과를 검증","토대황, 호장, 황금의 과도한 혈관 투과성 개선, 비만세포 히스타민 유리 억제 및 항알레르기, 항염증 작용 기전을 검증","적작약, 목단피, 호장의 미세혈전 형성 억제, 내피세포 보호 및 피부 미세순환 장애 개선 효과를 규명","서장경, 토황기, 생지황 복합물의 스테로이드 사용량 감소 가능성 및 부작용 완화 효과와 면역 항상성 회복 기전을 탐색함"]},"modules":[{"name":"①청열양혈 · 산어투열","hz":"淸熱涼血 · 散瘀透熱","herbs":["생지황","연교","목단피","적작약"],"role":"혈분의 열을 식히고 어혈을 풀어 열이 외부로 투발되도록 함"},{"name":"②청열리습 · 사하해독","hz":"淸熱利濕 · 瀉下解毒","herbs":["토대황","호장"],"role":"습열濕熱·독열毒熱 등 체내 사기를 사하瀉下하여 대소변으로 배출함"},{"name":"③청열조습 · 거풍통락","hz":"淸熱燥濕 · 祛風通絡","herbs":["황금","서장경"],"role":"기분의 습열을 제거하고 경락을 소통시켜 가려움과 통증을 완화함"},{"name":"④행기리습 · 해독소종","hz":"行氣利濕 · 解毒消腫","herbs":["토황기"],"role":"기기의 소통을 돕고 습을 제거하여 부종을 가라앉히며 독을 풀어줌"}],"rd":[{"tag":"IgA Vasculitis","title":"습열혈어형 IgA 혈관염","html":"<p>IgA 혈관염(IgE 매개 알레르기와 다른 면역복합체 혈관염) 치료 보고가 있음 자반 소실 기간과 혈뇨·단백뇨를 추적하되 신장 합병증 예방 효과는 검증할 가설로 둠 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2023, IgA 혈관염))<\/p>"},{"tag":"Chronic Urticaria","title":"만성 두드러기의 증상 점수 개선","html":"<p>항히스타민제에 충분히 반응하지 않는 두드러기 환자를 대상으로 함<\/p><p>UAS7 점수를 1차 지표로 한 병용 탐색 임상으로 효과 크기를 추정 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2022, 두드러기 치료 경험))<\/p>"},{"tag":"Psoriasis","title":"습열혈어형 건선의 피부 병변 개선","html":"<p>건선 치료 경험이 있음<\/p><p>PASI 점수와 혈관 증식·염증 지표로 ‘혈수동치’의 미세순환 개선 효과를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [4](2018, 건선 치료 경험), R&amp;D 논리 3)<\/p>"},{"tag":"Autoimmune Skin & Sourcing","title":"자가면역성 피부 병변의 스테로이드 병용과 원료 대체","html":"<p>자가면역 피부 병변에서 스테로이드 감량 효과를 확인함<\/p><p>다만 토대황土大黃·토황기土黃芪는 국내 공정서(대한민국약전·대한민국약전외한약 (생약)규격집)에 수재되지 않은 지역 약재이므로 기원을 확인하고 대체 약재를 함께 검토 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3][5][6](자가면역성 피부 질환 경험), 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"영위불화榮衛不和와 피육고부皮肉枯腐","body":"자가면역 반응으로 인해 표피와 근육에 양분이 공급되지 않아 기질적 변성이 일어남"},{"n":"2","title":"습열독어濕熱毒瘀 삼자 결합","body":"습열濕熱, 독열毒熱, 혈어血瘀가 서로를 부채질하여 면역 및 혈관 염증 병태를 형성함"},{"n":"3","title":"혈수동치血水同治와 일산 미세순환 개선 효과를 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [4](2018, 건선 치료 경험), R&D 논리 3)","Autoimmune Skin & Sourcing 자가면역성 피부 병변의 스테로이드 병용과 원료 대체 자가면역 피부 병변에서 스테로이드 감량 효과를 확인함 다만 토대황土大黃·토황기土黃芪는 국내 공정서(대한민국약전·대한민국약전외한약 (생약)규격집)에 수재되지 않은 지역 약재이므로 기원을 확인하고 대체 약재를 함께 검토 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3][5][6](자가면역성 피부 질환 경험), 본문 조성표)"],"ss":{"composition":"그림 2-6 억면탕抑免湯의 모듈 구성 ①청열양혈淸熱涼血, 산어투열散瘀透熱 모듈 — 혈분의 열을 식히고 어혈을 풀어 열이 외부로 투발되도록 함 생지황, 연교 : 생지황은 대용량으로 배합하여 자음생진滋陰生津하고 혈분의 열을 식히며, 연교는 경청輕淸한 성질로 영분營分의 열을 기분氣分으로 투달시켜 투열전기透熱轉氣를 도모함 목단피, 적작약 : 목단피가 사혈중복화瀉血中伏火하여 혈중에 잠복한 열을 제거하고, 적작약은 행혈화어行血化瘀하여 혈을 식히되 어혈을 남기지 않고 어혈을 풀되 출혈을 유발하지 않게 함 ②청열리습淸熱利濕, 사하해독瀉下解毒 모듈 — 습열濕熱·독열毒熱 등 체내 사기를 사하瀉下하여 대소변으로 배출함 토대황, 호장 : 토대황이 청열사하淸熱瀉下, 지혈해독止血解毒하고, 호장이 청열리습淸熱利濕, 산어지통散瘀止痛하여 서로 다른 작용을 상호보완함. 이를 통해 습열을 제거하고 어혈을 풀어 기혈의 순행을 도움 ③청열조습淸熱燥濕, 거풍통락祛風通絡 모듈 — 기분의 습열을 제거하고 경락을 소통시켜 가려움과 통증을 완화함 황금, 서장경 : 황금은 상초, 중초의 열을 내리고 기분氣分의 습열을 청리淸理, 조습燥濕하며, 서장경은 신온辛溫한 성질로 거풍화습祛風化濕, 지통지양止痛止癢하며 한량한 약재들의 한응寒凝을 방지함 ④행기리습行氣利濕, 해독소종解毒消腫 모듈 — 기기의 소통을 돕고 습을 제거하여 부종을 가라앉히며 독을 풀어줌 토황기 : 행기리습行氣利濕, 해독소종解毒消腫하여 체내 습열의 사기가 하규下竅를 통해 원활히 배출되도록 도움","master":"①영위불화榮衛不和, 피육고부皮肉枯腐의 근본 병태와 습열독어濕熱毒瘀 삼자 결합의 병기 체계 자가면역 및 알레르기성 피부 질환의 근본 원인을 ‘영위불화榮衛不和’로 진단하고, 그 결과 국부 표피와 근육에 양분이 공급되지 않아 기질적 변성이 일어나는 ‘피육고부皮肉枯腐’ 현상에 주목함 발병 기전의 핵심은 습열濕熱, 독열毒熱, 혈어血瘀의 삼자 상호결합에 있음. 외감 풍한습열의 사기가 온열, 습열 체질, 정서적 울체, 고지방과 매운 음식 섭취 등 내인과 맞물려 체내에 결착됨 습濕은 점체黏滯하여 질환을 장기화시키고, 열熱은 기진을 손상시키며 풍을 일으켜 혈분을 혼란시킴. 열이 오래 울체되면 독毒으로 화하여 조직을 손상시키고 염증 반응(발반, 구진, 풍단)을 유발함 습열과 열독이 혈맥을 침범하면 혈행이 둔화되고 진액이 졸아들어 혈어血瘀가 형성됨. 대사는 “어혈이 머무는 곳에 반드시 복양伏陽이 있다”고 보아, 어혈과 열독이 서로를 부채질하며 정기正氣 손상과 사기邪氣 번성을 동반하는 허실착잡虛實錯雜의 복합 병태를 형성함을 규정함 ②변병과 변증의 유기적 결합을 통한 ‘면역 억제’의 학술적 구현 양의학의 명확한 질환 진단(변병) 및 면역학적 기전 연구와 중의학의 체질, 증후 분석(변증)을 결합하는 ‘변병변증결합辨病辨證結合’ 치료 모델을 정립함 자가면역 질환 치료 시 양의학의 호르몬(스테로이드) 및 면역억제제 투여가 초래하는 면역 기능 저하, 감염 위험 증대, 대사 장애, 만월안滿月顔, 골다공증 및 약물 중단 후 리바운드 현상의 단점을 깊이 인지함 이에 대응하여 단일 면역 세포의 무차별적 억제가 아닌, 중약 복합물의 다각적 조절 작용을 이용함. 과활성화된 면역 세포(Th17, B세포)와 염증성 사이토카인의 과도한 발현을 선택적으로 억제하는 동시에 인체의 정기正氣를 보존하여 자율 면역 안정성을 도모하는 ‘중의학적 면역 억제요법’을 주장함 ③청열이불응淸熱而不凝, 혈수동치血水同治 및 통변사하通便瀉下의 배오 묘미 청열이불응淸熱而不凝 : 대량의 한량寒涼한 청열약(생지황, 연교, 토대황, 적작약 등)을 사용하면 열독은 꺾이나 약성이 차가워 혈액과 기혈이 뭉치는 ‘한응寒凝’의 부작용이 발생할 수 있음. 대사는 신온辛溫한 서장경을 배합하여 차가운 성질을 조율하고 경락을 소통시키는 정교한 배오를 완성함 혈수동치血水同治와 상제상성相制相成 : 토대황과 호장을 배합하여 어혈(血)과 습열(水)을 동시에 치료함. 토대황의 청열사하淸熱瀉下, 지혈止血 효능과 호장의 청열리습淸熱利濕, 산어지통散瘀止痛 효능이 결합하여 지혈하면서도 어혈을 남기지 않는 상호작용을 일으키며, 미세혈관 투과성을 감소시키고 어혈과 습열을 동시에 제거함 기표투발肌表透發과 사하배독瀉下排毒의 상하 조율 : 연교를 통해 기표와 영분의 복열을 밖으로 흩뜨려 투열전기透熱轉氣시키는 한편, 토대황, 호장, 토황기를 통해 습열과 열독을 대변과 소변으로 하향 배출시킴으로써 사기가 체내에 머물 공간을 없애는 ‘상투하배上透下排’의 입체적 치료 통로를 확보함 ④병증, 병위 및 질환 특성에 따른 정밀 가감 체계 IgA 혈관염 및 자반성 신장염 신장 손상(자반성 신장염) 수반 시 : 황기, 현삼, 천초茜草를 추가하여 익기양음益氣養陰, 양혈지혈涼血止血함 출혈량이 많거나 출혈이 멈추지 않을 때 : 구판교龜板膠, 녹각교鹿角膠를 가하여 음혈을 보강하고 지혈함 관절 통증 및 굴신불리 시 : 계혈등, 청풍등靑風藤, 목과木瓜를 추가하여 서근활락舒筋活絡함 복통 동반 시 : 귤핵, 오약을 추가하여 소간행기지통疏肝行氣止痛함 은진癮疹 및 난치성 가려움증 풍사風邪가 우세할 때 : 방풍, 강활을 추가하여 거풍지양祛風止癢함 습사濕邪가 우세할 때 : 패란, 방기, 복령을 추가하여 분리습열分利濕熱함 국소 가려움증이 극심할 때(외용 세제洗劑 병용) : 형개30g, 방풍30g, 지골피30g, 망초50g, 백반30g, 천초30g을 탕전하여 온/냉 습포 세척을 병행함 건선 및 피부 질환 어혈이 견고하고 설질이 자암紫暗할 때 : 삼릉, 아출을 추가하여 파어산결破瘀散結함 피부 건조 및 균열 동반 시 : 당귀를 추가하고 생지황 용량을 증량하여 양음윤조養陰潤燥함 심번불면心煩不眠 및 설첨홍舌尖紅 : 산조인, 복령, 연자심, 담죽엽을 추가하여 청심안신淸心安神함 병위별 인경약 추가 두면부頭面部 : 천궁, 만형자, 능소화淩霄花 추가 상지上肢 : 상지桑枝, 계지 추가 하지下肢 : 川우슬 추가(습열이 심할 때는 황백, 창출을 더 추가함) 표피 및 피부 깊은 층 : 마황 소량 또는 백지, 갈근 추가","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 자가면역 피부질환 대상 경험방으로 공개자료상 제품·특허가 확인되지 않으며, 면역억제 작용의 안전성 자료부터 확보해야 함 참고문헌 [1] 중샤위안,박용수,훠자민,등.억면탕을 활용한 습열혈어형 알레르기성 자반증 치료運用抑免湯治療濕熱血瘀型過敏性紫癜[J].닝샤의과대학학보寧夏醫科大學學報,2023,45(9):964-966. [2] 정이,중샤위안.국의대사 루팡의 억면탕을 활용한 두드러기 치료 경험國醫大師盧芳運用抑免湯治療蕁麻疹的經驗[J].저장중의약대학학보浙江中醫藥大學學報,2022,46(5):515-518. [3] 리자오,리광,리티,등.국의대사 루팡의 자가면역성 질환 치료 경험國醫大師盧芳治療自身免疫性疾病經驗[J].후난중의잡지湖南中醫雜志,2021,37(1):31-33. [4] 박용수,왕보,쑤멍,등.국의대사 루팡의 억면탕을 활용한 습열혈어형 건선 치료 경험國醫大師盧芳運用抑免湯治療濕熱血瘀型銀屑病經驗[J].저장중의약대 학학보浙江中醫藥大學學報,2018,42(7):516-518+521. [5] 박용수,왕보,쑤멍,등.국의대사 루팡의 억면탕을 활용한 류마티스 면역 관련 피부 손상 치료 경험國醫大師盧芳運用抑免湯治療風濕免疫相關性皮損的經驗[J].시진국의국약時珍國醫國藥,2018,29(6):1460-1461. [6] 박용수,왕보,쑤멍,등.국의대사 루팡의 억면탕을 활용한 자가면역성 피부 손상 변증 치료 경험國醫大師盧芳運用抑免湯辨治自身免疫性皮損經驗[J].상하이 중의약잡지上海中醫藥雜志,2018,52(5):2-4+1."}},{"id":"2-7","ko":"소반익력탕","hz":"消斑益力湯","alias":"","master_ko":"루팡","master_hz":"盧芳","tagline":"혈분복열血分伏熱을 해소하고 기음氣陰을 보강하여 피부근염을 다스리고 근력을 회복하는 처방","meta":{"주요 적응증":"피부근염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":115,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-7 소반익력탕消斑益力湯의 모듈 구성<\/p><h4>①청열양혈淸熱涼血, 투사외출透邪外出 모듈 — 혈분血分의 복열伏熱을 내리고 사기邪氣를 밖으로 내보냄<\/h4><p><b>생지황, 적작약, 목단피<\/b>: 생지황이 청열양혈淸熱涼血하여 복열을 내리고 윤통혈맥潤通血脈하며, 적작약이 행혈화어行血化瘀하여 혈중의 체증을 풀고, 목단피가 혈분의 복열을 내리고 어혈을 깨뜨려 거어생신祛瘀生新함<\/p><p><b>황금, 연교<\/b>: 황금이 기분氣分의 울화를 청리淸理하고, 연교가 경청輕淸한 성질로 혈분血分에 침범한 복열을 밖으로 투발시킴<\/p><h4>②익기양음益氣養陰, 소리기기疏理氣機 모듈 — ‘장화식기壯火食氣’로 손상된 원기와 음액陰液을 충전함<\/h4><p><b>황기, 청피, 석곡<\/b>: 황기가 보양원기補養元氣, 기열肌熱을 제거하고, 청피가 소리기기疏理氣機하여 황기의 보기가 체하지 않게 조율함. 석곡이 자음생진滋陰生津하여 영음營陰을 윤통潤通함<\/p><h4>③서근활락舒筋活絡, 강근골强筋骨 모듈 — 경락을 윤통하여 근육무력을 해소함<\/h4><p><b>오가피, 갈근, 계혈등<\/b>: 오가피가 강근골强筋骨하고, 갈근이 항배項背 경락을 소통시키며 복열의 투해透解를 도움. 계혈등이 행혈보혈行血補血, 서경활락舒經活絡함<\/p><h4>④건비화중健脾和中, 조화제약調和諸藥 모듈 — 한량寒涼한 약재로 인한 중초中焦 손상을 막고 약성을 조화롭게 함<\/h4><p><b>백출, 감초<\/b>: 백출이 건비익기健脾益氣, 조습燥濕하여 비위를 보살피고 한량약의 부작용을 방지하며, 감초가 중초를 보하고 제약諸藥을 조화롭게 통제함<\/p>"},{"k":"master","t":"루팡의 피부근염 치료","html":"<h4>①혈분복열血分伏熱과 병기 인식의 전환<\/h4><p>피부근염의 발병 근본을 혈분복열血分伏熱로 규정함. 질환 초기에 발열, 인후통, 기침 등의 외감 증상 없이 피부 반진斑疹으로 시작되는 것은 외감이 아닌 혈분血分에 잠복해 있던 열독熱毒이 발현된 것임. 어열瘀熱이 음락陰絡에서 양락陽絡 및 위표衛表로 투발할 때 반진이 발생하고, 기분氣分 경락으로 전입하면 ‘장화식기壯火食氣’ 기전에 의해 기음氣陰이 손상되어 근육 무력이 유발됨<\/p><h4>②순세투사順勢透邪 및 인체 자연치유력 존중<\/h4><p>피부에 나타나는 반진은 질병의 악화가 아니라, 인체가 자율적인 치유 능력을 작동시켜 혈분의 복열을 밖으로 몰아내는 사기가 밖으로 빠져나오는 외적 징후임. 따라서 초기에 강한 스테로이드나 면역억제제로 반진을 억제하는 것은 사기의 출로를 막아 병을 장기화시킬 수 있다고 봄(대사의 병기 관점이며, 표준 치료의 중단·회피를 뜻하지 않음). 치료할 때 사기의 흐름에 순응하여 밖으로 내보내는 순세투사를 위주로 해야 함<\/p><h4>③‘장화식기壯火食氣’ 극복 및 공보겸시<\/h4><p>장경악의 이론을 수용하여 장화壯火를 기음氣陰을 손상시키는 화열火熱의 사기로 정의함. 피부근염에서 복열이 경락에 체류해 형성된 장화가 경기經氣와 진액津液을 갉아먹어 위증痿證이 발생하므로, 치료할 때 순세투사로 본本을 치는 동시에 황기, 청피 및 오가피, 갈근, 계혈등, 석곡으로 익기양음益氣養陰, 서근활락舒筋活絡하여 실질적인 근력肌力을 회복시킴<\/p><h4>④정밀 가감 체계<\/h4><p><b>폐섬유화가 동반될 때<\/b>: 制패모, 노로통路路通을 추가하여 폐락肺絡을 소통시킴<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">피부근염은 희귀질환으로 대규모 임상이 어려우므로 증례 축적과 기전 연구 중심으로 접근하는 것이 현실적<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 판궈슝,류칭난,장푸리,등.국의대사 루팡의 소반익력탕을 활용한 피부근염 치료 경험國醫大師盧芳運用消斑益力湯治療皮肌炎經驗[J].풍습병과 관절염風濕病與關節炎,2022,11(12):27-30.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"생지황30g","name":"생지황","dose":"30g","base":"생지황"},{"raw":"적작약20g","name":"적작약","dose":"20g","base":"적작약"},{"raw":"목단피20g","name":"목단피","dose":"20g","base":"목단피"},{"raw":"황금10g","name":"황금","dose":"10g","base":"황금"},{"raw":"연교15g","name":"연교","dose":"15g","base":"연교"},{"raw":"황기30g","name":"황기","dose":"30g","base":"황기"},{"raw":"청피15g","name":"청피","dose":"15g","base":"청피"},{"raw":"오가피15g","name":"오가피","dose":"15g","base":"오가피"},{"raw":"갈근20g","name":"갈근","dose":"20g","base":"갈근"},{"raw":"계혈등15g","name":"계혈등","dose":"15g","base":"계혈등"},{"raw":"生백출15g","name":"生백출","dose":"15g","base":"백출"},{"raw":"석곡15g","name":"석곡","dose":"15g","base":"석곡"},{"raw":"生감초5g","name":"生감초","dose":"5g","base":"감초"}],"notes":[],"핵심 효능":["혈열血熱을 식히고 어혈을 제거함(양혈화어涼血化瘀)","잠복된 사기를 밖으로 투발시킴(투사외출透邪外出)","손상된 기액과 음혈을 보충함(익기양음益氣養陰)","경락을 소통시키고 근육의 힘을 회복함(서근활락舒筋活絡)"],"주치증":["피부근염(반진斑疹, 기비肌痹, 위증痿證 범주). 혈분복열血分伏熱, 어열瘀熱이 위표衛表와 기분氣分으로 투발하는 단계, 기음양허氣陰兩虛 증형"],"연구 확장 영역":["자가면역성 피부-근육 질환, 만성 혈관 염증성 질환, 자반성 질환, 면역조절 장애성 근육 무력증"],"R&D 포인트":["생지황, 적작약, 목단피, 연교 복합물의 항염증, 면역조절 및 혈관 내피 보호 작용을 활용함","황기, 청피, 오가피, 석곡 배합의 근육세포 기능 개선, 미토콘드리아 보호 및 면역 항상성 조절 효과를 검증"]},"modules":[{"name":"①청열양혈 · 투사외출","hz":"淸熱涼血 · 透邪外出","herbs":["생지황","적작약","목단피","황금","연교"],"role":"혈분血分의 복열伏熱을 내리고 사기邪氣를 밖으로 내보냄"},{"name":"②익기양음 · 소리기기","hz":"益氣養陰 · 疏理氣機","herbs":["황기","청피","석곡"],"role":"‘장화식기壯火食氣’로 손상된 원기와 음액陰液을 충전함"},{"name":"③서근활락 · 강근골","hz":"舒筋活絡 · 强筋骨","herbs":["오가피","갈근","계혈등"],"role":"경락을 윤통하여 근육무력을 해소함"},{"name":"④건비화중 · 조화제약","hz":"健脾和中 · 調和諸藥","herbs":["백출","감초"],"role":"한량寒涼한 약재로 인한 중초中焦 손상을 막고 약성을 조화롭게 함"}],"rd":[{"tag":"Cutaneous Dermatomyositis","title":"피부근염 피부 병변 개선","html":"<p>치료 경험 보고가 1편임<\/p><p>피부 병변 활성도(CDASI)를 지표로 한 증례 분석으로 효과 신호를 먼저 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2022, 피부근염 치료 경험))<\/p>"},{"tag":"Muscle Strength","title":"황기·오가피 배합의 근력·근효소 개선","html":"<p>도수근력검사(MMT-8)와 혈청 CK로 근기능 회복을 평가함<\/p><p><b>황기·오가피의 근세포 보호 효과를 근염 모델에서 확인 (근거 유형<\/b>: 임상 경험 보고 | 근거: R&amp;D 논리 2 「익기양음과 기기 소리」, 참고문헌 [1])<\/p>"},{"tag":"Steroid Myopathy","title":"장기 스테로이드 사용 환자의 근력 저하 예방","html":"<p>스테로이드 장기 투여가 표준임 스테로이드 유발 근병증을 줄이는지는 별도 가설로 두고, 면역억제 치료 중의 감염· 약물 부작용과 구분하여 근력·근육량으로 확인 (근거 유형: 임상 경험 보고 | 근거: R&amp;D 논리 3 「서근활락과 근력 회복」, 참고문헌 [1])<\/p>"},{"tag":"GI Tolerability","title":"한량 약재 대량 배합의 위장 부담 관리","html":"<p>생지황·적작약·목단피 등 한량 약재 비중이 큰 처방임<\/p><p><b>백출·감초의 위장 보호 효과와 복약 순응도를 함께 평가 (근거 유형<\/b>: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 4 「건비화중과 약성 조율」)<\/p>"}],"logic":[{"n":"1","title":"청열양혈淸熱涼血과 복열 해소","body":"혈분의 복열을 끄고 사기를 밖으로 투발함"},{"n":"2","title":"익기양음益氣養陰과 기기 소리","body":"원기를 보하고 진액을 자양하여 장화식기壯火食氣를 극복함"},{"n":"3","title":"서근활락舒筋活絡과 근력 회복","body":"경락을 윤통하고 근육의 힘을 되살림"},{"n":"4","title":"건비화중健脾和中과 약성 조율","body":"한량한 약재로부터 비위를 보호하고 전신 균형을 유지함"}],"field":2,"pages":[115,118],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-7","소반익력탕","消斑益力湯","","루팡","盧芳","혈분복열血分伏熱을 해소하고 기음氣陰을 보강하여 피부근염을 다스리고 근력을 회복하는 처방","생지황30g 적작약20g 목단피20g 황금10g 연교15g 황기30g 청피15g 오가피15g 갈근20g 계혈등15g 生백출15g 석곡15g 生감초5g","","핵심 효능 혈열血熱을 식히고 어혈을 제거함(양혈화어涼血化瘀) 잠복된 사기를 밖으로 투발시킴(투사외출透邪外出) 손상된 기액과 음혈을 보충함(익기양음益氣養陰) 경락을 소통시키고 근육의 힘을 회복함(서근활락舒筋活絡)","주치증 피부근염(반진斑疹, 기비肌痹, 위증痿證 범주). 혈분복열血分伏熱, 어열瘀熱이 위표衛表와 기분氣分으로 투발하는 단계, 기음양허氣陰兩虛 증형","연구 확장 영역 자가면역성 피부-근육 질환, 만성 혈관 염증성 질환, 자반성 질환, 면역조절 장애성 근육 무력증","R&D 포인트 생지황, 적작약, 목단피, 연교 복합물의 항염증, 면역조절 및 혈관 내피 보호 작용을 활용함 황기, 청피, 오가피, 석곡 배합의 근육세포 기능 개선, 미토콘드리아 보호 및 면역 항상성 조절 효과를 검증","①청열양혈 · 투사외출 淸熱涼血 · 透邪外出 생지황 적작약 목단피 황금 연교 혈분血分의 복열伏熱을 내리고 사기邪氣를 밖으로 내보냄","②익기양음 · 소리기기 益氣養陰 · 疏理氣機 황기 청피 석곡 ‘장화식기壯火食氣’로 손상된 원기와 음액陰液을 충전함","③서근활락 · 강근골 舒筋活絡 · 强筋骨 오가피 갈근 계혈등 경락을 윤통하여 근육무력을 해소함","④건비화중 · 조화제약 健脾和中 · 調和諸藥 백출 감초 한량寒涼한 약재로 인한 중초中焦 손상을 막고 약성을 조화롭게 함","청열양혈淸熱涼血과 복열 해소 혈분의 복열을 끄고 사기를 밖으로 투발함","익기양음益氣養陰과 기기 소리 원기를 보하고 진액을 자양하여 장화식기壯火食氣를 극복함","서근활락舒筋活絡과 근력 회복 경락을 윤통하고 근육의 힘을 되살림","건비화중健脾和中과 약성 조율 한량한 약재로부터 비위를 보호하고 전신 균형을 유지함","Cutaneous Dermatomyositis 피부근염 피부 병변 개선 치료 경험 보고가 1편임 피부 병변 활성도(CDASI)를 지표로 한 증례 분석으로 효과 신호를 먼저 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2022, 피부근염 치료 경험))","Muscle Strength 황기·오가피 배합의 근력·근효소 개선 도수근력검사(MMT-8)와 혈청 CK로 근기능 회복을 평가함 황기·오가피의 근세포 보호 효과를 근염 모델에서 확인 (근거 유형 : 임상 경험 보고 | 근거: R&D 논리 2 「익기양음과 기기 소리」, 참고문헌 [1])","Steroid Myopathy 장기 스테로이드 사용 환자의 근력 저하 예방 스테로이드 장기 투여가 표준임 스테로이드 유발 근병증을 줄이는지는 별도 가설로 두고, 면역억제 치료 중의 감염· 약물 부작용과 구분하여 근력·근육량으로 확인 (근거 유형: 임상 경험 보고 | 근거: R&D 논리 3 「서근활락과 근력 회복」, 참고문헌 [1])","GI Tolerability 한량 약재 대량 배합의 위장 부담 관리 생지황·적작약·목단피 등 한량 약재 비중이 큰 처방임 백출·감초의 위장 보호 효과와 복약 순응도를 함께 평가 (근거 유형 : 신규 연구가설 | 근거: 본문 조성표, R&D 논리 4 「건비화중과 약성 조율」)"],"ss":{"composition":"그림 2-7 소반익력탕消斑益力湯의 모듈 구성 ①청열양혈淸熱涼血, 투사외출透邪外出 모듈 — 혈분血分의 복열伏熱을 내리고 사기邪氣를 밖으로 내보냄 생지황, 적작약, 목단피 : 생지황이 청열양혈淸熱涼血하여 복열을 내리고 윤통혈맥潤通血脈하며, 적작약이 행혈화어行血化瘀하여 혈중의 체증을 풀고, 목단피가 혈분의 복열을 내리고 어혈을 깨뜨려 거어생신祛瘀生新함 황금, 연교 : 황금이 기분氣分의 울화를 청리淸理하고, 연교가 경청輕淸한 성질로 혈분血分에 침범한 복열을 밖으로 투발시킴 ②익기양음益氣養陰, 소리기기疏理氣機 모듈 — ‘장화식기壯火食氣’로 손상된 원기와 음액陰液을 충전함 황기, 청피, 석곡 : 황기가 보양원기補養元氣, 기열肌熱을 제거하고, 청피가 소리기기疏理氣機하여 황기의 보기가 체하지 않게 조율함. 석곡이 자음생진滋陰生津하여 영음營陰을 윤통潤通함 ③서근활락舒筋活絡, 강근골强筋骨 모듈 — 경락을 윤통하여 근육무력을 해소함 오가피, 갈근, 계혈등 : 오가피가 강근골强筋骨하고, 갈근이 항배項背 경락을 소통시키며 복열의 투해透解를 도움. 계혈등이 행혈보혈行血補血, 서경활락舒經活絡함 ④건비화중健脾和中, 조화제약調和諸藥 모듈 — 한량寒涼한 약재로 인한 중초中焦 손상을 막고 약성을 조화롭게 함 백출, 감초 : 백출이 건비익기健脾益氣, 조습燥濕하여 비위를 보살피고 한량약의 부작용을 방지하며, 감초가 중초를 보하고 제약諸藥을 조화롭게 통제함","master":"①혈분복열血分伏熱과 병기 인식의 전환 피부근염의 발병 근본을 혈분복열血分伏熱로 규정함. 질환 초기에 발열, 인후통, 기침 등의 외감 증상 없이 피부 반진斑疹으로 시작되는 것은 외감이 아닌 혈분血分에 잠복해 있던 열독熱毒이 발현된 것임. 어열瘀熱이 음락陰絡에서 양락陽絡 및 위표衛表로 투발할 때 반진이 발생하고, 기분氣分 경락으로 전입하면 ‘장화식기壯火食氣’ 기전에 의해 기음氣陰이 손상되어 근육 무력이 유발됨 ②순세투사順勢透邪 및 인체 자연치유력 존중 피부에 나타나는 반진은 질병의 악화가 아니라, 인체가 자율적인 치유 능력을 작동시켜 혈분의 복열을 밖으로 몰아내는 사기가 밖으로 빠져나오는 외적 징후임. 따라서 초기에 강한 스테로이드나 면역억제제로 반진을 억제하는 것은 사기의 출로를 막아 병을 장기화시킬 수 있다고 봄(대사의 병기 관점이며, 표준 치료의 중단·회피를 뜻하지 않음). 치료할 때 사기의 흐름에 순응하여 밖으로 내보내는 순세투사를 위주로 해야 함 ③‘장화식기壯火食氣’ 극복 및 공보겸시 장경악의 이론을 수용하여 장화壯火를 기음氣陰을 손상시키는 화열火熱의 사기로 정의함. 피부근염에서 복열이 경락에 체류해 형성된 장화가 경기經氣와 진액津液을 갉아먹어 위증痿證이 발생하므로, 치료할 때 순세투사로 본本을 치는 동시에 황기, 청피 및 오가피, 갈근, 계혈등, 석곡으로 익기양음益氣養陰, 서근활락舒筋活絡하여 실질적인 근력肌力을 회복시킴 ④정밀 가감 체계 폐섬유화가 동반될 때 : 制패모, 노로통路路通을 추가하여 폐락肺絡을 소통시킴","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 피부근염은 희귀질환으로 대규모 임상이 어려우므로 증례 축적과 기전 연구 중심으로 접근하는 것이 현실적 참고문헌 [1] 판궈슝,류칭난,장푸리,등.국의대사 루팡의 소반익력탕을 활용한 피부근염 치료 경험國醫大師盧芳運用消斑益力湯治療皮肌炎經驗[J].풍습병과 관절염風濕病與關節炎,2022,11(12):27-30."}},{"id":"2-8","ko":"낭창녕복탕","hz":"狼瘡寧復湯","alias":"","master_ko":"저우신유","master_hz":"周信有","tagline":"보신익기補腎益氣, 청열해독淸熱解毒, 거어통락祛瘀通絡으로 전신홍반루푸스를 치료하는 처방","meta":{"주요 적응증":"전신성 홍반성 루푸스","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":119,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-8 낭창녕복탕狼瘡寧復湯의 모듈 구성<\/p><h4>①보신고본補腎固本, 고무정기鼓舞正氣 모듈 — 선천의 근본인 신을 보하고 근본을 굳건히 하여 정기를 진작시킴<\/h4><p><b>음양곽, 상기생, 보골지, 파극천<\/b>: 음양곽과 파극천은 신양腎陽을 온보하여 명문화命門火를 북돋우고, 보골지는 신장의 기를 온보하고 신장을 수렴하여 고섭固攝하며, 상기생은 간신肝腎을 보익하고 근골을 강건하게 함으로써 선천지본先天之本을 배양하고 정기를 진작시킴<\/p><h4>②보익비폐補益脾肺, 고표익기固表益氣 모듈 — 후천지본後天之本인 비위를 보강하여 수곡정미의 생성을 돕고, 폐의 선발숙강宣發肅降 기능을 조절하여 기표주리肌表腠理의 방어 기능을 강화함<\/h4><p><b>황기<\/b>: 비의 기를 보하여 후천지본을 보강하고 폐기를 북돋워 위기衛氣를 충실하게 함으로써 기표주리肌表腠理를 견고하게 하고 외부 사기의 침습에 대한 방어 기능을 강화함<\/p><h4>③청열해독淸熱解毒, 사화해독瀉火解毒 모듈 — 내부의 열을 내리고 열독을 제거하며 어독瘀毒을 해소함<\/h4><p><b>자초, 백화사설초, 반지련, 판람근<\/b>: 자초가 혈분血分으로 들어가 사열邪熱을 식히고 어독을 해소하며, 백화사설초와 반지련이 강력한 청열해독 작용으로 전신 염증 독소를 차단하고, 판람근이 양혈해독涼血解毒하여 내부의 열독을 식히고 다스림으로써 면역 과반응으로 유발된 조직 손상과 독소를 해소함<\/p><h4>④보혈활혈補血活血, 거어통락祛瘀通絡 모듈 — 혈액을 보충하고 혈맥을 소통시켜 경락의 어혈을 제거함<\/h4><p><b>당귀, 적작약, 단삼<\/b>: 당귀가 혈분血分을 보하고 정체된 혈맥血脈을 소통疏通시키며, 적작약이 혈분의 울열鬱熱을 내리고 어혈을 풀어주며, 단삼이 혈맥을 활성화하여 경락 깊은 곳의 정체를 풀어냄으로써 보혈補血과 활혈活血을 동시에 도모하여 미세순환 장애를 개선하고 거어祛瘀 효과를 완성함<\/p><h4>⑤조화영위調和營衛 모듈 — 영분營分과 위분衛分의 조화를 도모하여 기표肌表의 음양 균형을 조율함<\/h4><p><b>계지, 백작약<\/b>: 계지가 위분衛分의 양기를 통하게 하여 표기表氣의 막힘을 풀어주고, 백작약이 영분營分의 음혈陰血을 수렴하여 영기營氣를 조화롭게 함으로써, 영위가 조화를 이루고 기표肌表의 음양 균형을 조율함<\/p><h4>⑥거습제풍祛濕除風, 통락지통通絡止痛 모듈 — 경락 깊이 침범한 풍습風濕의 사기를 쫓아내고 통증을 완화함<\/h4><p><b>계혈등, 오초사, 전갈<\/b>: 계혈등이 양혈활혈養血活血하여 ‘혈행풍자멸血行風自滅’의 원리로 경락을 소통시키며, 오초사와 전갈이 강렬한 수풍搜風작용으로 경락 깊이 침범한 풍습의 사기를 몰아내고 통락지통通絡止痛함으로써 정체된 기혈을 풀어주고 풍습통증을 완화함<\/p>"},{"k":"master","t":"저우신유의 전신홍반루푸스 치료","html":"<h4>①본허표실本虛標實 병기에 기반한 표본동치標本同治 및 공보겸시攻補兼施<\/h4><p>전신홍반루푸스를 치료할 때 비신휴허脾腎虧虛로 정기가 부족한 상태에서 풍습風濕의 사기를 접하여 발병한 것으로 파악함. 풍습이 들어와 열로 변하고 독이 되어, 그 열독이 혈분에 엉켜 어혈을 이뤄 장부와 피부, 근골을 손상시킴. 비신휴허의 본허本虛와 어독내온瘀毒內蘊, 영위불화營衛不和의 표실標實 병기가 복합될 때, 사기를 제거하면서도 정기를 손상시키지 않고, 부정보허扶正補虛하면서도 사기를 남겨두지 않는 표본동치, 공보겸시의 관점을 제시함<\/p><h4>②선천지본先天之本과 후천지본後天之本의 동시 보강을 통한 정기의 고무<\/h4><p>신장을 보강하는 음양곽, 상기생, 보골지, 파극천으로 선천지본을 굳건히 고정하는 동시에, 황기로 비폐脾肺의 기를 보하여 후천지본과 기표주리肌表腠理를 견고하게 하며, 이를 통해 근본적인 정기를 고무시킴<\/p><h4>③청열해독淸熱解毒과 활혈통락活血通絡을 통한 어독瘀毒 해소 및 경락 병리 개선<\/h4><p>질환의 진행 과정에서 발생하는 내부 어독瘀毒과 경락의 어혈을 제어하기 위해 자초, 백화사설초, 반지련, 판람근으로 청열해독하는 동시에, 당귀, 적작약, 단삼으로 보혈활혈補血活血, 거어통락祛瘀通絡함. 계지, 백작약으로 조화영위調和營衛하고, 계혈등, 오초사, 전갈로 거습제풍祛濕除風하여 전신성 기혈, 경락 병리를 종합적으로 조절함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">루푸스 대상 중의·중약 공개자료상 제품화 사례가 확인되지 않아 국내에서도 표준치료 병용 시 스테로이드 감량 효과를 보는 탐색 연구로 시작할 수 있음. 국내 공정서(약전·규격집)에 없는 오초사가 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 쉐멍쥐.저우신유의 전신성 홍반성 루푸스 치료 경험周信有治療系統性紅斑狼瘡的經驗[J].세계중의약世界中醫藥,2007,(1):21-22.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"음양곽20g","name":"음양곽","dose":"20g","base":"음양곽"},{"raw":"상기생20g","name":"상기생","dose":"20g","base":"상기생"},{"raw":"보골지20g","name":"보골지","dose":"20g","base":"보골지"},{"raw":"파극천20g","name":"파극천","dose":"20g","base":"파극천"},{"raw":"황기30g","name":"황기","dose":"30g","base":"황기"},{"raw":"자초20g","name":"자초","dose":"20g","base":"자초"},{"raw":"백화사설초20g","name":"백화사설초","dose":"20g","base":"백화사설초"},{"raw":"반지련20g","name":"반지련","dose":"20g","base":"반지련"},{"raw":"판람근20g","name":"판람근","dose":"20g","base":"판람근"},{"raw":"당귀9g","name":"당귀","dose":"9g","base":"당귀"},{"raw":"적작약9g","name":"적작약","dose":"9g","base":"적작약"},{"raw":"단삼20g","name":"단삼","dose":"20g","base":"단삼"},{"raw":"계지9g","name":"계지","dose":"9g","base":"계지"},{"raw":"백작약9g","name":"백작약","dose":"9g","base":"백작약"},{"raw":"계혈등20g","name":"계혈등","dose":"20g","base":"계혈등"},{"raw":"오초사9g","name":"오초사","dose":"9g","base":"오초사"},{"raw":"전갈6g","name":"전갈","dose":"6g","base":"전갈"}],"notes":[],"핵심 효능":["신장의 정기를 보하고 기를 북돋움(보신익기補腎益氣)","열을 내리고 어독瘀毒을 제거함(청열해독淸熱解毒)","어혈을 제거하고 경락을 소통시킴(거어통락祛瘀通絡)","영기와 위기의 조화를 회복함(조화영위調和營衛)"],"주치증":["비신휴허脾腎虧虛, 어독내온瘀毒內蘊, 영위불화營衛不和로 인한 전신홍반루푸스 본허표실本虛標實 증후"],"연구 확장 영역":["자가면역 질환(전신홍반루푸스, 류마티스 관절염, 만성 면역계 염증 질환)"],"R&D 포인트":["자초, 백화사설초, 반지련, 판람근의 복합 작용을 통한 자가면역 염증 신호전달 경로 차단 및 염증성 독소 해소","음양곽, 상기생, 보골지, 파극천, 황기의 배합을 통한 면역 조율 및 면역계 손상 복구, 면역 조절 효과를 검증할 천연물 후보 소재","당귀, 적작약, 단삼, 계혈등, 전갈, 오초사의 활혈거어活血祛瘀 및 경락소통 작용을 통한 미세순환 장애 개선 및 조직 손상 회복"]},"modules":[{"name":"①보신고본 · 고무정기","hz":"補腎固本 · 鼓舞正氣","herbs":["음양곽","상기생","보골지","파극천"],"role":"선천의 근본인 신을 보하고 근본을 굳건히 하여 정기를 진작시킴 후천지본後天之本인 비위를 보강하여"},{"name":"②보익비폐 · 고표익기","hz":"補益脾肺 · 固表益氣","herbs":["황기"],"role":"수곡정미의 생성을 돕고, 폐의 선발숙강宣發肅降 기능을 조절하여 기표주리肌表腠理의 방어 기능을 강화함"},{"name":"③청열해독 · 사화해독","hz":"淸熱解毒 · 瀉火解毒","herbs":["자초","백화사설초","반지련","판람근"],"role":"내부의 열을 내리고 열독을 제거하며 어독瘀毒을 해소함"},{"name":"④보혈활혈 · 거어통락","hz":"補血活血 · 祛瘀通絡","herbs":["당귀","적작약","단삼"],"role":"혈액을 보충하고 혈맥을 소통시켜 경락의 어혈을 제거함"},{"name":"⑤조화영위","hz":"調和營衛","herbs":["계지","백작약"],"role":"영분營分과 위분衛分의 조화를 도모하여 기표肌表의 음양 균형을 조율함"},{"name":"⑥거습제풍 · 통락지통","hz":"祛濕除風 · 通絡止痛","herbs":["계혈등","오초사","전갈"],"role":"경락 깊이 침범한 풍습風濕의 사기를 쫓아내고 통증을 완화함"}],"rd":[{"tag":"SLE Adjunct","title":"표준치료 병용 시 질병 활성도와 스테로이드 감량","html":"<p><b>근거<\/b> 가 2007년 경험 보고 1편이어서 스테로이드 감량 효과로 단정할 수 없음 표준치료(하이드록시클로로퀸·스테로이드·면역억제제)를 유지한 SLE 환자의 SLEDAI 점수와 스테로이드 사용량을 후향적으로 분석하는 것부터 시작 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2007, 루푸스 치료 경험))<\/p>"},{"tag":"Formula Simplification","title":"17종 대처방의 모듈 분리와 단순화","html":"<p>보신익기(음양곽·상기생·보골지·파극천·황기)와 청열해독(자초·백화사설초·반지련· 판람근) 두 모듈로 나누어 각 모듈의 면역 조절 효과를 루푸스 모델(MRL/lpr 생쥐) 에서 비교함 이렇게 하면 개발 가능한 최소 처방을 찾을 수 있음 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 1·2)<\/p>"},{"tag":"Vascular Endothelium","title":"루푸스 혈관 내피 손상과 활혈 모듈","html":"<p>당귀·적작약·단삼·계혈등의 활혈 모듈을 루푸스 환자의 혈관 내피 기능 저하 (혈류매개 혈관확장 반응)와 연결함 나아가 심혈관 합병증 위험 관리라는 별도 적응증 가능성을 검토 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「보혈활혈과 거어통락」)<\/p>"},{"tag":"Lupus Nephritis","title":"루푸스 신염의 단백뇨 경과와 약물 상호작용","html":"<p>루푸스 신염은 신장 활동도와 면역억제 치료가 결과에 직접 연관됨 SLE 전체와 분리된 별도 연구 대상으로 정하고, 표준 면역억제 치료를 유지한 환자에서 24시간 단백뇨·사구체여과율 변화와 면역억제제와의 상호작용(간·신장 기능)을 관찰 (근거 유형: 임상 경험 보고 | 근거: 본문 조성표(보신익기 모듈), 참고문헌 [1])<\/p>"}],"logic":[{"n":"1","title":"보신익기補腎益氣와 정기 고무","body":"선천의 신장과 후천의 비위를 함께 보강하여 면역 항상성을 회복함"},{"n":"2","title":"청열해독淸熱解毒과 어독 해소","body":"내부의 열을 식히고 강력한 해독 약물로 전신 염증 독소를 차단함"},{"n":"3","title":"보혈활혈補血活血과 거어통락祛瘀通絡","body":"혈맥을 보충하고 통하게 하여 어혈과 경락의 정체를 풀어줌"},{"n":"4","title":"조화영위調和營衛와 거습제풍祛濕除風","body":"영위의 균형을 맞추고 깊은 곳의 풍습 사기를 몰아냄"}],"field":2,"pages":[119,122],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-8","낭창녕복탕","狼瘡寧復湯","","저우신유","周信有","보신익기補腎益氣, 청열해독淸熱解毒, 거어통락祛瘀通絡으로 전신홍반루푸스를 치료하는 처방","음양곽20g 상기생20g 보골지20g 파극천20g 황기30g 자초20g 백화사설초20g 반지련20g 판람근20g 당귀9g 적작약9g 단삼20g 계지9g 백작약9g 계혈등20g 오초사9g 전갈6g","","핵심 효능 신장의 정기를 보하고 기를 북돋움(보신익기補腎益氣) 열을 내리고 어독瘀毒을 제거함(청열해독淸熱解毒) 어혈을 제거하고 경락을 소통시킴(거어통락祛瘀通絡) 영기와 위기의 조화를 회복함(조화영위調和營衛)","주치증 비신휴허脾腎虧虛, 어독내온瘀毒內蘊, 영위불화營衛不和로 인한 전신홍반루푸스 본허표실本虛標實 증후","연구 확장 영역 자가면역 질환(전신홍반루푸스, 류마티스 관절염, 만성 면역계 염증 질환)","R&D 포인트 자초, 백화사설초, 반지련, 판람근의 복합 작용을 통한 자가면역 염증 신호전달 경로 차단 및 염증성 독소 해소 음양곽, 상기생, 보골지, 파극천, 황기의 배합을 통한 면역 조율 및 면역계 손상 복구, 면역 조절 효과를 검증할 천연물 후보 소재 당귀, 적작약, 단삼, 계혈등, 전갈, 오초사의 활혈거어活血祛瘀 및 경락소통 작용을 통한 미세순환 장애 개선 및 조직 손상 회복","①보신고본 · 고무정기 補腎固本 · 鼓舞正氣 음양곽 상기생 보골지 파극천 선천의 근본인 신을 보하고 근본을 굳건히 하여 정기를 진작시킴 후천지본後天之本인 비위를 보강하여","②보익비폐 · 고표익기 補益脾肺 · 固表益氣 황기 수곡정미의 생성을 돕고, 폐의 선발숙강宣發肅降 기능을 조절하여 기표주리肌表腠理의 방어 기능을 강화함","③청열해독 · 사화해독 淸熱解毒 · 瀉火解毒 자초 백화사설초 반지련 판람근 내부의 열을 내리고 열독을 제거하며 어독瘀毒을 해소함","④보혈활혈 · 거어통락 補血活血 · 祛瘀通絡 당귀 적작약 단삼 혈액을 보충하고 혈맥을 소통시켜 경락의 어혈을 제거함","⑤조화영위 調和營衛 계지 백작약 영분營分과 위분衛分의 조화를 도모하여 기표肌表의 음양 균형을 조율함","⑥거습제풍 · 통락지통 祛濕除風 · 通絡止痛 계혈등 오초사 전갈 경락 깊이 침범한 풍습風濕의 사기를 쫓아내고 통증을 완화함","보신익기補腎益氣와 정기 고무 선천의 신장과 후천의 비위를 함께 보강하여 면역 항상성을 회복함","청열해독淸熱解毒과 어독 해소 내부의 열을 식히고 강력한 해독 약물로 전신 염증 독소를 차단함","보혈활혈補血活血과 거어통락祛瘀通絡 혈맥을 보충하고 통하게 하여 어혈과 경락의 정체를 풀어줌","조화영위調和營衛와 거습제풍祛濕除風 영위의 균형을 맞추고 깊은 곳의 풍습 사기를 몰아냄","SLE Adjunct 표준치료 병용 시 질병 활성도와 스테로이드 감량 근거 가 2007년 경험 보고 1편이어서 스테로이드 감량 효과로 단정할 수 없음 표준치료(하이드록시클로로퀸·스테로이드·면역억제제)를 유지한 SLE 환자의 SLEDAI 점수와 스테로이드 사용량을 후향적으로 분석하는 것부터 시작 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2007, 루푸스 치료 경험))","Formula Simplification 17종 대처방의 모듈 분리와 단순화 보신익기(음양곽·상기생·보골지·파극천·황기)와 청열해독(자초·백화사설초·반지련· 판람근) 두 모듈로 나누어 각 모듈의 면역 조절 효과를 루푸스 모델(MRL/lpr 생쥐) 에서 비교함 이렇게 하면 개발 가능한 최소 처방을 찾을 수 있음 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 1·2)","Vascular Endothelium 루푸스 혈관 내피 손상과 활혈 모듈 당귀·적작약·단삼·계혈등의 활혈 모듈을 루푸스 환자의 혈관 내피 기능 저하 (혈류매개 혈관확장 반응)와 연결함 나아가 심혈관 합병증 위험 관리라는 별도 적응증 가능성을 검토 (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「보혈활혈과 거어통락」)","Lupus Nephritis 루푸스 신염의 단백뇨 경과와 약물 상호작용 루푸스 신염은 신장 활동도와 면역억제 치료가 결과에 직접 연관됨 SLE 전체와 분리된 별도 연구 대상으로 정하고, 표준 면역억제 치료를 유지한 환자에서 24시간 단백뇨·사구체여과율 변화와 면역억제제와의 상호작용(간·신장 기능)을 관찰 (근거 유형: 임상 경험 보고 | 근거: 본문 조성표(보신익기 모듈), 참고문헌 [1])"],"ss":{"composition":"그림 2-8 낭창녕복탕狼瘡寧復湯의 모듈 구성 ①보신고본補腎固本, 고무정기鼓舞正氣 모듈 — 선천의 근본인 신을 보하고 근본을 굳건히 하여 정기를 진작시킴 음양곽, 상기생, 보골지, 파극천 : 음양곽과 파극천은 신양腎陽을 온보하여 명문화命門火를 북돋우고, 보골지는 신장의 기를 온보하고 신장을 수렴하여 고섭固攝하며, 상기생은 간신肝腎을 보익하고 근골을 강건하게 함으로써 선천지본先天之本을 배양하고 정기를 진작시킴 ②보익비폐補益脾肺, 고표익기固表益氣 모듈 — 후천지본後天之本인 비위를 보강하여 수곡정미의 생성을 돕고, 폐의 선발숙강宣發肅降 기능을 조절하여 기표주리肌表腠理의 방어 기능을 강화함 황기 : 비의 기를 보하여 후천지본을 보강하고 폐기를 북돋워 위기衛氣를 충실하게 함으로써 기표주리肌表腠理를 견고하게 하고 외부 사기의 침습에 대한 방어 기능을 강화함 ③청열해독淸熱解毒, 사화해독瀉火解毒 모듈 — 내부의 열을 내리고 열독을 제거하며 어독瘀毒을 해소함 자초, 백화사설초, 반지련, 판람근 : 자초가 혈분血分으로 들어가 사열邪熱을 식히고 어독을 해소하며, 백화사설초와 반지련이 강력한 청열해독 작용으로 전신 염증 독소를 차단하고, 판람근이 양혈해독涼血解毒하여 내부의 열독을 식히고 다스림으로써 면역 과반응으로 유발된 조직 손상과 독소를 해소함 ④보혈활혈補血活血, 거어통락祛瘀通絡 모듈 — 혈액을 보충하고 혈맥을 소통시켜 경락의 어혈을 제거함 당귀, 적작약, 단삼 : 당귀가 혈분血分을 보하고 정체된 혈맥血脈을 소통疏通시키며, 적작약이 혈분의 울열鬱熱을 내리고 어혈을 풀어주며, 단삼이 혈맥을 활성화하여 경락 깊은 곳의 정체를 풀어냄으로써 보혈補血과 활혈活血을 동시에 도모하여 미세순환 장애를 개선하고 거어祛瘀 효과를 완성함 ⑤조화영위調和營衛 모듈 — 영분營分과 위분衛分의 조화를 도모하여 기표肌表의 음양 균형을 조율함 계지, 백작약 : 계지가 위분衛分의 양기를 통하게 하여 표기表氣의 막힘을 풀어주고, 백작약이 영분營分의 음혈陰血을 수렴하여 영기營氣를 조화롭게 함으로써, 영위가 조화를 이루고 기표肌表의 음양 균형을 조율함 ⑥거습제풍祛濕除風, 통락지통通絡止痛 모듈 — 경락 깊이 침범한 풍습風濕의 사기를 쫓아내고 통증을 완화함 계혈등, 오초사, 전갈 : 계혈등이 양혈활혈養血活血하여 ‘혈행풍자멸血行風自滅’의 원리로 경락을 소통시키며, 오초사와 전갈이 강렬한 수풍搜風작용으로 경락 깊이 침범한 풍습의 사기를 몰아내고 통락지통通絡止痛함으로써 정체된 기혈을 풀어주고 풍습통증을 완화함","master":"①본허표실本虛標實 병기에 기반한 표본동치標本同治 및 공보겸시攻補兼施 전신홍반루푸스를 치료할 때 비신휴허脾腎虧虛로 정기가 부족한 상태에서 풍습風濕의 사기를 접하여 발병한 것으로 파악함. 풍습이 들어와 열로 변하고 독이 되어, 그 열독이 혈분에 엉켜 어혈을 이뤄 장부와 피부, 근골을 손상시킴. 비신휴허의 본허本虛와 어독내온瘀毒內蘊, 영위불화營衛不和의 표실標實 병기가 복합될 때, 사기를 제거하면서도 정기를 손상시키지 않고, 부정보허扶正補虛하면서도 사기를 남겨두지 않는 표본동치, 공보겸시의 관점을 제시함 ②선천지본先天之本과 후천지본後天之本의 동시 보강을 통한 정기의 고무 신장을 보강하는 음양곽, 상기생, 보골지, 파극천으로 선천지본을 굳건히 고정하는 동시에, 황기로 비폐脾肺의 기를 보하여 후천지본과 기표주리肌表腠理를 견고하게 하며, 이를 통해 근본적인 정기를 고무시킴 ③청열해독淸熱解毒과 활혈통락活血通絡을 통한 어독瘀毒 해소 및 경락 병리 개선 질환의 진행 과정에서 발생하는 내부 어독瘀毒과 경락의 어혈을 제어하기 위해 자초, 백화사설초, 반지련, 판람근으로 청열해독하는 동시에, 당귀, 적작약, 단삼으로 보혈활혈補血活血, 거어통락祛瘀通絡함. 계지, 백작약으로 조화영위調和營衛하고, 계혈등, 오초사, 전갈로 거습제풍祛濕除風하여 전신성 기혈, 경락 병리를 종합적으로 조절함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 루푸스 대상 중의·중약 공개자료상 제품화 사례가 확인되지 않아 국내에서도 표준치료 병용 시 스테로이드 감량 효과를 보는 탐색 연구로 시작할 수 있음. 국내 공정서(약전·규격집)에 없는 오초사가 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 쉐멍쥐.저우신유의 전신성 홍반성 루푸스 치료 경험周信有治療系統性紅斑狼瘡的經驗[J].세계중의약世界中醫藥,2007,(1):21-22."}},{"id":"2-9","ko":"양혈소반탕","hz":"涼血消斑湯","alias":"","master_ko":"돤푸진","master_hz":"段富津","tagline":"양혈활혈涼血活血, 소풍청열疏風淸熱로 혈열형血熱型 IgA 혈관염을 치료하는 처방","meta":{"주요 적응증":"혈열형 IgA 혈관염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":123,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-9 양혈소반탕涼血消斑湯의 모듈 구성<\/p><h4>①청열양혈淸熱涼血, 활혈화어活血化瘀 모듈 — 혈분의 사열邪熱을 내리고 정혈을 보호하는 동시에, 혈열血熱로 인해 형성된 어혈을 제거<\/h4><p><b>생지황, 적작약, 목단피<\/b>: 생지황이 청열양혈淸熱涼血, 양혈지혈涼血止血하고, 적작약이 행혈화어行血化瘀하여 혈중의 체증을 풀며, 목단피가 혈분의 복열을 내리고 어혈을 풀며 거어생신祛瘀生新함<\/p><h4>②청열해독淸熱解毒, 양혈소반涼血消斑 모듈 — 혈중에 침투한 독열毒熱을 제거하고 피하의 자반과 독소를 해소함<\/h4><p><b>대청엽, 현삼<\/b>: 대청엽이 열독을 풀고 혈분을 식혀 자반을 없애며, 현삼이 자음滋陰하고 열화熱火를 내려 자반의 독성을 해소함. 두 약재가 배합되어 혈분에 쌓인 열독을 근본적으로 제거함<\/p><h4>③양혈활혈養血活血, 통경통락通經通絡 모듈 — 손상된 음혈을 보충하고 기혈의 통행을 유도하여, 정기를 손상시키지 않으면서 경락과 미세혈관의 소통을 원활하게 함<\/h4><p><b>당귀, 천궁<\/b>: 당귀가 보혈활혈補血活血하여 혈액을 보충하고, 천궁이 기혈을 소통시켜 통증과 정체를 풀어줌. 두 약재가 배합되어 사물탕 체계를 보완함으로써, 어혈을 제거하되 정기를 손상시키지 않고 출혈로 상실된 혈액을 보충함<\/p><h4>④소풍산열疏風散熱, 소반지양消斑止癢 모듈 — 체표와 혈분의 풍열風熱사기를 소산시켜 가려움증을 완화하고 체표의 반진 독소를 해소함<\/h4><p><b>선퇴, 우방자, 형개, 고삼<\/b>: 선퇴가 피부의 풍열을 소산하고, 우방자가 반진의 독을 밖으로 밀어내 풀어주며, 형개가 체표와 혈분의 풍사를 제거하여 가려움증을 완화하고, 고삼이 습열濕熱을 없애 가려움증을 다스림. 네 약재가 어우러져 소산풍열疏散風熱, 소반지양消斑止癢의 효능을 발휘함<\/p><h4>⑤조화제약調和諸藥, 익기해독益氣解毒 모듈 — 약재의 성질을 조화롭게 하고 중초를 보호하며 처방 전체의 해독 작용을 보좌함<\/h4><p><b>감초<\/b>: 약성을 조화롭게 하고, 중초를 보호하며, 형개, 우방자 등과 어우러져 피부의 열독을 푸는 효능을 보좌함<\/p>"},{"k":"master","t":"돤푸진의 IgA 혈관염 치료","html":"<h4>①소체혈열素體血熱과 외감풍열外感風熱의 동시 제어를 위한 양혈소풍涼血疏風<\/h4><p>IgA 혈관염을 본래 내재된 소체혈열素體血熱과 체표로 침입한 외감 풍열독사風熱毒邪가 결합하여 영혈분營血分으로 침투한 것으로 인식함. 열사가 혈액을 부추겨 맥 외로 넘치게 하고, 어혈과 자반을 형성하는 병기에 대응하여, 생지황, 대청엽, 현삼으로 혈분을 식히는 동시에 형개, 선퇴, 우방자로 풍열을 제거하는 치료 관점을 제시함<\/p><h4>②수삽지혈收澁止血의 폐단을 경계하고 활혈거어活血祛瘀를 통한 소반消斑 도모<\/h4><p>혈액은 맥을 벗어나는 즉시 어혈이 되므로, 혈증은 거어祛瘀를 으뜸으로 삼는다는 《혈증론血證論》의 관점에 기반함. 수삽 작용이 강한 지혈약을 쓰면 어혈을 남기는 폐단을 경계하고, 적작약, 목단피, 당귀, 천궁을 가하여 활혈거어, 양혈퇴열涼血退熱시킴으로써, 어혈을 제거하여 자반이 자연스럽게 소멸하도록 유도함<\/p><h4>③사물탕과 소독서각음消毒犀角飮의 유기적 결합을 통한 어독瘀毒 제거<\/h4><p>생지황, 적작약, 당귀, 천궁을 사용한 양혈활혈涼血活血의 사물탕 체계와 우방자, 형개, 선퇴, 고삼, 감초 등을 사용하여 소풍해독疏風解毒의 소독서각음(우방자, 형개, 방풍, 감초로 구성)체계를 정밀하게 융합, 변용한 처방임. 혈중의 독열을 풀어주고 어혈을 제거하여 자반이 스스로 사라지게 하는 종합적 치료 체계를 제시함<\/p><h4>④변증에 따른 가감 활용<\/h4><p><b>음허혈열형陰虛血熱型<\/b>: 원방의 생지황 용량을 늘리고 적작약 대신 백작약으로 교체하며, 하수오, 귀판 등 익음약益陰藥을 가미함 풍습혈열형風濕血熱型: 원방에 복령, 창출, 백미白薇, 의이인, 방기 등 청열거습약淸熱祛濕藥을 가미함<\/p><p><b>기허혈열형氣虛血熱型<\/b>: 원방에 황기, 당삼 등 익기건비약益氣健脾藥을 가미함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">IgA 혈관염 대상 공개자료상 제품·특허가 확인되지 않으며, 소아 환자가 많은 질환이므로 소아 안전성 자료 확보가 개발의 전제<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 판둥밍,돤펑리,리지.돤푸진 교수의 알레르기성 자반증 치료 경험段富津教授治療過敏性紫癜經驗[J].중의약학보中醫藥學報,2003,(1):18.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"생지황40g","name":"생지황","dose":"40g","base":"생지황"},{"raw":"당귀15g","name":"당귀","dose":"15g","base":"당귀"},{"raw":"적작약15g","name":"적작약","dose":"15g","base":"적작약"},{"raw":"형개15g","name":"형개","dose":"15g","base":"형개"},{"raw":"우방자15g","name":"우방자","dose":"15g","base":"우방자"},{"raw":"선퇴15g","name":"선퇴","dose":"15g","base":"선퇴"},{"raw":"목단피15g","name":"목단피","dose":"15g","base":"목단피"},{"raw":"고삼15g","name":"고삼","dose":"15g","base":"고삼"},{"raw":"감초15g","name":"감초","dose":"15g","base":"감초"},{"raw":"천궁10g","name":"천궁","dose":"10g","base":"천궁"},{"raw":"대청엽20g","name":"대청엽","dose":"20g","base":"대청엽"},{"raw":"현삼20g","name":"현삼","dose":"20g","base":"현삼"}],"notes":[],"핵심 효능":["혈분을 서늘하게 하고 어혈을 풀어 혈맥을 소통시킴(양혈활혈涼血活血)","풍사를 소산하고 열을 청해함(소풍청열疏風淸熱)"],"주치증":["혈열형血熱型 IgA 혈관염"],"연구 확장 영역":["혈관염, IgA 혈관염, 자반성 신장염, 혈열성 피부 질환, 만성 염증성 출혈 질환"],"R&D 포인트":["대청엽, 현삼, 생지황의 복합 배합을 통한 혈중 독열毒熱 차단 및 광범위 염증성 사이토카인 억제 천연물 신약 소재","목단피, 적작약, 당귀, 천궁의 활혈거어活血祛瘀 및 혈맥 소통 작용을 통한 피부 미세혈관의 출혈 및 어혈 소멸","형개, 우방자, 선퇴, 고삼의 소풍지양疏風止癢 작용을 통한 피부 알레르기 반응 및 면역과민 개선"]},"modules":[{"name":"①청열양혈 · 활혈화어","hz":"淸熱涼血 · 活血化瘀","

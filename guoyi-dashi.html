일수一散一收’ 구조임 단미 대비 배합의 위 평활근 진경과 위 배출 조절 효과를 비교하여 처방 내 역할을 확인 (근거 유형: 간접 근거 | 근거: R&D 논리 3 「계지와 백작약의 일산일수」)","Reversal Endpoint 위샘 위축 역전율을 1차 지표로 한 임상 보고된 위축 역전 효과를 확인하려면 6~12개월 투여 후 표준화된 생검(OLGA 병기 체계)과 맹검 병리 판독, 대조군을 갖춘 무작위 대조 임상이 필요함 이것이 천연물 신약 개발의 핵심 근거가 됨 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [1](진료 관점), [2](임상·실험 연구))"],"ss":{"composition":"그림 1-7 향사온중탕香砂溫中湯의 모듈 구성 ①건비양위健脾養胃 모듈 — 중초의 기운을 보하고 비위의 운화 기반을 튼튼히 다짐 백출 : 비기脾氣를 크게 보하고 습을 말려 중초 운화의 중심축을 다짐 복령: 비장을 돕고 삼습滲濕하여 약재들이 보하되 정체되지 않도록 유도 감초: 중초를 따뜻하게 보하고 비위 기운을 다독이며 약재를 조화시킴 ②이기강기理氣降氣, 조습화담燥濕化痰 모듈 — 기체氣滯를 풀어 위기를 내리고 담습을 해소함 진피 : 기운을 소통시키고 습을 말려 이진탕二陳湯의 핵심 작용을 수행함 반하: 뭉친 담습痰濕을 삭이고 상역하는 위기를 아래로 내림 후박: 가슴과 위장의 울체된 기를 내려주어 답답함과 복부 팽만감을 해소 지각 : 중초의 기기를 순환시키고 답답한 기운을 내림 ③방향성비芳香醒脾, 온중화위溫中和胃 모듈 — 방향성으로 비장을 깨우고, 따뜻하게 하여 한습寒濕을 제거 목향 : 장관의 기체氣滯를 소통시켜 통증을 완화하고 비장의 운화를 도움 사인: 방향성으로 비장을 깨우고 위장을 편안하게 함 ④소간유간疏肝柔肝, 온통위양溫通胃陽 모듈 — 울체된 간기를 소통시키고 중초의 양기를 통하게 하여 간-비위의 기기를 균형 있게 조화시킴 향부자 : 간경의 울체된 기를 풀어 가슴과 위장의 뭉친 기기를 소통시킴 오약: 기혈순환을 촉진하고 찬 기운을 제거하여 중초의 냉통을 완화함 백작약: 간음을 수렴하고 유간지통柔肝止痛하며, 계지의 발산 성질이 음혈을 상하지 않도록 조절함 계지 : 비위의 양기를 따뜻하게 운화시켜 담음과 한습을 제거하고 혈맥을 소통시킴","master":"①인허치실因虛致實, 허실협잡虛實夾雜이 만성 위축성 위염의 핵심 병리 기전 만성 위축성 위염은 병의 경과가 길고 비위기허脾胃氣虛가 본질이며, 이로 인해 담습痰濕, 식적食積, 기체氣滯 등의 실증이 병합하는 허실협잡의 양상을 띰 간기울결肝氣鬱結이 비위의 운화를 방해하거나, 비위가 허약해진 것이 간기의 소통을 막는 병리적 악순환이 지속되어, 위점막 영양 공급이 차단되고 위축이 진행됨 ②비의건脾宜健, 위의화胃宜和, 간의소肝宜疏의 삼각 치료 법칙 대사는 단순히 보하거나 사하는 치료법을 지양하고, 비는 건비健脾하고, 위는 조화롭게 화위和胃시키며, 간은 소간疏肝시키는 종합적 치료 기전을 강조함 보약 중심의 처방에 기를 순환시키는 이기약理氣藥과 간을 부드럽게 하는 유간약柔肝藥을 정교하게 배합하여 보하되 체하지 않는 선순환을 이끌어냄 ③계지와 백작약의 일산일수一散一收 조율 계지의 신산辛散한 성질로 중초의 양기를 깨우고, 백작약의 수렴하는 성질로 간혈을 보하여 두 약재가 음양의 균형을 맞춤 이를 통해 강한 온열 약재가 간의 음혈이나 진액을 상하게 하는 부작용을 줄임 ④현대 초미세구조 및 생화학 지표 검증 위점막 세포기구 복구 : 전자현미경 관찰 결과, 치료 후 위 전정부胃竇 G세포의 분비과립 공포화 현상이 개선되고 미토콘드리아 및 조면소포체(RER) 등 세포 내 초미세구조가 정화, 재생됨을 확인 에너지 대사 및 내분비 정상화: 감소해 있던 에너지 대사 효소(ICD, LDH)를 정상화하고, 과항진된 교감신경, 카테콜아민 (CA, NE) 수치를 안정시킴 임상 성과: 국책 연구 결과, 임상 증상 완화는 물론 위점막 위샘 위축 역전율에서 높은 치료 효과를 보고하여 위축성 위염의 역전 가능성을 제시함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 향사육군자탕 계열과 겹치는 구성이어서 국내 기존 한방 제제와의 차별점(온중 강화)을 먼저 정리해야 함 참고문헌 [1] 궈수윈.리전화의 만성 위축성 위염 진료 사고와 방약郭淑雲.李振華診治慢性萎縮性胃炎的思路與方藥[J].랴오닝중의잡지遼寧中醫雜志,2010,37(10):1883-1884. [2] 리정성,황칭.국의대사 리전화 교수의 만성 위축성 위염에 대한 임상 및 실험 연구李鄭生,黃淸.國醫大師李振華教授對慢性萎縮性胃炎的臨床與實驗研究[C].허난중의학원 리전화학술사상연구소河南中醫學院李振華學術思想研究所,2010:176-181."}},{"id":"1-8","ko":"화간탕","hz":"和肝湯","alias":"","master_ko":"팡허첸","master_hz":"方和謙","tagline":"보중건비補中健脾, 소간리기疏肝理氣, 양혈유간養血柔肝을 통해 간비실화肝脾失和 및 기혈부조","meta":{"주요 적응증":"기능성 소화불량, 만성 위염(간비불화)","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"화간탕과립 (연구용)"},"page":50,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-8 화간탕和肝湯의 모듈 구성<\/p><h4>①체용겸고體用兼顧 모듈 — 간의 음혈을 보강하여 강한 성질의 간체를 부드럽게 유화柔和시킴<\/h4><p><b>당귀<\/b>: 혈을 보하고 간을 부드럽게 하며, 주산走散하는 성질로 기혈 순환을 촉진함<\/p><p><b>백작약<\/b>: 간혈을 수렴하고 통증을 완화하며, 당귀와 짝을 이뤄 간체를 부드럽게 함<\/p><h4>②소리삼초疏理三焦 모듈 — 울체된 간기를 소통시키고 삼초의 기기를 원활하게 순환시킴<\/h4><p><b>시호<\/b>: 울체된 간기를 소통시키고, 청기淸氣를 위로 끌어올림<\/p><p><b>박하<\/b>: 가볍게 발산하며, 시호를 도와 상초와 간경의 울열鬱熱을 풀어줌<\/p><p><b>소경<\/b>: 중초의 기를 다독여 편안하게 하고, 가슴의 답답함을 없앰<\/p><p><b>향부자<\/b>: 삼초의 기체를 풀고 간기를 순환시켜 통증을 완화함<\/p><h4>③배토실비培土實脾 모듈 — 비위의 기운을 보강하여 간목肝木의 침범을 막고 기기의 승강을 정상화함<\/h4><p><b>당삼<\/b>: 중초의 기를 보하고, 사군자탕의 핵심 축을 담당함<\/p><p><b>복령<\/b>: 비장을 돕고 습을 빼내어 담습의 정체를 방지함<\/p><p><b>백출<\/b>: 비장을 튼튼히 하고 습을 말려 운화를 정상화함<\/p><p><b>생강<\/b>: 위를 따뜻하게 하고 상역하는 위기를 내려 구토와 속쓰림을 완화<\/p><p><b>대추<\/b>: 비위 기운을 보강하고 영위, 기혈을 조화롭게 함<\/p><p><b>감초<\/b>: 급박한 기운을 완화하고 제약을 조율함<\/p>"},{"k":"master","t":"팡허첸의 간비동치肝脾同治 이론","html":"<h4>①‘간위오장지적肝爲五臟之賊, 치간선실비治肝先實脾’의 예방 병리 관점<\/h4><p>간은 기기 조절을 담당하나 쉽게 울결되고 간기가 치밀어 오르기 쉬워, 다른 장부로 병을 전변시키는 특성을 가짐<\/p><p>대사는 장중경의 “간의 병을 보면 간이 비장으로 전변될 것을 알고 먼저 비를 튼튼히 해야 한다見肝之病, 知肝傳脾,當先實脾”라는 사상을 바탕으로, 소요산 구조에 당삼, 대추를 보강하여 비토脾土를 선제적으로 배보培補함으로써 간기肝氣가 비위로 전변되는 것을 근본적으로 차단함<\/p><h4>②체용겸고體用兼顧, 기혈동조氣血同調의 정교한 배오<\/h4><p>간을 치료할 때 소기疏氣(용用)에만 치중하면 간음肝陰이 손상되고, 자배滋培(체體)에만 치중하면 기기가 울체되기 쉬움<\/p><p>당귀, 백작약의 산수酸收, 감윤甘潤 작용과 시호, 박하, 향부자, 소경의 신산辛散 작용을 결합하여, 간의 체體와 용用을 동시에 다스리고 기와 혈을 조화롭게 조율<\/p><h4>③소리삼초疏理三焦 및 현대 약리학적 이병동치異病同治의 검증<\/h4><p>상초(시호, 박하), 중초(소경, 백출), 하초(향부자, 당귀)로 이어지는 삼초의 기도를 소통시키는 약재 배합을 구축<\/p><p>데이터 마이닝과 임상·실험 연구에서 화간탕의 위장관 운동 촉진, 뇌-장관축 조절, 자율신경 안정 및 면역 조절 작용이 보고됨<\/p><p>이를 통해 단순 소화기 질환(위염, 기능성 소화불량, 역류성 식도염)부터 신경계(불면, 우울), 내분비계(갱년기 증후군), 피부 질환(두드러기(담마진蕁麻疹))에 이르기까지 폭넓게 응용하는 이병동치異病同治의 근거로 제시<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>본문 연구에 쓰인 화간탕과립和肝湯顆粒은 연구용 제제이며, 허가 중성약·신약 임상 등록·특허는 확인되지 않음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">연구용 과립으로 기전 연구가 축적되고 있으나 제품화 전 단계이므로, 국내에서 소요산 계열 기존 제제와의 비교 연구로 개발 가치를 확인할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 리원취안.팡허첸의 화간탕 임상 경험方和謙用“和肝湯”的臨床經驗[J].중의잡지中醫雜志,1992,(12):25-26.<\/li><li class=\"ref\">[2] 리원취안,취안훙,가오젠훙,등.팡허첸이 창방한 화간탕의 조방 원칙과 임상 응용方和謙創“和肝湯”的組方原則和臨床應用[J].상하이중의약잡지上海中醫藥雜志,2008,(2):1-3.<\/li><li class=\"ref\">[3] 리원취안,취안훙,가오젠훙,등.팡허첸 경험방 화간탕의 임상 응용 데이터 마이닝 연구方和謙經驗方“和肝湯”臨床應用數據的挖掘研究[J].중국중의기초의학 잡지中國中醫基礎醫學雜志,2008,(11):855-857.<\/li><li class=\"ref\">[4] 취안훙,제샤오징.팡허첸 경험방 가미화간탕의 만성 표재성 위염 치료 임상 연구方和謙經驗方加味和肝湯治療慢性淺表性胃炎臨床研究[J].베이징중의약北京中醫藥,2013,32(5):346-348.<\/li><li class=\"ref\">[5] 정진쑤,취안훙,가오젠훙,등.국의대사 팡허첸의 간울비허형 변비에 대한 화간탕 치료 임상 경험國醫大師方和謙運用和肝湯治療肝鬱脾虛型便秘臨床經驗[J].중화중의약잡지中華中醫藥雜志,2019,34(7):3038-3040.<\/li><li class=\"ref\">[6] 자오징이,정진쑤,왕쯔쑹,등.화간탕 과립의 전사인자 단백질군 NF-κB 신호 경로 조절을 통한 기능성 소화불량 십이지장 미세염증 개선和肝湯顆粒通過調控轉錄因子蛋白家族核因子κB信號途徑改善功能性消化不良十二指腸微炎症[J].환구중의약環球中醫藥,2024,17(12):2418-2425.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당귀12g","name":"당귀","dose":"12g","base":"당귀"},{"raw":"백작약12g","name":"백작약","dose":"12g","base":"백작약"},{"raw":"백출9g","name":"백출","dose":"9g","base":"백출"},{"raw":"시호9g","name":"시호","dose":"9g","base":"시호"},{"raw":"복령9g","name":"복령","dose":"9g","base":"복령"},{"raw":"생강3g","name":"생강","dose":"3g","base":"생강"},{"raw":"박하( 後下) 3g","name":"박하( 後下)","dose":"3g","base":"박하"},{"raw":"炙감초6g","name":"炙감초","dose":"6g","base":"감초"},{"raw":"당삼9g","name":"당삼","dose":"9g","base":"당삼"},{"raw":"소경9g","name":"소경","dose":"9g","base":"소경"},{"raw":"향부자9g","name":"향부자","dose":"9g","base":"향부자"},{"raw":"대조4개","name":"대조","dose":"4개","base":"대조"}],"notes":[],"핵심 효능":["간의 음혈을 보강하고 부드럽게 함(양혈유간養血柔肝)","간기를 소통시키고 울체를 해소(소간해울疏肝解鬱)","토를 북돋아 비장을 튼튼히 함(배토실비培土實脾)","기와 혈을 조화롭게 함(조화기혈調和氣血)"],"주치증":["간비실화肝脾失和, 기혈부조氣血不調, 기체간울氣滯肝鬱의 병증. 만성 위염, 기능성 소화불량, 만성 간염, 위통, 협통, 복통, 비만痞滿, 변비, 갱년기 증후군, 월경불순, 유선증식증, 심계, 불면, 두통, 현훈, 흉비胸痹, 두드러기(담마진蕁麻疹) 등"],"연구 확장 영역":["소화기 질환(기능성 소화불량, 만성 위염, 역류성 식도염, 간경화), 신경-내분비계 조절(갱년기 증후군, 수면장애, 우울증), 심뇌혈관 및 면역-피부 질환(두드러기(담마진蕁麻疹))"],"R&D 포인트":["소요산 처방구성을 바탕으로 교감-부교감 신경 활성의 균형을 조절하고, 중추-위장관 신경전달물질 및 신경펩타이드 5-HT, CGRP를 조절하여 신경성 위장장애 및 과민성대장증후군을 개선","사군자탕 구조의 결합을 통해 위장관 평활근 운동성을 촉진하고, 위 배출능 향상 및 복부 비만痞滿(더부룩함)·팽만감 개선","염증성 사이토카인(TNF-α, IL-6) 발현 억제, PGE2 매개 점막 방어기전을 강화하여 위점막 상피를 보호하고 위염, 역류성 식도염, 소화성 궤양을 개선하는 천연물 멀티타깃 소재"]},"modules":[{"name":"①체용겸고","hz":"體用兼顧","herbs":["당귀","백작약"],"role":"간의 음혈을 보강하여 강한 성질의 간체를 부드럽게 유화柔和시킴"},{"name":"②소리삼초","hz":"疏理三焦","herbs":["시호","박하","소경","향부자"],"role":"울체된 간기를 소통시키고 삼초의 기기를 원활하게 순환시킴"},{"name":"③배토실비","hz":"培土實脾","herbs":["당삼","복령","백출","생강","대추","감초"],"role":"비위의 기운을 보강하여 간목肝木의 침범을 막고 기기의 승강을 정상화함"}],"rd":[{"tag":"Duodenal Micro-inflammation","title":"기능성 소화불량의 십이지장 미세염증 표적","html":"<p>화간탕과립이 NF-κB 신호를 조절해 기능성 소화불량의 십이지장 미세염증을 개선했다는 실험 결과가 있음<\/p><p>십이지장 비만세포·호산구 침윤과 점막 투과성을 공통 지표로 삼아 ‘간비불화’를 위–십이지장 미세염증으로 구체화하는 연구가 우선이며, 연구용 과립 조성과 최종 개발 조성을 비교 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [6](화간탕과립, NF-κB))<\/p>"},{"tag":"Formula Lineage","title":"소요산·사군자탕 대비 차별성 검증","html":"<p>화간탕은 소요산에 당삼·향부자·소경·대조를 더한 구조임<\/p><p>소요산 대비 위장 운동과 증상 개선에서 추가 이득이 있는지를 직접 비교해야 처방 고유의 개발 가치를 설명할 수 있음 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2] (조방 원칙), 본문 조성표)<\/p>"},{"tag":"Functional GI Disorders","title":"만성 위염·변비 등 기능성 위장질환 중심의 적응증 정리","html":"<p>적응증이 갱년기 증후군·두드러기까지 넓게 제시되어 있으나 임상 보고가 실제로 있는 만성 표재성 위염과 간울비허형 변비부터 우선 적응증으로 정함<\/p><p><b>표준화된 증상 척도(Rome IV 기준)로 효과를 평가 (근거 유형<\/b>: 직접 연구 근거 | 근거: 참고문헌 [4](만성 표재성 위염 임상 연구), [5](변비 임상 경험))<\/p>"},{"tag":"Data-driven Indication","title":"임상 처방 데이터에 근거한 가감 규칙 표준화","html":"<p>임상 응용 데이터 마이닝 결과를 바탕으로 증상별 가감 약재의 후보 규칙을 정리함<\/p><p>다만 외부 자료로 검증하기 전까지는 확정 규칙으로 쓰지 않고, 개발 대상을 ‘기본방 + 표준 가감 2~3종’ 후보로 좁힘 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [3] (데이터 마이닝 연구))<\/p>"}],"logic":[{"n":"1","title":"간위오장지적肝爲五臟之賊과 치간선실비治肝先實脾","body":"간기의 전변을 막기 위해 비장을 먼저 튼튼히 함"},{"n":"2","title":"체용겸고體用兼顧와 기혈동조氣血同調","body":"간의 체와 용을 동시에 다스리고 기와 혈을 조화롭게 함"},{"n":"3","title":"소리삼초疏理三焦와 이병동치異病同治","body":"삼초의 기도를 소통시켜 다양한 난치질환에 광범위하게 응용함"},{"n":"4","title":"임상 데이터 검증","body":"위장관 운동 촉진과 자율신경계 안정화 확인"}],"field":1,"pages":[50,53],"evidence":"임상·실험 보고","product":"화간탕과립 (연구용)","status":"원내제제·연구용 제제","s":["1-8","화간탕","和肝湯","","팡허첸","方和謙","보중건비補中健脾, 소간리기疏肝理氣, 양혈유간養血柔肝을 통해 간비실화肝脾失和 및 기혈부조","당귀12g 백작약12g 백출9g 시호9g 복령9g 생강3g 박하( 後下) 3g 炙감초6g 당삼9g 소경9g 향부자9g 대조4개","","핵심 효능 간의 음혈을 보강하고 부드럽게 함(양혈유간養血柔肝) 간기를 소통시키고 울체를 해소(소간해울疏肝解鬱) 토를 북돋아 비장을 튼튼히 함(배토실비培土實脾) 기와 혈을 조화롭게 함(조화기혈調和氣血)","주치증 간비실화肝脾失和, 기혈부조氣血不調, 기체간울氣滯肝鬱의 병증. 만성 위염, 기능성 소화불량, 만성 간염, 위통, 협통, 복통, 비만痞滿, 변비, 갱년기 증후군, 월경불순, 유선증식증, 심계, 불면, 두통, 현훈, 흉비胸痹, 두드러기(담마진蕁麻疹) 등","연구 확장 영역 소화기 질환(기능성 소화불량, 만성 위염, 역류성 식도염, 간경화), 신경-내분비계 조절(갱년기 증후군, 수면장애, 우울증), 심뇌혈관 및 면역-피부 질환(두드러기(담마진蕁麻疹))","R&D 포인트 소요산 처방구성을 바탕으로 교감-부교감 신경 활성의 균형을 조절하고, 중추-위장관 신경전달물질 및 신경펩타이드 5-HT, CGRP를 조절하여 신경성 위장장애 및 과민성대장증후군을 개선 사군자탕 구조의 결합을 통해 위장관 평활근 운동성을 촉진하고, 위 배출능 향상 및 복부 비만痞滿(더부룩함)·팽만감 개선 염증성 사이토카인(TNF-α, IL-6) 발현 억제, PGE2 매개 점막 방어기전을 강화하여 위점막 상피를 보호하고 위염, 역류성 식도염, 소화성 궤양을 개선하는 천연물 멀티타깃 소재","①체용겸고 體用兼顧 당귀 백작약 간의 음혈을 보강하여 강한 성질의 간체를 부드럽게 유화柔和시킴","②소리삼초 疏理三焦 시호 박하 소경 향부자 울체된 간기를 소통시키고 삼초의 기기를 원활하게 순환시킴","③배토실비 培土實脾 당삼 복령 백출 생강 대추 감초 비위의 기운을 보강하여 간목肝木의 침범을 막고 기기의 승강을 정상화함","간위오장지적肝爲五臟之賊과 치간선실비治肝先實脾 간기의 전변을 막기 위해 비장을 먼저 튼튼히 함","체용겸고體用兼顧와 기혈동조氣血同調 간의 체와 용을 동시에 다스리고 기와 혈을 조화롭게 함","소리삼초疏理三焦와 이병동치異病同治 삼초의 기도를 소통시켜 다양한 난치질환에 광범위하게 응용함","임상 데이터 검증 위장관 운동 촉진과 자율신경계 안정화 확인","Duodenal Micro-inflammation 기능성 소화불량의 십이지장 미세염증 표적 화간탕과립이 NF-κB 신호를 조절해 기능성 소화불량의 십이지장 미세염증을 개선했다는 실험 결과가 있음 십이지장 비만세포·호산구 침윤과 점막 투과성을 공통 지표로 삼아 ‘간비불화’를 위–십이지장 미세염증으로 구체화하는 연구가 우선이며, 연구용 과립 조성과 최종 개발 조성을 비교 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [6](화간탕과립, NF-κB))","Formula Lineage 소요산·사군자탕 대비 차별성 검증 화간탕은 소요산에 당삼·향부자·소경·대조를 더한 구조임 소요산 대비 위장 운동과 증상 개선에서 추가 이득이 있는지를 직접 비교해야 처방 고유의 개발 가치를 설명할 수 있음 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2] (조방 원칙), 본문 조성표)","Functional GI Disorders 만성 위염·변비 등 기능성 위장질환 중심의 적응증 정리 적응증이 갱년기 증후군·두드러기까지 넓게 제시되어 있으나 임상 보고가 실제로 있는 만성 표재성 위염과 간울비허형 변비부터 우선 적응증으로 정함 표준화된 증상 척도(Rome IV 기준)로 효과를 평가 (근거 유형 : 직접 연구 근거 | 근거: 참고문헌 [4](만성 표재성 위염 임상 연구), [5](변비 임상 경험))","Data-driven Indication 임상 처방 데이터에 근거한 가감 규칙 표준화 임상 응용 데이터 마이닝 결과를 바탕으로 증상별 가감 약재의 후보 규칙을 정리함 다만 외부 자료로 검증하기 전까지는 확정 규칙으로 쓰지 않고, 개발 대상을 ‘기본방 + 표준 가감 2~3종’ 후보로 좁힘 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [3] (데이터 마이닝 연구))"],"ss":{"composition":"그림 1-8 화간탕和肝湯의 모듈 구성 ①체용겸고體用兼顧 모듈 — 간의 음혈을 보강하여 강한 성질의 간체를 부드럽게 유화柔和시킴 당귀 : 혈을 보하고 간을 부드럽게 하며, 주산走散하는 성질로 기혈 순환을 촉진함 백작약 : 간혈을 수렴하고 통증을 완화하며, 당귀와 짝을 이뤄 간체를 부드럽게 함 ②소리삼초疏理三焦 모듈 — 울체된 간기를 소통시키고 삼초의 기기를 원활하게 순환시킴 시호 : 울체된 간기를 소통시키고, 청기淸氣를 위로 끌어올림 박하 : 가볍게 발산하며, 시호를 도와 상초와 간경의 울열鬱熱을 풀어줌 소경 : 중초의 기를 다독여 편안하게 하고, 가슴의 답답함을 없앰 향부자 : 삼초의 기체를 풀고 간기를 순환시켜 통증을 완화함 ③배토실비培土實脾 모듈 — 비위의 기운을 보강하여 간목肝木의 침범을 막고 기기의 승강을 정상화함 당삼 : 중초의 기를 보하고, 사군자탕의 핵심 축을 담당함 복령 : 비장을 돕고 습을 빼내어 담습의 정체를 방지함 백출 : 비장을 튼튼히 하고 습을 말려 운화를 정상화함 생강 : 위를 따뜻하게 하고 상역하는 위기를 내려 구토와 속쓰림을 완화 대추 : 비위 기운을 보강하고 영위, 기혈을 조화롭게 함 감초 : 급박한 기운을 완화하고 제약을 조율함","master":"①‘간위오장지적肝爲五臟之賊, 치간선실비治肝先實脾’의 예방 병리 관점 간은 기기 조절을 담당하나 쉽게 울결되고 간기가 치밀어 오르기 쉬워, 다른 장부로 병을 전변시키는 특성을 가짐 대사는 장중경의 “간의 병을 보면 간이 비장으로 전변될 것을 알고 먼저 비를 튼튼히 해야 한다見肝之病, 知肝傳脾,當先實脾”라는 사상을 바탕으로, 소요산 구조에 당삼, 대추를 보강하여 비토脾土를 선제적으로 배보培補함으로써 간기肝氣가 비위로 전변되는 것을 근본적으로 차단함 ②체용겸고體用兼顧, 기혈동조氣血同調의 정교한 배오 간을 치료할 때 소기疏氣(용用)에만 치중하면 간음肝陰이 손상되고, 자배滋培(체體)에만 치중하면 기기가 울체되기 쉬움 당귀, 백작약의 산수酸收, 감윤甘潤 작용과 시호, 박하, 향부자, 소경의 신산辛散 작용을 결합하여, 간의 체體와 용用을 동시에 다스리고 기와 혈을 조화롭게 조율 ③소리삼초疏理三焦 및 현대 약리학적 이병동치異病同治의 검증 상초(시호, 박하), 중초(소경, 백출), 하초(향부자, 당귀)로 이어지는 삼초의 기도를 소통시키는 약재 배합을 구축 데이터 마이닝과 임상·실험 연구에서 화간탕의 위장관 운동 촉진, 뇌-장관축 조절, 자율신경 안정 및 면역 조절 작용이 보고됨 이를 통해 단순 소화기 질환(위염, 기능성 소화불량, 역류성 식도염)부터 신경계(불면, 우울), 내분비계(갱년기 증후군), 피부 질환(두드러기(담마진蕁麻疹))에 이르기까지 폭넓게 응용하는 이병동치異病同治의 근거로 제시","rd":"","china":"중국 제품화 현황 본문 연구에 쓰인 화간탕과립和肝湯顆粒은 연구용 제제이며, 허가 중성약·신약 임상 등록·특허는 확인되지 않음 시사점 연구용 과립으로 기전 연구가 축적되고 있으나 제품화 전 단계이므로, 국내에서 소요산 계열 기존 제제와의 비교 연구로 개발 가치를 확인할 수 있음 참고문헌 [1] 리원취안.팡허첸의 화간탕 임상 경험方和謙用“和肝湯”的臨床經驗[J].중의잡지中醫雜志,1992,(12):25-26. [2] 리원취안,취안훙,가오젠훙,등.팡허첸이 창방한 화간탕의 조방 원칙과 임상 응용方和謙創“和肝湯”的組方原則和臨床應用[J].상하이중의약잡지上海中醫藥雜志,2008,(2):1-3. [3] 리원취안,취안훙,가오젠훙,등.팡허첸 경험방 화간탕의 임상 응용 데이터 마이닝 연구方和謙經驗方“和肝湯”臨床應用數據的挖掘研究[J].중국중의기초의학 잡지中國中醫基礎醫學雜志,2008,(11):855-857. [4] 취안훙,제샤오징.팡허첸 경험방 가미화간탕의 만성 표재성 위염 치료 임상 연구方和謙經驗方加味和肝湯治療慢性淺表性胃炎臨床研究[J].베이징중의약北京中醫藥,2013,32(5):346-348. [5] 정진쑤,취안훙,가오젠훙,등.국의대사 팡허첸의 간울비허형 변비에 대한 화간탕 치료 임상 경험國醫大師方和謙運用和肝湯治療肝鬱脾虛型便秘臨床經驗[J].중화중의약잡지中華中醫藥雜志,2019,34(7):3038-3040. [6] 자오징이,정진쑤,왕쯔쑹,등.화간탕 과립의 전사인자 단백질군 NF-κB 신호 경로 조절을 통한 기능성 소화불량 십이지장 미세염증 개선和肝湯顆粒通過調控轉錄因子蛋白家族核因子κB信號途徑改善功能性消化不良十二指腸微炎症[J].환구중의약環球中醫藥,2024,17(12):2418-2425."}},{"id":"1-9","ko":"달울탕","hz":"達鬱湯","alias":"","master_ko":"장레이","master_hz":"張磊","tagline":"간비肝脾의 울체된 기를 풀고 열을 내려 장부의 평형을 되찾는 화법和法 처방","meta":{"주요 적응증":"간비울체형 만성 위염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":54,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-9 달울탕達鬱湯의 모듈 구성<\/p><h4>①목토소달木土疏達 모듈 — 간의 울체를 풀고 비의 습을 말려 중초와 전신의 기기를 순조롭게 소통시킴<\/h4><p><b>시호<\/b>: 승산升散하는 성질로 울체된 간기를 소통시키고, 상초와 체표까지 기운을 원활하게 펼쳐줌<\/p><p><b>창출<\/b>: 건비조습健脾燥濕을 통해 비의 운화 기능을 회복시키고 중초의 습탁濕濁을 제거함<\/p><p><b>향부자<\/b>: 소간리기疏肝理氣하여 삼초의 울체된 기를 풀고, 시호의 소간疏肝을 극대화함<\/p><p><b>초과<\/b>: 맵고 따뜻한 성질로 막원膜原과 중초에 단단히 엉켜 붙은 담습을 제거하여 창출의 운화를 도움<\/p><h4>②청열하기淸熱下氣 모듈 — 기체氣滯로 인한 상충을 내리고 오래 울체되어 발생한 화열火熱을 제거함<\/h4><p><b>지실<\/b>: 파기소적破氣消積 작용으로 중초의 적체된 기운과 담적을 아래로 내려 보냄<\/p><p><b>치자, 황금, 포공영<\/b>: 상·중·하 삼초와 위, 간담의 열을 청열하고, 오래 울체되어 울화鬱火로 변한 화열을 내림<\/p><h4>③선통고탕宣通鼓蕩 및 산수유간酸收柔肝 모듈 — 소량의 풍약風藥으로 기기의 소통을 촉진하고, 산미酸味로 간의 음혈을 보호함<\/h4><p><b>강활, 방풍<\/b>: 소량의 신산辛散한 거풍제습祛風除濕 약재로 승발升發을 유도하여 뭉친 기기를 풀어주고 습사濕邪를 제거함<\/p><p><b>백작약<\/b>: 유간지통柔肝止痛하고 음을 보호하여, 이기理氣 약재와 청열淸熱 약재에 의한 간혈 및 음액 손상을 방지<\/p><h4>④조화제약調和諸藥 모듈<\/h4><p><b>감초<\/b>: 제반 약재의 성질을 조율하고 중초를 완화하여 원활한 완충 작용을 수행함<\/p>"},{"k":"master","t":"장레이의 간비울체肝脾鬱滯 치료","html":"<h4>①내경의 다각적 울증 치법과 화법和法의 체계적 통합<\/h4><p>《황제내경》의 “목울달지木鬱達之, 화울발지火鬱發之, 토울탈지土鬱奪之” 원칙에 입각하여, 사역산, 달원음, 월국환의 구조적 장점을 통합 변형하여, 간목과 비토의 울체를 동시에 치료하는 완성도 높은 화법和法 범주의 처방을 구축<\/p><h4>②목토옹울木土壅鬱과 침체맥沈滯脈의 병리 관점<\/h4><p>간의 소설 장애인 목울木鬱과 비의 운화 마비인 토옹土壅이 결합된 ‘목토옹울’을 핵심 병기로 봄. 진맥 시 손가락 끝에 전달되는 꽉 막히고 답답하며 손끝을 밀어내지 못하는 ‘침체맥沈滯脈’을 주요 진단 지표로 제시. 이를 바탕으로 만성 위축성 위염 등 소화기 질환부터 갑상선 결절 등 내분비 질환에 이르기까지 전신에 걸친 기체氣滯, 담습痰濕, 울열鬱熱병증을 대대적으로 조율함<\/p><h4>③울소병제鬱消病除와 동動, 화和, 평平의 학술 철학<\/h4><p>동·화·평에 기반하여 기기를 끊임없이 움직이게(동動) 하고, 장부 간 조화(화和)를 이루어, 신체의 평형(평平)을 회복시킴. 간비의 울체와 울열이 해소되면, 사기가 자연스럽게 물러나고 정기가 제자리를 찾아 장부 기기가 조화롭게 정돈된다는 “울소병제鬱消病除”의 치료 철학을 제시함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">공개자료상 제품·특허가 확인되지 않고 근거가 경험 보고 수준이어서 단독 개발보다 소간해울 처방군(소조기기탕 등)과 함께 비교하는 연구가 효율적<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 장친성,우밍양.국의대사 장레이의 달울탕을 활용한 만성 위축성 위염 치료 경험國醫大師張磊運用達鬱湯治療慢性萎縮性胃炎經驗[J].중의연구中醫研究, 2021,34(11):72-74.<\/li><li class=\"ref\">[2] 왕샤오린,자오루,쑹솽훙,등.국의대사 장레이의 달울탕을 활용한 목토옹울형 갑상선 결절 치료 경험國醫大師張磊運用達鬱湯治療木土壅鬱型甲狀腺結節經驗[J].중화중의약잡지中華中醫藥雜志,2025,40(4):1543-1546.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"시호10g","name":"시호","dose":"10g","base":"시호"},{"raw":"炒지실10g","name":"炒지실","dose":"10g","base":"지실"},{"raw":"백작약15g","name":"백작약","dose":"15g","base":"백작약"},{"raw":"감초6g","name":"감초","dose":"6g","base":"감초"},{"raw":"황금10g","name":"황금","dose":"10g","base":"황금"},{"raw":"초과6g","name":"초과","dose":"6g","base":"초과"},{"raw":"炒창출10g","name":"炒창출","dose":"10g","base":"창출"},{"raw":"制향부자10g","name":"制향부자","dose":"10g","base":"향부자"},{"raw":"치자10g","name":"치자","dose":"10g","base":"치자"},{"raw":"강활3g","name":"강활","dose":"3g","base":"강활"},{"raw":"방풍3g","name":"방풍","dose":"3g","base":"방풍"},{"raw":"포공영15g","name":"포공영","dose":"15g","base":"포공영"}],"notes":[],"핵심 효능":["간과 비장의 울체된 기를 풀어 소통시킴(소달간비疏達肝脾)","오래 뭉쳐 발생한 열을 제거함(청산울열淸散鬱熱)"],"주치증":["간비양울肝脾兩鬱, 울이화열鬱而化熱에 속하는 만성 위염, 만성 위축성 위염, 담낭염, 늑간신경통, 위궤양, 원인불명 미열, 갑상선 결절 등"],"연구 확장 영역":["소화기 질환(만성 위축성 위염, 위궤양), 내분비 질환(갑상선 결절, 갑상선 기능 저하증), 신경계 및 전신 질환(늑간신경통, 원인불명 미열)"],"R&D 포인트":["시호·향부자 등의 배합을 통한 자율신경계 균형 회복, 스트레스성 장관 경련 완화, 위장관 기기의 승강 기능 정상화","치자 등의 활성 성분을 통한 NF-κB 염증 신호전달 경로 차단, 염증성 사이토카인 생성 억제 및 산화 스트레스 감소","신경전달물질 조절 및 CGRP, 5-HT 수준 정상화를 통한 기능성 소화불량, 과민성대장증후군, 스트레스성 소화기 질환 치료를 위한 천연물 신약 후보"]},"modules":[{"name":"①목토소달","hz":"木土疏達","herbs":["시호","창출","향부자","초과"],"role":"간의 울체를 풀고 비의 습을 말려 중초와 전신의 기기를 순조롭게 소통시킴"},{"name":"②청열하기","hz":"淸熱下氣","herbs":["지실","치자","황금","포공영"],"role":"기체氣滯로 인한 상충을 내리고 오래 울체되어 발생한 화열火熱을 제거함"},{"name":"③선통고탕 · 산수유간","hz":"宣通鼓蕩 · 酸收柔肝","herbs":["강활","방풍","백작약"],"role":"소량의 풍약風藥으로 기기의 소통을 촉진하고, 산미酸味로 간의 음혈을 보호함"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":""}],"rd":[{"tag":"Stress-related Gastritis","title":"스트레스 동반 만성 위축성 위염의 증상 개선","html":"<p>시호·지실·백작약·감초로 된 사역산四逆散 골격이 처방의 중심임<\/p><p>스트레스 요인이 뚜렷한 만성 위축성 위염 환자를 대상으로 증상과 불안·우울 척도를 함께 평가하는 탐색 임상이 출발점 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1] (만성 위축성 위염 치료 경험), 본문 조성표)<\/p>"},{"tag":"Heat-clearing Module","title":"황금·치자·포공영의 ‘울열’ 소염 효과 분리 검증","html":"<p>황금·치자·포공영으로 구성된 청열 모듈을 뺀 처방과 비교하는 구성 약재 제거 실험을 설계함 이를 통해 울이화열 단계에서 위점막 염증(호중구 침윤·염증성 사이토카인) 감소에 대한 청열 모듈의 기여도를 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「울이화열과 청산울열」, 본문 조성표)<\/p>"},{"tag":"Thyroid Nodule","title":"양성 갑상선 결절 추적 환자 관찰(탐색)","html":"<p>목토옹울형 갑상선 결절 치료 경험은 증례 수준임<\/p><p>세침흡인 등으로 양성이 확인된 결절 환자에서 표준 초음파 추적을 유지하며 크기· 갑상선 기능 변화를 장기 관찰하는 후향적 증례 분석에 그치고, 자연 경과를 고려해 결절 치료 효능으로 해석하지 않음 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2] (2025, 갑상선 결절 치료 경험))<\/p>"},{"tag":"Wind-herb Role","title":"소량의 강활·방풍(각 3g) 배합 의도 검증","html":"<p>소간약에 소량의 풍약(강활·방풍)을 더해 울체를 흩는 구성이 이 처방의 특징임<\/p><p>풍약 유무에 따른 위장관 운동과 증상 차이를 비교하여 배합의 합리성을 확인 (근거 유 지하며 크기· 갑상선 기능 변화를 장기 관찰하는 후향적 증례 분석에 그치고, 자연 경과를 고려해 결절 치료 효능으로 해석하지 않음 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2] (2025, 갑상선 결절 치료 경험))","Wind-herb Role 소량의 강활·방풍(각 3g) 배합 의도 검증 소간약에 소량의 풍약(강활·방풍)을 더해 울체를 흩는 구성이 이 처방의 특징임 풍약 유무에 따른 위장관 운동과 증상 차이를 비교하여 배합의 합리성을 확인 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 4 「화법和法」)"],"ss":{"composition":"그림 1-9 달울탕達鬱湯의 모듈 구성 ①목토소달木土疏達 모듈 — 간의 울체를 풀고 비의 습을 말려 중초와 전신의 기기를 순조롭게 소통시킴 시호 : 승산升散하는 성질로 울체된 간기를 소통시키고, 상초와 체표까지 기운을 원활하게 펼쳐줌 창출 : 건비조습健脾燥濕을 통해 비의 운화 기능을 회복시키고 중초의 습탁濕濁을 제거함 향부자 : 소간리기疏肝理氣하여 삼초의 울체된 기를 풀고, 시호의 소간疏肝을 극대화함 초과 : 맵고 따뜻한 성질로 막원膜原과 중초에 단단히 엉켜 붙은 담습을 제거하여 창출의 운화를 도움 ②청열하기淸熱下氣 모듈 — 기체氣滯로 인한 상충을 내리고 오래 울체되어 발생한 화열火熱을 제거함 지실 : 파기소적破氣消積 작용으로 중초의 적체된 기운과 담적을 아래로 내려 보냄 치자, 황금, 포공영 : 상·중·하 삼초와 위, 간담의 열을 청열하고, 오래 울체되어 울화鬱火로 변한 화열을 내림 ③선통고탕宣通鼓蕩 및 산수유간酸收柔肝 모듈 — 소량의 풍약風藥으로 기기의 소통을 촉진하고, 산미酸味로 간의 음혈을 보호함 강활, 방풍 : 소량의 신산辛散한 거풍제습祛風除濕 약재로 승발升發을 유도하여 뭉친 기기를 풀어주고 습사濕邪를 제거함 백작약 : 유간지통柔肝止痛하고 음을 보호하여, 이기理氣 약재와 청열淸熱 약재에 의한 간혈 및 음액 손상을 방지 ④조화제약調和諸藥 모듈 감초 : 제반 약재의 성질을 조율하고 중초를 완화하여 원활한 완충 작용을 수행함","master":"①내경의 다각적 울증 치법과 화법和法의 체계적 통합 《황제내경》의 “목울달지木鬱達之, 화울발지火鬱發之, 토울탈지土鬱奪之” 원칙에 입각하여, 사역산, 달원음, 월국환의 구조적 장점을 통합 변형하여, 간목과 비토의 울체를 동시에 치료하는 완성도 높은 화법和法 범주의 처방을 구축 ②목토옹울木土壅鬱과 침체맥沈滯脈의 병리 관점 간의 소설 장애인 목울木鬱과 비의 운화 마비인 토옹土壅이 결합된 ‘목토옹울’을 핵심 병기로 봄. 진맥 시 손가락 끝에 전달되는 꽉 막히고 답답하며 손끝을 밀어내지 못하는 ‘침체맥沈滯脈’을 주요 진단 지표로 제시. 이를 바탕으로 만성 위축성 위염 등 소화기 질환부터 갑상선 결절 등 내분비 질환에 이르기까지 전신에 걸친 기체氣滯, 담습痰濕, 울열鬱熱병증을 대대적으로 조율함 ③울소병제鬱消病除와 동動, 화和, 평平의 학술 철학 동·화·평에 기반하여 기기를 끊임없이 움직이게(동動) 하고, 장부 간 조화(화和)를 이루어, 신체의 평형(평平)을 회복시킴. 간비의 울체와 울열이 해소되면, 사기가 자연스럽게 물러나고 정기가 제자리를 찾아 장부 기기가 조화롭게 정돈된다는 “울소병제鬱消病除”의 치료 철학을 제시함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 공개자료상 제품·특허가 확인되지 않고 근거가 경험 보고 수준이어서 단독 개발보다 소간해울 처방군(소조기기탕 등)과 함께 비교하는 연구가 효율적 참고문헌 [1] 장친성,우밍양.국의대사 장레이의 달울탕을 활용한 만성 위축성 위염 치료 경험國醫大師張磊運用達鬱湯治療慢性萎縮性胃炎經驗[J].중의연구中醫研究, 2021,34(11):72-74. [2] 왕샤오린,자오루,쑹솽훙,등.국의대사 장레이의 달울탕을 활용한 목토옹울형 갑상선 결절 치료 경험國醫大師張磊運用達鬱湯治療木土壅鬱型甲狀腺結節經驗[J].중화중의약잡지中華中醫藥雜志,2025,40(4):1543-1546."}},{"id":"1-10","ko":"오매패장탕","hz":"烏梅敗醬湯","alias":"","master_ko":"루즈정","master_hz":"路志正","tagline":"궤양성 대장염과 만성 설사를 치료하는 승청升淸, 산렴酸斂, 항염抗炎의 처방","meta":{"주요 적응증":"궤양성 대장염, 만성 설사","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":58,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-10 오매패장탕烏梅敗醬湯의 모듈 구성<\/p><h4>①산렴지사酸斂止瀉, 거사제습祛邪除濕 모듈 — 장기적인 설사를 직접적으로 수렴시켜 멈추게 하고, 대장에 엉킨 습열과 독소를 제거함<\/h4><p><b>오매<\/b>: 산삽酸澁의 성질로 수렴을 통해 장관 과민성을 억제하고 설사를 직접적으로 멈추게 하며, 만성의 묽은 변 및 만성 설사 증상 개선<\/p><p><b>패장초<\/b>: 고한苦寒한 성질로 대장의 뭉친 열과 독소를 해소하고, 장관 점막의 궤양 및 농혈의 배출을 촉진<\/p><h4>②건비승청健脾升淸 모듈 — 비장의 운화 기능을 회복시키고 청양淸陽을 위로 끌어올려 근본적인 설사 원인을 제거함<\/h4><p><b>태자삼, 백출, 복령, 감초<\/b>: 사군자탕의 처방구성으로 중초의 기를 보강하고 습을 말려 비장의 운화 기능을 회복시킴<\/p><p><b>갈근<\/b>: 청양을 위로 끌어올려 완곡불화完穀不化를 바로잡고 지사止瀉작용을 도와 설사를 제어함<\/p><h4>③조기행혈調氣行血, 유간억목柔肝抑木 모듈 — 기혈 순환을 원활하게 하여 복통과 이급후중을 해소하고, 간목<\/h4><p>肝木의 횡역橫逆을 억누르고 부드럽게 유연화하여 비토脾土를 보호<\/p><p><b>황련<\/b>: 고한苦寒한 성질로 대장의 습열을 제거하고 건조하게 말리며, 사화해독瀉火解毒을 통해 염증성 이질 및 하리下利증상을 제어<\/p><p><b>목향, 지실<\/b>: 울결된 기기를 풀고 아래로 끌어내려 복부팽만, 복통, 하복부의 묵직함을 해소함<\/p><p><b>당귀, 백작약<\/b>: 보혈補血과 활혈活血을 통해 통증을 완화시키고, 오매와 배합되어 간의 횡역을 억누르고 부드럽게 풀어 간비불화肝脾不和를 제어함<\/p><h4>④조화제약調和諸藥 모듈<\/h4><p><b>감초<\/b>: 약재 간의 성질을 조율하고 중초를 편안하게 하며, 처방 전체의 균형을 잡음<\/p>"},{"k":"master","t":"루즈정의 궤양성 대장염 치료","html":"<h4>①지중앙持中央, 운사방運四旁에 기반한 근본적 비위 보강<\/h4><p>궤양성 대장염을 치료할 때 대장의 국소적인 염증이나 점액농혈의 변에만 국한하지 않고, “중앙인 중초 비위를 지키고, 사방의 장부를 통달하게 한다”는 ‘지중앙, 운사방’의 관점을 가짐. 궤양성 대장염의 재발과 만성화는 비위의 허약에서 비롯된다고 보고, 보비익기補脾益氣를 기본 바탕으로 삼아 대장의 자가 회복력을 끌어올림<\/p><h4>②청열해독과 산렴지사酸斂止瀉의 병용을 통한 급·만성 병리기전 동시 제어<\/h4><p>궤양성 대장염 활성기에 나타나는 대장 습열濕熱과 농혈 증상을 패장초, 황련으로 청열해독하는 동시에, 장기간 지속된 이질과 설사로 인한 대장 기운의 누수를 오매의 산렴酸斂 성질로 치료. 맹목적인 청열약 투여로 인한 비위 손상이나, 급작스러운 수렴약 투여로 인한 사기류련邪氣留戀을 예방하는 치법을 제시함<\/p><h4>③조기행혈調氣行血과 유간억목柔肝抑木을 통한 정신, 신체 복합 병리 조율<\/h4><p>정서적 자극이나 스트레스로 간기肝氣가 울결될 때 대장의 복통과 이급후중이 악화되는 궤양성 대장염의 특성을 파악함. 목향, 지실로 막힌 기운을 풀고, 당귀, 백작약으로 혈액 순환을 도우며 간을 부드럽게 어루만져 간목肝木이 비토脾土를 침범하지 않도록 제어함. 이를 통해 장-뇌 축 상의 불균형을 해소하고 궤양성 대장염의 유발 요인을 종합적으로 조율함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">궤양성 대장염 임상연구가 2편 이상 있으면서도 공개자료상 중국 제품이 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 국내 특허를 검토한다면 원방 조성보다 제형·표준화·용도 중심으로 설계해야 함. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 장레이,리리샤,왕메이칭.오매패장방의 만성 비특이성 궤양성 대장염 56례 치료烏梅敗醬方治療慢性非特異性潰瘍性結腸炎56例[J].산시중의陝西中醫,2004,(9):797-798.<\/li><li class=\"ref\">[2] 장레이,천쉐칭,리징쥔.오매패장방의 궤양성 대장염 치료 임상 연구烏梅敗醬方治療潰瘍性結腸炎的臨床研究[J].쓰촨중의四川中醫,2007,(3):65-66.<\/li><li class=\"ref\">[3] 양펑전.루즈정의 오매패장탕 임상 활용 해설路志正烏梅敗醬湯的臨床運用解讀[J].국제중의중약잡지國際中醫中藥雜志,2010,(5):449.<\/li><li class=\"ref\">[4] 류리,왕징빈,황궈신.오매패장탕의 경·중등도 궤양성 대장염 치료 효과 관찰烏梅敗醬湯治療輕中度潰瘍性結腸炎療效觀察[J].실용중의약잡지實用中醫藥雜志,2019,35(9):1053-1054.<\/li><li class=\"ref\">[5] 류덩커,웨이웨이.오매패장방의 궤양성 대장염 치료에 대한 고찰烏梅敗醬方治療潰瘍性結腸炎淺析[J].세계중서의결합잡지世界中西醫結合雜志,2025,20(1):188-191.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"오매12~15g","name":"오매","dose":"12~15g","base":"오매"},{"raw":"패장초12~18g","name":"패장초","dose":"12~18g","base":"패장초"},{"raw":"복령15g","name":"복령","dose":"15g","base":"복령"},{"raw":"황련4~6g","name":"황련","dose":"4~6g","base":"황련"},{"raw":"목향9g(後下)","name":"목향","dose":"9g(後下)","base":"목향"},{"raw":"당귀10g","name":"당귀","dose":"10g","base":"당귀"},{"raw":"炒백작약12~15g","name":"炒백작약","dose":"12~15g","base":"백작약"},{"raw":"炒지실10g","name":"炒지실","dose":"10g","base":"지실"},{"raw":"태자삼12g","name":"태자삼","dose":"12g","base":"태자삼"},{"raw":"炒백출10g","name":"炒백출","dose":"10g","base":"백출"},{"raw":"갈근12g","name":"갈근","dose":"12g","base":"갈근"},{"raw":"炙감초6g","name":"炙감초","dose":"6g","base":"감초"}],"notes":[],"핵심 효능":["열을 내리고 습을 말림(청열화습淸熱化濕)","기의 순환을 돕고 피를 잘 돌게 함(조기행혈調氣行血)","비장을 튼튼히 하고 항진된 간의 기운을 눌러 가라앉힘(건비억간健脾抑肝)"],"주치증":["비허간왕脾虛肝旺, 습열류련濕熱留戀으로 인한 대장 온결蘊結 증후(만성 비특이성 결장염, 궤양성 대장염, 만성 설사, 농혈 및 점액변, 복통, 추창墜脹, 이급후중裏急後重, 완복비민脘腹痞悶 등)"],"연구 확장 영역":["소화기 질환(궤양성 대장염, 만성 결장염, 설사형 과민성대장증후군, 장 점막 장벽 손상 질환)"],"R&D 포인트":["패장초, 황련의 복합 작용을 통한 NF-κB/NLRP3 염증 신호전달 경로의 다중 차단 및 염증성 사이토카인(TNF-α, IL-1β) 발현 억제","사군자탕의 구성을 기반으로 갈근, 오매를 융합하여 밀착연접(ZO-1, Occludin) 단백질 발현을 촉진하고 장관 상피세포 장벽 손상 복구 및 투과성 정상화","목향, 지실, 백작약의 평활근 경련 완화, 내장 감각 과민성 억제 및 설사형 과민성대장증후군, 궤양성 대장염 증상 개선 천연물 신약 소재"]},"modules":[{"name":"①산렴지사 · 거사제습","hz":"酸斂止瀉 · 祛邪除濕","herbs":["오매","패장초"],"role":"장기적인 설사를 직접적으로 수렴시켜 멈추게 하고, 대장에 엉킨 습열과 독소를 제거함 비장의 운화 기능을 회복시키고 청양淸陽을"},{"name":"②건비승청","hz":"健脾升淸","herbs":["태자삼","백출","복령","감초","갈근"],"role":"위로 끌어올려 근본적인 설사 원인을 제거함 기혈 순환을 원활하게 하여 복통과"},{"name":"③조기행혈 · 유간억목","hz":"調氣行血 · 柔肝抑木","herbs":["황련","목향","지실","당귀","백작약"],"role":"이급후중을 해소하고, 간목肝木의 횡역橫逆을 억누르고 부드럽게 유연화하여 비토脾土를 보호"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":""}],"rd":[{"tag":"UC Remission","title":"경·중등도 궤양성 대장염의 관해 유도 보조 치료","html":"<p>56례 치료 보고, 임상 연구, 경·중등도 궤양성 대장염 효과 관찰 등 처방 자체의 임상 보고가 반복되어 있음<\/p><p>메살라진 표준치료에 병용했을 때 임상 관해율과 내시경 점막 치유율이 높아지는지를 확인하는 무작위 대조 임상이 다음 단계(궤양성 대장염 표준약물은 중증도에 따라 다르므로 대상은 경·중등도로 한정)<\/p><p><b>검증 설계<\/b> 메살라진 단독 대 메살라진+오매패장탕 8주 비교, 1차 지표는 Mayo 점수 기반 임상 관해율, 2차 지표는 내시경 점막 치유(Mayo 내시경 하위점수 0~1)와 분변 칼프로텍틴<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [1](2004, 56례), [2](2007, 임상 연구), [4](2019, 경· 중등도 UC 효과 관찰)<\/p>"},{"tag":"Barrier & Inflammation","title":"패장초·황련과 오매·갈근의 역할 분리","html":"<p>청열해독(패장초·황련)과 수렴·승청(오매·갈근)이라는 두 축이 각각 염증 억제와 점막 장벽 회복을 담당한다는 처방 해석을 구성 약재 제거 실험으로 확인함<\/p><p>그 결과로 제제화 시 핵심 약재군을 좁힘<\/p><p><b>검증 설계<\/b> DSS 대장염 모델에서 전체 처방 / 청열 모듈 / 수렴·승청 모듈 비교, 지표는 NF-κB·NLRP3, TNF-α·IL-1β, ZO-1·Occludin, 장 투과성<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 본문 R&amp;D 포인트(NF-κB/NLRP3, 밀착연접 단백질), 참고문헌[3](임상 활용 해설)<\/p>"},{"tag":"Abdominal Pain & Visceral Sensitivity","title":"복통·이급후중 등 증상 개선 기전","html":"<p>백작약·감초·목향의 완급지통 배합은 장 평활근 경련과 내장 과민성 완화로 해석할 수 있음<\/p><p>관해 이후에도 남는 복통·잦은 배변 등 과민성 장 증상 동반 환자에서 증상 개선 효과를 별도로 평가<\/p><p><b>검증 설계<\/b> 완화기 궤양성 대장염 환자 중 IBS 유사 증상 동반군을 대상으로 복통 점수와 배변 빈도를 1차 지표로 한 탐색 임상<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> R&amp;D 논리 3 「조기행혈과 유간억목」, 본문 조성표<\/p>"},{"tag":"Relapse Prevention","title":"관해 유지와 재발 억제","html":"<p>‘지중앙持中央, 운사방運四旁’의 근본 치료 관점을 관해 유지 단계에 적용함<\/p><p>나아가 관해 후 12개월 재발률을 표준 유지요법과 비교하는 연구로 연결하면 단기 증상 개선을 넘어서는 차별점을 보여줄 수 있음(관해 유도 임상과 관해 유지 임상은 별도 시험으로 설계)<\/p><p><b>검증 설계<\/b> 관해 도달 환자 대상 12개월 유지 비교, 재발률과 분변 칼프로텍틴 추이를 추적<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [5](2025, UC 치료 고찰), R&amp;D 논리 4<\/p>"}],"logic":[{"n":"1","title":"습열류련濕熱留戀과 청열해독","body":"대장의 뭉친 열과 독소를 없애 염증을 제어함"},{"n":"2","title":"건비승청健脾升淸과 산렴지사酸斂止瀉","body":"비를 보하고 장을 수렴하여 설사를 멈춤"},{"n":"3","title":"조기행혈調氣行血과 유간억목柔肝抑木","body":"기혈 순환을 돕고 간의 횡역을 눌러 통증을 완화함"},{"n":"4","title":"지중앙持中央, 운사방運四旁","body":"중앙을 지키고 사방을 통달하여 근본을 회복함"}],"field":1,"pages":[58,62],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["1-10","오매패장탕","烏梅敗醬湯","","루즈정","路志正","궤양성 대장염과 만성 설사를 치료하는 승청升淸, 산렴酸斂, 항염抗炎의 처방","오매12~15g 패장초12~18g 복령15g 황련4~6g 목향9g(後下) 당귀10g 炒백작약12~15g 炒지실10g 태자삼12g 炒백출10g 갈근12g 炙감초6g","","핵심 효능 열을 내리고 습을 말림(청열화습淸熱化濕) 기의 순환을 돕고 피를 잘 돌게 함(조기행혈調氣行血) 비장을 튼튼히 하고 항진된 간의 기운을 눌러 가라앉힘(건비억간健脾抑肝)","주치증 비허간왕脾虛肝旺, 습열류련濕熱留戀으로 인한 대장 온결蘊結 증후(만성 비특이성 결장염, 궤양성 대장염, 만성 설사, 농혈 및 점액변, 복통, 추창墜脹, 이급후중裏急後重, 완복비민脘腹痞悶 등)","연구 확장 영역 소화기 질환(궤양성 대장염, 만성 결장염, 설사형 과민성대장증후군, 장 점막 장벽 손상 질환)","R&D 포인트 패장초, 황련의 복합 작용을 통한 NF-κB/NLRP3 염증 신호전달 경로의 다중 차단 및 염증성 사이토카인(TNF-α, IL-1β) 발현 억제 사군자탕의 구성을 기반으로 갈근, 오매를 융합하여 밀착연접(ZO-1, Occludin) 단백질 발현을 촉진하고 장관 상피세포 장벽 손상 복구 및 투과성 정상화 목향, 지실, 백작약의 평활근 경련 완화, 내장 감각 과민성 억제 및 설사형 과민성대장증후군, 궤양성 대장염 증상 개선 천연물 신약 소재","①산렴지사 · 거사제습 酸斂止瀉 · 祛邪除濕 오매 패장초 장기적인 설사를 직접적으로 수렴시켜 멈추게 하고, 대장에 엉킨 습열과 독소를 제거함 비장의 운화 기능을 회복시키고 청양淸陽을","②건비승청 健脾升淸 태자삼 백출 복령 감초 갈근 위로 끌어올려 근본적인 설사 원인을 제거함 기혈 순환을 원활하게 하여 복통과","③조기행혈 · 유간억목 調氣行血 · 柔肝抑木 황련 목향 지실 당귀 백작약 이급후중을 해소하고, 간목肝木의 횡역橫逆을 억누르고 부드럽게 유연화하여 비토脾土를 보호","④조화제약 調和諸藥 감초 ","습열류련濕熱留戀과 청열해독 대장의 뭉친 열과 독소를 없애 염증을 제어함","건비승청健脾升淸과 산렴지사酸斂止瀉 비를 보하고 장을 수렴하여 설사를 멈춤","조기행혈調氣行血과 유간억목柔肝抑木 기혈 순환을 돕고 간의 횡역을 눌러 통증을 완화함","지중앙持中央, 운사방運四旁 중앙을 지키고 사방을 통달하여 근본을 회복함","UC Remission 경·중등도 궤양성 대장염의 관해 유도 보조 치료 56례 치료 보고, 임상 연구, 경·중등도 궤양성 대장염 효과 관찰 등 처방 자체의 임상 보고가 반복되어 있음 메살라진 표준치료에 병용했을 때 임상 관해율과 내시경 점막 치유율이 높아지는지를 확인하는 무작위 대조 임상이 다음 단계(궤양성 대장염 표준약물은 중증도에 따라 다르므로 대상은 경·중등도로 한정) 검증 설계 메살라진 단독 대 메살라진+오매패장탕 8주 비교, 1차 지표는 Mayo 점수 기반 임상 관해율, 2차 지표는 내시경 점막 치유(Mayo 내시경 하위점수 0~1)와 분변 칼프로텍틴 근거 직접 연구 근거 참고문헌 [1](2004, 56례), [2](2007, 임상 연구), [4](2019, 경· 중등도 UC 효과 관찰)","Barrier & Inflammation 패장초·황련과 오매·갈근의 역할 분리 청열해독(패장초·황련)과 수렴·승청(오매·갈근)이라는 두 축이 각각 염증 억제와 점막 장벽 회복을 담당한다는 처방 해석을 구성 약재 제거 실험으로 확인함 그 결과로 제제화 시 핵심 약재군을 좁힘 검증 설계 DSS 대장염 모델에서 전체 처방 / 청열 모듈 / 수렴·승청 모듈 비교, 지표는 NF-κB·NLRP3, TNF-α·IL-1β, ZO-1·Occludin, 장 투과성 근거 임상 경험 보고 본문 R&D 포인트(NF-κB/NLRP3, 밀착연접 단백질), 참고문헌[3](임상 활용 해설)","Abdominal Pain & Visceral Sensitivity 복통·이급후중 등 증상 개선 기전 백작약·감초·목향의 완급지통 배합은 장 평활근 경련과 내장 과민성 완화로 해석할 수 있음 관해 이후에도 남는 복통·잦은 배변 등 과민성 장 증상 동반 환자에서 증상 개선 효과를 별도로 평가 검증 설계 완화기 궤양성 대장염 환자 중 IBS 유사 증상 동반군을 대상으로 복통 점수와 배변 빈도를 1차 지표로 한 탐색 임상 근거 신규 연구가설 R&D 논리 3 「조기행혈과 유간억목」, 본문 조성표","Relapse Prevention 관해 유지와 재발 억제 ‘지중앙持中央, 운사방運四旁’의 근본 치료 관점을 관해 유지 단계에 적용함 나아가 관해 후 12개월 재발률을 표준 유지요법과 비교하는 연구로 연결하면 단기 증상 개선을 넘어서는 차별점을 보여줄 수 있음(관해 유도 임상과 관해 유지 임상은 별도 시험으로 설계) 검증 설계 관해 도달 환자 대상 12개월 유지 비교, 재발률과 분변 칼프로텍틴 추이를 추적 근거 임상 경험 보고 참고문헌 [5](2025, UC 치료 고찰), R&D 논리 4"],"ss":{"composition":"그림 1-10 오매패장탕烏梅敗醬湯의 모듈 구성 ①산렴지사酸斂止瀉, 거사제습祛邪除濕 모듈 — 장기적인 설사를 직접적으로 수렴시켜 멈추게 하고, 대장에 엉킨 습열과 독소를 제거함 오매 : 산삽酸澁의 성질로 수렴을 통해 장관 과민성을 억제하고 설사를 직접적으로 멈추게 하며, 만성의 묽은 변 및 만성 설사 증상 개선 패장초 : 고한苦寒한 성질로 대장의 뭉친 열과 독소를 해소하고, 장관 점막의 궤양 및 농혈의 배출을 촉진 ②건비승청健脾升淸 모듈 — 비장의 운화 기능을 회복시키고 청양淸陽을 위로 끌어올려 근본적인 설사 원인을 제거함 태자삼, 백출, 복령, 감초 : 사군자탕의 처방구성으로 중초의 기를 보강하고 습을 말려 비장의 운화 기능을 회복시킴 갈근 : 청양을 위로 끌어올려 완곡불화完穀不化를 바로잡고 지사止瀉작용을 도와 설사를 제어함 ③조기행혈調氣行血, 유간억목柔肝抑木 모듈 — 기혈 순환을 원활하게 하여 복통과 이급후중을 해소하고, 간목 肝木의 횡역橫逆을 억누르고 부드럽게 유연화하여 비토脾土를 보호 황련 : 고한苦寒한 성질로 대장의 습열을 제거하고 건조하게 말리며, 사화해독瀉火解毒을 통해 염증성 이질 및 하리下利증상을 제어 목향, 지실 : 울결된 기기를 풀고 아래로 끌어내려 복부팽만, 복통, 하복부의 묵직함을 해소함 당귀, 백작약 : 보혈補血과 활혈活血을 통해 통증을 완화시키고, 오매와 배합되어 간의 횡역을 억누르고 부드럽게 풀어 간비불화肝脾不和를 제어함 ④조화제약調和諸藥 모듈 감초 : 약재 간의 성질을 조율하고 중초를 편안하게 하며, 처방 전체의 균형을 잡음","master":"①지중앙持中央, 운사방運四旁에 기반한 근본적 비위 보강 궤양성 대장염을 치료할 때 대장의 국소적인 염증이나 점액농혈의 변에만 국한하지 않고, “중앙인 중초 비위를 지키고, 사방의 장부를 통달하게 한다”는 ‘지중앙, 운사방’의 관점을 가짐. 궤양성 대장염의 재발과 만성화는 비위의 허약에서 비롯된다고 보고, 보비익기補脾益氣를 기본 바탕으로 삼아 대장의 자가 회복력을 끌어올림 ②청열해독과 산렴지사酸斂止瀉의 병용을 통한 급·만성 병리기전 동시 제어 궤양성 대장염 활성기에 나타나는 대장 습열濕熱과 농혈 증상을 패장초, 황련으로 청열해독하는 동시에, 장기간 지속된 이질과 설사로 인한 대장 기운의 누수를 오매의 산렴酸斂 성질로 치료. 맹목적인 청열약 투여로 인한 비위 손상이나, 급작스러운 수렴약 투여로 인한 사기류련邪氣留戀을 예방하는 치법을 제시함 ③조기행혈調氣行血과 유간억목柔肝抑木을 통한 정신, 신체 복합 병리 조율 정서적 자극이나 스트레스로 간기肝氣가 울결될 때 대장의 복통과 이급후중이 악화되는 궤양성 대장염의 특성을 파악함. 목향, 지실로 막힌 기운을 풀고, 당귀, 백작약으로 혈액 순환을 도우며 간을 부드럽게 어루만져 간목肝木이 비토脾土를 침범하지 않도록 제어함. 이를 통해 장-뇌 축 상의 불균형을 해소하고 궤양성 대장염의 유발 요인을 종합적으로 조율함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 궤양성 대장염 임상연구가 2편 이상 있으면서도 공개자료상 중국 제품이 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 국내 특허를 검토한다면 원방 조성보다 제형·표준화·용도 중심으로 설계해야 함. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 장레이,리리샤,왕메이칭.오매패장방의 만성 비특이성 궤양성 대장염 56례 치료烏梅敗醬方治療慢性非特異性潰瘍性結腸炎56例[J].산시중의陝西中醫,2004,(9):797-798. [2] 장레이,천쉐칭,리징쥔.오매패장방의 궤양성 대장염 치료 임상 연구烏梅敗醬方治療潰瘍性結腸炎的臨床研究[J].쓰촨중의四川中醫,2007,(3):65-66. [3] 양펑전.루즈정의 오매패장탕 임상 활용 해설路志正烏梅敗醬湯的臨床運用解讀[J].국제중의중약잡지國際中醫中藥雜志,2010,(5):449. [4] 류리,왕징빈,황궈신.오매패장탕의 경·중등도 궤양성 대장염 치료 효과 관찰烏梅敗醬湯治療輕中度潰瘍性結腸炎療效觀察[J].실용중의약잡지實用中醫藥雜志,2019,35(9):1053-1054. [5] 류덩커,웨이웨이.오매패장방의 궤양성 대장염 치료에 대한 고찰烏梅敗醬方治療潰瘍性結腸炎淺析[J].세계중서의결합잡지世界中西醫結合雜志,2025,20(1):188-191."}},{"id":"1-11","ko":"연간전","hz":"軟肝煎","alias":"","master_ko":"덩톄타오","master_hz":"鄧鐵濤","tagline":"건비양간보신健脾養肝補腎, 활혈화징연견活血化癥軟堅으로 간경화를 치료하는 처방","meta":{"주요 적응증":"간경화","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":63,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-11 연간전軟肝煎의 모듈 구성<\/p><h4>①건비익기健脾益氣, 거습화탁祛濕化濁 모듈 — 중앙의 비위를 튼튼히 하고 기기의 승강 추뉴를 열어 수습과 탁한 사기를 배출함<\/h4><p><b>태자삼<\/b>: 기를 보하면서도 건조하지 않아 기음쌍보氣陰雙補의 효능을 발휘함<\/p><p><b>백출<\/b>: 비를 튼튼하게 하고 습을 말리며 중앙의 토土를 공고히 하여 사방으로 운화시킴<\/p><p><b>복령<\/b>: 비를 도우며 수습을 삼투시켜 아래로 배출함<\/p><p><b>비해<\/b>: 청탁을 가르고 하초의 습탁을 거두어 수사水邪를 소변으로 배출함<\/p><h4>②보신양간補腎養肝, 자수함목滋水涵木 모듈 — 간신동원肝腎同源의 원리에 따라 정혈을 보하고 음혈을 자윤함<\/h4><p><b>토사자<\/b>: 평보음양平補陰陽하고 허손虛損을 보익하며 간신을 함께 보하여 수생목水生木함<\/p><p><b>저실자<\/b>: 신을 보하고 비를 도우며 허로를 보익하고 근골을 강하게 함<\/p><h4>③활혈화어活血化瘀, 연견산결軟堅散結 모듈 — 혈분을 소통시키고 굳은 적취를 깨뜨리며 제약을 조율함<\/h4><p><b>별갑<\/b>: 딱딱한 징가癥瘕 및 심복견적心腹堅積을 부드럽게 연화하고 유형有形의 종괴를 없앰<\/p><p><b>토별충<\/b>: 뼛속의 어혈을 깨뜨리고 오로허극五勞虛極을 다스리며 징적癥積을 부드럽게 풀지만 정기를 손상시키지 않음<\/p><p><b>단삼<\/b>: 어혈을 없애며 양혈활혈涼血活血하여 혈액의 순환과 생성을 도움<\/p><p><b>감초<\/b>: 비기를 보하고 위를 조화롭게 하며 제약을 조율하고 완급지통緩急止痛함<\/p>"},{"k":"master","t":"덩톄타오의 간경화 치료","html":"<h4>①병인병기 이론 (오장상관과 간·비·신 축의 연계)<\/h4><p><b>질환의 범주<\/b>: 간경화는 중의학의 ‘협통脇痛’, ‘징적癥積’, ‘고창鼓脹(복수)’ 등의 범주에 속함. 고창(복수)은 중의학의 4대 난증 중 하나로 병기가 매우 복잡함<\/p><p><b>간과 비의 상관성<\/b>: “습종만은 모두 비에 속한다諸濕腫滿, 皆屬於脾”는 원리에 따라, 비허로 운화가 실조되면 담습과 수음이 생기고 토불생금土不生金하여 물이 머뭄. 간의 소설 기능이 실조되면 기기승강의 추뉴가 막히고 목왕승토木旺乘土 혹은 토허목승土虛木乘하여 기체수정氣滯水停, 담탁어혈痰濁瘀血이 엉겨 고창(복수)이 됨<\/p><p><b>간과 신의 상관성<\/b>: ‘간신동원肝腎同源’ 이론에 근거하여, 신은 정을 감추고 간은 혈을 갈무리함. 수水는 어머니요 목木은 자식이므로, 자수함목滋水涵木하여 신의 정수가 간혈을 기르면 간목이 조화롭게 다스려지고 소설이 정상적으로 이루어짐<\/p><h4>②연간전의 치료 원칙 및 효능 해설<\/h4><p><b>오장상관 이론의 임상 구현<\/b>: 대사의 ‘오장상관五臟相關’ 이론을 바탕으로 기계적인 오행론을 넘어 장부, 기혈, 경락의 다차원적 연계를 고려함. 간의 체體와 용用을 모두 살펴, 기가 남고 혈이 부족한 상태를 조절함<\/p><p><b>역공역보亦攻亦補와 체용겸고體用兼顧의 대법<\/b>: 간경화 말기에 정기는 더욱 허해지고 사기는 성해지는 허실협잡虛實夾雜 상태에서, 연간전은 사군자탕을 밑바탕으로 삼아 부정거사扶正祛邪를 이룸. 별갑, 토별충 같은 영동지품靈動之品과 태자삼, 토사자, 저실자를 배합하여 역공역보, 체용겸고를 구현함<\/p><h4>③겸증 가감<\/h4><p><b>알코올성 간경화<\/b>: 갈화葛花 가미<\/p><p><b>문맥성 간경화<\/b>: 炒천산갑 가미<\/p><p><b>잇몸출혈 또는 피하출혈<\/b>: 선학초, 우절藕節 가미<\/p><p><b>간음부족肝陰不足, 설홍태소舌紅苔少<\/b>: 한련초, 여정자, 석곡, 옥죽 등 가미<\/p><p><b>음허발열陰虛發熱<\/b>: 지골피, 은시호, 백미白薇 가미<\/p><p><b>복수가 있을 때<\/b>: 택사, 저령, 동과피, 의이인, 상륙商陸 등 가미<\/p><p><b>황달이 있을 때<\/b>: 인진, 금전초 등 가미<\/p><p><b>비신양허脾腎陽虛<\/b>: 실비음實脾飮 또는 진무탕眞武湯 합방<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">간경화 대상 임상 근거가 있으나 공개자료상 중국 제품이 확인되지 않았으므로, 국내에서는 간섬유화 바이오마커를 지표로 한 제제 개발을 검토할 수 있음. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 리윈안.덩톄타오의 연간전 가감에 의한 간경변 56례軟肝煎加減治療肝硬化56例[J].내몽골중의약內蒙古中醫藥,2010,29(21):31.<\/li><li class=\"ref\">[2] 천카이성,류밍,웨이줘훙.연간전 가감방과 약선을 병용한 간경변 복수 합병 영양불량 임상 연구軟肝煎加減方聯合藥膳治療肝硬化腹水合並營養不良臨床研究[J].신중의新中醫,2017,49(7):58-60.<\/li><li class=\"ref\">[3] 천줘췬,류펑빈.덩톄타오의 연간전으로 본 간경변 중의약 치료從鄧鐵濤軟肝煎談肝硬化中醫藥治療[J].중국중의약정보잡지中國中醫藥信息雜志,2018,25(3):119-120.<\/li><li class=\"ref\">[4] 예칭,차이나이량,쑤하이저우.실비음 합 연간전에 의한 비신양허형 간경변 복수 임상 연구實脾飮合軟肝煎治療脾腎陽虛型肝硬化腹水的臨床研究[J].중화 중의약학간中華中醫藥學刊,2021,39(10):70-73.<\/li><li class=\"ref\">[5] 황사오펑.연간전 가감과 엔테카비르 병용에 의한 B형 간염 간섬유화 치료 임상 효능 관찰軟肝煎加減聯合恩替卡韋治療乙肝肝纖維化臨床療效觀察[D].푸 젠중의약대학福建中醫藥大學,2019.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"태자삼30g","name":"태자삼","dose":"30g","base":"태자삼"},{"raw":"醋炙별갑30g","name":"醋炙별갑","dose":"30g","base":"별갑"},{"raw":"백출15g","name":"백출","dose":"15g","base":"백출"},{"raw":"복령15g","name":"복령","dose":"15g","base":"복령"},{"raw":"저실자楮實子12g","name":"저실자楮實子","dose":"12g","base":"저실자"},{"raw":"토사자12g","name":"토사자","dose":"12g","base":"토사자"},{"raw":"川비해18g","name":"川비해","dose":"18g","base":"비해"},{"raw":"단삼10g","name":"단삼","dose":"10g","base":"단삼"},{"raw":"감초6g","name":"감초","dose":"6g","base":"감초"},{"raw":"토별충3g","name":"토별충","dose":"3g","base":"토별충"}],"notes":[],"핵심 효능":["간·비·신을 함께 보양하고 기음氣陰을 쌍보함(건비양간보신健脾養肝補腎)","어혈을 없애고 덩어리를 흩어뜨리며 딱딱한 적취를 연화함(활혈화징연견活血化癥軟堅)"],"주치증":["간경화"],"연구 확장 영역":["간경화, 간섬유화, 만성 간염 후 간경화, 알코올성 간경화, 복수 및 문맥성 간경화 관련 질환"],"R&D 포인트":["간경화 병리에 대한 ‘오장五臟상관’ 이론 및 간·비·신 축의 연계 기전 분석","별갑과 토별충 등 영동지품靈動之品의 항간섬유화 및 징적 연견 작용 검증","태자삼, 백출, 복령(사군자탕 의미)과 토사자, 저실자의 임상 유효성 연구"]},"modules":[{"name":"①건비익기 · 거습화탁","hz":"健脾益氣 · 祛濕化濁","herbs":["태자삼","백출","복령","비해"],"role":"중앙의 비위를 튼튼히 하고 기기의 승강 추뉴를 열어 수습과 탁한 사기를 배출함"},{"name":"②보신양간 · 자수함목","hz":"補腎養肝 · 滋水涵木","herbs":["토사자","저실자"],"role":"간신동원肝腎同源의 원리에 따라 정혈을 보하고 음혈을 자윤함"},{"name":"③활혈화어 · 연견산결","hz":"活血化瘀 · 軟堅散結","herbs":["별갑","토별충","단삼","감초"],"role":"혈분을 소통시키고 굳은 적취를 깨뜨리며 제약을 조율함"}],"rd":[{"tag":"Antiviral Combination","title":"엔테카비르 병용 시 B형간염 간섬유화 개선","html":"<p>엔테카비르와 연간전 가감방 병용으로 B형간염 간섬유화를 치료한 임상 관찰이 있음<\/p><p>항바이러스 치료만으로 섬유화가 충분히 개선되지 않는 환자군에서 병용에 따른 섬유화 지표 개선을 확인하는 것이 가장 현실적인 개발 경로(항바이러스 치료는 그대로 유지)<\/p><p><b>검증 설계<\/b> 엔테카비르 단독 대 병용 48주 비교, 1차 지표는 간경도(FibroScan) 변화, 2차 지표는 APRI·FIB-4와 혈청 섬유화 지표(HA·PIIINP)<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [5](2019, 엔테카비르 병용 임상 관찰)<\/p>"},{"tag":"Anti-fibrotic Herbs","title":"별갑·토별충의 항섬유화 효과 분리 검증","html":"<p>초자별갑(30g)과 토별충의 ‘연견산결’ 작용을 현대적으로는 간성상세포 활성 억제와 콜라겐 분해(MMP/TIMP 균형) 촉진으로 해석할 수 있음<\/p><p>두 동물성 약재 유무에 따른 효과 차이를 구성 약재 제거 실험으로 확인하고, 간경변 환자의 출혈 위험을 함께 점검<\/p><p><b>검증 설계<\/b> CCl4 간섬유화 랫드에서 전체 처방 / 별갑·토별충 제외 처방 비교, α-SMA· 콜라겐 면적·MMP-2/TIMP-1 측정<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> 본문 R&amp;D 포인트(별갑·토별충의 항간섬유화), R&amp;D 논리 2 「역공역보와 영동지품」<\/p>"},{"tag":"Ascites & Nutrition","title":"간경변 복수·영양불량 동반 환자의 보조 치료","html":"<p>실비음 합방으로 비신양허형 간경변 복수를 치료한 임상 연구와 약선 병용으로 복수· 영양불량을 다룬 임상 연구가 있음<\/p><p>이뇨제 표준치료에 병용했을 때 복수 조절과 영양 상태(알부민·근육량)가 함께 개선되는지 평가<\/p><p><b>검증 설계<\/b> 이뇨제 표준치료 대 병용 비교, 지표는 복수 감소(초음파)·체중·혈청 알부민<\/p><p class=\"li\">·근감소 지표<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [4](2021, 실비음 합방 복수 임상), [2](2017, 약선 병용 임상)<\/p>"},{"tag":"Clinical Endpoints","title":"간경변 임상 지표와 안전성 기준 정립","html":"<p>56례 가감 치료 보고 등 기존 임상이 소규모·단일기관임<\/p><p>Child-Pugh 점수, 문맥압 관련 지표(비장 크기·혈소판), 간기능과 안전성 지표를 표준화한 다기관 설계로 근거 수준을 올리는 것이 필요<\/p><p><b>검증 설계<\/b> 다기관 전향 코호트로 시작해 Child-Pugh 점수 변화와 비대상성 사건 발생률을 1차 지표로 설정<\/p><p class=\"row\ 간경변 복수·영양불량 동반 환자의 보조 치료 실비음 합방으로 비신양허형 간경변 복수를 치료한 임상 연구와 약선 병용으로 복수· 영양불량을 다룬 임상 연구가 있음 이뇨제 표준치료에 병용했을 때 복수 조절과 영양 상태(알부민·근육량)가 함께 개선되는지 평가 검증 설계 이뇨제 표준치료 대 병용 비교, 지표는 복수 감소(초음파)·체중·혈청 알부민 ·근감소 지표 근거 임상 경험 보고 참고문헌 [4](2021, 실비음 합방 복수 임상), [2](2017, 약선 병용 임상)","Clinical Endpoints 간경변 임상 지표와 안전성 기준 정립 56례 가감 치료 보고 등 기존 임상이 소규모·단일기관임 Child-Pugh 점수, 문맥압 관련 지표(비장 크기·혈소판), 간기능과 안전성 지표를 표준화한 다기관 설계로 근거 수준을 올리는 것이 필요 검증 설계 다기관 전향 코호트로 시작해 Child-Pugh 점수 변화와 비대상성 사건 발생률을 1차 지표로 설정 근거 직접 연구 근거 참고문헌 [1](2010, 56례), [3](2018, 간경변 중의약 치료 고찰)"],"ss":{"composition":"그림 1-11 연간전軟肝煎의 모듈 구성 ①건비익기健脾益氣, 거습화탁祛濕化濁 모듈 — 중앙의 비위를 튼튼히 하고 기기의 승강 추뉴를 열어 수습과 탁한 사기를 배출함 태자삼 : 기를 보하면서도 건조하지 않아 기음쌍보氣陰雙補의 효능을 발휘함 백출 : 비를 튼튼하게 하고 습을 말리며 중앙의 토土를 공고히 하여 사방으로 운화시킴 복령 : 비를 도우며 수습을 삼투시켜 아래로 배출함 비해 : 청탁을 가르고 하초의 습탁을 거두어 수사水邪를 소변으로 배출함 ②보신양간補腎養肝, 자수함목滋水涵木 모듈 — 간신동원肝腎同源의 원리에 따라 정혈을 보하고 음혈을 자윤함 토사자 : 평보음양平補陰陽하고 허손虛損을 보익하며 간신을 함께 보하여 수생목水生木함 저실자 : 신을 보하고 비를 도우며 허로를 보익하고 근골을 강하게 함 ③활혈화어活血化瘀, 연견산결軟堅散結 모듈 — 혈분을 소통시키고 굳은 적취를 깨뜨리며 제약을 조율함 별갑 : 딱딱한 징가癥瘕 및 심복견적心腹堅積을 부드럽게 연화하고 유형有形의 종괴를 없앰 토별충 : 뼛속의 어혈을 깨뜨리고 오로허극五勞虛極을 다스리며 징적癥積을 부드럽게 풀지만 정기를 손상시키지 않음 단삼 : 어혈을 없애며 양혈활혈涼血活血하여 혈액의 순환과 생성을 도움 감초 : 비기를 보하고 위를 조화롭게 하며 제약을 조율하고 완급지통緩急止痛함","master":"①병인병기 이론 (오장상관과 간·비·신 축의 연계) 질환의 범주 : 간경화는 중의학의 ‘협통脇痛’, ‘징적癥積’, ‘고창鼓脹(복수)’ 등의 범주에 속함. 고창(복수)은 중의학의 4대 난증 중 하나로 병기가 매우 복잡함 간과 비의 상관성 : “습종만은 모두 비에 속한다諸濕腫滿, 皆屬於脾”는 원리에 따라, 비허로 운화가 실조되면 담습과 수음이 생기고 토불생금土不生金하여 물이 머뭄. 간의 소설 기능이 실조되면 기기승강의 추뉴가 막히고 목왕승토木旺乘土 혹은 토허목승土虛木乘하여 기체수정氣滯水停, 담탁어혈痰濁瘀血이 엉겨 고창(복수)이 됨 간과 신의 상관성 : ‘간신동원肝腎同源’ 이론에 근거하여, 신은 정을 감추고 간은 혈을 갈무리함. 수水는 어머니요 목木은 자식이므로, 자수함목滋水涵木하여 신의 정수가 간혈을 기르면 간목이 조화롭게 다스려지고 소설이 정상적으로 이루어짐 ②연간전의 치료 원칙 및 효능 해설 오장상관 이론의 임상 구현 : 대사의 ‘오장상관五臟相關’ 이론을 바탕으로 기계적인 오행론을 넘어 장부, 기혈, 경락의 다차원적 연계를 고려함. 간의 체體와 용用을 모두 살펴, 기가 남고 혈이 부족한 상태를 조절함 역공역보亦攻亦補와 체용겸고體用兼顧의 대법 : 간경화 말기에 정기는 더욱 허해지고 사기는 성해지는 허실협잡虛實夾雜 상태에서, 연간전은 사군자탕을 밑바탕으로 삼아 부정거사扶正祛邪를 이룸. 별갑, 토별충 같은 영동지품靈動之品과 태자삼, 토사자, 저실자를 배합하여 역공역보, 체용겸고를 구현함 ③겸증 가감 알코올성 간경화 : 갈화葛花 가미 문맥성 간경화 : 炒천산갑 가미 잇몸출혈 또는 피하출혈 : 선학초, 우절藕節 가미 간음부족肝陰不足, 설홍태소舌紅苔少 : 한련초, 여정자, 석곡, 옥죽 등 가미 음허발열陰虛發熱 : 지골피, 은시호, 백미白薇 가미 복수가 있을 때 : 택사, 저령, 동과피, 의이인, 상륙商陸 등 가미 황달이 있을 때 : 인진, 금전초 등 가미 비신양허脾腎陽虛 : 실비음實脾飮 또는 진무탕眞武湯 합방","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 간경화 대상 임상 근거가 있으나 공개자료상 중국 제품이 확인되지 않았으므로, 국내에서는 간섬유화 바이오마커를 지표로 한 제제 개발을 검토할 수 있음. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 리윈안.덩톄타오의 연간전 가감에 의한 간경변 56례軟肝煎加減治療肝硬化56例[J].내몽골중의약內蒙古中醫藥,2010,29(21):31. [2] 천카이성,류밍,웨이줘훙.연간전 가감방과 약선을 병용한 간경변 복수 합병 영양불량 임상 연구軟肝煎加減方聯合藥膳治療肝硬化腹水合並營養不良臨床研究[J].신중의新中醫,2017,49(7):58-60. [3] 천줘췬,류펑빈.덩톄타오의 연간전으로 본 간경변 중의약 치료從鄧鐵濤軟肝煎談肝硬化中醫藥治療[J].중국중의약정보잡지中國中醫藥信息雜志,2018,25(3):119-120. [4] 예칭,차이나이량,쑤하이저우.실비음 합 연간전에 의한 비신양허형 간경변 복수 임상 연구實脾飮合軟肝煎治療脾腎陽虛型肝硬化腹水的臨床研究[J].중화 중의약학간中華中醫藥學刊,2021,39(10):70-73. [5] 황사오펑.연간전 가감과 엔테카비르 병용에 의한 B형 간염 간섬유화 치료 임상 효능 관찰軟肝煎加減聯合恩替卡韋治療乙肝肝纖維化臨床療效觀察[D].푸 젠중의약대학福建中醫藥大學,2019."}},{"id":"1-12","ko":"청화음","hz":"淸化飮","alias":"","master_ko":"양춘보","master_hz":"楊春波","tagline":"청열화습淸熱化濕, 이기활혈理氣活血하여 만성 위염의 비위습열증脾胃濕熱證을 치료하는 처방","meta":{"주요 적응증":"비위습열형 만성 위염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":68,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-12 청화음淸化飮의 모듈 구성<\/p><h4>①청열조습淸熱燥濕, 이습화탁利濕化濁 모듈 — 고한苦寒과 방향성 약물을 배합하여 중초의 습열을 분소함<\/h4><p><b>인진<\/b>: 청열리습淸熱利濕하고, 춘생春生의 기를 받아 간경에 들어가 상행함<\/p><p><b>황련<\/b>: 청열조습하고 중초의 습열을 직접 다스림<\/p><p><b>패란<\/b>: 방향성으로 중초의 탁한 습기를 일깨워 화해시킴<\/p><p><b>백두구<\/b>: 따뜻하게 비를 덥혀 조습하며 고한한 약재들의 치우침을 제어하는 반좌의 역할을 함<\/p><h4>②건비삼습健脾滲濕, 이기제만理氣除滿 모듈 — 비위를 튼튼히 하고 기기를 소통시켜 습사가 머물지 않게 함<\/h4><p><b>백편두<\/b>: 비위를 보하고 습을 화해시키며 비위를 조화롭게 함<\/p><p><b>의이인<\/b>: 습을 삼출시키고 이뇨하며, 비를 돕고 습사를 아래로 배출함<\/p><p><b>후박<\/b>: 화습하고 기를 소통시키며 중초의 그득함을 없앰<\/p><h4>③청열양혈淸熱涼血, 활혈지통活血止痛 모듈 — 혈분을 소통시키고 울체된 열을 식힘<\/h4><p><b>적작약<\/b>: 청열양혈하고 어혈을 흩어뜨리며 통증을 멎게 함<\/p>"},{"k":"master","t":"양춘보의 비위습열脾胃濕熱 이론","html":"<h4>①다차원적 종합 진단과 거시·미관의 융합<\/h4><p><b>종합적 관찰과 현대 기술의 접목<\/b>: 병과 증, 전체와 국부, 거시와 미관, 기능과 조직, 기체와 환경을 유기적으로 결합하여 종합적으로 살핌. 현대 진단 기술이 포착한 미시적·국부적 병리 변화를 전통 이론으로 재해석하고, 이를 거시적·전체적 변증과 결합하여 치법과 용약을 확정함<\/p><p><b>외감에서 내상으로의 발전 및 여유입면如油入麵<\/b>: 흡연, 음주, 스트레스 등 현대적 내상 요인으로 인한 발병 메커니즘을 확립함. 습과 열이 결합하는 습열상박濕熱相搏 상태는 마치 기름이 밀가루에 스며드는 것과 같아 여유입면如油入麵이라 하여 쉽게 제거되지 않는 난치성을 띰<\/p><p><b>황니태黃膩苔를 통한 진단 기준<\/b>: 비위의 운화 실조로 습열이 훈증하여 나타나는 황니태를 비위습열증 진단의 핵심 지표이자 기준으로 삼음<\/p><h4>②오장상관五臟相關의 연계와 장부 상관성<\/h4><p><b>비위를 중심에 둔 전신 관점<\/b>: 비위가 치료의 핵심이지만 엄격한 전체관을 유지함. 병위는 비위에 있으나 간, 담, 장腸과의 관계가 가장 밀접하며, 심, 폐, 신, 방광, 여자포女子胞와도 긴밀한 연관성을 지님<\/p><h4>③허실의 구별과 보사補瀉의 적용 원칙<\/h4><p><b>청화위선淸化爲先, 표본겸치標本兼治<\/b>: 습열증은 본질적으로 실증이므로 치료의 원칙은 사법瀉法을 위주로 하되, 비허脾虛로 인해 운화가 안 되어 습이 정체하고 열이 생기는 등 기허, 혈허, 양허, 음허 등이 겸해진 경우 주와 차, 완급을 엄격히 따짐<\/p><p><b>유연한 보사 활용<\/b>: 병증의 양상에 따라 먼저 사할 것인지 먼저 보할 것인지, 혹은 보법과 사법을 번갈아 쓸 것인지, 함께 겸용할 것인지를 신중히 결정함<\/p><h4>④습열의 경중 변별과 한온병용寒溫並用의 방제 철학<\/h4><p><b>습열 경중의 맞춤 대응<\/b>: 청열거습이 총칙이지만, 임상에서는 습열병중濕熱竝重, 습중어열濕重於熱, 열중어습熱重於濕의 편차를 엄격히 나누어 그에 따른 가감을 시행함<\/p><p><b>한온병용과 기기 승강<\/b>: 차고 쓴 약재(황련, 인진)와 따뜻하고 매운 약재(후박, 백두구)를 조화시켜 치우침을 막고, 비는 오르고 위는 내리는 승강升降의 추뉴를 회복시켜 중초의 탁한 기운이 맺히고 압박하는 병세를 근본적으로 해소함<\/p><h4>⑤청화음의 임상 변증 가감의 실제<\/h4><p><b>기본 방제와 목적별 가감<\/b>: 습열이 병중並重한 양상에 대해 청화음을 기본으로 삼고, 증상에 따라 이비청화理脾淸化, 조기서락調氣舒絡, 산어안신散瘀安神 등의 치법을 유연하게 가미함<\/p><p class=\"lbl2\">세부 가감<\/p><p class=\"sub\">열이 심하면 온조溫燥한 후박, 백두구를 빼고, 황련, 지모, 지각 등을 가미<\/p><p class=\"sub\">습이 심하면 백편두를 빼고, 창출을 더하여 거습祛濕<\/p><p class=\"sub\">습열이 영분營分으로 들어가 동혈動血하면, 서각지황탕을 써서 수우각, 황련 등으로 청열해독하고, 생지황, 목단피, 藏홍화 등으로 산혈양혈散血涼血<\/p><p class=\"sub\">위산과다에는 해표소, 용골, 모려를 가미<\/p><p class=\"sub\">변비에는 대황, 화마인, 괄루 등을 가미<\/p><p class=\"sub\">설사나 변당便溏(묽은 변)에는 선학초, 지유炭을 가미<\/p><p class=\"sub\">수면장애나 꿈을 많이 꾸면 야교등이나 합환피를 가미<\/p><p class=\"sub\">간울증에는 시호, 향부자, 천련자를 더하고, 기체氣滯에는 목향, 지각, 빈랑을 더하며, 혈어血瘀에는 아출, 단삼, 왕불류행 등을 더하고, 식체食滯에는 맥아, 곡아, 내복자, 계내금, 산사, 신곡 등을 더하며, 위기상역胃氣上逆에는 반하, 죽여, 소경, 선복화 등을 가미<\/p><p class=\"sub\">기허에는 당삼, 황기, 백출 등을 더하고, 중기하함中氣下陷에는 승마, 시호, 갈근, 길경을 더하며, 허한虛寒에는 건강, 포강炮薑을 더하고, 위음허胃陰虛에는 옥죽, 사삼 등을 더하며, 비음허脾陰虛에는 산약을 더하고, 신음허腎陰虛에는 황정, 구기자를 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">제품·특허가 없는 경험방으로, 습열형 위염 변증 기준을 표준화하는 연구가 선행되어야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 우콴위,류훙,러윈펑.양춘보 노중의의 비위습열증 진료 특징楊春波老中醫診治脾胃濕熱證的特點[J].푸젠중의약대학학보福建中醫學院學報,2007,(5):11-13.<\/li><li class=\"ref\">[2] 뤄윈펑,천진퇀,양정닝,등.국의대사 양춘보의 ‘비위습열 이론 체계’ 구축 요점國醫大師楊春波“脾胃濕熱理論體系”構建撮要[J].중국중서의결합소화잡지中國中西醫結合消化雜志,2024,32(7):556-559.<\/li><li class=\"ref\">[3] 왕원룽,후광훙,황헝칭,등.양춘보 교수의 만성 위염 비위습열증 치료 효과 관찰 및 용약 규율 분석楊春波教授治療慢性胃炎脾胃濕熱證的療效觀察及用藥規律分析[C]//중화중의약학회 비위병분회.중화중의약학회 비위병분회 제25회 전국 비위병 학술교류회 논문집中華中醫藥學會脾胃病分會第二十五屆全國脾胃病學術交流會論文彙編.2013:234-242.<\/li><li class=\"ref\">[4] 황헝칭,뤄윈펑.양춘보의 청화음 활용 경험 사례淸化飮經驗舉隅[C]//중화중의약학회 비위병분회.중화중의약학회 비위병분회 제20회 전국 비위병 학술교류 회 논문집中華中醫藥學會脾胃病分會第二十次全國脾胃病學術交流會論文彙編.2008:465-467.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"인진10g","name":"인진","dose":"10g","base":"인진"},{"raw":"백편두12g","name":"백편두","dose":"12g","base":"백편두"},{"raw":"황련3g","name":"황련","dose":"3g","base":"황련"},{"raw":"후박6g","name":"후박","dose":"6g","base":"후박"},{"raw":"패란10g","name":"패란","dose":"10g","base":"패란"},{"raw":"백두구4.5g","name":"백두구","dose":"4.5g","base":"백두구"},{"raw":"의이인15g","name":"의이인","dose":"15g","base":"의이인"},{"raw":"적작약10g","name":"적작약","dose":"10g","base":"적작약"}],"notes":[],"핵심 효능":["고한의 약성과 방향성 약재를 배합하여 중초에 결합된 습열을 청화함(청열화습淸熱化濕)","기기를 소통시키고 혈분을 조화롭게 하여 습열의 근원을 다스림(이기활혈理氣活血)"],"주치증":["만성 위염의 비위습열증脾胃濕熱證"],"연구 확장 영역":["만성 위염, 소화기계 습열증 질환, 헬리코박터 파일로리 감염 관련 위염, 위산 분비 이상 및 위점막 염증 질환, 위장관 기능성 및 궤양성 질환"],"R&D 포인트":["방향성 및 고한 본초의 배합을 통해 습열상박濕熱相搏이 여유입면如油入麵처럼 엉기는 병태를 해소하는 효과 검증","인진과 황련, 후박의 상승 작용에 따른 항염증 및 위점막 보호 기전 연구","한온병용寒溫並用과 승강상인升降相因의 원리에 기초한 만성 위염 치료의 임상 유효성 분석"]},"modules":[{"name":"①청열조습 · 이습화탁","hz":"淸熱燥濕 · 利濕化濁","herbs":["인진","황련" "R&D 포인트 방향성 및 고한 본초의 배합을 통해 습열상박濕熱相搏이 여유입면如油入麵처럼 엉기는 병태를 해소하는 효과 검증 인진과 황련, 후박의 상승 작용에 따른 항염증 및 위점막 보호 기전 연구 한온병용寒溫並用과 승강상인升降相因의 원리에 기초한 만성 위염 치료의 임상 유효성 분석","①청열조습 · 이습화탁 淸熱燥濕 · 利濕化濁 인진 황련 패란 백두구 고한苦寒과 방향성 약물을 배합하여 중초의 습열을 분소함","②건비삼습 · 이기제만 健脾滲濕 · 理氣除滿 백편두 의이인 후박 비위를 튼튼히 하고 기기를 소통시켜 습사가 머물지 않게 함","③청열양혈 · 활혈지통 淸熱涼血 · 活血止痛 적작약 혈분을 소통시키고 울체된 열을 식힘","습열상박濕熱相搏과 여유입면如油入麵 습과 열이 엉켜 밀가루에 기름이 스며들듯 난치성 병태를 형성함","한온병용寒溫並用과 승강상인升降相因 차고 쓴 약재와 따뜻하고 매운 약재를 조화시켜 승강을 회복함","청화위선淸化爲先과 표본겸치標本兼治 실증인 습열을 우선 사하고 허실을 겸하여 조율함","오장상관五臟相關과 거시·미관의 융합 현대 진단 기술과 전통 변증의 유기적 결합","Damp-heat Pattern 비위습열증 진단 지표와 처방 반응성 연계 양춘보의 ‘비위습열 이론 체계’가 정리되어 있음 설태(황니태) 영상 분석 지표의 타당도·재현성을 먼저 검증한 뒤, Hp 감염자는 표준 제균요법을 별도로 시행한 상태에서 위점막 염증 등급과 함께 청화음 반응성을 예측하는 지표를 찾는 연구가 출발점 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2] (2024, 비위습열 이론 체계), [1](진료 특징))","Cold–Hot Combination 황련(3g)과 후박·백두구의 한온병용 비율 검증 황련을 3g으로 소량만 쓰고 방향성 약재(후박·백두구·패란)로 습을 푸는 구성이 특징임 황련 용량을 달리한 처방의 항염 효과와 위장 자극을 비교하여 최적 비율을 확인 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 2 「한온병용과 승강상인」)","Clinical Outcomes 만성 위염 습열증 임상 효과 재현 학회 발표 수준의 효과 관찰과 용약 규율 분석이 있음 표준화된 증상 척도와 내시경·병리 소견을 지표로 한 전향적 관찰 연구로 결과를 재현해 근거 수준을 높임 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [3](효과 관찰· 용약 규율 분석), [4](활용 경험))","Microbiome 습열증과 위·장내 미생물 구성의 연관성 습열을 미생물 불균형으로 해석하는 가설을 세움 투여 전후 위액·분변 미생물 구성 변화를 측정하여 ‘습열 해소’를 객관적 지표로 표현할 수 있는지 탐색 (근거 유형: 임상 경험 보고 | 근거: R&D 논리 4 「거시· 미관의 융합」, 참고문헌 [2])"],"ss":{"composition":"그림 1-12 청화음淸化飮의 모듈 구성 ①청열조습淸熱燥濕, 이습화탁利濕化濁 모듈 — 고한苦寒과 방향성 약물을 배합하여 중초의 습열을 분소함 인진 : 청열리습淸熱利濕하고, 춘생春生의 기를 받아 간경에 들어가 상행함 황련 : 청열조습하고 중초의 습열을 직접 다스림 패란 : 방향성으로 중초의 탁한 습기를 일깨워 화해시킴 백두구 : 따뜻하게 비를 덥혀 조습하며 고한한 약재들의 치우침을 제어하는 반좌의 역할을 함 ②건비삼습健脾滲濕, 이기제만理氣除滿 모듈 — 비위를 튼튼히 하고 기기를 소통시켜 습사가 머물지 않게 함 백편두 : 비위를 보하고 습을 화해시키며 비위를 조화롭게 함 의이인 : 습을 삼출시키고 이뇨하며, 비를 돕고 습사를 아래로 배출함 후박 : 화습하고 기를 소통시키며 중초의 그득함을 없앰 ③청열양혈淸熱涼血, 활혈지통活血止痛 모듈 — 혈분을 소통시키고 울체된 열을 식힘 적작약 : 청열양혈하고 어혈을 흩어뜨리며 통증을 멎게 함","master":"①다차원적 종합 진단과 거시·미관의 융합 종합적 관찰과 현대 기술의 접목 : 병과 증, 전체와 국부, 거시와 미관, 기능과 조직, 기체와 환경을 유기적으로 결합하여 종합적으로 살핌. 현대 진단 기술이 포착한 미시적·국부적 병리 변화를 전통 이론으로 재해석하고, 이를 거시적·전체적 변증과 결합하여 치법과 용약을 확정함 외감에서 내상으로의 발전 및 여유입면如油入麵 : 흡연, 음주, 스트레스 등 현대적 내상 요인으로 인한 발병 메커니즘을 확립함. 습과 열이 결합하는 습열상박濕熱相搏 상태는 마치 기름이 밀가루에 스며드는 것과 같아 여유입면如油入麵이라 하여 쉽게 제거되지 않는 난치성을 띰 황니태黃膩苔를 통한 진단 기준 : 비위의 운화 실조로 습열이 훈증하여 나타나는 황니태를 비위습열증 진단의 핵심 지표이자 기준으로 삼음 ②오장상관五臟相關의 연계와 장부 상관성 비위를 중심에 둔 전신 관점 : 비위가 치료의 핵심이지만 엄격한 전체관을 유지함. 병위는 비위에 있으나 간, 담, 장腸과의 관계가 가장 밀접하며, 심, 폐, 신, 방광, 여자포女子胞와도 긴밀한 연관성을 지님 ③허실의 구별과 보사補瀉의 적용 원칙 청화위선淸化爲先, 표본겸치標本兼治 : 습열증은 본질적으로 실증이므로 치료의 원칙은 사법瀉法을 위주로 하되, 비허脾虛로 인해 운화가 안 되어 습이 정체하고 열이 생기는 등 기허, 혈허, 양허, 음허 등이 겸해진 경우 주와 차, 완급을 엄격히 따짐 유연한 보사 활용 : 병증의 양상에 따라 먼저 사할 것인지 먼저 보할 것인지, 혹은 보법과 사법을 번갈아 쓸 것인지, 함께 겸용할 것인지를 신중히 결정함 ④습열의 경중 변별과 한온병용寒溫並用의 방제 철학 습열 경중의 맞춤 대응 : 청열거습이 총칙이지만, 임상에서는 습열병중濕熱竝重, 습중어열濕重於熱, 열중어습熱重於濕의 편차를 엄격히 나누어 그에 따른 가감을 시행함 한온병용과 기기 승강 : 차고 쓴 약재(황련, 인진)와 따뜻하고 매운 약재(후박, 백두구)를 조화시켜 치우침을 막고, 비는 오르고 위는 내리는 승강升降의 추뉴를 회복시켜 중초의 탁한 기운이 맺히고 압박하는 병세를 근본적으로 해소함 ⑤청화음의 임상 변증 가감의 실제 기본 방제와 목적별 가감 : 습열이 병중並重한 양상에 대해 청화음을 기본으로 삼고, 증상에 따라 이비청화理脾淸化, 조기서락調氣舒絡, 산어안신散瘀安神 등의 치법을 유연하게 가미함 세부 가감 열이 심하면 온조溫燥한 후박, 백두구를 빼고, 황련, 지모, 지각 등을 가미 습이 심하면 백편두를 빼고, 창출을 더하여 거습祛濕 습열이 영분營分으로 들어가 동혈動血하면, 서각지황탕을 써서 수우각, 황련 등으로 청열해독하고, 생지황, 목단피, 藏홍화 등으로 산혈양혈散血涼血 위산과다에는 해표소, 용골, 모려를 가미 변비에는 대황, 화마인, 괄루 등을 가미 설사나 변당便溏(묽은 변)에는 선학초, 지유炭을 가미 수면장애나 꿈을 많이 꾸면 야교등이나 합환피를 가미 간울증에는 시호, 향부자, 천련자를 더하고, 기체氣滯에는 목향, 지각, 빈랑을 더하며, 혈어血瘀에는 아출, 단삼, 왕불류행 등을 더하고, 식체食滯에는 맥아, 곡아, 내복자, 계내금, 산사, 신곡 등을 더하며, 위기상역胃氣上逆에는 반하, 죽여, 소경, 선복화 등을 가미 기허에는 당삼, 황기, 백출 등을 더하고, 중기하함中氣下陷에는 승마, 시호, 갈근, 길경을 더하며, 허한虛寒에는 건강, 포강炮薑을 더하고, 위음허胃陰虛에는 옥죽, 사삼 등을 더하며, 비음허脾陰虛에는 산약을 더하고, 신음허腎陰虛에는 황정, 구기자를 가미","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 제품·특허가 없는 경험방으로, 습열형 위염 변증 기준을 표준화하는 연구가 선행되어야 함 참고문헌 [1] 우콴위,류훙,러윈펑.양춘보 노중의의 비위습열증 진료 특징楊春波老中醫診治脾胃濕熱證的特點[J].푸젠중의약대학학보福建中醫學院學報,2007,(5):11-13. [2] 뤄윈펑,천진퇀,양정닝,등.국의대사 양춘보의 ‘비위습열 이론 체계’ 구축 요점國醫大師楊春波“脾胃濕熱理論體系”構建撮要[J].중국중서의결합소화잡지中國中西醫結合消化雜志,2024,32(7):556-559. [3] 왕원룽,후광훙,황헝칭,등.양춘보 교수의 만성 위염 비위습열증 치료 효과 관찰 및 용약 규율 분석楊春波教授治療慢性胃炎脾胃濕熱證的療效觀察及用藥規律分析[C]//중화중의약학회 비위병분회.중화중의약학회 비위병분회 제25회 전국 비위병 학술교류회 논문집中華中醫藥學會脾胃病分會第二十五屆全國脾胃病學術交流會論文彙編.2013:234-242. [4] 황헝칭,뤄윈펑.양춘보의 청화음 활용 경험 사례淸化飮經驗舉隅[C]//중화중의약학회 비위병분회.중화중의약학회 비위병분회 제20회 전국 비위병 학술교류 회 논문집中華中醫藥學會脾胃病分會第二十次全國脾胃病學術交流會論文彙編.2008:465-467."}},{"id":"1-13","ko":"잔위음","hz":"殘胃飮","alias":"","master_ko":"쉬징판","master_hz":"徐景藩","tagline":"화위소비和胃消痞, 강역통어降逆通瘀하여 잔위염殘胃炎의 제반 병증을 치료하는 처방","meta":{"주요 적응증":"위 절제 후 잔위염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":73,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-13 잔위음殘胃飮의 모듈 구성<\/p><h4>①건비익기健脾益氣, 화위소비和胃消痞 모듈 — 비위를 보하고 기기를 소통시켜 비창痞脹을 없앰<\/h4><p><b>백출<\/b>: 건비익기하고 조습화중燥濕和中하며 비위의 운화 기능을 돕고 수습의 정체를 막음<\/p><p><b>백작약<\/b>: 양혈유간養血柔肝하고 완급지통하며 비위를 보조하여 과도한 승산升散을 제어함<\/p><p><b>지각<\/b>: 하기행체下氣行滯하여 위완부의 비창을 해소하며 백출과 배오되어 통보겸시通補兼施의 의미를 나타냄<\/p><h4>②소간리기疏肝理氣, 강역화위降逆和胃 모듈 — 간기울체肝氣鬱滯를 풀고 위기 상역과 담즙 역류를 바로잡음<\/h4><p><b>시호<\/b>: 소간리기疏肝理氣하고 청양淸陽을 끌어올려 기기의 승강升降을 조율함<\/p><p><b>향부자<\/b>: 이기해울理氣解鬱하고 통경지통通經止痛하며 간기울체肝氣鬱滯를 풀어줌<\/p><p><b>도두각<\/b>: 하기화위下氣和胃하고 중초 기체氣滯를 해소함<\/p><p><b>시체<\/b>: 강역지구降逆止嘔하여 위기상역胃氣上逆을 가라앉힘<\/p><h4>③활혈거어活血祛瘀, 청열통락淸熱通絡 모듈 — 수술 후 남은 어혈을 풀고 열을 식혀 통증을 멎게 함<\/h4><p><b>오령지<\/b>: 활혈거어하고 통락지통通絡止痛하며 혈맥의 어체瘀滯와 위완부의 오랜 통증을 다스림<\/p><p><b>석견천石見穿<\/b>: 활혈산어活血散瘀하고 청열행어淸熱行瘀하여 울체된 열을 식히고 위장을 편안하게 함<\/p>"},{"k":"master","t":"쉬징판의 잔위염 치료","html":"<h4>①본허표실本虛標實의 병기 요인과 복합적 발병 메커니즘<\/h4><p><b>중허中虛, 기혈부족氣血不足을 본本으로 하는 발병 근본<\/b>: 위 절제술 후 잔위 용량이 현저히 줄어들고, 수습과 음식물을 소화·부숙하는 기능이 떨어져 기혈 생화의 원천이 고갈됨. 수술 전 난치성 궤양이나 상부 소화관 출혈 등의 오랜 병력, 그리고 수술 자체의 장벌戕伐 및 실혈로 인해 비위가 더욱 허약해지고 기혈이 모두 손상되어 본 병의 근본 원인이 됨. 기허가 오래되면 양허로 이어져 위한胃寒, 파랭怕冷(추위를 탐), 변당便溏(묽은 변) 등의 중양부족 증상이 나타나고, 음허 체질은 수술 후 기음구휴氣陰俱虧로 이행됨<\/p><p><b>기체·혈어·습탁·식체의 표실標實 복합<\/b>: 위부胃腑가 제 기능을 잃어 수곡을 제대로 부숙腐熟하지 못하므로 기기가 불통하고 승강이 실조됨. 수술로 인한 맥락脈絡 손상으로 옛 어혈이 남아 있는 상태에서 새로운 어혈이 더해지며, 소화 기능 저하로 습탁과 식체가 교결交結됨. 여기에 불안, 우울 등의 정서적 요인이나 열화熱化 경향이 겹쳐 어열瘀熱이나 한열협잡寒熱夾雜의 복잡한 표실 증상을 형성함<\/p><h4>②장부 병리와 담위동병膽胃同病 및 간기범위肝氣犯胃 연계<\/h4><p><b>유문 상실과 담즙 역류<\/b>: 위 부분 절제술로 인해 칠충문七衝門 중 유문의 구조적 기능을 상실하여 덤핑 및 담즙 역류가 쉽게 발생함. 간담肝膽의 여유 기운인 담즙이 위기의 상역을 따라 역류하여 구고口苦, 구토, 위내 저류를 일으킴<\/p><p><b>간목승토肝木乘土와 기기 승강의 실조<\/b>: 환자들은 수술 후 질병에 대한 불안과 스트레스로 인해 간기울체가 가중되기 쉬우며, 팽창된 간기가 비위를 침범하여 위기가 내려가지 못하고 오히려 위로 치솟아 구토, 트림, 산을 삼키는 증세를 유발함. 또한 간왕비허肝旺脾虛로 인해 수곡정미를 제대로 포산布散하지 못하여 대변이 무르거나 변비가 생기는 등 간과 비위의 부조화가 심화됨<\/p><h4>③의문팔법醫門八法의 보補·화和·소消 활용 원칙<\/h4><p><b>보법補法의 보불체니補不滯膩와 통보겸시通補兼施<\/b>: 보법을 쓸 때 황기, 백출 등의 보익 약물이 자니滋膩하여 기를 정체시키지 않도록 진피, 지각, 귤피 등의 이기성비理氣醒脾 약물을 배합하여 통보겸시通補兼施를 시행함. 특히 비위허약이 극심하여 탕약이 듣지 않을 때는 내복자萊菔子를 가미하여 보중의 체기를 풀어냄<\/p><p><b>화법和法을 통한 강담화위降膽和胃<\/b>: 시호, 백작약, 반하, 울금 등으로 간담의 기기를 조창하고 위기를 강역降逆하여 담이 아래로 내려가도록 함. 통증과 협통, 구고에는 시호를 쓰고, 흉완비민胸脘痞悶에는 울금을 쓰며, 정향과 시체의 배오로 담즙 역류를 제어함<\/p><p><b>소법消法을 통한 소식화체消食化滯와 활혈거어活血祛瘀<\/b>: 식적에 대해 산사, 신곡, 맥아, 곡아, 계내금 등을 배합하여 화위和胃시키며, 맥아는 소식과 승발升發을 겸하여 특히 유용함. 혈어에 대해서는 단삼, 적작약, 오령지, 석견천, 삼릉, 아출 등을 쓰며, 출혈 경향이 있을 때는 삼칠분과 백급분을 우분호藕粉糊로 복용하여 지혈호막止血護膜함<\/p><h4>④강중우승降中寓升과 승강상인升降相因의 방제 철학<\/h4><p><b>기기 승강의 유기적 조율<\/b>: 승청강탁升淸降濁의 원리에 따라 청양을 띄우는 시호, 향부자와 하기강역하는 지각, 시체, 도두각을 정교하게 배합하여 중초의 기도를 소통시킴<\/p><h4>⑤잔위음의 임상 변증 가감의 실제 및 일상 조섭調攝<\/h4><p class=\"lbl2\">증세 편차별 가감<\/p><p class=\"sub\"><b>습성濕盛<\/b>: 곽향, 패란, 후박 가미<\/p><p class=\"sub\"><b>울열鬱熱<\/b>: 황련, 패모, 포공영 가미<\/p><p class=\"sub\"><b>기혈부족氣血不足<\/b>: 태자삼(또는 당삼+황기), 산약 가미<\/p><p class=\"sub\"><b>음허陰虛<\/b>: 맥문동, 석곡 가미<\/p><p class=\"sub\"><b>식체食滯<\/b>: 계내금, 신곡, 맥아 가미<\/p><p class=\"sub\"><b>구토嘔吐<\/b>: 죽여, 귤피 가미<\/p><p class=\"sub\"><b>혈어血瘀<\/b>: 단삼, 도인, 制대황 가미<\/p><p class=\"sub\"><b>담즙역류膽汁逆流<\/b>: 정향 가미<\/p><p><b>일상 조섭調攝 및 요양 원칙<\/b>: 소량다찬少量多餐의 원칙을 지키고, 음식은 부드럽고 소화가 잘되는 것으로 하며 씹기를 천천히 함. 위완부 보온을 철저히 하고, 누울 때에는 상반신을 약간 높이고 최대한 좌측와左側臥를 취하여 담즙이 소장으로 자연스럽게 내려가도록 유도함. 낮에는 복약 후 좌위나 반앙와위로 잠시 머물러 위기胃氣로 하여금 약력을 운행하게 함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">위 절제 후 잔위염은 국내 위암 수술 환자가 많아 수요가 분명하나 공개자료상 중국 제품이 확인되지 않은 영역이므로, 수술 후 증상 관리 관찰연구로 출발할 수 있음. 국내 공정서(약전·규격집)에 없는 도두각·석견천이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 스러,궈야오자.국의대사 쉬징판의 잔위염 치료 경험國醫大師徐景藩論治殘胃炎經驗[J].중국민간요법中國民間療法,2015,23(12):10-11.<\/li><li class=\"ref\">[2] 저우샤오보.쉬징판의 잔위염증 치료 경험徐景藩論治殘胃炎症經驗[J].후베이중의잡지湖北中醫雜志,1998,20(2):8-10.<\/li><li class=\"ref\">[3] 량치밍.명로중의 쉬징판의 잔위염 변증 치료 경험 채록名老中醫徐景藩辨治殘胃炎經驗拾萃[J].신중의新中醫,1994,(11):1-2.<\/li><li class=\"ref\">[4] 왕제,루웨이민.쉬징판 교수의 보법·화법·소법에 따른 잔위염 치료 경험徐景藩教授補、和、消三法論治殘胃炎經驗[J].저장중의약대학학보浙江中醫藥大學學報,2018,42(6):439-441+445.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"炒백출10g","name":"炒백출","dose":"10g","base":"백출"},{"raw":"炒지각10g","name":"炒지각","dose":"10g","base":"지각"},{"raw":"炒백작약10g","name":"炒백작약","dose":"10g","base":"백작약"},{"raw":"制향부자10g","name":"制향부자","dose":"10g","base":"향부자"},{"raw":"시호6g","name":"시호","dose":"6g","base":"시호"},{"raw":"오령지6g","name":"오령지","dose":"6g","base":"오령지"},{"raw":"석견천石見穿10g","name":"석견천石見穿","dose":"10g","base":"석견천"},{"raw":"도두각刀豆殼15g","name":"도두각刀豆殼","dose":"15g","base":"도두각"},{"raw":"시체柿蒂10g","name":"시체柿蒂","dose":"10g","base":"시체"}],"notes":[],"핵심 효능":["위장을 조화롭게 다스리고 소통시켜 중초의 비만痞滿을 해소함(화위소비和胃消痞)","담즙 역류와 기체혈어의 병태를 다스려 위장의 승강 기능을 회복함(강역통어降逆通瘀)"],"주치증":["잔위염증殘胃炎症. 위완부의 비창痞脹, 은통隱痛, 구고口苦, 납차納差, 핍력乏力 등"],"연구 확장 영역":["잔위염, 위절제술 후 담즙 역류성 위염, 만성 위장관 염증 및 점막 병변, 위기상역 및 기체혈어형 소화기 질환 등"],"R&D 포인트":["백출과 지각의 배오를 통한 통보겸시通補兼施 및 위기능 개선 기전 검증","석견천·오령지 등의 활혈거어 작용에 따른 위점막 미세순환 개선 효과 연구","시체의 강역 작용을 활용한 담즙 역류 억제 가능성 및 위기강역胃氣降逆 조절 효능 분석"]},"modules":[{"name":"①건비익기 · 화위소비","hz":"健脾益氣 · 和胃消痞","herbs":["백출","백작약","지각"],"role":"비위를 보하고 기기를 소통시켜 비창痞脹을 없앰"},{"name":"②소간리기 · 강역화위","hz":"疏肝理氣 · 降逆和胃","herbs":["시호","향부자","도두각","시체"],"role":"간기울체肝氣鬱滯를 풀고 위기 상역과 담즙 역류를 바로잡음"},{"name":"③활혈거어 · 청열통락","hz":"活血祛瘀 · 淸熱通絡","herbs":["오령지","석견천石見穿"],"role":"수술 후 남은 어혈을 풀고 열을 식혀 통증을 멎게 함"}],"rd":[{"tag":"Post-gastrectomy","title":"위 절제 후 잔위염·담즙역류의 증상 개선","html":"<p>위 부분절제 후 유문 기능 상실로 생기는 담즙역류성 잔위염은 표준 치료가 제한적인 영역임<\/p><p>내시경 담즙 역류 점수와 증상 점수를 지표로 한 탐색 임상이 개발 가치가 크며, 수술 방식(Billroth I·II, Roux-en-Y)에 따라 담즙 역류 정도가 다르므로 층화 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1][2][3](잔위염 치료 경험), 본문 주치증)<\/p>"},{"tag":"Anti-reflux Herbs","title":"시체·도두각의 강역 작용 검증","html":"<p>시체柿蒂·도두각刀豆殼은 딸꾹질·구역에 쓰이는 강역 약재이나 담즙 역류를 직접 억제한다는 근거는 없는 가설임<\/p><p>담즙 역류와 위 배출 지연에 대한 효과를 위 배출 검사와 역류 모델로 확인하면 처방의 차별 요소를 설명할 수 있음 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 3 「강중우승과 승강상인」)<\/p>"},{"tag":"Anastomotic Mucosa","title":"문합부 점막 염증과 미세순환 개선","html":"<p>오령지·석견천의 활혈 작용을 수술 부위 점막 미세순환과 염증 개선으로 해석함<\/p><p><b>문합부 점막 조직 소견(염증·위축)을 지표로 효과를 확인 (근거 유형<\/b>: 임상 경험 보고 | 근거: R&amp;D 논리 2 「통보겸시와 활혈거어」, 참고문헌 [4])<\/p>"},{"tag":"Integrative Care","title":"보·화·소 3법에 따른 단계별 가감 표준화","html":"<p>보법·화법·소법의 세 가지 치법으로 정리된 경험을 증상 유형별 가감 규칙으로 표준화함<\/p><p>수술 후 시기(초기·안정기)에 따른 투약 프로토콜로 만드는 것이 임상 적용의 전제 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [4](2018, 보·화·소 3법))<\/p>"}],"logic":[{"n":"1","title":"본허표실本虛標實과 담위동병膽胃同病","body":"중허를 본으로 삼고 유문 상실로 인한 역류를 제어함"},{"n":"2","title":"통보겸시通補兼施와 활혈거어活血祛瘀","body":"기를 보하되 정체되지 않게 하고 수술 부위 어혈을 풂"},{"n":"3","title":"강중우승降中寓升과 승강상인升降相因","body":"내리는 가운데 올림을 품어 기기의 승강을 조율함"},{"n":"4","title":"임상 변증 가감 및 조섭의 원칙","body":"병세 편차에 따른 유연한 가감과 일상 요양의 결합"}],"field":1,"pages":[73,77],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["1-13","잔위음","殘胃飮","","쉬징판","徐景藩","화위소비和胃消痞, 강역통어降逆通瘀하여 잔위염殘胃炎의 제반 병증을 치료하는 처방","炒백출10g 炒지각10g 炒백작약10g 制향부자10g 시호6g 오령지6g 석견천石見穿10g 도두각刀豆殼15g 시체柿蒂10g","","핵심 효능 위장을 조화롭게 다스리고 소통시켜 중초의 비만痞滿을 해소함(화위소비和胃消痞) 담즙 역류와 기체혈어의 병태를 다스려 위장의 승강 기능을 회복함(강역통어降逆通瘀)","주치증 잔위염증殘胃炎症. 위완부의 비창痞脹, 은통隱痛, 구고口苦, 납차納差, 핍력乏力 등","연구 확장 영역 잔위염, 위절제술 후 담즙 역류성 위염, 만성 위장관 염증 및 점막 병변, 위기상역 및 기체혈어형 소화기 질환 등","R&D 포인트 백출과 지각의 배오를 통한 통보겸시通補兼施 및 위기능 개선 기전 검증 석견천·오령지 등의 활혈거어 작용에 따른 위점막 미세순환 개선 효과 연구 시체의 강역 작용을 활용한 담즙 역류 억제 가능성 및 위기강역胃氣降逆 조절 효능 분석","①건비익기 · 화위소비 健脾益氣 · 和胃消痞 백출 백작약 지각 비위를 보하고 기기를 소통시켜 비창痞脹을 없앰","②소간리기 · 강역화위 疏肝理氣 · 降逆和胃 시호 향부자 도두각 시체 간기울체肝氣鬱滯를 풀고 위기 상역과 담즙 역류를 바로잡음","③활혈거어 · 청열통락 活血祛瘀 · 淸熱通絡 오령지 석견천石見穿 수술 후 남은 어혈을 풀고 열을 식혀 통증을 멎게 함","본허표실本虛標實과 담위동병膽胃同病 중허를 본으로 삼고 유문 상실로 인한 역류를 제어함","통보겸시通補兼施와 활혈거어活血祛瘀 기를 보하되 정체되지 않게 하고 수술 부위 어혈을 풂","강중우승降中寓升과 승강상인升降相因 내리는 가운데 올림을 품어 기기의 승강을 조율함","임상 변증 가감 및 조섭의 원칙 병세 편차에 따른 유연한 가감과 일상 요양의 결합","Post-gastrectomy 위 절제 후 잔위염·담즙역류의 증상 개선 위 부분절제 후 유문 기능 상실로 생기는 담즙역류성 잔위염은 표준 치료가 제한적인 영역임 내시경 담즙 역류 점수와 증상 점수를 지표로 한 탐색 임상이 개발 가치가 크며, 수술 방식(Billroth I·II, Roux-en-Y)에 따라 담즙 역류 정도가 다르므로 층화 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1][2][3](잔위염 치료 경험), 본문 주치증)","Anti-reflux Herbs 시체·도두각의 강역 작용 검증 시체柿蒂·도두각刀豆殼은 딸꾹질·구역에 쓰이는 강역 약재이나 담즙 역류를 직접 억제한다는 근거는 없는 가설임 담즙 역류와 위 배출 지연에 대한 효과를 위 배출 검사와 역류 모델로 확인하면 처방의 차별 요소를 설명할 수 있음 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 3 「강중우승과 승강상인」)","Anastomotic Mucosa 문합부 점막 염증과 미세순환 개선 오령지·석견천의 활혈 작용을 수술 부위 점막 미세순환과 염증 개선으로 해석함 문합부 점막 조직 소견(염증·위축)을 지표로 효과를 확인 (근거 유형 : 임상 경험 보고 | 근거: R&D 논리 2 「통보겸시와 활혈거어」, 참고문헌 [4])","Integrative Care 보·화·소 3법에 따른 단계별 가감 표준화 보법·화법·소법의 세 가지 치법으로 정리된 경험을 증상 유형별 가감 규칙으로 표준화함 수술 후 시기(초기·안정기)에 따른 투약 프로토콜로 만드는 것이 임상 적용의 전제 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [4](2018, 보·화·소 3법))"],"ss":{"composition":"그림 1-13 잔위음殘胃飮의 모듈 구성 ①건비익기健脾益氣, 화위소비和胃消痞 모듈 — 비위를 보하고 기기를 소통시켜 비창痞脹을 없앰 백출 : 건비익기하고 조습화중燥濕和中하며 비위의 운화 기능을 돕고 수습의 정체를 막음 백작약 : 양혈유간養血柔肝하고 완급지통하며 비위를 보조하여 과도한 승산升散을 제어함 지각 : 하기행체下氣行滯하여 위완부의 비창을 해소하며 백출과 배오되어 통보겸시通補兼施의 의미를 나타냄 ②소간리기疏肝理氣, 강역화위降逆和胃 모듈 — 간기울체肝氣鬱滯를 풀고 위기 상역과 담즙 역류를 바로잡음 시호 : 소간리기疏肝理氣하고 청양淸陽을 끌어올려 기기의 승강升降을 조율함 향부자 : 이기해울理氣解鬱하고 통경지통通經止痛하며 간기울체肝氣鬱滯를 풀어줌 도두각 : 하기화위下氣和胃하고 중초 기체氣滯를 해소함 시체 : 강역지구降逆止嘔하여 위기상역胃氣上逆을 가라앉힘 ③활혈거어活血祛瘀, 청열통락淸熱通絡 모듈 — 수술 후 남은 어혈을 풀고 열을 식혀 통증을 멎게 함 오령지 : 활혈거어하고 통락지통通絡止痛하며 혈맥의 어체瘀滯와 위완부의 오랜 통증을 다스림 석견천石見穿 : 활혈산어活血散瘀하고 청열행어淸熱行瘀하여 울체된 열을 식히고 위장을 편안하게 함","master":"①본허표실本虛標實의 병기 요인과 복합적 발병 메커니즘 중허中虛, 기혈부족氣血不足을 본本으로 하는 발병 근본 : 위 절제술 후 잔위 용량이 현저히 줄어들고, 수습과 음식물을 소화·부숙하는 기능이 떨어져 기혈 생화의 원천이 고갈됨. 수술 전 난치성 궤양이나 상부 소화관 출혈 등의 오랜 병력, 그리고 수술 자체의 장벌戕伐 및 실혈로 인해 비위가 더욱 허약해지고 기혈이 모두 손상되어 본 병의 근본 원인이 됨. 기허가 오래되면 양허로 이어져 위한胃寒, 파랭怕冷(추위를 탐), 변당便溏(묽은 변) 등의 중양부족 증상이 나타나고, 음허 체질은 수술 후 기음구휴氣陰俱虧로 이행됨 기체·혈어·습탁·식체의 표실標實 복합 : 위부胃腑가 제 기능을 잃어 수곡을 제대로 부숙腐熟하지 못하므로 기기가 불통하고 승강이 실조됨. 수술로 인한 맥락脈絡 손상으로 옛 어혈이 남아 있는 상태에서 새로운 어혈이 더해지며, 소화 기능 저하로 습탁과 식체가 교결交結됨. 여기에 불안, 우울 등의 정서적 요인이나 열화熱化 경향이 겹쳐 어열瘀熱이나 한열협잡寒熱夾雜의 복잡한 표실 증상을 형성함 ②장부 병리와 담위동병膽胃同病 및 간기범위肝氣犯胃 연계 유문 상실과 담즙 역류 : 위 부분 절제술로 인해 칠충문七衝門 중 유문의 구조적 기능을 상실하여 덤핑 및 담즙 역류가 쉽게 발생함. 간담肝膽의 여유 기운인 담즙이 위기의 상역을 따라 역류하여 구고口苦, 구토, 위내 저류를 일으킴 간목승토肝木乘土와 기기 승강의 실조 : 환자들은 수술 후 질병에 대한 불안과 스트레스로 인해 간기울체가 가중되기 쉬우며, 팽창된 간기가 비위를 침범하여 위기가 내려가지 못하고 오히려 위로 치솟아 구토, 트림, 산을 삼키는 증세를 유발함. 또한 간왕비허肝旺脾虛로 인해 수곡정미를 제대로 포산布散하지 못하여 대변이 무르거나 변비가 생기는 등 간과 비위의 부조화가 심화됨 ③의문팔법醫門八法의 보補·화和·소消 활용 원칙 보법補法의 보불체니補不滯膩와 통보겸시通補兼施 : 보법을 쓸 때 황기, 백출 등의 보익 약물이 자니滋膩하여 기를 정체시키지 않도록 진피, 지각, 귤피 등의 이기성비理氣醒脾 약물을 배합하여 통보겸시通補兼施를 시행함. 특히 비위허약이 극심하여 탕약이 듣지 않을 때는 내복자萊菔子를 가미하여 보중의 체기를 풀어냄 화법和法을 통한 강담화위降膽和胃 : 시호, 백작약, 반하, 울금 등으로 간담의 기기를 조창하고 위기를 강역降逆하여 담이 아래로 내려가도록 함. 통증과 협통, 구고에는 시호를 쓰고, 흉완비민胸脘痞悶에는 울금을 쓰며, 정향과 시체의 배오로 담즙 역류를 제어함 소법消法을 통한 소식화체消食化滯와 활혈거어活血祛瘀 : 식적에 대해 산사, 신곡, 맥아, 곡아, 계내금 등을 배합하여 화위和胃시키며, 맥아는 소식과 승발升發을 겸하여 특히 유용함. 혈어에 대해서는 단삼, 적작약, 오령지, 석견천, 삼릉, 아출 등을 쓰며, 출혈 경향이 있을 때는 삼칠분과 백급분을 우분호藕粉糊로 복용하여 지혈호막止血護膜함 ④강중우승降中寓升과 승강상인升降相因의 방제 철학 기기 승강의 유기적 조율 : 승청강탁升淸降濁의 원리에 따라 청양을 띄우는 시호, 향부자와 하기강역하는 지각, 시체, 도두각을 정교하게 배합하여 중초의 기도를 소통시킴 ⑤잔위음의 임상 변증 가감의 실제 및 일상 조섭調攝 증세 편차별 가감 습성濕盛 : 곽향, 패란, 후박 가미 울열鬱熱 : 황련, 패모, 포공영 가미 기혈부족氣血不足 : 태자삼(또는 당삼+황기), 산약 가미 음허陰虛 : 맥문동, 석곡 가미 식체食滯 : 계내금, 신곡, 맥아 가미 구토嘔吐 : 죽여, 귤피 가미 혈어血瘀 : 단삼, 도인, 制대황 가미 담즙역류膽汁逆流 : 정향 가미 일상 조섭調攝 및 요양 원칙 : 소량다찬少量多餐의 원칙을 지키고, 음식은 부드럽고 소화가 잘되는 것으로 하며 씹기를 천천히 함. 위완부 보온을 철저히 하고, 누울 때에는 상반신을 약간 높이고 최대한 좌측와左側臥를 취하여 담즙이 소장으로 자연스럽게 내려가도록 유도함. 낮에는 복약 후 좌위나 반앙와위로 잠시 머물러 위기胃氣로 하여금 약력을 운행하게 함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 위 절제 후 잔위염은 국내 위암 수술 환자가 많아 수요가 분명하나 공개자료상 중국 제품이 확인되지 않은 영역이므로, 수술 후 증상 관리 관찰연구로 출발할 수 있음. 국내 공정서(약전·규격집)에 없는 도두각·석견천이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 스러,궈야오자.국의대사 쉬징판의 잔위염 치료 경험國醫大師徐景藩論治殘胃炎經驗[J].중국민간요법中國民間療法,2015,23(12):10-11. [2] 저우샤오보.쉬징판의 잔위염증 치료 경험徐景藩論治殘胃炎症經驗[J].후베이중의잡지湖北中醫雜志,1998,20(2):8-10. [3] 량치밍.명로중의 쉬징판의 잔위염 변증 치료 경험 채록名老中醫徐景藩辨治殘胃炎經驗拾萃[J].신중의新中醫,1994,(11):1-2. [4] 왕제,루웨이민.쉬징판 교수의 보법·화법·소법에 따른 잔위염 치료 경험徐景藩教授補、和、消三法論治殘胃炎經驗[J].저장중의약대학학보浙江中醫藥大學學報,2018,42(6):439-441+445."}},{"id":"1-14","ko":"소화복녕탕","hz":"消化復寧湯","alias":"","master_ko":"쉬징스","master_hz":"徐經世","tagline":"소간리기疏肝理氣, 조리비위調理脾胃하여 담낭염, 담석증 등 담膽의 제반 병증을 치료하는 처방","meta":{"주요 적응증":"담낭염, 담석증, 담즙역류성 위염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":78,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-14 소화복녕탕消化復寧湯의 모듈 구성<\/p><h4>①소간화해疏肝和解, 이기지통理氣止痛 모듈 — 울결된 간담의 기기를 소통시키고 흉협부의 통증을 완화함<\/h4><p><b>시호, 황금<\/b>: 소양경으로 들어가 화해소양和解少陽하며 간담의 울체된 열을 식힘<\/p><p><b>울금, 연호색, 지각<\/b>: 함께 배오되어 소리간담疏利肝膽하고 흉협부의 기체氣滯 통증을 다스림<\/p><h4>②유간안중柔肝安中, 화위강역和胃降逆 모듈 — 간을 부드럽게 하고 중초를 안정시키며 위기를 아래로 내림<\/h4><p><b>백작약<\/b>: 간을 유윤柔潤하게 하고 완급지통緩急止痛하며 시호·지각과 배오되어 조간리기調肝理氣함<\/p><p><b>죽여<\/b>: 청열화담淸熱化痰하고 화위강역和胃降逆하며 위기胃氣의 상역을 다스림<\/p><h4>③건비조습健脾燥濕, 청열리습淸熱利濕 모듈 — 중초의 습탁을 말리고 열을 소변으로 배출하여 비위 기능을 바로잡음<\/h4><p><b>창출<\/b>: 건비조습健脾燥濕하며 중초의 습탁조체濕濁阻滯를 제거함<\/p><p><b>차전초<\/b>: 청열리습淸熱利濕하여 습열사기를 소변으로 하행 배출시킴<\/p><h4>④화식소적化食消積, 청열해독淸熱解毒 모듈 — 식적을 제거하고 담부의 염증성 울열을 해소함<\/h4><p><b>산사, 곡아, 맥아<\/b>: 화식소적化食消積하여 위장관의 정체된 음식물을 소화시킴<\/p><p><b>포공영<\/b>: 청열해독, 이습통림利濕通淋하며 담부膽腑의 열독을 꺼줌<\/p>"},{"k":"master","t":"쉬징스의 간담 질환 치료","html":"<h4>①병인병기 이론 — 간담울열肝膽鬱熱과 비위허한脾胃虛寒<\/h4><p><b>‘울鬱’이 핵심 병기<\/b>: 간담질환의 병리 변화는 기체氣滯에서 시작하여 울결鬱結, 혈어血瘀, 어적瘀積으로 진행되며, 따라서 “울을 치료할 때는 먼저 기를 치료”하는 것을 중시<\/p><p><b>간담소설肝膽疏泄과 비위승강脾胃升降의 상관성을 중시<\/b>: 간은 소설을 주관하고 담은 담즙을 저장·배설하며, 간담의 정상적인 소설기능은 비위의 운화와 승강에도 영향을 미침. 간담의 소설기능이 실조되면 담즙 배설이 원활하지 못하고 비위의 운화·승강에도 장애 발생<\/p><p><b>간담울열의 형성<\/b>: 간기가 울체되면 기기불창이 발생하고, 울체가 오래되면 울이화열鬱而化熱하여 간담울열로 발전함. 여기에 음식부절, 기름진 음식, 음주, 비위기능 실조 등이 더해지면 담즙울체와 습탁이 발생하고, 습이 오래되면 열로 변화하여 담즙이 농축되고 담석으로 발전<\/p><p><b>비위허한의 형성<\/b>: 간담의 병변은 비위의 운화기능을 손상시키며, 반대로 비위의 운화실조도 간담의 소설기능에 영향을 줌. 따라서 “목승토위木乘土位”와 “토옹목울土壅木鬱”의 상호작용 속에서 간담울열과 비위허한의 병리가 형성<\/p><p><b>간담과 위의 승강관계<\/b>: 담은 위와 상호 연계되어 승강기능을 유지하므로, 담기불창은 위기불강胃氣不降을 초래하고, 반대로 위기불강도 담즙의 정상적인 배설을 방해함. 이로 인해 완협창통脘脇脹痛, 애기탄산噯氣吞酸, 구고口苦, 납매納呆(식욕부진) 등의 증상이 나타남<\/p><h4>②치법 — 소간리기疏肝理氣와 조리비위調理脾胃<\/h4><p>기본 치료원칙은 소간리기疏肝理氣, 조리비위調理脾胃로, 간담의 기기를 소통시키면서 비위의 운화運化와 승강升降을 함께 조절<\/p><p><b>조화간담調和肝膽<\/b>: 간담기체肝膽氣滯를 소통시켜 간담의 소설과 담즙 배설을 회복<\/p><p><b>건비화습健脾化濕, 화위和胃<\/b>: 비위의 운화를 회복하여 습탁濕濁의 생성을 줄이고 간담의 소설기능을 보조<\/p><p><b>화습청열化濕淸熱<\/b>: 습탁과 간담울열이 동반될 때 습을 제거하고 울열을 청해하여 간담과 비위의 기능을 함께 조절<\/p><p><b>화위강역和胃降逆<\/b>: 위기상역胃氣上逆과 담즙역류가 나타날 때, 위기의 하강을 회복하여 승강실상을 바로잡음<\/p><h4>③임상 증상에 따른 소화복녕탕의 가감<\/h4><p><b>습탁중조濕濁中阻, 완민납매脘悶納呆(명치 답답함·식욕부진)<\/b>: 후박화厚朴花, 녹매화綠梅花, 건곡建曲을 가미하여 화습건비化濕健脾, 이기화위理氣和胃<\/p><p><b>습열식체濕熱食滯, 대변불통大便不通<\/b>: 대황, 포공영을 가미하여 청열도체淸熱導滯, 통부창중通腑暢中<\/p><p><b>간기범위肝氣犯胃, 애기탄산噯氣吞酸<\/b>: 法반하, 대자석, 오적골을 가미하여 강역지산降逆止酸<\/p><p><b>담즙역류, 구범고수口泛苦水<\/b>: 갈근, 대자석, 황련을 가미하여 진역화위鎭逆和胃, 순기리담順氣利膽<\/p><p><b>황달<\/b>: 인진을 가미하여 청리습열淸利濕熱, 이담퇴황利膽退黃<\/p><p><b>음허진휴陰虛津虧, 설홍소태舌紅少苔<\/b>: 석곡을 가미하여 익위양음益胃養陰<\/p><p><b>담석<\/b>: 침향, 현명분玄明粉을 가미하여 이기리담理氣利膽, 연견배석軟堅排石<\/p><h4>④용약 특징 — 한열·보사의 조화<\/h4><p>대사는 간담울열肝膽鬱熱과 비위허한脾胃虛寒이 공존하는 병리를 고려하여 “온이불조溫而不燥, 양이불한涼而不寒, 보이불체補而不滯, 자이불니滋而不膩”를 중시<\/p><p>즉 한열寒熱·보사補瀉·조윤燥潤의 균형을 유지하여 간담의 울열은 해소하면서도 비위의 허한을 손상시키지 않는 것을 용약의 특징으로 함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">대사 명의의 특허는 체질 조리용 조성물 위주로 이 처방과 무관하며, 담즙역류성 위염 대상 국내 연구도 검색되지 않아 신규 연구 주제로 활용 가능<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 타오융.쉬징스의 소화복녕탕을 활용한 담위병 치료 경험徐經世運用消化復寧湯治療膽胃病的經驗[J].안후이중의임상잡지安徽中醫臨床雜志,2000,(3):217-218.<\/li><li class=\"ref\">[2] 정융페이,장리,리융판,등.쉬징스의 ‘간담울열, 비위허한’ 학술 경험 요점徐經世“肝膽鬱熱,脾胃虛寒”學術經驗舉要[J].중의약임상잡지中醫藥臨床雜志,2012,24(8):699-701.<\/li><li class=\"ref\">[3] 쑨위제,스웨이빙,황후이.국의대사 쉬징스의 소화복녕탕을 활용한 만성 담낭염 치료 경험國醫大師徐經世以消化復寧湯治療慢性膽囊炎經驗[J].시진국의국 약時珍國醫國藥,2024,35(13):3054-3057.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"죽여5~10g","name":"죽여","dose":"5~10g","base":"죽여"},{"raw":"창출10~15g","name":"창출","dose":"10~15g","base":"창출"},{"raw":"시호5~10g","name":"시호","dose":"5~10g","base":"시호"},{"raw":"황금6~9g","name":"황금","dose":"6~9g","base":"황금"},{"raw":"지각10~15g","name":"지각","dose":"10~15g","base":"지각"},{"raw":"울금10~15g","name":"울금","dose":"10~15g","base":"울금"},{"raw":"연호색10~15g","name":"연호색","dose":"10~15g","base":"연호색"},{"raw":"백작약20~30g","name":"백작약","dose":"20~30g","base":"백작약"},{"raw":"산사10~15g","name":"산사","dose":"10~15g","base":"산사"},{"raw":"포공영15~20g","name":"포공영","dose":"15~20g","base":"포공영"},{"raw":"차전초10~20g","name":"차전초","dose":"10~20g","base":"차전초"},{"raw":"곡아15~25g","name":"곡아","dose":"15~25g","base":"곡아"},{"raw":"맥아15~25g","name":"맥아","dose":"15~25g","base":"맥아"}],"notes":[],"핵심 효능":["흉완부를 편안하게 하고 기를 소통시킴(관중이기寬中理氣)","간과 담을 조화롭게 다스림(조화간담調和肝膽)","비위를 튼튼하게 하고 위를 화평하게 함(건비화위健脾和胃)","승강의 균형을 맞춤(평형승강平衡升降)"],"주치증":["급·만성 담낭염, 담석증 및 담즙 역류성 위염 등"],"연구 확장 영역":["담낭염, 담석증, 담즙 역류성 위염, 간담습열肝膽濕熱 및 비위허한脾胃虛寒의 소화기 질환"],"R&D 포인트":["죽여의 상초 및 중초 조화 작용에 따른 위기 수납 및 신경정신-소화축 조절 효능 분석","시호와 황금 배오를 통한 소양화해少陽和解 및 간담 소리疏利 기전 검증","창출, 죽여, 차전초 배오에 따른 중초 습열 제거 및 위장 미세순환·소화 기능 개선 효과 연구","담즙 역류 가감 시 갈근과 대자석 배오를 활용한 위기진역胃氣鎭逆 및 담즙 역류 제어 효능 분석"]},"modules":[{"name":"①소간화해 · 이기지통","hz":"疏肝和解 · 理氣止痛","herbs":["시호","황금","울금","연호색","지각"],"role":"울결된 간담의 기기를 소통시키고 흉협부의 통증을 완화함"},{"name":"②유간안중 · 화위강역","hz":"柔肝安中 · 和胃降逆","herbs":["백작약","죽여"],"role":"간을 부드럽게 하고 중초를 안정시키며 위기를 아래로 내림"},{"name":"③건비조습 · 청열리습","hz":"健脾燥濕 · 淸熱利濕","herbs":["창출","차전초"],"role":"중초의 습탁을 말리고 열을 소변으로 배출하여 비위 기능을 바로잡음"},{"name":"④화식소적 · 청열해독","hz":"化食消積 · 淸熱解毒","herbs":["산사","곡아","맥아","포공영"],"role":"식적을 제거하고 담부의 염증성 울열을 해소함"}],"rd":[{"tag":"Chronic Cholecystitis","title":"만성 담낭염의 증상·염증 지표 개선","html":"<p>만성 담낭염 치료 경험이 가장 최근(2024)에 정리되었음 우상복부 통증과 소화불량 증상, 초음파 담낭벽 두께, 염증 지표를 평가하는 전향적 관찰 연구로 시작하되, 수술이 필요한 담석·급성 담낭염 환자는 제외 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](2024, 만성 담낭염 치료 경험))<\/p>"},{"tag":"Choleresis","title":"시호·황금·울금 배합의 이담 작용 검증","html":"<p>소양화해(시호·황금)와 울금·연호색 배합이 담즙 분비와 담낭 수축에 미치는 영향을 담즙 유량·담즙산 조성으로 측정함<\/p><p>이담제(우르소데옥시콜산)와 비교 가능한 지표를 확보(이담 작용은 담석 소실과 다른 효과이므로 혼동하지 않음) (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「소양화해와 간담소리」, 본문 조성표)<\/p>"},{"tag":"Bile Reflux Gastritis","title":"담즙역류성 위염 적응증 검증","html":"<p>주치에 담즙역류성 위염이 포함되어 있음<\/p><p>담즙산 유도 위점막 손상 모델과 임상 내시경 소견으로 담–위 동시 치료 효과를 확인 (근거 유형: 임상 경험 보고 | 근거: 본문 주치증, 참고문헌 [1](담위병 치료 경험))<\/p>"},{"tag":"Mixed Pattern","title":"‘간담울열 + 비위허한’ 병존 환자군의 정의","html":"<p>열과 허한이 함께 있는 병기를 임상에서 재현하려면 환자 선별 기준이 필요함<\/p><p><b>증상<\/b> ·설맥 정보를 구조화한 선별 도구를 먼저 만들고 그 집단에서 처방 반응성을 평가 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](간담울열·비위허한 학술 경험))<\/p>"}],"logic":[{"n":"1","title":"간담울열肝膽鬱熱과 비위허한脾胃虛寒","body":"간담의 울체와 비위의 허한이 공존함"},{"n":"2","title":"소양화해少陽和解와 간담소리疏利","body":"시호와 황금의 배오를 통한 간담 기기 조율"},{"n":"3","title":"건비조습健脾燥濕과 청열리습淸熱利濕","body":"중초의 습탁을 제거하고 열을 소변으로 배출"},{"n":"4","title":"한열보사寒熱補瀉의 조화와 승강평형升降平衡","body":"차고 더운 성질과 보사의 균형 유지"}],"field":1,"pages":[78,82],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["1-14","소화복녕탕","消化復寧湯","","쉬징스","徐經世","소간리기疏肝理氣, 조리비위調理脾胃하여 담낭염, 담석증 등 담膽의 제반 병증을 치료하는 처방","죽여5~10g 창출10~15g 시호5~10g 황금6~9g 지각10~15g 울금10~15g 연호색10~15g 백작약20~30g 산사10~15g 포공영15~20g 차전초10~20g 곡아15~25g 맥아15~25g","","핵심 효능 흉완부를 편안하게 하고 기를 소통시킴(관중이기寬中理氣) 간과 담을 조화롭게 다스림(조화간담調和肝膽) 비위를 튼튼하게 하고 위를 화평하게 함(건비화위健脾和胃) 승강의 균형을 맞춤(평형승강平衡升降)","주치증 급·만성 담낭염, 담석증 및 담즙 역류성 위염 등","연구 확장 영역 담낭염, 담석증, 담즙 역류성 위염, 간담습열肝膽濕熱 및 비위허한脾胃虛寒의 소화기 질환","R&D 포인트 죽여의 상초 및 중초 조화 작용에 따른 위기 수납 및 신경정신-소화축 조절 효능 분석 시호와 황금 배오를 통한 소양화해少陽和解 및 간담 소리疏利 기전 검증 창출, 죽여, 차전초 배오에 따른 중초 습열 제거 및 위장 미세순환·소화 기능 개선 효과 연구 담즙 역류 가감 시 갈근과 대자석 배오를 활용한 위기진역胃氣鎭逆 및 담즙 역류 제어 효능 분석","①소간화해 · 이기지통 疏肝和解 · 理氣止痛 시호 황금 울금 연호색 지각 울결된 간담의 기기를 소통시키고 흉협부의 통증을 완화함","②유간안중 · 화위강역 柔肝安中 · 和胃降逆 백작약 죽여 간을 부드럽게 하고 중초를 안정시키며 위기를 아래로 내림","③건비조습 · 청열리습 健脾燥濕 · 淸熱利濕 창출 차전초 중초의 습탁을 말리고 열을 소변으로 배출하여 비위 기능을 바로잡음","④화식소적 · 청열해독 化食消積 · 淸熱解毒 산사 곡아 맥아 포공영 식적을 제거하고 담부의 염증성 울열을 해소함","간담울열肝膽鬱熱과 비위허한脾胃虛寒 간담의 울체와 비위의 허한이 공존함","소양화해少陽和解와 간담소리疏利 시호와 황금의 배오를 통한 간담 기기 조율","건비조습健脾燥濕과 청열리습淸熱利濕 중초의 습탁을 제거하고 열을 소변으로 배출","한열보사寒熱補瀉의 조화와 승강평형升降平衡 차고 더운 성질과 보사의 균형 유지","Chronic Cholecystitis 만성 담낭염의 증상·염증 지표 개선 만성 담낭염 치료 경험이 가장 최근(2024)에 정리되었음 우상복부 통증과 소화불량 증상, 초음파 담낭벽 두께, 염증 지표를 평가하는 전향적 관찰 연구로 시작하되, 수술이 필요한 담석·급성 담낭염 환자는 제외 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [3](2024, 만성 담낭염 치료 경험))","Choleresis 시호·황금·울금 배합의 이담 작용 검증 소양화해(시호·황금)와 울금·연호색 배합이 담즙 분비와 담낭 수축에 미치는 영향을 담즙 유량·담즙산 조성으로 측정함 이담제(우르소데옥시콜산)와 비교 가능한 지표를 확보(이담 작용은 담석 소실과 다른 효과이므로 혼동하지 않음) (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「소양화해와 간담소리」, 본문 조성표)","Bile Reflux Gastritis 담즙역류성 위염 적응증 검증 주치에 담즙역류성 위염이 포함되어 있음 담즙산 유도 위점막 손상 모델과 임상 내시경 소견으로 담–위 동시 치료 효과를 확인 (근거 유형: 임상 경험 보고 | 근거: 본문 주치증, 참고문헌 [1](담위병 치료 경험))","Mixed Pattern ‘간담울열 + 비위허한’ 병존 환자군의 정의 열과 허한이 함께 있는 병기를 임상에서 재현하려면 환자 선별 기준이 필요함 증상 ·설맥 정보를 구조화한 선별 도구를 먼저 만들고 그 집단에서 처방 반응성을 평가 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](간담울열·비위허한 학술 경험))"],"ss":{"composition":"그림 1-14 소화복녕탕消化復寧湯의 모듈 구성 ①소간화해疏肝和解, 이기지통理氣止痛 모듈 — 울결된 간담의 기기를 소통시키고 흉협부의 통증을 완화함 시호, 황금 : 소양경으로 들어가 화해소양和解少陽하며 간담의 울체된 열을 식힘 울금, 연호색, 지각 : 함께 배오되어 소리간담疏利肝膽하고 흉협부의 기체氣滯 통증을 다스림 ②유간안중柔肝安中, 화위강역和胃降逆 모듈 — 간을 부드럽게 하고 중초를 안정시키며 위기를 아래로 내림 백작약 : 간을 유윤柔潤하게 하고 완급지통緩急止痛하며 시호·지각과 배오되어 조간리기調肝理氣함 죽여 : 청열화담淸熱化痰하고 화위강역和胃降逆하며 위기胃氣의 상역을 다스림 ③건비조습健脾燥濕, 청열리습淸熱利濕 모듈 — 중초의 습탁을 말리고 열을 소변으로 배출하여 비위 기능을 바로잡음 창출 : 건비조습健脾燥濕하며 중초의 습탁조체濕濁阻滯를 제거함 차전초 : 청열리습淸熱利濕하여 습열사기를 소변으로 하행 배출시킴 ④화식소적化食消積, 청열해독淸熱解毒 모듈 — 식적을 제거하고 담부의 염증성 울열을 해소함 산사, 곡아, 맥아 : 화식소적化食消積하여 위장관의 정체된 음식물을 소화시킴 포공영 : 청열해독, 이습통림利濕通淋하며 담부膽腑의 열독을 꺼줌","master":"①병인병기 이론 — 간담울열肝膽鬱熱과 비위허한脾胃虛寒 ‘울鬱’이 핵심 병기 : 간담질환의 병리 변화는 기체氣滯에서 시작하여 울결鬱結, 혈어血瘀, 어적瘀積으로 진행되며, 따라서 “울을 치료할 때는 먼저 기를 치료”하는 것을 중시 간담소설肝膽疏泄과 비위승강脾胃升降의 상관성을 중시 : 간은 소설을 주관하고 담은 담즙을 저장·배설하며, 간담의 정상적인 소설기능은 비위의 운화와 승강에도 영향을 미침. 간담의 소설기능이 실조되면 담즙 배설이 원활하지 못하고 비위의 운화·승강에도 장애 발생 간담울열의 형성 : 간기가 울체되면 기기불창이 발생하고, 울체가 오래되면 울이화열鬱而化熱하여 간담울열로 발전함. 여기에 음식부절, 기름진 음식, 음주, 비위기능 실조 등이 더해지면 담즙울체와 습탁이 발생하고, 습이 오래되면 열로 변화하여 담즙이 농축되고 담석으로 발전 비위허한의 형성 : 간담의 병변은 비위의 운화기능을 손상시키며, 반대로 비위의 운화실조도 간담의 소설기능에 영향을 줌. 따라서 “목승토위木乘土位”와 “토옹목울土壅木鬱”의 상호작용 속에서 간담울열과 비위허한의 병리가 형성 간담과 위의 승강관계 : 담은 위와 상호 연계되어 승강기능을 유지하므로, 담기불창은 위기불강胃氣不降을 초래하고, 반대로 위기불강도 담즙의 정상적인 배설을 방해함. 이로 인해 완협창통脘脇脹痛, 애기탄산噯氣吞酸, 구고口苦, 납매納呆(식욕부진) 등의 증상이 나타남 ②치법 — 소간리기疏肝理氣와 조리비위調理脾胃 기본 치료원칙은 소간리기疏肝理氣, 조리비위調理脾胃로, 간담의 기기를 소통시키면서 비위의 운화運化와 승강升降을 함께 조절 조화간담調和肝膽 : 간담기체肝膽氣滯를 소통시켜 간담의 소설과 담즙 배설을 회복 건비화습健脾化濕, 화위和胃 : 비위의 운화를 회복하여 습탁濕濁의 생성을 줄이고 간담의 소설기능을 보조 화습청열化濕淸熱 : 습탁과 간담울열이 동반될 때 습을 제거하고 울열을 청해하여 간담과 비위의 기능을 함께 조절 화위강역和胃降逆 : 위기상역胃氣上逆과 담즙역류가 나타날 때, 위기의 하강을 회복하여 승강실상을 바로잡음 ③임상 증상에 따른 소화복녕탕의 가감 습탁중조濕濁中阻, 완민납매脘悶納呆(명치 답답함·식욕부진) : 후박화厚朴花, 녹매화綠梅花, 건곡建曲을 가미하여 화습건비化濕健脾, 이기화위理氣和胃 습열식체濕熱食滯, 대변불통大便不通 : 대황, 포공영을 가미하여 청열도체淸熱導滯, 통부창중通腑暢中 간기범위肝氣犯胃, 애기탄산噯氣吞酸 : 法반하, 대자석, 오적골을 가미하여 강역지산降逆止酸 담즙역류, 구범고수口泛苦水 : 갈근, 대자석, 황련을 가미하여 진역화위鎭逆和胃, 순기리담順氣利膽 황달 : 인진을 가미하여 청리습열淸利濕熱, 이담퇴황利膽退黃 음허진휴陰虛津虧, 설홍소태舌紅少苔 : 석곡을 가미하여 익위양음益胃養陰 담석 : 침향, 현명분玄明粉을 가미하여 이기리담理氣利膽, 연견배석軟堅排石 ④용약 특징 — 한열·보사의 조화 대사는 간담울열肝膽鬱熱과 비위허한脾胃虛寒이 공존하는 병리를 고려하여 “온이불조溫而不燥, 양이불한涼而不寒, 보이불체補而不滯, 자이불니滋而不膩”를 중시 즉 한열寒熱·보사補瀉·조윤燥潤의 균형을 유지하여 간담의 울열은 해소하면서도 비위의 허한을 손상시키지 않는 것을 용약의 특징으로 함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 대사 명의의 특허는 체질 조리용 조성물 위주로 이 처방과 무관하며, 담즙역류성 위염 대상 국내 연구도 검색되지 않아 신규 연구 주제로 활용 가능 참고문헌 [1] 타오융.쉬징스의 소화복녕탕을 활용한 담위병 치료 경험徐經世運用消化復寧湯治療膽胃病的經驗[J].안후이중의임상잡지安徽中醫臨床雜志,2000,(3):217-218. [2] 정융페이,장리,리융판,등.쉬징스의 ‘간담울열, 비위허한’ 학술 경험 요점徐經世“肝膽鬱熱,脾胃虛寒”學術經驗舉要[J].중의약임상잡지中醫藥臨床雜志,2012,24(8):699-701. [3] 쑨위제,스웨이빙,황후이.국의대사 쉬징스의 소화복녕탕을 활용한 만성 담낭염 치료 경험國醫大師徐經世以消化復寧湯治療慢性膽囊炎經驗[J].시진국의국 약時珍國醫國藥,2024,35(13):3054-3057."}},{"id":"2-1","ko":"익신견비환","hz":"益腎蠲痹丸","alias":"","master_ko":"주량춘","master_hz":"朱良春","tagline":"익신장독益腎壯督과 충류약蟲類藥을 활용한 수풍척사搜風剔邪, 견비통락蠲痹通絡으로 완비頑痹를 치료하는 처방","meta":{"주요 적응증":"류마티스 관절염 등 완비頑痹","확인된 연구자료 유형":"연구 축적 (논문 110편)","제형·제품화":"익신견비환 (중성약, 20미)"},"page":84,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-1 익신견비환益腎蠲痹丸의 모듈 구성<\/p><h4>①익신양음益腎養陰, 보신장골補腎壯骨 모듈 — 근본을 다스려 뼈와 신장을 보함<\/h4><p><b>생지황, 숙지황, 음양곽, 골쇄보<\/b>: 생지황과 숙지황은 신정을 보하고, 음양곽과 골쇄보는 신양을 보하며 근골을 강화하여, 신허를 보완하고 근골을 튼튼하게 함<\/p><h4>②보혈활혈補血活血, 거풍통락祛風通絡 모듈 — 기혈을 소통시키고 경락의 풍습을 제거함<\/h4><p>당귀, 계혈등, 연호색, 토별충, 포천산갑, 심골풍, 노관초, 서장경, 호장, 율초, 녹함초: 당귀·계혈등은 혈을 보하고 혈행을 원활하게 하며, 연호색·토별충·포천산갑은 어혈을 풀고 경락을 소통시켜 통증을 다스림. 심골풍·노관초·서장경· 호장·율초·녹함초는 풍습을 제거하고 경락을 소통시켜 비증을 해소함<\/p><h4>③수풍척사搜風剔邪, 견비통락蠲痹通絡 모듈 — 충류 약의 특성을 활용하여 깊숙이 침입한 사기를 찾아내 제거함<\/h4><p><b>전갈, 강잠, 오공, 지룡, 노봉방, 오초사<\/b>: 생체 활성 물질이 풍부한 혈육유정血肉有情의 충류약으로, 수풍척사, 견비통락의 작용을 하여 깊숙이 침입한 사기를 찾아내 제거함<\/p>"},{"k":"master","t":"주량춘의 완비頑痹 치료","html":"<h4>①완비頑痹의 병인병기 이론<\/h4><p><b>질환의 범주와 특징<\/b>: 류마티스 관절염, 강직성 척추염 등 만성 난치성 비증을 ‘완비頑痹’로 규정함. 일반 비증과 달리 병정이 길고 반복되며 통증·종창·강직 등이 지속되고, 병사가 경락을 넘어 근골과 관절 깊숙이 침입한다고 봄<\/p><p><b>‘사구四久’를 핵심 병기로 제시<\/b>: “구통입락久痛入絡, 구통다어久痛多瘀, 구병다허久病多虛, 구필급신久必及腎”을 완비의 병리적 특징으로 봄. 오래된 통증은 낙맥으로 깊어지고 어혈이 생기며, 장기간의 질병은 기혈을 소모하여 허증을 초래하고, 결국 간신肝腎에 영향을 미친다고 인식함<\/p><p><b>정허사련正虛邪戀과 허실착잡<\/b>: 정기正氣가 부족한 상태에서 풍風, 한寒, 습濕, 열熱 등의 외사가 침입하여 경락을 막고, 습이 오래되면 담이 되고, 혈행이 막히면 어혈이 형성되어 담어痰瘀가 관절에 유착함. 따라서 정허正虛와 사실邪實이 함께 존재하는 병증으로 봄<\/p><h4>②익신장독益腎壯督, 견비통락蠲痹通絡의 치료 원칙<\/h4><p><b>익신장독益腎壯督으로 본本을 치료<\/b>: 만성 완비는 오래될수록 신腎과 양기陽氣가 손상된다고 보아 신을 보하고 독맥을 튼튼하게 하여 양기를 북돋우는 것을 치료의 근본으로 삼음<\/p><p><b>견비통락蠲痹通絡으로 표標를 치료<\/b>: 풍한습 등의 외사와 담어痰瘀로 막힌 경락을 소통시켜 통증과 종창을 제거함. 즉 익신장독과 견비통락을 병행하여 본허표실本虛標實을 함께 치료함<\/p><p><b>표본동치標本同治, 공보겸시攻補兼施<\/b>: 거사祛邪에만 치우치거나 보익補益에만 치우치지 않고, 보신과 거사, 통락과 보익을 함께 시행하는 것을 중시함<\/p><h4>③완비의 주요 증후에 대한 변증<\/h4><p><b>통증의 변증<\/b>: 풍風·한寒·습濕·열熱 및 어혈瘀血의 병리적 특성에 따라 통증의 성질을 구별하여 치료함<\/p><p><b>종창의 병리 변화<\/b>: 초기에는 습濕이 주가 되고, 병정이 진행되면 담痰이 형성되며, 오래된 완비에서는 담어痰瘀가 결합하여 관절에 유착한다고 봄<\/p><p><b>강직僵直과 구련拘攣<\/b>: 관절의 강직과 구련은 신독허약腎督虛弱과 담어痰瘀가 경락과 관절을 막은 결과로 보고, 담어를 제거하고 경락을 소통시키는 치료를 중시함<\/p><p><b>열비熱痹의 한온병용寒溫並用<\/b>: 열비라고 하여 고한苦寒 약만 사용하는 것을 경계함. 만성 완비에서는 양기陽氣가 허할 수 있으므로 청열하면서 적절한 온양약을 배합함<\/p><h4>④충류약蟲類藥을 활용한 견비통락<\/h4><p><b>완고한 사기의 수척搜剔<\/b>: 만성 완비에서는 사기가 경락과 관절 깊숙이 들어가므로 전갈·지룡·오공·토별충·강잠·노봉방 등의 충류약을 활용하여 깊숙이 침입한 사기를 수척하고 경락을 통하게 함<\/p><p><b>충류약과 초목약의 배합<\/b>: 충류약의 강한 거풍·통락·파어 작용에 보익약을 배합하여 정기 손상을 방지하고 공보攻補를 함께 시행함<\/p><h4>⑤변증辨證과 변병辨病의 결합<\/h4><p><b>변증과 변병의 결합<\/b>: 중의학적 증후뿐 아니라 질병명·병정·임상증상 및 검사 결과를 함께 고려하여 치료함. ‘병’과 ‘증’을 상호보완적으로 활용하여 진단과 치료의 정확성을 높임<\/p><p><b>변병용약辨病用藥<\/b>: 류마티스 관절염, 강직성 척추염 등 질환의 특성과 병정에 따라 약물 선택을 조절하고 적혈구침강속도(ESR)·C반응성단백(CRP)·류마티스인자(RF) 등의 검사 결과도 치료 판단에 참고함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모 및 정량적 위상<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 110 편 발표<\/td><td>최근 5 년간 20편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">신허형腎虛型 류마티스 관절염<\/span> <span class=\"kw\">강직성 척추염<\/span> <span class=\"kw\">무릎 골관절염<\/span> <span class=\"kw\">골다공증<\/span><\/td><td>류마티스 및 골관절계 질환 관리에 집중하며, 보신통락법補腎通絡法 기반의 뼈 파괴 억제 및 난치성 류마티스 질환 보조 치료 가능성 연구<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">메토트렉세이트<\/span> <span class=\"kw\">이근수법理筋手法<\/span> <span class=\"kw\">면역억제제 부작용 관리<\/span><\/td><td>양약 단독 투여 때의 한계를 보완하는 중서의결합의 효과증진 및 수법 병용을 통한 복합 치료 효과 탐색<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">SDF-1/CXCR4<\/span> <span class=\"kw\">JAK2/STAT3<\/span> <span class=\"kw\">ephrinB2<\/span> <span class=\"kw\">CD4+T 세포<\/span> <span class=\"kw\">파골세포破骨細胞<\/span> <span class=\"kw\">장내 세균총<\/span><\/td><td>객관적 바이오마커와 신호 전달 경로를 통해 파골세포 분화 억제, 염증 반응 감소, 장내 미생물 조절 등 정량화된 기전 연구<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">골수액/약물 함유 혈청 연구<\/span> <span class=\"kw\">공배양 체계<\/span> <span class=\"kw\">성분 분석<\/span><\/td><td>다중 성분-다중 타깃의 복합 기전 규명 고도화 및 안정성· 유효성 검증 체계 강화<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2026 최신연구)<\/h4><p class=\"row\">SDF-1/CXCR4 신호전달경로 조절 기전 <b>2026, 佟金霖 등<\/b><\/p><p>SDF-1/CXCR4 및 하위 PI3K/Akt 신호전달경로 억제를 통해 Th17 세포 특이적 인자(RORγt, IL-17, TNF-α) 발현을 낮추고, Treg 세포 특이적 인자(FoxP3, IL-10, TGF-β) 발현을 높여 CD4+ T 림프구의 이동을 억제함<\/p><p><b>의미<\/b> 익신견비환이 Th17/Treg 면역 불균형을 회복시켜 신허형腎虛型 류마티스 관절염을 개선하는 분자 기전을 제시하고, SDF-1/CXCR4 경로가 핵심 표적 중 하나일 가능성을 비임상(약물 투여 동물의 골수액) 모델에서 제시함<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>익신견비환益腎蠲痹丸은 장쑤정다칭장제약(허가번호 Z10890004)과 광둥중성약업(Z20053018[6])이 생산하는 허가 중성약. 현행 설명서의 조성은 20미로 원처방의 천산갑은 빠져 있으나 심골풍尋骨風은 포함되어 있으며, 설명서에 아리스톨로크산에 따른 신장 손상 경고와 정기 신장기능 검사, 임부·영유아·신기능부전 환자 금기가 명시됨[10]. 심골풍을 뺀 개량 조성 특허(장쑤칭장약업)는 2022년 연차료 미납으로 소멸했고, 통풍 용도 특허(주완화)는 유효, 추출 공정 특허 출원(광둥젠취안)은 2026년 취하됨[7][8][9] 허가 중성약 설명서 요점[10]<\/p><div class=\"tbl\"><table><thead><tr><th>항목<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>제품명<\/td><td>익신견비환 益腎蠲痹丸 (Yìshèn Juānbì Wán)<\/td><\/tr><tr><td>허가·규격<\/td><td>처방약, 1포 8g 허가번호 Z10890004(장쑤정다칭장제약)·Z20053018(광둥중성약업)<\/td><\/tr><tr><td class=\"k\">항목<\/td><td>내용<\/td><\/tr><tr><td>효능·적응증<\/td><td>온보신양溫補腎陽·익신장독益腎壯督·수풍척사搜風剔邪·견비통락蠲痹通絡류마티스 관절염(완비頑痹)의 발열, 관절 통증·부종, 운동 제한, 근육 위축·강직, 관절 변형<\/td><\/tr><tr><td>용법·용량<\/td><td>1회 8~12g, 1일 3회<\/td><\/tr><tr><td>금기·주의<\/td><td>· 임부·영유아·신기능부전 환자 금기, 월경량이 많을 때는 중지<br>· 과민 체질·습열이 성한 경우 신중 투여<br>· 효과가 늦게 나타나므로 기존 약은 통증이 줄어든 뒤 서서히 줄이고 갑자기 끊지 않음<br>· 피부 가려움·입마름·변비·위부 불편감이 나타날 수 있음<br>· 아리스톨로크산 함유 약재(심골풍)로 신장 손상 가능성이 있어 정기 신기능 검사 필요<\/td><\/tr><\/tbody><\/table><\/div><p class=\"boxlbl\">시사점<\/p><p class=\"box\">현행 제품도 아리스톨로크산 함유 약재(심골풍)를 포함하고 신장 손상 경고가 붙어 있으므로, 국내 개발은 천산갑(CITES 부속서 I)·심골풍(아리스톨로크산)·오초사(국내 공정서 미수재)를 뺀 조성을 출발점으로 삼고, 대체 조성의 효력 동등성을 먼저 확인해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕톈샹.주량춘 교수의 완비 진료 경험에 대한 소고朱良春教授診治頑痹瑣談[J].중국의약도보中國醫藥導報,2007,(5):76-77.<\/li><li class=\"ref\">[2] 원후이.주량춘의 비증 치료 경험朱良春痹證治驗[J].중국사회주치의中國社區醫師,2006,(22):38-39.<\/li><li class=\"ref\">[3] 예이위안,장이,마쉬안칭.주량춘 교수의 비증 변증 치료 경험朱良春教授辨治

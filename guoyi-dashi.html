新함 ②청열해독淸熱解毒, 양혈소반涼血消斑 모듈 — 혈중에 침투한 독열毒熱을 제거하고 피하의 자반과 독소를 해소함 대청엽, 현삼 : 대청엽이 열독을 풀고 혈분을 식혀 자반을 없애며, 현삼이 자음滋陰하고 열화熱火를 내려 자반의 독성을 해소함. 두 약재가 배합되어 혈분에 쌓인 열독을 근본적으로 제거함 ③양혈활혈養血活血, 통경통락通經通絡 모듈 — 손상된 음혈을 보충하고 기혈의 통행을 유도하여, 정기를 손상시키지 않으면서 경락과 미세혈관의 소통을 원활하게 함 당귀, 천궁 : 당귀가 보혈활혈補血活血하여 혈액을 보충하고, 천궁이 기혈을 소통시켜 통증과 정체를 풀어줌. 두 약재가 배합되어 사물탕 체계를 보완함으로써, 어혈을 제거하되 정기를 손상시키지 않고 출혈로 상실된 혈액을 보충함 ④소풍산열疏風散熱, 소반지양消斑止癢 모듈 — 체표와 혈분의 풍열風熱사기를 소산시켜 가려움증을 완화하고 체표의 반진 독소를 해소함 선퇴, 우방자, 형개, 고삼 : 선퇴가 피부의 풍열을 소산하고, 우방자가 반진의 독을 밖으로 밀어내 풀어주며, 형개가 체표와 혈분의 풍사를 제거하여 가려움증을 완화하고, 고삼이 습열濕熱을 없애 가려움증을 다스림. 네 약재가 어우러져 소산풍열疏散風熱, 소반지양消斑止癢의 효능을 발휘함 ⑤조화제약調和諸藥, 익기해독益氣解毒 모듈 — 약재의 성질을 조화롭게 하고 중초를 보호하며 처방 전체의 해독 작용을 보좌함 감초 : 약성을 조화롭게 하고, 중초를 보호하며, 형개, 우방자 등과 어우러져 피부의 열독을 푸는 효능을 보좌함","master":"①소체혈열素體血熱과 외감풍열外感風熱의 동시 제어를 위한 양혈소풍涼血疏風 IgA 혈관염을 본래 내재된 소체혈열素體血熱과 체표로 침입한 외감 풍열독사風熱毒邪가 결합하여 영혈분營血分으로 침투한 것으로 인식함. 열사가 혈액을 부추겨 맥 외로 넘치게 하고, 어혈과 자반을 형성하는 병기에 대응하여, 생지황, 대청엽, 현삼으로 혈분을 식히는 동시에 형개, 선퇴, 우방자로 풍열을 제거하는 치료 관점을 제시함 ②수삽지혈收澁止血의 폐단을 경계하고 활혈거어活血祛瘀를 통한 소반消斑 도모 혈액은 맥을 벗어나는 즉시 어혈이 되므로, 혈증은 거어祛瘀를 으뜸으로 삼는다는 《혈증론血證論》의 관점에 기반함. 수삽 작용이 강한 지혈약을 쓰면 어혈을 남기는 폐단을 경계하고, 적작약, 목단피, 당귀, 천궁을 가하여 활혈거어, 양혈퇴열涼血退熱시킴으로써, 어혈을 제거하여 자반이 자연스럽게 소멸하도록 유도함 ③사물탕과 소독서각음消毒犀角飮의 유기적 결합을 통한 어독瘀毒 제거 생지황, 적작약, 당귀, 천궁을 사용한 양혈활혈涼血活血의 사물탕 체계와 우방자, 형개, 선퇴, 고삼, 감초 등을 사용하여 소풍해독疏風解毒의 소독서각음(우방자, 형개, 방풍, 감초로 구성)체계를 정밀하게 융합, 변용한 처방임. 혈중의 독열을 풀어주고 어혈을 제거하여 자반이 스스로 사라지게 하는 종합적 치료 체계를 제시함 ④변증에 따른 가감 활용 음허혈열형陰虛血熱型 : 원방의 생지황 용량을 늘리고 적작약 대신 백작약으로 교체하며, 하수오, 귀판 등 익음약益陰藥을 가미함 풍습혈열형風濕血熱型: 원방에 복령, 창출, 백미白薇, 의이인, 방기 등 청열거습약淸熱祛濕藥을 가미함 기허혈열형氣虛血熱型 : 원방에 황기, 당삼 등 익기건비약益氣健脾藥을 가미함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 IgA 혈관염 대상 공개자료상 제품·특허가 확인되지 않으며, 소아 환자가 많은 질환이므로 소아 안전성 자료 확보가 개발의 전제 참고문헌 [1] 판둥밍,돤펑리,리지.돤푸진 교수의 알레르기성 자반증 치료 경험段富津教授治療過敏性紫癜經驗[J].중의약학보中醫藥學報,2003,(1):18."}},{"id":"2-10","ko":"보기소진탕","hz":"補氣消疹湯","alias":"","master_ko":"리전화","master_hz":"李振華","tagline":"기혈을 보하고 풍습을 발산시켜 만성 두드러기(담마진蕁麻疹)를 치료하는 처방","meta":{"주요 적응증":"두드러기(담마진蕁麻疹)","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":127,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-10 보기소진탕補氣消疹湯의 모듈 구성<\/p><h4>①익기고표益氣固表 모듈 — 정기를 북돋아 체표를 굳건히 하고 외부 사기에 대한 방어기능을 강화함<\/h4><p><b>황기<\/b>: 주약主藥이 되어 보중익기補中益氣, 익기고표益氣固表함. 위기衛氣를 충만하게 하여 주리腠理의 개합을 조절하고 외사外邪의 체표 침습을 막아 피부 장벽을 보호함<\/p><h4>②양혈활혈養血活血 모듈 — 혈분을 보강하고 어혈 정체를 풀어 막힌 혈맥을 소통시킴<\/h4><p><b>당귀<\/b>: 보혈활혈補血活血의 핵심 약재로 작용하여, 혈액을 보충하고 기혈 순환의 기반을 다짐<\/p><p><b>천궁<\/b>: 혈중의 기약으로 작용하여 활혈행기活血行氣하며, 당귀와 배합하여 기혈 순환을 촉진하고 뭉친 어혈을 풀어줌<\/p><p><b>적작약<\/b>: 혈분血分으로 들어가 청열양혈淸熱涼血, 산어지통散瘀止痛하며, 혈분의 울열을 식히고 병리적인 어혈 정체를 제거함<\/p><p><b>단삼<\/b>: 활혈거어活血祛瘀, 청심제번淸心除煩하여 미세혈관의 정체를 해소하고 혈액순환을 원활하게 함<\/p><h4>③거풍조습祛風燥濕 모듈 — 체표와 경락에 울체된 풍습風濕과 잠복된 습열濕熱을 제거함<\/h4><p><b>강활, 방풍, 형개<\/b>: 경청輕淸한 성질로 거풍해표祛風解表하며, 체표와 기분氣分에 울체된 풍사를 발산하여 가려움증을 완화함<\/p><p><b>지부자, 사상자<\/b>: 거풍조습祛風燥濕, 청열리습淸熱利濕하여 하초와 체표에 울체된 습열을 소변과 주리로 배출시킴으로써 극렬한 피부 소양증을 완화함<\/p><p><b>지골피<\/b>: 청열양혈淸熱涼血하여 체표와 혈분에 잠복한 복열과 허열을 식히고 피부 열감을 완화함<\/p><p><b>부평<\/b>: 상초와 체표에 울체된 열기를 밖으로 발산시키고 주리를 열어 열사를 배출함<\/p><p><b>창출<\/b>: 거풍조습祛風燥濕, 건비健脾하여 체내외의 정체된 풍습사風濕邪를 제거하고 비위의 운화 기능을 회복함<\/p><h4>④조화제약調和諸藥 모듈 — 중초 비위를 보하고 처방 전체 약재의 성질을 조화롭게 함<\/h4><p><b>감초<\/b>: 건비익기健脾益氣하고 강렬한 거풍조습 약재로 인한 위장 손상을 방지하며 제반 약재의 약성을 조화롭게 함<\/p>"},{"k":"master","t":"리전화의 두드러기(담마진蕁麻疹) 치료","html":"<h4>①외감과 내상의 상합相合 및 영위불화營衛不和가 두드러기(담마진蕁麻疹)의 핵심 병리 기전<\/h4><p>두드러기(담마진蕁麻疹)는 본래 소체비허素體脾虛하거나 장위습열腸胃濕熱로 습사濕邪가 피부에 정체된 상태에서 외부의 풍한風寒 또는 풍열風熱의 사기를 복감復感하여 체표를 속박하고 영위불화營衛不和를 야기할 때 발생함<\/p><p>병증이 장기화되면 정기正氣가 약화되어 폐주피모肺主皮毛 및 비주운화脾主運化 기능이 실조되고, 기혈어체氣血瘀滯와 습열울체濕熱鬱滯가 결합하여 만성, 재발성 피부 병증을 형성함<\/p><h4>②치습위관건治濕爲關鍵, 치풍선치혈治風先治血의 치법 확립<\/h4><p>습사濕邪는 점체黏滯하여 기기氣機를 조체시키고 기혈어체氣血瘀滯를 유발하는 병의 관건이므로, 창출, 복령 등의 건비거습약健脾祛濕藥을 중심에 둠<\/p><p>‘치풍선치혈治風先治血, 혈행풍자멸血行風自滅’의 원칙에 따라 당귀, 천궁, 적작약 등의 양혈활혈약養血活血藥과 거풍약祛風藥을 유기적으로 배오하여 거습祛濕, 활혈活血, 거풍祛風의 3대 치법을 동시에 구현함<\/p><p>보기소진탕補氣消疹湯은 이 3대 치법을 유기적으로 결합한 처방으로, 정기를 보하는 익기양혈제益氣養血劑, 혈행을 촉진하는 활혈화어제活血化瘀劑, 체표의 습열과 풍사를 제거하는 거풍조습제祛風燥濕劑를 균형 있게 배오한 대표 처방임<\/p><h4>③임상 변증분형辨證分型 및 증형별 자의방自擬方<\/h4><p><b>외감풍한형外感風寒型-해표소진탕解表消疹湯<\/b>: 피부 가려움과 함께 분홍색 또는 창백한 평평한 구진 형태의 풍단이 발생하고, 바람이나 추위를 접할 때 악화되며 따뜻해질 때 완화되는 병증에 적용함. 설태는 박백薄白 또는 미니微膩하고 맥은 유완濡緩함. 해표소진탕은 당귀10g, 천궁10g, 적작약15g, 강활10g, 형개8g, 방풍6g, 지부자15g, 창출10g, 백선피12g, 감초6g 등으로 조성되며, 활혈거풍活血祛風, 조습투표燥濕透表함<\/p><p><b>외감풍열형外感風熱型-투표소진탕透表消疹湯<\/b>: 전신 또는 노출 부위에 붉은 풍단이 구진 형태로 나타나 가려움이 극심하고, 열을 접하거나 더울 때 악화되며 차가워질 때 경감되는 병증에 적용함. 설태는 박황薄黃하고 맥은 부삭浮數함. 투표소진탕은 당귀10g, 천궁10g, 적작약15g, 형개8g, 박하10g, 지부자15g, 백선피15g, 지골피15g, 부평24g, 국화12g, 감초3g 등으로 조성되며, 활혈거풍活血祛風, 청열거습淸熱祛濕함<\/p><p><b>장위습열형腸胃濕熱型-조습소진탕燥濕消疹湯<\/b>: 피부 발진과 가려움 외에 식욕 부진, 복부 팽만, 복통, 대변 건결 또는 당설溏泄, 나아가 오심구토 및 전신 무력 등 소화기 증상이 동반될 때 적용. 설질은 홍紅, 설태는 황니黃膩하고 맥은 활삭滑數함. 조습소진탕은 당귀10g, 천궁10g, 적작약12g, 형개8g, 방풍8g, 지부자15g, 창출10g, 황백10g, 목향6g, 감초3g 등으로 조성되며 활혈거풍活血祛風, 건비조습健脾燥濕함. 만약 대변비결大便秘結할 때는 대황10g을 추가하고, 대변의 당설에는 炒의이인30g, 택사12g을 추가함<\/p><p><b>기혈허약형氣血虛弱型-보기소진탕補氣消疹湯<\/b>: 담홍색 풍단이 수년간 반복 재발하여 낫지 않고, 바람이나 추위를 접할 때 또는 피로할 때 발작하며 전신 무력, 심계, 기단 증상이 동반될 때 적용함. 설질은 담淡, 설태는 박백薄白하고 맥은 세약細弱함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">만성 두드러기는 국내 수요가 크고 공개자료상 이 처방의 중국 제품이 확인되지 않아, 보기 위주 처방의 차별성(재발 억제)을 근거로 국내 개발 여지가 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 장웨이.리전화 교수의 자의 보기소진탕을 활용한 두드러기 치료李振華教授自擬補氣消疹湯治療蕁麻疹[J].세계중서의결합잡지世界中西醫結合雜志,2009,4(03):161.<\/li><li class=\"ref\">[2] 장정제,리정성.국의대사 리전화 교수의 두드러기 치료 학술 경험國醫大師李振華教授治療蕁麻疹學術經驗[J].중의연구中醫研究,2011,24(11):56-58.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"황기20g","name":"황기","dose":"20g","base":"황기"},{"raw":"당귀12g","name":"당귀","dose":"12g","base":"당귀"},{"raw":"천궁10g","name":"천궁","dose":"10g","base":"천궁"},{"raw":"적작약12g","name":"적작약","dose":"12g","base":"적작약"},{"raw":"강활12g","name":"강활","dose":"12g","base":"강활"},{"raw":"방풍10g","name":"방풍","dose":"10g","base":"방풍"},{"raw":"형개10g","name":"형개","dose":"10g","base":"형개"},{"raw":"지부자15g","name":"지부자","dose":"15g","base":"지부자"},{"raw":"지골피12g","name":"지골피","dose":"12g","base":"지골피"},{"raw":"부평15g","name":"부평","dose":"15g","base":"부평"},{"raw":"창출10g","name":"창출","dose":"10g","base":"창출"},{"raw":"사상자12g","name":"사상자","dose":"12g","base":"사상자"},{"raw":"단삼15g","name":"단삼","dose":"15g","base":"단삼"},{"raw":"감초3g","name":"감초","dose":"3g","base":"감초"}],"notes":[],"핵심 효능":["기를 보하고 혈을 자양하며 어혈을 풀어 기혈의 순행을 도움(보기양혈활혈補氣養血活血)","습을 말리고 풍사를 제거하며 표부에 울체된 사기를 흩어 경락을 소통시킴(조습거풍투표燥濕祛風透表)"],"주치증":["풍습울표형風濕鬱表型 두드러기(담마진蕁麻疹)"],"연구 확장 영역":["만성 두드러기, 피부 소양증, 알레르기성 피부염(혈허풍조형血虛風燥型, 풍습울표형), 만성 습진, 자반증"],"R&D 포인트":["황기, 당귀, 형개 등 복합 추출물의 면역 조절 기능을 활용하여 Th2 과민 면역 반응을 조절하고, 비만세포의 탈과립 차단을 통한 히스타민 및 전염증성 사이토카인 IL-4, IL-13 분비 억제 기전 검증","단삼, 적작약, 천궁의 활혈통락 효능을 기반으로 미세혈관 투과성 항진을 완화하여 팽진 및 부종 형성을 제어하고 피하 미세순환 개선을 도모할 수 있음","지부자, 사상자, 창출의 조습거풍 효능을 바탕으로 피부 표피층 수분 장벽 회복을 유도하고, C-섬유 감각신경에서 Substance P–NK1R 및 TRPV1 관련 가려움 신호를 조절하여 난치성 만성 가려움증의 악순환을 완화할 가능성을 제시함"]},"modules":[{"name":"①익기고표","hz":"益氣固表","herbs":["황기"],"role":"정기를 북돋아 체표를 굳건히 하고 외부 사기에 대한 방어기능을 강화함"},{"name":"②양혈활혈","hz":"養血活血","herbs":["당귀","천궁","적작약","단삼"],"role":"혈분을 보강하고 어혈 정체를 풀어 막힌 혈맥을 소통시킴"},{"name":"③거풍조습","hz":"祛風燥濕","herbs":["강활","방풍","형개","지부자","사상자","지골피","부평","창출"],"role":"체표와 경락에 울체된 풍습風濕과 잠복된 습열濕熱을 제거함"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":"중초 비위를 보하고 처방 전체 약재의 성질을 조화롭게 함"}],"rd":[{"tag":"Chronic Urticaria","title":"풍습울표형 만성 두드러기 증상 개선","html":"<p>두드러기 치료 경험 2편이 있음<\/p><p>항히스타민제 불충분 반응 환자에서 UAS7 점수 변화를 지표로 한 병용 탐색 임상으로 효과 크기를 추정 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2009),[2](2011, 두드러기 학술 경험))<\/p>"},{"tag":"Barrier Support","title":"황기 중심 보기고표의 재발 억제 효과","html":"<p>‘보기고표’를 재발 억제로 해석함<\/p><p>이 경우 증상 소실 후 유지 기간의 재발률과 무증상 기간이 적절한 평가 지표가 되며, 옥병풍산 계열 구성(황기·방풍)과의 비교로 차별점을 확인 (근거 유형: 간접 근거 | 근거: R&amp;D 논리 1 「보기고표와 면역 방어」, 본문 조성표)<\/p>"},{"tag":"Pruritus","title":"지부자·사상자·부평 등 지양 약재의 가려움 억제","html":"< 탐색 임상으로 효과 크기를 추정 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2009),[2](2011, 두드러기 학술 경험))","Barrier Support 황기 중심 보기고표의 재발 억제 효과 ‘보기고표’를 재발 억제로 해석함 이 경우 증상 소실 후 유지 기간의 재발률과 무증상 기간이 적절한 평가 지표가 되며, 옥병풍산 계열 구성(황기·방풍)과의 비교로 차별점을 확인 (근거 유형: 간접 근거 | 근거: R&D 논리 1 「보기고표와 면역 방어」, 본문 조성표)","Pruritus 지부자·사상자·부평 등 지양 약재의 가려움 억제 지부자·사상자·부평 등 거풍조습 약재의 가려움 억제 효과를 가려움 유발 모델에서 정량화함 그 결과로 처방의 핵심 약재를 좁힘 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 3 「거풍조습과 가려움증 완화」, 본문 조성표)","Microcirculation 활혈 약재(당귀·천궁·단삼)의 팽진 소실 기여 활혈 모듈 유무에 따른 혈관 투과성과 팽진 소실 시간 차이를 비교함 이렇게 하면 ‘치풍선치혈治風先治血’ 원칙을 실험적으로 확인할 수 있음 (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「양혈활혈과 미세순환」)"],"ss":{"composition":"그림 2-10 보기소진탕補氣消疹湯의 모듈 구성 ①익기고표益氣固表 모듈 — 정기를 북돋아 체표를 굳건히 하고 외부 사기에 대한 방어기능을 강화함 황기 : 주약主藥이 되어 보중익기補中益氣, 익기고표益氣固表함. 위기衛氣를 충만하게 하여 주리腠理의 개합을 조절하고 외사外邪의 체표 침습을 막아 피부 장벽을 보호함 ②양혈활혈養血活血 모듈 — 혈분을 보강하고 어혈 정체를 풀어 막힌 혈맥을 소통시킴 당귀 : 보혈활혈補血活血의 핵심 약재로 작용하여, 혈액을 보충하고 기혈 순환의 기반을 다짐 천궁 : 혈중의 기약으로 작용하여 활혈행기活血行氣하며, 당귀와 배합하여 기혈 순환을 촉진하고 뭉친 어혈을 풀어줌 적작약 : 혈분血分으로 들어가 청열양혈淸熱涼血, 산어지통散瘀止痛하며, 혈분의 울열을 식히고 병리적인 어혈 정체를 제거함 단삼 : 활혈거어活血祛瘀, 청심제번淸心除煩하여 미세혈관의 정체를 해소하고 혈액순환을 원활하게 함 ③거풍조습祛風燥濕 모듈 — 체표와 경락에 울체된 풍습風濕과 잠복된 습열濕熱을 제거함 강활, 방풍, 형개 : 경청輕淸한 성질로 거풍해표祛風解表하며, 체표와 기분氣分에 울체된 풍사를 발산하여 가려움증을 완화함 지부자, 사상자 : 거풍조습祛風燥濕, 청열리습淸熱利濕하여 하초와 체표에 울체된 습열을 소변과 주리로 배출시킴으로써 극렬한 피부 소양증을 완화함 지골피 : 청열양혈淸熱涼血하여 체표와 혈분에 잠복한 복열과 허열을 식히고 피부 열감을 완화함 부평 : 상초와 체표에 울체된 열기를 밖으로 발산시키고 주리를 열어 열사를 배출함 창출 : 거풍조습祛風燥濕, 건비健脾하여 체내외의 정체된 풍습사風濕邪를 제거하고 비위의 운화 기능을 회복함 ④조화제약調和諸藥 모듈 — 중초 비위를 보하고 처방 전체 약재의 성질을 조화롭게 함 감초 : 건비익기健脾益氣하고 강렬한 거풍조습 약재로 인한 위장 손상을 방지하며 제반 약재의 약성을 조화롭게 함","master":"①외감과 내상의 상합相合 및 영위불화營衛不和가 두드러기(담마진蕁麻疹)의 핵심 병리 기전 두드러기(담마진蕁麻疹)는 본래 소체비허素體脾虛하거나 장위습열腸胃濕熱로 습사濕邪가 피부에 정체된 상태에서 외부의 풍한風寒 또는 풍열風熱의 사기를 복감復感하여 체표를 속박하고 영위불화營衛不和를 야기할 때 발생함 병증이 장기화되면 정기正氣가 약화되어 폐주피모肺主皮毛 및 비주운화脾主運化 기능이 실조되고, 기혈어체氣血瘀滯와 습열울체濕熱鬱滯가 결합하여 만성, 재발성 피부 병증을 형성함 ②치습위관건治濕爲關鍵, 치풍선치혈治風先治血의 치법 확립 습사濕邪는 점체黏滯하여 기기氣機를 조체시키고 기혈어체氣血瘀滯를 유발하는 병의 관건이므로, 창출, 복령 등의 건비거습약健脾祛濕藥을 중심에 둠 ‘치풍선치혈治風先治血, 혈행풍자멸血行風自滅’의 원칙에 따라 당귀, 천궁, 적작약 등의 양혈활혈약養血活血藥과 거풍약祛風藥을 유기적으로 배오하여 거습祛濕, 활혈活血, 거풍祛風의 3대 치법을 동시에 구현함 보기소진탕補氣消疹湯은 이 3대 치법을 유기적으로 결합한 처방으로, 정기를 보하는 익기양혈제益氣養血劑, 혈행을 촉진하는 활혈화어제活血化瘀劑, 체표의 습열과 풍사를 제거하는 거풍조습제祛風燥濕劑를 균형 있게 배오한 대표 처방임 ③임상 변증분형辨證分型 및 증형별 자의방自擬方 외감풍한형外感風寒型-해표소진탕解表消疹湯 : 피부 가려움과 함께 분홍색 또는 창백한 평평한 구진 형태의 풍단이 발생하고, 바람이나 추위를 접할 때 악화되며 따뜻해질 때 완화되는 병증에 적용함. 설태는 박백薄白 또는 미니微膩하고 맥은 유완濡緩함. 해표소진탕은 당귀10g, 천궁10g, 적작약15g, 강활10g, 형개8g, 방풍6g, 지부자15g, 창출10g, 백선피12g, 감초6g 등으로 조성되며, 활혈거풍活血祛風, 조습투표燥濕透表함 외감풍열형外感風熱型-투표소진탕透表消疹湯 : 전신 또는 노출 부위에 붉은 풍단이 구진 형태로 나타나 가려움이 극심하고, 열을 접하거나 더울 때 악화되며 차가워질 때 경감되는 병증에 적용함. 설태는 박황薄黃하고 맥은 부삭浮數함. 투표소진탕은 당귀10g, 천궁10g, 적작약15g, 형개8g, 박하10g, 지부자15g, 백선피15g, 지골피15g, 부평24g, 국화12g, 감초3g 등으로 조성되며, 활혈거풍活血祛風, 청열거습淸熱祛濕함 장위습열형腸胃濕熱型-조습소진탕燥濕消疹湯 : 피부 발진과 가려움 외에 식욕 부진, 복부 팽만, 복통, 대변 건결 또는 당설溏泄, 나아가 오심구토 및 전신 무력 등 소화기 증상이 동반될 때 적용. 설질은 홍紅, 설태는 황니黃膩하고 맥은 활삭滑數함. 조습소진탕은 당귀10g, 천궁10g, 적작약12g, 형개8g, 방풍8g, 지부자15g, 창출10g, 황백10g, 목향6g, 감초3g 등으로 조성되며 활혈거풍活血祛風, 건비조습健脾燥濕함. 만약 대변비결大便秘結할 때는 대황10g을 추가하고, 대변의 당설에는 炒의이인30g, 택사12g을 추가함 기혈허약형氣血虛弱型-보기소진탕補氣消疹湯 : 담홍색 풍단이 수년간 반복 재발하여 낫지 않고, 바람이나 추위를 접할 때 또는 피로할 때 발작하며 전신 무력, 심계, 기단 증상이 동반될 때 적용함. 설질은 담淡, 설태는 박백薄白하고 맥은 세약細弱함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 만성 두드러기는 국내 수요가 크고 공개자료상 이 처방의 중국 제품이 확인되지 않아, 보기 위주 처방의 차별성(재발 억제)을 근거로 국내 개발 여지가 있음 참고문헌 [1] 장웨이.리전화 교수의 자의 보기소진탕을 활용한 두드러기 치료李振華教授自擬補氣消疹湯治療蕁麻疹[J].세계중서의결합잡지世界中西醫結合雜志,2009,4(03):161. [2] 장정제,리정성.국의대사 리전화 교수의 두드러기 치료 학술 경험國醫大師李振華教授治療蕁麻疹學術經驗[J].중의연구中醫研究,2011,24(11):56-58."}},{"id":"2-11","ko":"쌍신비구산","hz":"雙辛鼻鼽散","alias":"","master_ko":"왕칭궈","master_hz":"王慶國","tagline":"양허폐한陽虛肺寒과 표한리열表寒裏熱형 알레르기성 비염을 치료하는 처방","meta":{"주요 적응증":"알레르기성 비염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":132,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-11 쌍신비구산雙辛鼻鼽散의 모듈 구성<\/p><h4>①온양발산溫陽發散, 산한해표散寒解表 모듈 — 폐와 신의 양기를 따뜻하게 하고 주리腠理를 열어 체표와 상초의 찬 기운을 몰아냄<\/h4><p><b>마황, 세신<\/b>: 마황이 태양경太陽經의 주리腠理를 열어 해표산한解表散寒하고 폐기肺氣를 선발宣發하며, 세신이 신온주찬辛溫走竄하여 소음경少陰經을 온후溫煦하고 신경腎經과 폐경肺經의 한사寒邪를 몰아냄. 마황과 세신이 서로 배오되어 태양과 소음 두 경락을 동시에 다스림으로써 표리表裏의 한사를 동시에 발산함<\/p><h4>②선통비규宣通鼻竅, 거풍지통祛風止痛 모듈 — 비규鼻竅의 막힌 기운을 뚫고 풍사를 제거하여 코막힘과 두통을 해소함<\/h4><p><b>신이, 천궁<\/b>: 신이가 풍한을 해소하고 비규를 직접 선통宣通하여 코막힘과 콧물을 제어하고, 천궁이 거풍지통祛風止痛하고 혈분血分을 조화롭게 하여 상초의 풍사를 분산시키고 신이의 통규 작용을 도움<\/p><h4>③익기고표益氣固表, 익기위외益氣衛外 모듈 — 폐비肺脾의 기운을 보강하고 표부表部를 실하게 하여 외사外邪의 재침입을 차단함<\/h4><p><b>황기, 방풍<\/b>: 황기가 익기고표益氣固表하고 보익폐비補益肺脾하여 한사를 몰아낼 때 정기가 손상되지 않도록 보호하고, 방풍이 황기를 도와 표를 실하게 하면서 풍사를 밖으로 몰아냄. 두 약재가 어우러져 옥병풍산玉屛風散의 방의方意를 형성함<\/p><h4>④청해울열淸解鬱熱, 한열조화寒熱調和 모듈 — 상초와 내부에 정체된 열을 내리고 발산 약재들로 인한 화열<\/h4><p class=\"lbl2\">化熱을 방지함<\/p><p><b>황금<\/b>: 내부 및 상초의 울열鬱熱을 내리고, 따뜻하고 발산하는 약재들로 인해 열이 조장되는 것을 차단하여 표한리열表寒裏熱의 한열 균형을 조화롭게 함<\/p>"},{"k":"master","t":"왕칭궈의 알레르기성 비염 치료","html":"<h4>①태음, 소음, 소양 삼경의 연관 및 한열착잡寒熱錯雜에 따른 온양청열溫陽淸熱 동시 투여<\/h4><p>알레르기성 비염을 본허표실本虛標實 및 한열착잡寒熱錯雜의 증으로 인식함. 태음太陰 폐비기허肺脾氣虛와 태양太陽외감풍열風熱/풍한風寒, 소음少陰 신양부족腎陽不足을 본으로 삼고, 소양少陽 상화상충相火上衝에 의한 울열鬱熱을 겸하는 것으로 파악함. 한열이 병존하되 한寒이 주가 되고 열熱이 부가 되므로, 마황, 세신으로 온양산한溫陽散寒하면서 황금으로 소양의 울열을 청해淸解하는 한열병용寒熱並用 및 온양청열의 치료 관점을 제시함<\/p><h4>②마황부자세신탕, 옥병풍산, 천궁다조산의 융합을 통한 쌍신비구산의 구축<\/h4><p>마황부자세신탕麻黃附子細辛湯의 방의方意를 응용하여 소음의 찬 기운을 흩트리고 상초 비규를 통하게 하며, 옥병풍산玉屛風散(황기, 방풍)으로 익기고표益氣固表하여 주리腠理를 견고히 함. 여기에 천궁다조산川芎茶調散의 천궁을 가하여 소양경에 작용시키고 거풍지통祛風止痛 및 신이의 비규 선통 작용을 도움. 주약인 신이, 세신(쌍신雙辛)을 핵심으로 표리의 한열을 조율하고 외사의 재침입을 차단하는 정밀한 방제 체계를 완성함<\/p><h4>③공수겸비攻守兼備의 배합구조와 임상 병태에 따른 가감법<\/h4><p>마황, 세신, 신이, 천궁으로 풍한을 발산하고 비규를 뚫어주면서(거사祛邪), 황기, 방풍으로 기표를 고섭하고(부정扶正), 황금으로 화열化熱을 차단함. 임상 변증 시 목의 불쾌감이 있을 때 길경, 生감초를 가하여 청열리인淸熱利咽하고, 풍사가 왕성할 때 상엽, 백지, 창이자를 가하여 소풍통규疏風通竅하며, 기운이 흩어지는 것을 막을 때 오미자로 약성을 수렴하고, 설태가 백니白膩하고 한습이 심할 때 건강을 가하여 온산한습溫散寒濕함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">알레르기 비염은 국내 한방 제제 경쟁이 많은 영역이므로, 신이·세신 배합의 차별성을 기존 제제와 비교해 확인해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 자오옌,왕쉐첸,싸이자양,등.왕칭궈 교수의 쌍신비구산을 활용한 알레르기 비염 치료 경험王慶國教授應用雙辛鼻鼽散治療過敏性鼻炎的經驗[J].환구중의 약環球中醫藥,2015,8(10):1206-1207.<\/li><li class=\"ref\">[2] 왕쉐첸.왕칭궈 교수의 학술사상 및 쌍신비구탕을 활용한 알레르기 비염 치료의 특색 경험王慶國教授學術思想及其運用雙辛鼻鼽湯治療過敏性鼻炎的特色經驗[D].베이징중의약대학北京中醫藥大學,2016.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"炙마황10g","name":"炙마황","dose":"10g","base":"마황"},{"raw":"세신3g","name":"세신","dose":"3g","base":"세신"},{"raw":"황금10g","name":"황금","dose":"10g","base":"황금"},{"raw":"천궁10g","name":"천궁","dose":"10g","base":"천궁"},{"raw":"신이10g(包煎·後下)","name":"신이","dose":"10g(包煎·後下)","base":"신이"},{"raw":"황기20g","name":"황기","dose":"20g","base":"황기"},{"raw":"방풍10g","name":"방풍","dose":"10g","base":"방풍"}],"notes":[],"핵심 효능":["양기를 따뜻하게 하고 한사를 흩어냄(온양산한溫陽散寒)","폐와 비의 기를 소통시켜 비규를 열어줌(선통비규宣通鼻竅)","울체된 열을 풀어 제거함(청해울열淸解鬱熱)"],"주치증":["양허폐한陽虛肺寒 및 표한리열表寒裏熱형 알레르기성 비염"],"연구 확장 영역":["알레르기성 비염, 혈관운동성 비염, 만성 부비동염(축농증), 만성 상기도 과민성 질환, 면역저하성 호흡기 질환"],"R&D 포인트":["마황, 세신, 신이의 복합 배합을 통한 비강 점막 충혈 완화, 기도 과민성 억제 및 항히스타민 효과 천연물 신약 소재","황기, 방풍의 익기고표益氣固表 작용을 통한 호흡기 점막 면역 장벽 강화 및 외부 알레르겐 방어","황금의 항염증, 청해울열淸解鬱熱 작용을 통한 약성 조율 및 발산 시 화열化熱 작용 차단"]},"modules":[{"name":"①온양발산 · 산한해표","hz":"溫陽發散 · 散寒解表","herbs":["마황","세신"],"role":"폐와 신의 양기를 따뜻하게 하고 주리腠理를 열어 체표와 상초의 찬 기운을 몰아냄"},{"name":"②선통비규 · 거풍지통","hz":"宣通鼻竅 · 祛風止痛","herbs":["신이","천궁"],"role":"비규鼻竅의 막힌 기운을 뚫고 풍사를 제거하여 코막힘과 두통을 해소함"},{"name":"③익기고표 · 익기위외","hz":"益氣固表 · 益氣衛外","herbs":["황기","방풍"],"role":"폐비肺脾의 기운을 보강하고 표부表部를 실하게 하여 외사外邪의 재침입을 차단함"},{"name":"④청해울열 · 한열조화","hz":"淸解鬱熱 · 寒熱調和","herbs":["황금"],"role":"상초와 내부에 정체된 열을 내리고 발산 약재들로 인한 화열化熱을 방지함"}],"rd":[{"tag":"Allergic Rhinitis","title":"양허폐한형 알레르기 비염의 증상 개선","html":"<p>총비증상점수(TNSS)와 삶의 질(RQLQ)을 지표로 한 탐색 임상으로 시작함<\/p><p><b>비강 스테로이드 병용 여부에 따라 층화하여 분석 (근거 유형<\/b>: 임상 경험 보고 | 근거: 참고문헌 [1](2015, 치료 경험), [2](학술사상과 특색 경험))<\/p>"},{"tag":"Formula Lineage","title":"소청룡탕·마황부자세신탕 계열과의 비교","html":"<p>마황·세신은 소청룡탕·마황부자세신탕 등 알레르기 비염에 이미 쓰이는 고방과 겹침<\/p><p>이들 처방 대비 증상 개선과 재발률의 추가 이득을 비교해야 처  층화하여 분석 (근거 유형 : 임상 경험 보고 | 근거: 참고문헌 [1](2015, 치료 경험), [2](학술사상과 특색 경험))","Formula Lineage 소청룡탕·마황부자세신탕 계열과의 비교 마황·세신은 소청룡탕·마황부자세신탕 등 알레르기 비염에 이미 쓰이는 고방과 겹침 이들 처방 대비 증상 개선과 재발률의 추가 이득을 비교해야 처방 고유의 가치가 드러남 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&D 논리 1 「온양산한」)","Cold–Hot Balance 황금 배합의 화열 방지 효과 황금 유무에 따른 비강 염증 지표와 입마름·인후 건조 등 부작용 차이를 비교함 이를 통해 한열병용 배합의 근거를 확인 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 3 「청해울열과 한열조화」)","Mucosal Immunity 황기·방풍 배합의 재발 억제 효과 황기·방풍(옥병풍산 계열)이 계절성 재발을 줄이는지 1년 이상 계절별 재발 횟수로 확인함 비강 IgE·호산구 변화는 보조 지표로만 씀 (근거 유형 : 간접 근거 | 근거: R&D 논리 2 「익기고표와 위외 방어」)"],"ss":{"composition":"그림 2-11 쌍신비구산雙辛鼻鼽散의 모듈 구성 ①온양발산溫陽發散, 산한해표散寒解表 모듈 — 폐와 신의 양기를 따뜻하게 하고 주리腠理를 열어 체표와 상초의 찬 기운을 몰아냄 마황, 세신 : 마황이 태양경太陽經의 주리腠理를 열어 해표산한解表散寒하고 폐기肺氣를 선발宣發하며, 세신이 신온주찬辛溫走竄하여 소음경少陰經을 온후溫煦하고 신경腎經과 폐경肺經의 한사寒邪를 몰아냄. 마황과 세신이 서로 배오되어 태양과 소음 두 경락을 동시에 다스림으로써 표리表裏의 한사를 동시에 발산함 ②선통비규宣通鼻竅, 거풍지통祛風止痛 모듈 — 비규鼻竅의 막힌 기운을 뚫고 풍사를 제거하여 코막힘과 두통을 해소함 신이, 천궁 : 신이가 풍한을 해소하고 비규를 직접 선통宣通하여 코막힘과 콧물을 제어하고, 천궁이 거풍지통祛風止痛하고 혈분血分을 조화롭게 하여 상초의 풍사를 분산시키고 신이의 통규 작용을 도움 ③익기고표益氣固表, 익기위외益氣衛外 모듈 — 폐비肺脾의 기운을 보강하고 표부表部를 실하게 하여 외사外邪의 재침입을 차단함 황기, 방풍 : 황기가 익기고표益氣固表하고 보익폐비補益肺脾하여 한사를 몰아낼 때 정기가 손상되지 않도록 보호하고, 방풍이 황기를 도와 표를 실하게 하면서 풍사를 밖으로 몰아냄. 두 약재가 어우러져 옥병풍산玉屛風散의 방의方意를 형성함 ④청해울열淸解鬱熱, 한열조화寒熱調和 모듈 — 상초와 내부에 정체된 열을 내리고 발산 약재들로 인한 화열 化熱을 방지함 황금 : 내부 및 상초의 울열鬱熱을 내리고, 따뜻하고 발산하는 약재들로 인해 열이 조장되는 것을 차단하여 표한리열表寒裏熱의 한열 균형을 조화롭게 함","master":"①태음, 소음, 소양 삼경의 연관 및 한열착잡寒熱錯雜에 따른 온양청열溫陽淸熱 동시 투여 알레르기성 비염을 본허표실本虛標實 및 한열착잡寒熱錯雜의 증으로 인식함. 태음太陰 폐비기허肺脾氣虛와 태양太陽외감풍열風熱/풍한風寒, 소음少陰 신양부족腎陽不足을 본으로 삼고, 소양少陽 상화상충相火上衝에 의한 울열鬱熱을 겸하는 것으로 파악함. 한열이 병존하되 한寒이 주가 되고 열熱이 부가 되므로, 마황, 세신으로 온양산한溫陽散寒하면서 황금으로 소양의 울열을 청해淸解하는 한열병용寒熱並用 및 온양청열의 치료 관점을 제시함 ②마황부자세신탕, 옥병풍산, 천궁다조산의 융합을 통한 쌍신비구산의 구축 마황부자세신탕麻黃附子細辛湯의 방의方意를 응용하여 소음의 찬 기운을 흩트리고 상초 비규를 통하게 하며, 옥병풍산玉屛風散(황기, 방풍)으로 익기고표益氣固表하여 주리腠理를 견고히 함. 여기에 천궁다조산川芎茶調散의 천궁을 가하여 소양경에 작용시키고 거풍지통祛風止痛 및 신이의 비규 선통 작용을 도움. 주약인 신이, 세신(쌍신雙辛)을 핵심으로 표리의 한열을 조율하고 외사의 재침입을 차단하는 정밀한 방제 체계를 완성함 ③공수겸비攻守兼備의 배합구조와 임상 병태에 따른 가감법 마황, 세신, 신이, 천궁으로 풍한을 발산하고 비규를 뚫어주면서(거사祛邪), 황기, 방풍으로 기표를 고섭하고(부정扶正), 황금으로 화열化熱을 차단함. 임상 변증 시 목의 불쾌감이 있을 때 길경, 生감초를 가하여 청열리인淸熱利咽하고, 풍사가 왕성할 때 상엽, 백지, 창이자를 가하여 소풍통규疏風通竅하며, 기운이 흩어지는 것을 막을 때 오미자로 약성을 수렴하고, 설태가 백니白膩하고 한습이 심할 때 건강을 가하여 온산한습溫散寒濕함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 알레르기 비염은 국내 한방 제제 경쟁이 많은 영역이므로, 신이·세신 배합의 차별성을 기존 제제와 비교해 확인해야 함 참고문헌 [1] 자오옌,왕쉐첸,싸이자양,등.왕칭궈 교수의 쌍신비구산을 활용한 알레르기 비염 치료 경험王慶國教授應用雙辛鼻鼽散治療過敏性鼻炎的經驗[J].환구중의 약環球中醫藥,2015,8(10):1206-1207. [2] 왕쉐첸.왕칭궈 교수의 학술사상 및 쌍신비구탕을 활용한 알레르기 비염 치료의 특색 경험王慶國教授學術思想及其運用雙辛鼻鼽湯治療過敏性鼻炎的特色經驗[D].베이징중의약대학北京中醫藥大學,2016."}},{"id":"2-12","ko":"화탁녕부탕","hz":"化濁寧膚湯","alias":"","master_ko":"왕신루","master_hz":"王新陸","tagline":"탁사濁邪가 피부에 정체된 각종 난치성 피부질환을 치료하는 처방","meta":{"주요 적응증":"난치성 피부질환(사마귀·편평태선 등)","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":136,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-12 화탁녕부탕化濁寧膚湯의 모듈 구성<\/p><h4>①건비화탁健脾化濁, 삼습배탁滲濕排濁 모듈 — 비위의 운화기능을 강화하여 내부의 탁사를 화해化解하고 습을 원활히 배출함<\/h4><p><b>의이인, 하엽<\/b>: 의이인이 건비삼습健脾滲濕, 화탁化濁하여 정기를 손상시키지 않으면서 습탁을 배출하고, 하엽이 청향승산淸香升散, 건비승양健脾升陽하여 중초의 승청강탁升淸降濁을 도와, 기혈순환을 깨우고 체내에 엉킨 어혈과 탁사를 효율적으로 풀어줌<\/p><h4>②청열해독淸熱解毒, 통락소종通絡消腫 모듈 — 피부 깊숙이 침투한 열독熱毒과 심각한 염증성 독소를 제거함<\/h4><p><b>백화사설초, 노봉방<\/b>: 백화사설초가 청열해독, 이습화탁利濕化濁하여 옹종창독癰腫瘡毒을 풀고, 노봉방이 가볍고 신속하게 뚫고 나가는 성질로 경락과 혈락을 뚫어 내외의 옹저癰疽, 풍라風癩, 풍진風疹, 가려움증을 통락해독通絡解毒함<\/p><h4>③소풍지양疏風止癢, 거풍조습祛風燥濕 모듈 — 체표의 풍열風熱 및 습사濕邪를 발산시켜 극렬한 피부 가려움증을 해소함<\/h4><p><b>부평, 백선피, 지부자<\/b>: 부평이 경청선산輕淸宣散하는 성질로 상초와 체표의 풍열을 제거하여 소풍산열화탁疏風散熱化濁하고, 백선피가 기성행산氣腥行散하는 특성으로 근육과 체표 사이의 습열을 밖으로 끌어내어 거풍조습祛風燥濕, 청열화탁淸熱化濁하며, 지부자가 하초와 체표를 연결하며 청열리습淸熱利濕, 거풍화탁祛風化濁하고, 이 약들이 상중하로 협력하여 피부 풍진風疹과 극심한 가려움증을 근본적으로 제어함<\/p><h4>④양혈화어涼血化瘀, 청열통락淸熱通絡 모듈 — 혈분血分의 열을 식히고 혈맥의 정체된 어탁瘀濁을 제거하여 기혈순환을 조화롭게 함<\/h4><p><b>백모근, 적작약<\/b>: 백모근이 혈분에 들어가 양혈청열화탁涼血淸熱化濁하여 자반 및 출혈성 반진을 다스리고, 적작약이 혈분에 작용하여 활혈거어통락活血祛瘀通絡하여 혈액 정체로 인한 병리적 변화와 피부병변의 삼출물을 제거함<\/p>"},{"k":"master","t":"왕신루의 각종 피부질환 치료","html":"<h4>①피부질환의 핵심 병기로서 “탁사濁邪”와 “탁증濁證”에 대한 독창적 인식<\/h4><p>대사는 각종 피부질환이 단순히 풍, 열, 습, 독에 그치지 않고, 이들이 장기간 지체되어 형성된 탁사濁邪가 피부와 피하 조직에 결합하여 발병한다는 “탁병濁病 이론”을 제시함. 따라서 탁사를 제거하는 “화탁법化濁法”을 피부과 치료의 근본 원칙으로 삼아, 단순 청열리습淸熱利濕 위주의 기존 치료의 한계를 극복함<\/p><h4>②승청강탁升淸降濁과 통락해독通絡解毒을 융합한 공수겸비의 약물 배합<\/h4><p>하엽과 부평으로 상초와 체표의 막힌 청기淸氣를 선발宣發, 승청하여 탁사를 제거하고, 의이인, 지부자, 백모근으로 하초의 습탁을 소변으로 배출하여 강탁降濁하며, 노봉방과 적작약으로 혈락血絡의 어탁瘀濁을 뚫어 통락하는 정밀한 승강통락升降通絡 구조를 구축함<\/p><h4>③다양한 피부과 난치 병증으로의 광범위한 확장성과 임상 가감의 유연성<\/h4><p>본 방제는 탁사와 혈탁血濁에 기인한 다양한 피부 질환 치료에 기본방으로 활용됨<\/p><p class=\"sub\"><b>구강 편평태선扁平苔蘚(혈탁血濁, 음허陰虛, 습곤濕困)<\/b>: 화탁녕부탕에 산수유15g, 석곡15g, 생지황10g, 적소두30g을 추가 배오함<\/p><p class=\"sub\"><b>단독丹毒(열독혈탁熱毒血濁)<\/b>: 화탁녕부탕에 야국화15g, 비해10g, 황백10g, 인동등15g, 토복령15g을 추가 배오함<\/p><p class=\"sub\"><b>대상포진(열독혈탁熱毒血濁)<\/b>: 화탁녕부탕에 포공영15g, 판람근15g, 토복령15g을 추가 배오함<\/p><p class=\"sub\"><b>결절성 양진癢疹(혈탁血濁, 간울肝鬱)<\/b>: 화탁녕부탕에 고삼10g, 전갈6g, 홍화6g, 백질려10g, 적작약10g을 추가 배오함<\/p><p class=\"sub\"><b>수선手癬(습열혈탁濕熱血濁)<\/b>: 화탁녕부탕에 생지탄10g, 형개수6g을 추가 배오함<\/p><p class=\"sub\"><b>천포창天皰瘡(혈탁血濁, 기혈휴허氣血虧虛)<\/b>: 화탁녕부탕에 자초10g, 선인두仙人頭10g, 황기30g, 천화분10g, 태자삼15g을 추가 배오함<\/p><p class=\"sub\"><b>IgA 혈관염(혈탁내정血濁內停, 혈열망행血熱妄行)<\/b>: 화탁녕부탕에 옥미수玉米須6g, 차전초30g, 천초탄10g, 지유탄10g, 우절탄20g을 추가 배오함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">난치성 피부질환 대상 경험방으로 공개자료상 제품·특허가 확인되지 않아, 사마귀 등 단일 질환으로 좁힌 증례 연구가 첫 단계<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕신루.화탁법의 피부과 질환에 대한 활용化濁法在皮膚科疾病中的運用[J].톈진중의약天津中醫藥,2007,(3):177-180.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"의이인15g","name":"의이인","dose":"15g","base":"의이인"},{"raw":"하엽10g","name":"하엽","dose":"10g","base":"하엽"},{"raw":"백화사설초15g","name":"백화사설초","dose":"15g","base":"백화사설초"},{"raw":"부평6g","name":"부평","dose":"6g","base":"부평"},{"raw":"백선피15g","name":"백선피","dose":"15g","base":"백선피"},{"raw":"백모근15g","name":"백모근","dose":"15g","base":"백모근"},{"raw":"지부자10g","name":"지부자","dose":"10g","base":"지부자"},{"raw":"적작약10g","name":"적작약","dose":"10g","base":"적작약"},{"raw":"노봉방10g","name":"노봉방","dose":"10g","base":"노봉방"}],"notes":[],"핵심 효능":["풍사를 흩어내고 습사를 제거함(소풍거습疏風祛濕)","열을 내리고 독을 풀어줌(청열해독淸熱解毒)","어혈을 제거하고 탁사濁邪를 해소함(거어화탁祛瘀化濁)"],"주치증":["습열濕熱, 풍독風毒, 탁사濁邪가 체표 및 피하에 엉켜 발생한 각종 난치성 피부질환(편평사마귀, 전염성 물사마귀, 구진성 두드러기, 편평태선, IgA 혈관염, 천포창天皰瘡, 수선手癬, 결절성 양진癢疹, 대상포진, 단독丹毒 등)"],"연구 확장 영역":["알레르기성 피부염, 건선, 난치성 자반성 피부질환, 만성 두드러기, 아토피성 피부염, 바이러스성 피부 질환(사마귀, 대상포진), 면역매개성 수포성 피부질환"],"R&D 포인트":["백화사설초, 의이인, 노봉방 복합 추출물의 면역조절 및 광범위 항바이러스, 항균 작용을 통한 병원체 억제 천연물 신약 소재 개발","백선피, 지부자, 부평의 H1 히스타민 수용체 억제 및 비만세포 탈과립 차단을 활용한 심한 가려움증 완화제 연구","하엽, 적작약, 백모근의 활혈거어活血祛瘀 및 혈관 투과성 조절 작용을 통한 미세혈관 내 염증성 삼출물 감소, 피하 어탁瘀濁 제거 및 조직 회복 촉진"]},"modules":[{"name":"①건비화탁 · 삼습배탁","hz":"健脾化濁 · 滲濕排濁","herbs":["의이인","하엽"],"role":"비위의 운화기능을 강화하여 내부의 탁사를 화해化解하고 습을 원활히 배출함"},{"name":"②청열해독 · 통락소종","hz":"淸熱解毒 · 通絡消腫","herbs":["백화사설초","노봉방"],"role":"피부 깊숙이 침투한 열독熱毒과 심각한 염증성 독소를 제거함"},{"name":"③소풍지양 · 거풍조습","hz":"疏風止癢 · 祛風燥濕","herbs":["부평","백선피","지부자"],"role":"체표의 풍열風熱 및 습사濕邪를 발산시켜 극렬한 피부 가려움증을 해소함"},{"name":"④양혈화어 · 청열통락","hz":"涼血化瘀 · 淸熱通絡","herbs":["백모근","적작약"],"role":"혈분血分의 열을 식히고 혈맥의 정체된 어탁瘀濁을 제거하여 기혈순환을 조화롭게 함"}],"rd":[{"tag":"Viral Warts","title":"편평사마귀·전염성 물사마귀 등 바이러스성 피부질환","html":"<p>주치에 편평사마귀와 전염성 물사마귀가 포함되어 있으나 편평사마귀는 사람유두종바이러스(HPV), 물사마귀는 폭스바이러스로 원인이 다름<\/p><p>질환별로 나누어 소아·다발성 병변의 병변 소실률을 정리하는 증례 분석이 개발 가능성을 판단하는 첫 단계 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2007, 화탁법의 피부과 활용), 본문 주치증)<\/p>"},{"tag":"Antiviral Herbs","title":"백화사설초·노봉방의 항바이러스·항염 작용","html":"<p>백화사설초와 노봉방의 항바이러스 활성은 편평사마귀에는 HPV 관련 세포 모델로, 물사마귀에는 폭스바이러스 모델로 나누어 확인함<\/p><p><b>이를 통해 ‘청열해독’이 사마귀 치료에서 갖는 의미를 구체화 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 2 「청열해독과 통락소종」, 본문 조성표)<\/p>"},{"tag":"Itch & Papule","title":"구진성 두드러기·편평태선의 가려움 억제","html":"<p>부평·백선피·지부자의 지양 작용을 가려움 모델에서 정량화함<\/p><p>구진성 두드러기 등 가려움이 주증상인 질환에 대한 효과를 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「소풍구습과 가려움 해소」)<\/p>"},{"tag":"Turbidity Concept","title":"‘탁사濁邪’의 대사적 해석과 하엽·의이인 역할","html":"<p>하엽·의이인의 화탁 작용을 피부 지질 대사 이상과 연결하는 가설을 세움<\/p><p><b>비만·대사 이상 동반 피부질환 환자에서 효과 차이를 탐색 (근거 유형<\/b>: 임상 경험 보고 | 근거: R&amp;D 논리 1 「건비화탁과 승청강탁」, 참고문헌 [1])<\/p>"}],"logic":[{"n":"1","title":"건비화탁健脾化濁과 승청강탁","body":"비위 운화를 강화하고 습탁을 체외로 배출함"},{"n":"2","title":"청열해독과 통락소종通絡消腫","body":"피부 깊숙한 염증성 독소를 해소함"},{"n":"3","title":"소풍거습疏風祛濕과 가려움 해소","body":"상중하초의 풍열과 습사를 발산시킴"},{"n":"4","title":"양혈화어涼血化瘀와 혈탁 제거","body":"혈분의 열을 식히고 혈맥의 어탁을 소통시킴"}],"field":2,"pages":[136,139],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-12","화탁녕부탕","化濁寧膚湯","","왕신루","王新陸","탁사濁邪가 피부에 정체된 각종 난치성 피부질환을 치료하는 처방","의이인15g 하엽10g 백화사설초15g 부평6g 백선피15g 백모근15g 지부자10g 적작약10g 노봉방10g","","핵심 효능 풍사를 흩어내고 습사를 제거함(소풍거습疏風祛濕) 열을 내리고 독을 풀어줌(청열해독淸熱解毒) 어혈을 제거하고 탁사濁邪를 해소함(거어화탁祛瘀化濁)","주치증 습열濕熱, 풍독風毒, 탁사濁邪가 체표 및 피하에 엉켜 발생한 각종 난치성 피부질환(편평사마귀, 전염성 물사마귀, 구진성 두드러기, 편평태선, IgA 혈관염, 천포창天皰瘡, 수선手癬, 결절성 양진癢疹, 대상포진, 단독丹毒 등)","연구 확장 영역 알레르기성 피부염, 건선, 난치성 자반성 피부질환, 만성 두드러기, 아토피성 피부염, 바이러스성 피부 질환(사마귀, 대상포진), 면역매개성 수포성 피부질환","R&D 포인트 백화사설초, 의이인, 노봉방 복합 추출물의 면역조절 및 광범위 항바이러스, 항균 작용을 통한 병원체 억제 천연물 신약 소재 개발 백선피, 지부자, 부평의 H1 히스타민 수용체 억제 및 비만세포 탈과립 차단을 활용한 심한 가려움증 완화제 연구 하엽, 적작약, 백모근의 활혈거어活血祛瘀 및 혈관 투과성 조절 작용을 통한 미세혈관 내 염증성 삼출물 감소, 피하 어탁瘀濁 제거 및 조직 회복 촉진","①건비화탁 · 삼습배탁 健脾化濁 · 滲濕排濁 의이인 하엽 비위의 운화기능을 강화하여 내부의 탁사를 화해化解하고 습을 원활히 배출함","②청열해독 · 통락소종 淸熱解毒 · 通絡消腫 백화사설초 노봉방 피부 깊숙이 침투한 열독熱毒과 심각한 염증성 독소를 제거함","③소풍지양 · 거풍조습 疏風止癢 · 祛風燥濕 부평 백선피 지부자 체표의 풍열風熱 및 습사濕邪를 발산시켜 극렬한 피부 가려움증을 해소함","④양혈화어 · 청열통락 涼血化瘀 · 淸熱通絡 백모근 적작약 혈분血分의 열을 식히고 혈맥의 정체된 어탁瘀濁을 제거하여 기혈순환을 조화롭게 함","건비화탁健脾化濁과 승청강탁 비위 운화를 강화하고 습탁을 체외로 배출함","청열해독과 통락소종通絡消腫 피부 깊숙한 염증성 독소를 해소함","소풍거습疏風祛濕과 가려움 해소 상중하초의 풍열과 습사를 발산시킴","양혈화어涼血化瘀와 혈탁 제거 혈분의 열을 식히고 혈맥의 어탁을 소통시킴","Viral Warts 편평사마귀·전염성 물사마귀 등 바이러스성 피부질환 주치에 편평사마귀와 전염성 물사마귀가 포함되어 있으나 편평사마귀는 사람유두종바이러스(HPV), 물사마귀는 폭스바이러스로 원인이 다름 질환별로 나누어 소아·다발성 병변의 병변 소실률을 정리하는 증례 분석이 개발 가능성을 판단하는 첫 단계 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2007, 화탁법의 피부과 활용), 본문 주치증)","Antiviral Herbs 백화사설초·노봉방의 항바이러스·항염 작용 백화사설초와 노봉방의 항바이러스 활성은 편평사마귀에는 HPV 관련 세포 모델로, 물사마귀에는 폭스바이러스 모델로 나누어 확인함 이를 통해 ‘청열해독’이 사마귀 치료에서 갖는 의미를 구체화 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 2 「청열해독과 통락소종」, 본문 조성표)","Itch & Papule 구진성 두드러기·편평태선의 가려움 억제 부평·백선피·지부자의 지양 작용을 가려움 모델에서 정량화함 구진성 두드러기 등 가려움이 주증상인 질환에 대한 효과를 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「소풍구습과 가려움 해소」)","Turbidity Concept ‘탁사濁邪’의 대사적 해석과 하엽·의이인 역할 하엽·의이인의 화탁 작용을 피부 지질 대사 이상과 연결하는 가설을 세움 비만·대사 이상 동반 피부질환 환자에서 효과 차이를 탐색 (근거 유형 : 임상 경험 보고 | 근거: R&D 논리 1 「건비화탁과 승청강탁」, 참고문헌 [1])"],"ss":{"composition":"그림 2-12 화탁녕부탕化濁寧膚湯의 모듈 구성 ①건비화탁健脾化濁, 삼습배탁滲濕排濁 모듈 — 비위의 운화기능을 강화하여 내부의 탁사를 화해化解하고 습을 원활히 배출함 의이인, 하엽 : 의이인이 건비삼습健脾滲濕, 화탁化濁하여 정기를 손상시키지 않으면서 습탁을 배출하고, 하엽이 청향승산淸香升散, 건비승양健脾升陽하여 중초의 승청강탁升淸降濁을 도와, 기혈순환을 깨우고 체내에 엉킨 어혈과 탁사를 효율적으로 풀어줌 ②청열해독淸熱解毒, 통락소종通絡消腫 모듈 — 피부 깊숙이 침투한 열독熱毒과 심각한 염증성 독소를 제거함 백화사설초, 노봉방 : 백화사설초가 청열해독, 이습화탁利濕化濁하여 옹종창독癰腫瘡毒을 풀고, 노봉방이 가볍고 신속하게 뚫고 나가는 성질로 경락과 혈락을 뚫어 내외의 옹저癰疽, 풍라風癩, 풍진風疹, 가려움증을 통락해독通絡解毒함 ③소풍지양疏風止癢, 거풍조습祛風燥濕 모듈 — 체표의 풍열風熱 및 습사濕邪를 발산시켜 극렬한 피부 가려움증을 해소함 부평, 백선피, 지부자 : 부평이 경청선산輕淸宣散하는 성질로 상초와 체표의 풍열을 제거하여 소풍산열화탁疏風散熱化濁하고, 백선피가 기성행산氣腥行散하는 특성으로 근육과 체표 사이의 습열을 밖으로 끌어내어 거풍조습祛風燥濕, 청열화탁淸熱化濁하며, 지부자가 하초와 체표를 연결하며 청열리습淸熱利濕, 거풍화탁祛風化濁하고, 이 약들이 상중하로 협력하여 피부 풍진風疹과 극심한 가려움증을 근본적으로 제어함 ④양혈화어涼血化瘀, 청열통락淸熱通絡 모듈 — 혈분血分의 열을 식히고 혈맥의 정체된 어탁瘀濁을 제거하여 기혈순환을 조화롭게 함 백모근, 적작약 : 백모근이 혈분에 들어가 양혈청열화탁涼血淸熱化濁하여 자반 및 출혈성 반진을 다스리고, 적작약이 혈분에 작용하여 활혈거어통락活血祛瘀通絡하여 혈액 정체로 인한 병리적 변화와 피부병변의 삼출물을 제거함","master":"①피부질환의 핵심 병기로서 “탁사濁邪”와 “탁증濁證”에 대한 독창적 인식 대사는 각종 피부질환이 단순히 풍, 열, 습, 독에 그치지 않고, 이들이 장기간 지체되어 형성된 탁사濁邪가 피부와 피하 조직에 결합하여 발병한다는 “탁병濁病 이론”을 제시함. 따라서 탁사를 제거하는 “화탁법化濁法”을 피부과 치료의 근본 원칙으로 삼아, 단순 청열리습淸熱利濕 위주의 기존 치료의 한계를 극복함 ②승청강탁升淸降濁과 통락해독通絡解毒을 융합한 공수겸비의 약물 배합 하엽과 부평으로 상초와 체표의 막힌 청기淸氣를 선발宣發, 승청하여 탁사를 제거하고, 의이인, 지부자, 백모근으로 하초의 습탁을 소변으로 배출하여 강탁降濁하며, 노봉방과 적작약으로 혈락血絡의 어탁瘀濁을 뚫어 통락하는 정밀한 승강통락升降通絡 구조를 구축함 ③다양한 피부과 난치 병증으로의 광범위한 확장성과 임상 가감의 유연성 본 방제는 탁사와 혈탁血濁에 기인한 다양한 피부 질환 치료에 기본방으로 활용됨 구강 편평태선扁平苔蘚(혈탁血濁, 음허陰虛, 습곤濕困) : 화탁녕부탕에 산수유15g, 석곡15g, 생지황10g, 적소두30g을 추가 배오함 단독丹毒(열독혈탁熱毒血濁) : 화탁녕부탕에 야국화15g, 비해10g, 황백10g, 인동등15g, 토복령15g을 추가 배오함 대상포진(열독혈탁熱毒血濁) : 화탁녕부탕에 포공영15g, 판람근15g, 토복령15g을 추가 배오함 결절성 양진癢疹(혈탁血濁, 간울肝鬱) : 화탁녕부탕에 고삼10g, 전갈6g, 홍화6g, 백질려10g, 적작약10g을 추가 배오함 수선手癬(습열혈탁濕熱血濁) : 화탁녕부탕에 생지탄10g, 형개수6g을 추가 배오함 천포창天皰瘡(혈탁血濁, 기혈휴허氣血虧虛) : 화탁녕부탕에 자초10g, 선인두仙人頭10g, 황기30g, 천화분10g, 태자삼15g을 추가 배오함 IgA 혈관염(혈탁내정血濁內停, 혈열망행血熱妄行) : 화탁녕부탕에 옥미수玉米須6g, 차전초30g, 천초탄10g, 지유탄10g, 우절탄20g을 추가 배오함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 난치성 피부질환 대상 경험방으로 공개자료상 제품·특허가 확인되지 않아, 사마귀 등 단일 질환으로 좁힌 증례 연구가 첫 단계 참고문헌 [1] 왕신루.화탁법의 피부과 질환에 대한 활용化濁法在皮膚科疾病中的運用[J].톈진중의약天津中醫藥,2007,(3):177-180."}},{"id":"2-13","ko":"귀작생혈탕","hz":"歸芍生血湯","alias":"","master_ko":"왕례","master_hz":"王烈","tagline":"소아의 기혈을 조율하여 혈소판 감소와 출혈을 치료하는 처방","meta":{"주요 적응증":"소아 면역성 혈소판감소증","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":140,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-13 귀작생혈탕歸芍生血湯의 모듈 구성<\/p><h4>①건비익기健脾益氣, 보익기혈補益氣血 모듈 — 비위와 기혈을 보익하여 생화의 원천을 구축함<\/h4><p><b>대조, 영지<\/b>: 대조가 건비익기健脾益氣하여 후천지본인 비위의 기혈 생화 기능을 보강하고, 영지가 보익기혈補益氣血 및 면역 조절 작용을 수행하여 항병력을 높이고 정기를 충만하게 함<\/p><h4>②자음유간滋陰柔肝, 양혈윤조養血潤燥 모듈 — 음혈을 자양하고 간신을 보강하여 혈액 생성의 기초를 다짐<\/h4><p><b>당귀, 백작약, 숙지황<\/b>: 당귀가 양혈화혈養血和血하고, 백작약이 자음유간滋陰柔肝하여 근육과 혈락을 유연하게 하며, 숙지황이 자음보혈滋陰補血하여 정혈精血을 충만하게 하고 휴허虧虛를 근본적으로 다스림<\/p><h4>③지혈생기止血生肌, 수복혈락修復血絡 모듈 — 손상된 혈락을 수복하고 출혈 경향을 신속히 차단함<\/h4><p><b>백급, 아교<\/b>: 백급이 지혈생기止血生肌하여 국소 출혈 부위와 손상된 혈락을 수복하고, 아교가 지혈양음止血養陰하여 혈액이 맥 외로 넘쳐나는 것을 방지함<\/p><h4>④행수소종行水消腫, 활혈통락活血通絡 모듈 — 수습을 배출하고 어혈의 정체를 풀어 경락을 소통함<\/h4><p><b>적소두<\/b>: 적소두가 행수소종行水消腫하는 동시에 활혈통락活血通絡을 겸하여 어혈이 경락을 막는 어혈조락瘀血阻絡을 효과적으로 풀어내고 미세혈관의 순환을 개선함<\/p>"},{"k":"master","t":"왕례의 소아 면역성 혈소판 감소증 치료","html":"<h4>①비허불통혈脾虛不統血을 근본으로 한 병리기전 체계화<\/h4><p>본 질환의 핵심 근본 병기를 비허불통혈脾虛不統血로 규정함. 소아는 치음치양稚陰稚陽 체질 특성상 비위 발달이 미숙하여 외감外感, 음식의 부절제, 질병 후 조리의 부적절로 비기휴허脾氣虧虛가 유발되기 쉬움. 비허로 통섭력統攝力을 잃으면 혈액이 맥 외로 출탈해 어점어반瘀點瘀斑이 반복되며, 구병과 재발성 출혈은 ‘구병입락久病入絡, 낙병급장絡病及臟’의 복잡한 병리를 형성함. 여기에 외감열독外感熱毒, 정지실조情志失調, 음허내열陰虛內熱로 인한 혈열망행血熱妄行, 출혈 누적으로 발생하여 재출혈을 부르는 음혈휴허陰血虧虛, 그리고 정혈 결핍과 기기문란氣機紊亂으로 미세순환을 장애하고 혈락을 손상시키는 간신부족肝腎不足, 낙맥실양絡脈失養이 복합적으로 작용하여 병이 지연된다고 파악함<\/p><h4>②기혈동조氣血同調 및 보이불조補而不燥, 양음이불니養陰而不膩의 약재 배오<\/h4><p>기혈양허氣血兩虛, 어혈조락瘀血阻絡의 지연, 회복기에 적용함. 당귀, 숙지황, 백작약으로 간신肝腎과 영혈營血을 자양하고, 적소두로 활혈통락活血通絡하며, 백급, 아교로 혈락血絡을 수복하고, 대조, 영지로 비위의 기혈을 보함. 소아 체질을 고려하여 보하되 메마르지 않고, 음을 자양하되 끈적이지 않게 기혈과 장부를 온화하게 조율함<\/p><h4>③‘치비위治脾胃’를 통한 기혈 생화 원천 복구 및 근본 치료(치본治本)<\/h4><p>‘비위는 기혈생화氣血生化의 원천’이라는 이론에 기반하여 비위 기능의 회복을 생혈生血의 으뜸으로 삼음. 당귀, 숙지황, 백작약의 양혈윤조養血潤燥, 대조의 건비익기健脾益氣, 적소두의 삼습활혈滲濕活血, 백급, 아교의 지혈생기止血生肌, 영지의 기혈보익氣血補益 및 면역조절을 상호 협력시켜 비위의 운화와 통섭을 되살림. 구병으로 인한 ‘기혈생화무원氣血生化無源’의 악순환을 끊어내어 혈액 생성 장애를 교정하고 환아의 체질적 약점을 근본적으로 개선함<\/p><h4>④‘치혈필선조간신治血必先調肝腎’ 및 전인적 장부 조율<\/h4><p>간장혈肝藏血, 신주정생수腎主精生髓의 원칙에 따라 혈소판 생성과 유지에 간신肝腎 조율이 필수적임을 강조함. 당귀, 숙지황, 백작약으로 유간양혈柔肝養血, 자보간신滋補肝腎하고, 영지, 적소두, 백급, 아교를 통해 미세순환 개선, 혈락 수복, 면역 림프계 조절을 동시에 달성함. 이는 현대 의학의 미세순환 정상화 및 면역 항상성 회복 기전과 연결 지어 해석할 수 있음<\/p><h4>⑤병기 단계 및 동반 증상별 정밀 변증 가감 체계<\/h4><p><b>급성기(혈열망행血熱妄行)<\/b>: 출혈성 반진이 선홍색을 띠고 코피, 잇몸출혈, 설홍태황, 맥삭이 동반되면 천초, 목단피, 생지황, 지유, 측백엽을 가하여 청열양혈지혈淸熱涼血止血함. 발열, 번조煩躁가 심하면 황련을 가하여 청열사화淸熱瀉火함<\/p><p><b>지연, 회복기(기혈구허氣血俱虛, 간신부족肝腎不足)<\/b>: 면색 위황萎黃, 생화부족生化不足에 황기, 당삼을 가하고, 요슬산연腰膝酸軟, 야매불안夜寐不安 등 간신부족에는 구기자, 산약을 추가함<\/p><p><b>기체어혈氣滯瘀血(어반瘀斑, 암자색)<\/b>: 단삼, 홍화를 가하여 활혈화어통락活血化瘀通絡함<\/p><p><b>비허습성脾虛濕盛(식욕부진, 배가 더부룩하고 변이 묽은 복창변당腹脹便溏)<\/b>: 백출, 복령을 가하여 건비리습健脾利濕함<\/p><p><b>음허도한陰虛盜汗(야간 도한)<\/b>: 맥문동, 오미자를 가하여 양음렴한養陰斂汗함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">소아 면역성 혈소판 감소증은 희귀질환으로, 표준치료 병용 시 혈소판 수 회복을 보는 소규모 연구로 접근하는 것이 현실적<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕웨이,쉐린,왕례.국의대사 왕례 교수 경험방 귀작생혈탕의 소아 면역성 혈소판감소증 임상 치료 경험國醫大師王烈教授經驗方劑歸芍生血湯治療兒童免疫性血小板減少症臨證經驗[J].중국의약과학中國醫藥科學,

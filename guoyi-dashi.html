 황기의 기혈쌍보氣血雙補, 활혈행기活血行氣 및 골 미세순환 개선, 항염증 효과를 규명 백출, 복령, 산약, 生감초의 익기건비 작용과 장-뇌-골 상호작용 및 시상하부-뇌하수체 축 조절을 통한 미량원소 흡수와 골대사 조절 가능성을 탐색함","①보신양간 · 강근장골 補腎養肝 · 强筋壯骨 산수유 숙지황 음양곽 골쇄보 보골지 녹함초 신정과 간혈을 채우고 근골을 강화하여 골격의 근본을 충실히 세움","②익기건비 · 배후천지본 益氣健脾 · 培後天之本 황기 당귀 백출 복령 산약 시호 박하 향부자 울금 비위의 운화 기능을 살리고 기혈 생성을 촉진하여 후천의 영양 기반을 다짐","③조기화혈 · 활혈거어 調氣和血 · 活血祛瘀 지실 백작약 단삼 천궁 감초 기기를 소통시키고 어혈을 제거하여 전신 및 골 미세순환을 개선함","보신양간補腎養肝과 강근장골强筋壯骨 정수를 채우고 근골을 강화함","소간리기疏肝理氣와 기기 소조 간의 소설 기능을 회복하고 정서와 수면장애를 개선함","기혈쌍보氣血雙補와 활혈거어活血祛瘀 기혈을 채우고 골 미세순환을 개선함","익기건비益氣健脾와 후천 보양 비위 운화를 살리고 미량원소 흡수를 도움","Postmenopausal Osteoporosis 폐경 후 골다공증의 골밀도·골대사 지표 폐경 후 골다공증 임상 치료 경험이 있음 골밀도(DXA)와 골대사 표지자(CTX·P1NP)를 지표로 한 탐색 임상으로 시작하고 칼슘·비타민 D 기본 치료를 공통으로 적용하며, 골밀도 변화만으로 골절 위험 감소를 판단하지 않고 다른 골다공증 약물 사용은 군 간 동등하게 관리 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2022, 폐경 후 골다공증 임상 경험))","Mood–Bone Link 우울·수면장애 동반 골다공증 환자 소간 약재군(시호·향부자·울금·박하)의 정서·수면 개선 효과를 골다공증 환자의 우울· 수면 척도(PSQI)와 함께 평가함 아울러 ‘간울’과 골소실의 연관을 탐색 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 2 「소간리기와 기기 소조」)","Bone Perfusion 활혈 약재의 골내 혈류와 골형성 단삼·천궁·당귀의 활혈 작용이 골내 혈류와 골형성에 미치는 영향을 확인함 난소절제 랫드에서 골 미세구조(micro-CT)와 함께 측정 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 3 「기혈쌍보와 활혈거어」)","Formula Simplification 20종 대처방의 보신 모듈 중심 단순화 20종으로 구성된 대처방임 보신장골 모듈(산수유·숙지황·골쇄보·보골지·음양곽·녹함초)과 전체 처방의 효과를 비교하여 개발 가능한 최소 조성을 찾는 것이 선행 과제 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2024, 소조건골탕 고찰), 본문 조성표)"],"ss":{"composition":"그림 3-4 소조건골탕疏調健骨湯의 모듈 구성 ①보신양간補腎養肝, 강근장골强筋壯骨 모듈 — 신정과 간혈을 채우고 근골을 강화하여 골격의 근본을 충실히 세움 산수유, 숙지황, 음양곽 : 산수유가 산삽미온酸澁微溫한 성질로 평보간신平補肝腎, 삽정고원澁精固元하여 간과 신장을 고르게 보하고 정기를 지키며, 숙지황이 자신수滋腎水, 전골수塡骨髓하여 신음과 혈을 채우고, 음양곽이 보신조양補腎助陽, 강근골强筋骨하여 신장의 양기와 근골을 강화함 골쇄보, 보골지, 녹함초 : 골쇄보가 온보신장溫補腎臟, 치절상治折傷하여 신장을 보하고 손상된 골격 회복을 도우며, 보골지가 난명문暖命門, 고하원固下元하여 하초의 원기를 따뜻하게 다지고, 녹함초가 첨정보수添精補髓하여 정수와 골수를 보충함. 이 약재들은 골대사 표적 작용을 통해 골밀도 저하와 골통증을 직접 개선함 ②익기건비益氣健脾, 배후천지본培後天之本 모듈 — 비위의 운화 기능을 살리고 기혈 생성을 촉진하여 후천의 영양 기반을 다짐 황기, 당귀 : 황기가 폐로 들어가 보기승양補氣升陽하여 원기를 보하고, 당귀가 통심생혈通心生血, 양혈활혈養血活血하여 황기와 함께 기혈을 동시에 채움 백출, 복령, 산약 : 백출이 보기건비補氣健脾, 조습리수燥濕利水하여 비위의 운화 기능을 살리고, 복령이 삼습건비滲濕健脾, 영심안신寧心安神하며, 산약이 보폐기補肺氣, 보신기補腎氣하여 기혈의 생성을 도움 ③조기화혈調氣和血, 활혈거어活血祛瘀 모듈 — 기기를 소통시키고 어혈을 제거하여 전신 및 골 미세순환을 개선함 시호, 박하, 향부자, 울금 : 시호가 소간리기疏肝理氣, 승발청양升發淸陽하여 울체된 간기와 기혈을 펼치고, 박하가 신량소간辛涼疏肝하여 간열을 다스리며, 향부자가 통행십이경通行十二經하여 꽉 막힌 기운을 뚫어주고, 울금이 간울肝鬱을 풀고 하기파혈下氣破血하여 기혈 순환을 촉진함 지실, 백작약 : 지실이 파기체破氣滯, 화담소적化痰消積하여 체한 기운을 깨뜨리고, 백작약이 간액肝液을 수렴하고 완급지통緩急止痛하여 치솟는 간기운을 누르고 통증을 완화함 단삼, 천궁 : 단삼이 거체생신祛滯生新, 통경지통通經止痛하여 요척통증을 풀고 어혈을 제거하며, 천궁이 활혈행기活血行氣, 거풍통락祛風通絡하여 뼈 주변 경락의 어혈을 풀어줌 감초 : 약성을 완화하고 제약을 조화롭게 조절하여 비위 손상을 막는 사약使藥으로 작용함","master":"①병인병기 인식 — 신허위본腎虛爲本, 간울비허肝鬱脾虛 및 기체혈어氣滯血瘀의 간, 비, 신 합병 신수충골腎水充骨, 신허腎虛가 발병의 기초 : 《소문·육절장상론》의 ‘신자腎者, 주칩봉장지본主蟄封藏之本... 기충재골其充在骨’에 근거함. 노화 및 신체 변화로 신기腎氣가 쇠퇴하고 신정腎精이 고갈되면 골수骨髓를 영양하지 못함. 이는 골다공증 발병의 핵심 기초가 됨 간목유근肝木有根, 간허肝虛가 관건 : 호르몬 변화, 노화, 심리적 스트레스는 간음혈肝陰血의 부족과 간울기체肝鬱氣滯를 유발함. 간혈이 부족하면 근맥이 오그라들고 관절 운동이 불리해지며, 수불함목水不涵木으로 골위骨痿가 가중됨 비토배육脾土培育, 비허脾虛가 주요 환경 : 비는 근육과 사지를 관장함. 비위 운화 장애는 기혈 화생을 막아 근골을 기르지 못하며, 현대의학적으로 ‘시상하부-뇌하수체 축’ 이상 및 골 미세순환 장애, 미량원소 흡수 장애와 연결 지어 해석되며, 뼈의 취약성을 높일 수 있다고 봄 기체혈어氣滯血瘀 : 정서 자극과 과도한 생각으로 기기氣機가 체하면 ‘기위혈지수氣爲血之帥’의 원리로 어혈이 형성되어, 고정된 위치의 완고한 요통과 관절통을 유발함 ②치료 원칙 — 소조기기법疏調氣機法 및 ‘일체양익一體兩翼’의 정밀 적용 소조기기 치법의 현대적 의미 : 전통 ‘팔법八法’ 중 화법和法을 ‘조기調氣’ 중심으로 재해석함. 인체의 기는 선천지기先天之氣, 지기地氣(비위의 기), 천기天氣(폐의 기)의 합성물로, 기기의 승강출입이 원활해야 청탁淸濁이 나누어지고 음양의 균형이 유지된다고 봄 일체양익一體兩翼의 가변적 적용: 일반 기기 조율 : 간의 소설疏泄 기능을 체體(몸통)로 삼고, 비의 운화運化와 신의 봉장封藏을 양측 익翼(날개)으로 삼는 ‘간위체肝爲體, 비신위익脾腎爲翼’ 전략을 취함 골다공증 특화 적용 : 골격 질환의 특성상 신정휴허腎精虧虛를 체體(몸통)로 삼아 보신익정補腎益精, 전수충골塡髓充骨을 최우선으로 하고, 간과 비의 기기 조율을 익翼(양 날개)으로 삼아 후천을 다스리고 간혈을 기르는 ‘신위체腎爲體, 간비위익肝脾爲翼’ 전략을 구사함 사역산四逆散 기반의 가감 : 간비불화肝脾不和를 치료하는 사역산을 통용 기초방으로 삼고, 여기에 골다공증의 병리에 맞춰 보신장골補腎壯骨, 익기활혈益氣活血 약재를 종합적으로 배오함 ③배오의 특징 승강동용升降同用, 간비병조肝脾並調 : 시호, 향부자, 울금의 간기승발肝氣升發과 백출, 복령, 산약의 비위운화脾胃運化, 하강下降을 결합하여 ‘토득목이달土得木而達’의 기전을 실현함 양간보신養肝補腎, 삽정고원澁精固元 : 숙지황, 골쇄보, 보골지, 음양곽, 녹함초로 정수精髓를 채우고, 산수유로 삽정고원澁精固元하여 정기와 신정을 지키며 수해髓海를 충실히 함 기혈쌍보氣血雙補, 중재조기重在調氣 : 당귀, 황기로 기혈을 보하되 시호, 향부자, 천궁으로 기를 소통시켜 ‘보이불체補而不滯’의 효능을 이룸 조창기기調暢氣機, 완급지통緩急止痛 : 향부자, 울금, 박하로 삼초 기기를 통하게 하고 사역산의 배오를 더해 완급지통의 효능을 극대화함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 골다공증은 국내 고령 인구 증가로 수요가 크며, 골밀도 지표를 이용한 동물 연구로 개발 가능성을 먼저 확인할 수 있음 참고문헌 [1] 루자친,왕쥐안,친주.장전의 소조건골탕에 대한 고찰張震疏調健骨湯之淺析[J].후베이중의잡지湖北中醫雜志,2024,46(6):32-35. [2] 딩차오양,장진이,샹링옌,등.장전 교수의 “소조기기” 이념에 따른 폐경 후 골다공증 임상 치료 경험張震教授“疏調氣機”理念論治絕經後骨質疏松症臨證經驗[J].중국민족민간의약中國民族民間醫藥,2022,31(13):77-81."}},{"id":"3-5","ko":"조보료위탕","hz":"調補療痿湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"비, 신, 폐를 조율하고 기혈을 보충하여 중증근무력증을 치료하는 처방","meta":{"주요 적응증":"중증근무력증, 위증痿證","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":181,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-5 조보료위탕調補療痿湯의 모듈 구성<\/p><h4>①중초의 건비익기健脾益氣, 양기기위養肌起痿 모듈 — 비위를 튼튼하게 하고 기를 북돋우며, 근육을 기르고 무력해진 증상을 회복시킴<\/h4><p><b>황기, 태자삼, 백출, 산약<\/b>: 황기는 비위의 기를 크게 북돋워 튼튼하게 하고 양기를 위로 끌어올려 인체의 방어력을 높이며, 태자삼은 기를 더하고 진액을 생성하여 폐를 촉촉하게 하며, 백출은 비위의 운화 작용을 돕고, 산약은 중초를 보하며 근육을 자라게 하여 사지 근육을 기르는 핵심 축을 이룸<\/p><h4>②하초의 온신전정溫腎塡精, 강근건골强筋健骨 모듈 — 하초 신양을 따뜻하게 하고 정수를 채워 뼈와 근육을 튼튼하게 함<\/h4><p><b>산수유, 파극천, 음양곽, 녹각편<\/b>: 산수유가 음을 자양하여 녹각편과 파극천의 온조함을 제어하고, 파극천과 음양곽이 신양을 따뜻하게 보하고 근골을 강하게 하며, 녹각편이 정수를 더하고 골수를 채워 하초의 원기를 굳건히 함<\/p><h4>③소간리기疏肝理氣, 활혈통락活血通絡 모듈 — 간의 울체된 기운을 풀고 기혈을 소통시켜 어혈과 담탁을 제거함<\/h4><p><b>시호, 당귀<\/b>: 시호가 청양淸陽을 위로 끌어올리고 간의 울체된 기운을 소통시키고, 당귀가 혈을 보하고 혈액 순환을 활발하게 하여 기혈을 함께 소통시킴<\/p><p><b>감초<\/b>: 약성을 조화롭게 통제하고 조율함<\/p>"},{"k":"master","t":"장전의 중증근무력증 치료","html":"<h4>①병인병기 인식 — “장부허손臟腑虛損이 본本이고, 실사實邪가 표標”<\/h4><p><b>비, 신, 폐의 허虛가 발병 기초<\/b>: 《소문·태양양명론》과 《소문·역조론》에 근거함. 비위는 후천지본으로 운화가 원활하지 않으면 사지가 수곡정미를 얻지 못해 위약痿弱해짐. 폐는 기를 주관하며 비위가 허하면 폐기肺氣가 먼저 소실되어 선발숙강宣發肅降이 실상失常됨. 신은 선천지본으로 정혈精血이 부족하면 수해髓海가 비어 골고骨枯와 근위筋痿를 유발함<\/p><p><b>습濕, 열熱, 담痰, 어瘀가 서로 엉킨 실사實邪<\/b>: 비허로 생성된 습사濕邪가 울구화열鬱久化熱하여 습열교증濕熱交蒸을 이루고, 기허氣虛로 추동무력推動無力하여 담탁痰濁과 어혈瘀血이 내생함. “인허치실因虛致實, 인실가중因實加重”의 악순환을 형성하며 완고난유頑固難愈의 원인이 됨<\/p><h4>②치료 원칙 — “조기허실調其虛實, 화기순역和其順逆”의 치법<\/h4><p>삼초 연동 입체 조율 모델:<\/p><p class=\"sub\"><b>중초건비中焦健脾<\/b>: 황기와 태자삼으로 중초의 기를 보충하여 에너지 대사를 촉진함<\/p><p class=\"sub\"><b>하초온신下焦溫腎<\/b>: 파극천과 녹각편으로 하초의 양기를 돕고 골격근의 증식을 자극함<\/p><p class=\"sub\"><b>상초소간上焦疏肝<\/b>: 시호로 상초의 울체를 풀고 기기를 소통시켜 상, 중, 하 삼초를 아우르는 입체 구조를 형성함<\/p><p><b>보허補虛와 거사祛邪의 병행<\/b>: 보기건비補氣健脾, 보신전정補腎塡精으로 허손虛損을 다스리는 동시에 청열거습淸熱祛濕, 화담거어化痰祛瘀를 겸하여 실사實邪를 제거하고 경락을 통하게 함<\/p><h4>③배오의 특징<\/h4><p><b>비, 신, 폐를 동시에 조절<\/b>: 근육, 골수, 기를 주관하는 비, 신, 폐를 동시에 보익하여 오장전변五臟轉變을 막고 근본적인 생화 지원을 확보함<\/p><p><b>승강기기升降氣機의 병용<\/b>: 시호의 승발升發과 비위 운화약의 운화작용을 결합하여 승청강탁升淸降濁을 도모하고 기기의 승강출입을 원활하게 함<\/p><p><b>한열평조寒熱平調, 표본겸치標本兼治<\/b>: 온조溫燥한 녹각편, 파극천에 자음滋陰의 산수유를 배합하고, 보기약에 활혈약을 더해 “보이불체補而不滯”와 “청열이불상정淸熱而不傷正”의 묘미를 구현함<\/p><p><b>가감<\/b>: 음허陰虛에 숙지황, 백합, 양허陽虛에 부자, 육종용, 내풍진전內風震顫에 석결명, 구등, 담몽심규痰蒙心竅에 석창포, 원지를 더함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">중증근무력증 대상 처방이 3종(황기복방·강기건력음·조보료위탕)이므로, 국내에서는 근거가 가장 많은 황기복방을 우선하고 이 처방은 비교군으로 활용하는 것이 효율적. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 리이진,주젠핑,리청위,등.국의대사 장전의 조보료위탕을 활용한 중증근무력증 치료 경험國醫大師張震運用調補療痿湯治療重症肌無力經驗[J].윈난중의중 약잡지雲南中醫中藥雜志,2026,47(7):1-5.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"황기","name":"황기","dose":"","base":"황기"},{"raw":"태자삼","name":"태자삼","dose":"","base":"태자삼"},{"raw":"백출","name":"백출","dose":"","base":"백출"},{"raw":"산약","name":"산약","dose":"","base":"산약"},{"raw":"시호","name":"시호","dose":"","base":"시호"},{"raw":"당귀","name":"당귀","dose":"","base":"당귀"},{"raw":"산수유","name":"산수유","dose":"","base":"산수유"},{"raw":"파극천","name":"파극천","dose":"","base":"파극천"},{"raw":"음양곽","name":"음양곽","dose":"","base":"음양곽"},{"raw":"녹각편","name":"녹각편","dose":"","base":"녹각편"},{"raw":"감초","name":"감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["비위의 기를 크게 북돋워 튼튼하게 하고, 인체의 방어력을 높이며 양기를 위로 끌어올림(대보비위大補脾胃, 승양고표升陽固表)","비, 신,  양기기위養肌起痿","body":"하초 신양을 따뜻하게 하고 정수를 채워 뼈와 근육을 튼튼하게 함"},{"n":"3","title":"소간리기疏肝理氣와 활혈통락活血通絡","body":"간의 울체된 기운을 풀고 기혈을 소통시켜 어혈과 담탁을 제거함"},{"n":"4","title":"삼초 연동 입체 조율과 표본겸치","body":"비, 신, 폐를 동시에 보익하고 거사와 보허를 병행하여 난치성 위증을 제어함"}],"field":3,"pages":[181,184],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["3-5","조보료위탕","調補療痿湯","","장전","張震","비, 신, 폐를 조율하고 기혈을 보충하여 중증근무력증을 치료하는 처방","황기 태자삼 백출 산약 시호 당귀 산수유 파극천 음양곽 녹각편 감초","","핵심 효능 비위의 기를 크게 북돋워 튼튼하게 하고, 인체의 방어력을 높이며 양기를 위로 끌어올림(대보비위大補脾胃, 승양고표升陽固表) 비, 신, 폐를 보익하여 근육을 자양하고 위약한 증상을 치료함(보익비신폐補益脾腎肺, 양기기위養肌起痿) 간의 울체된 기를 소통시키고 기혈을 조화롭게 다스림(소간리기疏肝理氣, 조화기혈調和氣血) 신의 양기를 따뜻하게 보하고 정수와 골수를 채워 근골을 강하게 함(온보신양溫補腎陽, 전정익수塡精益髓)","주치증 중증근무력증 및 각종 위증痿證의 비신양허脾腎兩虛, 폐기부족肺氣不足, 기혈휴허氣血虧虛, 담어조락痰瘀阻絡 증형","연구 확장 영역 중증근무력증, 구음장애構音障礙와 연하장애, 호흡마비, 안검하수 및 각종 만성 소모성 근육 질환","R&D 포인트 황기다당류의 면역 조절 및 근력 강화 작용, 아트락틸레놀라이드(Atractylenolide)의 소화 효소 활성화 및 비위 운화 기능 개선 효과 검증 산약 점액 단백질의 대사조절을 통한 에너지 대사 개선 기전 규명 시호 사포닌의 항염증 및 콜린성 신경 조절 작용과 음양곽 이카리인(Icariin)의 아세틸콜린 수용체 발현 조절 효과를 탐색함 녹각 펩타이드의 골격근 세포 증식 촉진 및 보신장골補腎壯骨 작용 검증","①중초의 건비익기 · 양기기위 健脾益氣 · 養肌起痿 황기 태자삼 백출 산약 비위를 튼튼하게 하고 기를 북돋우며, 근육을 기르고 무력해진 증상을 회복시킴","②하초의 온신전정 · 강근건골 溫腎塡精 · 强筋健骨 산수유 파극천 음양곽 녹각편 하초 신양을 따뜻하게 하고 정수를 채워 뼈와 근육을 튼튼하게 함","③소간리기 · 활혈통락 疏肝理氣 · 活血通絡 시호 당귀 감초 간의 울체된 기운을 풀고 기혈을 소통시켜 어혈과 담탁을 제거함","대보비위大補脾胃와 승양고표升陽固表 비위의 기를 크게 북돋우고 양기를 위로 끌어올림","보익비신폐補益脾腎肺와 양기기위養肌起痿 하초 신양을 따뜻하게 하고 정수를 채워 뼈와 근육을 튼튼하게 함","소간리기疏肝理氣와 활혈통락活血通絡 간의 울체된 기운을 풀고 기혈을 소통시켜 어혈과 담탁을 제거함","삼초 연동 입체 조율과 표본겸치 비, 신, 폐를 동시에 보익하고 거사와 보허를 병행하여 난치성 위증을 제어함","MG Case Series 중증근무력증 치료 경험의 체계적 증례 분석 근거 가 2026년 경험 보고 1편임 투여 환자의 QMG 점수·피리도스티그민 사용량 변화를 정리한 후향적 증례 분석으로 효과 신호를 먼저 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2026, 중증근무력증 치료 경험))","Kidney-tonifying Module 파극천·음양곽·녹각의 근력 보강 온신 모듈(파극천·음양곽·녹각편)의 근 피로 회복과 근섬유 보호 효과를 근력 저하 모델에서 확인함 이로써 ‘보신’이 근력에 기여하는지 분리 검증 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 2 「보익비신폐와 양기기위」)","Comparative Positioning 황기복방·강기건력음과의 차별점 같은 중증근무력증을 대상으로 하는 황기복방·강기건력음과 황기 대량 사용이라는 골격은 같고 소간(시호)·온신 약재 구성이 다름 세 처방을 같은 지표로 비교하면 각 처방에 맞는 환자군을 구분할 수 있음(문헌이 경험 보고 1편이므로 3방 임상 비교는 조성·용량·안전성을 먼저 확인한 뒤 단계적으로 검토) (근거 유형: 간접 근거 | 근거: 본문 조성표(3개 처방 비교))","Digestive Function 백출·산약의 소화 기능 개선과 순응도 장기 복용이 필요한 질환임 비위 운화 개선(식욕·복부 불편감)과 복약 순응도를 함께 평가하여 대용량 보익 처방의 실제 복용 가능성을 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1 「대보비위와 승양고표」)"],"ss":{"composition":"그림 3-5 조보료위탕調補療痿湯의 모듈 구성 ①중초의 건비익기健脾益氣, 양기기위養肌起痿 모듈 — 비위를 튼튼하게 하고 기를 북돋우며, 근육을 기르고 무력해진 증상을 회복시킴 황기, 태자삼, 백출, 산약 : 황기는 비위의 기를 크게 북돋워 튼튼하게 하고 양기를 위로 끌어올려 인체의 방어력을 높이며, 태자삼은 기를 더하고 진액을 생성하여 폐를 촉촉하게 하며, 백출은 비위의 운화 작용을 돕고, 산약은 중초를 보하며 근육을 자라게 하여 사지 근육을 기르는 핵심 축을 이룸 ②하초의 온신전정溫腎塡精, 강근건골强筋健骨 모듈 — 하초 신양을 따뜻하게 하고 정수를 채워 뼈와 근육을 튼튼하게 함 산수유, 파극천, 음양곽, 녹각편 : 산수유가 음을 자양하여 녹각편과 파극천의 온조함을 제어하고, 파극천과 음양곽이 신양을 따뜻하게 보하고 근골을 강하게 하며, 녹각편이 정수를 더하고 골수를 채워 하초의 원기를 굳건히 함 ③소간리기疏肝理氣, 활혈통락活血通絡 모듈 — 간의 울체된 기운을 풀고 기혈을 소통시켜 어혈과 담탁을 제거함 시호, 당귀 : 시호가 청양淸陽을 위로 끌어올리고 간의 울체된 기운을 소통시키고, 당귀가 혈을 보하고 혈액 순환을 활발하게 하여 기혈을 함께 소통시킴 감초 : 약성을 조화롭게 통제하고 조율함","master":"①병인병기 인식 — “장부허손臟腑虛損이 본本이고, 실사實邪가 표標” 비, 신, 폐의 허虛가 발병 기초 : 《소문·태양양명론》과 《소문·역조론》에 근거함. 비위는 후천지본으로 운화가 원활하지 않으면 사지가 수곡정미를 얻지 못해 위약痿弱해짐. 폐는 기를 주관하며 비위가 허하면 폐기肺氣가 먼저 소실되어 선발숙강宣發肅降이 실상失常됨. 신은 선천지본으로 정혈精血이 부족하면 수해髓海가 비어 골고骨枯와 근위筋痿를 유발함 습濕, 열熱, 담痰, 어瘀가 서로 엉킨 실사實邪 : 비허로 생성된 습사濕邪가 울구화열鬱久化熱하여 습열교증濕熱交蒸을 이루고, 기허氣虛로 추동무력推動無力하여 담탁痰濁과 어혈瘀血이 내생함. “인허치실因虛致實, 인실가중因實加重”의 악순환을 형성하며 완고난유頑固難愈의 원인이 됨 ②치료 원칙 — “조기허실調其虛實, 화기순역和其順逆”의 치법 삼초 연동 입체 조율 모델: 중초건비中焦健脾 : 황기와 태자삼으로 중초의 기를 보충하여 에너지 대사를 촉진함 하초온신下焦溫腎 : 파극천과 녹각편으로 하초의 양기를 돕고 골격근의 증식을 자극함 상초소간上焦疏肝 : 시호로 상초의 울체를 풀고 기기를 소통시켜 상, 중, 하 삼초를 아우르는 입체 구조를 형성함 보허補虛와 거사祛邪의 병행 : 보기건비補氣健脾, 보신전정補腎塡精으로 허손虛損을 다스리는 동시에 청열거습淸熱祛濕, 화담거어化痰祛瘀를 겸하여 실사實邪를 제거하고 경락을 통하게 함 ③배오의 특징 비, 신, 폐를 동시에 조절 : 근육, 골수, 기를 주관하는 비, 신, 폐를 동시에 보익하여 오장전변五臟轉變을 막고 근본적인 생화 지원을 확보함 승강기기升降氣機의 병용 : 시호의 승발升發과 비위 운화약의 운화작용을 결합하여 승청강탁升淸降濁을 도모하고 기기의 승강출입을 원활하게 함 한열평조寒熱平調, 표본겸치標本兼治 : 온조溫燥한 녹각편, 파극천에 자음滋陰의 산수유를 배합하고, 보기약에 활혈약을 더해 “보이불체補而不滯”와 “청열이불상정淸熱而不傷正”의 묘미를 구현함 가감 : 음허陰虛에 숙지황, 백합, 양허陽虛에 부자, 육종용, 내풍진전內風震顫에 석결명, 구등, 담몽심규痰蒙心竅에 석창포, 원지를 더함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 중증근무력증 대상 처방이 3종(황기복방·강기건력음·조보료위탕)이므로, 국내에서는 근거가 가장 많은 황기복방을 우선하고 이 처방은 비교군으로 활용하는 것이 효율적. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 리이진,주젠핑,리청위,등.국의대사 장전의 조보료위탕을 활용한 중증근무력증 치료 경험國醫大師張震運用調補療痿湯治療重症肌無力經驗[J].윈난중의중 약잡지雲南中醫中藥雜志,2026,47(7):1-5."}},{"id":"3-6","ko":"파녕1호방","hz":"帕寧1號方","alias":"","master_ko":"류쭈이","master_hz":"劉祖貽","tagline":"기양氣陽을 두루 펴고 습어濕瘀를 풀어내어 파킨슨병 및 그 합병증의 근맥 풍동風動을 진정시키는 처방","meta":{"주요 적응증":"파킨슨병","확인된 연구자료 유형":"경험 보고","제형·제품화":"동일 조성 특허 (심사 중)"},"page":185,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-6 파녕1호방帕寧1號方의 모듈 구성<\/p><h4>①온양보본溫陽補本 모듈 — 신양과 비양을 온보하여 전신 기양氣陽의 근본을 굳건히 함<\/h4><p><b>부자, 건강<\/b>: 부자가 온발신양溫發腎陽, 파침음한破沈陰寒하여 명문지화命門之火를 일으키고, 건강이 온중산한溫中散寒, 온비조양溫脾助陽하여 후천의 기혈 화생을 도움<\/p><p><b>백출, 자오가<\/b>: 백출이 건비익기健脾益氣, 조습화담燥濕化痰하여 운화를 돕고, 자오가가 익기건비益氣健脾, 보신안신補腎安神하여 선천과 후천을 동시에 보강함<\/p><h4>②평간식풍平肝息風, 서근통락舒筋通絡 모듈 — 간풍을 진정시키고 경락을 풀어 강직과 떨림을 완화함<\/h4><p><b>천마, 갈근<\/b>: 천마가 평간식풍平肝息風, 통락지통通絡止痛하여 머리와 경락의 풍사를 잡고, 갈근이 해기퇴열解肌退熱, 승발청양升發淸陽, 서근통락舒筋通絡하여 목과 지체의 강직을 풀어줌<\/p><p><b>백작약, 당귀<\/b>: 백작약이 양혈유간養血柔肝, 완급지통緩急止痛하여 근맥의 급박함을 누르고, 당귀가 양혈활혈養血活血, 조경통락調經通絡하여 혈행을 원활히 함<\/p><h4>③조화영위調和營衛, 잠양산결潛陽散結 모듈 — 영위를 조화롭게 하고 경락 깊은 곳의 어탁을 제거함<\/h4><p><b>계지, 별갑<\/b>: 계지가 온통경맥溫通經脈, 조화영위調和營衛하여 표리의 영위를 소통시키고, 별갑이 자음잠양滋陰潛陽, 연견산결軟堅散結하여 허화虛火가 위로 뜨는 것을 막고 음양의 균형을 맞춤<\/p><h4>④수풍통락搜風通絡, 조화제약調和諸藥 모듈 — 깊은 경락의 풍사를 끄집어내고 약성을 조율함<\/h4><p><b>오공<\/b>: 수풍통락搜風通絡, 공독산결攻毒散結하여 침범한 간풍과 어탁을 샅샅이 찾아 풀어줌<\/p><p><b>파극천, 炙감초<\/b>: 파극천이 온보신양溫補腎陽, 강근골强筋骨하며 약력을 신경腎經으로 이끌고, 炙감초가 익기화중益氣和中하며 여러 약재의 독성과 성질을 조화롭게 함<\/p>"},{"k":"master","t":"류쭈이의 파킨슨병 치료","html":"<h4>①“기양주용氣陽主用” 학술사상<\/h4><p>《소문·음양응상대론》의 “양화기陽化氣, 음성형陰成形” 이론에 기반을 둠. ‘기양氣陽’은 인체 생명의 온후溫煦 및 추진 작용에 중점을 두며, 이 양의 기능은 기의 운행과 밀접하므로 기양이라 칭함. 기양주용氣陽主用은 신기腎氣와 신양腎陽의 기화氣化 작용과 양의 생발生發, 부포敷布 기능을 중시함. 기양이 충만하고 잘 펼쳐져야 정기와 음혈이 생화되고 장부와 사지백해, 근맥이 영양을 얻음<\/p><p>신, 비, 간의 관계<\/p><p class=\"sub\"><b>근재어신根在於腎<\/b>: 기양의 뿌리는 신양에 있음. 신기는 성장의 기초이고 신양은 온후, 증화蒸化의 원동력이자 일신기양一身氣陽의 근본임<\/p><p class=\"sub\"><b>원재어비源在於脾<\/b>: 기양의 근원은 비양脾陽에 있음. 비위는 기혈생화의 원천이자 기기승강의 추뉴樞紐임. 비양이 건운健運해야 후천後天 수곡지기가 선천先天 신기를 계속 충양充養함<\/p><p class=\"sub\"><b>시재어간施在於肝<\/b>: 기양의 시행施行은 간양肝陽에 달렸음. 간은 체음이용양體陰而用陽하는 장부로, 간양이 불항불쇠不亢不衰해야 온후, 승발升發의 성질을 발휘함. 신의 봉장封藏 기능을 바탕으로 간양이 주도하여 전신 기기를 조달하고 근맥을 유화柔和하게 함<\/p><h4>②파킨슨병의 병인병기<\/h4><p>양기휴허陽氣虧虛, 근맥실유筋脈失濡-본 병의 기본 병기<\/p><p class=\"sub\">파킨슨병은 느린 움직임·강직强直의 정靜(음陰)과 진전震顫의 동動(양陽)이 교차하나 본질은 음성양허陰盛陽虛임. 양기가 부족하여 음액(진액, 혈액)을 생화, 수포하지 못해 근맥이 영양을 잃어 발생함<\/p><p class=\"sub\"><b>양허위본陽虛爲本, 근재신양根在腎陽<\/b>: 신양 부족으로 내한內寒이 생겨 근맥이 수축하고, 수액이 내범內泛하여 근맥을 어지럽히며, 신정腎精 생수生髓 기능이 약해지면 뇌수공허腦髓空虛를 야기해 진전과 보행장애를 일으킴<\/p><p class=\"sub\"><b>비양휴허脾陽虧虛, 건운실사健運失司<\/b>: 비양脾陽이 허해서 정미와 진액을 운화하지 못하면 수습水濕이 정체되고, 이로 인해 토습목울土濕木鬱, 목울생풍木鬱生風의 병태가 형성됨<\/p><p class=\"sub\"><b>간양부진肝陽不振, 소설실직疏泄失職<\/b>: 간양肝陽이 허해서 생발生發과 소설疏泄이 마비되면 양기가 사지로 포달되지 못하고 목울토체木鬱土滯가 되어 근맥이 어체瘀滯됨<\/p><p>제사비조諸邪痹阻, 담습어위심痰濕瘀爲甚-만성화의 원인<\/p><p class=\"sub\"><b>담습비조痰濕痹阻<\/b>: 비, 폐, 신의 기화 실조로 발생한 담습痰濕이 양기의 운행을 막아 경락 순환을 막음<\/p><p class=\"sub\"><b>어혈조락瘀血阻絡<\/b>: 비허脾虛, 심양부족心陽不足, 간양휴허肝陽虧虛로 어혈瘀血이 생겨 근맥의 영양 공급을 차단함<\/p><p class=\"sub\"><b>담어교결痰瘀膠結<\/b>: 병이 오래되면 담습과 어혈이 서로 엉켜 경락을 기폐氣閉하여 병을 만성화시키고 난치로 만듦<\/p><h4>③파킨슨병의 치법과 치료원칙<\/h4><p>온양통비溫陽通痹, 중재온신重在溫腎<\/p><p class=\"sub\">신양을 온보溫補하는 것을 으뜸으로 삼음. 주약으로 부자를 사용하여 상조심양上助心陽, 중온비양中溫脾陽, 하보신양下補腎陽, 외고위양外固衛陽을 도모함<\/p><p class=\"sub\"><b>음양기제陰陽旣濟<\/b>: 파극천, 음양곽, 녹각상 등으로 신양을 돕고 부자, 계지로 경맥을 통하게 하면서, 동시에 하수오, 상심, 구기자 등의 보음약을 합용해 “음중구양陰中求陽, 미미생화微微生火”의 유기적 음양기제陰陽旣濟를 이룸<\/p><p>화담습거어化痰濕祛瘀, 좌이부정佐以扶正<\/p><p class=\"sub\"><b>삼장동치三臟同治(비, 폐, 신 온화담溫化痰)<\/b>: 이진탕 가감을 바탕으로 신온한 약재를 써서 비위를 건운健運하고 기를 순환시킴. 무형無形의 담痰에는 석창포, 원지, 단삼, 우슬, 몽석 등을 사용<\/p><p class=\"sub\"><b>거어통락祛瘀通絡<\/b>: 갈근, 당귀, 단삼, 천궁 등을 조합하여 기혈을 다스리고 맥을 통하게 함. 완고한 어혈에는 충류약(지룡, 강잠, 오초사)을 배합하여 경락 깊은 곳의 어혈을 뚫어줌<\/p><p class=\"sub\"><b>부정위선扶正爲先<\/b>: 보기補氣, 온양溫陽(황기, 당삼, 백출, 부자)을 바탕으로 부정扶正하여 수액대사와 혈액순환을 되살려 담어痰瘀가 스스로 소멸되게 함<\/p><p>고호비위顧護脾胃, 조화위선助化爲先<\/p><p class=\"sub\">“비위가 건장하면 장부가 편안하다”는 관점 하에 비위의 승강과 운화 기능을 최우선으로 보살핌<\/p><p class=\"sub\">비기脾氣/비양脾陽/비음脾陰/위양胃陽/위음胃陰 분치<\/p><p><b>-비기보익脾氣補益<\/b>: 당삼, 백출, 복령, 익지인, 태자삼<\/p><p><b>-비양온후脾陽溫煦<\/b>: 포강, 육두구, 炒백출, 사인(극한極寒일 때 건강, 부자/승발升發 시 갈근, 시호, 승마)<\/p><p><b>-비음평보脾陰平補<\/b>: 백편두, 연육, 감초(변비일 때 백자인, 당귀, 행인, 마자인으로 윤장潤腸)<\/p><p><b>-위양조화胃陽調和(통보법通補法)<\/b>: 法반하, 생강, 고량강으로 강역조화降逆調和<\/p><p><b>-위음양호胃陰養護(청보법淸補法)<\/b>: 옥죽, 석곡 등으로 위진胃津 보충<\/p><h4>④파킨슨병 주요 겸증의 치료<\/h4><p class=\"lbl2\">현훈眩暈(체위성 저혈압 등)<\/p><p class=\"sub\"><b>병리 기전<\/b>: 양기陽氣 부족 및 담어痰瘀의 차단으로 청양淸陽의 불승不升과 탁음濁陰의 상충上衝(허실착잡虛實錯雜)<\/p><p class=\"sub\"><b>치료 원칙<\/b>: 온간산한溫肝散寒, 강탁승청降濁升淸, 거풍통락祛風通絡<\/p><p class=\"sub\"><b>약재 가감<\/b>: 파극천, 음양곽, 녹각상, 부자, 계지로 신양腎陽을 보함. 오수유를 합용하여 온간산한, 강탁승청하고, 전갈, 지룡 등 충류약으로 뇌락腦絡을 통하게 함<\/p><p class=\"lbl2\">변비便秘<\/p><p class=\"sub\"><b>병리 기전<\/b>: 음성토습陰盛土濕 및 기기승강실조氣機升降失調로 장부의 기체氣滯 발생. 한량寒涼, 사하제瀉下劑 남용 때 양기 손상<\/p><p class=\"sub\"><b>치료 원칙<\/b>: 온양승청溫陽升淸, 윤장통변潤腸通便, 제호게개提壺揭蓋<\/p><p class=\"sub\"><b>약재 가감<\/b>: 당귀15g, 백출30g 증량. 제호게개(인삼, 백출, 길경, 승마)로 상초 폐기肺氣를 올려 하초 대변을 통하게 하고, 지실15g, 내복자15g으로 기체를 뚫어줌<\/p><p class=\"lbl2\">우울抑鬱<\/p><p class=\"sub\"><b>병리 기전<\/b>: 간양肝陽 부족으로 소설疏泄 마비, 심양心陽, 혼魂 실양失養<\/p><p class=\"sub\"><b>치료 원칙<\/b>: 신감화양辛甘化陽, 산감화음酸甘化陰(간의 체용體用 동치同治)<\/p><p class=\"sub\"><b>약재 가감<\/b>: 신감화양(계지, 오수유, 건강+인삼, 감초)으로 양기 화생, 소설 회복. 산감화음(백작약, 산조인, 오매+맥문동, 지황, 황정)으로 간혈肝血, 음액陰液 보충<\/p><p class=\"lbl2\">불면(불매不寐)<\/p><p class=\"sub\"><b>병리 기전<\/b>: 담어가 경락經絡, 위장관胃腸管을 막아 발생하는 양불입음陽不入陰<\/p><p class=\"sub\"><b>치료 원칙<\/b>: 화위조중和胃調中, 통락거담通絡祛痰, 안신정지安神定志<\/p><p class=\"sub\"><b>약재 가감<\/b>: 반하출미탕으로 위기胃氣 조화. 입수入睡곤란 때는 산조인30g, 야교등30g, 합환피15g 추가. 다몽多夢에는 오미자, 야교등, 경락비조痹阻에는 충류약 추가<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품은 없음. 파녕1호방과 같은 조성(부자·당귀·파극천·백출·천마·오공 등 13종)의 파킨슨병 치료 조성물 특허가 후난성중의약연구원(류팡·류쭈이) 명의로 출원 공개되어 심사 중(2024년 심사 청구)[3]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">중국에서 제품화를 위한 특허 출원이 막 시작된 단계로 국내와의 격차가 크지 않으므로, 부자·오공 등 독성 약재의 안전성 자료 건비益氣健脾, 보신안신補腎安神하여 선천과 후천을 동시에 보강함 ②평간식풍平肝息風, 서근통락舒筋通絡 모듈 — 간풍을 진정시키고 경락을 풀어 강직과 떨림을 완화함 천마, 갈근 : 천마가 평간식풍平肝息風, 통락지통通絡止痛하여 머리와 경락의 풍사를 잡고, 갈근이 해기퇴열解肌退熱, 승발청양升發淸陽, 서근통락舒筋通絡하여 목과 지체의 강직을 풀어줌 백작약, 당귀 : 백작약이 양혈유간養血柔肝, 완급지통緩急止痛하여 근맥의 급박함을 누르고, 당귀가 양혈활혈養血活血, 조경통락調經通絡하여 혈행을 원활히 함 ③조화영위調和營衛, 잠양산결潛陽散結 모듈 — 영위를 조화롭게 하고 경락 깊은 곳의 어탁을 제거함 계지, 별갑 : 계지가 온통경맥溫通經脈, 조화영위調和營衛하여 표리의 영위를 소통시키고, 별갑이 자음잠양滋陰潛陽, 연견산결軟堅散結하여 허화虛火가 위로 뜨는 것을 막고 음양의 균형을 맞춤 ④수풍통락搜風通絡, 조화제약調和諸藥 모듈 — 깊은 경락의 풍사를 끄집어내고 약성을 조율함 오공 : 수풍통락搜風通絡, 공독산결攻毒散結하여 침범한 간풍과 어탁을 샅샅이 찾아 풀어줌 파극천, 炙감초 : 파극천이 온보신양溫補腎陽, 강근골强筋骨하며 약력을 신경腎經으로 이끌고, 炙감초가 익기화중益氣和中하며 여러 약재의 독성과 성질을 조화롭게 함","master":"①“기양주용氣陽主用” 학술사상 《소문·음양응상대론》의 “양화기陽化氣, 음성형陰成形” 이론에 기반을 둠. ‘기양氣陽’은 인체 생명의 온후溫煦 및 추진 작용에 중점을 두며, 이 양의 기능은 기의 운행과 밀접하므로 기양이라 칭함. 기양주용氣陽主用은 신기腎氣와 신양腎陽의 기화氣化 작용과 양의 생발生發, 부포敷布 기능을 중시함. 기양이 충만하고 잘 펼쳐져야 정기와 음혈이 생화되고 장부와 사지백해, 근맥이 영양을 얻음 신, 비, 간의 관계 근재어신根在於腎 : 기양의 뿌리는 신양에 있음. 신기는 성장의 기초이고 신양은 온후, 증화蒸化의 원동력이자 일신기양一身氣陽의 근본임 원재어비源在於脾 : 기양의 근원은 비양脾陽에 있음. 비위는 기혈생화의 원천이자 기기승강의 추뉴樞紐임. 비양이 건운健運해야 후천後天 수곡지기가 선천先天 신기를 계속 충양充養함 시재어간施在於肝 : 기양의 시행施行은 간양肝陽에 달렸음. 간은 체음이용양體陰而用陽하는 장부로, 간양이 불항불쇠不亢不衰해야 온후, 승발升發의 성질을 발휘함. 신의 봉장封藏 기능을 바탕으로 간양이 주도하여 전신 기기를 조달하고 근맥을 유화柔和하게 함 ②파킨슨병의 병인병기 양기휴허陽氣虧虛, 근맥실유筋脈失濡-본 병의 기본 병기 파킨슨병은 느린 움직임·강직强直의 정靜(음陰)과 진전震顫의 동動(양陽)이 교차하나 본질은 음성양허陰盛陽虛임. 양기가 부족하여 음액(진액, 혈액)을 생화, 수포하지 못해 근맥이 영양을 잃어 발생함 양허위본陽虛爲本, 근재신양根在腎陽 : 신양 부족으로 내한內寒이 생겨 근맥이 수축하고, 수액이 내범內泛하여 근맥을 어지럽히며, 신정腎精 생수生髓 기능이 약해지면 뇌수공허腦髓空虛를 야기해 진전과 보행장애를 일으킴 비양휴허脾陽虧虛, 건운실사健運失司 : 비양脾陽이 허해서 정미와 진액을 운화하지 못하면 수습水濕이 정체되고, 이로 인해 토습목울土濕木鬱, 목울생풍木鬱生風의 병태가 형성됨 간양부진肝陽不振, 소설실직疏泄失職 : 간양肝陽이 허해서 생발生發과 소설疏泄이 마비되면 양기가 사지로 포달되지 못하고 목울토체木鬱土滯가 되어 근맥이 어체瘀滯됨 제사비조諸邪痹阻, 담습어위심痰濕瘀爲甚-만성화의 원인 담습비조痰濕痹阻 : 비, 폐, 신의 기화 실조로 발생한 담습痰濕이 양기의 운행을 막아 경락 순환을 막음 어혈조락瘀血阻絡 : 비허脾虛, 심양부족心陽不足, 간양휴허肝陽虧虛로 어혈瘀血이 생겨 근맥의 영양 공급을 차단함 담어교결痰瘀膠結 : 병이 오래되면 담습과 어혈이 서로 엉켜 경락을 기폐氣閉하여 병을 만성화시키고 난치로 만듦 ③파킨슨병의 치법과 치료원칙 온양통비溫陽通痹, 중재온신重在溫腎 신양을 온보溫補하는 것을 으뜸으로 삼음. 주약으로 부자를 사용하여 상조심양上助心陽, 중온비양中溫脾陽, 하보신양下補腎陽, 외고위양外固衛陽을 도모함 음양기제陰陽旣濟 : 파극천, 음양곽, 녹각상 등으로 신양을 돕고 부자, 계지로 경맥을 통하게 하면서, 동시에 하수오, 상심, 구기자 등의 보음약을 합용해 “음중구양陰中求陽, 미미생화微微生火”의 유기적 음양기제陰陽旣濟를 이룸 화담습거어化痰濕祛瘀, 좌이부정佐以扶正 삼장동치三臟同治(비, 폐, 신 온화담溫化痰) : 이진탕 가감을 바탕으로 신온한 약재를 써서 비위를 건운健運하고 기를 순환시킴. 무형無形의 담痰에는 석창포, 원지, 단삼, 우슬, 몽석 등을 사용 거어통락祛瘀通絡 : 갈근, 당귀, 단삼, 천궁 등을 조합하여 기혈을 다스리고 맥을 통하게 함. 완고한 어혈에는 충류약(지룡, 강잠, 오초사)을 배합하여 경락 깊은 곳의 어혈을 뚫어줌 부정위선扶正爲先 : 보기補氣, 온양溫陽(황기, 당삼, 백출, 부자)을 바탕으로 부정扶正하여 수액대사와 혈액순환을 되살려 담어痰瘀가 스스로 소멸되게 함 고호비위顧護脾胃, 조화위선助化爲先 “비위가 건장하면 장부가 편안하다”는 관점 하에 비위의 승강과 운화 기능을 최우선으로 보살핌 비기脾氣/비양脾陽/비음脾陰/위양胃陽/위음胃陰 분치 -비기보익脾氣補益 : 당삼, 백출, 복령, 익지인, 태자삼 -비양온후脾陽溫煦 : 포강, 육두구, 炒백출, 사인(극한極寒일 때 건강, 부자/승발升發 시 갈근, 시호, 승마) -비음평보脾陰平補 : 백편두, 연육, 감초(변비일 때 백자인, 당귀, 행인, 마자인으로 윤장潤腸) -위양조화胃陽調和(통보법通補法) : 法반하, 생강, 고량강으로 강역조화降逆調和 -위음양호胃陰養護(청보법淸補法) : 옥죽, 석곡 등으로 위진胃津 보충 ④파킨슨병 주요 겸증의 치료 현훈眩暈(체위성 저혈압 등) 병리 기전 : 양기陽氣 부족 및 담어痰瘀의 차단으로 청양淸陽의 불승不升과 탁음濁陰의 상충上衝(허실착잡虛實錯雜) 치료 원칙 : 온간산한溫肝散寒, 강탁승청降濁升淸, 거풍통락祛風通絡 약재 가감 : 파극천, 음양곽, 녹각상, 부자, 계지로 신양腎陽을 보함. 오수유를 합용하여 온간산한, 강탁승청하고, 전갈, 지룡 등 충류약으로 뇌락腦絡을 통하게 함 변비便秘 병리 기전 : 음성토습陰盛土濕 및 기기승강실조氣機升降失調로 장부의 기체氣滯 발생. 한량寒涼, 사하제瀉下劑 남용 때 양기 손상 치료 원칙 : 온양승청溫陽升淸, 윤장통변潤腸通便, 제호게개提壺揭蓋 약재 가감 : 당귀15g, 백출30g 증량. 제호게개(인삼, 백출, 길경, 승마)로 상초 폐기肺氣를 올려 하초 대변을 통하게 하고, 지실15g, 내복자15g으로 기체를 뚫어줌 우울抑鬱 병리 기전 : 간양肝陽 부족으로 소설疏泄 마비, 심양心陽, 혼魂 실양失養 치료 원칙 : 신감화양辛甘化陽, 산감화음酸甘化陰(간의 체용體用 동치同治) 약재 가감 : 신감화양(계지, 오수유, 건강+인삼, 감초)으로 양기 화생, 소설 회복. 산감화음(백작약, 산조인, 오매+맥문동, 지황, 황정)으로 간혈肝血, 음액陰液 보충 불면(불매不寐) 병리 기전 : 담어가 경락經絡, 위장관胃腸管을 막아 발생하는 양불입음陽不入陰 치료 원칙 : 화위조중和胃調中, 통락거담通絡祛痰, 안신정지安神定志 약재 가감 : 반하출미탕으로 위기胃氣 조화. 입수入睡곤란 때는 산조인30g, 야교등30g, 합환피15g 추가. 다몽多夢에는 오미자, 야교등, 경락비조痹阻에는 충류약 추가","rd":"","china":"중국 제품화 현황 허가 제품은 없음. 파녕1호방과 같은 조성(부자·당귀·파극천·백출·천마·오공 등 13종)의 파킨슨병 치료 조성물 특허가 후난성중의약연구원(류팡·류쭈이) 명의로 출원 공개되어 심사 중(2024년 심사 청구)[3] 시사점 중국에서 제품화를 위한 특허 출원이 막 시작된 단계로 국내와의 격차가 크지 않으므로, 부자·오공 등 독성 약재의 안전성 자료를 먼저 확보하면 국내 공동연구 대상이 될 수 있음 참고문헌 [1] 탕청.국의대사 류쭈이의 파킨슨병 변증 치료 학술 경험 연구國醫大師劉祖貽辨治帕金森病學術經驗研究[D].후난중의약대학湖南中醫藥大學,2024. [2] 딩첸청,류팡.국의대사 류쭈이의 “비신양허, 습어비조”에 기반한 파킨슨병 및 합병증 치료 경험國醫大師劉祖貽基於“脾腎陽虛、濕瘀痹阻”論治帕金森病及其並發症經驗[J].후난중의잡지湖南中醫雜志,2025,41(1):31-33+61. [3] 류팡劉芳·류쭈이劉祖貽.파킨슨병을 치료하는 중약 조성물 및 그 응용一種治療帕金森病的中藥組合物及其應用:CN118976090A[P/OL]. https://patents.google.com/patent/CN118976090A."}},{"id":"3-7","ko":"익신통락탕","hz":"益腎通絡湯","alias":"","master_ko":"류쭈이","master_hz":"劉祖貽","tagline":"신정腎精과 뇌수腦髓를 채우고 어혈을 제거하여 혈관성 파킨슨증을 치료하는 처방","meta":{"주요 적응증":"혈관성 파킨슨증","확인된 연구자료 유형":"연구 축적 (논문 21편)","제형·제품화":"—"},"page":191,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-7 익신통락탕益腎通絡湯의 모듈 구성<\/p><h4>①자신익기滋腎益氣 모듈 — 신정을 보충하고 기혈을 북돋아 뇌수와 근골을 영양함<\/h4><p><b>황기, 음양곽, 구기자<\/b>: 황기가 비위의 기를 크게 보하고 승양고표升陽固表하여 행혈行血을 돕고, 음양곽과 구기자는 간신을 쌍보雙補하여 신양을 돕고 신음을 자양함<\/p><p><b>산수유, 사원자, 오미자<\/b>: 진액을 채우고 정수를 수렴하여 뇌수腦髓의 생화 지원을 공고히 함<\/p><h4>②활혈통락活血通絡 모듈 — 기혈의 운행을 돕고 뇌락에 침착된 어혈을 제거함<\/h4><p><b>단삼, 천궁, 포황<\/b>: 천궁이 행기활혈行氣活血하고, 단삼과 포황이 어혈을 없애고 낙맥絡脈을 통하게 하여 사지 관절과 뇌락의 순환을 원활하게 함<\/p><h4>③개규통락開竅通絡 모듈 — 청양을 승발시키고 담탁을 해소하여 뇌규를 열어줌<\/h4><p><b>갈근, 석창포, 울금, 산사<\/b>: 갈근이 청양淸陽을 끌어올려 강직을 풀고, 석창포와 울금이 담탁을 해소하고 뇌규腦竅와 낙맥絡脈을 열어주며, 산사가 소식화어消食化瘀를 통해 혈액순환을 보조함<\/p>"},{"k":"master","t":"류쭈이의 혈관성 파킨슨증 치료","html":"<h4>①허기류체虛氣留滯 이론과 허실협잡虛實夾雜<\/h4><p><b>허기와 유체<\/b>: 허기는 신기腎氣와 신정腎精의 부족으로 인한 정수精髓의 부족을 의미하고, 유체는 기허로 인해 기혈 운행이 정체되어 어혈이 뇌락과 근맥에 머무는 상태를 의미<\/p><p><b>허실협잡<\/b>: 허와 실이 함께 존재하는 허실협잡의 병리이며, 허가 체를 만들고 체가 다시 허를 심화시키는 악순환을 형성<\/p><h4>②병인병기 — 허기가 본本이고, 유체가 표標<\/h4><p><b>허기가 본-신허수고腎虛髓枯<\/b>: 노화와 뇌혈관 질환으로 신기와 신정이 쇠퇴하면 신음과 신양이 모두 부족해지고, 정수精髓의 생성이 감소하여 수해髓海가 공허해짐. 뇌와 근골이 충분한 영양을 받지 못하면서 보행장애, 운동완만, 인지기능 저하 등 혈관성 파킨슨증의 병리 변화가 발생<\/p><p><b>유체가 표標-어혈조체瘀血阻滯<\/b>: 신허로 기혈 운행이 저하되면 혈행이 정체되어 어혈이 형성되고, 어혈이 뇌락과 근맥을 막아 기혈의 소통을 방해함. 이로 인해 강직, 동결보행, 보행장애 등 운동 증상이 나타나며, 뇌락이 막히면 인지기능 저하와 요실금 등의 증상도 발생함. 대사는 허기가 어혈을 만들고, 어혈이 다시 허기를 심화시키는 악순환을 형성한다고 봄<\/p><h4>③치료 원칙 — 보허통락補虛通絡<\/h4><p>보허는 보신생수補腎生髓를 통해 신음과 신양을 함께 조절하여 뇌수를 충실하게 하고, 통락은 활혈화어活血化瘀로 뇌락과 근맥의 어혈을 제거하여 기혈 운행을 회복시키는 것<\/p><p>보신생수와 활혈통락을 병행하여 표본을 함께 치료하는 것이 핵심 치법<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모 및 정량적 위상<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 21 편 발표<\/td><td>최근 5 년간 8편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">혈관성 파킨슨증<\/span> <span class=\"kw\">뇌경색 회복기<\/span> <span class=\"kw\">다낭성 난소 증후군(PCOS) 불임<\/span> <span class=\"kw\">당뇨병성 신증<\/span> <span class=\"kw\">약정자증/정자 활력 저하<\/span> <span class=\"kw\">요추간판 탈출증<\/span><\/td><td>뇌혈관 및 신경계, 생식 내분비, 대사성 신장 질환 등 다각도 효능 검증을 통한 보신통락補腎通絡 치료법의 적응증 확장 전략 추진<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">배란 유도제 병용<\/span> <span class=\"kw\">양약과 보호제 병용<\/span> <span class=\"kw\">경피적 내시경 요추간판 절제술 병용<\/span> <span class=\"kw\">중서의 결합 효과 증대<\/span><\/td><td>양약 단독 투여 때의 한계를 보완하는 중서의 결합 효과 증대 전략 및 수술 후 기능 회복 보조 치료 효과 탐색<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">임신율 및 난소 기능<\/span> <span class=\"kw\">GGT/vWF/ICA 혈관 내피 지표<\/span> <span class=\"kw\">PINK1/Parkin 미토콘드리아 자가포식 경로<\/span> <span class=\"kw\">NIHSS/ADL 신경 기능 점수<\/span><\/td><td>객관적 바이오마커와 신호 전달 경로를 통해 임상 증상 개선, 내포피 세포 보호, 미토콘드리아 기능 조절 등 정량화된 기전 연구<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">명로중의 경험 정리<\/span> <span class=\"kw\">임상 무작위 대조 연구(RCT)<\/span> <span class=\"kw\">임상-분포 기전 융합 연구<\/span><\/td><td>명의 처방의 임상 효과 검증과 분자 생물학적 메커니즘 규명을 결합한 융합 연구를 통해 중약 복방의 표준화 및 기전 고도화<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2025-2026 최신 연구)<\/h4><p class=\"row\">‘허기류체虛氣留滯’ 이론 기반 혈관성 파킨슨증 임상 경험 <b>2025, 陳雨函 등<\/b><\/p><p>허기류체 이론에 기반하여 신허腎虛를 본本으로 삼고 근맥과 뇌락의 어혈 지체를 표標로 파악, ‘보허통락補虛通絡’을 기본 치료원칙으로 설정함<\/p><p><b>의미<\/b> 도파민계 약물 효과가 제한적인 혈관성 파킨슨증에 대해 익신통락탕 변증 가감 투여를 통한 중의학적 치료 기전 및 임상적 유용성을 제시함<\/p><p class=\"row\">수허혈어형髓虛血瘀型 뇌경색 회복기 임상 효과 <b>2025, 古瓊婷<\/b><\/p><p>수허혈어형髓虛血瘀型 뇌경색 회복기 환자 대상 28일간 익신통락탕 병용 투여 결과, 단독 양방 치료 대비 총유효율을 유의하게 향상시킴(91.89% vs 75.00%)<\/p><p><b>의미<\/b> 중서의 병용 치료를 통해 신경기능 결손(NIHSS), 장애 정도(mRS), 일상생활 수행능력(ADL) 개선이 보고되었고 해당 연구에서 간·신장 관련 유의한 이상이 보고되지 않음<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">연구 축적(21편)에도 공개자료상 제품·특허가 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 혈관성 파킨슨증은 표준치료 반응이 낮아 미충족 수요가 분명함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 천위한,류팡.국의대사 류쭈이의 “허기류체” 이론에 기반한 혈관성 파킨슨증후군 치료 경험國醫大師劉祖貽基於“虛氣留滯”理論治療血管性帕金森綜合征經驗[J].산시중의陝西中醫,2025,46(11):1544-1547.<\/li><li class=\"ref\">[2] 구충팅.익신통락탕을 활용한 수허혈어형 뇌경색 회복기 임상 관찰益腎通絡湯治療髓虛血瘀型腦梗死回復期的臨床觀察[D].후난중의약대학湖南中醫藥大學,2025.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"황기","name":"황기","dose":"","base":"황기"},{"raw":"음양곽","name":"음양곽","dose":"","base":"음양곽"},{"raw":"구기자","name":"구기자","dose":"","base":"구기자"},{"raw":"산수유","name":"산수유","dose":"","base":"산수유"},{"raw":"사원자","name":"사원자","dose":"","base":"사원자"},{"raw":"갈근","name":"갈근","dose":"","base":"갈근"},{"raw":"단삼","name":"단삼","dose":"","base":"단삼"},{"raw":"천궁","name":"천궁","dose":"","base":"천궁"},{"raw":"포황","name":"포황","dose":"","base":"포황"},{"raw":"석창포","name":"석창포","dose":"","base":"석창포"},{"raw":"오미자","name":"오미자","dose":"","base":"오미자"},{"raw":"울금","name":"울금","dose":"","base":"울금"},{"raw":"산사","name":"산사","dose":"","base":"산사"}],"notes":[],"핵심 효능":["신정腎精을 보충하고 기를 북돋아 뇌수와 근골을 영양함(자신익기滋腎益氣)","뇌락腦絡의 어혈을 없애고 낙맥絡脈을 통하게 하여 기혈운행을 원활하게 함(활혈통락活血通絡)","청양淸陽을 끌어올리고 담탁痰濁을 해소하여 뇌규를 열어줌(개규통락開竅通絡)"],"주치증":["혈관성 파킨슨증(Vascular Parkinsonism) 및 보행장애, 평형장애, 인지기능장애, 요실금 등 증상, 허실협잡虛實夾雜 증후"],"연구 확장 영역":["혈관성 파킨슨증, 만성 신경퇴행성 뇌질환, 혈관성 인지장애, 국소 뇌허혈 손상"],"R&D 포인트":["황기, 음양곽, 구기자 배합의 신경영양인자 상향 조절 및 뇌조직 미세환경 개선 효과를 활용함","천궁, 갈근, 단삼의 뇌미세순환 개선, 혈액뇌장벽 투과성 및 뇌혈류 소통 작용 기전을 검증","석창포, 울금, 산사의 뇌락 담탁痰濁 제거, 항산화 및 뇌락 내 미세혈전 억제 효과를 규명","보기약과 활혈화어약 복합물의 뇌조직 미세환경 개선 및 운동 기능 회복 능력을 탐색함"]},"modules":[{"name":"①자신익기","hz":"滋腎益氣","herbs":["황기","음양곽","구기자","산수유","사원자","오미자"],"role":"신정을 보충하고 기혈을 북돋아 뇌수와 근골을 영양함"},{"name":"②활혈통락","hz":"活血通絡","herbs":["단삼","천궁","포황"],"role":"기혈의 운행을 돕고 뇌락에 침착된 어혈을 제거함"},{"name":"③개규통락","hz":"開竅通絡","herbs":["갈근","석창포","울금","산사"],"role":"청양을 승발시키고 담탁을 해소하여 뇌규를 열어줌"}],"rd":[{"tag":"Vascular Parkinsonism","title":"레보도파 반응이 낮은 혈관성 파킨슨증","html":"<p>혈관성 파킨슨증은 도파민계 약물의 효과가 제한적이어서 치료 선택지가 부족한 질환임<\/p><p>‘허기류체’ 이론에 따른 익신통락탕의 보행 장애 개선 효과를 확인하면 미충족 수요가 분명한 적응증을 확보할 수 있음<\/p><p><b>검증 설계<\/b> 12주 무작위 대조 탐색 임상, 1차 지표는 보행 속도와 TUG(일어나 걷기) 시간, 2차 지표는 UPDRS-III·낙상 횟수·MoCA<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [1](2025, 허기류체 이론 기반 혈관성 파킨슨증)<\/p>"},{"tag":"Stroke Recovery","title":"수허혈어형 뇌경색 회복기 병용 치료","html":"<p>뇌경색 회복기 환자 28일 병용 투여 연구(중국 단일 연구)에서 총유효율 91.89% 대 75.00%와 NIHSS·mRS·ADL 개선이 보고되었고, 측정 범위 안에서 간·신장 이상반응은 보고되지 않았음<\/p><p>다만 시험 설계·표본 수·비뚤림 위험을 원문으로 확인한 뒤 다기관 무작위 대조로의 확대 여부를 판단<\/p><p><b>검증 설계<\/b> 다기관 무작위 대조, 1차 지표는 90일 기능적 독립(mRS 0~2) 비율, 2차 지표는 NIHSS·Barthel 지수, 총유효율 대신 국제 표준 지표 사용<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [2](2025, 뇌경색 회복기 임상 관찰)<\/p>"},{"tag":"Mitophagy & Endothelium","title":"PINK1/Parkin 미토콘드리아 자가포식과 혈관 내피 보호","html":"<p>본문 연구 동향에서 PINK1/Parkin 경로와 vWF 등 내피 지표가 제시됨<\/p><p>뇌허혈 모델에서 미토콘드리아 자가포식과 혈관 내피 손상 지표를 함께 측정하여 ‘보허’와 ‘통락’을 각각 기전으로 대응시킴<\/p><p><b>검증 설계<\/b> 중대뇌동맥 폐색(MCAO) 랫드에서 PINK1/Parkin·LC3, vWF·혈관 밀도, 신경학적 점수를 측정하고 보기 모듈과 활혈 모듈을 분리 비교<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 본문 「평가 지표」 표(PINK1/Parkin, vWF)<\/p>"},{"tag":"Indication Focus & QC","title":"뇌혈관–신경 축 집중과 지표성분 표준화","html":"<p>최근 연구가 다낭성 난소 증후군·정자 활력·당뇨병성 신증·요추 질환까지 분산되어 있음<\/p><p><b>근거<\/b> 가 가장 앞선 혈관성 파킨슨증과 뇌경색 회복기로 적응증을 집중하고 단삼·갈근 등 13종 약재의 지표성분(살비아놀산·푸에라린 등)으로 품질을 고정<\/p><p><b>검증 설계<\/b> 적응증 2개에 맞춘 전임상 패키지와 HPLC 지표성분 규격을 먼저 확정한 뒤 다기관 임상으로 진행<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> 본문 「주치증」·「방법론」 표<\/p>"}],"logic":[{"n":"1","title":"자신익기滋腎益氣와 보신생수補腎生髓","body":"신정을 보충하고 기혈을 북돋아 뇌수와 근골을 영양함"},{"n":"2","title":"활혈통락活血通絡과 행혈통경行血通 피 보호 본문 연구 동향에서 PINK1/Parkin 경로와 vWF 등 내피 지표가 제시됨 뇌허혈 모델에서 미토콘드리아 자가포식과 혈관 내피 손상 지표를 함께 측정하여 ‘보허’와 ‘통락’을 각각 기전으로 대응시킴 검증 설계 중대뇌동맥 폐색(MCAO) 랫드에서 PINK1/Parkin·LC3, vWF·혈관 밀도, 신경학적 점수를 측정하고 보기 모듈과 활혈 모듈을 분리 비교 근거 직접 연구 근거 본문 「평가 지표」 표(PINK1/Parkin, vWF)","Indication Focus & QC 뇌혈관–신경 축 집중과 지표성분 표준화 최근 연구가 다낭성 난소 증후군·정자 활력·당뇨병성 신증·요추 질환까지 분산되어 있음 근거 가 가장 앞선 혈관성 파킨슨증과 뇌경색 회복기로 적응증을 집중하고 단삼·갈근 등 13종 약재의 지표성분(살비아놀산·푸에라린 등)으로 품질을 고정 검증 설계 적응증 2개에 맞춘 전임상 패키지와 HPLC 지표성분 규격을 먼저 확정한 뒤 다기관 임상으로 진행 근거 신규 연구가설 본문 「주치증」·「방법론」 표"],"ss":{"composition":"그림 3-7 익신통락탕益腎通絡湯의 모듈 구성 ①자신익기滋腎益氣 모듈 — 신정을 보충하고 기혈을 북돋아 뇌수와 근골을 영양함 황기, 음양곽, 구기자 : 황기가 비위의 기를 크게 보하고 승양고표升陽固表하여 행혈行血을 돕고, 음양곽과 구기자는 간신을 쌍보雙補하여 신양을 돕고 신음을 자양함 산수유, 사원자, 오미자 : 진액을 채우고 정수를 수렴하여 뇌수腦髓의 생화 지원을 공고히 함 ②활혈통락活血通絡 모듈 — 기혈의 운행을 돕고 뇌락에 침착된 어혈을 제거함 단삼, 천궁, 포황 : 천궁이 행기활혈行氣活血하고, 단삼과 포황이 어혈을 없애고 낙맥絡脈을 통하게 하여 사지 관절과 뇌락의 순환을 원활하게 함 ③개규통락開竅通絡 모듈 — 청양을 승발시키고 담탁을 해소하여 뇌규를 열어줌 갈근, 석창포, 울금, 산사 : 갈근이 청양淸陽을 끌어올려 강직을 풀고, 석창포와 울금이 담탁을 해소하고 뇌규腦竅와 낙맥絡脈을 열어주며, 산사가 소식화어消食化瘀를 통해 혈액순환을 보조함","master":"①허기류체虛氣留滯 이론과 허실협잡虛實夾雜 허기와 유체 : 허기는 신기腎氣와 신정腎精의 부족으로 인한 정수精髓의 부족을 의미하고, 유체는 기허로 인해 기혈 운행이 정체되어 어혈이 뇌락과 근맥에 머무는 상태를 의미 허실협잡 : 허와 실이 함께 존재하는 허실협잡의 병리이며, 허가 체를 만들고 체가 다시 허를 심화시키는 악순환을 형성 ②병인병기 — 허기가 본本이고, 유체가 표標 허기가 본-신허수고腎虛髓枯 : 노화와 뇌혈관 질환으로 신기와 신정이 쇠퇴하면 신음과 신양이 모두 부족해지고, 정수精髓의 생성이 감소하여 수해髓海가 공허해짐. 뇌와 근골이 충분한 영양을 받지 못하면서 보행장애, 운동완만, 인지기능 저하 등 혈관성 파킨슨증의 병리 변화가 발생 유체가 표標-어혈조체瘀血阻滯 : 신허로 기혈 운행이 저하되면 혈행이 정체되어 어혈이 형성되고, 어혈이 뇌락과 근맥을 막아 기혈의 소통을 방해함. 이로 인해 강직, 동결보행, 보행장애 등 운동 증상이 나타나며, 뇌락이 막히면 인지기능 저하와 요실금 등의 증상도 발생함. 대사는 허기가 어혈을 만들고, 어혈이 다시 허기를 심화시키는 악순환을 형성한다고 봄 ③치료 원칙 — 보허통락補虛通絡 보허는 보신생수補腎生髓를 통해 신음과 신양을 함께 조절하여 뇌수를 충실하게 하고, 통락은 활혈화어活血化瘀로 뇌락과 근맥의 어혈을 제거하여 기혈 운행을 회복시키는 것 보신생수와 활혈통락을 병행하여 표본을 함께 치료하는 것이 핵심 치법","rd":"","evidence":"①연구 규모 및 정량적 위상 Total Papers(15yrs) Recent Focus(5yrs) 총 21 편 발표 최근 5 년간 8편 발표 ②연구 키워드로 본 R&D 가이던스(최근 5개년 분석) 구분 핵심 키워드 R&D 인사이트 주치증 혈관성 파킨슨증 뇌경색 회복기 다낭성 난소 증후군(PCOS) 불임 당뇨병성 신증 약정자증/정자 활력 저하 요추간판 탈출증 뇌혈관 및 신경계, 생식 내분비, 대사성 신장 질환 등 다각도 효능 검증을 통한 보신통락補腎通絡 치료법의 적응증 확장 전략 추진 병용 전략 배란 유도제 병용 양약과 보호제 병용 경피적 내시경 요추간판 절제술 병용 중서의 결합 효과 증대 양약 단독 투여 때의 한계를 보완하는 중서의 결합 효과 증대 전략 및 수술 후 기능 회복 보조 치료 효과 탐색 평가 지표 임신율 및 난소 기능 GGT/vWF/ICA 혈관 내피 지표 PINK1/Parkin 미토콘드리아 자가포식 경로 NIHSS/ADL 신경 기능 점수 객관적 바이오마커와 신호 전달 경로를 통해 임상 증상 개선, 내포피 세포 보호, 미토콘드리아 기능 조절 등 정량화된 기전 연구 방법론 명로중의 경험 정리 임상 무작위 대조 연구(RCT) 임상-분포 기전 융합 연구 명의 처방의 임상 효과 검증과 분자 생물학적 메커니즘 규명을 결합한 융합 연구를 통해 중약 복방의 표준화 및 기전 고도화 ③High-Impact 연구 하이라이트(2025-2026 최신 연구) ‘허기류체虛氣留滯’ 이론 기반 혈관성 파킨슨증 임상 경험 2025, 陳雨函 등 허기류체 이론에 기반하여 신허腎虛를 본本으로 삼고 근맥과 뇌락의 어혈 지체를 표標로 파악, ‘보허통락補虛通絡’을 기본 치료원칙으로 설정함 의미 도파민계 약물 효과가 제한적인 혈관성 파킨슨증에 대해 익신통락탕 변증 가감 투여를 통한 중의학적 치료 기전 및 임상적 유용성을 제시함 수허혈어형髓虛血瘀型 뇌경색 회복기 임상 효과 2025, 古瓊婷 수허혈어형髓虛血瘀型 뇌경색 회복기 환자 대상 28일간 익신통락탕 병용 투여 결과, 단독 양방 치료 대비 총유효율을 유의하게 향상시킴(91.89% vs 75.00%) 의미 중서의 병용 치료를 통해 신경기능 결손(NIHSS), 장애 정도(mRS), 일상생활 수행능력(ADL) 개선이 보고되었고 해당 연구에서 간·신장 관련 유의한 이상이 보고되지 않음","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 연구 축적(21편)에도 공개자료상 제품·특허가 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 혈관성 파킨슨증은 표준치료 반응이 낮아 미충족 수요가 분명함 참고문헌 [1] 천위한,류팡.국의대사 류쭈이의 “허기류체” 이론에 기반한 혈관성 파킨슨증후군 치료 경험國醫大師劉祖貽基於“虛氣留滯”理論治療血管性帕金森綜合征經驗[J].산시중의陝西中醫,2025,46(11):1544-1547. [2] 구충팅.익신통락탕을 활용한 수허혈어형 뇌경색 회복기 임상 관찰益腎通絡湯治療髓虛血瘀型腦梗死回復期的臨床觀察[D].후난중의약대학湖南中醫藥大學,2025."}},{"id":"3-8","ko":"익지치매방","hz":"益智治呆方","alias":"","master_ko":"선바오판","master_hz":"沈寶藩","tagline":"신정腎精과 뇌수腦髓를 채우고 담어痰瘀를 제거하여 노인성 치매를 치료하는 처방","meta":{"주요 적응증":"알츠하이머병, 혈관성 치매","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":197,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-8 익지치매방益智治呆方의 모듈 구성<\/p><h4>①자신익기滋腎益氣 모듈 — 신정을 보충하고 기혈을 북돋아 뇌수를 충실히 채움<\/h4><p><b>숙지황, 녹각교<\/b>: 숙지황이 보혈자음補血滋陰하고, 녹각교가 혈육유정지품血肉有情之品으로서 간신肝腎을 온보溫補하고 정혈精血을 충실히 하여 뇌수腦髓가 마르는 근본 병태를 치료함<\/p><p><b>산수유, 익지인, 황기<\/b>: 산수유가 보익간신補益肝腎, 보신삽정補腎澁精하고 수렴고섭收斂固攝하며, 익지인이 난신고정暖腎固精하고 온비섭타溫脾攝唾하여 신기와 비기를 보강함. 황기가 보기승양補氣升陽하여 후천의 기혈 생화를 돕고 군약의 정혈 보충을 이끔<\/p><h4>②거어화담祛瘀化痰 모듈 — 뇌락에 매복된 어혈과 담탁을 배출하여 통로를 소통시킴<\/h4><p><b>당귀, 천궁<\/b>: 당귀가 보혈활혈補血活血하고 천궁이 행기활혈行氣活血, 거풍祛風하여 뇌혈관의 미세순환을 촉진하고 정혈이 뇌규腦竅로 원활히 공급되도록 이끔<\/p><p><b>酒대황<\/b>: 사탁활혈瀉濁活血하되, 주제酒製를 통해 한성寒性을 완화하고 약효를 머리와 뇌 부위로 집중 유도하여 뇌락腦絡에 침착된 실담實痰과 어혈을 배출함<\/p><h4>③개규통락開竅通絡 모듈 — 막힌 뇌규를 뚫어 정신을 깨우고 심신을 안정시킴<\/h4><p><b>석창포, 울금, 원지<\/b>: 석창포가 화담투기化痰透氣, 개규성신開竅醒神하여 청기를 뇌로 통하게 하고, 울금이 행기거담行氣祛痰, 해울解鬱하여 기혈의 막힘을 뚫음. 원지가 영심안신寧心安神하고 통신기通神氣하여 심신心腎을 소통시키고 건망健忘을 치료함<\/p>"},{"k":"master","t":"선바오판의 치매 치료","html":"<h4>①병기 인식 — 본허표실本虛標實과 허실협잡虛實夾雜의 치매관<\/h4><p><b>본本의 파악(근본 원인)<\/b>: 치매의 근본 병태는 연로함에 따른 신기허쇠腎氣虛衰, 천계天癸의 고갈, 정혈부족精血不足으로 인해 뇌수腦髓가 영양을 잃고 위축되어 발생하는 허증虛證에 있음<\/p><p><b>표標의 파악(경과 및 진행)<\/b>: 병이 진행되면서 뇌락腦絡이 막히고 기체혈어氣滯血瘀, 담탁痰濁이 뇌규腦竅를 가로막아 실증實證이 결합함. 이에 따라 본허표실本虛標實 및 허실협잡虛實夾雜의 치매 병태가 형성됨<\/p><h4>②치료 원칙 — 보신건뇌補腎健腦와 담어동치痰瘀同治의 병용<\/h4><p><b>보신건뇌補腎健腦<\/b>: 근본인 신정을 채우기 위해 혈육유정지품血肉有情之品인 녹각교와 숙지황을 축으로 삼아 뇌수를 보충하는 보법補法을 기본으로 삼음<\/p><p><b>담어동치痰瘀同治<\/b>: 담痰과 어瘀는 서로 엉켜 뇌락에 깊이 매복하므로, 단순한 보제補劑만 투여하면 증상이 악화됨. 석창포, 울금, 원지와 더불어 酒대황을 배합하여 뇌락의 막힘을 열어주는 개규통락법開竅通絡法을 필수적으로 병행함<\/p><p><b>酒대황의 독창적 활용<\/b>: 대황을 술로 법제(주제酒製)하여 한성寒性을 완화하고 약효 작용을 머리와 뇌 부위로 집중 유도함. 이를 통해 오래된 실담實痰과 어혈을 파쇄破碎하여 배출함<\/p><h4>③병태별 특수 변증 사상 및 임상 응용<\/h4><p><b>퇴행성 노년老年 치매<\/b>: 퇴행성 경과로 신정부족腎精不足으로 인한 허증虛證이 주를 이루는 경우, 보신익정補腎益精을 위주로 삼고 거사祛邪를 겸하여 뇌위축 진행을 늦춤<\/p><p><b>중풍 후 치매(뇌혈관성 병태)<\/b>: 뇌중풍 후 뇌락腦絡의 어혈과 담탁으로 인한 실증實證이 주를 이루는 경우, 활혈화담活血化痰 및 통락通絡을 위주로 하여 국소 뇌손상이 전반적인 치매로 악화되는 것을 방지함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">치매 대상 중의·중약 제품이 많은 영역이므로, 이 처방은 기존 제품과의 차별점(활혈 강화)을 먼저 정리해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕징신,류양,훙쥔.“익지치매방”의 노년 치매 치료 경험“益智治呆方”治療老年呆病經驗[J].신장중의약新疆中醫藥,2011,29(5):87-89.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"녹각교(양화烊化) 15g","name" 형별 대상 선정과 인지 지표 근거 가 2011년 노년 치매 경험 보고 1편이어서 경도인지장애 진행 억제를 추론할 직접 근거는 없음 혈관성 치매와 알츠하이머형 치매의 모집 기준을 나누어 MoCA·ADAS-Cog 변화를 관찰하는 소규모 탐색 연구로 시작 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1] (2011, 노년 치매 치료 경험))","Phlegm–Stasis Module 석창포·원지·울금의 인지 개선 기여 화담개규 모듈(석창포·원지·울금)과 보신 모듈을 분리함 인지 기능 모델(스코폴라민 유도 기억장애 등)에서 효과를 비교하면 처방의 핵심 축을 확인할 수 있음 (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「거어화담과 개규통락」, 본문 조성표)","Wine-processed Rhubarb 주대황 소량 배합의 역할과 안전성 주대황酒大黃 6g의 ‘탁혈 배출’ 의도를 고령 환자의 배변 습관과 장–뇌 축 지표로 확인함 장기 복용 시 설사·전해질 이상이 없는지 함께 평가 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 3 「약효상행과 탁혈배출」, 본문 조성표)","Vascular Dementia 혈관성 치매에서 뇌혈류 개선 효과 당귀·천궁의 활혈 작용이 혈관성 치매 환자의 뇌혈류(경두개 도플러·관류 영상)를 개선하는지 확인함 그 결과에 따라 알츠하이머병과 혈관성 치매 중 우선 적응증을 결정 (근거 유형: 신규 연구가설 | 근거: R&D 논리 4 「통락거어와 뇌혈류개선」, 본문 주치증)"],"ss":{"composition":"그림 3-8 익지치매방益智治呆方의 모듈 구성 ①자신익기滋腎益氣 모듈 — 신정을 보충하고 기혈을 북돋아 뇌수를 충실히 채움 숙지황, 녹각교 : 숙지황이 보혈자음補血滋陰하고, 녹각교가 혈육유정지품血肉有情之品으로서 간신肝腎을 온보溫補하고 정혈精血을 충실히 하여 뇌수腦髓가 마르는 근본 병태를 치료함 산수유, 익지인, 황기 : 산수유가 보익간신補益肝腎, 보신삽정補腎澁精하고 수렴고섭收斂固攝하며, 익지인이 난신고정暖腎固精하고 온비섭타溫脾攝唾하여 신기와 비기를 보강함. 황기가 보기승양補氣升陽하여 후천의 기혈 생화를 돕고 군약의 정혈 보충을 이끔 ②거어화담祛瘀化痰 모듈 — 뇌락에 매복된 어혈과 담탁을 배출하여 통로를 소통시킴 당귀, 천궁 : 당귀가 보혈활혈補血活血하고 천궁이 행기활혈行氣活血, 거풍祛風하여 뇌혈관의 미세순환을 촉진하고 정혈이 뇌규腦竅로 원활히 공급되도록 이끔 酒대황 : 사탁활혈瀉濁活血하되, 주제酒製를 통해 한성寒性을 완화하고 약효를 머리와 뇌 부위로 집중 유도하여 뇌락腦絡에 침착된 실담實痰과 어혈을 배출함 ③개규통락開竅通絡 모듈 — 막힌 뇌규를 뚫어 정신을 깨우고 심신을 안정시킴 석창포, 울금, 원지 : 석창포가 화담투기化痰透氣, 개규성신開竅醒神하여 청기를 뇌로 통하게 하고, 울금이 행기거담行氣祛痰, 해울解鬱하여 기혈의 막힘을 뚫음. 원지가 영심안신寧心安神하고 통신기通神氣하여 심신心腎을 소통시키고 건망健忘을 치료함","master":"①병기 인식 — 본허표실本虛標實과 허실협잡虛實夾雜의 치매관 본本의 파악(근본 원인) : 치매의 근본 병태는 연로함에 따른 신기허쇠腎氣虛衰, 천계天癸의 고갈, 정혈부족精血不足으로 인해 뇌수腦髓가 영양을 잃고 위축되어 발생하는 허증虛證에 있음 표標의 파악(경과 및 진행) : 병이 진행되면서 뇌락腦絡이 막히고 기체혈어氣滯血瘀, 담탁痰濁이 뇌규腦竅를 가로막아 실증實證이 결합함. 이에 따라 본허표실本虛標實 및 허실협잡虛實夾雜의 치매 병태가 형성됨 ②치료 원칙 — 보신건뇌補腎健腦와 담어동치痰瘀同治의 병용 보신건뇌補腎健腦 : 근본인 신정을 채우기 위해 혈육유정지품血肉有情之品인 녹각교와 숙지황을 축으로 삼아 뇌수를 보충하는 보법補法을 기본으로 삼음 담어동치痰瘀同治 : 담痰과 어瘀는 서로 엉켜 뇌락에 깊이 매복하므로, 단순한 보제補劑만 투여하면 증상이 악화됨. 석창포, 울금, 원지와 더불어 酒대황을 배합하여 뇌락의 막힘을 열어주는 개규통락법開竅通絡法을 필수적으로 병행함 酒대황의 독창적 활용 : 대황을 술로 법제(주제酒製)하여 한성寒性을 완화하고 약효 작용을 머리와 뇌 부위로 집중 유도함. 이를 통해 오래된 실담實痰과 어혈을 파쇄破碎하여 배출함 ③병태별 특수 변증 사상 및 임상 응용 퇴행성 노년老年 치매 : 퇴행성 경과로 신정부족腎精不足으로 인한 허증虛證이 주를 이루는 경우, 보신익정補腎益精을 위주로 삼고 거사祛邪를 겸하여 뇌위축 진행을 늦춤 중풍 후 치매(뇌혈관성 병태) : 뇌중풍 후 뇌락腦絡의 어혈과 담탁으로 인한 실증實證이 주를 이루는 경우, 활혈화담活血化痰 및 통락通絡을 위주로 하여 국소 뇌손상이 전반적인 치매로 악화되는 것을 방지함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 치매 대상 중의·중약 제품이 많은 영역이므로, 이 처방은 기존 제품과의 차별점(활혈 강화)을 먼저 정리해야 함 참고문헌 [1] 왕징신,류양,훙쥔.“익지치매방”의 노년 치매 치료 경험“益智治呆方”治療老年呆病經驗[J].신장중의약新疆中醫藥,2011,29(5):87-89."}},{"id":"3-9","ko":"청해음","hz":"淸解飮","alias":"","master_ko":"루팡","master_hz":"盧芳","tagline":"습열불양위위濕熱不攘爲痿 이론에 기반하여 근위축성 측삭경화증(ALS)을 치료하는 처방","meta":{"주요 적응증":"근위축성 측삭경화증(ALS)","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":201,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-9 청해음淸解飮의 모듈 구성<\/p><h4>①분소주설分消走泄 및 청열해독淸熱解毒 모듈 — 습열독사를 대소변으로 배출시켜 사기가 나갈 출로를 열어줌<\/h4><p><b>토대황, 호장<\/b>: 토대황이 사열조습瀉熱燥濕, 거어통부祛瘀通腑하고, 호장이 청열리습해독淸熱利濕解毒, 통소변通小便함. 두 약재의 결합은 습열독사를 대소변으로 배출시키는 분소주설分消走泄의 핵심 축을 이룸<\/p><h4>②청열양혈淸熱涼血 및 활혈산어活血散瘀 모듈 — 혈분의 복화伏火를 제거하고 습열이 오래 머물러 혈어로 변하는 것을 차단함<\/h4><p><b>생지황, 목단피, 적작약<\/b>: 생지황이 청열생진淸熱生津, 양혈양음涼血養陰하여 음혈을 지키고 열사로 인해 진액이 손상되는 것을 방지함. 목단피가 혈분 속의 복화를 가라앉히고, 적작약이 활혈산어活血散瘀함. 세 약재가 협동하여 혈분의 울열鬱熱을 제거함<\/p><h4>③조기선통調氣宣通 및 신온좌합辛溫佐合 모듈 — 울화鬱火를 해소하고 신온한 약재를 가하여 한량함이 기기를 막지 않게 조율함<\/h4><p><b>연교, 서장경<\/b>: 연교가 육경의 울화鬱火를 내리고 습열이 뭉친 것을 흩어내며, 서장경이 제습통락지통除濕通絡止痛함. 고한苦寒한 군신약에 신온辛溫한 서장경을 좌합하여 ‘청열하되 차가운 성질이 기기를 막거나 억누르지 않도록淸熱而不涼遏’ 기기를 소통시킴<\/p>"},{"k":"master","t":"루팡의 근위축성 측삭경화증(ALS) 치료","html":"<h4>①병인병기 인식 — 습열이 발병의 핵심요소이며 오장허손五臟虛損으로 전변됨<\/h4><p>습열이 핵심 병리요소-“습열불양위위濕熱不攘爲痿” 이론<\/p><p class=\"sub\"><b>습열의 형성 원인<\/b>: 음식부절飮食不節로 비실건운脾失健運하여 습사가 내생하고 오래되어 화열化熱하거나, 주변의 불량한 환경으로 외습外濕이 근육, 근맥, 장부로 침입하여 화열함. 습과 열이 서로 엉켜 점니黏膩하고 잘 배출되지 않으며 오래도록 낫지 않음 근, 맥, 골의 손상과 위폐痿廢: 습열이 근육 사이에서 교증交蒸하여 기름이 밀가루에 들어간 듯 점착되면 기혈의 자양을 잃어 사지 근육을 쓰지 못하고 위폐됨. 습열이 근맥을 가로막아 장력의 균형이 무너져 근육이 뼈를 단단히 붙잡아주지 못하고 이완되며, 뼛속에 정체되면 관절을 쓰지 못하게 되어 최종적으로 사지를 완전히 쓰지 못하는 폐용廢用 상태에 도달함<\/p><p>병변장부는 폐, 비, 간, 신이며, 본중지본本中之本은 비脾에 위치함<\/p><p class=\"sub\"><b>비위본중지본脾爲本中之本<\/b>: 비는 후천지본이자 기혈생화지원으로 수곡정미를 운화하여 근육을 자양함. 비실건운하면 습탁이 생겨 비를 해치고 습열이 곤비困脾하여 기혈생화가 고갈되므로 근골기육筋骨肌肉이 자양받지 못해 근육이 위약해짐 모병급자母病及子, 토불양목土不養木의 전변<\/p><p><b>-폐<\/b>: 습열이 폐에 쌓여 진액을 졸이듯 바짝 말려버리면 해천咳喘과 호흡곤란이 생기고, 폐의 선숙宣肅이 실상失常하여 인후를 제대로 쓰지 못해 구음장애構音障礙와 연하장애가 유발되며 종기宗氣가 약해져 호흡쇠약으로 이행함<\/p><p><b>-간, 신<\/b>: 토불양목土不養木으로 간이 자양을 잃고 간신동원肝腎同源에 의해 간신이 모두 허약해짐. 간혈이 부족하여 근맥筋脈을 쓰지 못하면 사지의 진전震顫과 굴신불리가 발생하고, 신정腎精이 고갈되면 골고骨枯하여 걷지 못하는 상태에 이름<\/p><p><b>-오장허손五臟虛損<\/b>: 병 후기에는 습열이 쌓여 독毒을 이루고 오장에 미쳐 전신성, 다장기의 쇠약으로 발전함<\/p><h4>②치료원칙 — 청열리습淸熱利濕, 분소주설分消走泄이 기본 치법<\/h4><p class=\"lbl2\">청해음을 기초방으로 사용<\/p><p class=\"lbl2\">분형시치<\/p><p class=\"sub\"><b>습열곤비증濕熱困脾證<\/b>: 청열조비淸熱燥脾, 사열통부瀉熱通腑로 치료함. 청해음에 인진, 황련을 추가하며, 청열조비를 위해 인진으로 습열을 선산宣散하여 요로로 배출시키고, 황련으로 조습사화燥濕瀉火하여 중초 비위의 습열독을 제거함 습열온폐증濕熱蘊肺證: 선화습열宣化濕熱, 통조수도通調水道로 치료함. 청해음에 행인, 상백피를 추가하며, 선화습열을 위해 행인으로 폐기를 숙강肅降시켜 담탁과 습열을 밑으로 내리고, 상백피로 사폐평천瀉肺平喘하여 폐경의 화열을 제거함 간신양허증肝腎兩虛證: 자보간신滋補肝腎, 강근통독强筋通督으로 치료함. 청해음에 녹각상, 두충, 구척을 추가하며, 녹각상으로 보간신補肝腎, 익정혈益精血하고 독맥을 충실히 하고, 두충과 구척으로 강근골强筋骨, 거풍습祛風濕하여 허해진 하초 선천지본을 보양함 정쇠사심증正衰邪深證: 배원수척培元搜剔, 대보원기大補元氣로 치료함. 청해음에 인삼, 황기, 자하거, 토별충, 오공을 추가하며, 인삼, 황기, 자하거로 대보원기하여 무너진 정기를 회복하고, 오래된 병이 낙맥에 들어간 것이므로 토별충, 오공으로 수척통락搜剔通絡하여 깊은 곳의 어혈과 독사를 제거함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">ALS 대상 처방이 소조증력탕과 함께 2종 있으므로, 두 처방을 묶어 증례 자료를 모으는 것이 현실적<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 마루이,왕샤오루이,쑨치,등.국의대사 루팡 교수의 “습열불양위위” 이론에 기반한 근위축성 측삭경화증 변증 치료 경험 총결國醫大師盧芳教授基於“濕熱不攘爲痿”理論辨治肌萎縮側索硬化的經驗總結[J].중국의약도보中國醫藥導報,2023,20(15):154-158.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"토대황","name":"토대황","dose":"","base":"토대황"},{"raw":"호장","name":  원칙은 ALS 환자에게 흔한 변비 관리와도 연결됨 배변 기능 개선을 별도의 증상 관리 지표로 평가 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1 「분소주설과 청열해독」)","Sourcing 토대황 대체 약재 검토 토대황土大黃은 국내 공정서(대한민국약전·대한민국약전외한약(생약)규격집)에 수재되지 않은 지역 약재임 같은 소리쟁이속으로 규격집에 수재된 양제근羊蹄根 등으로 대체할 때 통변·청열 효과가 유지되는지 개발 착수 전에 확인 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)"],"ss":{"composition":"그림 3-9 청해음淸解飮의 모듈 구성 ①분소주설分消走泄 및 청열해독淸熱解毒 모듈 — 습열독사를 대소변으로 배출시켜 사기가 나갈 출로를 열어줌 토대황, 호장 : 토대황이 사열조습瀉熱燥濕, 거어통부祛瘀通腑하고, 호장이 청열리습해독淸熱利濕解毒, 통소변通小便함. 두 약재의 결합은 습열독사를 대소변으로 배출시키는 분소주설分消走泄의 핵심 축을 이룸 ②청열양혈淸熱涼血 및 활혈산어活血散瘀 모듈 — 혈분의 복화伏火를 제거하고 습열이 오래 머물러 혈어로 변하는 것을 차단함 생지황, 목단피, 적작약 : 생지황이 청열생진淸熱生津, 양혈양음涼血養陰하여 음혈을 지키고 열사로 인해 진액이 손상되는 것을 방지함. 목단피가 혈분 속의 복화를 가라앉히고, 적작약이 활혈산어活血散瘀함. 세 약재가 협동하여 혈분의 울열鬱熱을 제거함 ③조기선통調氣宣通 및 신온좌합辛溫佐合 모듈 — 울화鬱火를 해소하고 신온한 약재를 가하여 한량함이 기기를 막지 않게 조율함 연교, 서장경 : 연교가 육경의 울화鬱火를 내리고 습열이 뭉친 것을 흩어내며, 서장경이 제습통락지통除濕通絡止痛함. 고한苦寒한 군신약에 신온辛溫한 서장경을 좌합하여 ‘청열하되 차가운 성질이 기기를 막거나 억누르지 않도록淸熱而不涼遏’ 기기를 소통시킴","master":"①병인병기 인식 — 습열이 발병의 핵심요소이며 오장허손五臟虛損으로 전변됨 습열이 핵심 병리요소-“습열불양위위濕熱不攘爲痿” 이론 습열의 형성 원인 : 음식부절飮食不節로 비실건운脾失健運하여 습사가 내생하고 오래되어 화열化熱하거나, 주변의 불량한 환경으로 외습外濕이 근육, 근맥, 장부로 침입하여 화열함. 습과 열이 서로 엉켜 점니黏膩하고 잘 배출되지 않으며 오래도록 낫지 않음 근, 맥, 골의 손상과 위폐痿廢: 습열이 근육 사이에서 교증交蒸하여 기름이 밀가루에 들어간 듯 점착되면 기혈의 자양을 잃어 사지 근육을 쓰지 못하고 위폐됨. 습열이 근맥을 가로막아 장력의 균형이 무너져 근육이 뼈를 단단히 붙잡아주지 못하고 이완되며, 뼛속에 정체되면 관절을 쓰지 못하게 되어 최종적으로 사지를 완전히 쓰지 못하는 폐용廢用 상태에 도달함 병변장부는 폐, 비, 간, 신이며, 본중지본本中之本은 비脾에 위치함 비위본중지본脾爲本中之本 : 비는 후천지본이자 기혈생화지원으로 수곡정미를 운화하여 근육을 자양함. 비실건운하면 습탁이 생겨 비를 해치고 습열이 곤비困脾하여 기혈생화가 고갈되므로 근골기육筋骨肌肉이 자양받지 못해 근육이 위약해짐 모병급자母病及子, 토불양목土不養木의 전변 -폐 : 습열이 폐에 쌓여 진액을 졸이듯 바짝 말려버리면 해천咳喘과 호흡곤란이 생기고, 폐의 선숙宣肅이 실상失常하여 인후를 제대로 쓰지 못해 구음장애構音障礙와 연하장애가 유발되며 종기宗氣가 약해져 호흡쇠약으로 이행함 -간, 신 : 토불양목土不養木으로 간이 자양을 잃고 간신동원肝腎同源에 의해 간신이 모두 허약해짐. 간혈이 부족하여 근맥筋脈을 쓰지 못하면 사지의 진전震顫과 굴신불리가 발생하고, 신정腎精이 고갈되면 골고骨枯하여 걷지 못하는 상태에 이름 -오장허손五臟虛損 : 병 후기에는 습열이 쌓여 독毒을 이루고 오장에 미쳐 전신성, 다장기의 쇠약으로 발전함 ②치료원칙 — 청열리습淸熱利濕, 분소주설分消走泄이 기본 치법 청해음을 기초방으로 사용 분형시치 습열곤비증濕熱困脾證 : 청열조비淸熱燥脾, 사열통부瀉熱通腑로 치료함. 청해음에 인진, 황련을 추가하며, 청열조비를 위해 인진으로 습열을 선산宣散하여 요로로 배출시키고, 황련으로 조습사화燥濕瀉火하여 중초 비위의 습열독을 제거함 습열온폐증濕熱蘊肺證: 선화습열宣化濕熱, 통조수도通調水道로 치료함. 청해음에 행인, 상백피를 추가하며, 선화습열을 위해 행인으로 폐기를 숙강肅降시켜 담탁과 습열을 밑으로 내리고, 상백피로 사폐평천瀉肺平喘하여 폐경의 화열을 제거함 간신양허증肝腎兩虛證: 자보간신滋補肝腎, 강근통독强筋通督으로 치료함. 청해음에 녹각상, 두충, 구척을 추가하며, 녹각상으로 보간신補肝腎, 익정혈益精血하고 독맥을 충실히 하고, 두충과 구척으로 강근골强筋骨, 거풍습祛風濕하여 허해진 하초 선천지본을 보양함 정쇠사심증正衰邪深證: 배원수척培元搜剔, 대보원기大補元氣로 치료함. 청해음에 인삼, 황기, 자하거, 토별충, 오공을 추가하며, 인삼, 황기, 자하거로 대보원기하여 무너진 정기를 회복하고, 오래된 병이 낙맥에 들어간 것이므로 토별충, 오공으로 수척통락搜剔通絡하여 깊은 곳의 어혈과 독사를 제거함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 ALS 대상 처방이 소조증력탕과 함께 2종 있으므로, 두 처방을 묶어 증례 자료를 모으는 것이 현실적 참고문헌 [1] 마루이,왕샤오루이,쑨치,등.국의대사 루팡 교수의 “습열불양위위” 이론에 기반한 근위축성 측삭경화증 변증 치료 경험 총결國醫大師盧芳教授基於“濕熱不攘爲痿”理論辨治肌萎縮側索硬化的經驗總結[J].중국의약도보中國醫藥導報,2023,20(15):154-158."}},{"id":"3-10","ko":"자보탕","hz":"滋補湯","alias":"","master_ko":"팡허첸","master_hz":"方和謙","tagline":"사군자탕과 사물탕을 합방가감하여 기혈을 보하고 오장을 조화롭게 하는 대표 처방","meta":{"주요 적응증":"기혈양허·만성 허로","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":205,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-10 자보탕滋補湯의 모듈 구성<\/p><h4>①보기익기補氣益氣 모듈(후천지본後天之本 보강) — 비를 보하고 원기를 북돋움<\/h4><p><b>당삼, 백출, 복령, 감초<\/b>: 사군자탕의 구성으로 비를 튼튼하게 하여 기혈 생화의 근원을 충실히 함<\/p><h4>②양혈자음養血滋陰 모듈(선천지본先天之本 보강) — 음혈을 기르고 정혈을 채워줌<\/h4><p><b>숙지황, 백작약, 당귀<\/b>: 사물탕의 구성으로 간신을 보익하고 음혈을 길러 근맥과 오장을 자양함<\/p><h4>③온양행기溫陽行氣 모듈(기기 소통 및 온보溫補) — 양기를 북돋우고 기기를 소통시켜 정체 방지<\/h4><p><b>육계, 진피, 목향, 대조<\/b>: 명문지화命門之火를 돕고 상중하초의 기기를 소통시켜 보補하되 체滯하지 않게 함<\/p>"},{"k":"master","t":"팡허첸의 허로虛勞 치료","html":"<h4>①병인병기와 치료원칙<\/h4><p>허로는 선천 혹은 후천의 원인으로 기혈양허氣血兩虛 및 음양휴손陰陽虧損이 발생하여 오장이 허손된 만성 쇠약 증후임. 그 본질은 오장허손五臟虛損과 기혈음양氣血陰陽의 부족에 있음<\/p><p>치료의 대법은 허자보지虛者補之이며, 기혈을 보할 때는 비위脾胃를 보하는 것을 위주로 하고 음양을 보할 때는 신腎을 보익하는 것을 원칙으로 삼음<\/p><h4>②자보탕滋補湯의 조방 철학<\/h4><p><b>구성의 유래<\/b>: 《금궤요략·혈비허로병血痹虛勞病》의 보법 9방을 바탕으로 사군자탕과 사물탕의 합방에서 천궁을 빼고 육계, 진피, 목향, 대조를 더하여 구성함<\/p><p><b>천궁 제거와 육계 가미의 의미<\/b>: 행혈 작용이 있는 천궁을 빼어 보혈의 힘을 집중시키고, 온리약溫裏藥인 육계를 더하여 심양心陽과 명문지화命門之火를 북돋움으로써 기혈음양氣血陰陽을 고루 보함<\/p><p><b>보기약과 행기약의 배합<\/b>: 보기·보혈 약물에 진피와 목향 같은 이기·행기 약물을 배합하여 보補하되 체滯하지 않고, 자양滋養하되 니膩하지 않은 특성을 지님<\/p><h4>③자보탕의 임상 활용<\/h4><p><b>자보폐장滋補肺臟, 지해평천止咳平喘<\/b>: 폐장을 보하고 기침을 그치며 천식을 평정함<\/p><p class=\"sub\">만성 기관지염, 효천哮喘, 폐기종, 폐성 심장병 등 질환에 다용함<\/p><p class=\"sub\">폐기휴허肺氣虧虛와 선강불리宣降不利로 인한 흉민기단胸悶氣短, 해천咳喘, 자한自汗, 이외감易外感 등에 자보탕 +맥문동, 백과, 행인, 길경, 자소자, 자소경, 北사삼 등 가미<\/p><p><b>자보심장滋補心臟, 양심안신養心安神<\/b>: 심장을 보하고 심신을 안정시킴<\/p><p class=\"sub\">관상동맥성 심장질환, 선천성 심장병, 류마티스성 심장병 등 심장 질환에 다용함<\/p><p class=\"sub\">심기부족心氣不足, 혈불양심血不養心, 흉양부진胸陽不振으로 인한 심계기단心悸氣短, 흉배동통胸背疼痛, 신피神疲, 맥미脈微 등에 자보탕+炙감초, 단삼, 괄루, 해백, 맥문동, 오미자 등 가미<\/p><p class=\"sub\">신경쇠약, 갱년기 증후군으로 인한 불면, 우울, 경계驚悸, 정충怔忡 등에 자보탕+구기자, 맥문동, 백합, 炒산조인, 부소맥 등 가미<\/p><p><b>자보비장滋補脾臟, 건비화위健脾和胃<\/b>: 비장을 보하고 비위를 조화롭게 함<\/p><p class=\"sub\">만성위염, 만성간염, 간경화 등 소화기 질환에 다용함<\/p><p class=\"sub\">비기허脾氣虛 혹은 간울승비肝鬱乘脾로 인한 납매納呆(식욕부진), 복창복사腹脹腹瀉, 협통脇痛 등에 자보탕+초곡맥炒穀麥, 炒곡아, 炒의이인, 진피, 반하곡半夏曲 혹은 시호, 울금 등 가미<\/p><p><b>자보간장滋補肝臟, 양간청현養肝淸眩<\/b>: 간장을 보하고 간을 길러 어지러움을 다스림<\/p><p class=\"sub\">고혈압, 중풍후유증 등에 다용함<\/p><p class=\"sub\">간음부족肝陰不足, 허양상요청공虛陽上擾淸空, 혈허생풍血虛生風, 근맥실양筋脈失養으로 인한 두훈목현頭暈目眩, 지체마목肢體麻木 등에 자보탕+천마, 구등, 천궁, 국화, 계혈등 등 가미<\/p><p><b>자보신장滋補腎臟, 배원고본培元固本<\/b>: 신장을 보하고 원기를 북돋아 근본을 굳건히 함<\/p><p class=\"sub\">만성신장염, 신쇠腎衰, 비뇨기계 감염, 당뇨병성 신장병 등 질환에 다용함<\/p><p class=\"sub\">신음양휴손腎陰陽虧損으로 인한 요통, 부종 등에 자보탕+구기자, 맥문동, 두충, 상기생을 더해 익신益腎하고, 차전자, 백모근, 편축萹蓄을 더해 청열리습淸熱利濕하며, 우절藕節, 지유탄地榆炭을 더해 지혈止血<\/p><h4>④질환별 핵심 복방(무척도 네트워크(Scale-free Network) 기반)<\/h4><p><b>비증痹證 치료 핵심방<\/b>: 자보탕+의이인, 상기생, 방풍<\/p><p><b>심계心悸 치료 핵심방<\/b>: 자보탕+원지, 백합, 구기자, 맥문동, 산조인<\/p><p><b>현훈眩暈 치료 핵심방<\/b>: 자보탕+구기자, 맥문동, 석곡, 천마, 죽여<\/p><p><b>해천咳喘 치료 핵심방<\/b>: 자보탕+맥문동, 반하, 오미자, 건강<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">만성 허로 대상 보익 처방은 국내 기존 한방 제제(십전대보탕 등)와 겹치므로 차별점 확인이 선행되어야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 자오톄량.팡허첸의 ‘자보탕’ 임상 활용 경험 소개方和謙運用“滋補湯”臨床經驗介紹[J].편집지우編輯之友,1996,(1):3-4.<\/li><li class=\"ref\">[2] 취안훙.팡허첸 자의 ‘자보탕’의 허로 치료에 대한 고찰淺談方和謙自擬“滋補湯”治療虛勞[J].중국중의약정보잡지中國中醫藥信息雜志,2006,(2):80-81.<\/li><li class=\"ref\">[3] 가오젠훙,리원취안,판춘치,등.팡허첸 경험방 ‘자보탕’의 임상 응용 데이터 마이닝 연구方和謙經驗方“滋補湯”臨床應用數據挖掘研究[J].지린중의약吉林中醫藥,2014,34(1):32-34.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당삼","name":"당삼","dose":"","base":"당삼"},{"raw":"백출","name":"백출","dose":"","base":"백출"},{"raw":"복령","name":"복령","dose":"","base":"복령"},{"raw":"감초","name":"감초","dose":"","base":"감초"},{"raw":"숙지황","name":"숙지황","dose":"","base":"숙지황"},{"raw":"백작약","name":"백작약","dose":"","base":"백작약"},{"raw":"당귀","name":"당귀","dose":"","base":"당귀"},{"raw":"육계","name":"육계","dose":"","base":"육계"},{"raw":"진피","name":"진피","dose":"","base":"진피"},{"raw":"목향","name":"목향","dose":"","base":"목향"},{"raw":"대조","name":"대조","dose":"","base":"대조"}],"notes":[],"핵심 효능":["사군자탕·사물탕으로 기와 혈을 함께 보충함(보기양혈補氣養血)","음액을 자양하고 양기를 화평하게 조율함(자음화양滋陰和陽)","심신을 기르고 중초 비위를 튼튼하게 함(양심건비養心健脾)","폐기를 보익하고 신장을 보호함(익폐호신益肺護腎)","간을 부드럽게 하고 위를 조화롭게 함(유간화위柔肝和胃)"],"주치증":["기혈양허氣血兩虛 및 오장허손으로 인한 각종 만성 허로 증후"],"연구 확장 영역":["만성 호흡기 질환(만성 기관지염, 천식), 심혈관 질환(관상동맥질환, 심계), 소화기 질환(만성 위장염, 간경화), 뇌혈관 질환(고혈압, 중풍 후유증), 신장 질환(만성 신염) 및 당뇨병 등"],"R&D 포인트":["사군자탕 및 사물탕에 육계, 진피, 목향, 대조를 가미한 배합이 기혈 생성과 경락 소통에 미치는 약리학적 작용 분석","무척도 네트워크 모델 및 데이터 마이닝 기반 분석을 통한 ‘자보탕’ 핵심 복방의 임상 응용 배합 구조 규명","환자의 거시적 질병 상태와 허로 증후에 따른 가감 활용의 유효성 검증"]},"modules":[{"name":"①보기익기","hz":"補氣益氣 · 後天之本","herbs":["당삼","백출","복령","감초"],"role":"비를 보하고 원기를 북돋움"},{"name":"②양혈자음","hz":"養血滋陰 · 先天之本","herbs":["숙지황","백작약","당귀"],"role":"음혈을 기르고 정혈을 채워줌"},{"name":"③온양행기","hz":"溫陽行氣","herbs":["육계","진피","목향","대조"],"role":"양기를 북돋우고 기기를 소통시켜 정체 방지"}],"rd":[{"tag":"Fatigue & Frailty","title":"만성 피로·노쇠 환자의 기혈양허 개선","html":"<p>‘허로虛勞’를 현대적으로는 만성 피로와 노쇠로 해석할 수 있음<\/p><p>피로 척도(FSS)·악력·보행 속도를 지표로 한 탐색 임상이 적합하되, 만성 피로와 노쇠는 별도의 임상 표현형으로 나누어 평가 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2006, 허로 치료 고찰), 본문 주치증)<\/p>"},{"tag":"Formula Lineage","title":"팔진탕 골격 대비 육계·진피·목향 가미의 의미","html":"<p>사군자탕과 사물탕의 골격(팔진탕 계열)에 육계·진피·목향을 더한 구성임 팔진탕 대비 소화 부담 감소와 효과 차이를 비교하여 ‘보하되 체하지 않음’을 확인 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&amp;D 논리 3 「온양행기와 기기소통」)<\/p>"},{"tag":"Anemia","title":"경도 빈혈·회복기 환자의 혈액학 지표","html":"<p>빈혈은 철 결핍·비타민 B12 결핍 등 원인을 먼저 감별·교정해야 함<\/p><p>원인 치료와 별개로 양혈 약재(숙지황·당귀·백작약)의 효과를 경도 빈혈 또는 수술· 항암 후 회복기 환자의 헤모글로빈 변화로 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「양혈자음과 선천보강」)<\/p>"},{"tag":"Data-driven Indication","title":"데이터 마이닝 기반 우선 적응증 선정","html":"<p>임상 응용 데이터 마이닝 결과에서 사용 빈도가 높은 질환군을 우선 적응증으로 선정함<\/p><p>이로써 ‘각종 허로’라는 넓은 범위를 개발 가능한 적응증으로 좁힐 수 있음 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [3](2014, 데이터 마이닝 연구))<\/p>"}],"logic":[{"n":"1","title":"보기익기補氣益氣와 후천보강後天補强","body":"비위를 건실하게 하여 기혈 생화의 근원을 충실히 함"},{"n":"2","title":"양혈자음養血滋陰과 선천보강先天補强","body":"간신을 보익하고 음혈을 길러 근맥과 오장을 영양함"},{"n":"3","title":"온양행기溫陽行氣와 기기소통氣機疏通","body":"명문지화와 상중하초의 기기를 소통시켜 보하되 체하지 않게 함"},{"n":"4","title":"오장조화五臟調和와 다중표적치료","body":"기혈음양을 고루 보하여 만성 허로 및 오장허손을 회복함"}],"field":3,"pages":[205,209],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["3-10","자보탕","滋補湯","","팡허첸","方和謙","사군자탕과 사물탕을 합방가감하여 기혈을 보하고 오장을 조화롭게 하는 대표 처방","당삼 백출 복령 감초 숙지황 백작약 당귀 육계 진피 목향 대조","","핵심 효능 사군자탕·사물탕으로 기와 혈을 함께 보충함(보기양혈補氣養血) 음액을 자양하고 양기를 화평하게 조율함(자음화양滋陰和陽) 심신을 기르고 중초 비위를 튼튼하게 함(양심건비養心健脾) 폐기를 보익하고 신장을 보호함(익폐호신益肺護腎) 간을 부드럽게 하고 위를 조화롭게 함(유간화위柔肝和胃)","주치증 기혈양허氣血兩虛 및 오장허손으로 인한 각종 만성 허로 증후","연구 확장 영역 만성 호흡기 질환(만성 기관지염, 천식), 심혈관 질환(관상동맥질환, 심계), 소화기 질환(만성 위장염, 간경화), 뇌혈관 질환(고혈압, 중풍 후유증), 신장 질환(만성 신염) 및 당뇨병 등","R&D 포인트 사군자탕 및 사물탕에 육계, 진피, 목향, 대조를 가미한 배합이 기혈 생성과 경락 소통에 미치는 약리학적 작용 분석 무척도 네트워크 모델 및 데이터 마이닝 기반 분석을 통한 ‘자보탕’ 핵심 복방의 임상 응용 배합 구조 규명 환자의 거시적 질병 상태와 허로 증후에 따른 가감 활용의 유효성 검증","①보기익기 補氣益氣 · 後天之本 당삼 백출 복령 감초 비를 보하고 원기를 북돋움","②양혈자음 養血滋陰 · 先天之本 숙지황 백작약 당귀 음혈을 기르고 정혈을 채워줌","③온양행기 溫陽行氣 육계 진피 목향 대조 양기를 북돋우고 기기를 소통시켜 정체 방지","보기익기補氣益氣와 후천보강後天補强 비위를 건실하게 하여 기혈 생화의 근원을 충실히 함","양혈자음養血滋陰과 선천보강先天補强 간신을 보익하고 음혈을 길러 근맥과 오장을 영양함","온양행기溫陽行氣와 기기소통氣機疏通 명문지화와 상중하초의 기기를 소통시켜 보하되 체하지 않게 함","오장조화五臟調和와 다중표적치료 기혈음양을 고루 보하여 만성 허로 및 오장허손을 회복함","Fatigue & Frailty 만성 피로·노쇠 환자의 기혈양허 개선 ‘허로虛勞’를 현대적으로는 만성 피로와 노쇠로 해석할 수 있음 피로 척도(FSS)·악력·보행 속도를 지표로 한 탐색 임상이 적합하되, 만성 피로와 노쇠는 별도의 임상 표현형으로 나누어 평가 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](2006, 허로 치료 고찰), 본문 주치증)","Formula Lineage 팔진탕 골격 대비 육계·진피·목향 가미의 의미 사군자탕과 사물탕의 골격(팔진탕 계열)에 육계·진피·목향을 더한 구성임 팔진탕 대비 소화 부담 감소와 효과 차이를 비교하여 ‘보하되 체하지 않음’을 확인 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&D 논리 3 「온양행기와 기기소통」)","Anemia 경도 빈혈·회복기 환자의 혈액학 지표 빈혈은 철 결핍·비타민 B12 결핍 등 원인을 먼저 감별·교정해야 함 원인 치료와 별개로 양혈 약재(숙지황·당귀·백작약)의 효과를 경도 빈혈 또는 수술· 항암 후 회복기 환자의 헤모글로빈 변화로 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「양혈자음과 선천보강」)","Data-driven Indication 데이터 마이닝 기반 우선 적응증 선정 임상 응용 데이터 마이닝 결과에서 사용 빈도가 높은 질환군을 우선 적응증으로 선정함 이로써 ‘각종 허로’라는 넓은 범위를 개발 가능한 적응증으로 좁힐 수 있음 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [3](2014, 데이터 마이닝 연구))"],"ss":{"composition":"그림 3-10 자보탕滋補湯의 모듈 구성 ①보기익기補氣益氣 모듈(후천지본後天之本 보강) — 비를 보하고 원기를 북돋움 당삼, 백출, 복령, 감초 : 사군자탕의 구성으로 비를 튼튼하게 하여 기혈 생화의 근원을 충실히 함 ②양혈자음養血滋陰 모듈(선천지본先天之本 보강) — 음혈을 기르고 정혈을 채워줌 숙지황, 백작약, 당귀 : 사물탕의 구성으로 간신을 보익하고 음혈을 길러 근맥과 오장을 자양함 ③온양행기溫陽行氣 모듈(기기 소통 및 온보溫補) — 양기를 북돋우고 기기를 소통시켜 정체 방지 육계, 진피, 목향, 대조 : 명문지화命門之火를 돕고 상중하초의 기기를 소통시켜 보補하되 체滯하지 않게 함","master":"①병인병기와 치료원칙 허로는 선천 혹은 후천의 원인으로 기혈양허氣血兩虛 및 음양휴손陰陽虧損이 발생하여 오장이 허손된 만성 쇠약 증후임. 그 본질은 오장허손五臟虛損과 기혈음양氣血陰陽의 부족에 있음 치료의 대법은 허자보지虛者補之이며, 기혈을 보할 때는 비위脾胃를 보하는 것을 위주로 하고 음양을 보할 때는 신腎을 보익하는 것을 원칙으로 삼음 ②자보탕滋補湯의 조방 철학 구성의 유래 : 《금궤요략·혈비허로병血痹虛勞病》의 보법 9방을 바탕으로 사군자탕과 사물탕의 합방에서 천궁을 빼고 육계, 진피, 목향, 대조를 더하여 구성함 천궁 제거와 육계 가미의 의미 : 행혈 작용이 있는 천궁을 빼어 보혈의 힘을 집중시키고, 온리약溫裏藥인 육계를 더하여 심양心陽과 명문지화命門之火를 북돋움으로써 기혈음양氣血陰陽을 고루 보함 보기약과 행기약의 배합 : 보기·보혈 약물에 진피와 목향 같은 이기·행기 약물을 배합하여 보補하되 체滯하지 않고, 자양滋養하되 니膩하지 않은 특성을 지님 ③자보탕의 임상 활용 자보폐장滋補肺臟, 지해평천止咳平喘 : 폐장을 보하고 기침을 그치며 천식을 평정함 만성 기관지염, 효천哮喘, 폐기종, 폐성 심장병 등 질환에 다용함 폐기휴허肺氣虧虛와 선강불리宣降不利로 인한 흉민기단胸悶氣短, 해천咳喘, 자한自汗, 이외감易外感 등에 자보탕 +맥문동, 백과, 행인, 길경, 자소자, 자소경, 北사삼 등 가미 자보심장滋補心臟, 양심안신養心安神 : 심장을 보하고 심신을 안정시킴 관상동맥성 심장질환, 선천성 심장병, 류마티스성 심장병 등 심장 질환에 다용함 심기부족心氣不足, 혈불양심血不養心, 흉양부진胸陽不振으로 인한 심계기단心悸氣短, 흉배동통胸背疼痛, 신피神疲, 맥미脈微 등에 자보탕+炙감초, 단삼, 괄루, 해백, 맥문동, 오미자 등 가미 신경쇠약, 갱년기 증후군으로 인한 불면, 우울, 경계驚悸, 정충怔忡 등에 자보탕+구기자, 맥문동, 백합, 炒산조인, 부소맥 등 가미 자보비장滋補脾臟, 건비화위健脾和胃 : 비장을 보하고 비위를 조화롭게 함 만성위염, 만성간염, 간경화 등 소화기 질환에 다용함 비기허脾氣虛 혹은 간울승비肝鬱乘脾로 인한 납매納呆(식욕부진), 복창복사腹脹腹瀉, 협통脇痛 등에 자보탕+초곡맥炒穀麥, 炒곡아, 炒의이인, 진피, 반하곡半夏曲 혹은 시호, 울금 등 가미 자보간장滋補肝臟, 양간청현養肝淸眩 : 간장을 보하고 간을 길러 어지러움을 다스림 고혈압, 중풍후유증 등에 다용함 간음부족肝陰不足, 허양상요청공虛陽上擾淸空, 혈허생풍血虛生風, 근맥실양筋脈失養으로 인한 두훈목현頭暈目眩, 지체마목肢體麻木 등에 자보탕+천마, 구등, 천궁, 국화, 계혈등 등 가미 자보신장滋補腎臟, 배원고본培元固本 : 신장을 보하고 원기를 북돋아 근본을 굳건히 함 만성신장염, 신쇠腎衰, 비뇨기계 감염, 당뇨병성 신장병 등 질환에 다용함 신음양휴손腎陰陽虧損으로 인한 요통, 부종 등에 자보탕+구기자, 맥문동, 두충, 상기생을 더해 익신益腎하고, 차전자, 백모근, 편축萹蓄을 더해 청열리습淸熱利濕하며, 우절藕節, 지유탄地榆炭을 더해 지혈止血 ④질환별 핵심 복방(무척도 네트워크(Scale-free Network) 기반) 비증痹證 치료 핵심방 : 자보탕+의이인, 상기생, 방풍 심계心悸 치료 핵심방 : 자보탕+원지, 백합, 구기자, 맥문동, 산조인 현훈眩暈 치료 핵심방 : 자보탕+구기자, 맥문동, 석곡, 천마, 죽여 해천咳喘 치료 핵심방 : 자보탕+맥문동, 반하, 오미자, 건강","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 만성 허로 대상 보익 처방은 국내 기존 한방 제제(십전대보탕 등)와 겹치므로 차별점 확인이 선행되어야 함 참고문헌 [1] 자오톄량.팡허첸의 ‘자보탕’ 임상 활용 경험 소개方和謙運用“滋補湯”臨床經驗介紹[J].편집지우編輯之友,1996,(1):3-4. [2] 취안훙.팡허첸 자의 ‘자보탕’의 허로 치료에 대한 고찰淺談方和謙自擬“滋補湯”治療虛勞[J].중국중의약정보잡지中國中醫藥信息雜志,2006,(2):80-81. [3] 가오젠훙,리원취안,판춘치,등.팡허첸 경험방 ‘자보탕’의 임상 응용 데이터 마이닝 연구方和謙經驗方“滋補湯”臨床應用數據挖掘研究[J].지린중의약吉林中醫藥,2014,34(1):32-34."}},{"id":"3-11","ko":"청뇌통락탕","hz":"淸腦通絡湯","alias":"","master_ko":"장쉐원","master_hz":"張學文","tagline":"뇌장腦臟 이론과 간열혈어肝熱血瘀 병기를 바탕으로 노인성 인지장애와 중풍 전조증을 치료하는 대표 처방","meta":{"주요 적응증":"혈관성 인지장애, 중풍 전조증","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":210,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-11 청뇌통락탕淸腦通絡湯의 모듈 구성<\/p><h4>①청간성뇌淸肝醒腦, 평간잠양平肝潛陽 모듈 — 상부의 간열을 내리고 상역하는 간양을 가라앉혀 뇌를 깨움<\/h4><p><b>결명자, 국화, 자석<\/b>: 결명자와 국화는 청간명목淸肝明目하고, 자석은 평간잠양平肝潛陽하여 상역하는 화열火熱을 다스림<\/p><h4>②양혈양혈화어養血涼血化瘀, 통락지통通絡止痛 모듈 — 혈을 기르고 어혈을 풀어 뇌락을 소통시킴<\/h4><p><b>단삼, 적작약, 천궁, 산사<\/b>: 혈을 기르고 양혈涼血하며, 활혈화어活血化瘀하여 혈맥을 소통시킴<\/p><p><b>희렴초<\/b>: 거풍제습祛風除濕하고 청열淸熱하여 경락을 소통시킴<\/p><p><b>지룡, 수질<\/b>: 동물성 충약으로서 강력하게 뇌락腦絡의 어체瘀滯를 소통시킴<\/p><h4>③배본인경培本引經 모듈 — 하부로 열을 이끌고 심신을 안정시키며 뇌로 맑은 기운이 오르게 함<\/h4><p><b>우슬<\/b>: 보간신補肝腎하고 상역하는 혈열血熱을 아래로 이끌며 하부로 유도함<\/p><p><b>갈근<\/b>: 진액을 생기게 하고 비위의 청기를 머리와 뇌로 끌어올려 경락을 소통시킴<\/p>"},{"k":"master","t":"장쉐원의 노인성 인지장애 치료","html":"<h4>①뇌장腦臟 이론<\/h4><p>대사는 사려우려思慮憂慮, 노상심비勞傷心脾, 심기부족心氣不足 또는 간신부족肝腎不足, 수불함목水不涵木, 뇌수실충腦髓失充, 또는 장부실조臟腑失調, 기혈휴허氣血虧虛, 심뇌실양心腦失養, 또는 담탁어혈痰濁瘀血의 상몽청규上蒙淸竅등으로 노인성 인지장애의 원인을 보던 전통적 이론을 뛰어넘어 “뇌당위장론腦當爲臟論”을 주장하고 중의 뇌장腦臟체계 이론을 확립함<\/p><p>뇌의 독특한 생리·병리적 특징을 다음의 다섯 가지로 체계화함<\/p><p class=\"sub\"><b>제양지회諸陽之會, 양이항陽易亢<\/b>: 머리는 인체 최고점인 전정巔頂에 위치하여 양위陽位에 속하므로, 간양상항肝陽上亢, 심화상염心火上炎, 풍열상요風熱上擾 등의 양항陽亢에 쉽게 손상됨<\/p><p class=\"sub\"><b>원신지부元神之府, 신이상神易傷<\/b>: 뇌는 원신이 거처하는 곳으로 선천의 신기와 후천의 기혈에 의존하여 영양을 받는데, 노인의 경우 신기腎氣가 허하고 장부 기혈이 부족하여 원신이 쉽게 손상됨<\/p><p class=\"sub\"><b>청령지규淸靈之竅, 규이폐竅易閉<\/b>: 뇌규는 맑고 영민하여야 의식이 맑고 사고가 민첩한데, 담탁이나 어혈이 뇌규를 막으면 신혼神昏 또는 혼미昏迷, 사유지둔思維遲鈍, 건망健忘 및 치매 등이 발생함<\/p><p class=\"sub\"><b>제수지해諸髓之海, 수이허髓易虛<\/b>: 뇌는 수의 바다인데, 구병久病으로 신이 상하거나 노인성 신기 부족으로 뇌수腦髓가 불충하면 정신이 피로하고 건망이나 치매가 발생함<\/p><p class=\"sub\"><b>제맥지회諸脈之會, 뇌이손腦易損<\/b>: 뇌는 모든 맥이 모이는 곳으로 대량의 혈류와 에너지가 필요한데, 담탁과 어혈 등의 병리 산물이 뇌맥을 막아 뇌맥어조腦脈瘀阻가 되면 뇌수가 영양을 잃고 뇌신이 주관을 잃어 두통, 현훈, 건망, 치매 등이 발생함<\/p><h4>②병인병기 — 노인성 인지장애의 형성 경로는 다음과 같음<\/h4><p><b>근본원인<\/b>: 신허腎虛로 인해 뇌수를 채우지 못하는 것에 있음. 뇌는 신정腎精과 신기腎氣가 충족해야 생수生髓 기능이 왕성해져 뇌수가 청령淸靈하고 뇌신腦神이 민첩해지나, 노인성 체허體虛나 구병久病으로 신기가 부족하면 수해가 부족해져 뇌수가 영양을 잃고 신피건망神疲健忘이나 치매로 이어짐<\/p><p><b>필요조건<\/b>: 장부실조, 기혈휴허氣血虧虛로 뇌수가 영양을 잃는 것임. 오장실화五臟失和, 간울기체肝鬱氣滯, 비실건운脾失健運 등으로 인해 진액이 수포輸布되지 못하고 기혈이 조달되지 못하여 기허氣虛, 담탁痰濁, 혈어血瘀 등이 발생함<\/p><p><b>핵심 고리<\/b>: 뇌수공허腦髓空虛와 담어痰瘀에 의한 뇌수 조체阻滯임. 음양실조로 인해 하부는 음이 허하고 상부는 양이 항성하며 허풍이 내동하면, 담탁과 어혈이 뇌락을 막아 뇌의 청령한 상태를 파괴하고 뇌수를 잡둔실령雜鈍失靈(혼탁하고 둔하게 만들어 정상적인 기능 상실)하게 만듦<\/p><p><b>최종 병리 결과<\/b>: 이러한 병기들이 누적되어 뇌수실충실양腦髓失充失養과 신명실용神明失用으로 이어져 인지 기능 저하와 치매가 발생함<\/p><h4>③청뇌통락법淸腦通絡法(청뇌통락탕 사용)의 실천 및 작용 기전<\/h4><p><b>고위험 요소 제어 및 TIA·중풍 전조증 개선<\/b>: 간열혈어肝熱血瘀 등의 병기를 다스려 중풍 전조증과 일과성 뇌허혈 발작 (TIA)의 발작 빈도를 유의하게 감소시키고 제반 임상 증상의 개선을 보고함. 특히 혈소판 응집의 핵심 인자이자 혈전성 질환 예측 지표인 혈소판 막당단백질 CD41의 발현을 유의하게 억제함으로써, 혈소판 점착 및 응집 능력을 낮추어 뇌혈관의 혈류를 원활하게 하고 혈관성 인지 장애로의 이행을 늦출 가능성을 제시함<\/p><p><b>인지 기능 및 뇌 조직(해마 돌기) 개선 효과<\/b>: 동물 실험에서 Morris 수중미로 학습·기억 능력 평가 시 평균 잠복기를 단축하고 플랫폼 구역에서의 수영 시간을 유의하게 연장함. 또한 랫드의 해마 CA1 및 CA3 분자층의 시냅스 수밀도(Nv) 와 시냅스 연결대 면밀도(Sv)의 감소를 유의하게 억제하여 신경돌기 및 시냅스 구조 손상을 방어함<\/p><p><b>혈뇌장벽(BBB) 보호 및 미세색전 배출 기전(동물 실험)<\/b>: 뇌혈관의 미세색전 배출 능력을 강화하여 담탁이나 어혈 등의 병리 산물이 뇌규를 막는 것을 차단함. 구체적으로 밀착연접 단백질 ZO-1과 내피세포 지표 CD31의 발현을 상향 조절하고, 기저막 분해 효소인 MMP-2 및 MMP-9의 수치와 활성을 억제하여 세포외기질의 과도한 분해를 막음. 이를 통해 뇌혈관의 내·중막 구조 이상을 완화하고 혈뇌장벽의 구조적·기능적 손상을 억제함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">혈관성 인지장애 대상 공개자료상 제품·특허가 확인되지 않아, 중풍 후 인지 저하 환자의 관찰연구로 개발 가능성을 확인할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 쑨징보,화룽,푸원빈,등.장쉐원 국의대사의 청뇌통락법에 기반한 노인성 인지장애 분석基於張學文國醫大師淸腦通絡法分析老年性認知障礙[J].산시중의약 대학학보陝西中醫藥大學學報,2020,43(2):31-35.<\/li><li class=\"ref\">[2] 저우하이저,자오환,옌야펑.국의대사 장쉐원의 열어논치에 따른 중풍 전조증 치료 사상 탐구國醫大師張學文從熱瘀論治中風先兆症思想探析[J].중화중의약 잡지中華中醫藥雜志,2022,37(7):3928-3931.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"결명자30g","name":"결명자","dose":"30g","base":"결명자"},{"raw":"단삼15g","name":"단삼","dose":"15g","base":"단삼"},{"raw":"천궁12g","name":"천궁","dose":"12g","base":"천궁"},{"raw":"지룡10g","name":"지룡","dose":"10g","base":"지룡"},{"raw":"수질6g","name":"수질","dose":"6g","base":"수질"},{"raw":"산사15g","name":"산사","dose":"15g","base":"산사"},{"raw":"국화12g","name":"국화","dose":"12g","base":"국화"},{"raw":"자석( 先煎) 30g","name":"자석( 先煎)","dose":"30g","base":"자석"},{"raw":"갈근15g","name":"갈근","dose":"15g","base":"갈근"},{"raw":"적작약10g","name":"적작약","dose":"10g","base":"적작약"},{"raw":"희렴초豨薟草30g","name":"희렴초豨薟草","dose":"30g","base":"희렴초"},{"raw":"川우슬15g","name":"川우슬","dose":"15g","base":"우슬"}],"notes":[],"핵심 효능":["간열을 내리고 뇌를 맑게 깨움(청간성뇌淸肝醒腦)","혈을 기르고 심신을 안정시키며 번조를 없앰(양혈안신養血安神)","어혈을 풀고 뇌락을 소통시킴(화어통락化瘀通絡)"],"주치증":["노인성 인지장애(혈관성 인지 장애 및 치매), 중풍 전조증, 고혈압성 두통, 혈관성 두통 등"],"연구 확장 영역":["노인성 인지장애, 알츠하이머병, 혈관성 치매 등의 신경퇴행성 질환, 중풍 전조증, 일과성 뇌허혈 발작 등의 뇌혈관 질환"],"R&D 포인트":["청열평간淸熱平肝 약물과 충약蟲藥 배합이 혈소판 막당단백질 CD41 발현 및 혈류역학에 미치는 영향 분석","노인성 인지장애 모델 랫드의 Morris 수중미로 학습·기억 능력 개선 효과 검증","혈뇌장벽 밀착연접 단백질(ZO-1) 보호 및 기질금속단백분해효소(MMP-2, MMP-9) 활성 억제를 통한 뇌혈관 및 신경조직 보호 기전 연구"]},"modules":[{"name":"①청간성뇌 · 평간잠양","hz":"淸肝醒腦 · 平肝潛陽","herbs":["결명자","국화","자석"],"role":"상부의 간열을 내리고 상역하는 간양을 가라앉혀 뇌를 깨움"},{"name":"②양혈양혈화어 · 통락지통","hz":"養血涼血化瘀 · 通絡止痛","herbs":["단삼","적작약","천궁","산사","희렴초","지룡","수질"],"role":"혈을 기르고 어혈을 풀어 뇌락을 소통시킴"},{"name":"③배본인경","hz":"培本引經","herbs":["우슬","갈근"],"role":"하부로 열을 이끌고 심신을 안정시키며 뇌로 맑은 기운이 오르게 함"}],"rd":[{"tag":"Vascular Cognitive Impairment","title":"혈관성 인지장애의 인지 지표","html":"<p>청뇌통락법에 따른 노인성 인지장애 분석이 있음<\/p><p>고혈압 동반 혈관성 인지장애 환자에서 MoCA와 실행 기능 검사를 지표로 한 탐색 임상이 출발점 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](청뇌통락법 기반 인지장애 분석))<\/p>"},{"tag":"Leech & Bleeding Risk","title":"수질 포함 처방의 출혈 위험 관리","html":"<p>수질水蛭(거머리)은 항응고 작용이 강함<\/p><p>아스피린·클로피도그렐 등 항혈소판제를 함께 복용하는 고령 환자에서는 출혈 지표와 약물 상호작용을 먼저 평가해야 함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 2 「양혈양혈화어와 통락지통」)<\/p>"},{"tag":"Stroke Prodrome","title":"중풍 전조증·일과성 허혈발작 환자의 보조 효과(고위험 가설)","html":"<p>‘열어熱瘀’ 관점의 중풍 전조증은 일과성 허혈발작(TIA)과 같은 개념이 아니므로 동일시하지 않음<\/p><p>TIA 환자는 표준 항혈소판·위험인자 치료를 유지한 상태에서 출혈 안전성을 먼저 확인한 뒤 보조 효과를 탐색 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [2](열어 이론과 중풍 전조증))<\/p>"},{"tag":"Blood Pressure","title":"결명자·국화·자석의 혈압 조절 효과","html":"<p>평간잠양 약재군(결명자 30g·국화·자석)이 고혈압성 두통 환자의 혈압과 두통 빈도를 낮추는지 확인함<\/p><p><b>결명자 대용량의 설사 부작용을 함께 점검 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 1 「청간성뇌와 평간잠양」, 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"청간성뇌淸肝醒腦와 평간잠양平肝潛陽","body":"상부의 간열을 내리고 상역하는 간양을 가라앉혀 뇌를 깨움"},{"n":"2","title":"양혈양혈화어養血涼血化瘀와 통락지통通絡止痛","body":"혈을 기르고 어혈을 풀어 뇌락을 소통시킴"},{"n":"3","title":"배본인경培本引經과 청기상승淸氣上升","body":"하부로 열을 이끌고 심신을 안정시키며 뇌로 청기가 오르게 함"},{"n":"4","title":"뇌당위장론腦  평간잠양平肝潛陽 모듈 — 상부의 간열을 내리고 상역하는 간양을 가라앉혀 뇌를 깨움 결명자, 국화, 자석 : 결명자와 국화는 청간명목淸肝明目하고, 자석은 평간잠양平肝潛陽하여 상역하는 화열火熱을 다스림 ②양혈양혈화어養血涼血化瘀, 통락지통通絡止痛 모듈 — 혈을 기르고 어혈을 풀어 뇌락을 소통시킴 단삼, 적작약, 천궁, 산사 : 혈을 기르고 양혈涼血하며, 활혈화어活血化瘀하여 혈맥을 소통시킴 희렴초 : 거풍제습祛風除濕하고 청열淸熱하여 경락을 소통시킴 지룡, 수질 : 동물성 충약으로서 강력하게 뇌락腦絡의 어체瘀滯를 소통시킴 ③배본인경培本引經 모듈 — 하부로 열을 이끌고 심신을 안정시키며 뇌로 맑은 기운이 오르게 함 우슬 : 보간신補肝腎하고 상역하는 혈열血熱을 아래로 이끌며 하부로 유도함 갈근 : 진액을 생기게 하고 비위의 청기를 머리와 뇌로 끌어올려 경락을 소통시킴","master":"①뇌장腦臟 이론 대사는 사려우려思慮憂慮, 노상심비勞傷心脾, 심기부족心氣不足 또는 간신부족肝腎不足, 수불함목水不涵木, 뇌수실충腦髓失充, 또는 장부실조臟腑失調, 기혈휴허氣血虧虛, 심뇌실양心腦失養, 또는 담탁어혈痰濁瘀血의 상몽청규上蒙淸竅등으로 노인성 인지장애의 원인을 보던 전통적 이론을 뛰어넘어 “뇌당위장론腦當爲臟論”을 주장하고 중의 뇌장腦臟체계 이론을 확립함 뇌의 독특한 생리·병리적 특징을 다음의 다섯 가지로 체계화함 제양지회諸陽之會, 양이항陽易亢 : 머리는 인체 최고점인 전정巔頂에 위치하여 양위陽位에 속하므로, 간양상항肝陽上亢, 심화상염心火上炎, 풍열상요風熱上擾 등의 양항陽亢에 쉽게 손상됨 원신지부元神之府, 신이상神易傷 : 뇌는 원신이 거처하는 곳으로 선천의 신기와 후천의 기혈에 의존하여 영양을 받는데, 노인의 경우 신기腎氣가 허하고 장부 기혈이 부족하여 원신이 쉽게 손상됨 청령지규淸靈之竅, 규이폐竅易閉 : 뇌규는 맑고 영민하여야 의식이 맑고 사고가 민첩한데, 담탁이나 어혈이 뇌규를 막으면 신혼神昏 또는 혼미昏迷, 사유지둔思維遲鈍, 건망健忘 및 치매 등이 발생함 제수지해諸髓之海, 수이허髓易虛 : 뇌는 수의 바다인데, 구병久病으로 신이 상하거나 노인성 신기 부족으로 뇌수腦髓가 불충하면 정신이 피로하고 건망이나 치매가 발생함 제맥지회諸脈之會, 뇌이손腦易損 : 뇌는 모든 맥이 모이는 곳으로 대량의 혈류와 에너지가 필요한데, 담탁과 어혈 등의 병리 산물이 뇌맥을 막아 뇌맥어조腦脈瘀阻가 되면 뇌수가 영양을 잃고 뇌신이 주관을 잃어 두통, 현훈, 건망, 치매 등이 발생함 ②병인병기 — 노인성 인지장애의 형성 경로는 다음과 같음 근본원인 : 신허腎虛로 인해 뇌수를 채우지 못하는 것에 있음. 뇌는 신정腎精과 신기腎氣가 충족해야 생수生髓 기능이 왕성해져 뇌수가 청령淸靈하고 뇌신腦神이 민첩해지나, 노인성 체허體虛나 구병久病으로 신기가 부족하면 수해가 부족해져 뇌수가 영양을 잃고 신피건망神疲健忘이나 치매로 이어짐 필요조건 : 장부실조, 기혈휴허氣血虧虛로 뇌수가 영양을 잃는 것임. 오장실화五臟失和, 간울기체肝鬱氣滯, 비실건운脾失健運 등으로 인해 진액이 수포輸布되지 못하고 기혈이 조달되지 못하여 기허氣虛, 담탁痰濁, 혈어血瘀 등이 발생함 핵심 고리 : 뇌수공허腦髓空虛와 담어痰瘀에 의한 뇌수 조체阻滯임. 음양실조로 인해 하부는 음이 허하고 상부는 양이 항성하며 허풍이 내동하면, 담탁과 어혈이 뇌락을 막아 뇌의 청령한 상태를 파괴하고 뇌수를 잡둔실령雜鈍失靈(혼탁하고 둔하게 만들어 정상적인 기능 상실)하게 만듦 최종 병리 결과 : 이러한 병기들이 누적되어 뇌수실충실양腦髓失充失養과 신명실용神明失用으로 이어져 인지 기능 저하와 치매가 발생함 ③청뇌통락법淸腦通絡法(청뇌통락탕 사용)의 실천 및 작용 기전 고위험 요소 제어 및 TIA·중풍 전조증 개선 : 간열혈어肝熱血瘀 등의 병기를 다스려 중풍 전조증과 일과성 뇌허혈 발작 (TIA)의 발작 빈도를 유의하게 감소시키고 제반 임상 증상의 개선을 보고함. 특히 혈소판 응집의 핵심 인자이자 혈전성 질환 예측 지표인 혈소판 막당단백질 CD41의 발현을 유의하게 억제함으로써, 혈소판 점착 및 응집 능력을 낮추어 뇌혈관의 혈류를 원활하게 하고 혈관성 인지 장애로의 이행을 늦출 가능성을 제시함 인지 기능 및 뇌 조직(해마 돌기) 개선 효과 : 동물 실험에서 Morris 수중미로 학습·기억 능력 평가 시 평균 잠복기를 단축하고 플랫폼 구역에서의 수영 시간을 유의하게 연장함. 또한 랫드의 해마 CA1 및 CA3 분자층의 시냅스 수밀도(Nv) 와 시냅스 연결대 면밀도(Sv)의 감소를 유의하게 억제하여 신경돌기 및 시냅스 구조 손상을 방어함 혈뇌장벽(BBB) 보호 및 미세색전 배출 기전(동물 실험) : 뇌혈관의 미세색전 배출 능력을 강화하여 담탁이나 어혈 등의 병리 산물이 뇌규를 막는 것을 차단함. 구체적으로 밀착연접 단백질 ZO-1과 내피세포 지표 CD31의 발현을 상향 조절하고, 기저막 분해 효소인 MMP-2 및 MMP-9의 수치와 활성을 억제하여 세포외기질의 과도한 분해를 막음. 이를 통해 뇌혈관의 내·중막 구조 이상을 완화하고 혈뇌장벽의 구조적·기능적 손상을 억제함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 혈관성 인지장애 대상 공개자료상 제품·특허가 확인되지 않아, 중풍 후 인지 저하 환자의 관찰연구로 개발 가능성을 확인할 수 있음 참고문헌 [1] 쑨징보,화룽,푸원빈,등.장쉐원 국의대사의 청뇌통락법에 기반한 노인성 인지장애 분석基於張學文國醫大師淸腦通絡法分析老年性認知障礙[J].산시중의약 대학학보陝西中醫藥大學學報,2020,43(2):31-35. [2] 저우하이저,자오환,옌야펑.국의대사 장쉐원의 열어논치에 따른 중풍 전조증 치료 사상 탐구國醫大師張學文從熱瘀論治中風先兆症思想探析[J].중화중의약 잡지中華中醫藥雜志,2022,37(7):3928-3931."}},{"id":"4-1","ko":"양심탕","hz":"養心湯","alias":"","master_ko":"선바오판","master_hz":"沈寶藩","tagline":"심간혈허心肝血虛로 인한 허증 불면증을 치료하는 처방","meta":{"주요 적응증":"심간혈허형 불면","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":216,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-1 양심탕養心湯의 모듈 구성<\/p><h4>①보양심간음혈補養心肝陰血 및 양혈안신養血安神 모듈 — 심간의 음혈을 보양하여 심신실양心神失養을 회복하고 심신을 안정시킴<\/h4><p><b>당귀, 단삼, 수오등<\/b>: 당귀가 보혈양심補血養心하고 간혈을 보충하여 심간혈허心肝血虛를 개선하며, 단삼이 보양심간음혈補養心肝陰血, 영심통락안신寧心通絡安神하여 혈맥을 조화시키고 심신을 안정시키며, 수오등은 심간의 음혈을 자양하고 양혈안신養血安神, 통락通絡하여 불면과 다몽多夢을 개선함. 세 약물이 배합되어 심간혈허를 치료하는 양심탕의 핵심 축을 이룸<\/p><h4>②보혈양심補血養心 및 익기양혈렴음益氣養血斂陰 모듈 — 심비心脾를 보익하고 기혈을 생화하여 심신을 자양하고 안신함<\/h4><p><b>산조인, 백자인, 복령, 오미자<\/b>: 산조인과 백자인이 보혈양심안신補血養心安神하여 심혈을 충실하게 하고 심신을 안정시키고, 복령은 보익심비補益心脾, 생혈녕심안신生血寧心安神하여 비위의 기혈생화 기능을 도우면서 심신을 안정시키며, 오미자는 익기양혈렴음益氣養血斂陰, 보신녕심안신補腎寧心安神하여 기혈과 음을 보하고 심신을 수렴함. 네 약물이 협동하여 심비를 보익하고 기혈을 생화하여 양혈안신의 작용을 강화함<\/p><h4>③소간해울疏肝解鬱 및 조간혈調肝血 모듈 — 간기를 소통시키고 간혈을 조절하여 심간실화心肝失和를 회복하고 안신해울安神解鬱함<\/h4><p><b>합환피<\/b>: 합환피가 소간해울疏肝解鬱하고 조간혈調肝血하여 간의 소설 기능을 회복시키고 정서를 조절하며, 심신을 안정시키고 울결을 풀어주는 안신해울의 효능을 나타냄<\/p><h4>④중진잠양안신重鎭潛陽安神 및 인약입심引藥入心 모듈 — 상부로 떠오른 양기를 잠재우고 심신을 안정시키며 약을 심으로 인도함<\/h4><p><b>용골, 모려, 천궁<\/b>: 용골과 모려가 중진잠양안신重鎭潛陽安神하여 심신을 안정시키고 양이 위로 떠오르는 것을 잠재움. 천궁은 소량 배합하여 혈행을 조화시키고 전 처방의 약력을 심으로 인도함. 세 약물이 배합되어 심신을 안정시키고 양혈안신 작용이 심에 집중되도록 함<\/p>"},{"k":"master","t":"선바오판의 허증 불면증 치료","html":"<h4>①병인병기 인식 — 심혈휴허心血虧虛와 간혈부족肝血不足<\/h4><p><b>병인<\/b>: 정지울결情志鬱結, 음식의 실조, 구병久病, 과로, 노년老年 등으로 인한 심간心肝 기능의 손상 병기: 심혈 부족으로 심신을 영양하지 못해 신神이 제자리를 지키지 못하고, 간혈 부족으로 혼魂이 머물지 못하고 간음 부족으로 양陽이 승부升浮하여 심신心神을 교란하는 상태가 발생함<\/p><h4>②치료원칙 — 양혈안신養血安神과 심간동치心肝同治<\/h4><p><b>양혈안신<\/b>: 심간혈허心肝血虛가 허증 불면증의 주된 병리적 토대이므로, 혈을 길러 심과 간을 안정시키는 것이 치료의 대법 심간동치: 심과 간은 오행에서 모자母子 관계이므로 보간혈補肝血은 양심혈養心血에 도움이 되고, 사심화瀉心火는 청간화淸肝火에 도움이 됨. 조간양심調肝養心을 함께 시행하여 심간기혈을 조화시키고 음양을 평형시킴<\/p><h4>③양심탕의 변증별 가미<\/h4><p><b>혈허화왕血虛火旺<\/b>: 양심탕에 목단피, 炒치자, 적작약을 추가하여 청간양혈淸肝涼血, 양심안신養心安神혈허담화血虛痰火: 양심탕에서 백자인을 제거하고 원지, 죽여, 法반하, 담남성을 추가하여 청열화담淸熱化痰, 양혈안신 음혈휴허陰血虧虛: 양심탕에 생지황, 현삼을 가하여 자음양혈滋陰養血, 양심안신 혈허양부血虛陽浮: 양심탕에 황련, 아교, 생지황, 사삼을 가하여 자음청열滋陰淸熱, 양혈안신 기혈양허氣血兩虛: 양심탕에 태자삼, 황정, 연자육을 가하여 건비익기健脾益氣, 양혈안신 완고성 불면: 진주모, 용치, 자석을 가하여 진정녕심鎭靜寧心, 양혈안신을 강화함<\/p><h4>④혈허와 습조濕阻의 감별<\/h4><p>습조가 있을 때는 반드시 혈허의 유무를 감별해야 함. 혈허는 맥이 세細, 침세沈細, 현세弦細, 세삭細數 또는 세활細滑한 반면 비허습성脾虛濕盛은 맥이 유濡하거나 무력無力한 것이 특징 비허습성이 주된 경우에는 삼령백출산을 기본으로 하여 건비화습健脾化濕을 위주로 치료하고, 당귀, 천궁, 계혈등 등은 소량만 사용하여 양혈안신養血安神하며, 자니滋膩한 생지황과 현삼은 많이 사용하지 않음<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">국내 문헌의 ‘양심탕’은 동명의 고방 양심탕養心湯으로 조성이 다르므로, 국내 연구·특허에서는 대사명과 조성을 함께 명시해야 함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 후진샤,선바오판.국의대사 선바오판의 양심탕을 활용한 불면 치료 임상 경험國醫大師沈寶藩應用養心湯治療失眠臨床經驗分享[J].후난중의약대학학보湖南中醫藥大學學報,2024,44(5):724-728.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당귀9g","name":"당귀","dose":"9g","base":"당귀"},{"raw":"단삼9g","name":"단삼","dose":"9g","base":"단삼"},{"raw":"수오등9g","name":"수오등","dose":"9g","base":"수오등"},{"raw":"산조인13g","name":"산조인","dose":"13g","base":"산조인"},{"raw":"백자인15g","name":"백자인","dose":"15g","base":"백자인"},{"raw":"천궁6g","name":"천궁","dose":"6g","base":"천궁"},{"raw":"용골30g","name":"용골","dose":"30g","base":"용골"},{"raw":"모려30g","name":"모려","dose":"30g","base":"모려"},{"raw":"복령10g","name":"복령","dose":"10g","base":"복령"},{"raw":"합환피10g","name":"합환피","dose":"10g","base":"합환피"},{"raw":"오미자6g","name":"오미자","dose":"6g","base":"오미자"}],"notes":[],"핵심 효능":["심간의 음혈을 보양하고 심혈을 충실하게 하여 심신을 자양하고 심신불안心神不安을 진정시킴 (양혈안신養血安神)","간기를 소통시키고 간혈을 조절하여 심간실화心肝失和를 회복하고 심과 간의 기능을 조화시킴 (조간양심調肝養心)","상부로 떠오른 양기를 잠재우고 심신을 안정시켜 음양불교陰陽不交를 개선하고 수면을 촉진함 (중진잠양안신重鎭潛陽安神)"],"주치증":["심간혈허心肝血虛로 인한 허증虛證의 불면"],"연구 확장 영역":["노화 및 만성 피로에 따른 장부 기능 저하로 인한 허증 불면, 정서적 스트레스 및 수면 장애 복합 증상"],"R&D 포인트":["당귀, 단삼, 수오등의 심간음혈心肝陰血의 보양 및 통락안신通絡安神 작용 검증","산조인, 백자인, 복령의 심비보익心脾補益 및 생혈안신生血安神 메커니즘 분석","용골, 모려의 중진잠양重鎭潛陽 작용과 소량의 천궁을 통한 상초로의 약물 인도 효과 규명"]},"modules":[{"name":"①보양심간음혈 · 양혈안신","hz":"補養心肝陰血 · 養血安神","herbs":["당귀","단삼","수오등"],"role":"심간의 음혈을 보양하여 심신실양心神失養을 회복하고 심신을 안정시킴"},{"name":"②보혈양심 · 익기양혈렴음","hz":"補血養心 · 益氣養血斂陰","herbs":["산조인","백자인","복령","오미자"],"role":"심비心脾를 보익하고 기혈을 생화하여 심신을 자양하고 안신함"},{"name":"③소간해울 · 조간혈","hz":"疏肝解鬱 · 調肝血","herbs":["합환피"],"role":"간기를 소통시키고 간혈을 조절하여 심간실화心肝失和를 회복하고 안신해울安神解鬱함"},{"name":"④중진잠양안신 · 인약입심","hz":"重鎭潛陽安神 · 引藥入心","herbs":["용골","모려","천궁"],"role":"상부로 떠오른 양기를 잠재우고 심신을 안정시키며 약을 심으로 인도함"}],"rd":[{"tag":"Insomnia","title":"심간혈허형 불면의 수면 지표","html":"<p>양심탕의 불면 치료 임상 경험이 있음 수면의 질(PSQI)과 수면다원검사 또는 활동기록계 지표를 함께 쓰는 탐색 임상으로 효과를 객관화 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2024, 불면 치료 임상 경험))<\/p>"},{"tag":"Sedative Herbs","title":"산조인·백자인·수오등의 수면 유도 작용","html":"<p>산조인(주주브 사포닌)·백자인·수오등의 수면 잠복기 단축 효과를 동물 수면 모델에서 비교함 그 결과로 처방 내 핵심 진정 약재를 확인(동물 수면 잠복기 결과만으로 임상 효능을 판단하지 않음) (근거 유형: 간접 근거 | 근거: R&amp;D 논리 2 「보혈양심과 생혈안신」, 본문 조성표)<\/p>"},{"tag":"Anxiety","title":"합환피 배합의 불안 동반 불면 개선","html":"<p>합환피의 해울 작용을 불안 동반 불면 환자의 불안 척도(GAD-7)로 확인함 이를 통해 ‘소간해울’의 기 조인(주주브 사포닌)·백자인·수오등의 수면 잠복기 단축 효과를 동물 수면 모델에서 비교함 그 결과로 처방 내 핵심 진정 약재를 확인(동물 수면 잠복기 결과만으로 임상 효능을 판단하지 않음) (근거 유형: 간접 근거 | 근거: R&D 논리 2 「보혈양심과 생혈안신」, 본문 조성표)","Anxiety 합환피 배합의 불안 동반 불면 개선 합환피의 해울 작용을 불안 동반 불면 환자의 불안 척도(GAD-7)로 확인함 이를 통해 ‘소간해울’의 기여를 구체화 (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「소간해울과 조간혈」)","Hypnotic Tapering 수면제 감량 보조 벤조디아제핀 계열 수면제 장기 복용자의 감량 과정에 병용할 때, 전문의 감독 아래 표준 감량 프로토콜을 따르는 조건에서 반동성 불면과 금단 증상이 줄어드는지 평가함 이렇게 하면 표준치료와 충돌하지 않는 활용처를 확보할 수 있음 (근거 유형: 임상 경험 보고 | 근거: R&D 논리 4 「중진잠양안신」, 참고문헌 [1])"],"ss":{"composition":"그림 4-1 양심탕養心湯의 모듈 구성 ①보양심간음혈補養心肝陰血 및 양혈안신養血安神 모듈 — 심간의 음혈을 보양하여 심신실양心神失養을 회복하고 심신을 안정시킴 당귀, 단삼, 수오등 : 당귀가 보혈양심補血養心하고 간혈을 보충하여 심간혈허心肝血虛를 개선하며, 단삼이 보양심간음혈補養心肝陰血, 영심통락안신寧心通絡安神하여 혈맥을 조화시키고 심신을 안정시키며, 수오등은 심간의 음혈을 자양하고 양혈안신養血安神, 통락通絡하여 불면과 다몽多夢을 개선함. 세 약물이 배합되어 심간혈허를 치료하는 양심탕의 핵심 축을 이룸 ②보혈양심補血養心 및 익기양혈렴음益氣養血斂陰 모듈 — 심비心脾를 보익하고 기혈을 생화하여 심신을 자양하고 안신함 산조인, 백자인, 복령, 오미자 : 산조인과 백자인이 보혈양심안신補血養心安神하여 심혈을 충실하게 하고 심신을 안정시키고, 복령은 보익심비補益心脾, 생혈녕심안신生血寧心安神하여 비위의 기혈생화 기능을 도우면서 심신을 안정시키며, 오미자는 익기양혈렴음益氣養血斂陰, 보신녕심안신補腎寧心安神하여 기혈과 음을 보하고 심신을 수렴함. 네 약물이 협동하여 심비를 보익하고 기혈을 생화하여 양혈안신의 작용을 강화함 ③소간해울疏肝解鬱 및 조간혈調肝血 모듈 — 간기를 소통시키고 간혈을 조절하여 심간실화心肝失和를 회복하고 안신해울安神解鬱함 합환피 : 합환피가 소간해울疏肝解鬱하고 조간혈調肝血하여 간의 소설 기능을 회복시키고 정서를 조절하며, 심신을 안정시키고 울결을 풀어주는 안신해울의 효능을 나타냄 ④중진잠양안신重鎭潛陽安神 및 인약입심引藥入心 모듈 — 상부로 떠오른 양기를 잠재우고 심신을 안정시키며 약을 심으로 인도함 용골, 모려, 천궁 : 용골과 모려가 중진잠양안신重鎭潛陽安神하여 심신을 안정시키고 양이 위로 떠오르는 것을 잠재움. 천궁은 소량 배합하여 혈행을 조화시키고 전 처방의 약력을 심으로 인도함. 세 약물이 배합되어 심신을 안정시키고 양혈안신 작용이 심에 집중되도록 함","master":"①병인병기 인식 — 심혈휴허心血虧虛와 간혈부족肝血不足 병인 : 정지울결情志鬱結, 음식의 실조, 구병久病, 과로, 노년老年 등으로 인한 심간心肝 기능의 손상 병기: 심혈 부족으로 심신을 영양하지 못해 신神이 제자리를 지키지 못하고, 간혈 부족으로 혼魂이 머물지 못하고 간음 부족으로 양陽이 승부升浮하여 심신心神을 교란하는 상태가 발생함 ②치료원칙 — 양혈안신養血安神과 심간동치心肝同治 양혈안신 : 심간혈허心肝血虛가 허증 불면증의 주된 병리적 토대이므로, 혈을 길러 심과 간을 안정시키는 것이 치료의 대법 심간동치: 심과 간은 오행에서 모자母子 관계이므로 보간혈補肝血은 양심혈養心血에 도움이 되고, 사심화瀉心火는 청간화淸肝火에 도움이 됨. 조간양심調肝養心을 함께 시행하여 심간기혈을 조화시키고 음양을 평형시킴 ③양심탕의 변증별 가미 혈허화왕血虛火旺 : 양심탕에 목단피, 炒치자, 적작약을 추가하여 청간양혈淸肝涼血, 양심안신養心安神혈허담화血虛痰火: 양심탕에서 백자인을 제거하고 원지, 죽여, 法반하, 담남성을 추가하여 청열화담淸熱化痰, 양혈안신 음혈휴허陰血虧虛: 양심탕에 생지황, 현삼을 가하여 자음양혈滋陰養血, 양심안신 혈허양부血虛陽浮: 양심탕에 황련, 아교, 생지황, 사삼을 가하여 자음청열滋陰淸熱, 양혈안신 기혈양허氣血兩虛: 양심탕에 태자삼, 황정, 연자육을 가하여 건비익기健脾益氣, 양혈안신 완고성 불면: 진주모, 용치, 자석을 가하여 진정녕심鎭靜寧心, 양혈안신을 강화함 ④혈허와 습조濕阻의 감별 습조가 있을 때는 반드시 혈허의 유무를 감별해야 함. 혈허는 맥이 세細, 침세沈細, 현세弦細, 세삭細數 또는 세활細滑한 반면 비허습성脾虛濕盛은 맥이 유濡하거나 무력無力한 것이 특징 비허습성이 주된 경우에는 삼령백출산을 기본으로 하여 건비화습健脾化濕을 위주로 치료하고, 당귀, 천궁, 계혈등 등은 소량만 사용하여 양혈안신養血安神하며, 자니滋膩한 생지황과 현삼은 많이 사용하지 않음","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 국내 문헌의 ‘양심탕’은 동명의 고방 양심탕養心湯으로 조성이 다르므로, 국내 연구·특허에서는 대사명과 조성을 함께 명시해야 함 참고문헌 [1] 후진샤,선바오판.국의대사 선바오판의 양심탕을 활용한 불면 치료 임상 경험國醫大師沈寶藩應用養心湯治療失眠臨床經驗分享[J].후난중의약대학학보湖南中醫藥大學學報,2024,44(5):724-728."}},{"id":"4-2","ko":"사생음","hz":"四生飮","alias":"","master_ko":"루팡","master_hz":"盧芳","tagline":"자음잠양滋陰潛陽과 중진안신重鎭安神으로 음허양항陰虛陽亢의 신지병神志病을 치료하는 처방","meta":{"주요 적응증":"자율신경실조, 불안·우울, 갱년기 증후군","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":220,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 4-2 사생음四生飮의 모듈 구성<\/p><h4>①자음양혈滋陰養血 및 유간식풍柔肝息風 모듈 — 심, 간, 신의 음액과 혈을 보충하여 근본을 다짐<\/h4><p><b>생지황, 백작약<\/b>: 생지황은 심·간·신경으로 들어가 자음청열滋陰淸熱하며 위기를 상하게 하지 않고 윤택함. 백작약은 혈을 기르고 음을 수렴하며 간을 부드럽게 하여 통증을 그치게 함. 두 약의 합용은 사물탕의 혈분 보약 구조를 계승하여 자음양혈滋陰養血의 근간을 이룸<\/p><h4>②중진잠양重鎭潛陽 및 익음렴정益陰斂精 모듈 — 허양虛陽을 가라앉히고 심신을 굳건히 수렴함<\/h4><p><b>용골, 모려<\/b>: 용골은 심, 간경으로 들어가 떠오르는 양기를 가라앉히고 심신을 거두어 놀라움을 진정시키며 잠을 오게 함. 모려는 양기를 가라앉히고 수렴하며, 굳은 것을 부드럽게 하고 땀을 멈추고 담을 제거함. 이들은 화합하여 음을 더하고 양을 수렴하며 정신을 안정시키는 핵심 효능을 발휘함<\/p>"},{"k":"master","t":"루팡의 신지병 치료","html":"<h4>①질병 인식 및 병기의 핵심<\/h4><p><b>신지병의 범위<\/b>: 정지情志 요인으로 인해 발생한 심신 질환으로, 중의학의 불면, 경계驚悸, 장조臟躁, 울증鬱證, 백합병百合病 등에 해당하며 양의학의 자율신경실조증, 우울증, 불안증, 강박증 등을 아우름<\/p><p><b>음허양항陰虛陽亢과 심신불교心腎不交<\/b>: 신음腎陰이 부족하여 심화心火를 제어하지 못하거나, 심음心陰이 손상되고 심양이 치솟아 음이 양을 거두지 못하는 음불렴양陰不斂陽이 병기의 핵심임. ‘마음이 신을 갈무리하지 못하면心不藏神’ 정신이 머물 곳이 없어 불안, 불면, 감정 다변 등의 제증상이 발생함<\/p><h4>②임상 표현의 다면성 분석<\/h4><p><b>수면 장애 및 땀 분비 이상<\/b>: 심음이 손상되어 음불렴양陰不斂陽으로 불면이 오고, 위기衛氣와 영음營陰의 실조로 자한 및 도한이 발생함<\/p><p><b>건조 증상 및 오심번열<\/b>: 신음이 허하여 입마름, 인건咽乾, 비건鼻乾, 안건眼乾, 피부 건조 및 오심번열五心煩熱이 나타남<\/p><p><b>정신, 정서 및 전신 증상<\/b>: 수해髓海 부족으로 인한 두훈건망頭暈健忘(어지럼·건망), 비위 운화 장애로 인한 복창납매腹脹納呆(배가 더부룩하고 식욕이 없음), 담허膽虛로 인한 이노이경易怒易驚, 권태소수倦怠消瘦 등 오장육부의 연계적 병리를 동반함<\/p><h4>③치료 원칙 및 임상 겸증별 가감 활용<\/h4><p><b>자음잠양滋陰潛陽과 대용량 생약 투여<\/b>: 흥분성 증상과 자율신경 실조를 가라앉히기 위해 단순한 안신安神에 그치지 않고 자음잠양滋陰潛陽을 대법大法으로 삼으며, 생지황, 生백작약, 生용골, 生모려 모두 생품生品을 각 50g씩 과감하게 투여하여 자음잠양 효과를 극대화함<\/p><p>임상 겸증별 세부 가감 원칙:<\/p><p class=\"sub\"><b>음허陰虛가 주증일 때(오심번열五心煩熱, 설홍소태舌紅少苔, 맥세삭脈細數)<\/b>: 현삼을 더해 자음강화滋陰降火함<\/p><p class=\"sub\">불면증 위주이고 순수 음허일 때(설건홍무태舌乾紅無苔, 맥세삭脈細數하고, 간울기체肝鬱氣滯와 습담濕痰이 없음): 산조인, 오미자, 백자인을 더함<\/p><p class=\"sub\"><b>불면증에 비허脾虛를 겸할 때(혀가 크고 치흔齒痕이 있으며 태백니苔白膩)<\/b>: 합환화, 야교등을 더함<\/p><p class=\"sub\">심화상염心火上炎이 주증일 때(가슴이 답답한 불면인 심번불매心煩不寐, 설첨적舌尖赤): 황련을 더해 청심제번淸心除煩함<\/p><p class=\"sub\"><b>자한, 도한, 비기허脾氣虛일 때<\/b>: 부소맥을 더함<\/p><p class=\"sub\"><b>음허가 매우 뚜렷할 때(설홍무태舌紅無苔, 맥세삭脈細數)<\/b>: 산수유50~100g을 대량으로 더함<\/p><p class=\"sub\"><b>납매納呆(식욕부진), 복창腹脹, 애기噯氣<\/b>: 불수, 향연香櫞, 복령, 초삼선焦三仙, 지각을 더해 이기화위理氣和胃함<\/p><p class=\"sub\">간양상요肝陽上擾가 뚜렷할 때(머리가 멍하고 팽창감이 있는 통증의 두혼창통頭昏脹痛, 혈압 상승): 석결명, 진주모를 더해 평간잠양平肝潛陽함<\/p><p class=\"sub\"><b>혈압이 낮을 때<\/b>: 지실을 더함<\/p><p class=\"sub\"><b>비허부종脾虛浮腫이 있을 때<\/b>: 복령, 백출, 산약을 더해 건비리습健脾利濕함<\/p><p class=\"sub\"><b>심계心悸가 주증일 때<\/b>: 山치자, 목단피를 더해 청심화淸心火함<\/p><p class=\"sub\"><b>곡소무상哭笑無常으로 울고 웃을 때<\/b>: 소맥, 대조를 더함<\/p><p class=\"sub\"><b>기능성 실명失明 발생 시<\/b>: 구기자, 당귀 등의 양간음약養肝陰藥을 더함<\/p><p class=\"sub\"><b>기능성 실어失語 발생 시<\/b>: 울금, 석창포 등 활담개규약豁痰開竅藥을 더함<\/p><p class=\"sub\"><b>감각운동 이상(사지추휵四肢抽搐, 지체마목肢體麻木)<\/b>: 천련자를 더해 양간서근養肝舒筋함<\/p><p class=\"sub\"><b>간울기체肝鬱氣滯가 주증일 때<\/b>: 천련자, 울금 등을 더함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">자율신경실조·갱년기 증상은 국내 수요가 큰 영역이며 공개자료상 제품·특허가 확인되지 않아, 증상 척도 기반 탐색 연구로 시작할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 리자오,리티,루톈자오.루팡 교수의 사생음 활용 신지병 진료 경험李姣,李倜,盧天蛟.盧芳教授運用四生飮診治神志病經驗[J].중국위생표준관리中國衛生標準管理,2017,8(6):80-81.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"생지황50g","name":"생지황","dose":"50g","base":"생지황"},{"raw":"生백작약50g","name":"生백작약","dose":"50g","base":"백작약"},{"raw":"生용골50g","name":"生용골","dose":"50g","base":"용골"},{"raw":"生모려50g","name":"生모려","dose":"50g","base":"모려"}],"notes":[],"핵심 효능":["심, 간, 신의 음액을 자양하고 허열을 끄며 들뜨는 양기를 가라앉힘(자음잠양滋陰潛陽)","무거운 성질의 중진약을 활용하여 심신을 안정시킴(중진안신重鎭安神)"],"주치증":["자율신경실조증, 전환장애(히스테리), 우울증, 불안증, 강박증, 갱년기 증후군, 백합병百合病, 장조臟躁, 음허발열陰虛發熱, 열병 후기의 음휴간왕형陰虧肝旺型의 병증"],"연구 확장 영역":["신경정신계 기능성 질환의 자율신경 조절, 중추신경계 진정 및 항불안 효과, 면역 기능 조절, 뇌신경 세포 보호 및 스트레스 저항성 향상"],"R&D 포인트":["‘사생四生’ 약재(생지황, 백작약, 용골, 모려)의 배합 시너지 기전을 통한 HPA축(시상하부-뇌하수체-부신 축) 조절 및 항스트레스 작용 규명","대용량(각 50g)의 중진잠양重鎭潛陽 배합을 통한 불안, 초조, 수면 장애 개선 기전 연구","신지병神志病의 ‘음허양항陰虛陽亢’ 변증에 따른 맞춤형 가감 응용의 표준화"]},"modules":[{"name":"①자음양혈 · 유간식풍","hz":"滋陰養血 · 柔肝息風","herbs":["생지황","백작약"],"role":"심, 간, 신의 음액과 혈을 보충하여 근본을 다짐"},{"name":"②중진잠양 · 익음렴정","hz":"重鎭潛陽 · 益陰斂精","herbs":["용골","모려"],"role":"허양虛陽을 가라앉히고 심신을 굳건히 수렴함"}],"rd":[{"tag":"Menopausal Syndrome","title":"갱년기 증후군의 열감·불안 개선","html":"<p>사생음은 생지황·생백작약·생용골·생모려 4종 각 50g의 단순한 구성이지만 고용량과 광물 약재(용골·모려)의 기원·포제 규격을 먼저 확인해야 함<\/p><p>이를 확인한 뒤 갱년기 증후군의 안면 홍조 빈도와 Kupperman 지수를 지표로 한 탐색 임상이 적합 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2017, 신지병 진료 경험), 본문 조성표)<\/p>"},{"tag":"Minerals","title":"용골·모려 광물 약재의 진정 효과","html":"<p>용골·모려의 진정 효과를 칼슘 등 무기 성분과 관련지어 확인함<\/p><p><b>생품과 하소품(煅)의 효과 차이도 함께 비교 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 2 「중진잠양과 익음렴정」, 본문 조성표)<\/p>"},{"tag":"Autonomic Balance","title":"자율신경실조의 심박변이도 지표","html":"<p>음허양항으로 인한 자율신경 실조를 심박변이도(HRV)와 증상 척도로 측정함 이로써 처방의 효과를 객관 지표로 표현 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「음허양항 제어와 신지병 조절」)<\/p>"},{"tag":"High-dose Safety","title":"생지황 50g 대용량의 위장 부담","html":"<p>생지황 50g은 설사·소화불량을 일으킬 수 있는 용량임<\/p><p>용량별 위장 부작용과 복약 순응도를 평가하여

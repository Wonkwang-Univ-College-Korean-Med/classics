<script>
const D = {"fields":{"1":{"name":"위장관계·장-뇌축·소화기","page":12},"2":{"name":"피부·알레르기·류마티스·면역","page":83},"3":{"name":"근신경계·퇴행성 질환 및 건강고령화","page":158},"4":{"name":"수면·신경정신·인지","page":215},"5":{"name":"호흡기·감염병","page":260}},"formulas":[{"id":"1-1","ko":"화탁해독방","hz":"化濁解毒方","alias":"","master_ko":"리뎬구이","master_hz":"李佃貴","tagline":"탁독濁毒과 습열濕熱을 제거하고 비위의 승강 기능을 회복하여 만성 위염을 치료하는 처방","meta":{"주요 적응증":"만성 위축성·미란성 위염, 궤양성 대장염","확인된 연구자료 유형":"연구 축적 (논문 246편)","제형·제품화":"관련 특허 (유효·소멸)"},"page":13,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 1-1 화탁해독방化濁解毒方의 모듈 구성<\/p><h4>①화탁해독化濁解毒, 청열리습淸熱利濕 모듈 — 중초의 습열과 탁독을 제거함<\/h4><p><b>인진, 황금, 황련<\/b>: 인진은 청리습열淸利濕熱하고 황달을 다스리며, 황련은 고조습열苦燥濕熱하여 중초의 화울火鬱을 내리고, 황금은 청열조습淸熱燥濕 및 사화해독瀉火解毒함. 세 약물의 배합은 탁독濁毒을 제거하고 습열濕熱을 다스리는 군약君藥의 역할을 함<\/p><h4>②소간해울疏肝解鬱, 행기건비行氣健脾 모듈 — 간의 울체鬱滯를 풀고 기기氣機를 소통시켜 비위를 조화롭게 함<\/h4><p><b>시호, 향부자, 청피<\/b>: 시호는 화해표리和解表裏하고 소간해울하며, 향부자는 소간해울 및 이기관중理氣寬中하고, 청피는 소간파기疏肝破氣 및 소적화체消積化滯함. 세 약물의 배합으로 간담의 울체된 기기를 소통시킴<\/p><h4>③소식행기消食行氣, 소적제만消積除滿 모듈 — 중초의 기체氣滯와 식적食積을 풀고 더부룩함을 해소함<\/h4><p><b>진피, 자소경<\/b>: 진피는 이기건비理氣健脾하고 조습화담燥濕化痰하며, 자소경은 온화溫和한 성질로 이기화중理氣和中하고 흉민胸悶 및 구역嘔逆을 멈춤. 두 약물의 배합은 기를 소통시키고 온화하게 작용하여 군약의 고한苦寒한 성질을 보완함<\/p><h4>④강역화담降逆化痰, 청열지구淸熱止嘔 모듈 — 담탁痰濁을 없애고 위기胃氣가 거슬러 오르는 것을 막음<\/h4><p><b>반하, 죽여<\/b>: 반하는 조습화담燥濕化痰 및 강역지구降逆止嘔하며, 죽여는 청열화담淸熱化痰하고 제번지구除煩止嘔함. 두 약물의 배합은 위기상역胃氣上逆으로 인한 구역과 담탁을 다스림<\/p>"},{"k":"master","t":"리뎬구이의 만성 미란성 위염 치료","html":"<h4>①병기 인식 — ‘탁독치병濁毒致病’ 이론과 위장 탁독 병기<\/h4><p><b>탁독의 개념과 형성<\/b>: ‘탁濁’은 맑지 않고 흐리며 농도가 높은 상태를 뜻하고, ‘독毒’은 인체에 해로운 온갖 불결한 요소를 뜻함. 섭생의 불규칙, 정지실조情志失調, 외사 침입 등으로 비위가 손상되면 청기가 오르지 못하고 탁사濁邪가 생기며, 이것이 오래되어 묵으면 독으로 화하여 탁독濁毒을 형성함<\/p><p><b>비위 승강 실조와 점막 손상<\/b>: 비는 조燥를 좋아하고 습濕을 싫어하며 위는 윤潤을 좋아하고 조燥를 싫어하는데, 탁독濁毒이 중초에 쌓이면 비의 운화 기능이 실조되고 위기불강胃氣不降을 초래하여 기혈진액의 순환을 막고 위점막을 손상시켜 미란과 궤양을 유발함<\/p><h4>②치료의 원칙 — 화탁해독化濁解毒의 4대 특징<\/h4><p><b>방향화습해독芳香化濕解毒<\/b>: 방향성 약물을 통해 탁사濁邪를 화해시키고 흩어지게 함<\/p><p><b>담삼리습해독淡滲利濕解毒<\/b>: 담삼淡滲하는 성질의 약물로 습독濕毒을 소변으로 배출시킴<\/p><p><b>벽예화탁해독辟穢化濁解毒<\/b>: 더럽고 탁한 탁독濁毒의 사기를 정화함<\/p><p><b>공독산결해독攻毒散結解毒<\/b>: 맺혀 있는 독을 깨뜨리고 뭉친 것을 흩어지게 함<\/p><h4>③화탁해독방의 임상 활용 — 탁독의 4대 유형별 치법<\/h4><p class=\"lbl2\">탁독음상濁毒陰傷<\/p><p class=\"sub\"><b>증상<\/b> : 위완비민胃脘痞悶, 조잡燥雜, 구조인건口燥咽乾, 대변건결大便乾結, 설홍소진舌紅少津 등<\/p><p class=\"sub\">화탁해독방에 사삼, 백작약, 맥문동, 오매, 백합, 오미자 등을 가미하여 양음생진養陰生津함<\/p><p class=\"sub\">간신음허肝腎陰虛에는 여정자, 한련초를 가미<\/p><p class=\"sub\">야간에 한출汗出이 많은 음허화왕陰虛火旺에는 지골피, 청호, 은시호, 호황련, 부소맥, 마황근 등을 가미하여 자음청열滋陰淸熱, 염음지한斂陰止汗함<\/p><p class=\"lbl2\">탁독입락濁毒入絡<\/p><p class=\"sub\"><b>증상<\/b> : 침자針刺나 칼로 베는 듯한 통증, 위완통 부위가 고정, 누르면 통증 가중, 식후에 통증 가중, 야간 통증 심화, 설질자암舌質紫黯 등<\/p><p class=\"sub\">어혈이 가벼울 때는 화탁해독방에 당귀, 천궁 등 가미<\/p><p class=\"sub\">어혈이 중할 때는 도인, 홍화, 삼릉, 아출, 토별충 등을 가미<\/p><p class=\"sub\">장상피화생에는 전갈, 오공, 산자고山慈菇, 석견천石見穿, 석상백石上柏을 가미하여 소징산결消癥散結<\/p><p class=\"sub\">불면에는 합환피, 수오등, 백합, 용골, 모려 등을 가미하여 양혈안신養血安神<\/p><p class=\"lbl2\">탁독울조濁毒鬱阻<\/p><p class=\"sub\"><b>증상<\/b> : 완복비민脘腹痞悶, 흉협창만胸脇脹滿, 심번이노心煩易怒, 구오애기嘔惡噯氣, 설질암홍舌質黯紅, 태황니苔黃膩, 맥현활脈弦滑<\/p><p class=\"sub\">화탁해독방에 향연香櫞, 불수, 석창포, 울금, 지실, 후박을 가미하여 소간해울疏肝解鬱, 행기소창行氣消脹<\/p><p class=\"sub\">소심반산燒心反酸이 중할 때는 석고, 浙패모, 해표소, 와릉자를 가미하여 억산지통抑酸止痛<\/p><p class=\"sub\">심번心煩에는 치자, 담두시를 가미하여 청열제번淸熱除煩<\/p><p class=\"lbl2\">탁독상식濁毒傷食<\/p><p class=\"sub\"><b>증상<\/b> : 완복비민脘腹痞悶과 창만, 식후에 가중, 트림과 신물 역류, 오식구토惡食嘔吐, 대변불조大便不調, 잦은 방귀, 설태후니舌苔厚膩, 맥활脈滑<\/p><p class=\"sub\">화탁해독방에 계내금, 초삼선焦三仙을 더해 건비소식健脾消食하고, 炒내복자, 焦빈랑을 더해 행기소식行氣消食<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 246 편 발표<\/td><td>최근 5 년간 87편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">궤양성 대장염(UC)<\/span> <span class=\"kw\">만성 위축성 위염(CAG)<\/span> <span class=\"kw\">신장 섬유화·만성 신부전(CRF)<\/span> <span class=\"kw\">역류성 식도염(GERD)<\/span> <span class=\"kw\">대사증후군<\/span> <span class=\"kw\">뇌졸중<\/span><\/td><td>소화기·대사질환에서 신장·신경계 만성질환으로 적응증 확대 특히 궤양성 대장염·만성 위축성 위염 등 만성 염증성 질환의 점막 장벽 보호 및 병리 진행 억제가 핵심 축으로 부상<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">표준 양약 병용<\/span> <span class=\"kw\">생물학적 제제<\/span> <span class=\"kw\">항생제·제균요법<\/span> <span class=\"kw\">화학요법<\/span> <span class=\"kw\">침구·외치요법<\/span> <span class=\"kw\">복합 처방<\/span><\/td><td>· 단독 치료보다 기존 표준치료와의 병용을 통한 치료효율 제고 및 보완적 작용으로 R&amp;D 전략 전환<br>→ 천연물 신약 개발에서도 Standard-of-care 병용형 보조치료제 및 다중 치료목표를 갖는 복합제제 개발 가능성<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">장점막 장벽<\/span> <span class=\"kw\">염증성 사이토카인<\/span> <span class=\"kw\">산화스트레스<\/span> <span class=\"kw\">세포사멸·세포 파이롭토시스<\/span> <span class=\"kw\">자가포식<\/span> <span class=\"kw\">미토콘드리아 기능<\/span> <span class=\"kw\">섬유화<\/span> <span class=\"kw\">장내균총<\/span> <span class=\"kw\">NF-κB<\/span> <span class=\"kw\">TNF-α<\/span> <span class=\"kw\">IL-6<\/span> <span class=\"kw\">NLRP3<\/span> <span class=\"kw\">COX-2<\/span> <span class=\"kw\">VEGF<\/span> <span class=\"kw\">PI3K/AKT 등<\/span><\/td><td>· 단순 증상·효능 평가에서 벗어나 분자·세포 수준의 객관적 바이오마커 기반 효능 검증으로 고도화<br>→ 장벽 기능 + 염증 + 면역 + 세포사멸 + 미토콘드리아 + 섬유화를 연결하는 다층적 평가체계 구축<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">분자도킹<\/span> <span class=\"kw\">장내균총<\/span> <span class=\"kw\">신호전달체계<\/span> <span class=\"kw\">단백질체학<\/span> <span class=\"kw\">대사체학<\/span> <span class=\"kw\">뇌-장 축<\/span> <span class=\"kw\">AMPK/mTOR<\/span> <span class=\"kw\">SIRT1/NF-κB<\/span> <span class=\"kw\">TLR4/MyD88/MAPK<\/span> <span class=\"kw\">HIF-1α<\/span> <span class=\"kw\">PERK/ATF4<\/span> <span class=\"kw\">TXNIP/NLRP3<\/span> <span class=\"kw\">cGAS/STING 등<\/span><\/td><td>· 다중 성분-다중 표적(Multi-component–Multi-target) 기전 규명으로 고도화<br>→ Network pharmacology → 핵심 표적 발굴 → 신호경로 검증 → 장내균총·대사체 연계 → 동물·임상 검증의 통합 R&amp;D 플랫폼 구축<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2025~2026 최신연구)<\/h4><p class=\"row\">cGAS/STING–Pyroptosis 연계 기전 연구 <b>2026, 賈雪梅 등<\/b><\/p><p>cGAS/STING 신호 활성 억제를 통해 NF-κB·IRF3 및 NLRP3/GSDMD 매개 세포 파이롭토시스(pyroptosis)를 억제하고 장점막 손상을 개선<\/p><p><b>의미<\/b> 화탁해독방이 단순한 염증 억제를 넘어 선천면역 감지–염증 신호–장상피 세포 파이롭토시스로 이어지는 병리축을 함께 조절할 수 있다는 기전 근거를 동물 모델에서 제시<\/p><p class=\"row\">미토콘드리아 동역학 조절을 통한 신장 보호 <b>2026, 高卉 등<\/b><\/p><p>Drp1↓, Mfn1/Mfn2↑를 통해 미토콘드리아의 분열·융합 균형을 조절하고, ATP·ADP·AMP 대사 및 Bcl-2/Bax를 개선하여 만성 신부전의 신장 손상 완화<\/p><p><b>의미<\/b> 화탁해독방의 신장 보호작용을 미토콘드리아 구조–에너지 대사–세포사멸의 연결축으로 설명하여 새로운 약리학적 타깃 제시<\/p><p class=\"row\">AMPK/mTOR–Autophagy 기반 신장섬유화 억제 <b>2025, 王婉卿 등<\/b><\/p><p>AMPK 활성화 및 mTOR 억제를 통해 Beclin1·LC3Ⅱ 매개 자가포식을 회복시키고, TGF-β1·α-SMA 발현을 억제하여 신장섬유화 개선<\/p><p><b>의미<\/b> 만성 신부전에서 에너지 감지–자가포식–섬유화를 하나의 치료축으로 연결하여 화탁해독방의 항섬유화 기전 구체화<\/p><p class=\"row\">다중 성분–다중 표적 네트워크 약리학 <b>2025, 李坤峰 등<\/b><\/p><p>화탁해독방 가감을 통해 위암 전구병변 치료에 사용할 수 있는 64종의 후보 약재와 槲皮素·木犀草素·兒茶素·EGCG 등의 활성성분을 도출하고, STAT3, CTNNB1, CDH1, TLR4, CD4 등을 핵심 표적으로 제시<\/p><p><b>의미<\/b> 화탁해독방의 위암 전구병변 치료를 단일 표적이 아닌 PI3K-Akt, MAPK, 암 관련 신호 등 복수 경로를 동시에 조절하는 Multi-component–Multi-target 전략으로 확장 ※ 네트워크 약리학으로 표적·기전을 예측한 연구이며, 환자에서 병변 진행 억제가 확인된 결과는 아님<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품·신약 임상은 확인되지 않음. 같은 화탁해독化濁解毒 이론에 따른 대사 연구팀의 특허로 위염·위암 전구병변 조성물(2022년 등록, 유효)과 위축성 위염 동반 장상피화생 조성물(2015년 등록, 2025년 연차료 미납으로 권리 소멸)이 있고, 허베이성중의약과학원의 화탁해독소간방 성분 정량법 특허(2024년 등록)는 2025년 기업에 실시권이 설정되어 이론 기반의 제품화 준비가 진행 중[10][11][12]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">중국에서는 탕제 대신 이론을 공유하는 변형 조성으로 특허를 확보하는 단계이므로, 국내는 본 처방 원방의 지표성분 표준화와 위축성 위염 임상 근거를 먼저 확보하면 중복 없이 차별화 가능. 국내 공정서(약전·규격집)에 없는 자소경이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 왕사오포,리뎬구이,쑨룬쉐,등.국의대사 리뎬구이의 화탁해독 방약 이론과 응용 탐구國醫大師李佃貴化濁解毒方藥理論與應用探討[J/OL].중화중의약학간中華中醫藥學刊,1-15[2026-09-15].<a href=\"https://link.cnki.net/urlid/21.1546.R.20250928.0900.002.\" target=\"_blank\" rel=\"noopener\">https://link.cnki.net  밖으로 배출함(청열리습淸熱利濕)","주치증 만성 위축성 위염, 만성 미란성 위염, 역류성 식도염, 소화성 궤양, 궤양성 대장염 등","연구 확장 영역 소화기계 질환, 호흡기 질환, 신장 질환, 심뇌혈관 질환, 악성 종양 등","R&D 포인트 고미苦味 약재의 뇌-장 축(Brain-Gut axis) 조절 및 항염증·면역 조절 기전 분석 탁독 이론에 기반한 장내 미생물군 조절 및 장점막 회복 작용 검증 위장관 평활근 운동 및 미세순환 조절 기전 검증을 통한 제제 최적화","①화탁해독 · 청열리습 化濁解毒 · 淸熱利濕 인진 황금 황련 중초의 습열과 탁독을 제거함","②소간해울 · 행기건비 疏肝解鬱 · 行氣健脾 시호 향부자 청피 간의 울체鬱滯를 풀고 기기氣機를 소통시켜 비위를 조화롭게 함","③소식행기 · 소적제만 消食行氣 · 消積除滿 진피 자소경 중초의 기체氣滯와 식적食積을 풀고 더부룩함을 해소함","④강역화담 · 청열지구 降逆化痰 · 淸熱止嘔 반하 죽여 담탁痰濁을 없애고 위기胃氣가 거슬러 오르는 것을 막음","탁독치병濁毒致病과 위장 탁독 병기 비위가 손상되어 청기가 오르지 못하고 탁사濁邪가 생겨 독으로 화함","방향화습芳香化濕 및 담삼리습해독淡滲利濕解毒 방향성 약물로 탁사를 흩어지고 화해시키며, 담삼하는 약물로 습독을 배출함","낙맥어조와 파혈산결의 배합 낙맥에 어조가 생기고 독이 울체하여 발생한 증상에 활혈화어와 해독산결을 병용함","비위 승강 보호 및 고한苦寒 제약 경계 한량寒涼한 청열 약물의 단점을 보완하고 위기胃氣의 승강 기능을 보존함","Mucosal Barrier & Innate Immunity 점막 장벽–선천면역(cGAS/STING) 축 표적 검증 궤양성 대장염 생쥐에서 cGAS/STING 활성을 억제해 NLRP3/GSDMD 매개 세포 파이롭토시스와 장점막 손상을 줄였다는 결과를 출발점으로 삼음 나아가 만성 위축성 위염과 궤양성 대장염에 공통으로 쓸 수 있는 ‘점막 장벽 보호제’로 위치를 잡는 연구 검증 설계 DSS 대장염 모델과 MNNG 유도 위축성 위염 모델을 각각 진행하되 대조약은 질환별로 따로 두고(대장염: 메살라진, 위축성 위염: 해당 질환 임상에서 쓰이는 엽산·위점막 보호제 등), 두 모델에서 밀착연접 단백질(ZO-1·Occludin), cGAS/STING·NLRP3·GSDMD, 장내균총을 공통 지표로 측정 근거 직접 연구 근거 참고문헌 [6](2026, cGAS/STING–세포 파이롭토시스), 본문 「평가 지표」 표","Renal Protection & Fibrosis 신장 섬유화·만성 신부전으로 적응증 확장 최근 연구가 5/6 신절제 랫드에서 AMPK/mTOR–자가포식 회복과 TGF-β1·α-SMA 억제, 미토콘드리아 분열·융합(Drp1·Mfn1/2) 균형 회복을 각각 보고함 ‘이습해독利濕解毒’을 요독 물질 배설과 신장 섬유화 억제로 재해석하여 만성 신장병 보조치료제로 확장하는 방향 검증 설계 5/6 신절제 및 아데닌 유도 모델에서 혈청 크레아티닌·BUN, 신장 섬유화 면적, 장내균총 유래 요독소(인독실 황산 등)를 함께 평가하여 ‘장–신장 축’ 가설을 검증 근거 직접 연구 근거 참고문헌 [7](2026, 미토콘드리아 동역학), [8](2025, AMPK/mTOR–자가포식)","Gastric Precancerous Lesion 위암 전구병변(장상피화생·이형성) 진행 억제 가능성 검증 네트워크 약리학 분석에서 STAT3·CTNNB1(β-catenin)·CDH1·TLR4가 핵심 표적으로 예측되었음 장상피화생 표지자(CDX2)와 Wnt/β-catenin 축을 실험으로 확인하고, 활혈화어 가감약(당귀·천궁 또는 삼릉·아출) 유무에 따른 효과 차이를 비교","Safety & Standardization 고한苦寒 약재 장기 투여 안전성 및 품질 표준화 인진·황금·황련 등 고한 약재가 처방 총량의 약 3분의 1을 차지함 만성 위염처럼 장기 복용이 전제되는 적응증에서는 위장 자극과 간 기능 영향을 먼저 확인하고 베르베린(황련)·바이칼린(황금) 등 지표성분 함량 기준을 정해 배치 간 품질을 고정 검증 설계

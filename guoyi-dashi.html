의 면역 매개 파괴가 핵심임 조혈 촉진만으로 설명하지 않고, 보혈 약재군의 거핵세포 성숙 효과와 함께 영지의 면역 조절(항혈소판 항체·T세포 조절)을 ITP 모델에서 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1·3, 본문 조성표)","Pediatric Formulation 소아 복약 순응도를 고려한 제형 대상이 소아이므로 아교·대조 등을 포함한 처방을 과립·시럽 등 복용하기 쉬운 제형으로 바꿔야 함 맛과 순응도 평가가 임상 적용의 전제 (근거 유형 : 신규 연구가설 | 근거: 본문 주치증 (소아), 조성표)"],"ss":{"composition":"그림 2-13 귀작생혈탕歸芍生血湯의 모듈 구성 ①건비익기健脾益氣, 보익기혈補益氣血 모듈 — 비위와 기혈을 보익하여 생화의 원천을 구축함 대조, 영지 : 대조가 건비익기健脾益氣하여 후천지본인 비위의 기혈 생화 기능을 보강하고, 영지가 보익기혈補益氣血 및 면역 조절 작용을 수행하여 항병력을 높이고 정기를 충만하게 함 ②자음유간滋陰柔肝, 양혈윤조養血潤燥 모듈 — 음혈을 자양하고 간신을 보강하여 혈액 생성의 기초를 다짐 당귀, 백작약, 숙지황 : 당귀가 양혈화혈養血和血하고, 백작약이 자음유간滋陰柔肝하여 근육과 혈락을 유연하게 하며, 숙지황이 자음보혈滋陰補血하여 정혈精血을 충만하게 하고 휴허虧虛를 근본적으로 다스림 ③지혈생기止血生肌, 수복혈락修復血絡 모듈 — 손상된 혈락을 수복하고 출혈 경향을 신속히 차단함 백급, 아교 : 백급이 지혈생기止血生肌하여 국소 출혈 부위와 손상된 혈락을 수복하고, 아교가 지혈양음止血養陰하여 혈액이 맥 외로 넘쳐나는 것을 방지함 ④행수소종行水消腫, 활혈통락活血通絡 모듈 — 수습을 배출하고 어혈의 정체를 풀어 경락을 소통함 적소두 : 적소두가 행수소종行水消腫하는 동시에 활혈통락活血通絡을 겸하여 어혈이 경락을 막는 어혈조락瘀血阻絡을 효과적으로 풀어내고 미세혈관의 순환을 개선함","master":"①비허불통혈脾虛不統血을 근본으로 한 병리기전 체계화 본 질환의 핵심 근본 병기를 비허불통혈脾虛不統血로 규정함. 소아는 치음치양稚陰稚陽 체질 특성상 비위 발달이 미숙하여 외감外感, 음식의 부절제, 질병 후 조리의 부적절로 비기휴허脾氣虧虛가 유발되기 쉬움. 비허로 통섭력統攝力을 잃으면 혈액이 맥 외로 출탈해 어점어반瘀點瘀斑이 반복되며, 구병과 재발성 출혈은 ‘구병입락久病入絡, 낙병급장絡病及臟’의 복잡한 병리를 형성함. 여기에 외감열독外感熱毒, 정지실조情志失調, 음허내열陰虛內熱로 인한 혈열망행血熱妄行, 출혈 누적으로 발생하여 재출혈을 부르는 음혈휴허陰血虧虛, 그리고 정혈 결핍과 기기문란氣機紊亂으로 미세순환을 장애하고 혈락을 손상시키는 간신부족肝腎不足, 낙맥실양絡脈失養이 복합적으로 작용하여 병이 지연된다고 파악함 ②기혈동조氣血同調 및 보이불조補而不燥, 양음이불니養陰而不膩의 약재 배오 기혈양허氣血兩虛, 어혈조락瘀血阻絡의 지연, 회복기에 적용함. 당귀, 숙지황, 백작약으로 간신肝腎과 영혈營血을 자양하고, 적소두로 활혈통락活血通絡하며, 백급, 아교로 혈락血絡을 수복하고, 대조, 영지로 비위의 기혈을 보함. 소아 체질을 고려하여 보하되 메마르지 않고, 음을 자양하되 끈적이지 않게 기혈과 장부를 온화하게 조율함 ③‘치비위治脾胃’를 통한 기혈 생화 원천 복구 및 근본 치료(치본治本) ‘비위는 기혈생화氣血生化의 원천’이라는 이론에 기반하여 비위 기능의 회복을 생혈生血의 으뜸으로 삼음. 당귀, 숙지황, 백작약의 양혈윤조養血潤燥, 대조의 건비익기健脾益氣, 적소두의 삼습활혈滲濕活血, 백급, 아교의 지혈생기止血生肌, 영지의 기혈보익氣血補益 및 면역조절을 상호 협력시켜 비위의 운화와 통섭을 되살림. 구병으로 인한 ‘기혈생화무원氣血生化無源’의 악순환을 끊어내어 혈액 생성 장애를 교정하고 환아의 체질적 약점을 근본적으로 개선함 ④‘치혈필선조간신治血必先調肝腎’ 및 전인적 장부 조율 간장혈肝藏血, 신주정생수腎主精生髓의 원칙에 따라 혈소판 생성과 유지에 간신肝腎 조율이 필수적임을 강조함. 당귀, 숙지황, 백작약으로 유간양혈柔肝養血, 자보간신滋補肝腎하고, 영지, 적소두, 백급, 아교를 통해 미세순환 개선, 혈락 수복, 면역 림프계 조절을 동시에 달성함. 이는 현대 의학의 미세순환 정상화 및 면역 항상성 회복 기전과 연결 지어 해석할 수 있음 ⑤병기 단계 및 동반 증상별 정밀 변증 가감 체계 급성기(혈열망행血熱妄行) : 출혈성 반진이 선홍색을 띠고 코피, 잇몸출혈, 설홍태황, 맥삭이 동반되면 천초, 목단피, 생지황, 지유, 측백엽을 가하여 청열양혈지혈淸熱涼血止血함. 발열, 번조煩躁가 심하면 황련을 가하여 청열사화淸熱瀉火함 지연, 회복기(기혈구허氣血俱虛, 간신부족肝腎不足) : 면색 위황萎黃, 생화부족生化不足에 황기, 당삼을 가하고, 요슬산연腰膝酸軟, 야매불안夜寐不安 등 간신부족에는 구기자, 산약을 추가함 기체어혈氣滯瘀血(어반瘀斑, 암자색) : 단삼, 홍화를 가하여 활혈화어통락活血化瘀通絡함 비허습성脾虛濕盛(식욕부진, 배가 더부룩하고 변이 묽은 복창변당腹脹便溏) : 백출, 복령을 가하여 건비리습健脾利濕함 음허도한陰虛盜汗(야간 도한) : 맥문동, 오미자를 가하여 양음렴한養陰斂汗함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 소아 면역성 혈소판 감소증은 희귀질환으로, 표준치료 병용 시 혈소판 수 회복을 보는 소규모 연구로 접근하는 것이 현실적 참고문헌 [1] 왕웨이,쉐린,왕례.국의대사 왕례 교수 경험방 귀작생혈탕의 소아 면역성 혈소판감소증 임상 치료 경험國醫大師王烈教授經驗方劑歸芍生血湯治療兒童免疫性血小板減少症臨證經驗[J].중국의약과학中國醫藥科學,2025,15(12):42-45+95."}},{"id":"2-14","ko":"탈민소전탕","hz":"脫敏消癜湯","alias":"","master_ko":"왕치","master_hz":"王琦","tagline":"알레르기성 체질을 개선하고 복사열독伏邪熱毒을 풀어 소아 IgA 혈관염을 치료하는 처방","meta":{"주요 적응증":"소아 IgA 혈관염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":145,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-14 탈민소전탕脫敏消癜湯의 모듈 구성<\/p><h4>①기초핵심조基礎核心組(조체탈민調體脫敏) — 과민체질을 근본적으로 조율하여 복사伏邪가 쌓이는 내적 토양을 개선함<\/h4><p><b>오매, 선퇴, 방풍, 영지(무병적지無柄赤芝)<\/b>: 오매가 산렴양음酸斂養陰하여 음액을 지키고, 선퇴-방풍이 소산풍열疏散風熱하여 항알레르기 효과를 내며, 오매와 방풍-선퇴의 수산상제收散相濟 배오로 폐의 선강宣降 기능을 조율하고, 영지가 면역 항상성을 조절하여 알레르기 반응의 내적 환경을 바로잡음<\/p><h4>②거사통락조祛邪通絡組(양혈소반涼血消斑) — 혈분의 열을 내리고, 울체된 복사를 밖으로 내보내며, 어혈을 풀어 손상된 혈락을 소통시킴<\/h4><p><b>승마, 별갑, 목단피, 지황, 수우각, 자초, 천초茜草<\/b>: 승마-선퇴로 기분氣分의 풍열을 산투散透하고, 목단피-지황-수우각-자초-천초가 혈분血分의 열을 식히고 활혈양혈活血涼血하여 어혈조락瘀血阻絡을 해소함. 승마와 별갑의 배오 (승마별갑탕升麻鼈甲湯 의미)로 기혈을 동시에 다스려(일기일혈一氣一血) 복사를 투발透發하고 혈락을 수복함<\/p><h4>③고호정기조顧護正氣組(부정양음扶正養陰) — 손상된 진액과 음혈을 충전하고 정기를 보살펴 질환의 재발을 방지함<\/h4><p><b>선학초, 한련초, 生감초<\/b>: 한련초-별갑-지황이 자음보허滋陰補虛하여 복사로 손상된 정기를 보강하고, 선학초가 수렴지혈收斂止血하여 기혈의 손실을 막고 부정扶正하며, 生감초가 청열해독하고 약성을 조화시킴<\/p>"},{"k":"master","t":"왕치의 IgA 혈관염 치료","html":"<h4>①복사학설伏邪學說과 알레르기성 체질을 결합한 병리 기전의 재정립<\/h4><p>IgA 혈관염의 반복적 재발과 지연 특성을 복사伏邪의 ‘우감이발遇感而發, 병정전면病程纏綿’ 병리와 일치하는 것으로 파악함. 알레르기성 체질은 복사가 형성되는 내적 요인이 되며, 외사外邪의 외감은 발병을 유발하는 외적 요인으로 작용함. 질환이 진행함에 따라 풍열열독風熱熱毒과 영혈營血이 서로 상박相搏하여 열독상락熱毒傷絡하고, 정체된 혈액이 어혈瘀血로 변하여 혈락을 막는 어혈조락瘀血阻絡과 체내 음혈이 손상되는 음혈휴허陰血虧虛가 복합 작용하여 병이 지연된다고 설명함<\/p><h4>②‘변체辨體-변병辨病-변증辨證’ 3차원 진료 모형 및 ‘주병주방主病主方’ 체계 구축<\/h4><p>단일한 변증 증형에만 의존하지 않고 체질體, 질환病, 증후證를 통섭하는 진료 체계를 적용함. 기본방인 탈민조체방脫敏調體方(오매, 선퇴, 방풍, 영지)을 축으로 삼아 알레르기성 체질을 근본적으로 조율하는 동시에, 본 병의 핵심 병기인 복사열독伏邪熱毒과 어혈조락瘀血阻絡을 투진透疹, 청열淸熱, 양혈涼血, 활혈活血 약재로 제어함. 이를 통해 알레르기 반응의 내적 환경을 개선하여 질환의 재발을 줄이고자 함<\/p><h4>③기분과 혈분, 수렴收斂과 산투散透를 동시에 조율하는 유연한 약재 배오(투복제독透伏制毒 및 고호정기<\/h4><p class=\"lbl2\">顧護正氣)<\/p><p><b>수산상제收散相濟<\/b>: 오매(산렴양음酸斂養陰)와 방풍, 선퇴(청투소산淸透疏散)를 배오하여 폐의 선강宣降 기능을 조율하고 항알레르기 효과를 극대화함<\/p><p><b>기혈동조氣血同調 및 투복청열透伏淸熱<\/b>: 승마-선퇴로 기분氣分의 풍열을 산투散透하고, 천초-자초-목단피-지황-수우각으로 혈분血分의 열독을 청열양혈지혈淸熱涼血止血함. 승마와 별갑의 결합은 승마별갑탕의 의미를 살려 기혈을 동시에 다스리고(일기일혈一氣一血), 승산升散과 수렴收斂을 조화시켜 복사를 밖으로 내보내고(투복透伏) 어혈을 없앰<\/p><p><b>고호정기顧護正氣<\/b>: 복사가 오랫동안 정기를 손상시키는 것을 막기 위해 별갑, 지황, 한련초로 자음보허滋陰補虛하고 선학초로 수렴지혈, 生감초로 약재의 성질을 조화롭게 함<\/p><h4>④정밀 가감 체계 — 변체, 변병, 변증별 임상 가감 응용<\/h4><p><b>변체辨體가감(알레르기 체질이 심할 때)<\/b>: 野영지靈芝, 制하수오何首烏를 추가하여 체질 개선 강도를 높임<\/p><p>변병辨病가감(합병증 및 임상형 대응):<\/p><p class=\"sub\"><b>알레르기성 두드러기가 동반될 때<\/b>: 동과피, 백선피, 지골피를 추가함(청열소종리습淸熱消腫利濕)<\/p><p class=\"sub\"><b>상기도 감염으로 유발될 때<\/b>: 연교, 중루 추가함(청열해독淸熱解毒)<\/p><p class=\"sub\"><b>복통이 심할 때<\/b>: 백작약을 추가함(유간완급지통柔肝緩急止痛)<\/p><p class=\"sub\"><b>관절통, 굴신불리屈伸不利<\/b>: 서장경, 계혈등을 추가함(거풍제습祛風除濕 활혈통락活血通絡)<\/p><p class=\"sub\"><b>혈뇨, 단백뇨가 있을 때<\/b>: 적설초, 백모근, 소계를 추가함(양혈지혈涼血止血 화어리뇨化瘀利尿)<\/p><p>변증辨證가감 (병증 단계별 대응):<\/p><p class=\"sub\"><b>혈열증血熱證(반진이 선홍색일 때)<\/b>: 백모근, 지골피를 추가함(양혈지혈涼血止血)<\/p><p class=\"sub\"><b>어혈증瘀血證(통락을 강조할 때)<\/b>: 수오등, 인동등, 호장을 추가함(활혈통락活血通絡)<\/p><p class=\"sub\"><b>열독증熱毒證(열독이 왕성할 때)<\/b>: 연교, 황백을 추가함(청열해독淸熱解毒)<\/p><p class=\"sub\"><b>폐비기허肺脾氣虛(경과가 지연될 때)<\/b>: 옥병풍산을 합방함(건비익기健脾益氣)<\/p><p class=\"sub\"><b>폐신음허肺腎陰虛(기저가 음허일 때)<\/b>: 맥미지황환麥味地黃丸 또는 육미지황환을 합방함(자음고본滋陰固本)<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">왕치王琦의 체질 이론과 연결되는 처방으로, 국내 사상체질 연구와 비교하는 관점에서 활용 가능<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 저우야오야오,바이밍화,양정,등.“복사학설”에 기반한 국의대사 왕치의 “탈민소전탕” 조방 규율 탐구基於“伏邪學說”探析國醫大師王琦“脫敏消癜湯”的組方規律[J].중화중의약잡지中華中醫藥雜志,2023,38(7):3442-3444.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"오매","name":"오매","dose":"","base":"오매"},{"raw":"선퇴","name":"선퇴","dose":"","base":"선퇴"},{"raw":"방풍","name":"방풍","dose":"","base":"방풍"},{"raw":"영지","name":"영지","dose":"","base":"영지"},{"raw":"승마","name":"승마","dose":"","base":"승마"},{"raw":"별갑","name":"별갑","dose":"","base":"별갑"},{"raw":"목단피","name":"목단피","dose":"","base":"목단피"},{"raw":"지황","name":"지황","dose":"","base":"지황"},{"raw":"수우각水牛角","name":"수우각水牛角","dose":"","base":"수우각"},{"raw":"자초","name":"자초","dose":"","base":"자초"},{"raw":"천초茜草","name":"천초茜草","dose":"","base":"천초"},{"raw":"선학초","name":"선학초","dose":"","base":"선학초"},{"raw":"한련초","name":"한련초","dose":"","base":"한련초"},{"raw":"生감초","name":"生감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["체질을 개선하고 과민 반응을 완화함(조체탈민調體脫敏)","혈열血熱을 식히고 복사伏邪를 밖으로 내보냄(양혈투사涼血透邪)","어혈을 풀어 경락과 미세혈관을 소통시킴(화어통락化瘀通絡)","진액과 음액을 보존하고 보호함(고호음액顧護陰液)"],"주치증":["알레르기성 체질, 복사내복伏邪內伏, 열독상락熱毒傷絡, 어혈조락瘀血阻絡, 음혈휴허陰血虧虛증형으로 유발된 소아 IgA 혈관염(급성기, 지속기, 회복기 및 각 임상형)"],"연구 확장 영역":["소아 자반성 질환(HSP), 과민성 두드러기, 알레르기성 비염, 면역조절 장애성 혈관 질환, 자가면역성 피부 질환"],"R&D 포인트":["오매, 선퇴, 방풍, 영지 복합 추출물(탈민조체방)의 항알레르기, 비만세포 탈과립 억제 및 면역 조절 기능을 활용한 알레르기성 질환 치료 천연물 신약 개발","수우각, 목단피, 지황, 자초, 천초의 혈관 내피 염증 억제 및 증가된 미세혈관 투과성 완화 작용을 활용한 급성 혈열성 출혈 억제 천연물 소재 연구","별갑, 한련초, 선학초의 음혈 자양 및 면역 조절 작용을 활용한 만성 혈관 염증 완화 제제 연구"]},"modules":[{"name":"①기초핵심조","hz":"基礎核心組","herbs":["오매","선퇴","방풍","영지(무병적지無柄赤芝)"],"role":"과민체질을 근본적으로 조율하여 복사伏邪가 쌓이는 내적 토양을 개선함"},{"name":"②거사통락조","hz":"祛邪通絡組","herbs":["승마","별갑","목단피","지황","수우각","자초","천초茜草"],"role":"혈분의 열을 내리고, 울체된 복사를 밖으로 내보내며, 어혈을 풀어 손상된 혈락을 소통시킴"},{"name":"③고호정기조","hz":"顧護正氣組","herbs":["선학초","한련초","生감초"],"role":"손상된 진액과 음혈을 충전하고 정기를 보살펴 질환의 재발을 방지함"}],"rd":[{"tag":"Pediatric HSP","title":"소아 IgA 혈관염의 신장 침범 예방","html":"<p>소아 IgA 혈관염은 신장 침범 여부가 예후를 좌우함<\/p><p>급성기 투여군에서 6개월 내 신장 침범(혈뇨·단백뇨) 발생률을 관찰하되, 관찰 연구로는 예방 효과의 인과성을 입증할 수 없으므로 가설을 만드는 단계로 둠 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](복사학설 기반 조방 규율), 본문 주치증)<\/p>"},{"tag":"Allergic Constitution","title":"오매·선퇴·방풍·영지의 ‘탈민’ 체질 조절","html":"<p>왕치의 체질 이론에 따른 탈민 약대(오매·선퇴·방풍·영지)를 비만세포 안정화와 IgE 반응 억제로 검증함<\/p><p><b>이로써 재발 억제라는 체질 조절 효과를 객관화 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 1 「조체탈민과 면역 항상성」)<\/p>"},{"tag":"Substitute Material","title":"수우각의 기여도와 대체","html":"<p>수우각水牛角(서각 대용)은 국내 공정서(대한민국약전·대한민국약전외한약(생약) 규격집)에 수재되지 않은 약재임<\/p><p>수우각·지황·목단피의 양혈 모듈에서 수우각 유무에 따른 출혈·혈관염 지표 차이를 확인하고 대체 조성을 검토하며, 소아 안전성 검토를 포함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)<\/p>"},{"tag":"Three-dimension Diagnosis","title":"체질–질병–증형 3차원 진료의 표준화","html":"<p>‘체·병·증’ 3차원 진료를 소아 자반증에 적용하려면 체질 판정 도구를 표준화해야 함<\/p><p><b>체질 유형별 처방 반응성 차이를 분석하는 연구로 연결 (근거 유형<\/b>: 임상 경험 보고 | 근거: R&amp;D 논리 4, 참고문헌 [1])<\/p>"}],"logic":[{"n":"1","title":"조체탈민調體脫敏과 면역 항상성","body":"알레르기 체질의 내적 환경을 바로잡음"},{"n":"2","title":"양혈투사涼血透邪와 열독 청해","body":"혈분 열을 식히고 복사를 투발함"},{"n":"3","title":"부정양음扶正養陰과 음혈 보호","body":"손상된 음혈을 보강하고 정기를 수호함"},{"n":"4","title":"체體, 병病, 증證 3차원 진료와 수산상제收散相濟","body":"기혈동조氣血同調와 수산상제를 통해 투복제독透伏制毒과 신체 방어를 유기적으로 결합함"}],"field":2,"pages":[145,149],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-14","탈민소전탕","脫敏消癜湯","","왕치","王琦","알레르기성 체질을 개선하고 복사열독伏邪熱毒을 풀어 소아 IgA 혈관염을 치료하는 처방","오매 선퇴 방풍 영지 승마 별갑 목단피 지황 수우각水牛角 자초 천초茜草 선학초 한련초 生감초","","핵심 효능 체질을 개선하고 과민 반응을 완화함(조체탈민調體脫敏) 혈열血熱을 식히고 복사伏邪를 밖으로 내보냄(양혈투사涼血透邪) 어혈을 풀어 경락과 미세혈관을 소통시킴(화어통락化瘀通絡) 진액과 음액을 보존하고 보호함(고호음액顧護陰液)","주치증 알레르기성 체질, 복사내복伏邪內伏, 열독상락熱毒傷絡, 어혈조락瘀血阻絡, 음혈휴허陰血虧虛증형으로 유발된 소아 IgA 혈관염(급성기, 지속기, 회복기 및 각 임상형)","연구 확장 영역 소아 자반성 질환(HSP), 과민성 두드러기, 알레르기성 비염, 면역조절 장애성 혈관 질환, 자가면역성 피부 질환","R&D 포인트 오매, 선퇴, 방풍, 영지 복합 추출물(탈민조체방)의 항알레르기, 비만세포 탈과립 억제 및 면역 조절 기능을 활용한 알레르기성 질환 치료 천연물 신약 개발 수우각, 목단피, 지황, 자초, 천초의 혈관 내피 염증 억제 및 증가된 미세혈관 투과성 완화 작용을 활용한 급성 혈열성 출혈 억제 천연물 소재 연구 별갑, 한련초, 선학초의 음혈 자양 및 면역 조절 작용을 활용한 만성 혈관 염증 완화 제제 연구","①기초핵심조 基礎核心組 오매 선퇴 방풍 영지(무병적지無柄赤芝) 과민체질을 근본적으로 조율하여 복사伏邪가 쌓이는 내적 토양을 개선함","②거사통락조 祛邪通絡組 승마 별갑 목단피 지황 수우각 자초 천초茜草 혈분의 열을 내리고, 울체된 복사를 밖으로 내보내며, 어혈을 풀어 손상된 혈락을 소통시킴","③고호정기조 顧護正氣組 선학초 한련초 生감초 손상된 진액과 음혈을 충전하고 정기를 보살펴 질환의 재발을 방지함","조체탈민調體脫敏과 면역 항상성 알레르기 체질의 내적 환경을 바로잡음","양혈투사涼血透邪와 열독 청해 혈분 열을 식히고 복사를 투발함","부정양음扶正養陰과 음혈 보호 손상된 음혈을 보강하고 정기를 수호함","체體, 병病, 증證 3차원 진료와 수산상제收散相濟 기혈동조氣血同調와 수산상제를 통해 투복제독透伏制毒과 신체 방어를 유기적으로 결합함","Pediatric HSP 소아 IgA 혈관염의 신장 침범 예방 소아 IgA 혈관염은 신장 침범 여부가 예후를 좌우함 급성기 투여군에서 6개월 내 신장 침범(혈뇨·단백뇨) 발생률을 관찰하되, 관찰 연구로는 예방 효과의 인과성을 입증할 수 없으므로 가설을 만드는 단계로 둠 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](복사학설 기반 조방 규율), 본문 주치증)","Allergic Constitution 오매·선퇴·방풍·영지의 ‘탈민’ 체질 조절 왕치의 체질 이론에 따른 탈민 약대(오매·선퇴·방풍·영지)를 비만세포 안정화와 IgE 반응 억제로 검증함 이로써 재발 억제라는 체질 조절 효과를 객관화 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 1 「조체탈민과 면역 항상성」)","Substitute Material 수우각의 기여도와 대체 수우각水牛角(서각 대용)은 국내 공정서(대한민국약전·대한민국약전외한약(생약) 규격집)에 수재되지 않은 약재임 수우각·지황·목단피의 양혈 모듈에서 수우각 유무에 따른 출혈·혈관염 지표 차이를 확인하고 대체 조성을 검토하며, 소아 안전성 검토를 포함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)","Three-dimension Diagnosis 체질–질병–증형 3차원 진료의 표준화 ‘체·병·증’ 3차원 진료를 소아 자반증에 적용하려면 체질 판정 도구를 표준화해야 함 체질 유형별 처방 반응성 차이를 분석하는 연구로 연결 (근거 유형 : 임상 경험 보고 | 근거: R&D 논리 4, 참고문헌 [1])"],"ss":{"composition":"그림 2-14 탈민소전탕脫敏消癜湯의 모듈 구성 ①기초핵심조基礎核心組(조체탈민調體脫敏) — 과민체질을 근본적으로 조율하여 복사伏邪가 쌓이는 내적 토양을 개선함 오매, 선퇴, 방풍, 영지(무병적지無柄赤芝) : 오매가 산렴양음酸斂養陰하여 음액을 지키고, 선퇴-방풍이 소산풍열疏散風熱하여 항알레르기 효과를 내며, 오매와 방풍-선퇴의 수산상제收散相濟 배오로 폐의 선강宣降 기능을 조율하고, 영지가 면역 항상성을 조절하여 알레르기 반응의 내적 환경을 바로잡음 ②거사통락조祛邪通絡組(양혈소반涼血消斑) — 혈분의 열을 내리고, 울체된 복사를 밖으로 내보내며, 어혈을 풀어 손상된 혈락을 소통시킴 승마, 별갑, 목단피, 지황, 수우각, 자초, 천초茜草 : 승마-선퇴로 기분氣分의 풍열을 산투散透하고, 목단피-지황-수우각-자초-천초가 혈분血分의 열을 식히고 활혈양혈活血涼血하여 어혈조락瘀血阻絡을 해소함. 승마와 별갑의 배오 (승마별갑탕升麻鼈甲湯 의미)로 기혈을 동시에 다스려(일기일혈一氣一血) 복사를 투발透發하고 혈락을 수복함 ③고호정기조顧護正氣組(부정양음扶正養陰) — 손상된 진액과 음혈을 충전하고 정기를 보살펴 질환의 재발을 방지함 선학초, 한련초, 生감초 : 한련초-별갑-지황이 자음보허滋陰補虛하여 복사로 손상된 정기를 보강하고, 선학초가 수렴지혈收斂止血하여 기혈의 손실을 막고 부정扶正하며, 生감초가 청열해독하고 약성을 조화시킴","master":"①복사학설伏邪學說과 알레르기성 체질을 결합한 병리 기전의 재정립 IgA 혈관염의 반복적 재발과 지연 특성을 복사伏邪의 ‘우감이발遇感而發, 병정전면病程纏綿’ 병리와 일치하는 것으로 파악함. 알레르기성 체질은 복사가 형성되는 내적 요인이 되며, 외사外邪의 외감은 발병을 유발하는 외적 요인으로 작용함. 질환이 진행함에 따라 풍열열독風熱熱毒과 영혈營血이 서로 상박相搏하여 열독상락熱毒傷絡하고, 정체된 혈액이 어혈瘀血로 변하여 혈락을 막는 어혈조락瘀血阻絡과 체내 음혈이 손상되는 음혈휴허陰血虧虛가 복합 작용하여 병이 지연된다고 설명함 ②‘변체辨體-변병辨病-변증辨證’ 3차원 진료 모형 및 ‘주병주방主病主方’ 체계 구축 단일한 변증 증형에만 의존하지 않고 체질體, 질환病, 증후證를 통섭하는 진료 체계를 적용함. 기본방인 탈민조체방脫敏調體方(오매, 선퇴, 방풍, 영지)을 축으로 삼아 알레르기성 체질을 근본적으로 조율하는 동시에, 본 병의 핵심 병기인 복사열독伏邪熱毒과 어혈조락瘀血阻絡을 투진透疹, 청열淸熱, 양혈涼血, 활혈活血 약재로 제어함. 이를 통해 알레르기 반응의 내적 환경을 개선하여 질환의 재발을 줄이고자 함 ③기분과 혈분, 수렴收斂과 산투散透를 동시에 조율하는 유연한 약재 배오(투복제독透伏制毒 및 고호정기 顧護正氣) 수산상제收散相濟 : 오매(산렴양음酸斂養陰)와 방풍, 선퇴(청투소산淸透疏散)를 배오하여 폐의 선강宣降 기능을 조율하고 항알레르기 효과를 극대화함 기혈동조氣血同調 및 투복청열透伏淸熱 : 승마-선퇴로 기분氣分의 풍열을 산투散透하고, 천초-자초-목단피-지황-수우각으로 혈분血分의 열독을 청열양혈지혈淸熱涼血止血함. 승마와 별갑의 결합은 승마별갑탕의 의미를 살려 기혈을 동시에 다스리고(일기일혈一氣一血), 승산升散과 수렴收斂을 조화시켜 복사를 밖으로 내보내고(투복透伏) 어혈을 없앰 고호정기顧護正氣 : 복사가 오랫동안 정기를 손상시키는 것을 막기 위해 별갑, 지황, 한련초로 자음보허滋陰補虛하고 선학초로 수렴지혈, 生감초로 약재의 성질을 조화롭게 함 ④정밀 가감 체계 — 변체, 변병, 변증별 임상 가감 응용 변체辨體가감(알레르기 체질이 심할 때) : 野영지靈芝, 制하수오何首烏를 추가하여 체질 개선 강도를 높임 변병辨病가감(합병증 및 임상형 대응): 알레르기성 두드러기가 동반될 때 : 동과피, 백선피, 지골피를 추가함(청열소종리습淸熱消腫利濕) 상기도 감염으로 유발될 때 : 연교, 중루 추가함(청열해독淸熱解毒) 복통이 심할 때 : 백작약을 추가함(유간완급지통柔肝緩急止痛) 관절통, 굴신불리屈伸不利 : 서장경, 계혈등을 추가함(거풍제습祛風除濕 활혈통락活血通絡) 혈뇨, 단백뇨가 있을 때 : 적설초, 백모근, 소계를 추가함(양혈지혈涼血止血 화어리뇨化瘀利尿) 변증辨證가감 (병증 단계별 대응): 혈열증血熱證(반진이 선홍색일 때) : 백모근, 지골피를 추가함(양혈지혈涼血止血) 어혈증瘀血證(통락을 강조할 때) : 수오등, 인동등, 호장을 추가함(활혈통락活血通絡) 열독증熱毒證(열독이 왕성할 때) : 연교, 황백을 추가함(청열해독淸熱解毒) 폐비기허肺脾氣虛(경과가 지연될 때) : 옥병풍산을 합방함(건비익기健脾益氣) 폐신음허肺腎陰虛(기저가 음허일 때) : 맥미지황환麥味地黃丸 또는 육미지황환을 합방함(자음고본滋陰固本)","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 왕치王琦의 체질 이론과 연결되는 처방으로, 국내 사상체질 연구와 비교하는 관점에서 활용 가능 참고문헌 [1] 저우야오야오,바이밍화,양정,등.“복사학설”에 기반한 국의대사 왕치의 “탈민소전탕” 조방 규율 탐구基於“伏邪學說”探析國醫大師王琦“脫敏消癜湯”的組方規律[J].중화중의약잡지中華中醫藥雜志,2023,38(7):3442-3444."}},{"id":"2-15","ko":"지양소담탕","hz":"止癢消蕁湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"혈허풍조血虛風燥와 비허습온脾虛濕蘊의 병기를 다스려, 만성 두드러기(은진癮疹)를 치료하는 처방","meta":{"주요 적응증":"만성 두드러기","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":150,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-15 지양소담탕止癢消蕁湯의 모듈 구성<\/p><h4>①양혈활혈養血活血 모듈 — 혈을 자양하고 어혈을 풀어 풍사를 다스림<\/h4><p><b>당귀<\/b>: 생혈生血 및 활혈活血의 주약으로서 영혈을 보충하고 기혈의 순행을 도와 사기를 밖으로 몰아냄<\/p><p><b>자초, 목단피, 적작약, 단삼<\/b>: 혈중의 열독을 끄고 어혈을 풀어 “풍을 치료하려면 먼저 혈을 치료해야 하며治風先治血, 혈이 잘 돌면 풍이 저절로 사라진다血行風自滅”는 이치를 구현함<\/p><h4>②건비이습健脾利濕 모듈 — 비위를 튼튼히 하고 수습을 다스려 부종을 가라앉힘<\/h4><p><b>복령, 의이인<\/b>: 비위를 튼튼하게 하고 이수利水하여 습을 제거함으로써 수습의 운행을 도움<\/p><p><b>상백피<\/b>: 폐를 소통시키고 이수소종利水消腫하여 풍단의 부종을 신속히 가라앉힘<\/p><h4>③거풍지양祛風止癢 모듈 — 체표의 풍사를 제거하고 가려움을 멈춤<\/h4><p><b>형개, 방풍<\/b>: 체표의 풍사를 제거하고 거풍해표祛風解表하여 피부의 풍사로 인한 증상을 완화함<\/p><p><b>백선피<\/b>: 거풍지양祛風止癢, 청열해독하여 피부의 가려움과 창양瘡瘍을 다스림<\/p><h4>④조화제약調和諸藥 모듈 — 제반 약재를 조화롭게 융화시킴<\/h4><p><b>감초<\/b>: 제약의 성질을 고르게 조화시킴<\/p>"},{"k":"master","t":"장전의 만성 두드러기(담마진蕁麻疹) 치료","html":"<h4>①병인병기 이론<\/h4><p>대사는 만성 두드러기의 기본 병기를 혈허풍조血虛風燥와 비허습온脾虛濕蘊으로 파악함<\/p><p><b>내풍內風과 혈허血虛<\/b>: 오랜 병정이나 비허로 인해 혈이 부족해지면 피부가 영양을 잃어 풍風이 생기고 조燥해지며, 위기衛氣가 굳건하지 못해 외사外邪가 쉽게 침입하여 복풍伏風으로 체내에 잠복하게 됨<\/p><p><b>습사濕邪와 비위<\/b>: 비위가 허약하여 수습을 제대로 운행하지 못하면, 습사가 내온內蘊하여 풍사와 결합하고 피부에 몰려 낫지 않고 반복해서 발작함<\/p><h4>②지양소담탕의 거풍통락祛風通絡과 보허사실補虛瀉實<\/h4><p><b>보허사실補虛瀉實의 원칙<\/b>: 부족한 혈을 먼저 보충하고 사기를 몰아내는 방식을 취함. 단순한 공벌攻伐 위주에서 벗어나 치혈治血을 근본으로 삼고, 거풍祛風을 전 과정에 관통시킴<\/p><p><b>소조기기疏調氣機의 응용<\/b>: 대사가 주장한 소조기기의 사상에 입각하여, 비위의 청승탁강淸升濁降을 회복시킴으로써 폐와 비의 방어력을 동시에 강화하고 풍습의 울체鬱滯를 해소함<\/p><h4>③겸증 가감<\/h4><p><b>한성寒盛일 때<\/b>: 계지, 마황, 세신 등을 가미함<\/p><p><b>열성熱盛일 때<\/b>: 포공영, 백화사설초, 연교 등을 가미함<\/p><p><b>풍사風邪가 많을 때<\/b>: 구등, 수오등, 선퇴 등을 가미함<\/p><p><b>습열濕熱이 많을 때<\/b>: 고삼, 마치현, 용규 등을 가미함<\/p><p><b>한습寒濕이 많을 때<\/b>: 서장경, 강활, 백지 등을 가미함<\/p><p><b>음허풍조陰虛風燥일 때<\/b>: 오매, 오미자 등을 가미함<\/p><p><b>소양瘙癢이 심할 때<\/b>: 오초사, 전갈 등을 가미함<\/p><p><b>소양에 의해 수면 장애를 동반할 때<\/b>: 백합, 수오등, 선퇴 등을 가미함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">만성 두드러기 대상 처방이 보기소진탕과 함께 2종 있으므로, 두 처방의 대상 환자 차이를 비교하는 연구가 효율적<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 주젠핑,톈위안,루신위,등.국의대사 장전의 만성 두드러기 치료 경험國醫大師張震論治慢性蕁麻疹經驗[J].중의학보中醫學報,2022,37(8):1650-1654.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당귀","name":"당귀","dose":"","base":"당귀"},{"raw":"단삼","name":"단삼","dose":"","base":"단삼"},{"raw":"목단피","name":"목단피","dose":"","base":"목단피"},{"raw":"적작약","name":"적작약","dose":"","base":"적작약"},{"raw":"자초","name":"자초","dose":"","base":"자초"},{"raw":"복령","name":"복령","dose":"","base":"복령"},{"raw":"의이인","name":"의이인","dose":"","base":"의이인"},{"raw":"형개","name":"형개","dose":"","base":"형개"},{"raw":"방풍","name":"방풍","dose":"","base":"방풍"},{"raw":"백선피","name":"백선피","dose":"","base":"백선피"},{"raw":"상백피","name":"상백피","dose":"","base":"상백피"},{"raw":"감초","name":"감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["혈을 기르고 어혈을 풀며 혈행을 소통시킴(양혈활혈養血活血)","풍사를 흩어 제거하고 경락을 열어 가려움을 멈춤(거풍지양祛風止癢)"],"주치증":["만성 두드러기(은진癮疹), 풍단風團 및 혈관부종, 피부소양증, 반복 발작하는 피부 질환 등"],"연구 확장 영역":["만성 두드러기, 알레르기성 피부 질환, 피부소양증, 면역성 피부 질환 등"],"R&D 포인트":["당귀, 자초, 목단피, 적작약 등의 배합이 비만세포의 히스타민 방출 억제 및 항알레르기 작용에 미치는 영향 분석","상백피, 복령, 의이인 등의 이수利水 작용이 풍단 및 피부 국소 부종 해소에 미치는 기전 검증","백선피, 방풍 등의 가려움증 역치閾值 상승 및 면역 조절 작용 연구"]},"modules":[{"name":"①양혈활혈","hz":"養血活血","herbs":["당귀","자초","목단피","적작약","단삼"],"role":"혈을 자양하고 어혈을 풀어 풍사를 다스림"},{"name":"②건비이습","hz":"健脾利濕","herbs":["복령","의이인","상백피"],"role":"비위를 튼튼히 하고 수습을 다스려 부종을 가라앉힘"},{"name":"③거풍지양","hz":"祛風止癢","herbs":["형개","방풍","백선피"],"role":"체표의 풍사를 제거하고 가려움을 멈춤"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":"제반 약재를 조화롭게 융화시킴"}],"rd":[{"tag":"Chronic Urticaria","title":"만성 자발성 두드러기의 병용 효과","html":"<p>만성 두드러기 치료 경험이 정리되어 있음<\/p><p>항히스타민제 증량에도 조절되지 않는 환자에서 UAS7 점수와 혈관부종 발생 횟수를 지표로 한 병용 탐색 임상이 적합 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1] (2022, 만성 두드러기 치료 경험))<\/p>"},{"tag":"Angioedema & Edema","title":"복령·의이인의 팽진·부종 해소","html":"<p>팽진과 혈관부종은 병태와 평가 지표가 다름<\/p><p>따라서 둘을 나누어 평가하고, 건비이습 약재가 각각을 줄이는지 혈관 투과성 모델로 확인하여 ‘이수’를 부종 지표로 구체화 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 2 「건비이습과 부종 해소」)<\/p>"},{"tag":"Pruritus","title":"형개·방풍·백선피의 가려움 역치 조절","html":"<p>거풍지양 약재군의 가려움 억제 효과를 가려움 유발 모델과 피부 신경 감작 지표로 측정함<\/p><p>그 결과로 처방의 핵심 약재를 좁힘(약재별 지양 실험은 처방 효과와 구분된 기초 자료임) (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「거풍지양과 체표 청산」)<\/p>"},{"tag":"Blood-nourishing","title":"양혈활혈 모듈과 재발 억제","html":"<p>당귀·단삼·목단피·적작약·자초의 양혈활혈 모듈이 만성화와 재발을 줄이는지가 핵심 질문임<\/p><p><b>증상 소실 후 재발률로 평가하여 ‘치풍선치혈’ 원칙을 확인 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 1·4, 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"양혈활혈養血活血과 혈행 소통","body":"혈을 기르고 어혈을 풀어 풍을 다스림"},{"n":"2","title":"건비이습健脾利濕과 부종 해소","body":"수습을 다스리고 풍단의 부종을 가라앉힘"},{"n":"3","title":"거풍지양祛風止癢과 체표 청산","body":"체표의 풍사를 흩어 제거하고 가려움을 멈춤"},{"n":"4","title":"보허사실補虛瀉實과 기기 소조","body":"혈허와 습사를 동시에 다스려 비위의 청승탁강을 회복함"}],"field":2,"pages":[150,153],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-15","지양소담탕","止癢消蕁湯","","장전","張震","혈허풍조血虛風燥와 비허습온脾虛濕蘊의 병기를 다스려, 만성 두드러기(은진癮疹)를 치료하는 처방","당귀 단삼 목단피 적작약 자초 복령 의이인 형개 방풍 백선피 상백피 감초","","핵심 효능 혈을 기르고 어혈을 풀며 혈행을 소통시킴(양혈활혈養血活血) 풍사를 흩어 제거하고 경락을 열어 가려움을 멈춤(거풍지양祛風止癢)","주치증 만성 두드러기(은진癮疹), 풍단風團 및 혈관부종, 피부소양증, 반복 발작하는 피부 질환 등","연구 확장 영역 만성 두드러기, 알레르기성 피부 질환, 피부소양증, 면역성 피부 질환 등","R&D 포인트 당귀, 자초, 목단피, 적작약 등의 배합이 비만세포의 히스타민 방출 억제 및 항알레르기 작용에 미치는 영향 분석 상백피, 복령, 의이인 등의 이수利水 작용이 풍단 및 피부 국소 부종 해소에 미치는 기전 검증 백선피, 방풍 등의 가려움증 역치閾值 상승 및 면역 조절 작용 연구","①양혈활혈 養血活血 당귀 자초 목단피 적작약 단삼 혈을 자양하고 어혈을 풀어 풍사를 다스림","②건비이습 健脾利濕 복령 의이인 상백피 비위를 튼튼히 하고 수습을 다스려 부종을 가라앉힘","③거풍지양 祛風止癢 형개 방풍 백선피 체표의 풍사를 제거하고 가려움을 멈춤","④조화제약 調和諸藥 감초 제반 약재를 조화롭게 융화시킴","양혈활혈養血活血과 혈행 소통 혈을 기르고 어혈을 풀어 풍을 다스림","건비이습健脾利濕과 부종 해소 수습을 다스리고 풍단의 부종을 가라앉힘","거풍지양祛風止癢과 체표 청산 체표의 풍사를 흩어 제거하고 가려움을 멈춤","보허사실補虛瀉實과 기기 소조 혈허와 습사를 동시에 다스려 비위의 청승탁강을 회복함","Chronic Urticaria 만성 자발성 두드러기의 병용 효과 만성 두드러기 치료 경험이 정리되어 있음 항히스타민제 증량에도 조절되지 않는 환자에서 UAS7 점수와 혈관부종 발생 횟수를 지표로 한 병용 탐색 임상이 적합 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1] (2022, 만성 두드러기 치료 경험))","Angioedema & Edema 복령·의이인의 팽진·부종 해소 팽진과 혈관부종은 병태와 평가 지표가 다름 따라서 둘을 나누어 평가하고, 건비이습 약재가 각각을 줄이는지 혈관 투과성 모델로 확인하여 ‘이수’를 부종 지표로 구체화 (근거 유형: 신규 연구가설 | 근거: R&D 논리 2 「건비이습과 부종 해소」)","Pruritus 형개·방풍·백선피의 가려움 역치 조절 거풍지양 약재군의 가려움 억제 효과를 가려움 유발 모델과 피부 신경 감작 지표로 측정함 그 결과로 처방의 핵심 약재를 좁힘(약재별 지양 실험은 처방 효과와 구분된 기초 자료임) (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「거풍지양과 체표 청산」)","Blood-nourishing 양혈활혈 모듈과 재발 억제 당귀·단삼·목단피·적작약·자초의 양혈활혈 모듈이 만성화와 재발을 줄이는지가 핵심 질문임 증상 소실 후 재발률로 평가하여 ‘치풍선치혈’ 원칙을 확인 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 1·4, 본문 조성표)"],"ss":{"composition":"그림 2-15 지양소담탕止癢消蕁湯의 모듈 구성 ①양혈활혈養血活血 모듈 — 혈을 자양하고 어혈을 풀어 풍사를 다스림 당귀 : 생혈生血 및 활혈活血의 주약으로서 영혈을 보충하고 기혈의 순행을 도와 사기를 밖으로 몰아냄 자초, 목단피, 적작약, 단삼 : 혈중의 열독을 끄고 어혈을 풀어 “풍을 치료하려면 먼저 혈을 치료해야 하며治風先治血, 혈이 잘 돌면 풍이 저절로 사라진다血行風自滅”는 이치를 구현함 ②건비이습健脾利濕 모듈 — 비위를 튼튼히 하고 수습을 다스려 부종을 가라앉힘 복령, 의이인 : 비위를 튼튼하게 하고 이수利水하여 습을 제거함으로써 수습의 운행을 도움 상백피 : 폐를 소통시키고 이수소종利水消腫하여 풍단의 부종을 신속히 가라앉힘 ③거풍지양祛風止癢 모듈 — 체표의 풍사를 제거하고 가려움을 멈춤 형개, 방풍 : 체표의 풍사를 제거하고 거풍해표祛風解表하여 피부의 풍사로 인한 증상을 완화함 백선피 : 거풍지양祛風止癢, 청열해독하여 피부의 가려움과 창양瘡瘍을 다스림 ④조화제약調和諸藥 모듈 — 제반 약재를 조화롭게 융화시킴 감초 : 제약의 성질을 고르게 조화시킴","master":"①병인병기 이론 대사는 만성 두드러기의 기본 병기를 혈허풍조血虛風燥와 비허습온脾虛濕蘊으로 파악함 내풍內風과 혈허血虛 : 오랜 병정이나 비허로 인해 혈이 부족해지면 피부가 영양을 잃어 풍風이 생기고 조燥해지며, 위기衛氣가 굳건하지 못해 외사外邪가 쉽게 침입하여 복풍伏風으로 체내에 잠복하게 됨 습사濕邪와 비위 : 비위가 허약하여 수습을 제대로 운행하지 못하면, 습사가 내온內蘊하여 풍사와 결합하고 피부에 몰려 낫지 않고 반복해서 발작함 ②지양소담탕의 거풍통락祛風通絡과 보허사실補虛瀉實 보허사실補虛瀉實의 원칙 : 부족한 혈을 먼저 보충하고 사기를 몰아내는 방식을 취함. 단순한 공벌攻伐 위주에서 벗어나 치혈治血을 근본으로 삼고, 거풍祛風을 전 과정에 관통시킴 소조기기疏調氣機의 응용 : 대사가 주장한 소조기기의 사상에 입각하여, 비위의 청승탁강淸升濁降을 회복시킴으로써 폐와 비의 방어력을 동시에 강화하고 풍습의 울체鬱滯를 해소함 ③겸증 가감 한성寒盛일 때 : 계지, 마황, 세신 등을 가미함 열성熱盛일 때 : 포공영, 백화사설초, 연교 등을 가미함 풍사風邪가 많을 때 : 구등, 수오등, 선퇴 등을 가미함 습열濕熱이 많을 때 : 고삼, 마치현, 용규 등을 가미함 한습寒濕이 많을 때 : 서장경, 강활, 백지 등을 가미함 음허풍조陰虛風燥일 때 : 오매, 오미자 등을 가미함 소양瘙癢이 심할 때 : 오초사, 전갈 등을 가미함 소양에 의해 수면 장애를 동반할 때 : 백합, 수오등, 선퇴 등을 가미함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 만성 두드러기 대상 처방이 보기소진탕과 함께 2종 있으므로, 두 처방의 대상 환자 차이를 비교하는 연구가 효율적 참고문헌 [1] 주젠핑,톈위안,루신위,등.국의대사 장전의 만성 두드러기 치료 경험國醫大師張震論治慢性蕁麻疹經驗[J].중의학보中醫學報,2022,37(8):1650-1654."}},{"id":"2-16","ko":"오등견비음","hz":"五藤蠲痹飮","alias":"","master_ko":"류쭈이","master_hz":"劉祖貽","tagline":"습열독사濕熱毒邪가 근맥과 관절骨節을 비조痹阻하는 병기를 다스려, 류마티스 관절염 및 각종 왕비尪痹를 치료하는 처방","meta":{"주요 적응증":"류마티스 관절염","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":154,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 2-16 오등견비음五藤蠲痹飮의 모듈 구성<\/p><h4>①청열해독淸熱解毒, 이습통락利濕通絡 모듈 — 체내에 울체된 열독을 제거하고 습사를 제거하여 경락을 소통시키고 비증을 완화함<\/h4><p><b>인동등, 낙석등<\/b>: 열독을 식히고 습사를 제거하며 경락을 소통시켜 비증을 다스림<\/p><h4>②거풍습祛風濕, 통락지통通絡止痛 모듈 — 풍습을 제거하고 혈행을 원활하게 하여 관절의 통증을 완화함<\/h4><p><b>청풍등, 위령선<\/b>: 풍습을 제거하고 경락의 기혈 정체를 풀어 경락을 소통시키고 통증을 완화함 계혈등, 해풍등: 혈을 보하고 혈행을 활발하게 하여 경락을 소통시키고 풍습비통風濕痹痛을 완화함<\/p><h4>③보조거풍輔助祛風, 수척지통搜剔止痛 모듈 — 풍습을 제거하고 충류 약물의 수척搜剔 작용을 활용하여 경락 깊숙이 침입한 사기를 제거하고 통증을 완화함<\/h4><p><b>진교, 희렴초<\/b>: 풍습을 제거하고 열을 식혀 비증으로 인한 관절의 통증과 불편을 완화함 노봉방, 전갈: 독을 풀고 수척搜剔 작용으로 경락 깊숙이 침입한 사기를 제거하여 통락지통通絡止痛 작용을 강화함<\/p><h4>④이습도체利濕導滯, 인경引經 모듈 — 습사를 제거하고 약력을 병변 부위로 이끔<\/h4><p><b>상지<\/b>: 습사를 제거하여 비증痹證을 다스리고 약력을 상반신과 사지 말단으로 이끌어 치료 작용을 보조함<\/p>"},{"k":"master","t":"류쭈이의 비증 치료","html":"<h4>①병인병기 이론<\/h4><p><b>질환의 범주<\/b>: 본 병은 중의학의 ‘왕비尪痹’, ‘역절병歷節病’, ‘통풍병痛風病’ 등의 범주에 속하며, 양의학의 만성 침식성 관절염을 특징으로 하는 자가면역질환(류마티스 관절염 등)과 유사함 습열독사濕熱毒邪가 병의 핵심: 당唐 이전에는 주로 풍風·한寒·습濕의 삼기잡지三氣雜至를 강조했으나, 대사는 본 병이 실증과 열증이 많으며 ‘습열독사’가 근맥과 관절에 막히는 비조痹阻가 핵심 병기라고 봄. 환자의 체질적 특이성과 내복된 열독이 오래된 습사와 결합하여 병세가 끈질기고 오래감 습독호결濕毒互結과 병리 변화: 습열독사濕熱毒邪가 경근과 기혈을 막아 영기가 통하지 않아 ‘불통즉통’으로 관절 통증이 생기고, 열독熱毒과 습탁濕濁이 훈증하여 관절이 붓고 뜨거우며 붉어짐. 습독이 교결膠結되어 뼈를 손상시키면 굴신이<\/p><p>불리하고, 탁독濁毒이 내온內蘊되어 담과 어혈을 형성하므로 피하 결절이나 관절 변형이 발생함<\/p><h4>②오등견비음의 치료 원칙 및 효능 해설<\/h4><p><b>통위용通爲用과 청열해독淸熱解毒, 이습통락利濕通絡<\/b>: ‘비痹는 폐閉’를 뜻하므로 치료 시 반드시 ‘통通’하는 것을 위주로 삼아야 함. 청열해독과 이습통락을 치법으로 삼아 오등견비음을 구성함 등류藤類 및 동물 약물의 활용: 근골과 경락 사이를 잘 주행하는 등류 약물과 동물 약물을 주로 사용하여 깊숙이 박힌 사기를 제거하는 수척搜剔 작용을 극대화함 한온병용寒溫並用의 묘미: 습은 음사陰邪이므로 약성을 지나치게 차게 쓰면 습사가 응결되어 낫기 어려움. 이에 청열 위주로 하되 온성 약물을 조화롭게 배합하여 부작용 없이 치료 효과를 높임<\/p><h4>③임상 변증 요령 및 가감 주의점<\/h4><p><b>전형적 증후의 변증<\/b>: 관절의 홍종열통紅腫熱痛, 설태황니舌苔黃膩 등이 나타나면 습열증으로 진단함 비전형적 습열증 판별: 관절의 발적이나 발열이 없고 날씨 변화에 따라 통증이 심해지더라도, 뚜렷한 한상寒象이 없다면 습열증으로 판단하여 양통涼通 위주로 접근해야 함. 이때 온통법溫通法을 잘못 쓰면(예: 계지탕 등) 오히려 증상이 가중될 수 있음 합병증 주의: 특히 쇼그렌증후군이 동반된 환자에게는 양통涼通 위주의 치법이 더욱 필수적이며, 온성 약물을 경솔히 가감하여 진액을 손상시키지 않도록 주의함<\/p><h4>④겸증 가감<\/h4><p><b>통증이 심할 때<\/b>: 유향, 몰약을 가미함 조조강직晨僵이 뚜렷할 때: 오초사를 가미함 관절 변형이 있을 때: 담남성, 法반하, 토별충을 가미함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">류마티스 관절염 대상 등류藤類 약재 처방으로 공개자료상 제품·특허가 확인되지 않아, 익신견비환과 비교해 경증 환자용 위치를 검토할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 류팡,뤄싱,샹밍,등.류쭈이의 청열해독이습법에 따른 류마티스 관절염 치료 경험劉祖貽淸熱解毒利濕法治療類風濕關節炎經驗[J].상하이중의약잡지上海中醫藥雜志,2014, 48(4):1-4.<\/li><li class=\"ref\">[2] 마커,저우성창,추쓰쥔,등.데이터 마이닝에 기반한 국의대사 류쭈이의 류마티스 관절염 치료 용약 규율 연구基於數據挖掘的國醫大師劉祖貽治療類風濕關節炎用藥規律研究[J].후난중의약대학학보湖南中醫藥大學學報,2019,39(1):11-15.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"인동등30g","name":"인동등","dose":"30g","base":"인동등"},{"raw":"낙석등30g","name":"낙석등","dose":"30g","base":"낙석등"},{"raw":"계혈등15g","name":"계혈등","dose":"15g","base":"계혈등"},{"raw":"해풍등15g","name":"해풍등","dose":"15g","base":"해풍등"},{"raw":"청풍등30g","name":"청풍등","dose":"30g","base":"청풍등"},{"raw":"위령선威靈仙30g","name":"위령선威靈仙","dose":"30g","base":"위령선"},{"raw":"진교秦艽10g","name":"진교秦艽","dose":"10g","base":"진교"},{"raw":"희렴초豨薟草10g","name":"희렴초豨薟草","dose":"10g","base":"희렴초"},{"raw":"노봉방10g","name":"노봉방","dose":"10g","base":"노봉방"},{"raw":"전갈10g","name":"전갈","dose":"10g","base":"전갈"},{"raw":"상지桑枝15g","name":"상지桑枝","dose":"15g","base":"상지"}],"notes":[],"핵심 효능":["체내에 울체된 열독을 식히고 해독하여 관절의 홍종열통紅腫熱痛과 염증 반응을 가라앉힘 (청열해독淸熱解毒)","점체黏滯하기 쉬운 습사濕邪를 거두어내고 경락과 관절 깊이 정체된 기혈을 소통시킴(이습통락利濕通絡)"],"주치증":["류마티스 관절염, 왕비尪痹, 각종 관절 종통, 조조강직, 관절 변형 및 기능 장애 등"],"연구 확장 영역":["자가면역질환, 류마티스성 관절염, 만성 염증성 관절 질환, 결합조직 질환 등"],"R&D 포인트":["인동등, 낙석등, 청풍등, 해풍등 등 등류藤類 약물의 근맥·관절 친화성 및 항염증·면역 조절 기전 분석","노봉방, 전갈 등 동물성 약물의 수척搜剔 작용이 난치성 관절 종통 및 변형 완화에 미치는 영향 연구","청열리습 위주의 한량寒涼한 약성과 온성 약물의 배합이 비증 치료의 안전성과 유효성에 미치는 시너지 효과 검증"]},"modules":[{"name":"①청열해독 · 이습통락","hz":"淸熱解毒 · 利濕通絡","herbs":["인동등","낙석등"],"role":"체내에 울체된 열독을 제거하고 습사를 제거하여 경락을 소통시키고 비증을 완화함"},{"name":"②거풍습 · 통락지통","hz":"祛風濕 · 通絡止痛","herbs":["청풍등","위령선","계혈등","해풍등"],"role":"풍습을 제거하고 혈행을 원활하게 하여 관절의 통증을 완화함"},{"name":"③보조거풍 · 수척지통","hz":"輔助祛風 · 搜剔止痛","herbs":["진교","희렴초","노봉방","전갈"],"role":"풍습을 제거하고 충류 약물의 수척搜剔작용을 활용하여 경락 깊숙이 침입한 사기를 제거하고 통증을 완화함"},{"name":"④이습도체 · 인경","hz":"利濕導滯 · 引經","herbs":["상지"],"role":"습사를 제거하고 약력을 병변 부위로 이끔"}],"rd":[{"tag":"Damp-heat RA","title":"습열형 류마티스 관절염 활동기 보조 치료","html":"<p>청열해독이습법에 따른 류마티스 관절염 치료 경험과 데이터 마이닝 연구가 있음 활동기 환자에서 DAS28과 CRP·ESR을 지표로 한 표준치료 병용 탐색 임상이 출발점이며, DMARD 등 표준 치료는 임의로 중단·감량하지 않음 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2014, 청열해독이습법), [2](데이터 마이닝 용약 규율))<\/p>"},{"tag":"Vine Herbs","title":"청풍등(시노메닌) 등 등류 약재의 항관절염 기여","html":"<p>5종 등류 약재 중 청풍등은 항류마티스 성분 시노메닌(sinomenine)을 함유한 것으로 알려져 있음 청풍등 포함 여부에 따른 효과 차이를 구성 약재 제거 실험으로 확인하여 표준화 지표성분을 정함 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&amp;D 논리 1)<\/p>"},{"tag":"Insect Herbs","title":"전갈·노봉방의 진통 기여와 적정 용량","html":"<p>전갈 10g·노봉방 10g 등 충류 약재의 ‘수척지통’ 효과를 관절염 통증 모델에서 구성 약재 제거 실험으로 비교함 진통 기여도와 적정 용량을 확인하고, 장기 복용 시 간·신장 기능과 과민 반응을 함께 확인 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&amp;D 논리 2 「수척지통과 충류 활용」)<\/p>"},{"tag":"Cold–Warm Balance","title":"한온병용 배합의 위장 안전성","html":"<p>청열 위주 처방에 온성 약재를 섞은 한온병용 구조가 위장 부작용을 줄이는지가 핵심 질문임 복약 중 위장 증상과 순응도를 비교하여 배합 근거를 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「한온병용의 묘미와 안전성」)<\/p>"}],"logic":[{"n":"1","title":"청열해독과 이습통락","body":"열독을 식히고 습을 거두어 경락과 관절을 소통시킴"},{"n":"2","title":"수척지통搜剔止痛과 충류 활용","body":"깊숙이 박힌 사기를 샅샅이 뒤져 관절 종통과 변형을 해소함"},{"n":"3","title":"한온병용의 묘미와 안전성","body":"습열증에 청열 위주로 하되 온성 약물을 조화롭게 배합하여 부작용을 방지함"},{"n":"4","title":"습열독사濕熱毒邪 비조痹阻의 병기 제어","body":"왕비尪痹와 류마티스 관절염의 병태를 다스려 경락의 기혈 소통을 회복함"}],"field":2,"pages":[154,157],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["2-16","오등견비음","五藤蠲痹飮","","류쭈이","劉祖貽","습열독사濕熱毒邪가 근맥과 관절骨節을 비조痹阻하는 병기를 다스려, 류마티스 관절염 및 각종 왕비尪痹를 치료하는 처방","인동등30g 낙석등30g 계혈등15g 해풍등15g 청풍등30g 위령선威靈仙30g 진교秦艽10g 희렴초豨薟草10g 노봉방10g 전갈10g 상지桑枝15g","","핵심 효능 체내에 울체된 열독을 식히고 해독하여 관절의 홍종열통紅腫熱痛과 염증 반응을 가라앉힘 (청열해독淸熱解毒) 점체黏滯하기 쉬운 습사濕邪를 거두어내고 경락과 관절 깊이 정체된 기혈을 소통시킴(이습통락利濕通絡)","주치증 류마티스 관절염, 왕비尪痹, 각종 관절 종통, 조조강직, 관절 변형 및 기능 장애 등","연구 확장 영역 자가면역질환, 류마티스성 관절염, 만성 염증성 관절 질환, 결합조직 질환 등","R&D 포인트 인동등, 낙석등, 청풍등, 해풍등 등 등류藤類 약물의 근맥·관절 친화성 및 항염증·면역 조절 기전 분석 노봉방, 전갈 등 동물성 약물의 수척搜剔 작용이 난치성 관절 종통 및 변형 완화에 미치는 영향 연구 청열리습 위주의 한량寒涼한 약성과 온성 약물의 배합이 비증 치료의 안전성과 유효성에 미치는 시너지 효과 검증","①청열해독 · 이습통락 淸熱解毒 · 利濕通絡 인동등 낙석등 체내에 울체된 열독을 제거하고 습사를 제거하여 경락을 소통시키고 비증을 완화함","②거풍습 · 통락지통 祛風濕 · 通絡止痛 청풍등 위령선 계혈등 해풍등 풍습을 제거하고 혈행을 원활하게 하여 관절의 통증을 완화함","③보조거풍 · 수척지통 輔助祛風 · 搜剔止痛 진교 희렴초 노봉방 전갈 풍습을 제거하고 충류 약물의 수척搜剔작용을 활용하여 경락 깊숙이 침입한 사기를 제거하고 통증을 완화함","④이습도체 · 인경 利濕導滯 · 引經 상지 습사를 제거하고 약력을 병변 부위로 이끔","청열해독과 이습통락 열독을 식히고 습을 거두어 경락과 관절을 소통시킴","수척지통搜剔止痛과 충류 활용 깊숙이 박힌 사기를 샅샅이 뒤져 관절 종통과 변형을 해소함","한온병용의 묘미와 안전성 습열증에 청열 위주로 하되 온성 약물을 조화롭게 배합하여 부작용을 방지함","습열독사濕熱毒邪 비조痹阻의 병기 제어 왕비尪痹와 류마티스 관절염의 병태를 다스려 경락의 기혈 소통을 회복함","Damp-heat RA 습열형 류마티스 관절염 활동기 보조 치료 청열해독이습법에 따른 류마티스 관절염 치료 경험과 데이터 마이닝 연구가 있음 활동기 환자에서 DAS28과 CRP·ESR을 지표로 한 표준치료 병용 탐색 임상이 출발점이며, DMARD 등 표준 치료는 임의로 중단·감량하지 않음 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2014, 청열해독이습법), [2](데이터 마이닝 용약 규율))","Vine Herbs 청풍등(시노메닌) 등 등류 약재의 항관절염 기여 5종 등류 약재 중 청풍등은 항류마티스 성분 시노메닌(sinomenine)을 함유한 것으로 알려져 있음 청풍등 포함 여부에 따른 효과 차이를 구성 약재 제거 실험으로 확인하여 표준화 지표성분을 정함 (근거 유형: 간접 근거 | 근거: 본문 조성표, R&D 논리 1)","Insect Herbs 전갈·노봉방의 진통 기여와 적정 용량 전갈 10g·노봉방 10g 등 충류 약재의 ‘수척지통’ 효과를 관절염 통증 모델에서 구성 약재 제거 실험으로 비교함 진통 기여도와 적정 용량을 확인하고, 장기 복용 시 간·신장 기능과 과민 반응을 함께 확인 (근거 유형: 신규 연구가설 | 근거: 본문 조성표, R&D 논리 2 「수척지통과 충류 활용」)","Cold–Warm Balance 한온병용 배합의 위장 안전성 청열 위주 처방에 온성 약재를 섞은 한온병용 구조가 위장 부작용을 줄이는지가 핵심 질문임 복약 중 위장 증상과 순응도를 비교하여 배합 근거를 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「한온병용의 묘미와 안전성」)"],"ss":{"composition":"그림 2-16 오등견비음五藤蠲痹飮의 모듈 구성 ①청열해독淸熱解毒, 이습통락利濕通絡 모듈 — 체내에 울체된 열독을 제거하고 습사를 제거하여 경락을 소통시키고 비증을 완화함 인동등, 낙석등 : 열독을 식히고 습사를 제거하며 경락을 소통시켜 비증을 다스림 ②거풍습祛風濕, 통락지통通絡止痛 모듈 — 풍습을 제거하고 혈행을 원활하게 하여 관절의 통증을 완화함 청풍등, 위령선 : 풍습을 제거하고 경락의 기혈 정체를 풀어 경락을 소통시키고 통증을 완화함 계혈등, 해풍등: 혈을 보하고 혈행을 활발하게 하여 경락을 소통시키고 풍습비통風濕痹痛을 완화함 ③보조거풍輔助祛風, 수척지통搜剔止痛 모듈 — 풍습을 제거하고 충류 약물의 수척搜剔 작용을 활용하여 경락 깊숙이 침입한 사기를 제거하고 통증을 완화함 진교, 희렴초 : 풍습을 제거하고 열을 식혀 비증으로 인한 관절의 통증과 불편을 완화함 노봉방, 전갈: 독을 풀고 수척搜剔 작용으로 경락 깊숙이 침입한 사기를 제거하여 통락지통通絡止痛 작용을 강화함 ④이습도체利濕導滯, 인경引經 모듈 — 습사를 제거하고 약력을 병변 부위로 이끔 상지 : 습사를 제거하여 비증痹證을 다스리고 약력을 상반신과 사지 말단으로 이끌어 치료 작용을 보조함","master":"①병인병기 이론 질환의 범주 : 본 병은 중의학의 ‘왕비尪痹’, ‘역절병歷節病’, ‘통풍병痛風病’ 등의 범주에 속하며, 양의학의 만성 침식성 관절염을 특징으로 하는 자가면역질환(류마티스 관절염 등)과 유사함 습열독사濕熱毒邪가 병의 핵심: 당唐 이전에는 주로 풍風·한寒·습濕의 삼기잡지三氣雜至를 강조했으나, 대사는 본 병이 실증과 열증이 많으며 ‘습열독사’가 근맥과 관절에 막히는 비조痹阻가 핵심 병기라고 봄. 환자의 체질적 특이성과 내복된 열독이 오래된 습사와 결합하여 병세가 끈질기고 오래감 습독호결濕毒互結과 병리 변화: 습열독사濕熱毒邪가 경근과 기혈을 막아 영기가 통하지 않아 ‘불통즉통’으로 관절 통증이 생기고, 열독熱毒과 습탁濕濁이 훈증하여 관절이 붓고 뜨거우며 붉어짐. 습독이 교결膠結되어 뼈를 손상시키면 굴신이 불리하고, 탁독濁毒이 내온內蘊되어 담과 어혈을 형성하므로 피하 결절이나 관절 변형이 발생함 ②오등견비음의 치료 원칙 및 효능 해설 통위용通爲用과 청열해독淸熱解毒, 이습통락利濕通絡 : ‘비痹는 폐閉’를 뜻하므로 치료 시 반드시 ‘통通’하는 것을 위주로 삼아야 함. 청열해독과 이습통락을 치법으로 삼아 오등견비음을 구성함 등류藤類 및 동물 약물의 활용: 근골과 경락 사이를 잘 주행하는 등류 약물과 동물 약물을 주로 사용하여 깊숙이 박힌 사기를 제거하는 수척搜剔 작용을 극대화함 한온병용寒溫並用의 묘미: 습은 음사陰邪이므로 약성을 지나치게 차게 쓰면 습사가 응결되어 낫기 어려움. 이에 청열 위주로 하되 온성 약물을 조화롭게 배합하여 부작용 없이 치료 효과를 높임 ③임상 변증 요령 및 가감 주의점 전형적 증후의 변증 : 관절의 홍종열통紅腫熱痛, 설태황니舌苔黃膩 등이 나타나면 습열증으로 진단함 비전형적 습열증 판별: 관절의 발적이나 발열이 없고 날씨 변화에 따라 통증이 심해지더라도, 뚜렷한 한상寒象이 없다면 습열증으로 판단하여 양통涼通 위주로 접근해야 함. 이때 온통법溫通法을 잘못 쓰면(예: 계지탕 등) 오히려 증상이 가중될 수 있음 합병증 주의: 특히 쇼그렌증후군이 동반된 환자에게는 양통涼通 위주의 치법이 더욱 필수적이며, 온성 약물을 경솔히 가감하여 진액을 손상시키지 않도록 주의함 ④겸증 가감 통증이 심할 때 : 유향, 몰약을 가미함 조조강직晨僵이 뚜렷할 때: 오초사를 가미함 관절 변형이 있을 때: 담남성, 法반하, 토별충을 가미함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 류마티스 관절염 대상 등류藤類 약재 처방으로 공개자료상 제품·특허가 확인되지 않아, 익신견비환과 비교해 경증 환자용 위치를 검토할 수 있음 참고문헌 [1] 류팡,뤄싱,샹밍,등.류쭈이의 청열해독이습법에 따른 류마티스 관절염 치료 경험劉祖貽淸熱解毒利濕法治療類風濕關節炎經驗[J].상하이중의약잡지上海中醫藥雜志,2014, 48(4):1-4. [2] 마커,저우성창,추쓰쥔,등.데이터 마이닝에 기반한 국의대사 류쭈이의 류마티스 관절염 치료 용약 규율 연구基於數據挖掘的國醫大師劉祖貽治療類風濕關節炎用藥規律研究[J].후난중의약대학학보湖南中醫藥大學學報,2019,39(1):11-15."}},{"id":"3-1","ko":"황기복방","hz":"黃芪複方","alias":"","master_ko":"장징성","master_hz":"張靜生","tagline":"비신휴허脾腎虧虛를 다스려 온보비신溫補脾腎, 익기승양益氣升陽으로 중증근무력증을 치료하는 처방","meta":{"주요 적응증":"중증근무력증","확인된 연구자료 유형":"연구 축적 (논문 26편)","제형·제품화":"원내제제·신약 허가 신청 진행 (공시 기준)"},"page":159,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-1 황기복방黃芪複方(복방황기과립)의 모듈 구성<\/p><h4>①보기건비補氣健脾 모듈 — 비위의 기를 보하여 후천지본을 북돋움<\/h4><p><b>황기, 백출<\/b>: 대량의 황기를 군약으로 삼아 비위를 크게 보하고 기혈 생화의 원천을 충실히 하며, 백출을 배오하여 건비익기健脾益氣하고 운화 기능을 도모함<\/p><h4>②자보간신滋補肝腎 모듈 — 간신을 자양하여 선천지본을 보충함<\/h4><p><b>구기자, 하수오<\/b>: 간신과 정혈을 자양하여 후천지기의 생화를 돕고 선천의 정기를 보익하며 근골을 자양함<\/p><h4>③건비행기健脾行氣, 승양거함升陽擧陷 모듈 — 비위를 튼튼하게 하고 기기를 소통시켜 양기를 끌어올림<\/h4><p><b>지각, 승마<\/b>: 승마는 양기를 끌어올려 안검하수眼瞼下垂와 중기하함中氣下陷을 개선하고, 지각은 행기소통行氣疏通하여 보기약물의 배합으로 인한 기체氣滯를 방지함<\/p>"},{"k":"master","t":"장징성의 중증근무력증 치료","html":"<h4>①기본병기는 비신휴허脾腎虧虛<\/h4><p>대사는 기본병기를 비신휴허脾腎虧虛로 봄. 선천적으로 허약하거나 과로, 음식부절 등으로 비위와 신을 손상한 상태에서 외사外邪가 다시 침입하면 근맥筋脈이 영양을 잃어 발병함<\/p><p>비기허脾氣虛하면 기혈의 생성과 운화가 부족해지고, 기육이 영양을 잃어 사지무력과 안검하수가 나타남. 특히 비주승청脾主升淸의 기능이 약해지면 상안검을 들어 올리는 힘이 부족해져 하수下垂가 발생<\/p><p>신정신기腎精腎氣가 부족하면 두경부의 무력, 요슬산연腰膝酸軟, 시기視歧, 연하기능, 호흡기능의 저하 등이 나타남<\/p><p>비와 신은 생리적으로 상호자생相互資生하고 병리적으로 상호영향을 미치므로, 비허脾虛가 오래되면 신을 손상하고 신허腎虛 역시 비양脾陽의 운화를 약화시킴. 결국 비신양허脾腎兩虛에서 기혈부족氣血不足, 기육실양肌肉失養을 거쳐 근위무력筋痿無力으로 이어짐<\/p><h4>②온보비신溫補脾腎, 익기승양益氣升陽의 치료원칙<\/h4><p><b>비신쌍보脾腎雙補로 본本을 치료<\/b>: 후천의 비위와 선천의 신양·신음은 상호 자생하므로, 기본방인 황기복방을 통해 비위와 간신을 함께 다스려 근본적인 치료를 도모함<\/p><p><b>승양거함升陽擧陷의 응용<\/b>: 승마와 황기를 배합하여 아래로 처진 양기를 끌어올림<\/p><h4>③황기복방의 가감 활용<\/h4><p><b>안부眼部증상<\/b>: 안부의 건삽乾澁에는 국화15g, 상엽15g을 가미; 바람맞을 때 눈물이 나오면 국화15g, 목적木賊15g을 가미; 사물이 모호하게 보일 때는 간양풍열肝陽風熱이 원인이면 곡정초10g, 밀몽화10g을 가미하고, 간신부족肝腎不足이 원인이면 자질려15g, 사원자15g을 가미; 빛을 싫어하고 눈부심에는 자질려15g, 목적15g을 가미; 결막 충혈에는 하고초30g, 충울자茺蔚子15g을 가미; 안구 운동 제한이 있으면 자질려15g, 충울자15g을 가미<\/p><p><b>구인口咽증상<\/b>: 저작咀嚼 및 연하곤란은 대부분 위음휴허胃陰虧虛가 원인이며 목과30g, 길경15g을 가미; 만약 위음이 크게 손상되어 설면이 광홍光紅하고 설태가 적거나 무태無苔이면 오매15g을 더 추가; 구음장애에는 석창포15g, 원지15g을 가미하고, 목소리가 쉬거나 인부통증이 있을 때는 가자訶子10g, 길경15g을 추가; 호흡곤란이 있고 흉민기단胸悶氣短을 동반할 때는 배보종기培補宗氣와 동시에 조창기기調暢氣機하며, 가벼울 때는 불수10g, 향연香櫞10g을 가미하고, 중할 때는 소자蘇子15g, 상백피15g을 가미<\/p><p><b>몸통의 증상<\/b>: 경부頸部가 무력하여 고개를 쳐들기 힘들 때는 갈근25g, 위령선25g을 가미; 상지上肢의 무력에는 상지桑枝25g, 계지15g을 가미; 상지의 통증이 동반되었다면 강활10g, 편강황片薑黃10g을 가미; 하지下肢의 무력에는 희렴초豨薟草20g, 해동피15g을 가미; 통증이 동반되면 신근초伸筋草15g, 목과30g, 독활10g을 가미; 지체肢體의 경련이 있을 때는 生백작약30g, 炙감초10g, 목과30g을 가미; 요슬산연腰膝酸軟을 동반하면 두충25g, 우슬25g을 가미; 허리통증에는 상기생25g, 속단25g, 구척25g을 가미; 견배肩背통증을 동반하면 강활10g, 국화20g을 가미; 설태가 황니黃膩하고 습열온결濕熱蘊結에 의해 초래된 몸통근육의 증상에는 의이인30g, 백화사설초30g을 배오하여 청리습열淸利濕熱<\/p><p><b>구병입락久病入絡의 증상<\/b>: 안부의 어조瘀阻로 나타나는 사시斜視에는 자질려15g, 강잠10g을 가미; 시기視歧를 동반할 때는 전갈3g, 오공 1마리를 가미; 구인口咽의 어조로 나타나는 구음장애와 연하곤란에는 강잠10g, 오매15g, 길경15g을 가미; 지체의 경락어조로 나타나는 지체의 마목과 통증에는 계혈등, 낙석등, 청풍등, 해풍등, 야교등, 위령선 등 등류藤類약물을 배오<\/p><p><b>기타 증상<\/b>: 위완창만胃脘脹滿에는 대복피15g, 후박15g을 가미; 위완의 통증에는 백합30g, 오약10g을 가미하거나 단삼음丹蔘飮을 사용; 대변이 묽을 때는 연자육25g, 산약25g을 가미; 습열濕熱이 있어서 설태가 황니黃膩하면 곽향10g, 패란10g을 가미; 방광이 무력하여 소변이 빈번하면 축천환縮泉丸을 배오; 불면과 다몽多夢에는 산조인25g, 야교등30g을 가미하거나, 석창포15g, 원지15g을 가미하거나, 生용골30g, 生모려30g을 가미<\/p><p><b>소아의 용약<\/b>: 소아 중증근무력증 환자도 병기는 비신휴손脾腎虧損임. 그러나 소아는 비상부족脾常不足하기 때문에 종종 식체食滯를 동반하므로 焦삼선, 계내금, 내복자, 焦빈랑 등의 소식도체消食導滯 약물을 가미하고, 炒백출을 가미하여 건비치본健脾治本함. 또한 소아 식적食積은 쉽게 화열化熱하기 때문에 치료에 포공영, 연교를 배오함. 소아 환자는 황기복방에 2-3종의 소도消導약물을 가미하는데 용량은 성인 용량의 1/5 정도<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모 및 정량적 위상<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 26 편 발표<\/td><td>최근 5 년간 10편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">결장직장암<\/span> <span class=\"kw\">메산지움 세포 노화<\/span> <span class=\"kw\">철결핍성 빈혈<\/span> <span class=\"kw\">산후 요통<\/span> <span class=\"kw\">류마티스 관절염<\/span><\/td><td>대장암, 당뇨병성 신증, 빈혈, 산후 통증 등 다각도 효능 검증을 통한 적응증 확장 전략 추진<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">중약 이온 도입<\/span> <span class=\"kw\">외치법 병용<\/span> <span class=\"kw\">기혈휴허氣血虧虛형 보조 치료<\/span><\/td><td>중약 외치법 및 물리치료과의 결합을 통한 산후 및 만성 통증 질환의 치료 효율 향상<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">Sirt1/Foxo1 경로<\/span> <span class=\"kw\">산화 스트레스<\/span> <span class=\"kw\">세포 사멸<\/span> <span class=\"kw\">Hcy 유도 RCMECs 손상<\/span><\/td><td>혈관 내피 손상 보호 및 세포 노화·사멸 억제 메커니즘 중심의 객관적 정량 지표 확보<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">반응표면분석법<\/span> <span class=\"kw\">농축 엑스·정제 제조 공정 제형 최적화<\/span> <span class=\"kw\">시험 검체 용액 조제 최적화<\/span> <span class=\"kw\">네트워크 약리학<\/span><\/td><td>제형 품질 표준화 및 제제 공정 최적화를 통한 제제 기술 고도화와 멀티 타깃 기전 규명<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2023년 최신 연구)<\/h4><p class=\"row\">Sirt1/Foxo1 경로 통한 항노화 기전 <b>2023, 孫嘉澤<\/b><\/p><p>Sirt1/Foxo1 신호전달경로 관련 단백질 발현을 상향 조절하여 고당(High Glucose) 환경으로 유도된 활성산소(ROS) 축적 및 세포주기 정체를 억제함으로써 사구체 메산지움 세포(RMC)의 노화를 지연시킴<\/p><p><b>의미<\/b> 황기복방과립(黃芪複方顆粒)이 산화 스트레스를 완화하고 Sirt1/Foxo1 경로를 조절하여 신장 세포 노화를 억제하는 분자 기전을 세포 실험에서 제시함<\/p><p class=\"row\">미토콘드리아 보호 및 초기 당뇨병성 신증 임상 효과 <b>2023, 張曉彤<\/b><\/p><p>세포 실험에서 미토콘드리아 막전위를 상향 조절하고 ROS 생성을 줄여 세포 노화를 지연시켰으며, 임상적으로 비장-신장 양허 및 혈어형(脾腎兩虛兼血瘀型) 초기 당뇨병성 신증 환자의 증상 개선 및 소변 알부민-크레아티닌 비율(UACR)을 유의하게 낮춤<\/p><p><b>의미<\/b> 미토콘드리아 손상 개선을 통한 항산화 기전을 비임상 모델에서 제시하고, 초기 당뇨병성 신증 환자에서 UACR 감소가 보고됨(말기 신질환 진행 지연은 확인되지 않음)<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>장징성 처방은 랴오닝성중의원遼寧省中醫院의 원내제제(복방황기과립, 원명 황기복방)로 오래 쓰였고, 다기관 무작위 이중맹검 위약대조 임상과 신약 전임상 연구를 거쳐 기업에 기술이전되어 신약 허가를 신청 중이라는 공시 자료가 있음[7]. 같은 조성(황기·구기자·하수오·백출·지각·승마)의 특허는 랴오닝중의약대학 명의로 2011년 등록되었고 2018년 후베이닝캉약업湖北寧康藥業에 권리가 이전됨[6]. 허가 중성약·신약 임상 등록(CTR)은 공개 DB에서 확인되지 않음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">원내제제에서 기업 기술이전·신약 신청 단계까지 진행된 처방이므로 중국 내 허가 동향을 계속 확인해야 하며, 국내는 하수오 간독성 관리 기준과 지표성분 표준화를 포함한 제제·용도 연구로 접근하는 것이 현실적. 국내 공정서(약전· 규격집)에 없는 태자삼이 포함된 과립 조성은 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 구샤오위.장징성 교수의 Ⅰ·Ⅱ형 중증근무력증 치료 임상 경험 총결張靜生教授治療Ⅰ、Ⅱ型重症肌無力的臨床經驗總結[D].랴오닝중의약대학遼寧中醫藥大學,2012.<\/li><li class=\"ref\">[2] 류후이우,이퉁닝,장징성.장징성의 중증근무력증 치료 경험 소개張靜生治療重症肌無力經驗介紹[J].중국중의약정보잡지中國中醫藥信息雜志,2006,(10):85-86.<\/li><li class=\"ref\">[3] 장후이융,렁진훙,셰웨이펑,등.장징성의 중증근무력증 임상 경험과 용약 분석張靜生治療重症肌無力臨證經驗與用藥分析[J].중화중의약학간中華中醫藥學刊,2020,38(12):27-30.<\/li><li class=\"ref\">[4] 쑨자쩌. Sirt1/Foxo1 경로에 기반한 황기복방과립의 고당 유도 신사구체간질세포 노화 억제 작용 및 기전 연구基於Sirt1/Foxo1通路探討黃芪複方顆粒抗高糖誘導腎系膜細胞衰老的作用和機制研究[D].랴오닝중의약대학遼寧中醫藥大學,2023.<\/li><li class=\"ref\">[5] 장샤오퉁. 산화스트레스에 기반한 황기복방과립의 고당 유도 신사구체간질세포 노화 억제 작용 및 기전 연구基於氧化應激探討黃芪複方顆粒抗高糖誘導腎系膜細胞衰老的作用及機制研究[D].랴오닝중의약대학遼寧中醫藥大學,2023.<\/li><li class=\"ref\">[6] 장징성張靜生.중증근무력증을 치료하는 중약 및 생산방법一種治療重症肌無力的中藥及其生產方法:CN101007112A[P/OL].<a href=\"https://patents.google.com/patent/CN101007112A.\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/CN101007112A.<\/a><\/li><li class=\"ref\">[7] 랴오닝중의약대학 부속병원遼寧中醫藥大學附屬醫院.국가과학기술진보상 추천 공시 자료: 비신허손 이론에 따른 중증근무력증 치료 연구(복방황기 제제)[E B/OL].<a href=\"https://www.lntcm.com.cn/__local/E/27/B0/15ED9825D1846AD443F997296B1_44A9AE5B_1C400.doc.\" target=\"_blank\" rel=\"noopener\">https://www.lntcm.com.cn/__local/E/27/B0/15ED9825D1846AD443F997296B1_44A9AE5B_1C400.doc.<\/a><\/li><\/ol>"}],"identity":{"herbs":[{"raw":"황기50~60g","name":"황기","dose":"50~60g","base":"황기"},{"raw":"구기자15~20g","name":"구기자","dose":"15~20g","base":"구기자"},{"raw":"하수오15~20g","name":"하수오","dose":"15~20g","base":"하수오"},{"raw":"백출15~20g","name":"백출","dose":"15~20g","base":"백출"},{"raw":"지각15~20g","name":"지각","dose":"15~20g","base":"지각"},{"raw":"승마10~12g","name":"승마","dose":"10~12g","base":"승마"}],"notes":["※황기복방 조성은 3개 버전이 존재함. 본 조성은 발명특허 당시의 조성임. 과립제인 ‘복방황기과립’ 등록 시에는","황기, 당귀, 태자삼, 炒백출, 산수유, 구기자, 하수오, 승마, 방풍, 지각, 익모초 등 11미로 구성되었고, 현재 대사가","진료에 사용하는 기본처방은 황기, 당귀, 산수유, 구기자, 진피, 방풍, 지각, 익모초 등 8미로 구성됨","※ ‘복방황기과립’은 랴오닝성중의원遼寧省中醫院의 원내제제로, 기업에 기술이전되어 신약 허가를 신청 중이라는","공시 자료가 있음(중국 허가 의약품은 아님)"],"핵심 효능":["비위의 운화 기능을 회복시키고 기혈과 원기를 보익하여 비위허손脾胃虛損과 신기휴허腎氣虧虛를 근본적으로 다스림(온보비신溫補脾腎)","청양淸陽을 끌어올리고 경맥과 근육을 자양하여 지체무력肢體無力과 안검하수眼瞼下垂 등의 증상을 개선함(익기승양益氣升陽)"],"주치증":["중증근무력증"],"연구 확장 영역":["류마티스 질환, 각종 신경근육계 희귀질환, 만성 난치성 허손 질환 등"],"R&D 포인트":["대량의 황기와 보익補益 약물 배합에 따른 신경근육접합부(NMJ)의 아세틸콜린수용체(AChR) 기능 및 표면 발현·밀도 변화와 관련된 분자 기전 분석","비위허손脾胃虛損 및 신기휴허腎氣虧虛 병기에 따른 자가면역 반응 조절과 아세틸콜린수용체 항체(AChR-Ab) 역가 및 염증성 사이토카인 발현·분비 변화에 대한 기전 검증","장기 투여에 따른 약물 대사 및 안전성 특성을 평가하고, 스테로이드 및 면역억제제 병용 시 약물 사용량 감소 가능성과 제제 최적화 전략을 탐색함"]},"modules":[{"name":"①보기건비","hz":"補氣健脾","herbs":["황기","백출"],"role":"비위의 기를 보하여 후천지본을 북돋움"},{"name":"②자보간신","hz":"滋補肝腎","herbs":["구기자","하수오"],"role":"간신을 자양하여 선천지본을 보충함"},{"name":"③건비행기 · 승양거함","hz":"健脾行氣 · 升陽擧陷","herbs":["지각","승마"],"role":"비위를 튼튼하게 하고 기기를 소통시켜 양기를 끌어올림"}],"rd":[{"tag":"NMJ & Autoimmunity","title":"중증근무력증 실험 근거 확보(EAMG 모델)","html":"<p>중증근무력증에 대한 근거는 임상 경험 정리 위주이고 실험 연구는 신장 세포 노화에 집중되어 있음<\/p><p>본 적응증의 기전 근거를 채우려면 실험적 자가면역 근무력증(EAMG) 모델에서 항AChR 항체와 신경근접합부 AChR 밀도를 직접 확인하는 연구가 가장 시급함<\/p><p><b>검증 설계<\/b> Torpedo AChR 면역 EAMG 랫드에서 임상 점수, 혈청 항AChR 항체, 신경근접합부 AChR 밀도(α-붕가로톡신 염색)를 측정하고 피리도스티그민· 프레드니솔론을 대조로 설정<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [1][2][3](중증근무력증 임상 경험), 본문 R&amp;D 포인트<\/p>"},{"tag":"MG Stability","title":"전신형 중증근무력증의 안정 상태 유지와 스테로이드 감량","html":"<p>‘비신쌍보’를 장기 유지하면서 양약 부작용을 함께 조절한다는 경험을 먼저 악화 위험<\/p><p class=\"li\">·안정 상태 유지와 MG-ADL·QMG로 평가함 안정 상태가 확인된 환자에서만 스테로이드 감량을 2차 목표로 검증하면 같은 적응증의 강기건력음과 구별되는 근거를 만들 수 있음<\/p><p><b>검증 설계<\/b> 스테로이드 복용 중인 안정기 전신형 환자 대상 24주 무작위 대조, 1차 지표는 MG-ADL·QMG와 악화 발생, 2차 지표는 프레드니솔론 감량률<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [3](2020, 임상 경험과 용약 분석), R&amp;D 논리 4<\/p>"},{"tag":"Diabetic Kidney Disease","title":"당뇨병성 신증으로의 적응증 확장","html":"<p>황기복방과립이 고당 환경의 메산지움 세포 노화를 Sirt1/Foxo1 경로와 미토콘드리아 보호로 억제하고 초기 당뇨병성 신증 환자의 단백뇨를 줄였다는 결과가 있음<\/p><p>중증근무력증과 별개의 실질적인 두 번째 적응증 후보로 검토<\/p><p><b>검증 설계<\/b> db/db 생쥐에서 요알부민/크레아티닌비(UACR)와 사구체 세포 노화 지표 (SA-β-gal·p16)를 측정하고, 임상에서는 RAS 차단제 병용 시 UACR 변화를 1차 지표로 설정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [4][5](2023, Sirt1/Foxo1·산화스트레스)<\/p>"},{"tag":"Version Control & Safety","title":"조성 버전 확정과 하수오 간독성 관리","html":"<p>특허 조성, 과립 조성(원내제제), 현재 진료 조성의 3개 버전이 있음<\/p><p>개발 대상 버전을 먼저 확정해야 하며, 하수오는 간손상 보고가 많은 약재이므로 간기능 모니터링 또는 하수오 제외 조성의 동등성 검토가 필요(하수오는 고용량·장기 복용·간질환 병력 등 간독성 위험 조건을 명시)<\/p><p><b>검증 설계<\/b> 버전별 지표성분(아스트라갈로시드 IV 등) 함량과 효력을 비교하고, 하수오 포함 조성은 간독성 반복투여 시험을 우선 실시<\/p><p class=\"row\">근거 <span class=\"chip\">신규 연구가설<\/span> 본문 조성 비고(3개 버전), 「방법론」(반응표면분석법 제형 최적화)<\/p>"}],"logic":[{"n":"1","title":"온보비신溫補脾腎, 익기승양益氣升陽","body":"비위와 신을 크게 보하여 신경근 전달 및 근육 운동력을 회복시킴"},{"n":"2","title":"비신휴허脾腎虧虛, 구병입락久病入絡","body":"비신휴허를 본으로 삼고 오장상관 및 구병입락 병기에 따라 자가면역과 낙맥 어조를 통합 조절함"},{"n":"3","title":"승양거함升陽擧陷, 건비행기健脾行氣","body":"양기를 끌어올리고 보기 약제의 체기를 방지하여 기기를 소통시킴"},{"n":"4","title":"비신쌍보脾腎雙補, 변증가감","body":"치본을 일관되게 유지하면서 비신을 온보하고, 병증 및 연령별 가감을 통해 장기 치료 유효성을 확보함"}],"field":3,"pages":[159,165],"evidence":"연구 축적 (논문 26편)","product":"원내제제·신약 허가 신청 진행(공시 기준)","status":"원내제제·연구용 제제","s":["3-1","황기복방","黃芪複方","","장징성","張靜生","비신휴허脾腎虧虛를 다스려 온보비신溫補脾腎, 익기승양益氣升陽으로 중증근무력증을 치료하는 처방","황기50~60g 구기자15~20g 하수오15~20g 백출15~20g 지각15~20g 승마10~12g","※황기복방 조성은 3개 버전이 존재함. 본 조성은 발명특허 당시의 조성임. 과립제인 ‘복방황기과립’ 등록 시에는 황기, 당귀, 태자삼, 炒백출, 산수유, 구기자, 하수오, 승마, 방풍, 지각, 익모초 등 11미로 구성되었고, 현재 대사가 진료에 사용하는 기본처방은 황기, 당귀, 산수유, 구기자, 진피, 방풍, 지각, 익모초 등 8미로 구성됨 ※ ‘복방황기과립’은 랴오닝성중의원遼寧省中醫院의 원내제제로, 기업에 기술이전되어 신약 허가를 신청 중이라는 공시 자료가 있음(중국 허가 의약품은 아님)","핵심 효능 비위의 운화 기능을 회복시키고 기혈과 원기를 보익하여 비위허손脾胃虛損과 신기휴허腎氣虧虛를 근본적으로 다스림(온보비신溫補脾腎) 청양淸陽을 끌어올리고 경맥과 근육을 자양하여 지체무력肢體無力과 안검하수眼瞼下垂 등의 증상을 개선함(익기승양益氣升陽)","주치증 중증근무력증","연구 확장 영역 류마티스 질환, 각종 신경근육계 희귀질환, 만성 난치성 허손 질환 등","R&D 포인트 대량의 황기와 보익補益 약물 배합에 따른 신경근육접합부(NMJ)의 아세틸콜린수용체(AChR) 기능 및 표면 발현·밀도 변화와 관련된 분자 기전 분석 비위허손脾胃虛損 및 신기휴허腎氣虧虛 병기에 따른 자가면역 반응 조절과 아세틸콜린수용체 항체(AChR-Ab) 역가 및 염증성 사이토카인 발현·분비 변화에 대한 기전 검증 장기 투여에 따른 약물 대사 및 안전성 특성을 평가하고, 스테로이드 및 면역억제제 병용 시 약물 사용량 감소 가능성과 제제 최적화 전략을 탐색함","①보기건비 補氣健脾 황기 백출 비위의 기를 보하여 후천지본을 북돋움","②자보간신 滋補肝腎 구기자 하수오 간신을 자양하여 선천지본을 보충함","③건비행기 · 승양거함 健脾行氣 · 升陽擧陷 지각 승마 비위를 튼튼하게 하고 기기를 소통시켜 양기를 끌어올림","온보비신溫補脾腎, 익기승양益氣升陽 비위와 신을 크게 보하여 신경근 전달 및 근육 운동력을 회복시킴","비신휴허脾腎虧虛, 구병입락久病入絡 비신휴허를 본으로 삼고 오장상관 및 구병입락 병기에 따라 자가면역과 낙맥 어조를 통합 조절함","승양거함升陽擧陷, 건비행기健脾行氣 양기를 끌어올리고 보기 약제의 체기를 방지하여 기기를 소통시킴","비신쌍보脾腎雙補, 변증가감 치본을 일관되게 유지하면서 비신을 온보하고, 병증 및 연령별 가감을 통해 장기 치료 유효성을 확보함","NMJ & Autoimmunity 중증근무력증 실험 근거 확보(EAMG 모델) 중증근무력증에 대한 근거는 임상 경험 정리 위주이고 실험 연구는 신장 세포 노화에 집중되어 있음 본 적응증의 기전 근거를 채우려면 실험적 자가면역 근무력증(EAMG) 모델에서 항AChR 항체와 신경근접합부 AChR 밀도를 직접 확인하는 연구가 가장 시급함 검증 설계 Torpedo AChR 면역 EAMG 랫드에서 임상 점수, 혈청 항AChR 항체, 신경근접합부 AChR 밀도(α-붕가로톡신 염색)를 측정하고 피리도스티그민· 프레드니솔론을 대조로 설정 근거 임상 경험 보고 참고문헌 [1][2][3](중증근무력증 임상 경험), 본문 R&D 포인트","MG Stability 전신형 중증근무력증의 안정 상태 유지와 스테로이드 감량 ‘비신쌍보’를 장기 유지하면서 양약 부작용을 함께 조절한다는 경험을 먼저 악화 위험 ·안정 상태 유지와 MG-ADL·QMG로 평가함 안정 상태가 확인된 환자에서만 스테로이드 감량을 2차 목표로 검증하면 같은 적응증의 강기건력음과 구별되는 근거를 만들 수 있음 검증 설계 스테로이드 복용 중인 안정기 전신형 환자 대상 24주 무작위 대조, 1차 지표는 MG-ADL·QMG와 악화 발생, 2차 지표는 프레드니솔론 감량률 근거 임상 경험 보고 참고문헌 [3](2020, 임상 경험과 용약 분석), R&D 논리 4","Diabetic Kidney Disease 당뇨병성 신증으로의 적응증 확장 황기복방과립이 고당 환경의 메산지움 세포 노화를 Sirt1/Foxo1 경로와 미토콘드리아 보호로 억제하고 초기 당뇨병성 신증 환자의 단백뇨를 줄였다는 결과가 있음 중증근무력증과 별개의 실질적인 두 번째 적응증 후보로 검토 검증 설계 db/db 생쥐에서 요알부민/크레아티닌비(UACR)와 사구체 세포 노화 지표 (SA-β-gal·p16)를 측정하고, 임상에서는 RAS 차단제 병용 시 UACR 변화를 1차 지표로 설정 근거 직접 연구 근거 참고문헌 [4][5](2023, Sirt1/Foxo1·산화스트레스)","Version Control & Safety 조성 버전 확정과 하수오 간독성 관리 특허 조성, 과립 조성(원내제제), 현재 진료 조성의 3개 버전이 있음 개발 대상 버전을 먼저 확정해야 하며, 하수오는 간손상 보고가 많은 약재이므로 간기능 모니터링 또는 하수오 제외 조성의 동등성 검토가 필요(하수오는 고용량·장기 복용·간질환 병력 등 간독성 위험 조건을 명시) 검증 설계 버전별 지표성분(아스트라갈로시드 IV 등) 함량과 효력을 비교하고, 하수오 포함 조성은 간독성 반복투여 시험을 우선 실시 근거 신규 연구가설 본문 조성 비고(3개 버전), 「방법론」(반응표면분석법 제형 최적화)"],"ss":{"composition":"그림 3-1 황기복방黃芪複方(복방황기과립)의 모듈 구성 ①보기건비補氣健脾 모듈 — 비위의 기를 보하여 후천지본을 북돋움 황기, 백출 : 대량의 황기를 군약으로 삼아 비위를 크게 보하고 기혈 생화의 원천을 충실히 하며, 백출을 배오하여 건비익기健脾益氣하고 운화 기능을 도모함 ②자보간신滋補肝腎 모듈 — 간신을 자양하여 선천지본을 보충함 구기자, 하수오 : 간신과 정혈을 자양하여 후천지기의 생화를 돕고 선천의 정기를 보익하며 근골을 자양함 ③건비행기健脾行氣, 승양거함升陽擧陷 모듈 — 비위를 튼튼하게 하고 기기를 소통시켜 양기를 끌어올림 지각, 승마 : 승마는 양기를 끌어올려 안검하수眼瞼下垂와 중기하함中氣下陷을 개선하고, 지각은 행기소통行氣疏通하여 보기약물의 배합으로 인한 기체氣滯를 방지함","master":"①기본병기는 비신휴허脾腎虧虛 대사는 기본병기를 비신휴허脾腎虧虛로 봄. 선천적으로 허약하거나 과로, 음식부절 등으로 비위와 신을 손상한 상태에서 외사外邪가 다시 침입하면 근맥筋脈이 영양을 잃어 발병함 비기허脾氣虛하면 기혈의 생성과 운화가 부족해지고, 기육이 영양을 잃어 사지무력과 안검하수가 나타남. 특히 비주승청脾主升淸의 기능이 약해지면 상안검을 들어 올리는 힘이 부족해져 하수下垂가 발생 신정신기腎精腎氣가 부족하면 두경부의 무력, 요슬산연腰膝酸軟, 시기視歧, 연하기능, 호흡기능의 저하 등이 나타남 비와 신은 생리적으로 상호자생相互資生하고 병리적으로 상호영향을 미치므로, 비허脾虛가 오래되면 신을 손상하고 신허腎虛 역시 비양脾陽의 운화를 약화시킴. 결국 비신양허脾腎兩虛에서 기혈부족氣血不足, 기육실양肌肉失養을 거쳐 근위무력筋痿無力으로 이어짐 ②온보비신溫補脾腎, 익기승양益氣升陽의 치료원칙 비신쌍보脾腎雙補로 본本을 치료 : 후천의 비위와 선천의 신양·신음은 상호 자생하므로, 기본방인 황기복방을 통해 비위와 간신을 함께 다스려 근본적인 치료를 도모함 승양거함升陽擧陷의 응용 : 승마와 황기를 배합하여 아래로 처진 양기를 끌어올림 ③황기복방의 가감 활용 안부眼部증상 : 안부의 건삽乾澁에는 국화15g, 상엽15g을 가미; 바람맞을 때 눈물이 나오면 국화15g, 목적木賊15g을 가미; 사물이 모호하게 보일 때는 간양풍열肝陽風熱이 원인이면 곡정초10g, 밀몽화10g을 가미하고, 간신부족肝腎不足이 원인이면 자질려15g, 사원자15g을 가미; 빛을 싫어하고 눈부심에는 자질려15g, 목적15g을 가미; 결막 충혈에는 하고초30g, 충울자茺蔚子15g을 가미; 안구 운동 제한이 있으면 자질려15g, 충울자15g을 가미 구인口咽증상 : 저작咀嚼 및 연하곤란은 대부분 위음휴허胃陰虧虛가 원인이며 목과30g, 길경15g을 가미; 만약 위음이 크게 손상되어 설면이 광홍光紅하고 설태가 적거나 무태無苔이면 오매15g을 더 추가; 구음장애에는 석창포15g, 원지15g을 가미하고, 목소리가 쉬거나 인부통증이 있을 때는 가자訶子10g, 길경15g을 추가; 호흡곤란이 있고 흉민기단胸悶氣短을 동반할 때는 배보종기培補宗氣와 동시에 조창기기調暢氣機하며, 가벼울 때는 불수10g, 향연香櫞10g을 가미하고, 중할 때는 소자蘇子15g, 상백피15g을 가미 몸통의 증상 : 경부頸部가 무력하여 고개를 쳐들기 힘들 때는 갈근25g, 위령선25g을 가미; 상지上肢의 무력에는 상지桑枝25g, 계지15g을 가미; 상지의 통증이 동반되었다면 강활10g, 편강황片薑黃10g을 가미; 하지下肢의 무력에는 희렴초豨薟草20g, 해동피15g을 가미; 통증이 동반되면 신근초伸筋草15g, 목과30g, 독활10g을 가미; 지체肢體의 경련이 있을 때는 生백작약30g, 炙감초10g, 목과30g을 가미; 요슬산연腰膝酸軟을 동반하면 두충25g, 우슬25g을 가미; 허리통증에는 상기생25g, 속단25g, 구척25g을 가미; 견배肩背통증을 동반하면 강활10g, 국화20g을 가미; 설태가 황니黃膩하고 습열온결濕熱蘊結에 의해 초래된 몸통근육의 증상에는 의이인30g, 백화사설초30g을 배오하여 청리습열淸利濕熱 구병입락久病入絡의 증상 : 안부의 어조瘀阻로 나타나는 사시斜視에는 자질려15g, 강잠10g을 가미; 시기視歧를 동반할 때는 전갈3g, 오공 1마리를 가미; 구인口咽의 어조로 나타나는 구음장애와 연하곤란에는 강잠10g, 오매15g, 길경15g을 가미; 지체의 경락어조로 나타나는 지체의 마목과 통증에는 계혈등, 낙석등, 청풍등, 해풍등, 야교등, 위령선 등 등류藤類약물을 배오 기타 증상 : 위완창만胃脘脹滿에는 대복피15g, 후박15g을 가미; 위완의 통증에는 백합30g, 오약10g을 가미하거나 단삼음丹蔘飮을 사용; 대변이 묽을 때는 연자육25g, 산약25g을 가미; 습열濕熱이 있어서 설태가 황니黃膩하면 곽향10g, 패란10g을 가미; 방광이 무력하여 소변이 빈번하면 축천환縮泉丸을 배오; 불면과 다몽多夢에는 산조인25g, 야교등30g을 가미하거나, 석창포15g, 원지15g을 가미하거나, 生용골30g, 生모려30g을 가미 소아의 용약 : 소아 중증근무력증 환자도 병기는 비신휴손脾腎虧損임. 그러나 소아는 비상부족脾常不足하기 때문에 종종 식체食滯를 동반하므로 焦삼선, 계내금, 내복자, 焦빈랑 등의 소식도체消食導滯 약물을 가미하고, 炒백출을 가미하여 건비치본健脾治本함. 또한 소아 식적食積은 쉽게 화열化熱하기 때문에 치료에 포공영, 연교를 배오함. 소아 환자는 황기복방에 2-3종의 소도消導약물을 가미하는데 용량은 성인 용량의 1/5 정도","rd":"","evidence":"①연구 규모 및 정량적 위상 Total Papers(15yrs) Recent Focus(5yrs) 총 26 편 발표 최근 5 년간 10편 발표 ②연구 키워드로 본 R&D 가이던스(최근 5개년 분석) 구분 핵심 키워드 R&D 인사이트 주치증 결장직장암 메산지움 세포 노화 철결핍성 빈혈 산후 요통 류마티스 관절염 대장암, 당뇨병성 신증, 빈혈, 산후 통증 등 다각도 효능 검증을 통한 적응증 확장 전략 추진 병용 전략 중약 이온 도입 외치법 병용 기혈휴허氣血虧虛형 보조 치료 중약 외치법 및 물리치료과의 결합을 통한 산후 및 만성 통증 질환의 치료 효율 향상 평가 지표 Sirt1/Foxo1 경로 산화 스트레스 세포 사멸 Hcy 유도 RCMECs 손상 혈관 내피 손상 보호 및 세포 노화·사멸 억제 메커니즘 중심의 객관적 정량 지표 확보 방법론 반응표면분석법 농축 엑스·정제 제조 공정 제형 최적화 시험 검체 용액 조제 최적화 네트워크 약리학 제형 품질 표준화 및 제제 공정 최적화를 통한 제제 기술 고도화와 멀티 타깃 기전 규명 ③High-Impact 연구 하이라이트(2023년 최신 연구) Sirt1/Foxo1 경로 통한 항노화 기전 2023, 孫嘉澤 Sirt1/Foxo1 신호전달경로 관련 단백질 발현을 상향 조절하여 고당(High Glucose) 환경으로 유도된 활성산소(ROS) 축적 및 세포주기 정체를 억제함으로써 사구체 메산지움 세포(RMC)의 노화를 지연시킴 의미 황기복방과립(黃芪複方顆粒)이 산화 스트레스를 완화하고 Sirt1/Foxo1 경로를 조절하여 신장 세포 노화를 억제하는 분자 기전을 세포 실험에서 제시함 미토콘드리아 보호 및 초기 당뇨병성 신증 임상 효과 2023, 張曉彤 세포 실험에서 미토콘드리아 막전위를 상향 조절하고 ROS 생성을 줄여 세포 노화를 지연시켰으며, 임상적으로 비장-신장 양허 및 혈어형(脾腎兩虛兼血瘀型) 초기 당뇨병성 신증 환자의 증상 개선 및 소변 알부민-크레아티닌 비율(UACR)을 유의하게 낮춤 의미 미토콘드리아 손상 개선을 통한 항산화 기전을 비임상 모델에서 제시하고, 초기 당뇨병성 신증 환자에서 UACR 감소가 보고됨(말기 신질환 진행 지연은 확인되지 않음)","china":"중국 제품화 현황 장징성 처방은 랴오닝성중의원遼寧省中醫院의 원내제제(복방황기과립, 원명 황기복방)로 오래 쓰였고, 다기관 무작위 이중맹검 위약대조 임상과 신약 전임상 연구를 거쳐 기업에 기술이전되어 신약 허가를 신청 중이라는 공시 자료가 있음[7]. 같은 조성(황기·구기자·하수오·백출·지각·승마)의 특허는 랴오닝중의약대학 명의로 2011년 등록되었고 2018년 후베이닝캉약업湖北寧康藥業에 권리가 이전됨[6]. 허가 중성약·신약 임상 등록(CTR)은 공개 DB에서 확인되지 않음 시사점 원내제제에서 기업 기술이전·신약 신청 단계까지 진행된 처방이므로 중국 내 허가 동향을 계속 확인해야 하며, 국내는 하수오 간독성 관리 기준과 지표성분 표준화를 포함한 제제·용도 연구로 접근하는 것이 현실적. 국내 공정서(약전· 규격집)에 없는 태자삼이 포함된 과립 조성은 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 구샤오위.장징성 교수의 Ⅰ·Ⅱ형 중증근무력증 치료 임상 경험 총결張靜生教授治療Ⅰ、Ⅱ型重症肌無力的臨床經驗總結[D].랴오닝중의약대학遼寧中醫藥大學,2012. [2] 류후이우,이퉁닝,장징성.장징성의 중증근무력증 치료 경험 소개張靜生治療重症肌無力經驗介紹[J].중국중의약정보잡지中國中醫藥信息雜志,2006,(10):85-86. [3] 장후이융,렁진훙,셰웨이펑,등.장징성의 중증근무력증 임상 경험과 용약 분석張靜生治療重症肌無力臨證經驗與用藥分析[J].중화중의약학간中華中醫藥學刊,2020,38(12):27-30. [4] 쑨자쩌. Sirt1/Foxo1 경로에 기반한 황기복방과립의 고당 유도 신사구체간질세포 노화 억제 작용 및 기전 연구基於Sirt1/Foxo1通路探討黃芪複方顆粒抗高糖誘導腎系膜細胞衰老的作用和機制研究[D].랴오닝중의약대학遼寧中醫藥大學,2023. [5] 장샤오퉁. 산화스트레스에 기반한 황기복방과립의 고당 유도 신사구체간질세포 노화 억제 작용 및 기전 연구基於氧化應激探討黃芪複方顆粒抗高糖誘導腎系膜細胞衰老的作用及機制研究[D].랴오닝중의약대학遼寧中醫藥大學,2023. [6] 장징성張靜生.중증근무력증을 치료하는 중약 및 생산방법一種治療重症肌無力的中藥及其生產方法:CN101007112A[P/OL]. https://patents.google.com/patent/CN101007112A. [7] 랴오닝중의약대학 부속병원遼寧中醫藥大學附屬醫院.국가과학기술진보상 추천 공시 자료: 비신허손 이론에 따른 중증근무력증 치료 연구(복방황기 제제)[E B/OL]. https://www.lntcm.com.cn/__local/E/27/B0/15ED9825D1846AD443F997296B1_44A9AE5B_1C400.doc."}},{"id":"3-2","ko":"강기건력음","hz":"强肌健力飮","alias":"","master_ko":"덩톄타오","master_hz":"鄧鐵濤","tagline":"‘비위허손脾胃虛損, 오장상관五臟相關’의 관점에 근거하여 보비익기補脾益氣, 강기건력","meta":{"주요 적응증":"중증근무력증","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":166,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-2 강기건력음强肌健力飮의 모듈 구성<\/p><h4>①보기건비補氣健脾, 승양익기升陽益氣 모듈 — 비위의 허손을 근본적으로 다스림<\/h4><p><b>황기, 오조룡<\/b>: 황기를 대량으로 사용하여 감온대보甘溫大補하고 비기를 북돋우며, ‘남방의 황기南芪’라 부르는 오조룡을 배합하여 보비익폐補脾益肺함<\/p><h4>②보혈양혈補血養血, 보기조원補氣助元 모듈 — 기혈을 함께 보충함<\/h4><p><b>당삼(또는 태자삼), 백출, 당귀<\/b>: 당삼과 백출은 황기를 도와 보기의 기능을 증강시키며, 혈은 기의 어머니라는 원리에 따라 당귀를 사용하여 양혈생기養血生氣를 도모함<\/p><h4>③승양거함升陽擧陷, 이기화중理氣和中 모듈 — 함하陷下된 양기를 끌어올리고 기기의 소통과 중초의 조화를 도모함<\/h4><p><b>승마, 시호, 진피, 감초<\/b>: 승마와 시호는 함하된 양기를 끌어올리고, 진피는 보기약물의 배합으로 발생할 수 있는 기체氣滯를 방지하도록 이기소체理氣消滯하며, 감초는 화중和中하고 여러 약재의 약성을 조화시킴<\/p>"},{"k":"master","t":"덩톄타오의 중증근무력증 치료","html":"<h4>①병인병기 인식<\/h4><p><b>질환의 범주와 특징<\/b>: 중증근무력증은 ‘위병痿病’ 범주에 속하며, 대사는 이를 단순한 허증이 아니라 장기간 지속되어 기능과 형체가 모두 손상된 허손虛損의 병증으로 봄<\/p><p><b>병의 본本은 비위허손脾胃虛損<\/b>: 기본 병기는 비위기허脾胃氣虛이며, 비위가 후천지본後天之本이고 비주기육脾主肌肉하므로 비위의 기가 허하면 기육肌肉을 충분히 자양하지 못하여 안검하수, 사지무력, 연하곤란 등의 증상이 발생한다고 봄<\/p><p><b>허손난복虛損難復<\/b>: 허손은 일반적인 허증보다 회복이 어렵고 병정이 길며 반복되기 쉬우므로 단기간의 치료보다 지속적인 보익을 중시함. 이에 보비익기補脾益氣를 치료의 대법으로 삼고, 치본治本을 일관되게 유지하면서 표증標證을 간헐적으로 치료함<\/p><h4>②보비익기補脾益氣, 강기건력强肌健力의 치료 원칙<\/h4><p><b>보비익기補脾益氣로 본本을 치료<\/b>: 비위허손을 근본 병기로 보고 황기, 당삼, 백출, 오조룡 등으로 비기를 크게 보하여 근육의 기능을 회복시키는 것을 치료의 중심으로 삼음<\/p><p><b>감온익손甘溫益損을 중시<\/b>: 이고李杲의 비위학설과 보중익기탕을 학술적 근거로 삼되, 중증근무력증은 비위허손이 심하므로 일반적인 보중익기탕보다 황기, 인삼 등의 보익력을 강화함. 특히 황기를 중용하는 것은 이고의 ‘비주기육’ 사상과 왕청임王淸任의 황기 중용 경험을 결합한 것임<\/p><p><b>강기건력强肌健力으로 증상을 개선<\/b>: 안검하수, 복시, 사지무력, 교작무력, 연하곤란, 호흡곤란 등 근육의 무력 증상에 강기건력음을 기본방으로 활용하며, 본치인 보비익기를 유지하면서 증상에 따라 표치標治를 병행함<\/p><h4>③오장상관五臟相關에 따른 변증론치<\/h4><p><b>비위를 중심으로 관련 장부를 함께 살핌<\/b>: 중증근무력증의 주된 병위는 비에 두되, 병정과 증후에 따라 심, 폐, 간, 신 등 관련 장부의 상태를 함께 살펴 치료함. 이는 오행의 생극관계에 기계적으로 대입하는 것이 아니라 병정에 따른 장부 간 연관성을 파악하는 것임<\/p><p><b>병정에 따른 오장 관련성<\/b>: 경증, 전신형에서는 비를 중심으로 하고, 중등도 전신형에서는 비신脾腎의 관계가 중요하며, 호흡근이 침범된 위급상황에서는 폐비신肺脾腎의 관련성이 두드러진다고 봄. 즉 병세가 진행될수록 관련 장부와 치료 범위를 함께 조절함<\/p><p><b>겸증과 합병증에 따른 가감<\/b>: 간혈부족肝血不足, 신허腎虛, 폐계질환, 소화기 증상 등 겸증과 합병증을 오장상관의 관점에서 구별하여 기본방에 약물을 가감함. 양약물의 부작용도 중의학적 증후로 파악하여 별도로 조절함<\/p><p class=\"lbl2\">강기건력음强肌健力飮의 가감 활용<\/p><p class=\"sub\"><b>복시複視, 사시斜視<\/b>: 하수오를 가미하여 양간혈養肝血하고, 구기자, 산수유를 가미하여 보간신補肝腎<\/p><p class=\"sub\"><b>근골무력, 요척산연腰脊酸軟<\/b>: 구기자, 구척을 가미하여 보신장골補腎壯骨<\/p><p class=\"sub\"><b>요산腰酸, 야뇨夜尿<\/b>: 허리가 시큰하고 밤에 소변이 잦으면 두충, 상표소를 가미하여 고신축천固腎縮泉<\/p><p class=\"sub\"><b>외한지랭畏寒肢冷<\/b>: 파극천, 음양곽을 가미하여 온신장양溫腎壯陽<\/p><p class=\"sub\"><b>연하곤란<\/b>: 진피를 지각으로 바꾸고 길경을 가미하여 일승일강一升一降의 배합으로 기기氣機를 조절<\/p><p class=\"sub\"><b>구건口乾(입마름), 설태화박舌苔花剝<\/b>: 석곡을 가미하여 보위음補胃陰<\/p><p class=\"sub\"><b>설태백후舌苔白厚 또는 백탁白濁<\/b>: 복령, 의이인을 가미하여 화습化濕<\/p><p class=\"sub\"><b>해수다담咳嗽多痰(기침·가래가 많음)<\/b>: 자완, 백부, 귤락橘絡을 가미하여 화담化痰<\/p><p class=\"sub\"><b>야매다몽夜寐多夢, 심번실면心煩失眠(가슴 답답함·불면)<\/b>: 熟산조인, 야교등을 가미하여 양심녕신養心寧神<\/p><p class=\"sub\"><b>호르몬제 및 콜린에스테라아제 억제제 복용<\/b>: 백모근, 곡아를 가미<\/p><p class=\"sub\"><b>흉선증식, 흉선종胸腺瘤 수술 후<\/b>: 팔월찰八月劄, 산자고를 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품·신약 임상은 없음. 덩톄타오 명의의 익기 중약 특허(CN102178867B)가 있으나 이 처방과 조성이 달라 별개로 판단됨<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">같은 중증근무력증 대상 황기복방과 함께 고용량 황기 처방군으로 묶어 비교하면 국내 개발 후보를 좁힐 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 황쯔톈,류샤오빈.국의대사 덩톄타오의 강기건력음에 의한 중증근무력증 임상 응용 및 학술 전승國醫大師鄧鐵濤强肌健力飮治療重症肌無力的臨床應用及學術傳承[J].광저우중의약대학학보廣州中醫藥大學學報,2018,35(1):182-185.<\/li><li class=\"ref\">[2] 덩중광,추스쥔,덩톄타오.덩톄타오의 중증근무력증에 대한 인식과 변증론치鄧鐵濤對重症肌無力的認識與辨證論治[J].중국의약학보中國醫藥學報,1993, (2):41-43.<\/li><li class=\"ref\">[3] 류샤오빈.국의대사 덩톄타오의 중증근무력증 진료 경험에 대한 학술 전승과 발전國醫大師鄧鐵濤診治重症肌無力經驗的學術傳承與發展[J].광저우중의약 대학학보廣州中醫藥大學學報,2024,41(10):2518-2525.<\/li><li class=\"ref\">[4] 어우즈쑤이.강기건력음의 중증근무력증 치료 임상 연구强肌健力飮治療重症肌無力的臨床研究[D].광저우중의약대학廣州中醫藥大學,2005.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당삼(또는 태자삼) 15g","name":"당삼(또는 태자삼)","dose":"15g","base":"당삼"},{"raw":"황기60~120g","name":"황기","dose":"60~120g","base":"황기"},{"raw":"오조룡五爪龍60~120g","name":"오조룡五爪龍","dose":"60~120g","base":"오조룡"},{"raw":"백출15g","name":"백출","dose":"15g","base":"백출"},{"raw":"당귀10g","name":"당귀","dose":"10g","base":"당귀"},{"raw":"승마5g","name":"승마","dose":"5g","base":"승마"},{"raw":"시호10g","name":"시호","dose":"10g","base":"시호"},{"raw":"진피10g","name":"진피","dose":"10g","base":"진피"},{"raw":"감초5g","name":"감초","dose":"5g","base":"감초"}],"notes":[],"핵심 효능":["비위의 운화 기능을 회복시키고 인체의 기혈과 원기를 북돋아 비위허손을 근본적으로 다스림 (보비익기補脾益氣)","‘비주기육脾主肌肉’의 원리에 따라 근육에 영양을 공급하고 수축·운동력을 회복시켜 근골을 튼튼하게 함(강기건력强肌健力)"],"주치증":["중증근무력증"],"연구 확장 영역":["류마티스 질환, 각종 신경근육계 희귀질환, 만성 난치성 허손 질환 등"],"R&D 포인트":["대량의 황기와 오조룡 조합의 비기脾氣 보강 및 신경근육접합부의 아세틸콜린수용체(AChR) 기능과 발현·분포 조절 관련 분자 기전 분석","장기 투여에 따른 약물 대사 및 안전성 특성을 평가하고, 스테로이드 및 면역억제제 병용 시 약물 사용량 감소 가능성과 제제 최적화 전략을 탐색함"]},"modules":[{"name":"①보기건비 · 승양익기","hz":"補氣健脾 · 升陽益氣","herbs":["황기","오조룡"],"role":"비위의 허손을 근본적으로 다스림"},{"name":"②보혈양혈 · 보기조원","hz":"補血養血 · 補氣助元","herbs":["당삼(또는 태자삼)","백출","당귀"],"role":"기혈을 함께 보충함"},{"name":"③승양거함 · 이기화중","hz":"升陽擧陷 · 理氣和中","herbs":["승마","시호","진피","감초"],"role":"함하陷下된 양기를 끌어올리고 기기의 소통과 중초의 조화를 도모함"}],"rd":[{"tag":"MG Clinical","title":"중증근무력증 임상 효과의 표준 지표 재현","html":"<p>강기건력음의 중증근무력증 임상 연구와 학술 전승 정리가 있음<\/p><p>정량적 근무력증 점수(QMG)와 MG-ADL을 표준 지표로 한 재현 연구로 기존 결과의 근거 수준을 높임 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [4](2005, 임상 연구),[1][3](임상 응용과 학술 전승))<\/p>"},{"tag":"Ocular vs Generalized","title":"안근형·전신형 아형별 반응 차이","html":"<p>비위허손 중심의 변증 체계가 안근형과 전신형에서 같은 효과를 보이는지 아형별로 나누어 분석함<\/p><p><b>이로써 적응 대상을 좁히고 임상 설계를 효율화할 수 있음 (근거 유형<\/b>: 임상 경험 보고 | 근거: 참고문헌 [2](1993, 인식과 변증론치))<\/p>"},{"tag":"Respiratory Muscle","title":"호흡근 기능의 탐색적 안전성 관찰","html":"<p>‘승양거함’을 호흡근 기능 유지로 해석하는 것은 가설임<\/p><p>근무력 위기 예방을 목표로 하지 않고 표준치료를 받는 환자에서 노력성 폐활량(FVC) 과 이상반응을 관찰하는 탐색적 안전성 연구로 한정 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「승양거함, 이기화중」)<\/p>"},{"tag":"Sourcing & Dose","title":"오조룡 대체와 황기 대용량 안전성","html":"<p>오조룡五爪龍(오지모도五指毛桃)은 국내 공정서(대한민국약전·대한민국약전외한약 (생약)규격집)에 수재되지 않은 광둥 지역 약재임<\/p><p>대체 가능성 검토가 필요하고, 황기·오조룡을 최대 120g까지 쓰는 대용량 처방이므로 용량별 안전성 자료를 함께 확보해야 함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"보비익기補脾益氣, 강기건력强肌健力","body":"대량의 황기와 오조룡 조합으로 비기를 크게 보하여 근육의 수축-운동력을 회복시킴"},{"n":"2","title":"비위허손脾胃虛損, 오장상관五臟相關","body":"비위허손을 본으로 삼고 오장상관에 따라 자가면역 체계와 표적 기관 손상을 종합 조절함"},{"n":"3","title":"승양거함升陽擧陷, 이기화중理氣和中","body":"승마, 시호, 진피 등을 사용하여 기기를 승강시키고 보기 약제의 체기를 막음"},{"n":"4","title":"치본위주治本爲主, 변증가감","body":"보비익기를 일관되게 유지하면서 오장 겸증과 양약물 부작용을 동시 조절함"}],"field":3,"pages":[166,170],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["3-2","강기건력음","强肌健力飮","","덩톄타오","鄧鐵濤","‘비위허손脾胃虛損, 오장상관五臟相關’의 관점에 근거하여 보비익기補脾益氣, 강기건력","당삼(또는 태자삼) 15g 황기60~120g 오조룡五爪龍60~120g 백출15g 당귀10g 승마5g 시호10g 진피10g 감초5g","","핵심 효능 비위의 운화 기능을 회복시키고 인체의 기혈과 원기를 북돋아 비위허손을 근본적으로 다스림 (보비익기補脾益氣) ‘비주기육脾主肌肉’의 원리에 따라 근육에 영양을 공급하고 수축·운동력을 회복시켜 근골을 튼튼하게 함(강기건력强肌健力)","주치증 중증근무력증","연구 확장 영역 류마티스 질환, 각종 신경근육계 희귀질환, 만성 난치성 허손 질환 등","R&D 포인트 대량의 황기와 오조룡 조합의 비기脾氣 보강 및 신경근육접합부의 아세틸콜린수용체(AChR) 기능과 발현·분포 조절 관련 분자 기전 분석 장기 투여에 따른 약물 대사 및 안전성 특성을 평가하고, 스테로이드 및 면역억제제 병용 시 약물 사용량 감소 가능성과 제제 최적화 전략을 탐색함","①보기건비 · 승양익기 補氣健脾 · 升陽益氣 황기 오조룡 비위의 허손을 근본적으로 다스림","②보혈양혈 · 보기조원 補血養血 · 補氣助元 당삼(또는 태자삼) 백출 당귀 기혈을 함께 보충함","③승양거함 · 이기화중 升陽擧陷 · 理氣和中 승마 시호 진피 감초 함하陷下된 양기를 끌어올리고 기기의 소통과 중초의 조화를 도모함","보비익기補脾益氣, 강기건력强肌健力 대량의 황기와 오조룡 조합으로 비기를 크게 보하여 근육의 수축-운동력을 회복시킴","비위허손脾胃虛損, 오장상관五臟相關 비위허손을 본으로 삼고 오장상관에 따라 자가면역 체계와 표적 기관 손상을 종합 조절함","승양거함升陽擧陷, 이기화중理氣和中 승마, 시호, 진피 등을 사용하여 기기를 승강시키고 보기 약제의 체기를 막음","치본위주治本爲主, 변증가감 보비익기를 일관되게 유지하면서 오장 겸증과 양약물 부작용을 동시 조절함","MG Clinical 중증근무력증 임상 효과의 표준 지표 재현 강기건력음의 중증근무력증 임상 연구와 학술 전승 정리가 있음 정량적 근무력증 점수(QMG)와 MG-ADL을 표준 지표로 한 재현 연구로 기존 결과의 근거 수준을 높임 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [4](2005, 임상 연구),[1][3](임상 응용과 학술 전승))","Ocular vs Generalized 안근형·전신형 아형별 반응 차이 비위허손 중심의 변증 체계가 안근형과 전신형에서 같은 효과를 보이는지 아형별로 나누어 분석함 이로써 적응 대상을 좁히고 임상 설계를 효율화할 수 있음 (근거 유형 : 임상 경험 보고 | 근거: 참고문헌 [2](1993, 인식과 변증론치))","Respiratory Muscle 호흡근 기능의 탐색적 안전성 관찰 ‘승양거함’을 호흡근 기능 유지로 해석하는 것은 가설임 근무력 위기 예방을 목표로 하지 않고 표준치료를 받는 환자에서 노력성 폐활량(FVC) 과 이상반응을 관찰하는 탐색적 안전성 연구로 한정 (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「승양거함, 이기화중」)","Sourcing & Dose 오조룡 대체와 황기 대용량 안전성 오조룡五爪龍(오지모도五指毛桃)은 국내 공정서(대한민국약전·대한민국약전외한약 (생약)규격집)에 수재되지 않은 광둥 지역 약재임 대체 가능성 검토가 필요하고, 황기·오조룡을 최대 120g까지 쓰는 대용량 처방이므로 용량별 안전성 자료를 함께 확보해야 함 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)"],"ss":{"composition":"그림 3-2 강기건력음强肌健力飮의 모듈 구성 ①보기건비補氣健脾, 승양익기升陽益氣 모듈 — 비위의 허손을 근본적으로 다스림 황기, 오조룡 : 황기를 대량으로 사용하여 감온대보甘溫大補하고 비기를 북돋우며, ‘남방의 황기南芪’라 부르는 오조룡을 배합하여 보비익폐補脾益肺함 ②보혈양혈補血養血, 보기조원補氣助元 모듈 — 기혈을 함께 보충함 당삼(또는 태자삼), 백출, 당귀 : 당삼과 백출은 황기를 도와 보기의 기능을 증강시키며, 혈은 기의 어머니라는 원리에 따라 당귀를 사용하여 양혈생기養血生氣를 도모함 ③승양거함升陽擧陷, 이기화중理氣和中 모듈 — 함하陷下된 양기를 끌어올리고 기기의 소통과 중초의 조화를 도모함 승마, 시호, 진피, 감초 : 승마와 시호는 함하된 양기를 끌어올리고, 진피는 보기약물의 배합으로 발생할 수 있는 기체氣滯를 방지하도록 이기소체理氣消滯하며, 감초는 화중和中하고 여러 약재의 약성을 조화시킴","master":"①병인병기 인식 질환의 범주와 특징 : 중증근무력증은 ‘위병痿病’ 범주에 속하며, 대사는 이를 단순한 허증이 아니라 장기간 지속되어 기능과 형체가 모두 손상된 허손虛損의 병증으로 봄 병의 본本은 비위허손脾胃虛損 : 기본 병기는 비위기허脾胃氣虛이며, 비위가 후천지본後天之本이고 비주기육脾主肌肉하므로 비위의 기가 허하면 기육肌肉을 충분히 자양하지 못하여 안검하수, 사지무력, 연하곤란 등의 증상이 발생한다고 봄 허손난복虛損難復 : 허손은 일반적인 허증보다 회복이 어렵고 병정이 길며 반복되기 쉬우므로 단기간의 치료보다 지속적인 보익을 중시함. 이에 보비익기補脾益氣를 치료의 대법으로 삼고, 치본治本을 일관되게 유지하면서 표증標證을 간헐적으로 치료함 ②보비익기補脾益氣, 강기건력强肌健力의 치료 원칙 보비익기補脾益氣로 본本을 치료 : 비위허손을 근본 병기로 보고 황기, 당삼, 백출, 오조룡 등으로 비기를 크게 보하여 근육의 기능을 회복시키는 것을 치료의 중심으로 삼음 감온익손甘溫益損을 중시 : 이고李杲의 비위학설과 보중익기탕을 학술적 근거로 삼되, 중증근무력증은 비위허손이 심하므로 일반적인 보중익기탕보다 황기, 인삼 등의 보익력을 강화함. 특히 황기를 중용하는 것은 이고의 ‘비주기육’ 사상과 왕청임王淸任의 황기 중용 경험을 결합한 것임 강기건력强肌健力으로 증상을 개선 : 안검하수, 복시, 사지무력, 교작무력, 연하곤란, 호흡곤란 등 근육의 무력 증상에 강기건력음을 기본방으로 활용하며, 본치인 보비익기를 유지하면서 증상에 따라 표치標治를 병행함 ③오장상관五臟相關에 따른 변증론치 비위를 중심으로 관련 장부를 함께 살핌 : 중증근무력증의 주된 병위는 비에 두되, 병정과 증후에 따라 심, 폐, 간, 신 등 관련 장부의 상태를 함께 살펴 치료함. 이는 오행의 생극관계에 기계적으로 대입하는 것이 아니라 병정에 따른 장부 간 연관성을 파악하는 것임 병정에 따른 오장 관련성 : 경증, 전신형에서는 비를 중심으로 하고, 중등도 전신형에서는 비신脾腎의 관계가 중요하며, 호흡근이 침범된 위급상황에서는 폐비신肺脾腎의 관련성이 두드러진다고 봄. 즉 병세가 진행될수록 관련 장부와 치료 범위를 함께 조절함 겸증과 합병증에 따른 가감 : 간혈부족肝血不足, 신허腎虛, 폐계질환, 소화기 증상 등 겸증과 합병증을 오장상관의 관점에서 구별하여 기본방에 약물을 가감함. 양약물의 부작용도 중의학적 증후로 파악하여 별도로 조절함 강기건력음强肌健力飮의 가감 활용 복시複視, 사시斜視 : 하수오를 가미하여 양간혈養肝血하고, 구기자, 산수유를 가미하여 보간신補肝腎 근골무력, 요척산연腰脊酸軟 : 구기자, 구척을 가미하여 보신장골補腎壯骨 요산腰酸, 야뇨夜尿 : 허리가 시큰하고 밤에 소변이 잦으면 두충, 상표소를 가미하여 고신축천固腎縮泉 외한지랭畏寒肢冷 : 파극천, 음양곽을 가미하여 온신장양溫腎壯陽 연하곤란 : 진피를 지각으로 바꾸고 길경을 가미하여 일승일강一升一降의 배합으로 기기氣機를 조절 구건口乾(입마름), 설태화박舌苔花剝 : 석곡을 가미하여 보위음補胃陰 설태백후舌苔白厚 또는 백탁白濁 : 복령, 의이인을 가미하여 화습化濕 해수다담咳嗽多痰(기침·가래가 많음) : 자완, 백부, 귤락橘絡을 가미하여 화담化痰 야매다몽夜寐多夢, 심번실면心煩失眠(가슴 답답함·불면) : 熟산조인, 야교등을 가미하여 양심녕신養心寧神 호르몬제 및 콜린에스테라아제 억제제 복용 : 백모근, 곡아를 가미 흉선증식, 흉선종胸腺瘤 수술 후 : 팔월찰八月劄, 산자고를 가미","rd":"","china":"중국 제품화 현황 허가 제품·신약 임상은 없음. 덩톄타오 명의의 익기 중약 특허(CN102178867B)가 있으나 이 처방과 조성이 달라 별개로 판단됨 시사점 같은 중증근무력증 대상 황기복방과 함께 고용량 황기 처방군으로 묶어 비교하면 국내 개발 후보를 좁힐 수 있음 참고문헌 [1] 황쯔톈,류샤오빈.국의대사 덩톄타오의 강기건력음에 의한 중증근무력증 임상 응용 및 학술 전승國醫大師鄧鐵濤强肌健力飮治療重症肌無力的臨床應用及學術傳承[J].광저우중의약대학학보廣州中醫藥大學學報,2018,35(1):182-185. [2] 덩중광,추스쥔,덩톄타오.덩톄타오의 중증근무력증에 대한 인식과 변증론치鄧鐵濤對重症肌無力的認識與辨證論治[J].중국의약학보中國醫藥學報,1993, (2):41-43. [3] 류샤오빈.국의대사 덩톄타오의 중증근무력증 진료 경험에 대한 학술 전승과 발전國醫大師鄧鐵濤診治重症肌無力經驗的學術傳承與發展[J].광저우중의약 대학학보廣州中醫藥大學學報,2024,41(10):2518-2525. [4] 어우즈쑤이.강기건력음의 중증근무력증 치료 임상 연구强肌健力飮治療重症肌無力的臨床研究[D].광저우중의약대학廣州中醫藥大學,2005."}},{"id":"3-3","ko":"소조증력탕","hz":"疏調增力湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"간, 비, 신을 조율하고 기기를 소통시켜 운동신경세포질환(motor neuron disease, MND)을 치료하는 처방","meta":{"주요 적응증":"운동신경세포질환(ALS 등)","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":171,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-3 소조증력탕疏調增力湯의 모듈 구성<\/p><h4>①소간조기疏肝調氣(체體-몸통) 모듈 — 간의 소설기능을 회복하고 기혈 통로를 개척하여 기기 승강과 경락 순환을 정상화함<\/h4><p><b>시호, 박하<\/b>: 시호가 소간해울疏肝解鬱하고 기기를 승발升發시켜 거사부정祛邪扶正을 도모하며, 박하는 방향행기芳香行氣하고 삼초를 통하게 하여 기기를 선창宣暢함. 또한 시호의 성분이 면역을 조절하고 중추신경을 진정시켜 불안 등 부정적 정서를 개선함<\/p><p><b>천궁, 당귀<\/b>: 천궁이 활혈행기活血行氣, 거풍통락祛風通絡하여 혈맥을 원활하게 뚫고, 당귀가 양혈화혈養血和血하여 간혈肝血을 다스림. 이는 간장혈肝藏血, 주근主筋의 생리를 회복시켜 근맥의 구련拘攣과 기체혈어氣滯血瘀를 해소함<\/p><h4>②익기건비益氣健脾, 보폐補肺(익翼-첫 번째 날개) 모듈 — 후천지본인 비위를 북돋아 비위 중초의 승강 순환을 정돈하고 기혈 화생을 촉진함<\/h4><p><b>황기, 태자삼<\/b>: 황기가 보폐건비補肺健脾, 보기승양補氣升陽하여 기의 근본을 세우고, 태자삼이 기음氣陰을 쌍보함. 황기와 태자삼의 용량을 2:1 비율로 배합하여 고본배원固本培元의 효능을 극대화하며, 세포대사와 면역기능을 강화함<\/p><p><b>백출, 복령, 산약<\/b>: 백출이 보기건비補氣健脾, 조습리수燥濕利水하여 위장관과 면역계를 조절하고, 복령이 삼습건비滲濕健脾, 영심안신寧心安神하며, 산약이 보비양위補脾養胃, 익폐보신益肺補腎함. 이 약재들이 상호 협동하여 선천과 후천의 근본을 보양하고 손상된 신경세포 및 사지 근육에 자양분을 공급함<\/p><h4>③보신전정補腎塡精, 양심養心(익翼-두 번째 날개) 모듈 — 선천지본을 충실히 하고 신정과 심혈을 채워 근골의 위약痿弱을 근본적으로 수복함<\/h4><p><b>음양곽, 파극천<\/b>: 음양곽과 파극천이 온보신양溫補腎陽, 보신장골補腎壯骨하고 골형성 및 조골세포-파골세포 균형을 조절하여 하원의 허손을 다스리고 위증을 치료함<\/p><p><b>산수유, 감초<\/b>: 산수유가 보삽간신補澁肝腎하여 정기를 수렴하고 면역 및 항산화 작용을 발휘하며, 감초가 감완화중甘緩和中하고 제반 약물을 조화롭게 함. 신腎, 심心, 수해髓海를 동시에 채워 근골의 위약痿弱을 근본적으로 치료함<\/p>"},{"k":"master","t":"장전의 운동신경세포질환 치료","html":"<h4>①병인병기 인식 — 기기실조氣機失調와 폐비신허肺脾腎虛, 간울기체肝鬱氣滯, 심혈부족心血不足의 복합 병기<\/h4><p><b>기기실조는 위증痿證의 본<\/b>: 인체의 기는 선천지기先天之氣(원기元氣), 지기地氣(비위의 기), 천기天氣(폐의 기)가 결합하여 형성됨. 기기의 승강출입升降出入이 원활하지 못하면 정기내허正氣內虛해지고 풍한습사風寒濕邪와 담습어혈痰濕瘀血이 내복內伏하여 근골을 손상시키고 위증으로 발전함<\/p><p><b>간위체肝爲體, 간주소설肝主疏泄<\/b>: 간은 체體(몸통)이며, 근筋을 주관하고 소설疏泄을 주도함. 간실소설肝失疏泄하면 수액이 체류하여 담습痰濕을 형성하고 근골을 막음. 또한 환자의 우울, 불안 등 정서적 스트레스(간울기체肝鬱氣滯)는 염증 반응을 높여 병세를 악화시킬 수 있다고 봄<\/p><p><b>비폐위익脾肺爲翼, 후천화생지원後天化生之源<\/b>: 비폐脾肺는 익翼(날개)이며, 비는 사지와 근육을 주관하고, 폐는 기의 근본임. 비위 운화 장애는 기혈 생화를 막아 사지 근육을 마르게 하며, 폐기 쇠약은 호흡과 발음 장애(구음장애)를 유발함<\/p><p><b>신심위익腎心爲翼, 선천봉장지본先天封藏之本<\/b>: 신심腎心은 익翼(날개)이며, 심주혈心主血, 신주골생수腎主骨生髓의 생리에 따라 신정腎精이 고갈되면 수해髓海가 비어 사지가 위약痿弱해지고, 심혈心血이 부족하면 심계정충心悸怔忡과 영양 불량이 초래됨<\/p><h4>②치료 원칙 — 소조기기법疏調氣機法 및 ‘일체양익一體兩翼’의 정밀 적용<\/h4><p><b>소조기기 치법의 현대적 의미<\/b>: 전통 ‘팔법八法’ 중 화법和法을 ‘조기調氣’ 중심으로 재해석함. 기기의 승강출입을 정상화하여 전신의 순환을 바로잡고, 환자의 정서적 우울을 다스리는 조기調氣 전략을 병행하여 심신동치心身同治를 구현함<\/p><p>일체양익一體兩翼의 가변적 적용:<\/p><p class=\"sub\"><b>일반 기기 조율<\/b>: 간肝의 소설疏泄 기능을 체體(몸통)로 삼고, 비脾의 운화運化와 신腎의 봉장封藏을 양측 익翼(날개)으로 삼는 ‘간위체肝爲體, 비신위익脾腎爲翼’ 전략을 취함<\/p><p class=\"sub\"><b>운동신경세포질환(위증痿證) 특화 적용<\/b>: 간기소설肝氣疏泄을 체體(몸통)로 삼아 울체된 기기를 풀고 혈맥을 통하게 하는 ‘간위체肝爲體’ 구도를 최우선으로 하고, 건비익폐健脾益肺와 보신양심補腎養心을 양 날개로 삼아 후천과 선천을 동시 보양하는 ‘비폐신위익脾肺腎爲翼’ 전략을 구사함<\/p><h4>③배오의 특징<\/h4><p><b>승강동용升降同用, 산수병진散收並進<\/b>: 시호, 박하의 기기승발氣機升發과 방향행기芳香行氣 및 산수유, 감초의 수렴수섭收斂收攝을 결합하여 기기소통과 정기 보존을 동시에 이룸<\/p><p><b>익기건비益氣健脾, 투약정비投藥定比<\/b>: 황기와 태자삼의 용량을 2:1로 엄격히 고정 배합하여 기음氣陰을 함께 보익하고 고본배원固本培元의 효능을 극대화함<\/p><p><b>보이불체補而不滯, 병조심신並調心身<\/b>: 보약(황기, 태자삼, 산약, 음양곽, 파극천)에 행기行氣 약재(시호, 천궁, 박하)를 배합하여 약성이 체하지 않게 하고, 심신동치心身同治를 구현함<\/p><p><b>선천후천의 쌍보雙補, 근골동치筋骨同治<\/b>: 후천 비위와 선천 신장을 동시에 보양하여 정수精髓를 채우고, 간혈肝血을 다스려 근골의 위약을 근본적으로 수복함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">운동신경세포질환은 치료 수요가 매우 크나 공개자료상 제품·특허가 확인되지 않고 근거가 경험 보고뿐이므로, 기능 저하 속도를 보는 관찰연구로 출발해야 함. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 런쥔샤오,신루이,후쉐위,등.“소조기기” 학술사상에 기반한 운동신경원병 치료“基於‘疏調氣機’學術思想論治運動神經元病”[J].쓰촨중의四川中醫,2024,42(9):34-37.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"시호","name":"시호","dose":"","base":"시호"},{"raw":"황기","name":"황기","dose":"","base":"황기"},{"raw":"태자삼","name":"태자삼","dose":"","base":"태자삼"},{"raw":"당귀","name":"당귀","dose":"","base":"당귀"},{"raw":"천궁","name":"천궁","dose":"","base":"천궁"},{"raw":"음양곽","name":"음양곽","dose":"","base":"음양곽"},{"raw":"산수유","name":"산수유","dose":"","base":"산수유"},{"raw":"파극천","name":"파극천","dose":"","base":"파극천"},{"raw":"복령","name":"복령","dose":"","base":"복령"},{"raw":"백출","name":"백출","dose":"","base":"백출"},{"raw":"산약","name":"산약","dose":"","base":"산약"},{"raw":"박하","name":"박하","dose":"","base":"박하"},{"raw":"生감초","name":"生감초","dose":"","base":"감초"}],"notes":[],"핵심 효능":["간기를 소통시키고 폐와 비의 기를 보함(소간익폐건비疏肝益肺健脾)","간과 신을 보함(보익간신補益肝腎)","근육과 뼈를 튼튼하게 함(강근건골强筋健骨)"],"주치증":["운동신경세포질환(Motor Neuron Disease, MND; 근위축성 측삭경화증 등) 및 위증痿證의 폐비신허肺脾腎虛, 간울기체肝鬱氣滯, 기체혈어氣滯血瘀, 심혈부족心血不足 증형"],"연구 확장 영역":["근위축성 측삭경화증, 진행성 근위축증, 진행성 연수마비, 만성 피로 증후군, 근육 위축 및 수축 장애, 우울과 불안을 동반한 신경퇴행성 질환 등"],"R&D 포인트":["시호, 박하, 천궁, 당귀의 간기소설肝氣疏泄, 항불안 및 중추신경계 진정 작용, 페룰산(Ferulic acid)을 통한 활혈통락活血通絡 및 혈전 억제, IL-6 발현 및 NF-κB 활성 조절 효과를 규명","황기, 태자삼(2:1 고정 비율 배합), 백출, 복령, 산약의 후천 보양 작용과 장-뇌 축(Gut-Brain Axis) 및 EAAT2 매개 글루타메이트 수송 조절을 통한 신경세포 손상·변성 억제, 세포 에너지 대사 조절 및 면역 조절 작용을 탐색함","음양곽, 파극천, 산수유, 生감초의 보신장골補腎壯骨 작용과 산화 스트레스 조절, 이카리인 (Icariin) 및 파극천 안트라퀴논류의 조골세포·파골세포 균형 조절 및 신경세포 기능 조절 효과를 검증"]},"modules":[{"name":"①소간조기 · (체 · -몸통)","hz":"疏肝調氣 · 體","herbs":["시호","박하","천궁","당귀"],"role":"개척하여 기기 승강과 경락 순환을 정상화함"},{"name":"②익기건비 · (익 · -첫 번째 날개) · 보폐","hz":"益氣健脾 · 補肺 · 翼","herbs":["황기","태자삼","백출","복령","산약"],"role":"후천지본인 비위를 북돋아 비위 중초의 승강 순환을 정돈하고 기혈 화생을 촉진함"},{"name":"③보신전정 · (익 · -두 번째 날개) · 양심","hz":"補腎塡精 · 養心 · 翼","herbs":["음양곽","파극천","산수유","감초"],"role":"선천지본을 충실히 하고 신정과 심혈을 채워 근골의 위약痿弱을 근본적으로 수복함"}],"rd":[{"tag":"ALS Adjunct","title":"운동신경세포질환의 진행 속도 지표","html":"<p><b>근거<\/b> 가 2024년 경험 보고 1편이어서 진행 지연 효과로 확대할 수 없음<\/p><p>릴루졸 표준치료 병용 환자의 ALSFRS-R 감소 속도를 후향적으로 정리하되 유전자형<\/p><p class=\"li\"><b>·발병 부위·기저 진행 속도를 보정 (근거 유형<\/b>: 임상 경험 보고 | 근거: 참고문헌 [1] (2024, 운동신경세포질환 치료))<\/p>"},{"tag":"Motor Neuron Protection","title":"황기·태자삼 배합의 운동신경세포 보호","html":"<p>SOD1-G93A 생쥐 등 표준 ALS 모델에서 운동신경세포 생존과 미토콘드리아 기능을 측정함<\/p><p><b>이를 통해 ‘익폐건비’의 신경 보호 효과를 확인 (근거 유형<\/b>: 신규 연구가설 | 근거: R&amp;D 논리 1 「소간익폐건비와 일체양익」, 본문 R&amp;D 포인트)<\/p>"},{"tag":"Mood & QoL","title":"ALS 환자의 우울·불안과 삶의 질","html":"<p>시호·박하 등 소간 약재의 정서 개선 효과를 ALS 환자의 우울·불안(HADS)과 삶의 질 지표로 평가함<\/p><p>이렇게 하면 질병 진행 억제와 별개로 증상 관리 가치를 보여줄 수 있음 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4 「소조기기법과 심신동치」)<\/p>"},{"tag":"Platform Formula","title":"장전 소조 계열 처방의 공통 골격 정리","html":"<p>이 처방은 소조기기탕·소조건골탕·조보료위탕과 시호·황기·음양곽 등 공통 골격을 공유함<\/p><p>공통 골격과 질환별 가감 약재를 구분해 정리하면 여러 적응증을 한 번에 다루는 플랫폼형 개발이 가능 (근거 유형: 신규 연구가설 | 근거: 본문 조성표(장전 계열 처방 비교))<\/p>"}],"logic":[{"n":"1","title":"소간익폐건비疏肝益肺健脾와 일체양익一體兩翼","body":"간기를 소통시키고 폐비의 기를 보함"},{"n":"2","title":"보익간신補益肝腎과 강근건골强筋健骨","body":"신정을 채우고 근골의 위약을 수복함"},{"n":"3","title":"간기소설肝氣疏泄과 활혈통락活血通絡","body":"기혈 통로를 열어 경락 순환을 정상화함"},{"n":"4","title":"소조기기법疏調氣機法과 심신동치心身同治","body":"기기 승강출입을 정상화하여 환자의 정서적 우울을 다스리고 심신을 함께 치료함"}],"field":3,"pages":[171,175],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["3-3","소조증력탕","疏調增力湯","","장전","張震","간, 비, 신을 조율하고 기기를 소통시켜 운동신경세포질환(motor neuron disease, MND)을 치료하는 처방","시호 황기 태자삼 당귀 천궁 음양곽 산수유 파극천 복령 백출 산약 박하 生감초","","핵심 효능 간기를 소통시키고 폐와 비의 기를 보함(소간익폐건비疏肝益肺健脾) 간과 신을 보함(보익간신補益肝腎) 근육과 뼈를 튼튼하게 함(강근건골强筋健骨)","주치증 운동신경세포질환(Motor Neuron Disease, MND; 근위축성 측삭경화증 등) 및 위증痿證의 폐비신허肺脾腎虛, 간울기체肝鬱氣滯, 기체혈어氣滯血瘀, 심혈부족心血不足 증형","연구 확장 영역 근위축성 측삭경화증, 진행성 근위축증, 진행성 연수마비, 만성 피로 증후군, 근육 위축 및 수축 장애, 우울과 불안을 동반한 신경퇴행성 질환 등","R&D 포인트 시호, 박하, 천궁, 당귀의 간기소설肝氣疏泄, 항불안 및 중추신경계 진정 작용, 페룰산(Ferulic acid)을 통한 활혈통락活血通絡 및 혈전 억제, IL-6 발현 및 NF-κB 활성 조절 효과를 규명 황기, 태자삼(2:1 고정 비율 배합), 백출, 복령, 산약의 후천 보양 작용과 장-뇌 축(Gut-Brain Axis) 및 EAAT2 매개 글루타메이트 수송 조절을 통한 신경세포 손상·변성 억제, 세포 에너지 대사 조절 및 면역 조절 작용을 탐색함 음양곽, 파극천, 산수유, 生감초의 보신장골補腎壯骨 작용과 산화 스트레스 조절, 이카리인 (Icariin) 및 파극천 안트라퀴논류의 조골세포·파골세포 균형 조절 및 신경세포 기능 조절 효과를 검증","①소간조기 · (체 · -몸통) 疏肝調氣 · 體 시호 박하 천궁 당귀 개척하여 기기 승강과 경락 순환을 정상화함","②익기건비 · (익 · -첫 번째 날개) · 보폐 益氣健脾 · 補肺 · 翼 황기 태자삼 백출 복령 산약 후천지본인 비위를 북돋아 비위 중초의 승강 순환을 정돈하고 기혈 화생을 촉진함","③보신전정 · (익 · -두 번째 날개) · 양심 補腎塡精 · 養心 · 翼 음양곽 파극천 산수유 감초 선천지본을 충실히 하고 신정과 심혈을 채워 근골의 위약痿弱을 근본적으로 수복함","소간익폐건비疏肝益肺健脾와 일체양익一體兩翼 간기를 소통시키고 폐비의 기를 보함","보익간신補益肝腎과 강근건골强筋健骨 신정을 채우고 근골의 위약을 수복함","간기소설肝氣疏泄과 활혈통락活血通絡 기혈 통로를 열어 경락 순환을 정상화함","소조기기법疏調氣機法과 심신동치心身同治 기기 승강출입을 정상화하여 환자의 정서적 우울을 다스리고 심신을 함께 치료함","ALS Adjunct 운동신경세포질환의 진행 속도 지표 근거 가 2024년 경험 보고 1편이어서 진행 지연 효과로 확대할 수 없음 릴루졸 표준치료 병용 환자의 ALSFRS-R 감소 속도를 후향적으로 정리하되 유전자형 ·발병 부위·기저 진행 속도를 보정 (근거 유형 : 임상 경험 보고 | 근거: 참고문헌 [1] (2024, 운동신경세포질환 치료))","Motor Neuron Protection 황기·태자삼 배합의 운동신경세포 보호 SOD1-G93A 생쥐 등 표준 ALS 모델에서 운동신경세포 생존과 미토콘드리아 기능을 측정함 이를 통해 ‘익폐건비’의 신경 보호 효과를 확인 (근거 유형 : 신규 연구가설 | 근거: R&D 논리 1 「소간익폐건비와 일체양익」, 본문 R&D 포인트)","Mood & QoL ALS 환자의 우울·불안과 삶의 질 시호·박하 등 소간 약재의 정서 개선 효과를 ALS 환자의 우울·불안(HADS)과 삶의 질 지표로 평가함 이렇게 하면 질병 진행 억제와 별개로 증상 관리 가치를 보여줄 수 있음 (근거 유형: 신규 연구가설 | 근거: R&D 논리 4 「소조기기법과 심신동치」)","Platform Formula 장전 소조 계열 처방의 공통 골격 정리 이 처방은 소조기기탕·소조건골탕·조보료위탕과 시호·황기·음양곽 등 공통 골격을 공유함 공통 골격과 질환별 가감 약재를 구분해 정리하면 여러 적응증을 한 번에 다루는 플랫폼형 개발이 가능 (근거 유형: 신규 연구가설 | 근거: 본문 조성표(장전 계열 처방 비교))"],"ss":{"composition":"그림 3-3 소조증력탕疏調增力湯의 모듈 구성 ①소간조기疏肝調氣(체體-몸통) 모듈 — 간의 소설기능을 회복하고 기혈 통로를 개척하여 기기 승강과 경락 순환을 정상화함 시호, 박하 : 시호가 소간해울疏肝解鬱하고 기기를 승발升發시켜 거사부정祛邪扶正을 도모하며, 박하는 방향행기芳香行氣하고 삼초를 통하게 하여 기기를 선창宣暢함. 또한 시호의 성분이 면역을 조절하고 중추신경을 진정시켜 불안 등 부정적 정서를 개선함 천궁, 당귀 : 천궁이 활혈행기活血行氣, 거풍통락祛風通絡하여 혈맥을 원활하게 뚫고, 당귀가 양혈화혈養血和血하여 간혈肝血을 다스림. 이는 간장혈肝藏血, 주근主筋의 생리를 회복시켜 근맥의 구련拘攣과 기체혈어氣滯血瘀를 해소함 ②익기건비益氣健脾, 보폐補肺(익翼-첫 번째 날개) 모듈 — 후천지본인 비위를 북돋아 비위 중초의 승강 순환을 정돈하고 기혈 화생을 촉진함 황기, 태자삼 : 황기가 보폐건비補肺健脾, 보기승양補氣升陽하여 기의 근본을 세우고, 태자삼이 기음氣陰을 쌍보함. 황기와 태자삼의 용량을 2:1 비율로 배합하여 고본배원固本培元의 효능을 극대화하며, 세포대사와 면역기능을 강화함 백출, 복령, 산약 : 백출이 보기건비補氣健脾, 조습리수燥濕利水하여 위장관과 면역계를 조절하고, 복령이 삼습건비滲濕健脾, 영심안신寧心安神하며, 산약이 보비양위補脾養胃, 익폐보신益肺補腎함. 이 약재들이 상호 협동하여 선천과 후천의 근본을 보양하고 손상된 신경세포 및 사지 근육에 자양분을 공급함 ③보신전정補腎塡精, 양심養心(익翼-두 번째 날개) 모듈 — 선천지본을 충실히 하고 신정과 심혈을 채워 근골의 위약痿弱을 근본적으로 수복함 음양곽, 파극천 : 음양곽과 파극천이 온보신양溫補腎陽, 보신장골補腎壯骨하고 골형성 및 조골세포-파골세포 균형을 조절하여 하원의 허손을 다스리고 위증을 치료함 산수유, 감초 : 산수유가 보삽간신補澁肝腎하여 정기를 수렴하고 면역 및 항산화 작용을 발휘하며, 감초가 감완화중甘緩和中하고 제반 약물을 조화롭게 함. 신腎, 심心, 수해髓海를 동시에 채워 근골의 위약痿弱을 근본적으로 치료함","master":"①병인병기 인식 — 기기실조氣機失調와 폐비신허肺脾腎虛, 간울기체肝鬱氣滯, 심혈부족心血不足의 복합 병기 기기실조는 위증痿證의 본 : 인체의 기는 선천지기先天之氣(원기元氣), 지기地氣(비위의 기), 천기天氣(폐의 기)가 결합하여 형성됨. 기기의 승강출입升降出入이 원활하지 못하면 정기내허正氣內虛해지고 풍한습사風寒濕邪와 담습어혈痰濕瘀血이 내복內伏하여 근골을 손상시키고 위증으로 발전함 간위체肝爲體, 간주소설肝主疏泄 : 간은 체體(몸통)이며, 근筋을 주관하고 소설疏泄을 주도함. 간실소설肝失疏泄하면 수액이 체류하여 담습痰濕을 형성하고 근골을 막음. 또한 환자의 우울, 불안 등 정서적 스트레스(간울기체肝鬱氣滯)는 염증 반응을 높여 병세를 악화시킬 수 있다고 봄 비폐위익脾肺爲翼, 후천화생지원後天化生之源 : 비폐脾肺는 익翼(날개)이며, 비는 사지와 근육을 주관하고, 폐는 기의 근본임. 비위 운화 장애는 기혈 생화를 막아 사지 근육을 마르게 하며, 폐기 쇠약은 호흡과 발음 장애(구음장애)를 유발함 신심위익腎心爲翼, 선천봉장지본先天封藏之本 : 신심腎心은 익翼(날개)이며, 심주혈心主血, 신주골생수腎主骨生髓의 생리에 따라 신정腎精이 고갈되면 수해髓海가 비어 사지가 위약痿弱해지고, 심혈心血이 부족하면 심계정충心悸怔忡과 영양 불량이 초래됨 ②치료 원칙 — 소조기기법疏調氣機法 및 ‘일체양익一體兩翼’의 정밀 적용 소조기기 치법의 현대적 의미 : 전통 ‘팔법八法’ 중 화법和法을 ‘조기調氣’ 중심으로 재해석함. 기기의 승강출입을 정상화하여 전신의 순환을 바로잡고, 환자의 정서적 우울을 다스리는 조기調氣 전략을 병행하여 심신동치心身同治를 구현함 일체양익一體兩翼의 가변적 적용: 일반 기기 조율 : 간肝의 소설疏泄 기능을 체體(몸통)로 삼고, 비脾의 운화運化와 신腎의 봉장封藏을 양측 익翼(날개)으로 삼는 ‘간위체肝爲體, 비신위익脾腎爲翼’ 전략을 취함 운동신경세포질환(위증痿證) 특화 적용 : 간기소설肝氣疏泄을 체體(몸통)로 삼아 울체된 기기를 풀고 혈맥을 통하게 하는 ‘간위체肝爲體’ 구도를 최우선으로 하고, 건비익폐健脾益肺와 보신양심補腎養心을 양 날개로 삼아 후천과 선천을 동시 보양하는 ‘비폐신위익脾肺腎爲翼’ 전략을 구사함 ③배오의 특징 승강동용升降同用, 산수병진散收並進 : 시호, 박하의 기기승발氣機升發과 방향행기芳香行氣 및 산수유, 감초의 수렴수섭收斂收攝을 결합하여 기기소통과 정기 보존을 동시에 이룸 익기건비益氣健脾, 투약정비投藥定比 : 황기와 태자삼의 용량을 2:1로 엄격히 고정 배합하여 기음氣陰을 함께 보익하고 고본배원固本培元의 효능을 극대화함 보이불체補而不滯, 병조심신並調心身 : 보약(황기, 태자삼, 산약, 음양곽, 파극천)에 행기行氣 약재(시호, 천궁, 박하)를 배합하여 약성이 체하지 않게 하고, 심신동치心身同治를 구현함 선천후천의 쌍보雙補, 근골동치筋骨同治 : 후천 비위와 선천 신장을 동시에 보양하여 정수精髓를 채우고, 간혈肝血을 다스려 근골의 위약을 근본적으로 수복함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 운동신경세포질환은 치료 수요가 매우 크나 공개자료상 제품·특허가 확인되지 않고 근거가 경험 보고뿐이므로, 기능 저하 속도를 보는 관찰연구로 출발해야 함. 국내 공정서(약전·규격집)에 없는 태자삼이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 런쥔샤오,신루이,후쉐위,등.“소조기기” 학술사상에 기반한 운동신경원병 치료“基於‘疏調氣機’學術思想論治運動神經元病”[J].쓰촨중의四川中醫,2024,42(9):34-37."}},{"id":"3-4","ko":"소조건골탕","hz":"疏調健骨湯","alias":"","master_ko":"장전","master_hz":"張震","tagline":"간, 비, 신을 조율하고 기기를 소통시켜 골다공증을 치료하는 처방","meta":{"주요 적응증":"골다공증","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":176,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 3-4 소조건골탕疏調健骨湯의 모듈 구성<\/p><h4>①보신양간補腎養肝, 강근장골强筋壯骨 모듈 — 신정과 간혈을 채우고 근골을 강화하여 골격의 근본을 충실히 세움<\/h4><p><b>산수유, 숙지황, 음양곽<\/b>: 산수유가 산삽미온酸澁微溫한 성질로 평보간신平補肝腎, 삽정고원澁精固元하여 간과 신장을 고르게 보하고 정기를 지키며, 숙지황이 자신수滋腎水, 전골수塡骨髓하여 신음과 혈을 채우고, 음양곽이 보신조양補腎助陽, 강근골强筋骨하여 신장의 양기와 근골을 강화함<\/p><p><b>골쇄보, 보골지, 녹함초<\/b>: 골쇄보가 온보신장溫補腎臟, 치절상治折傷하여 신장을 보하고 손상된 골격 회복을 도우며, 보골지가 난명문暖命門, 고하원固下元하여 하초의 원기를 따뜻하게 다지고, 녹함초가 첨정보수添精補髓하여 정수와 골수를 보충함. 이 약재들은 골대사 표적 작용을 통해 골밀도 저하와 골통증을 직접 개선함<\/p><h4>②익기건비益氣健脾, 배후천지본培後天之本 모듈 — 비위의 운화 기능을 살리고 기혈 생성을 촉진하여 후천의 영양 기반을 다짐<\/h4><p><b>황기, 당귀<\/b>: 황기가 폐로 들어가 보기승양補氣升陽하여 원기를 보하고, 당귀가 통심생혈通心生血, 양혈활혈養血活血하여 황기와 함께 기혈을 동시에 채움<\/p><p><b>백출, 복령, 산약<\/b>: 백출이 보기건비補氣健脾, 조습리수燥濕利水하여 비위의 운화 기능을 살리고, 복령이 삼습건비滲濕健脾, 영심안신寧心安神하며, 산약이 보폐기補肺氣, 보신기補腎氣하여 기혈의 생성을 도움<\/p><h4>③조기화혈調氣和血, 활혈거어活血祛瘀 모듈 — 기기를 소통시키고 어혈을 제거하여 전신 및 골 미세순환을 개선함<\/h4><p><b>시호, 박하, 향부자, 울금<\/b>: 시호가 소간리기疏肝理氣, 승발청양升發淸陽하여 울체된 간기와 기혈을 펼치고, 박하가 신량소간辛涼疏肝하여 간열을 다스리며, 향부자가 통행십이경通行十二經하여 꽉 막힌 기운을 뚫어주고, 울금이 간울肝鬱을 풀고 하기파혈下氣破血하여 기혈 순환을 촉진함<\/p><p><b>지실, 백작약<\/b>: 지실이 파기체破氣滯, 화담소적化痰消積하여 체한 기운을 깨뜨리고, 백작약이 간액肝液을 수렴하고 완급지통緩急止痛하여 치솟는 간기운을 누르고 통증을 완화함<\/p><p><b>단삼, 천궁<\/b>: 단삼이 거체생신祛滯生新, 통경지통通經止痛하여 요척통증을 풀고 어혈을 제거하며, 천궁이 활혈행기活血行氣, 거풍통락祛風通絡하여 뼈 주변 경락의 어혈을 풀어줌<\/p><p><b>감초<\/b>: 약성을 완화하고 제약을 조화롭게 조절하여 비위 손상을 막는 사약使藥으로 작용함<\/p>"},{"k":"master","t":"장전의 골다공증 치료","html":"<h4>①병인병기 인식 — 신허위본腎虛爲本, 간울비허肝鬱脾虛 및 기체혈어氣滯血瘀의 간, 비, 신 합병<\/h4><p><b>신수충골腎水充骨, 신허腎虛가 발병의 기초<\/b>: 《소문·육절장상론》의 ‘신자腎者, 주칩봉장지본主蟄封藏之本... 기충재골其充在骨’에 근거함. 노화 및 신체 변화로 신기腎氣가 쇠퇴하고 신정腎精이 고갈되면 골수骨髓를 영양하지 못함. 이는 골다공증 발병의 핵심 기초가 됨<\/p><p><b>간목유근肝木有根, 간허肝虛가 관건<\/b>: 호르몬 변화, 노화, 심리적 스트레스는 간음혈肝陰血의 부족과 간울기체肝鬱氣滯를 유발함. 간혈이 부족하면 근맥이 오그라들고 관절 운동이 불리해지며, 수불함목水不涵木으로 골위骨痿가 가중됨<\/p><p><b>비토배육脾土培育, 비허脾虛가 주요 환경<\/b>: 비는 근육과 사지를 관장함. 비위 운화 장애는 기혈 화생을 막아 근골을 기르지 못하며, 현대의학적으로 ‘시상하부-뇌하수체 축’ 이상 및 골 미세순환 장애, 미량원소 흡수 장애와 연결 지어 해석되며, 뼈의 취약성을 높일 수 있다고 봄<\/p><p><b>기체혈어氣滯血瘀<\/b>: 정서 자극과 과도한 생각으로 기기氣機가 체하면 ‘기위혈지수氣爲血之帥’의 원리로 어혈이 형성되어, 고정된 위치의 완고한 요통과 관절통을 유발함<\/p><h4>②치료 원칙 — 소조기기법疏調氣機法 및 ‘일체양익一體兩翼’의 정밀 적용<\/h4><p><b>소조기기 치법의 현대적 의미<\/b>: 전통 ‘팔법八法’ 중 화법和法을 ‘조기調氣’ 중심으로 재해석함. 인체의 기는 선천지기先天之氣, 지기地氣(비위의 기), 천기天氣(폐의 기)의 합성물로, 기기의 승강출입이 원활해야 청탁淸濁이 나누어지고 음양의 균형이 유지된다고 봄<\/p><p>일체양익一體兩翼의 가변적 적용:<\/p><p class=\"sub\"><b>일반 기기 조율<\/b>: 간의 소설疏泄 기능을 체體(몸통)로 삼고, 비의 운화運化와 신의 봉장封藏을 양측 익翼(날개)으로 삼는 ‘간위체肝爲體, 비신위익脾腎爲翼’ 전략을 취함<\/p><p class=\"sub\"><b>골다공증 특화 적용<\/b>: 골격 질환의 특성상 신정휴허腎精虧虛를 체體(몸통)로 삼아 보신익정補腎益精, 전수충골塡髓充骨을 최우선으로 하고, 간과 비의 기기 조율을 익翼(양 날개)으로 삼아 후천을 다스리고 간혈을 기르는 ‘신위체腎爲體, 간비위익肝脾爲翼’ 전략을 구사함<\/p><p class=\"sub\"><b>사역산四逆散 기반의 가감<\/b>: 간비불화肝脾不和를 치료하는 사역산을 통용 기초방으로 삼고, 여기에 골다공증의 병리에 맞춰 보신장골補腎壯骨, 익기활혈益氣活血 약재를 종합적으로 배오함<\/p><h4>③배오의 특징<\/h4><p><b>승강동용升降同用, 간비병조肝脾並調<\/b>: 시호, 향부자, 울금의 간기승발肝氣升發과 백출, 복령, 산약의 비위운화脾胃運化, 하강下降을 결합하여 ‘토득목이달土得木而達’의 기전을 실현함<\/p><p><b>양간보신養肝補腎, 삽정고원澁精固元<\/b>: 숙지황, 골쇄보, 보골지, 음양곽, 녹함초로 정수精髓를 채우고, 산수유로 삽정고원澁精固元하여 정기와 신정을 지키며 수해髓海를 충실히 함<\/p><p><b>기혈쌍보氣血雙補, 중재조기重在調氣<\/b>: 당귀, 황기로 기혈을 보하되 시호, 향부자, 천궁으로 기를 소통시켜 ‘보이불체補而不滯’의 효능을 이룸<\/p><p><b>조창기기調暢氣機, 완급지통緩急止痛<\/b>: 향부자, 울금, 박하로 삼초 기기를 통하게 하고 사역산의 배오를 더해 완급지통의 효능을 극대화함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">골다공증은 국내 고령 인구 증가로 수요가 크며, 골밀도 지표를 이용한 동물 연구로 개발 가능성을 먼저 확인할 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 루자친,왕쥐안,친주.장전의 소조건골탕에 대한 고찰張震疏調健骨湯之淺析[J].후베이중의잡지湖北中醫雜志,2024,46(6):32-35.<\/li><li class=\"ref\">[2] 딩차오양,장진이,샹링옌,등.장전 교수의 “소조기기” 이념에 따른 폐경 후 골다공증 임상 치료 경험張震教授“疏調氣機”理念論治絕經後骨質疏松症臨證經驗[J].중국민족민간의약中國民族民

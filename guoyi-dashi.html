line":"간비불조肝脾不調와 담어호결痰瘀互結로 인한 폐결절肺結節 및 심신실형心身失衡을 치료하는 대표 처방","meta":{"주요 적응증":"폐결절","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":304,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-9 소조소핵탕疏調消核湯의 모듈 구성<\/p><h4>①소간해울疏肝解鬱 및 기기조달氣機調達 모듈 — 간의 소설 기능을 회복하고 전신 기기의 승강을 조율함<\/h4><p><b>시호<\/b>: 기미가 가볍고 승산升散하므로, 소양과 궐음의 기기를 소통하고 해울하는 군약으로서 처방 전체의 주축을 이룸<\/p><p><b>향부자, 울금, 단삼, 천궁, 지실, 백작약<\/b>: 향부자와 울금은 간의 기체를 풀고 해울하며, 단삼과 천궁은 활혈거어活血祛瘀하여 경락의 소통을 돕고, 지실과 백작약은 기의 정체와 간맥의 긴장을 조율하여 울체된 기혈을 소통시킴<\/p><p><b>박하<\/b>: 가볍고 청열하는 성질로 경청선산輕淸宣散하여 약의 기운을 위로 이끌어 약재들이 병소에 도달하도록 도움<\/p><h4>②양신건비養腎健脾 및 선후천고본先後天固本 모듈 — 비의 운화와 신의 정원精元을 보양하여 담음과 어혈의 생화 원천을 차단함<\/h4><p><b>백출, 복령, 산약, 음양곽<\/b>: 백출, 복령, 산약은 비를 보하고 기를 더하며, 음양곽은 온보신양溫補腎陽하여 비와 신의 후천과 선천을 튼튼히 함. 이를 통해 비토를 실하게 하여 간목의 횡역을 막고, 수습이 머물러 담탁으로 변하는 것을 근본적으로 차단함<\/p><h4>③화담산결化痰散結 및 소핵消核 모듈 — 체내에 이미 형성된 담응과 혈어의 덩어리를 부수고 제거함<\/h4><p><b>하고초, 패모, 귤핵, 곤포, 자질려, 누로<\/b>: 하고초와 패모는 청열화담淸熱化痰하고 산결하며, 곤포는 연견화담軟堅化痰함. 귤핵과 자질려는 흉중의 울체된 기를 풀고 오래된 어혈과 적취를 깨뜨리며, 누로는 결절과 울체를 완화하여 병리적 산물의 배출을 보조함<\/p><h4>④조화제약調和諸藥 모듈 — 처방 내 여러 약물의 성질을 조율하고 약력을 부드럽게 이끔<\/h4><p><b>감초<\/b>: 제반 약물의 성질을 조화시키고 독성과 편성을 완화하여 처방 전체가 안정적으로 작용하도록 보조함<\/p>"},{"k":"master","t":"장전의 폐결절 치료","html":"<h4>①병기 인식 — 간울폐조肝鬱肺阻와 비실건운脾失健運으로 인한 담어호결痰瘀互結 및 심신실형心身失衡<\/h4><p>폐결절의 발병은 단순한 신체적 병변에 국한되지 않으며, 환자의 사려과도思慮過度, 우사억울憂思抑鬱, 그리고 결절 진단 후의 암에 대한 공포 등 심리적 압박이 작용하여 간실소설肝失疏泄과 기기울체氣機鬱滯로 이어지는 심신상관의 결과임<\/p><p>간기가 울결하면 폐기의 선강宣降이 장애를 받고, 항진된 간목이 비토脾土를 억누르므로 비가 건운健運 기능을 잃어 수습水濕이 정체되어 담탁으로 변함. 이에 따라 담탁과 혈어가 서로 엉키고 간과 폐의 조화가 깨지면서 폐락肺絡에 응결하여 결절이 형성됨<\/p><p>불안, 우울의 정서 장애와 생리적 병변은 상호 촉진하는 악순환을 형성하므로, 병리적 실체와 심리적 울체를 동시에 다스려야 함<\/p><h4>②치료의 핵심 — ‘일체양익一體兩翼’의 기기 조절<\/h4><p>대사는 인체의 기기를 소통하는 핵심 축을 ‘간을 주체로 하고以肝爲主體, 비와 신을 양 날개로 함脾腎爲兩翼’으로 정립함<\/p><p>소간리기疏肝理氣로 기기의 소통을 주도하고, 건비보신健脾補腎으로 후천과 선천의 본을 도와서, 기체, 혈어, 담응의 병리적 악순환을 근본적으로 타파함<\/p><h4>③심신동치心身同治의 임상 원칙<\/h4><p>결절 치료에 있어 물리적 약물 투여뿐만 아니라, 환자와의 충분한 소통을 통해 정서적 이해를 돕고 감정을 다른 곳으로 유도하는 심리적 개입을 병행하여 정서적 안정을 유도함<\/p><p>환자의 심신이 평화로운 상태에 도달할 때 비로소 기기가 자연스럽게 소통되고 기혈이 조화되어 결절이 스스로 소산됨<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">폐결절은 국내 검진 확대로 추적 관찰 환자가 많아 수요가 크며, 공개자료상 중국 제품이 확인되지 않아 국내 관찰연구로 근거를 먼저 쌓을 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 니훙민,쉐옌,친주.국의대사 장전의 소조소핵탕의 심신논치에 기반한 폐결절 치료 방증 연구基於國醫大師張震疏調消核湯從心身論治肺結節的方證研究[J].윈난중 의약대학학보雲南中醫藥大學學報,2025,48(3):5-9.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"하고초","name":"하고초","dose":"","base":"하고초"},{"raw":"浙패모","name":"浙패모","dose":"","base":"패모"},{"raw":"시호","name":"시호","dose":"","base":"시호"},{"raw":"백작약","name":"백작약","dose":"","base":"백작약"},{"raw":"단삼","name":"단삼","dose":"","base":"단삼"},{"raw":"박하","name":"박하","dose":"","base":"박하"},{"raw":"지실","name":"지실","dose":"","base":"지실"},{"raw":"울금","name":"울금","dose":"","base":"울금"},{"raw":"천궁","name":"천궁","dose":"","base":"천궁"},{"raw":"향부자","name":"향부자","dose":"","base":"향부자"},{"raw":"복령","name":"복령","dose":"","base":"복령"},{"raw":"산약","name":"산약","dose":"","base":"산약"},{"raw":"백출","name":"백출","dose":"","base":"백출"},{"raw":"감초","name":"감초","dose":"","base":"감초"},{"raw":"음양곽","name":"음양곽","dose":"","base":"음양곽"},{"raw":"귤핵","name":"귤핵","dose":"","base":"귤핵"},{"raw":"곤포","name":"곤포","dose":"","base":"곤포"},{"raw":"자질려","name":"자질려","dose":"","base":"자질려"},{"raw":"누로漏蘆","name":"누로漏蘆","dose":"","base":"누로"}],"notes":[],"핵심 효능":["간을 주체로 하여 기기를 소통하고 조절함(소간리기疏肝理氣, 소조기기疏調氣機)","담을 화하고 어혈을 흩어 뭉친 것을 풀어줌(화담산결化痰散結, 소산어체消散瘀滯)","심신을 함께 다스려 기혈의 조화를 도모함(심신동치心身同治, 기혈화합氣血和合)"],"주치증":["폐결절, 징가결절癥瘕結節, 정지내상情志內傷으로 인한 흉민 및 우울抑鬱, 폐적肺積, 담핵痰核, 나력瘰癧 등"],"연구 확장 영역":["폐결절 및 각종 양성 또는 초기 악성 종양, 심신질환에 수반되는 만성 호흡기 질환, 정지불서情志不舒로 인한 기기울체氣機鬱滯 제반 질환"],"R&D 포인트":["시호, 향부자, 울금 등의 배합이 발휘하는 소간해울疏肝解鬱 및 기기조율 메커니즘","‘일체양익一體兩翼’ 이론에 따른 간, 비, 신 조화를 통한 전신 기혈 순환 개선","화담산결化痰散結 약물(하고초, 浙패모, 곤포, 귤핵 등)의 결절 억제 및 고 해울하며, 단삼과 천궁은 활혈거어活血祛瘀하여 경락의 소통을 돕고, 지실과 백작약은 기의 정체와 간맥의 긴장을 조율하여 울체된 기혈을 소통시킴 박하 : 가볍고 청열하는 성질로 경청선산輕淸宣散하여 약의 기운을 위로 이끌어 약재들이 병소에 도달하도록 도움 ②양신건비養腎健脾 및 선후천고본先後天固本 모듈 — 비의 운화와 신의 정원精元을 보양하여 담음과 어혈의 생화 원천을 차단함 백출, 복령, 산약, 음양곽 : 백출, 복령, 산약은 비를 보하고 기를 더하며, 음양곽은 온보신양溫補腎陽하여 비와 신의 후천과 선천을 튼튼히 함. 이를 통해 비토를 실하게 하여 간목의 횡역을 막고, 수습이 머물러 담탁으로 변하는 것을 근본적으로 차단함 ③화담산결化痰散結 및 소핵消核 모듈 — 체내에 이미 형성된 담응과 혈어의 덩어리를 부수고 제거함 하고초, 패모, 귤핵, 곤포, 자질려, 누로 : 하고초와 패모는 청열화담淸熱化痰하고 산결하며, 곤포는 연견화담軟堅化痰함. 귤핵과 자질려는 흉중의 울체된 기를 풀고 오래된 어혈과 적취를 깨뜨리며, 누로는 결절과 울체를 완화하여 병리적 산물의 배출을 보조함 ④조화제약調和諸藥 모듈 — 처방 내 여러 약물의 성질을 조율하고 약력을 부드럽게 이끔 감초 : 제반 약물의 성질을 조화시키고 독성과 편성을 완화하여 처방 전체가 안정적으로 작용하도록 보조함","master":"①병기 인식 — 간울폐조肝鬱肺阻와 비실건운脾失健運으로 인한 담어호결痰瘀互結 및 심신실형心身失衡 폐결절의 발병은 단순한 신체적 병변에 국한되지 않으며, 환자의 사려과도思慮過度, 우사억울憂思抑鬱, 그리고 결절 진단 후의 암에 대한 공포 등 심리적 압박이 작용하여 간실소설肝失疏泄과 기기울체氣機鬱滯로 이어지는 심신상관의 결과임 간기가 울결하면 폐기의 선강宣降이 장애를 받고, 항진된 간목이 비토脾土를 억누르므로 비가 건운健運 기능을 잃어 수습水濕이 정체되어 담탁으로 변함. 이에 따라 담탁과 혈어가 서로 엉키고 간과 폐의 조화가 깨지면서 폐락肺絡에 응결하여 결절이 형성됨 불안, 우울의 정서 장애와 생리적 병변은 상호 촉진하는 악순환을 형성하므로, 병리적 실체와 심리적 울체를 동시에 다스려야 함 ②치료의 핵심 — ‘일체양익一體兩翼’의 기기 조절 대사는 인체의 기기를 소통하는 핵심 축을 ‘간을 주체로 하고以肝爲主體, 비와 신을 양 날개로 함脾腎爲兩翼’으로 정립함 소간리기疏肝理氣로 기기의 소통을 주도하고, 건비보신健脾補腎으로 후천과 선천의 본을 도와서, 기체, 혈어, 담응의 병리적 악순환을 근본적으로 타파함 ③심신동치心身同治의 임상 원칙 결절 치료에 있어 물리적 약물 투여뿐만 아니라, 환자와의 충분한 소통을 통해 정서적 이해를 돕고 감정을 다른 곳으로 유도하는 심리적 개입을 병행하여 정서적 안정을 유도함 환자의 심신이 평화로운 상태에 도달할 때 비로소 기기가 자연스럽게 소통되고 기혈이 조화되어 결절이 스스로 소산됨","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 폐결절은 국내 검진 확대로 추적 관찰 환자가 많아 수요가 크며, 공개자료상 중국 제품이 확인되지 않아 국내 관찰연구로 근거를 먼저 쌓을 수 있음 참고문헌 [1] 니훙민,쉐옌,친주.국의대사 장전의 소조소핵탕의 심신논치에 기반한 폐결절 치료 방증 연구基於國醫大師張震疏調消核湯從心身論治肺結節的方證研究[J].윈난중 의약대학학보雲南中醫藥大學學報,2025,48(3):5-9."}},{"id":"5-10","ko":"청폐지해탕","hz":"淸肺止咳湯","alias":"","master_ko":"거린이","master_hz":"葛琳儀","tagline":"청법淸法으로 폐락肺絡의 담어痰瘀와 풍사風邪를 다스려 기침 이형 천식을 치료하는 처방","meta":{"주요 적응증":"기침 이형 천식","확인된 연구자료 유형":"연구 축적 (논문 26편)","제형·제품화":"—"},"page":308,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-10 청폐지해탕淸肺止咳湯의 모듈 구성<\/p><h4>①청폐선강淸肺宣降 모듈 — 폐열을 내리고 폐기를 소통시켜 기기를 하강시킴<\/h4><p><b>금은화, 연교, 황금, 포공영, 야교맥근<\/b>: 폐 중의 울열과 화독을 청열해독하여 억제함<\/p><p><b>전호, 길경, 행인, 浙패모, 炒소자<\/b>: 폐기를 선통하고 강기화담降氣化痰하여 폐의 승강 기능을 바로잡음<\/p><p><b>장청과<\/b>: 상초의 열을 내리고 인후를 윤택하게 함<\/p><h4>②화담거어化痰祛瘀 모듈 — 담탁과 어혈을 제거하여 폐락의 소통을 회복함<\/h4><p><b>薑반하, 진피<\/b>: 조습화담燥濕化痰하여 기기의 상역을 막고 담탁을 제거함<\/p><p><b>단삼<\/b>: 청열양혈淸熱涼血, 활혈거어活血祛瘀하여 폐락의 어혈을 해소함<\/p><h4>③거풍지해祛風止咳 모듈 — 폐락에 잠복한 풍사를 제거하고 경련을 완화함<\/h4><p><b>서장경, 강잠<\/b>: 거풍제습祛風除濕, 식풍지경息風止痙하여 폐락의 풍사를 제거하고 기침을 멎게 함<\/p>"},{"k":"master","t":"거린이의 기침 이형 천식 치료","html":"<h4>①병인병기 인식<\/h4><p><b>폐계질환, 병성다온열病性多溫熱<\/b>: 《삼소론三消論》의 “폐본청肺本淸, 허즉온虛則溫”을 바탕으로, 폐는 본래 청허하고 가벼운 성질이나 폐허내인肺虛內因과 외사침입, 울이화열鬱而化熱 등으로 인해 온열조화溫熱燥火의 병성을 띰<\/p><p><b>사심입폐락邪深入肺絡, 폐기선강실사肺氣宣降失司<\/b>: 병사가 폐락에 깊숙이 자리 잡아 폐락이 경련하고 구급拘急해지며, 폐기肺氣의 승강출입 기능이 장애를 받음<\/p><p><b>풍복어폐락風伏於肺絡, 증상돌기선변症狀突起善變<\/b>: 풍사가 폐락에 잠복하여 ‘선행삭변善行數變’의 특성을 보이며, 외인에 의해 쉽게 유발되어 발작적이고 완고한 기침인 완해頑咳를 일으킴<\/p><p><b>이생담어易生痰瘀, 사복폐락邪伏肺絡<\/b>: 폐기울체肺氣鬱滯와 진액 정체로 담탁과 어혈이 내생하여 폐락에 정체되며, 이것이 장시간 낫지 않아 숙근宿根이 됨<\/p><p><b>병구락허病久絡虛, 이기음수손易氣陰受損<\/b>: 장기적인 병세로 정기가 손상되고 낙허絡虛가 초래되며, 폐의 기음양허氣陰兩虛 상태로 이행함<\/p><h4>②치료원칙 — 청법淸法을 치료원칙으로 삼음<\/h4><p>《소문·지진요대론편》의 “온자청지溫者淸之”를 근거로, 청법淸法을 치료 대원칙으로 삼아 전 과정에 관통시키고 폐락肺絡을 병위病位로 삼음<\/p><h4>③단계별 치법<\/h4><p><b>청선청강淸宣淸降(초기 및 외감 유발기)<\/b>: 청열해독으로 폐열을 끄고, 선강宣降법을 합하여 폐기를 소통시키며 승강 기능을 바로잡음<\/p><p><b>화담어化痰瘀, 거풍사祛風邪(만성 및 복사기)<\/b>: 화담거어化痰祛瘀로 폐락의 미세환경을 개선하고, 신산거풍辛散祛風약물로 폐락에 잠복한 풍사를 제거하여 기도 과민성을 제어함<\/p><p><b>청윤청보淸潤淸補(후기 및 회복기)<\/b>: 공보겸시攻補兼施와 경중유도輕重有度를 바탕으로, 가벼운 청윤 및 청보 약물 (사삼, 맥문동, 옥죽, 오매 등)을 투여하여 기음을 보호하고 폐락을 적셔 재발의 근원을 차단함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"evidence","t":"최근 연구 동향 및 과학적 근거","html":"<h4>①연구 규모 및 정량적 위상<\/h4><div class=\"tbl\"><table><thead><tr><th>Total Papers(15yrs)<\/th><th>Recent Focus(5yrs)<\/th><\/tr><\/thead><tbody><tr><td>총 26 편 발표<\/td><td>최근 5 년간 6편 발표<\/td><\/tr><\/tbody><\/table><\/div><h4>②연구 키워드로 본 R&amp;D 가이던스(최근 5개년 분석)<\/h4><div class=\"tbl\"><table><thead><tr><th>구분<\/th><th>핵심 키워드<\/th><th>R&amp;D 인사이트<\/th><\/tr><\/thead><tbody><tr><td class=\"k\">주치증<\/td><td><span class=\"kw\">기침 이형 천식<\/span> <span class=\"kw\">소아 마이코플라스마 폐렴<\/span> <span class=\"kw\">소아 담열옹폐증痰熱壅肺證 기침<\/span> <span class=\"kw\">만성 폐쇄성 폐질환 급성 악화기<\/span><\/td><td>호흡기 질환 관리에 집중하며, 청법淸法 기반의 담열痰熱제거 및 소아 호흡기 감염·기침 이형 천식으로 적응증 확장 연구<\/td><\/tr><tr><td class=\"k\">병용 전략<\/td><td><span class=\"kw\">양약 병용 치료<\/span> <span class=\"kw\">명로중의 경험 처방 응용<\/span><\/td><td>양약 단독 투여 때의 한계를 보완하는 중서의 결합 효과 증대 전략 및 명의 처방의 임상 활용성 검토<\/td><\/tr><tr><td class=\"k\">평가 지표<\/td><td><span class=\"kw\">TNF-α<\/span> <span class=\"kw\">IL-6<\/span> <span class=\"kw\">IL-17 염증성 사이토카인<\/span> <span class=\"kw\">임상 증상 개선 및 안전성 지표<\/span><\/td><td>객관적 바이오마커를 통한 소아 및 성인 환자의 염증 반응 억제, 반응성 정량화 연구 활성화<\/td><\/tr><tr><td class=\"k\">방법론<\/td><td><span class=\"kw\">네트워크 약리학<\/span> <span class=\"kw\">동물 실험<\/span> <span class=\"kw\">임상 효능 검증<\/span><\/td><td>다중 성분-다중 타깃(Multi-target)의 복합 기전 규명 고도화 및 체외·체내·임상 검증 통합 연구 체계 구축<\/td><\/tr><\/tbody><\/table><\/div><h4>③High-Impact 연구 하이라이트(2025-2026 최신 연구)<\/h4><p class=\"row\">TLR4/MyD88/NF-κB 경로 통한 기침 이형 천식 개선 기전 <b>2026, 袁曉 등<\/b><\/p><p>UPLC-Q-TOF-MS 분석과 성분-표적 네트워크를 통해 임페리알린(Imperialine), 바이칼레인(Baicalein) 등 핵심 성분을 확인하고, TLR4/MyD88/NF-κB 신호전달경로 억제를 통해 염증성 사이토카인을 감소시켜 기도 염증과 기도 과민성을 완화함<\/p><p><b>의미<\/b> 청폐지해탕이 기침 이형 천식을 치료하는 다성분·다표적·다경로 복합 기전을 예측하고 주요 염증 신호 경로의 조절 효과를 동물 모델에서 확인<\/p><p class=\"row\">‘청법’ 기반 변증 체계 및 임상 치료 경험 <b>2025, 高天 등<\/b><\/p><p>“폐본청肺本淸, 허즉온虛則溫” 및 “구병입락久病入絡” 이론에 기반하여 폐락울열肺絡鬱熱과 담어풍사痰瘀風邪를 기침 이형 천식의 핵심 병기로 진단하고, 청선淸宣·청강淸降·청윤淸潤·청보淸補의 ‘청법淸法’으로 단계별 변증 치료를 시행함<\/p><p><b>의미<\/b> 양약 치료 시 우려되는 부작용과 내성 한계를 극복하고, “이청위법以淸爲法, 통락지해通絡止咳”의 중의학적 변증 치료 체계와 국의대사의 임상 유효성을 확립함<\/p><p class=\"row\">CVA 모델 대상 네트워크 약리학 및 폐 조직 보호 기전 <b>2025, 鄒存希<\/b><\/p><p>청폐지해탕의 18개 주요 활성 성분과 TNF, AKT1, TLR4 등 핵심 표적을 발굴하고, CVA 동물 모델에서 폐 조직 초미세구조 손상 개선 및 TLR4/MyD88/NF-κB 단백질 발현 억제 효과를 확인함<\/p><p><b>의미<\/b> 청폐지해탕의 물질적 기초(약효 성분)와 병리 조직학적 보호 효과를 동물 모델에서 확인하여 기침 이형 천식 임상 응용을 위한 학술적·실험적 근거를 제공함<\/p>"},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">연구 축적(26편)에도 공개자료상 제품·특허가 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 이미 제품화된 소황지해캡슐과 증형을 나누면 중국 제품과의 경쟁을 피할 수 있음. 국내 공정서(약전·규격집)에 없는 장청과·야교맥근이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 가오톈,뤄춘,천산산,등.국의대사 거린이의 청법에 따른 기침 이형 천식 변증 치료 경험 채록國醫大師葛琳儀淸法辨治咳嗽變異性哮喘經驗采擷[J].중의임상 연구中醫臨床研究,2025,17(24):32-36.<\/li><li class=\"ref\">[2] 위안샤오,쩌우춘시,저우린수이,등.네트워크 약리학과 실험 검증에 기반한 국의대사 거린이의 청폐지해탕 기침 이형 천식 치료 기전 탐구基於網絡藥理學和實驗驗證探討國醫大師葛琳儀淸肺止咳湯治療咳嗽變異性哮喘的機制[J].저장중의약대학학보浙江中醫藥大學學報,2026,50(6):672-687.<\/li><li class=\"ref\">[3] 저우춘시.네트워크 약리학과 동물실험에 기반한 청폐지해탕의 기침 이형 천식 치료 작용기전 연구基於網絡藥理學和動物實驗研究淸肺止咳湯治療咳嗽變異型哮喘的作用機制[D].저장중의약대학浙江中醫藥大學,2025.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"금은화","name":"금은화","dose":"","base":"금은화"},{"raw":"연교","name":"연교","dose":"","base":"연교"},{"raw":"황금","name":"황금","dose":"","base":"황금"},{"raw":"포공영","name":"포공영","dose":"","base":"포공영"},{"raw":"야교맥근野蕎麥根","name":"야교맥근野蕎麥根","dose":"","base":"야교맥근"},{"raw":"전호","name":"전호","dose":"","base":"전호"},{"raw":"길경","name":"길경","dose":"","base":"길경"},{"raw":"苦행인","name":"苦행인","dose":"","base":"행인"},{"raw":"浙패모","name":"浙패모","dose":"","base":"패모"},{"raw":"炒소자","name":"炒소자","dose":"","base":"소자"},{"raw":"장청과藏靑果","name":"장청과藏靑果","dose":"","base":"장청과"},{"raw":"사간","name":"사간","dose":"","base":"사간"},{"raw":"薑반하","name":"薑반하","dose":"","base":"반하"},{"raw":"진피","name":"진피","dose":"","base":"진피"},{"raw":"서장경","name":"서장경","dose":"","base":"서장경"},{"raw":"강잠","name":"강잠","dose":"","base":"강잠"},{"raw":"단삼","name":"단삼","dose":"","base":"단삼"}],"notes":[],"핵심 효능":["폐의 열을 내리고 화독을 제거함(청폐설열淸肺泄熱)","폐기를 소통시키고 담을 삭여 제거함(선폐화담宣肺化痰)","담탁과 어혈을 제거함(화담거어化痰祛瘀)","풍사를 몰아내고 기침을 멎게 함(거풍지해祛風止咳)"],"주치증":["기침 이형 천식, 완해頑咳, 천해喘咳, 창해嗆咳의 담열온폐痰熱蘊肺, 풍사복락증風邪伏絡證"],"연구 확장 영역":["감염 후 기침, 만성 기침, 상기도 감염, 알레르기성 비염 동반 기침 질환"],"R&D 포인트":["금은화, 연교, 황금, 포공영, 야교맥근의 복합 배합을 통한 폐중울열 차단 및 다양한 염증성 사이토카인에 대한 조절 효과를 검증할 천연물 후보 소재","단삼, 浙패모, 강반하 등의 활혈거어活血祛瘀 및 조습화담燥濕化痰 작용을 통한 폐락肺絡의 미세환경 개선","서장경, 강잠의 거풍지경祛風止痙 작용을 통한 기도 과민성 및 알레르기 반응 억제"]},"modules":[{"name":"①청폐선강","hz":"淸肺宣降","herbs":["야교맥근","전호","길경","행인","浙패모","炒소자","장청과"],"role":"폐열을 내리고 폐기를 소통시켜 기기를 하강시킴"},{"name":"②화담거어","hz":"化痰祛瘀","herbs":["薑반하","진피","단삼"],"role":"담탁과 어혈을 제거하여 폐락의 소통을 회복함"},{"name":"③거풍지해","hz":"祛風止咳","herbs":["서장경","강잠"],"role":"폐락에 잠복한 풍사를 제거하고 경련을 완화함"}],"rd":[{"tag":"TLR4/MyD88/NF-κB & Markers","title":"패모·황금 지표성분 기반 기전과 품질 표준화","html":"<p>UPLC-Q-TOF-MS 분석으로 임페리알린(절패모)·바이칼레인(황금) 등 핵심 성분을 확인하고 TLR4/MyD88/NF-κB 경로 조절을 동물 모델에서 확인했음<\/p><p>이 두 성분을 지표성분 후보로 삼을 수 있으나, 17미 처방 전체의 효능을 대표하는지는 성분–효력 상관 검증 뒤에 판단해야 함<\/p><p><b>검증 설계<\/b> OVA+캡사이신 유도 기침 이형 천식 모델에서 처방 전체와 지표성분 조합의 효과를 비교하고, 임페리알린·바이칼레인 함량 규격(HPLC)을 설정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [2](2026, 네트워크 약리학·실험 검증)<\/p>"},{"tag":"Airway Protection","title":"폐 조직 초미세구조 보호와 기도 리모델링","html":"<p>18개 활성 성분과 TNF·AKT1·TLR4 등 핵심 표적을 도출하고 동물 모델에서 폐 조직 초미세구조 손상을 개선했음<\/p><p>기침 억제를 넘어 기도 리모델링(평활근 비후·콜라겐 침착) 억제를 차별화 지표로 설정<\/p><p><b>검증 설계<\/b> 장기 감작 모델에서 기도 벽 두께·평활근 면적·콜라겐 침착을 측정하고, 임상에서는 기도 과민성(메타콜린 유발 시험) 변화를 2차 지표로 설정<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 참고문헌 [3](2025, 네트워크 약리학·동물 실험)<\/p>"},{"tag":"Phenotype Positioning","title":"소황지해탕과의 증형별 역할 구분","html":"<p>같은 기침 이형 천식을 다루는 소황지해탕이 ‘풍사범폐(마른기침·인후 가려움)’를 대상으로 한다면, 청폐지해탕은 ‘폐락울열·담열(누런 가래·인후통)’을 대상으로 함<\/p><p>두 처방을 증형별로 나누어 적용하는 비교 연구가 국내 기침 치료 지침 개발에 직접 활용 가능<\/p><p><b>검증 설계<\/b> 기침 이형 천식 환자를 풍사형·담열형으로 분류한 뒤 증형-처방 일치군과 불일치군의 반응률을 비교하는 실용 임상<\/p><p class=\"row\">근거 <span class=\"chip\">임상 경험 보고<\/span> 참고문헌 [1](2025, 청법 변증 치료 경험), 본문 소황지해탕 항목<\/p>"},{"tag":"Pediatric Respiratory","title":"소아 마이코플라스마 폐렴 회복기 기침","html":"<p>본문 연구 동향에 소아 마이코플라스마 폐렴과 소아 담열옹폐 기침이 포함되어 있음<\/p><p>표준 항생제 치료를 마친 뒤 남는 기침의 회복 기간 단축을 목표로 하는 소아용 제형을 검토할 수 있으며(한약이 마크롤라이드 내성 문제를 해결한다는 의미는 아님), 서장경 등 17종 구성의 소아 안전성 검토가 전제<\/p><p><b>검증 설계<\/b> 항생제 치료를 마친 소아 환자에서 기침 소실 기간과 재입원율을 지표로 한 무작위 대조, 소아용 과립 제형 맛·순응도 평가 병행<\/p><p class=\"row\">근거 <span class=\"chip\">직접 연구 근거<\/span> 본문 「주치증」·「병용 전략」 표<\/p>"}],"logic":[{"n":"1","title":"청폐선강淸肺宣降과 열독제어熱毒制禦","body":"폐 중의 울열鬱熱과 화독火毒을 청열해독하고 폐의 승강 기능을 바로잡음"},{"n":"2","title":"화담거어化痰祛瘀와 폐락肺絡의 개선","body":"조습화담燥濕化痰과 활혈거어를 통해 담탁痰濁과 어혈을 제거하고 폐락의 소통을 회복함"},{"n":"3","title":"거풍지해祛風止咳와 경련완화","body":"폐락에 잠복한 풍사風邪를 제거하고 기도 과민성을 제어하여 기침을 멈춤"},{"n":"4","title":"병성다온열病性多溫熱과 온자청지溫者淸之","body":"폐의 온열조화 병성에 대응하여 청법을 전 과정에 관통시켜 근본을 다스림"}],"field":5,"pages":[308,313],"evidence":"연구 축적 (논문 26편)","product":"—","status":"확인된 제품·특허 없음","s":["5-10","청폐지해탕","淸肺止咳湯","","거린이","葛琳儀","청법淸法으로 폐락肺絡의 담어痰瘀와 풍사風邪를 다스려 기침 이형 천식을 치료하는 처방","금은화 연교 황금 포공영 야교맥근野蕎麥根 전호 길경 苦행인 浙패모 炒소자 장청과藏靑果 사간 薑반하 진피 서장경 강잠 단삼","","핵심 효능 폐의 열을 내리고 화독을 제거함(청폐설열淸肺泄熱) 폐기를 소통시키고 담을 삭여 제거함(선폐화담宣肺化痰) 담탁과 어혈을 제거함(화담거어化痰祛瘀) 풍사를 몰아내고 기침을 멎게 함(거풍지해祛風止咳)","주치증 기침 이형 천식, 완해頑咳, 천해喘咳, 창해嗆咳의 담열온폐痰熱蘊肺, 풍사복락증風邪伏絡證","연구 확장 영역 감염 후 기침, 만성 기침, 상기도 감염, 알레르기성 비염 동반 기침 질환","R&D 포인트 금은화, 연교, 황금, 포공영, 야교맥근의 복합 배합을 통한 폐중울열 차단 및 다양한 염증성 사이토카인에 대한 조절 효과를 검증할 천연물 후보 소재 단삼, 浙패모, 강반하 등의 활혈거어活血祛瘀 및 조습화담燥濕化痰 작용을 통한 폐락肺絡의 미세환경 개선 서장경, 강잠의 거풍지경祛風止痙 작용을 통한 기도 과민성 및 알레르기 반응 억제","①청폐선강 淸肺宣降 야교맥근 전호 길경 행인 浙패모 炒소자 장청과 폐열을 내리고 폐기를 소통시켜 기기를 하강시킴","②화담거어 化痰祛瘀 薑반하 진피 단삼 담탁과 어혈을 제거하여 폐락의 소통을 회복함","③거풍지해 祛風止咳 서장경 강잠 폐락에 잠복한 풍사를 제거하고 경련을 완화함","청폐선강淸肺宣降과 열독제어熱毒制禦 폐 중의 울열鬱熱과 화독火毒을 청열해독하고 폐의 승강 기능을 바로잡음","화담거어化痰祛瘀와 폐락肺絡의 개선 조습화담燥濕化痰과 활혈거어를 통해 담탁痰濁과 어혈을 제거하고 폐락의 소통을 회복함","거풍지해祛風止咳와 경련완화 폐락에 잠복한 풍사風邪를 제거하고 기도 과민성을 제어하여 기침을 멈춤","병성다온열病性多溫熱과 온자청지溫者淸之 폐의 온열조화 병성에 대응하여 청법을 전 과정에 관통시켜 근본을 다스림","TLR4/MyD88/NF-κB & Markers 패모·황금 지표성분 기반 기전과 품질 표준화 UPLC-Q-TOF-MS 분석으로 임페리알린(절패모)·바이칼레인(황금) 등 핵심 성분을 확인하고 TLR4/MyD88/NF-κB 경로 조절을 동물 모델에서 확인했음 이 두 성분을 지표성분 후보로 삼을 수 있으나, 17미 처방 전체의 효능을 대표하는지는 성분–효력 상관 검증 뒤에 판단해야 함 淸之”를 근거로, 청법淸法을 치료 대원칙으로 삼아 전 과정에 관통시키고 폐락肺絡을 병위病位로 삼음 ③단계별 치법 청선청강淸宣淸降(초기 및 외감 유발기) : 청열해독으로 폐열을 끄고, 선강宣降법을 합하여 폐기를 소통시키며 승강 기능을 바로잡음 화담어化痰瘀, 거풍사祛風邪(만성 및 복사기) : 화담거어化痰祛瘀로 폐락의 미세환경을 개선하고, 신산거풍辛散祛風약물로 폐락에 잠복한 풍사를 제거하여 기도 과민성을 제어함 청윤청보淸潤淸補(후기 및 회복기) : 공보겸시攻補兼施와 경중유도輕重有度를 바탕으로, 가벼운 청윤 및 청보 약물 (사삼, 맥문동, 옥죽, 오매 등)을 투여하여 기음을 보호하고 폐락을 적셔 재발의 근원을 차단함","rd":"","evidence":"①연구 규모 및 정량적 위상 Total Papers(15yrs) Recent Focus(5yrs) 총 26 편 발표 최근 5 년간 6편 발표 ②연구 키워드로 본 R&D 가이던스(최근 5개년 분석) 구분 핵심 키워드 R&D 인사이트 주치증 기침 이형 천식 소아 마이코플라스마 폐렴 소아 담열옹폐증痰熱壅肺證 기침 만성 폐쇄성 폐질환 급성 악화기 호흡기 질환 관리에 집중하며, 청법淸法 기반의 담열痰熱제거 및 소아 호흡기 감염·기침 이형 천식으로 적응증 확장 연구 병용 전략 양약 병용 치료 명로중의 경험 처방 응용 양약 단독 투여 때의 한계를 보완하는 중서의 결합 효과 증대 전략 및 명의 처방의 임상 활용성 검토 평가 지표 TNF-α IL-6 IL-17 염증성 사이토카인 임상 증상 개선 및 안전성 지표 객관적 바이오마커를 통한 소아 및 성인 환자의 염증 반응 억제, 반응성 정량화 연구 활성화 방법론 네트워크 약리학 동물 실험 임상 효능 검증 다중 성분-다중 타깃(Multi-target)의 복합 기전 규명 고도화 및 체외·체내·임상 검증 통합 연구 체계 구축 ③High-Impact 연구 하이라이트(2025-2026 최신 연구) TLR4/MyD88/NF-κB 경로 통한 기침 이형 천식 개선 기전 2026, 袁曉 등 UPLC-Q-TOF-MS 분석과 성분-표적 네트워크를 통해 임페리알린(Imperialine), 바이칼레인(Baicalein) 등 핵심 성분을 확인하고, TLR4/MyD88/NF-κB 신호전달경로 억제를 통해 염증성 사이토카인을 감소시켜 기도 염증과 기도 과민성을 완화함 의미 청폐지해탕이 기침 이형 천식을 치료하는 다성분·다표적·다경로 복합 기전을 예측하고 주요 염증 신호 경로의 조절 효과를 동물 모델에서 확인 ‘청법’ 기반 변증 체계 및 임상 치료 경험 2025, 高天 등 “폐본청肺本淸, 허즉온虛則溫” 및 “구병입락久病入絡” 이론에 기반하여 폐락울열肺絡鬱熱과 담어풍사痰瘀風邪를 기침 이형 천식의 핵심 병기로 진단하고, 청선淸宣·청강淸降·청윤淸潤·청보淸補의 ‘청법淸法’으로 단계별 변증 치료를 시행함 의미 양약 치료 시 우려되는 부작용과 내성 한계를 극복하고, “이청위법以淸爲法, 통락지해通絡止咳”의 중의학적 변증 치료 체계와 국의대사의 임상 유효성을 확립함 CVA 모델 대상 네트워크 약리학 및 폐 조직 보호 기전 2025, 鄒存希 청폐지해탕의 18개 주요 활성 성분과 TNF, AKT1, TLR4 등 핵심 표적을 발굴하고, CVA 동물 모델에서 폐 조직 초미세구조 손상 개선 및 TLR4/MyD88/NF-κB 단백질 발현 억제 효과를 확인함 의미 청폐지해탕의 물질적 기초(약효 성분)와 병리 조직학적 보호 효과를 동물 모델에서 확인하여 기침 이형 천식 임상 응용을 위한 학술적·실험적 근거를 제공함","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 연구 축적(26편)에도 공개자료상 제품·특허가 확인되지 않아 국내 개발을 검토할 가치가 있는 처방이며, 이미 제품화된 소황지해캡슐과 증형을 나누면 중국 제품과의 경쟁을 피할 수 있음. 국내 공정서(약전·규격집)에 없는 장청과·야교맥근이 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 가오톈,뤄춘,천산산,등.국의대사 거린이의 청법에 따른 기침 이형 천식 변증 치료 경험 채록國醫大師葛琳儀淸法辨治咳嗽變異性哮喘經驗采擷[J].중의임상 연구中醫臨床研究,2025,17(24):32-36. [2] 위안샤오,쩌우춘시,저우린수이,등.네트워크 약리학과 실험 검증에 기반한 국의대사 거린이의 청폐지해탕 기침 이형 천식 치료 기전 탐구基於網絡藥理學和實驗驗證探討國醫大師葛琳儀淸肺止咳湯治療咳嗽變異性哮喘的機制[J].저장중의약대학학보浙江中醫藥大學學報,2026,50(6):672-687. [3] 저우춘시.네트워크 약리학과 동물실험에 기반한 청폐지해탕의 기침 이형 천식 치료 작용기전 연구基於網絡藥理學和動物實驗研究淸肺止咳湯治療咳嗽變異型哮喘的作用機制[D].저장중의약대학浙江中醫藥大學,2025."}},{"id":"5-11","ko":"선복하마작초탕","hz":"旋覆夏麻芍草湯","alias":"","master_ko":"주량춘","master_hz":"朱良春","tagline":"선강법宣降法과 산렴법散斂法의 병용 및 폐위동치肺胃同治 원리로 외감 풍한과 소아 기침 이형 천식을 치료하는 처방","meta":{"주요 적응증":"만성 기침, 소아 기침 이형 천식","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":314,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-11 선복하마작초탕旋覆夏麻芍草湯의 모듈 구성<\/p><h4>①선강법宣降法 모듈 — 폐기를 선통하고 상역하는 기기를 내림<\/h4><p><b>선복화, 生반하, 생강<\/b>: 신개辛開 작용으로 울체된 기를 열어 통하게 하고, 상역하는 기기를 내리며, 소담消痰, 하기下氣, 연견軟堅, 행수行水하며 마황을 도와 폐기를 피모까지 도달하게 함<\/p><p><b>生마황<\/b>: 경량으로 사용하여 외감의 풍한을 풀고 폐기를 소통시킴<\/p><h4>②산렴법散斂法 모듈 — 기를 수렴하고 기관지 평활근 경련을 완화함<\/h4><p><b>生백작약, 감초<\/b>: 산감화음酸甘化陰하여 폐의 진액을 보충하고 가볍게 폐기를 수렴하며, 기관지 평활근 경련을 완화하여 염폐지해斂肺止咳 작용을 함<\/p><h4>③폐위동치肺胃同治 및 이수화담利水化痰 모듈 — 위의 수음이 상역하는 것을 막고 담탁과 수습을 배출하여 폐와 위를 함께 다스림<\/h4><p><b>복령, 生반하, 생강(선강법 모듈과 연계)<\/b>: 위에 모인 수음水飮과 담연痰涎을 다스려 “담연 또는 수음이 위에 모이고, 폐와 관련된다”는 기침의 근본 병기를 치료하고 이수행수利水行水함<\/p>"},{"k":"master","t":"주량춘의 기침 이형 천식 치료","html":"<h4>①병인병기 인식<\/h4><p><b>풍한구해風寒久咳와 폐기울폐肺氣鬱閉<\/b>: 외감 풍한이 오래도록 풀리지 않거나 오치誤治로 인하여 풍한이 폐에 울폐되면, 폐기의 선발宣發과 숙강肅降 기능이 저해되어 기침이 지속됨<\/p><p><b>담연수음痰涎水飮의 내정內停<\/b>: 담연 또는 수음이 위중에 모여, 폐를 침범하여 기침을 일으킴<\/p><h4>②치료원칙<\/h4><p><b>병증결합病證結合과 폐위동치肺胃同治<\/b>: 중의의 변증과 현대의 기침 이형 천식 진단을 결합하고, 장중경의 4가지 처방 (선복대자탕, 소반하가복령탕, 작약감초탕, 감초마황탕)을 융합하여 폐와 위를 동시에 치료함<\/p><p><b>선강결합宣降結合과 산렴병용散斂並用<\/b>: 선산과 강역을 병행하고 발산과 수렴을 겸하여 낫지 않는 완해頑咳를 치료함<\/p><p><b>경청선폐輕淸宣肺<\/b>: “상초여우上焦如羽, 비경불거非輕不擧”의 원칙에 따라 가벼운 약물을 사용하여 상초를 소통시키고 폐기의 선발宣發을 회복시킴<\/p><h4>③단계별 및 맞춤 치료<\/h4><p><b>기본 치료(선복하마작초탕)<\/b>: 처방 구성이 매우 간결하고 약성이 가벼우며, 일반 탕약처럼 오래 끓이지 않고 머그컵 등에 넣어 끓는 물을 붓고 뚜껑을 덮고 우려 마시는 방식을 취함<\/p><p><b>증상<\/b> 별 가감 치법:<\/p><p class=\"sub\"><b>인통후양咽痛喉癢<\/b>: 길경, 전호, 박하 가미<\/p><p class=\"sub\"><b>오풍惡風, 식소핍력食少乏力, 수족불온手足不溫<\/b>: 서장경, 형개 가미<\/p><p class=\"sub\"><b>오랜 기침으로 가래가 적고 끈적<\/b>: 浙패모, 상엽 가미<\/p><p class=\"sub\"><b>경련 및 항알레르기<\/b>: 노봉방, 선퇴 등 충류약 가미<\/p><p class=\"sub\"><b>오랜 기침으로 인한 폐기 소상<\/b>: 소량의 오미자 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">7종 소량 처방이고 공개자료상 제품·특허가 확인되지 않으나, 생반하 포제 조건과 안전성을 먼저 확인한 뒤에 소아 제형을 검토할 수 있음(실제 임상에서는 薑반하로 대체하여 사용)<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 추즈지,주젠핑,마쉬안칭.주량춘의 외감 구해 치료 경험과 특징에 대한 선별 분석-유명 노중의학자 주량춘 임상 경험(25)朱良春治療外感久咳的經驗和特色選析-著名老中醫學家朱良春臨床經驗(25)[J].랴오닝중의잡지遼寧中醫雜志,2002,(1):8-9.<\/li><li class=\"ref\">[2] 훠리리,쉬안샤오핑,선차오빈.국의대사 주량춘의 “선복하마작초탕” 가감에 의한 소아 기침 이형 천식 치료 임상 연구國醫大師朱良春“旋覆夏麻芍草湯”加減治療小兒咳嗽變異性哮喘的臨床研究[J].광저우중의약대학학보廣州中醫藥大學學報,2017,34(1):21-27.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"선복화8g","name":"선복화","dose":"8g","base":"선복화"},{"raw":"生반하6~10g","name":"生반하","dose":"6~10g","base":"반하"},{"raw":"生마황1.5g","name":"生마황","dose":"1.5g","base":"마황"},{"raw":"복령6g","name":"복령","dose":"6g","base":"복령"},{"raw":"생강3편","name":"생강","dose":"3편","base":"생강"},{"raw":"生백작약3g","name":"生백작약","dose":"3g","base":"백작약"},{"raw":"감초3g","name":"감초","dose":"3g","base":"감초"}],"notes":["※ 원방은 生반하를 포함하지만, 실제 임상(특히 소아)에서는 薑반하를 사용"],"핵심 효능":["담을 삭이고 수습을 소통시킴(소담리수消痰利水)","폐기를 선산하고 상역하는 기기를 내림(선폐강기宣肺降氣)","폐기를 수렴하고 기침을 멈춤(염폐지해斂肺止咳)"],"주치증":["풍한구해風寒久咳, 완해頑咳, 천해喘咳, 소아의 기침 이형 천식, 담열온폐痰熱蘊肺 또는 외감 풍한 등"],"연구 확장 영역":["감염 후 기침, 만성 기침, 상기도 감염, 소아 및 노약자의 기침 이형 천식"],"R&D 포인트":["선복화, 반하, 생강의 신개辛開 작용과 生마황의 배합을 통한 폐기 선산宣散 및 기도 저항 완화 천연물 신약 소재","生백작약과 감초의 산감화음酸甘化陰 배합을 통한 세기관지 및 기관지 평활근 경련 억제 작용","복령과 반하의 위장관 수음水飮 제거 및 폐위동치肺胃同治 메커니즘을 통한 담음의 근본적 차단"]},"modules":[{"name":"①선강법","hz":"宣降法","herbs":["선복화","生반하","생강","生마황"],"role":"폐기를 선통하고 상역하는 기기를 내림"},{"name":"②산렴법","hz":"散斂法","herbs":["生백작약","감초"],"role":"기를 수렴하고 기관지 평활근 경련을 완화함"},{"name":"③폐위동치 · 이수화담","hz":"肺胃同治 · 利水化痰","herbs":["복령","生반하","생강(선강법 모듈과 연계)"],"role":"위의 수음이 상역하는 것을 막고 담탁과 수습을 배출하여 폐와 위를 함께 다스림"}],"rd":[{"tag":"Pediatric CVA","title":"소아 기침 이형 천식의 임상 효과 재현","html":"<p>선복하마작초탕 가감으로 소아 기침 이형 천식을 치료한 임상 연구가 있음<\/p><p>소아 기침 증상 점수와 재발률을 지표로 한 무작위 대조 재현 연구가 다음 단계 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2017, 소아 기침 이형 천식 임상 연구))<\/p>"},{"tag":"Raw Pinellia Safety","title":"","html":"<p>生반하 사용의 안전성<\/p><p>生반하는 점막 자극 독성이 있음<\/p><p>포제 규격(법반하·강반하)과 효과 동등성이 확인되기 전에는 소아에게 적용하지 않음 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)<\/p>"},{"tag":"Micro-dose Formula","title":"","html":"<p>生마황 1.5g 등 극소량 처방의 의미<\/p><p>마황 1.5g·백작약 3g·감초 3g 등 매우 적은 용량으로 구성된 소방임<\/p><p>소량에서도 기관지 확장·진경 효과가 나타나는지 확인하면 저용량 소방으로서의 개발 근거가 됨 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 1·2, 본문 조성표)<\/p>"},{"tag":"Simple Brewing","title":"우려 마시는 복용법의 제형화 검토","html":"<p>우려 마시는 복용법은 원방의 기록이지만 생반하를 포함한 처방을 단순 티백·차로 개발하는 것은 부적절함<\/p><p>포제·추출 조건과 안전성을 먼저 확인한 뒤 과립 등 관리 가능한 제형을 검토(실제 임상에서는 薑반하로 대체하여 사용) (근거 유형: 임상 경험 보고 | 근거: R&amp;D 논리 4 「병증결합과 간결복용」, 참고문헌 [1])<\/p>"}],"logic":[{"n":"1","title":"선강법宣降法과 선산하기宣散下氣","body":"신개 작용으로 울체된 기를 열고 상역하는 기기를 내려 폐기를 피모까지 도달시킴"},{"n":"2","title":"산렴법散斂法과 완급지해緩急止咳","body":"산감화음 배합을 통해 진액을 보충하고 평활근 경련을 완화함"},{"n":"3","title":"폐위동치肺胃同治와 수음水飮제거","body":"위에 모인 수음과 담연痰涎을 다스려 담음의 근본적 생성을 차단함"},{"n":"4","title":"병증결합病證結合과 간결복용簡潔服用","body":"소방의 간결한 약물 구성과 우려 마시는 복용법을 통해 효능을 극대화함"}],"field":5,"pages":[314,317],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["5-11","선복하마작초탕","旋覆夏麻芍草湯","","주량춘","朱良春","선강법宣降法과 산렴법散斂法의 병용 및 폐위동치肺胃同治 원리로 외감 풍한과 소아 기침 이형 천식을 치료하는 처방","선복화8g 生반하6~10g 生마황1.5g 복령6g 생강3편 生백작약3g 감초3g","※ 원방은 生반하를 포함하지만, 실제 임상(특히 소아)에서는 薑반하를 사용","핵심 효능 담을 삭이고 수습을 소통시킴(소담리수消痰利水) 폐기를 선산하고 상역하는 기기를 내림(선폐강기宣肺降氣) 폐기를 수렴하고 기침을 멈춤(염폐지해斂肺止咳)","주치증 풍한구해風寒久咳, 완해頑咳, 천해喘咳, 소아의 기침 이형 천식, 담열온폐痰熱蘊肺 또는 외감 풍한 등","연구 확장 영역 감염 후 기침, 만성 기침, 상기도 감염, 소아 및 노약자의 기침 이형 천식","R&D 포인트 선복화, 반하, 생강의 신개辛開 작용과 生마황의 배합을 통한 폐기 선산宣散 및 기도 저항 완화 천연물 신약 소재 生백작약과 감초의 산감화음酸甘化陰 배합을 통한 세기관지 및 기관지 평활근 경련 억제 작용 복령과 반하의 위장관 수음水飮 제거 및 폐위동치肺胃同治 메커니즘을 통한 담음의 근본적 차단","①선강법 宣降法 선복화 生반하 생강 生마황 폐기를 선통하고 상역하는 기기를 내림","②산렴법 散斂法 生백작약 감초 기를 수렴하고 기관지 평활근 경련을 완화함","③폐위동치 · 이수화담 肺胃同治 · 利水化痰 복령 生반하 생강(선강법 모듈과 연계) 위의 수음이 상역하는 것을 막고 담탁과 수습을 배출하여 폐와 위를 함께 다스림","선강법宣降法과 선산하기宣散下氣 신개 작용으로 울체된 기를 열고 상역하는 기기를 내려 폐기를 피모까지 도달시킴","산렴법散斂法과 완급지해緩急止咳 산감화음 배합을 통해 진액을 보충하고 평활근 경련을 완화함","폐위동치肺胃同治와 수음水飮제거 위에 모인 수음과 담연痰涎을 다스려 담음의 근본적 생성을 차단함","병증결합病證結合과 간결복용簡潔服用 소방의 간결한 약물 구성과 우려 마시는 복용법을 통해 효능을 극대화함","Pediatric CVA 소아 기침 이형 천식의 임상 효과 재현 선복하마작초탕 가감으로 소아 기침 이형 천식을 치료한 임상 연구가 있음 소아 기침 증상 점수와 재발률을 지표로 한 무작위 대조 재현 연구가 다음 단계 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2017, 소아 기침 이형 천식 임상 연구))","Raw Pinellia Safety  生반하 사용의 안전성 生반하는 점막 자극 독성이 있음 포제 규격(법반하·강반하)과 효과 동등성이 확인되기 전에는 소아에게 적용하지 않음 (근거 유형: 신규 연구가설 | 근거: 본문 조성표)","Micro-dose Formula  生마황 1.5g 등 극소량 처방의 의미 마황 1.5g·백작약 3g·감초 3g 등 매우 적은 용량으로 구성된 소방임 소량에서도 기관지 확장·진경 효과가 나타나는지 확인하면 저용량 소방으로서의 개발 근거가 됨 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1·2, 본문 조성표)","Simple Brewing 우려 마시는 복용법의 제형화 검토 우려 마시는 복용법은 원방의 기록이지만 생반하를 포함한 처방을 단순 티백·차로 개발하는 것은 부적절함 포제·추출 조건과 안전성을 먼저 확인한 뒤 과립 등 관리 가능한 제형을 검토(실제 임상에서는 薑반하로 대체하여 사용) (근거 유형: 임상 경험 보고 | 근거: R&D 논리 4 「병증결합과 간결복용」, 참고문헌 [1])"],"ss":{"composition":"그림 5-11 선복하마작초탕旋覆夏麻芍草湯의 모듈 구성 ①선강법宣降法 모듈 — 폐기를 선통하고 상역하는 기기를 내림 선복화, 生반하, 생강 : 신개辛開 작용으로 울체된 기를 열어 통하게 하고, 상역하는 기기를 내리며, 소담消痰, 하기下氣, 연견軟堅, 행수行水하며 마황을 도와 폐기를 피모까지 도달하게 함 生마황 : 경량으로 사용하여 외감의 풍한을 풀고 폐기를 소통시킴 ②산렴법散斂法 모듈 — 기를 수렴하고 기관지 평활근 경련을 완화함 生백작약, 감초 : 산감화음酸甘化陰하여 폐의 진액을 보충하고 가볍게 폐기를 수렴하며, 기관지 평활근 경련을 완화하여 염폐지해斂肺止咳 작용을 함 ③폐위동치肺胃同治 및 이수화담利水化痰 모듈 — 위의 수음이 상역하는 것을 막고 담탁과 수습을 배출하여 폐와 위를 함께 다스림 복령, 生반하, 생강(선강법 모듈과 연계) : 위에 모인 수음水飮과 담연痰涎을 다스려 “담연 또는 수음이 위에 모이고, 폐와 관련된다”는 기침의 근본 병기를 치료하고 이수행수利水行水함","master":"①병인병기 인식 풍한구해風寒久咳와 폐기울폐肺氣鬱閉 : 외감 풍한이 오래도록 풀리지 않거나 오치誤治로 인하여 풍한이 폐에 울폐되면, 폐기의 선발宣發과 숙강肅降 기능이 저해되어 기침이 지속됨 담연수음痰涎水飮의 내정內停 : 담연 또는 수음이 위중에 모여, 폐를 침범하여 기침을 일으킴 ②치료원칙 병증결합病證結合과 폐위동치肺胃同治 : 중의의 변증과 현대의 기침 이형 천식 진단을 결합하고, 장중경의 4가지 처방 (선복대자탕, 소반하가복령탕, 작약감초탕, 감초마황탕)을 융합하여 폐와 위를 동시에 치료함 선강결합宣降結合과 산렴병용散斂並用 : 선산과 강역을 병행하고 발산과 수렴을 겸하여 낫지 않는 완해頑咳를 치료함 경청선폐輕淸宣肺 : “상초여우上焦如羽, 비경불거非輕不擧”의 원칙에 따라 가벼운 약물을 사용하여 상초를 소통시키고 폐기의 선발宣發을 회복시킴 ③단계별 및 맞춤 치료 기본 치료(선복하마작초탕) : 처방 구성이 매우 간결하고 약성이 가벼우며, 일반 탕약처럼 오래 끓이지 않고 머그컵 등에 넣어 끓는 물을 붓고 뚜껑을 덮고 우려 마시는 방식을 취함 증상 별 가감 치법: 인통후양咽痛喉癢 : 길경, 전호, 박하 가미 오풍惡風, 식소핍력食少乏力, 수족불온手足不溫 : 서장경, 형개 가미 오랜 기침으로 가래가 적고 끈적 : 浙패모, 상엽 가미 경련 및 항알레르기 : 노봉방, 선퇴 등 충류약 가미 오랜 기침으로 인한 폐기 소상 : 소량의 오미자 가미","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 7종 소량 처방이고 공개자료상 제품·특허가 확인되지 않으나, 생반하 포제 조건과 안전성을 먼저 확인한 뒤에 소아 제형을 검토할 수 있음(실제 임상에서는 薑반하로 대체하여 사용) 참고문헌 [1] 추즈지,주젠핑,마쉬안칭.주량춘의 외감 구해 치료 경험과 특징에 대한 선별 분석-유명 노중의학자 주량춘 임상 경험(25)朱良春治療外感久咳的經驗和特色選析-著名老中醫學家朱良春臨床經驗(25)[J].랴오닝중의잡지遼寧中醫雜志,2002,(1):8-9. [2] 훠리리,쉬안샤오핑,선차오빈.국의대사 주량춘의 “선복하마작초탕” 가감에 의한 소아 기침 이형 천식 치료 임상 연구國醫大師朱良春“旋覆夏麻芍草湯”加減治療小兒咳嗽變異性哮喘的臨床研究[J].광저우중의약대학학보廣州中醫藥大學學報,2017,34(1):21-27."}},{"id":"5-12","ko":"선폐지수탕","hz":"宣肺止嗽湯","alias":"","master_ko":"저우중잉","master_hz":"周仲瑛","tagline":"풍한울폐風寒鬱肺와 폐기불선肺氣不宣으로 인한 급성 기관지염에 동반되는 기침을 치료하는 대표 처방","meta":{"주요 적응증":"급성 기관지염","확인된 연구자료 유형":"경험 보고","제형·제품화":"관련 특허 (만료)"},"page":318,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-12 선폐지수탕宣肺止嗽湯의 모듈 구성<\/p><h4>①선폐산사宣肺散邪 및 일선일강一宣一降 모듈(삼요탕三拗湯의 뼈대) — 풍한의 외사를 흩어내고 폐기를 선산하여 기침을 멈춤<\/h4><p><b>마황, 행인<\/b>: 본 처방은 삼요탕三拗湯과 길경탕을 합방하여 구성됨. 마황은 군약으로 폐경의 풍한을 제거하여 기침을 멈추게 할 뿐만 아니라, 주리腠理를 열고 모규毛竅를 투발하여 신온산사辛溫散邪하므로 외사가 걷히면 폐기가 저절로 위로 치솟지 않게 됨. 행인은 폐의 울체되고 선강을 잃은 상태를 도와 마황과 함께 하부로 기를 이끌며, 두 약물의 배오는 일선일강一宣一降으로 폐의 승강 본성과 합치되어 직무를 회복시킴. 이 과정을 통해 풍한득산風寒得散, 폐기득선肺氣得宣, 기역득강氣逆得降의 효과를 도출함<\/p><h4>②거담지해祛痰止咳 및 청리인후淸利咽喉 모듈 (길경탕의 뼈대) — 담을 없애고 폐기를 청숙하며 인후의 문호를 이롭게 함<\/h4><p><b>반하, 전호, 패모, 관동화, 불이초, 길경, 감초<\/b>: 반하, 전호, 패모, 관동화, 불이초 등은 담을 삭이고 기를 내려 기침을 멈추며 폐기를 숙강시킴. 특히 길경과 감초의 결합(길경탕)은 첫째, 폐를 선산하고 기침을 멈추며 가래를 없애고 고름을 배출하며, 둘째, 인후를 청리淸利함. 외사로 인한 기침은 대개 인후 병변을 겸하므로 이를 다스려 인후득리咽喉得利를 이룸<\/p><h4>③조화약성調和藥性 및 승강상인升降相因 모듈 — 온중유청溫中有淸의 배오로 약세를 조화롭게 이끔<\/h4><p><b>감초<\/b>: 약재의 성질을 조화롭게 융화시키고 폐기가 치솟는 것을 완만하게 받아주며, 온중유청, 승강상인의 배오를 통해 온溫하되 조燥하지 않게 함으로써 전체 처방의 균형을 잡아줌<\/p>"},{"k":"master","t":"저우중잉의 급성 기관지염 치료","html":"<h4>①병기 인식 — 외사범폐外邪犯肺의 병기 및 외감, 내상의 상호 인과<\/h4><p>급성 기관지염 및 기침의 본질은 외감의 육음이 입과 코나 피부로 침범하여 폐계를 억누르는 외감성 실증에 있음<\/p><p>외감 기침을 방치하거나 잘못 치료하면 폐기가 손상되어 외감을 반복하여 감수하고 내상 기침으로 이행하기 쉽고, 반대로 내상 환자는 방어력이 약해 외사를 쉽게 감수하므로 외감과 내상은 서로 원인이 되고 결과가 되는 상호 인과의 관계를 지님<\/p><p>외사의 성질에 따라 진액이 엉기는 양상이 달라 풍한風寒이면 응체하여 담이 되고, 풍열風熱이면 열이 진액을 졸여 담이 되며, 풍조風燥면 조사燥邪가 진액을 말려 담이 됨<\/p><h4>②치료의 핵심 — ‘선통宣通’의 철학과 일선일강一宣一降<\/h4><p>대사는 처방의 핵심이 ‘선통宣通’에 있음을 강조함. 선宣은 폐를 열어 외사를 거두는 것이고, 통通은 폐기를 이롭게 하여 아래로 끌어내리는 것임<\/p><p>삼요탕三拗湯과 길경탕桔梗湯을 뼈대 삼아, 온중유청溫中有淸, 온이불조溫而不燥, 강중우승降中寓升의 배오를 통하여 풍한을 발산하고 폐기를 선숙하여 인후를 이롭게 함<\/p><h4>③임상적 활용 및 변증 가감<\/h4><p>본 처방은 엄격히 ‘풍한울폐風寒鬱肺, 폐기불선肺氣不宣’의 초기 양상에 국한하여 사용하며, 구내염, 인후통, 태황苔黃, 맥부삭脈浮數 등의 풍열 증상이나 세균성 감염으로 진행된 경우에는 본 방의 범위를 벗어나므로(이때는 상국음 가감을 사용) 맹목적 사용을 금함<\/p><p class=\"lbl2\">구체적 임상 변증에 따른 유연한 가감 활용<\/p><p class=\"sub\"><b>표한表寒 증상일 때<\/b>: 형개, 소엽 가미<\/p><p class=\"sub\"><b>기천氣喘 및 목구멍에 담명痰鳴이 있을 때<\/b>: 길경 제거<\/p><p class=\"sub\"><b>한담복폐寒痰伏肺일 때<\/b>: 세신 가미<\/p><p class=\"sub\"><b>폐열내울肺熱內鬱일 때<\/b>: 생석고, 지모 가미<\/p><p class=\"sub\"><b>담열온폐痰熱蘊肺일 때<\/b>: 황금, 상백피 가미<\/p><p class=\"sub\"><b>음진모상陰津耗傷일 때<\/b>: 천화분, 南사삼 가미<\/p><p class=\"sub\"><b>해역기급담옹咳逆氣急痰壅일 때<\/b>: 소자, 선복화 가미<\/p><p class=\"sub\"><b>습탁담다濕濁痰多 및 흉민胸悶일 때<\/b>: 복령, 반하, 후박, 진피 가미<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>이 처방의 제품은 확인되지 않음. 같은 이름의 선폐지수합제宣肺止嗽合劑(간쑤푸안제약)는 형개·백부·자완·앵속각 등으로 조성이 다른 별개 제품이며 이 제품의 COPD 용도 특허 출원은 2024년 취하 간주됨[2]. 대사가 공동 발명한 장쑤캉위안약업의 기침 조성물 특허(2006년 등록)는 마황·행인·길경·전호·패모·감초를 공유하는 관련 조성이며 2023년 존속기간이 만료됨[3]<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">기업(캉위안약업)이 대 의 본질은 외감의 육음이 입과 코나 피부로 침범하여 폐계를 억누르는 외감성 실증에 있음 외감 기침을 방치하거나 잘못 치료하면 폐기가 손상되어 외감을 반복하여 감수하고 내상 기침으로 이행하기 쉽고, 반대로 내상 환자는 방어력이 약해 외사를 쉽게 감수하므로 외감과 내상은 서로 원인이 되고 결과가 되는 상호 인과의 관계를 지님 외사의 성질에 따라 진액이 엉기는 양상이 달라 풍한風寒이면 응체하여 담이 되고, 풍열風熱이면 열이 진액을 졸여 담이 되며, 풍조風燥면 조사燥邪가 진액을 말려 담이 됨 ②치료의 핵심 — ‘선통宣通’의 철학과 일선일강一宣一降 대사는 처방의 핵심이 ‘선통宣通’에 있음을 강조함. 선宣은 폐를 열어 외사를 거두는 것이고, 통通은 폐기를 이롭게 하여 아래로 끌어내리는 것임 삼요탕三拗湯과 길경탕桔梗湯을 뼈대 삼아, 온중유청溫中有淸, 온이불조溫而不燥, 강중우승降中寓升의 배오를 통하여 풍한을 발산하고 폐기를 선숙하여 인후를 이롭게 함 ③임상적 활용 및 변증 가감 본 처방은 엄격히 ‘풍한울폐風寒鬱肺, 폐기불선肺氣不宣’의 초기 양상에 국한하여 사용하며, 구내염, 인후통, 태황苔黃, 맥부삭脈浮數 등의 풍열 증상이나 세균성 감염으로 진행된 경우에는 본 방의 범위를 벗어나므로(이때는 상국음 가감을 사용) 맹목적 사용을 금함 구체적 임상 변증에 따른 유연한 가감 활용 표한表寒 증상일 때 : 형개, 소엽 가미 기천氣喘 및 목구멍에 담명痰鳴이 있을 때 : 길경 제거 한담복폐寒痰伏肺일 때 : 세신 가미 폐열내울肺熱內鬱일 때 : 생석고, 지모 가미 담열온폐痰熱蘊肺일 때 : 황금, 상백피 가미 음진모상陰津耗傷일 때 : 천화분, 南사삼 가미 해역기급담옹咳逆氣急痰壅일 때 : 소자, 선복화 가미 습탁담다濕濁痰多 및 흉민胸悶일 때 : 복령, 반하, 후박, 진피 가미","rd":"","china":"중국 제품화 현황 이 처방의 제품은 확인되지 않음. 같은 이름의 선폐지수합제宣肺止嗽合劑(간쑤푸안제약)는 형개·백부·자완·앵속각 등으로 조성이 다른 별개 제품이며 이 제품의 COPD 용도 특허 출원은 2024년 취하 간주됨[2]. 대사가 공동 발명한 장쑤캉위안약업의 기침 조성물 특허(2006년 등록)는 마황·행인·길경·전호·패모·감초를 공유하는 관련 조성이며 2023년 존속기간이 만료됨[3] 시사점 기업(캉위안약업)이 대사 처방을 바탕으로 특허를 받았던 사례로, 국내는 불이초 대체 조성과 급성 기관지염 대상 근거를 확보하는 방향이 현실적 참고문헌 [1] 자오후이,왕즈잉.국의대사 저우중잉의 급성 기관-기관지염 치료 경험國醫大師周仲瑛治療急性氣管-支氣管炎經驗[J].쓰촨중의四川中醫,2014,32(5):1-2. [2] 간쑤푸안제약甘肅普安製藥.선폐지수합제 및 항COPD 약물로서의 응용一種宣肺止嗽合劑及其做爲抗慢阻肺藥的應用:CN116036206A[P/OL]. https://patents.google.com/patent/CN116036206A. [3] 샤오웨이肖偉·저우중잉周仲瑛 등.기침을 치료하는 중약 조성물 및 제조·품질관리방법一種治療咳嗽的中藥組合物及其製備方法和質量控制方法:CN1515272A[P/OL]. https://patents.google.com/patent/CN1515272A."}},{"id":"5-13","ko":"선폐달울탕","hz":"宣肺達鬱湯","alias":"","master_ko":"양전","master_hz":"楊震","tagline":"정기모상正氣耗傷, 여사미진餘邪未盡, 기기실조氣機失調, 승강괴려升降乖戾로 인한 COVID-19 후유증(롱코비드)을 치료하는 처방","meta":{"주요 적응증":"코로나19 후유증(롱코비드)","확인된 연구자료 유형":"임상·실험 보고","제형·제품화":"—"},"page":323,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-13 선폐달울탕宣肺達鬱湯의 모듈 구성<\/p><h4>①황아탕黃芽湯 기반의 건중익기健中益氣 및 승강지추升降之樞 모듈 — 중기를 보하여 비위의 승강 기틀을 세움<\/h4><p><b>당삼, 귤피, 복령, 건강, 감초<\/b>: 중기中氣는 일기주류一氣周流의 축이자 원동력이므로, 당삼, 건강, 감초로 온보중양溫補中陽하고 복령으로 건비삼습健脾滲濕하여 비토脾土를 실하게 함. 이를 통해 비가 청양淸陽을 상승시키고 위가 탁음濁陰을 하강시키는 승강升降의 근간을 세움<\/p><h4>②하기탕下氣湯 기반의 선폐청강宣肺淸降 모듈 — 폐기를 선통·하강시키고 음혈을 자양하여 심신을 안정시킴<\/h4><p><b>행인, 반하, 백합<\/b>: 금수金水의 수렴실조收斂失調와 폐기불강肺氣不降으로 인한 기침, 호흡곤란, 흉민을 다스림. 행인과 반하로 폐위肺胃의 기를 내리고, 백합으로 양음윤조養陰潤燥하며 심신을 안정시킴<\/p><h4>③달울탕達鬱湯 기반의 승달간목升達肝木 모듈 — 간기의 울체를 풀어 소설을 회복하고 어열을 해소함<\/h4><p><b>계지, 炒백작약, 醋별갑<\/b>: 간주소설肝主疏泄과 승발升發의 기기를 회복함. 계지는 승발하고자 하는 간기를 소통시켜 울체를 풀고, 백작약은 유간柔肝하며, 醋별갑은 잠복된 열을 끄고 어혈과 울결을 풀어 균형을 이룸<\/p><h4>④조화제약調和諸藥 모듈 — 약성을 조화롭게 하고 전신의 기기 소통을 보조함<\/h4><p><b>감초<\/b>: 제반 약물의 편성을 조화시키고 오장육부의 기기가 원활히 소통되도록 보조함<\/p>"},{"k":"master","t":"양전의 COVID-19 감염 후유증 치료","html":"<h4>①병기 인식 — 일기주류一氣周流의 파탄, 정기모상正氣耗傷과 여사미진餘邪未盡 및 기기승강괴려氣機升降乖戾<\/h4><p>신종 코로나바이러스 감염 후유증의 근본 병인은 급성기 이후 남은 여사미진餘邪未盡(미세한 풍, 한, 습, 열의 잔여, 미세혈전 및 내피세포 손상 등)과 인체 정기 손상의 결합으로 봄<\/p><p>인체의 원기가 오행의 성질을 따라 좌우로 돌며 오르내리는 둥근 원형 운동인 일기주류가 깨진 데 본질이 있음. 중앙의 비토脾土가 회전축을 잃으면서 폐위肺胃는 내리지 못하고 간비肝脾는 오르지 못하는 기기승강괴려 상태에 빠짐으로써 호흡기, 순환기, 소화기, 신경계를 아우르는 복잡다단한 전신 증상을 유발함<\/p><p>특히 롱코비드의 수면장애, 심계, 불안 등은 간목肝木의 울결과 상화相火의 망동에서 비롯된 것으로 파악함<\/p><h4>②치료의 핵심 — 삼방합방三方合方과 선폐, 소간, 건비의 구조적 원리<\/h4><p>황원어黃元禦의 학설을 바탕으로 황아탕黃芽湯, 하기탕下氣湯, 달울탕達鬱湯을 유기적으로 합방하여 선폐宣肺, 소간疏肝, 건비健脾의 삼위일체 구조를 완성함<\/p><p>중기中氣를 세워 회전축을 잡고 사방의 기기 승강을 동시에 조율함으로써 수많은 증상의 지엽적 대증 치료에서 벗어나 전신 기기를 일거에 회복시킴<\/p><h4>③동적 균형과 전인적 재활 원칙<\/h4><p>일방적인 공벌攻伐을 피하고 원기를 보호하는 동시에 잠재된 여사餘邪를 제거하며 상호 촉진하는 염증, 면역의 악순환을 타파함<\/p><p>거시적인 기기 순환 회복은 미세혈전 개선, 항염증 사이토카인 조절, 폐포 미세환경 안정화 등 현대 약리학적 다표적 작용 기전과 상통하는 것으로 해석함<\/p><p>질병의 국소적 증상에 얽매이지 않고 인체의 오행 기기 순환을 바로잡아 스스로 건강을 회복하는 자생력을 도모함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">롱코비드는 국내에서도 치료제가 없는 영역이며 공개자료상 이 처방의 중국 제품이 확인되지 않아, 피로·호흡곤란 지표 기반 국내 임상으로 근거를 먼저 쌓을 수 있음<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 쑨제,양전,하오젠메이.국의대사 양전의 선폐달울탕을 이용한 코로나19 감염 후유증 치료 경험國醫大師楊震運用宣肺達鬱湯治療新型冠狀病毒感染後遺症經驗[J].지린중의약吉林中醫藥,2024,44(9):1016-1019.<\/li><li class=\"ref\">[2] 자오펑,양전,류쑤샹,등.선폐달울탕의 코로나19 폐렴 회복 단계 치료 임상 연구宣肺達鬱湯治療新型冠狀病毒肺炎回復階段臨床研究[J].산시중의陝西中醫,2020,41(7):846-848.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"당삼15g","name":"당삼","dose":"15g","base":"당삼"},{"raw":"귤피15g","name":"귤피","dose":"15g","base":"귤피"},{"raw":"복령15g","name":"복령","dose":"15g","base":"복령"},{"raw":"法반하10g","name":"法반하","dose":"10g","base":"반하"},{"raw":"계지10g","name":"계지","dose":"10g","base":"계지"},{"raw":"苦행인10g","name":"苦행인","dose":"10g","base":"행인"},{"raw":"炒백작약10g","name":"炒백작약","dose":"10g","base":"백작약"},{"raw":"醋별갑12g","name":"醋별갑","dose":"12g","base":"별갑"},{"raw":"건강8g","name":"건강","dose":"8g","base":"건강"},{"raw":"백합20g","name":"백합","dose":"20g","base":"백합"},{"raw":"炙감초6g","name":"炙감초","dose":"6g","base":"감초"}],"notes":[],"핵심 효능":["폐와 위의 열을 내리고, 상역하는 폐위의 기를 하행시킴(청강폐위淸降肺胃)","울결된 간목을 펴고 비토의 승청을 북돋음(승달간비升達肝脾)","전신의 기기 울체를 풀고 승강출입을 소통시킴(선통기기宣通氣機)","비토를 실하게 하여 폐를 보양함(배토생금培土生金)"],"주치증":["코로나19 감염 후유증(롱코비드), 상기도 감염 후 잔존 증상(기침, 호흡곤란, 흉민, 심계, 식욕부진, 피로, 수면장애, 불안과 우울 등)"],"연구 확장 영역":["바이러스 감염 후 만성 호흡기 증후군, 전신의 여러 장기 기능 장애(순환, 소화, 신경계 등), 정지불서情志不舒를 수반한 기기울체氣機鬱滯 제반 질환"],"R&D 포인트":["다성분, 다표적을 통한 항염증, 면역 조절, 폐 미세순환 개선 및 섬유화 억제 작용","황원어黃元禦의 ‘일기주류一氣周流’ 및 ‘기기승강氣機升降’ 이론에 기반한 전신 기기 조절 메커니즘","황아탕黃芽湯, 하기탕下氣湯, 달울탕達鬱湯의 삼방합방三方合方 배합 구조와 임상적 유효성 규명"]},"modules":[{"name":"①황아탕 ·  기반의 · 건중익기 · 승강지추","hz":"黃芽湯 · 健中益氣 · 升降之樞","herbs":["당삼","귤피","복령","건강","감초"],"role":"중기를 보하여 비위의 승강 기틀을 세움"},{"name":"②하기탕 ·  기반의 · 선폐청강","hz":"下氣湯 · 宣肺淸降","herbs":["행인","반하","백합"],"role":"폐기를 선통·하강시키고 음혈을 자양하여 심신을 안정시킴"},{"name":"③달울탕 ·  기반의 · 승달간목","hz":"達鬱湯 · 升達肝木","herbs":["계지","炒백작약","醋별갑"],"role":"간기의 울체를 풀어 소설을 회복하고 어열을 해소함"},{"name":"④조화제약","hz":"調和諸藥","herbs":["감초"],"role":"약성을 조화롭게 하고 전신의 기기 소통을 보조함"}],"rd":[{"tag":"Long COVID","title":"코로나19 후유증의 피로·호흡곤란 개선","html":"<p>2020년 코로나19 폐렴 회복기 임상 연구는 급성 감염 회복에 대한 것으로 시기와 질병 정의가 다른 롱코비드의 근거로 그대로 확장할 수 없음<\/p><p>후유증 치료 경험(2024)을 바탕으로 롱코비드 정의(WHO 기준)에 맞는 환자에서 피로(FSS)·호흡곤란(mMRC)·6분 보행 거리를 지표로 한 탐색 임상부터 시작 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2020, 회복 단계 임상 연구), [1](2024, 후유증 치료 경험))<\/p>"},{"tag":"Post-viral Fatigue","title":"감염 후 피로 증후군으로의 일반화","html":"<p>황아탕 기반 건중익기 구성은 코로나19 외의 바이러스 감염 후 피로에도 적용 가능함 대상을 ‘감염 후 지속 피로’로 넓혀 적응증을 일반화하는 방향을 검토(감염 후 피로로의 일반화는 별도 가설) (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 1 「일기주류와 건중익기」)<\/p>"},{"tag":"Autonomic Symptoms","title":"심계·불안·수면장애 등 자율신경 증상","html":"<p>롱코비드의 심계·불안·수면장애는 자율신경 이상과 관련됨<\/p><p>심박변이도와 기립 시 심박 변화를 지표로 계지·백작약·별갑 배합의 효과를 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 3 「승달간목과 울결 해소」)<\/p>"},{"tag":"Combined Formula","title":"3개 원방 합방의 기여 분리","html":"<p>황아탕·하기탕·달울탕 3방을 합친 구성임<\/p><p>증상 영역(호흡·소화·정서)별로 어떤 모듈이 기여하는지 하위 분석하여 환자 유형별 가감 기준을 만듦 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4 「삼방합방과 다표적조절」)<\/p>"}],"logic":[{"n":"1","title":"일기주류一氣周流와 건중익기健中益氣","body":"황아탕 기반의 중기 보강을 통해 비토의 승강 회전축을 바로잡음"},{"n":"2","title":"선폐청강宣肺淸降과 수렴조절","body":"하기탕 기반의 행인, 반하, 백합 배합으로 폐위의 기를 내리고 양음윤조養陰潤燥함"},{"n":"3","title":"승달간목升達肝木과 울결鬱結해소","body":"달울탕 기반의 계지, 백작약, 별갑 배합으로 간의 소설 기능과 순환을 소통시킴"},{"n":"4","title":"삼방합방三方合方과 다표적조절","body":"선폐, 소간, 건비의 유기적 결합을 통해 롱코비드의 전신 다기관 증상을 종합적으로 제어함"}],"field":5,"pages":[323,326],"evidence":"임상·실험 보고","product":"—","status":"확인된 제품·특허 없음","s":["5-13","선폐달울탕","宣肺達鬱湯","","양전","楊震","정기모상正氣耗傷, 여사미진餘邪未盡, 기기실조氣機失調, 승강괴려升降乖戾로 인한 COVID-19 후유증(롱코비드)을 치료하는 처방","당삼15g 귤피15g 복령15g 法반하10g 계지10g 苦행인10g 炒백작약10g 醋별갑12g 건강8g 백합20g 炙감초6g","","핵심 효능 폐와 위의 열을 내리고, 상역하는 폐위의 기를 하행시킴(청강폐위淸降肺胃) 울결된 간목을 펴고 비토의 승청을 북돋음(승달간비升達肝脾) 전신의 기기 울체를 풀고 승강출입을 소통시킴(선통기기宣通氣機) 비토를 실하게 하여 폐를 보양함(배토생금培土生金)","주치증 코로나19 감염 후유증(롱코비드), 상기도 감염 후 잔존 증상(기침, 호흡곤란, 흉민, 심계, 식욕부진, 피로, 수면장애, 불안과 우울 등)","연구 확장 영역 바이러스 감염 후 만성 호흡기 증후군, 전신의 여러 장기 기능 장애(순환, 소화, 신경계 등), 정지불서情志不舒를 수반한 기기울체氣機鬱滯 제반 질환","R&D 포인트 다성분, 다표적을 통한 항염증, 면역 조절, 폐 미세순환 개선 및 섬유화 억제 작용 황원어黃元禦의 ‘일기주류一氣周流’ 및 ‘기기승강氣機升降’ 이론에 기반한 전신 기기 조절 메커니즘 황아탕黃芽湯, 하기탕下氣湯, 달울탕達鬱湯의 삼방합방三方合方 배합 구조와 임상적 유효성 규명","①황아탕 ·  기반의 · 건중익기 · 승강지추 黃芽湯 · 健中益氣 · 升降之樞 당삼 귤피 복령 건강 감초 중기를 보하여 비위의 승강 기틀을 세움","②하기탕 ·  기반의 · 선폐청강 下氣湯 · 宣肺淸降 행인 반하 백합 폐기를 선통·하강시키고 음혈을 자양하여 심신을 안정시킴","③달울탕 ·  기반의 · 승달간목 達鬱湯 · 升達肝木 계지 炒백작약 醋별갑 간기의 울체를 풀어 소설을 회복하고 어열을 해소함","④조화제약 調和諸藥 감초 약성을 조화롭게 하고 전신의 기기 소통을 보조함","일기주류一氣周流와 건중익기健中益氣 황아탕 기반의 중기 보강을 통해 비토의 승강 회전축을 바로잡음","선폐청강宣肺淸降과 수렴조절 하기탕 기반의 행인, 반하, 백합 배합으로 폐위의 기를 내리고 양음윤조養陰潤燥함","승달간목升達肝木과 울결鬱結해소 달울탕 기반의 계지, 백작약, 별갑 배합으로 간의 소설 기능과 순환을 소통시킴","삼방합방三方合方과 다표적조절 선폐, 소간, 건비의 유기적 결합을 통해 롱코비드의 전신 다기관 증상을 종합적으로 제어함","Long COVID 코로나19 후유증의 피로·호흡곤란 개선 2020년 코로나19 폐렴 회복기 임상 연구는 급성 감염 회복에 대한 것으로 시기와 질병 정의가 다른 롱코비드의 근거로 그대로 확장할 수 없음 후유증 치료 경험(2024)을 바탕으로 롱코비드 정의(WHO 기준)에 맞는 환자에서 피로(FSS)·호흡곤란(mMRC)·6분 보행 거리를 지표로 한 탐색 임상부터 시작 (근거 유형: 직접 연구 근거 | 근거: 참고문헌 [2](2020, 회복 단계 임상 연구), [1](2024, 후유증 치료 경험))","Post-viral Fatigue 감염 후 피로 증후군으로의 일반화 황아탕 기반 건중익기 구성은 코로나19 외의 바이러스 감염 후 피로에도 적용 가능함 대상을 ‘감염 후 지속 피로’로 넓혀 적응증을 일반화하는 방향을 검토(감염 후 피로로의 일반화는 별도 가설) (근거 유형: 신규 연구가설 | 근거: R&D 논리 1 「일기주류와 건중익기」)","Autonomic Symptoms 심계·불안·수면장애 등 자율신경 증상 롱코비드의 심계·불안·수면장애는 자율신경 이상과 관련됨 심박변이도와 기립 시 심박 변화를 지표로 계지·백작약·별갑 배합의 효과를 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 3 「승달간목과 울결 해소」)","Combined Formula 3개 원방 합방의 기여 분리 황아탕·하기탕·달울탕 3방을 합친 구성임 증상 영역(호흡·소화·정서)별로 어떤 모듈이 기여하는지 하위 분석하여 환자 유형별 가감 기준을 만듦 (근거 유형: 신규 연구가설 | 근거: R&D 논리 4 「삼방합방과 다표적조절」)"],"ss":{"composition":"그림 5-13 선폐달울탕宣肺達鬱湯의 모듈 구성 ①황아탕黃芽湯 기반의 건중익기健中益氣 및 승강지추升降之樞 모듈 — 중기를 보하여 비위의 승강 기틀을 세움 당삼, 귤피, 복령, 건강, 감초 : 중기中氣는 일기주류一氣周流의 축이자 원동력이므로, 당삼, 건강, 감초로 온보중양溫補中陽하고 복령으로 건비삼습健脾滲濕하여 비토脾土를 실하게 함. 이를 통해 비가 청양淸陽을 상승시키고 위가 탁음濁陰을 하강시키는 승강升降의 근간을 세움 ②하기탕下氣湯 기반의 선폐청강宣肺淸降 모듈 — 폐기를 선통·하강시키고 음혈을 자양하여 심신을 안정시킴 행인, 반하, 백합 : 금수金水의 수렴실조收斂失調와 폐기불강肺氣不降으로 인한 기침, 호흡곤란, 흉민을 다스림. 행인과 반하로 폐위肺胃의 기를 내리고, 백합으로 양음윤조養陰潤燥하며 심신을 안정시킴 ③달울탕達鬱湯 기반의 승달간목升達肝木 모듈 — 간기의 울체를 풀어 소설을 회복하고 어열을 해소함 계지, 炒백작약, 醋별갑 : 간주소설肝主疏泄과 승발升發의 기기를 회복함. 계지는 승발하고자 하는 간기를 소통시켜 울체를 풀고, 백작약은 유간柔肝하며, 醋별갑은 잠복된 열을 끄고 어혈과 울결을 풀어 균형을 이룸 ④조화제약調和諸藥 모듈 — 약성을 조화롭게 하고 전신의 기기 소통을 보조함 감초 : 제반 약물의 편성을 조화시키고 오장육부의 기기가 원활히 소통되도록 보조함","master":"①병기 인식 — 일기주류一氣周流의 파탄, 정기모상正氣耗傷과 여사미진餘邪未盡 및 기기승강괴려氣機升降乖戾 신종 코로나바이러스 감염 후유증의 근본 병인은 급성기 이후 남은 여사미진餘邪未盡(미세한 풍, 한, 습, 열의 잔여, 미세혈전 및 내피세포 손상 등)과 인체 정기 손상의 결합으로 봄 인체의 원기가 오행의 성질을 따라 좌우로 돌며 오르내리는 둥근 원형 운동인 일기주류가 깨진 데 본질이 있음. 중앙의 비토脾土가 회전축을 잃으면서 폐위肺胃는 내리지 못하고 간비肝脾는 오르지 못하는 기기승강괴려 상태에 빠짐으로써 호흡기, 순환기, 소화기, 신경계를 아우르는 복잡다단한 전신 증상을 유발함 특히 롱코비드의 수면장애, 심계, 불안 등은 간목肝木의 울결과 상화相火의 망동에서 비롯된 것으로 파악함 ②치료의 핵심 — 삼방합방三方合方과 선폐, 소간, 건비의 구조적 원리 황원어黃元禦의 학설을 바탕으로 황아탕黃芽湯, 하기탕下氣湯, 달울탕達鬱湯을 유기적으로 합방하여 선폐宣肺, 소간疏肝, 건비健脾의 삼위일체 구조를 완성함 중기中氣를 세워 회전축을 잡고 사방의 기기 승강을 동시에 조율함으로써 수많은 증상의 지엽적 대증 치료에서 벗어나 전신 기기를 일거에 회복시킴 ③동적 균형과 전인적 재활 원칙 일방적인 공벌攻伐을 피하고 원기를 보호하는 동시에 잠재된 여사餘邪를 제거하며 상호 촉진하는 염증, 면역의 악순환을 타파함 거시적인 기기 순환 회복은 미세혈전 개선, 항염증 사이토카인 조절, 폐포 미세환경 안정화 등 현대 약리학적 다표적 작용 기전과 상통하는 것으로 해석함 질병의 국소적 증상에 얽매이지 않고 인체의 오행 기기 순환을 바로잡아 스스로 건강을 회복하는 자생력을 도모함","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 롱코비드는 국내에서도 치료제가 없는 영역이며 공개자료상 이 처방의 중국 제품이 확인되지 않아, 피로·호흡곤란 지표 기반 국내 임상으로 근거를 먼저 쌓을 수 있음 참고문헌 [1] 쑨제,양전,하오젠메이.국의대사 양전의 선폐달울탕을 이용한 코로나19 감염 후유증 치료 경험國醫大師楊震運用宣肺達鬱湯治療新型冠狀病毒感染後遺症經驗[J].지린중의약吉林中醫藥,2024,44(9):1016-1019. [2] 자오펑,양전,류쑤샹,등.선폐달울탕의 코로나19 폐렴 회복 단계 치료 임상 연구宣肺達鬱湯治療新型冠狀病毒肺炎回復階段臨床研究[J].산시중의陝西中醫,2020,41(7):846-848."}},{"id":"5-14","ko":"청감방","hz":"淸感方","alias":"","master_ko":"왕례","master_hz":"王烈","tagline":"외감풍열外感風熱과 열독치성熱毒熾盛으로 인한 소아 외감 발열 및 열독증을 치료하는 처방","meta":{"주요 적응증":"소아 발열·급성 감염성 질환","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":327,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-14 청감방淸感方의 모듈 구성<\/p><h4>①해표퇴열解表退熱 및 소양조기少陽調機 모듈 — 표열을 발산하고 소양의 기기를 소통시켜 사기를 밖으로 몰아냄<\/h4><p><b>시호, 황금<\/b>: 가볍게 발산시키는 시호로 표열表熱을 풀고, 고한苦寒하여 아래로 내리는 황금으로 청열조습淸熱燥濕함. 이 두 약물의 일승일강一升一降 배오를 통해 소양의 기기를 소통시켜 사기를 밖으로 몰아냄<\/p><h4>②청열해독淸熱解毒 모듈 — 기혈의 열독을 내리고 인후를 이롭게 하여 고열과 인후종통을 다스림<\/h4><p><b>자초, 중루<\/b>: 자초는 혈분의 열독을 차갑게 식혀 고열을 멈추고 병세를 단축하며, 중루는 간경에 들어가 열독을 풀고 간을 식혀 경궐을 예방함<\/p><p><b>금련화, 야국화, 사간<\/b>: 금련화와 야국화는 약성이 가벼워 인후의 홍종과 두통 등 풍열의 표증을 다스리며, 사간은 열을 내리고 인후를 이롭게 함<\/p><p><b>청호<\/b>: 청호는 음을 기르고 열을 내림<\/p><h4>③청기사화淸氣瀉火 모듈 — 기분의 열을 신속히 끄고 청화淸火의 효능을 극대화함<\/h4><p><b>석고, 한수석<\/b>: 기분의 열을 끄는 석고와 성질이 찬 한수석을 배합하여 신속하게 열을 내리고 청화의 효능을 극대화함. 단, 한랭한 성질이 강하므로 비위의 양기를 해치지 않도록 중병즉지中病卽止의 원칙을 적용함<\/p>"},{"k":"master","t":"왕례의 소아 발열 및 열독증 치료","html":"<h4>①병기 인식 — 열독 이론과 폐상부족肺常不足, 식불지절食不知節 및 기기실조氣機失調<\/h4><p>소아는 본래 순양지체純陽之體로 양기가 순수하고 음식이 절도가 없어 쉽게 열熱과 화火로 화化하며 적체가 쌓여 독이 됨<\/p><p>동시에 폐상부족肺常不足으로 외사를 감수하면 쉽게 종양화열從陽化熱하여 열독을 형성함<\/p><p>외감풍열이 유입되고 체내 적체와 결합하여 기기실조를 일으키며, 고열 난퇴와 함께 열독이 전신으로 파급되는 병기적 특성을 지님<\/p><h4>②치료의 핵심 — 이병동치異病同治와 청열해독의 구조적 원리<\/h4><p>유아乳蛾(급성 화농성 편도선염), 폐렴천수喘嗽, 수족구병 등 임상 질환이 다양하더라도 ‘열독’이라는 공통된 병기 아래 동일한 주방(청감방淸感方)을 바탕으로 가감하는 이병동치 전략을 취함<\/p><p>겉으로는 기혈을 동시에 다스리고 속으로는 진액을 보호하며, 한량寒涼한 성질의 약물로 열을 빠르게 떨어뜨려 지엽적인 대증 치료의 한계를 극복함<\/p><h4>③동적 균형과 소아 생리 특성 고려<\/h4><p>소아는 비위가 약하므로 한랭한 성질의 약물(석고, 한수석, 자초 등)이 과도하게 비위를 상하게 하지 않도록 주의함<\/p><p>증상 소실 즉시 투약을 멈춘다는 원칙을 기본으로 하되, 백작약과 불수 등을 배합하여 음액을 보호하고 비위의 기기를 조화시키는 좌제佐制의 묘를 살림<\/p><p>급성 화농성 편도선염에는 길경, 목호접을 가미하여 해독리인解毒利咽하고, 폐렴에는 강잠, 지룡, 백굴채 등을 가미하여 지해화담평천止咳化痰平喘하며, 수족구병에는 곽향, 의이인 등을 더해 건비화습健脾化濕하는 등, 질환별 맞춤형 변증 활용을 강조함<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>허가 제품·신약 임상은 없음. 이름이 비슷한 금화청감과립金花淸感顆粒·소아연화청감과립은 조성이 다른 별개 제품임<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">소아 발열 대상 중성약 경쟁이 많으므로, 광물·독성 약재의 소아 안전성 자료와 맛 차폐 제형으로 차별화해야 함. 국내 공정서(약전·규격집)에 없는 중루·금련화가 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 리진웨이,궈레이,딩리즈훙.국의대사 왕례의 청감방 가감에 의한 소아 발열성 질환 치료 경험國醫大師王烈淸感方化裁治療小兒發熱類疾病經驗[J].중국중 서의결합소아과학中國中西醫結合兒科學,2025,17(5):457-460.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"시호","name":"시호","dose":"","base":"시호"},{"raw":"황금","name":"황금","dose":"","base":"황금"},{"raw":"자초","name":"자초","dose":"","base":"자초"},{"raw":"중루","name":"중루","dose":"","base":"중루"},{"raw":"금련화金蓮花","name":"금련화金蓮花","dose":"","base":"금련화"},{"raw":"야국화","name":"야국화","dose":"","base":"야국화"},{"raw":"生석고","name":"生석고","dose":"","base":"석고"},{"raw":"한수석","name":"한수석","dose":"","base":"한수석"},{"raw":"청호","name":"청호","dose":"","base":"청호"},{"raw":"사간","name":"사간","dose":"","base":"사간"}],"notes":[],"핵심 효능":["풍열風熱의 사기를 흩어지게 하고 체표의 울체된 열을 풀어냄(소풍해표疏風解表)","체내의 열독을 가라앉히고 독소를 해독하여 고열과 염증 반응을 빠르게 진정시킴(청열해독淸熱解毒)"],"주치증":["소아 발열(고열, 반복 발작), 소아 외감 발열(풍열형 감기), 급성 화농성 편도선염, 지연성 폐렴(폐렴 천수喘嗽), 수족구병 등 소아 열성 질환 제반 증상"],"연구 확장 영역":["소아 감염성 질환 전반, 바이러스성 및 세균성 발열성 질환, 상기도 감염 및 호흡기와 소화기 복합 증후군"],"R&D 포인트":["다성분, 다표적을 통한 항바이러스, 항염증 및 신속한 해열 작용","왕례王烈의 ‘열독熱毒’ 이론 및 ‘이병동치異病同治’ 원리에 기반한 소아 발열 메커니즘 조절","청열, 양혈涼血, 거풍祛風 약물의 유기적 배합을 통한 고열 조절 및 전변 억제 유효성 규명"]},"modules":[{"name":"①해표퇴열 · 소양조기","hz":"解表退熱 · 少陽調機","herbs":["시호","황금"],"role":"표열을 발산하고 소양의 기기를 소통시켜 사기를 밖으로 몰아냄"},{"name":"②청열해독","hz":"淸熱解毒","herbs":["자초","중루","금련화","야국화","사간","청호"],"role":"기혈의 열독을 내리고 인후를 이롭게 하여 고열과 인후종통을 다스림"},{"name":"③청기사화","hz":"淸氣瀉火","herbs":["석고","한수석"],"role":"기분의 열을 신속히 끄고 청화淸火의 효능을 극대화함"}],"rd":[{"tag":"Pediatric Fever","title":"소아 외감 발열의 해열 시간 단축","html":"<p>청감방 가감에 의한 소아 발열 질환 치료 경험이 있음<\/p><p>해열제 병용 시 완전 해열까지 걸리는 시간과 해열제 사용 횟수를 지표로 한 탐색 임상이 적합하되, 해열제 등 표준 진료는 유지 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](소아 발열 질환 치료 경험))<\/p>"},{"tag":"Tonsillitis & HFMD","title":"화농성 편도선염·수족구병 등 질환별 효과","html":"<p>편도선염·폐렴·수족구병은 질환별 필수 치료와 중증 기준이 다름<\/p><p>질환별로 나누어 분석하고, 화농성 편도선염은 세균성 여부에 따라 항생제 적응증을 표준 진료로 따로 판단(항생제가 필요 없는 질환으로 일괄 분류하지 않음) (근거 유형: 신규 연구가설 | 근거: 본문 주치증, R&amp;D 논리 4 「이병동치」)<\/p>"},{"tag":"Pediatric Dosing","title":"석고·한수석·중루 포함 처방의 소아 용량","html":"<p>광물 약재(생석고·한수석)와 중루重樓가 포함되어 있음<\/p><p>소아 용량 기준과 ‘중병즉지中病卽止’ 원칙에 따른 투여 기간 상한을 정하고, 국내 공정서에 없는 중루·금련화는 대체 약재를 검토 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4, 본문 조성표)<\/p>"},{"tag":"Pediatric Formulation","title":"소아 복용 순응도를 높인 제형","html":"<p>쓴맛이 강한 청열 약재 위주임<\/p><p>소아가 복용하기 쉬운 과립·시럽 제형으로 바꾸고 맛 차폐와 순응도를 평가하는 것이 임상 적용의 전제 (근거 유형: 신규 연구가설 | 근거: 본문 주치증(소아), 조성표)<\/p>"}],"logic":[{"n":"1","title":"소풍해표疏風解表와 소양조기少陽調機","body":"시호와 황금의 일승일강 배오 하는 것이 임상 적용의 전제 (근거 유형: 신규 연구가설 | 근거: 본문 주치증(소아), 조성표)"],"ss":{"composition":"그림 5-14 청감방淸感方의 모듈 구성 ①해표퇴열解表退熱 및 소양조기少陽調機 모듈 — 표열을 발산하고 소양의 기기를 소통시켜 사기를 밖으로 몰아냄 시호, 황금 : 가볍게 발산시키는 시호로 표열表熱을 풀고, 고한苦寒하여 아래로 내리는 황금으로 청열조습淸熱燥濕함. 이 두 약물의 일승일강一升一降 배오를 통해 소양의 기기를 소통시켜 사기를 밖으로 몰아냄 ②청열해독淸熱解毒 모듈 — 기혈의 열독을 내리고 인후를 이롭게 하여 고열과 인후종통을 다스림 자초, 중루 : 자초는 혈분의 열독을 차갑게 식혀 고열을 멈추고 병세를 단축하며, 중루는 간경에 들어가 열독을 풀고 간을 식혀 경궐을 예방함 금련화, 야국화, 사간 : 금련화와 야국화는 약성이 가벼워 인후의 홍종과 두통 등 풍열의 표증을 다스리며, 사간은 열을 내리고 인후를 이롭게 함 청호 : 청호는 음을 기르고 열을 내림 ③청기사화淸氣瀉火 모듈 — 기분의 열을 신속히 끄고 청화淸火의 효능을 극대화함 석고, 한수석 : 기분의 열을 끄는 석고와 성질이 찬 한수석을 배합하여 신속하게 열을 내리고 청화의 효능을 극대화함. 단, 한랭한 성질이 강하므로 비위의 양기를 해치지 않도록 중병즉지中病卽止의 원칙을 적용함","master":"①병기 인식 — 열독 이론과 폐상부족肺常不足, 식불지절食不知節 및 기기실조氣機失調 소아는 본래 순양지체純陽之體로 양기가 순수하고 음식이 절도가 없어 쉽게 열熱과 화火로 화化하며 적체가 쌓여 독이 됨 동시에 폐상부족肺常不足으로 외사를 감수하면 쉽게 종양화열從陽化熱하여 열독을 형성함 외감풍열이 유입되고 체내 적체와 결합하여 기기실조를 일으키며, 고열 난퇴와 함께 열독이 전신으로 파급되는 병기적 특성을 지님 ②치료의 핵심 — 이병동치異病同治와 청열해독의 구조적 원리 유아乳蛾(급성 화농성 편도선염), 폐렴천수喘嗽, 수족구병 등 임상 질환이 다양하더라도 ‘열독’이라는 공통된 병기 아래 동일한 주방(청감방淸感方)을 바탕으로 가감하는 이병동치 전략을 취함 겉으로는 기혈을 동시에 다스리고 속으로는 진액을 보호하며, 한량寒涼한 성질의 약물로 열을 빠르게 떨어뜨려 지엽적인 대증 치료의 한계를 극복함 ③동적 균형과 소아 생리 특성 고려 소아는 비위가 약하므로 한랭한 성질의 약물(석고, 한수석, 자초 등)이 과도하게 비위를 상하게 하지 않도록 주의함 증상 소실 즉시 투약을 멈춘다는 원칙을 기본으로 하되, 백작약과 불수 등을 배합하여 음액을 보호하고 비위의 기기를 조화시키는 좌제佐制의 묘를 살림 급성 화농성 편도선염에는 길경, 목호접을 가미하여 해독리인解毒利咽하고, 폐렴에는 강잠, 지룡, 백굴채 등을 가미하여 지해화담평천止咳化痰平喘하며, 수족구병에는 곽향, 의이인 등을 더해 건비화습健脾化濕하는 등, 질환별 맞춤형 변증 활용을 강조함","rd":"","china":"중국 제품화 현황 허가 제품·신약 임상은 없음. 이름이 비슷한 금화청감과립金花淸感顆粒·소아연화청감과립은 조성이 다른 별개 제품임 시사점 소아 발열 대상 중성약 경쟁이 많으므로, 광물·독성 약재의 소아 안전성 자료와 맛 차폐 제형으로 차별화해야 함. 국내 공정서(약전·규격집)에 없는 중루·금련화가 포함되어 있어 한약제제로 개발하려면 대체 약재나 별도 원료 기준이 필요함 참고문헌 [1] 리진웨이,궈레이,딩리즈훙.국의대사 왕례의 청감방 가감에 의한 소아 발열성 질환 치료 경험國醫大師王烈淸感方化裁治療小兒發熱類疾病經驗[J].중국중 서의결합소아과학中國中西醫結合兒科學,2025,17(5):457-460."}},{"id":"5-15","ko":"청금숙폐지해방","hz":"淸金肅肺止咳方","alias":"","master_ko":"루즈정","master_hz":"路志正","tagline":"선강宣降을 축으로 삼고 고평청윤苦平淸潤을 보조하여 계절에 구애받지 않고 외감 및 내상으로 인한 기침을 치료하는 처방","meta":{"주요 적응증":"급·만성 기침","확인된 연구자료 유형":"경험 보고","제형·제품화":"—"},"page":331,"sections":[{"k":"composition","t":"처방 구성","html":"<p class=\"cap\">그림 5-15 청금숙폐지해방淸金肅肺止咳方의 모듈 구성<\/p><h4>①숙폐강기肅肺降氣 및 청금화담淸金化痰 모듈 — 상초의 폐기를 선통宣通하고 폐금肺金을 숙강肅降시켜 담을 삭이고 기침을 멈춤<\/h4><p><b>행인, 비파엽<\/b>: 행인으로 폐기를 통하게 하고 아래로 내리며, 비파엽으로 하기청담下氣淸痰 및 청폐화위淸肺和胃하며 기를 내림. 두 약의 배오로 상초의 폐기를 가볍게 선달宣達하고, 아래로 폐금을 숙강하여 화담지해化痰止咳함<\/p><h4>②개달폐기開達肺氣 및 온윤지해溫潤止咳 모듈 — 폐기를 열어주고 윤택하게 하여 담천痰喘을 다스림<\/h4><p><b>자완, 전호, 백부<\/b>: 자완으로 폐를 윤택하게 하고 기를 내려 담천을 다스리며, 전호로 풍한風寒을 풀고 하기下氣를 전문으로 하여 담수痰嗽와 비만痞滿을 다스리고, 백부로 폐기를 윤택하게 하고 기분氣分을 소통시켜 상호 보완함. 세 약의 합용으로 폐기를 열어주어 기침을 멈추고 담痰을 제거함<\/p><h4>③승청강탁升淸降濁 및 기기조화氣機調和 모듈 — 승청升淸과 강탁降濁, 승강升降의 묘를 발휘하여 흉중 상초의 담을 다스림<\/h4><p><b>길경, 후박<\/b>: 상승하여 인후를 이롭게 하는 길경과 역기逆氣를 내리고 흉격胸膈을 넓히며 제반 적체積滯를 없애는 후박이 어우러져 승청강탁升淸降濁과 폐를 이롭게 하여 기침을 멈추는 작용을 발휘함<\/p><p><b>선복화<\/b>: “모든 꽃은 다 상승하지만 오직 선복화만 내려간다諸花皆升, 旋覆獨降”의 특성으로 상승했다가 다시 내려가며, 개결하기開結下氣하여 흉중 상초의 담을 다스림. 행인과 함께 화담化痰 작용을 하며 선강宣降의 구조를 형성함<\/p><h4>④보폐익신補肺益腎 모듈 — 기혈을 보하고 폐신을 자양하며 전반적인 조화를 도모함<\/h4><p><b>금선화<\/b>: 본 처방의 화룡점정. 감한甘寒한 성질로 기혈을 보하고 폐신을 자양하며 기침을 멈추고, 해경 및 산풍열 등의 작용을 통해 전체 방제에 보補와 청淸, 승升과 강降을 겸비하게 함<\/p>"},{"k":"master","t":"루즈정의 기침(해수咳嗽) 치료","html":"<h4>①병기 인식 — 내외양단內外兩端, 폐실청숙肺失淸肅, 폐위동치肺胃同治<\/h4><p><b>내외양단<\/b>: 기침의 병인이 크게 외감의 풍한風寒, 풍열風熱, 풍조風燥와 내상의 담습痰濕, 화火, 허虛의 두 갈래로 나뉨<\/p><p><b>폐실청숙<\/b>: 《중의임증비요中醫臨證備要·해수咳嗽》의 “폐는 교장嬌臟이요 청숙을 주관하며 기가 거슬러 오르면 기침한다”는 이론과 《의학삼자경醫學三字經》에서 “폐는 종과 같아서 치면 울린다”는 비유를 참고하여, 외인으로 인해 발병하는 것을 ‘외당명外撞鳴’, 내인으로 인해 발병한 것을 ‘내당명內撞鳴’으로 파악함<\/p><p><b>폐위동치肺胃同治<\/b>: 《소문素問·해론咳論》의 “오장육부가 모두 기침을 일으키며 홀로 폐만 그런 것이 아니다. 오장의 오래된 기침은 육부로 전이된다. 이들은 모두 위에 모여 폐와 관통한다”는 사상을 바탕으로, 증상은 같아도 치료는 다르며 폐와 중초를 함께 다스림<\/p><h4>②치료의 핵심 — 선강宣降을 축軸으로 하고, 고평청윤苦平淸潤을 보輔로 함<\/h4><p><b>선강과 고평청윤<\/b>: 폐기를 위로 열어주고 아래로 내려주는 선강을 축으로 삼고, 맛이 쓰고 성질이 평하며 열을 내리고 윤택하게 하는 약물을 보조로 하여 청금숙폐 및 화담지해의 효능을 발휘함<\/p><p>약성이 지나치게 차갑거나 뜨겁지 않고, 평담平淡함 속에 기묘한 승강의 이치를 내포하여 사계절 내내 제반 기침을 다스림<\/p><h4>③임상 변증 가감 — 청금숙폐지해방을 기본방으로 증에 따라 가감<\/h4><p class=\"lbl2\">외감 기침<\/p><p class=\"sub\">풍한증風寒證에는 마황, 형개, 자소엽 등을 더해 선산풍한宣散風寒<\/p><p class=\"sub\">풍열증風熱證에는 금은화, 연교, 금교맥, 상엽, 국화 등을 더해 산풍청열散風淸熱<\/p><p class=\"sub\">풍조증風燥證에는 상백피, 이피梨皮, 백합 등을 더해 소풍윤조疏風潤燥함<\/p><p class=\"lbl2\">내상 기침<\/p><p class=\"sub\">담습증痰濕證에는 반하, 진피, 백개자, 내복자 등을 더해 조습화담燥濕化痰, 이기지해理氣止咳<\/p><p class=\"sub\">담열증痰熱證에는 괄루, 천화분, 지모, 浙패모, 어성초 등을 더해 청열숙폐淸熱肅肺, 활담지해豁痰止咳<\/p><p class=\"sub\">간화증肝火證에는 대합산黛蛤散, 가감사백산加減瀉白散 등을 합방하여 청폐사간淸肺瀉肝, 순기강화順氣降火<\/p><p class=\"sub\">폐음허증肺陰虛證에는 사삼, 맥문동, 천문동, 현삼 등을 더해 자음윤폐滋陰潤肺, 화담지해化痰止咳<\/p>"},{"k":"rd","t":"전통 처방의 현대 과학적 해석","html":""},{"k":"china","t":"중국 제품화 현황","html":"<p class=\"lbl\">중국 제품화 현황<\/p><p>중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음<\/p><p class=\"boxlbl\">시사점<\/p><p class=\"box\">범용 기침 처방으로 공개자료상 제품·특허가 확인되지 않으며, 금선화 원료 확인이 국내 개발의 첫 과제<\/p><p>참고문헌<\/p><ol class=\"refs\"><li class=\"ref\">[1] 양후이칭,정자오잉,루제,등.“루씨청금숙폐지해방” 임상 응용에 대한 고찰“路氏淸金肅肺止咳方”臨床應用淺析[J].세계중서의결합잡지世界中西醫結合雜志,2013,8(5):443-444+463.<\/li><\/ol>"}],"identity":{"herbs":[{"raw":"炒행인9g","name":"炒행인","dose":"9g","base":"행인"},{"raw":"炙비파엽12g","name":"炙비파엽","dose":"12g","base":"비파엽"},{"raw":"자완12g","name":"자완","dose":"12g","base":"자완"},{"raw":"전호12g","name":"전호","dose":"12g","base":"전호"},{"raw":"백부12g","name":"백부","dose":"12g","base":"백부"},{"raw":"길경10g","name":"길경","dose":"10g","base":"길경"},{"raw":"후박12g","name":"후박","dose":"12g","base":"후박"},{"raw":"선복화12g(包煎)","name":"선복화","dose":"12g(包煎)","base":"선복화"},{"raw":"금선화金蟬花12g","name":"금선화金蟬花","dose":"12g","base":"금선화"}],"notes":[],"핵심 효능":["막힌 폐기를 위로 열어주고 치솟은 기를 아래로 끌어내려 기기를 소통시킴(선폐강기宣肺降氣)","담습과 열담을 삭이고 얽힌 기도를 안정시켜 기침을 멈춤(화담지해化痰止咳)","폐의 열을 내리고 정상적인 청숙淸肅 기능을 회복시킴(청금숙폐淸金肅肺)"],"주치증":["외감 및 내상으로 인한 각종 지속적이고 반복적인 기침, 급성과 만성의 기침 제반 증상"],"연구 확장 영역":["호흡기 감염성 질환, 급·만성 기관지염, 인후염 후유증의 기침, 감염 후 기침 등"],"R&D 포인트":["다성분, 다표적 네트워크 약리학 분석을 통한 항염증, 평활근 이완, 기관지 분비 조절 작용 규명","‘폐위동치肺胃同治’ 축과 ‘선강위주宣降爲主’ 기전의 실험적 검증을 통한 상초, 중초 연계 호흡기 조절 메커니즘 탐색","불한량不寒涼, 불온조不溫燥의 약물 배합을 활용해 장기 복용 안전성을 검증하고 계절별 사용 가능성을 평가하는 제제(신약, 건기식) 플랫폼 개발"]},"modules":[{"name":"①숙폐강기 · 청금화담","hz":"肅肺降氣 · 淸金化痰","herbs":["행인","비파엽"],"role":"상초의 폐기를 선통宣通하고 폐금肺金을 숙강肅降시켜 담을 삭이고 기침을 멈춤"},{"name":"②개달폐기 · 온윤지해","hz":"開達肺氣 · 溫潤止咳","herbs":["자완","전호","백부"],"role":"폐기를 열어주고 윤택하게 하여 담천痰喘을 다스림"},{"name":"③승청강탁 · 기기조화","hz":"升淸降濁 · 氣機調和","herbs":["길경","후박","선복화"],"role":"승청升淸과 강탁降濁, 승강升降의 묘를 발휘하여 흉중 상초의 담을 다스림"},{"name":"④보폐익신","hz":"補肺益腎","herbs":["금선화"],"role":"기혈을 보하고 폐신을 자양하며 전반적인 조화를 도모함"}],"rd":[{"tag":"Persistent Cough","title":"원인별 지속성 기침의 범용 처방 효과","html":"<p>외감·내상을 가리지 않는 범용 기침 처방이라는 점이 특징임<\/p><p>감염 후 기침·만성 기침 등 원인별로 반응을 나누어 분석해 범용성이 실제로 유지되는지 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2013, 임상 응용 고찰))<\/p>"},{"tag":"Cordyceps Cicadae","title":"금선화(선화)의 역할과 대체","html":"<p>금선화金蟬花는 매미 유충에 기생하는 균류 약재로 국내 공정서(대한민국약전· 대한민국약전외한약(생약)규격집)에 수재되어 있지 않음<\/p><p>‘보폐익신’ 효과를 금선화 유무 비교로 검증하고 대체 가능성을 함께 확인 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4 「보폐익신과 사계절 범용」, 본문 조성표)<\/p>"},{"tag":"Antitussive Core","title":"행인·비파엽·자완·백부의 진해 효과","html":"<p>진해 약재군의 기침 억제 효과를 동물 기침 모델에서 비교함<\/p><p>후박·선복화의 강기 작용이 추가 이득을 주는지 확인하여 처방의 핵심을 좁힘 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 1·3, 본문 조성표)<\/p>"},{"tag":"Long-term Safety","title":"장기 복용 안전성 자료 확보","html":"<p>한랭·온조에 치우치지 않는 평담한 구성이라는 해석만으로 장기 안전성이나 일반의약품 가능성을 추론할 수 없음<\/p><p>간·신장 기능과 위장 증상을 포함한 독성·품질 자료를 먼저 확보한 뒤 제품 형태를 검토 (근거 유형: 신규 연구가설 | 근거: R&amp;D 논리 4, 본문 조성표)<\/p>"}],"logic":[{"n":"1","title":"숙폐강기肅肺降氣와 청금화담淸金化痰","body":"상초의 폐기를 선통하고 아래로 폐금을 숙강하여 화담지해化痰止咳함"},{"n":"2","title":"개달폐기開達肺氣와 온윤지해溫潤止咳","body":"폐기를 열어주고 윤택하게 하여 담천痰喘을 다스림"},{"n":"3","title":"승청강탁升淸降濁과 선강구조宣降構造","body":"흉중 상초의 담을 다스리고 승강의 묘를 발휘함"},{"n":"4","title":"보폐익신補肺益腎과 사계절 범용","body":"금선화의 배합을 통해 불한량 불온조의 평담한 기조를 이루며 기혈을 보양함"}],"field":5,"pages":[331,335],"evidence":"경험 보고","product":"—","status":"확인된 제품·특허 없음","s":["5-15","청금숙폐지해방","淸金肅肺止咳方","","루즈정","路志正","선강宣降을 축으로 삼고 고평청윤苦平淸潤을 보조하여 계절에 구애받지 않고 외감 및 내상으로 인한 기침을 치료하는 처방","炒행인9g 炙비파엽12g 자완12g 전호12g 백부12g 길경10g 후박12g 선복화12g(包煎) 금선화金蟬花12g","","핵심 효능 막힌 폐기를 위로 열어주고 치솟은 기를 아래로 끌어내려 기기를 소통시킴(선폐강기宣肺降氣) 담습과 열담을 삭이고 얽힌 기도를 안정시켜 기침을 멈춤(화담지해化痰止咳) 폐의 열을 내리고 정상적인 청숙淸肅 기능을 회복시킴(청금숙폐淸金肅肺)","주치증 외감 및 내상으로 인한 각종 지속적이고 반복적인 기침, 급성과 만성의 기침 제반 증상","연구 확장 영역 호흡기 감염성 질환, 급·만성 기관지염, 인후염 후유증의 기침, 감염 후 기침 등","R&D 포인트 다성분, 다표적 네트워크 약리학 분석을 통한 항염증, 평활근 이완, 기관지 분비 조절 작용 규명 ‘폐위동치肺胃同治’ 축과 ‘선강위주宣降爲主’ 기전의 실험적 검증을 통한 상초, 중초 연계 호흡기 조절 메커니즘 탐색 불한량不寒涼, 불온조不溫燥의 약물 배합을 활용해 장기 복용 안전성을 검증하고 계절별 사용 가능성을 평가하는 제제(신약, 건기식) 플랫폼 개발","①숙폐강기 · 청금화담 肅肺降氣 · 淸金化痰 행인 비파엽 상초의 폐기를 선통宣通하고 폐금肺金을 숙강肅降시켜 담을 삭이고 기침을 멈춤","②개달폐기 · 온윤지해 開達肺氣 · 溫潤止咳 자완 전호 백부 폐기를 열어주고 윤택하게 하여 담천痰喘을 다스림","③승청강탁 · 기기조화 升淸降濁 · 氣機調和 길경 후박 선복화 승청升淸과 강탁降濁, 승강升降의 묘를 발휘하여 흉중 상초의 담을 다스림","④보폐익신 補肺益腎 금선화 기혈을 보하고 폐신을 자양하며 전반적인 조화를 도모함","숙폐강기肅肺降氣와 청금화담淸金化痰 상초의 폐기를 선통하고 아래로 폐금을 숙강하여 화담지해化痰止咳함","개달폐기開達肺氣와 온윤지해溫潤止咳 폐기를 열어주고 윤택하게 하여 담천痰喘을 다스림","승청강탁升淸降濁과 선강구조宣降構造 흉중 상초의 담을 다스리고 승강의 묘를 발휘함","보폐익신補肺益腎과 사계절 범용 금선화의 배합을 통해 불한량 불온조의 평담한 기조를 이루며 기혈을 보양함","Persistent Cough 원인별 지속성 기침의 범용 처방 효과 외감·내상을 가리지 않는 범용 기침 처방이라는 점이 특징임 감염 후 기침·만성 기침 등 원인별로 반응을 나누어 분석해 범용성이 실제로 유지되는지 확인 (근거 유형: 임상 경험 보고 | 근거: 참고문헌 [1](2013, 임상 응용 고찰))","Cordyceps Cicadae 금선화(선화)의 역할과 대체 금선화金蟬花는 매미 유충에 기생하는 균류 약재로 국내 공정서(대한민국약전· 대한민국약전외한약(생약)규격집)에 수재되어 있지 않음 ‘보폐익신’ 효과를 금선화 유무 비교로 검증하고 대체 가능성을 함께 확인 (근거 유형: 신규 연구가설 | 근거: R&D 논리 4 「보폐익신과 사계절 범용」, 본문 조성표)","Antitussive Core 행인·비파엽·자완·백부의 진해 효과 진해 약재군의 기침 억제 효과를 동물 기침 모델에서 비교함 후박·선복화의 강기 작용이 추가 이득을 주는지 확인하여 처방의 핵심을 좁힘 (근거 유형: 신규 연구가설 | 근거: R&D 논리 1·3, 본문 조성표)","Long-term Safety 장기 복용 안전성 자료 확보 한랭·온조에 치우치지 않는 평담한 구성이라는 해석만으로 장기 안전성이나 일반의약품 가능성을 추론할 수 없음 간·신장 기능과 위장 증상을 포함한 독성·품질 자료를 먼저 확보한 뒤 제품 형태를 검토 (근거 유형: 신규 연구가설 | 근거: R&D 논리 4, 본문 조성표)"],"ss":{"composition":"그림 5-15 청금숙폐지해방淸金肅肺止咳方의 모듈 구성 ①숙폐강기肅肺降氣 및 청금화담淸金化痰 모듈 — 상초의 폐기를 선통宣通하고 폐금肺金을 숙강肅降시켜 담을 삭이고 기침을 멈춤 행인, 비파엽 : 행인으로 폐기를 통하게 하고 아래로 내리며, 비파엽으로 하기청담下氣淸痰 및 청폐화위淸肺和胃하며 기를 내림. 두 약의 배오로 상초의 폐기를 가볍게 선달宣達하고, 아래로 폐금을 숙강하여 화담지해化痰止咳함 ②개달폐기開達肺氣 및 온윤지해溫潤止咳 모듈 — 폐기를 열어주고 윤택하게 하여 담천痰喘을 다스림 자완, 전호, 백부 : 자완으로 폐를 윤택하게 하고 기를 내려 담천을 다스리며, 전호로 풍한風寒을 풀고 하기下氣를 전문으로 하여 담수痰嗽와 비만痞滿을 다스리고, 백부로 폐기를 윤택하게 하고 기분氣分을 소통시켜 상호 보완함. 세 약의 합용으로 폐기를 열어주어 기침을 멈추고 담痰을 제거함 ③승청강탁升淸降濁 및 기기조화氣機調和 모듈 — 승청升淸과 강탁降濁, 승강升降의 묘를 발휘하여 흉중 상초의 담을 다스림 길경, 후박 : 상승하여 인후를 이롭게 하는 길경과 역기逆氣를 내리고 흉격胸膈을 넓히며 제반 적체積滯를 없애는 후박이 어우러져 승청강탁升淸降濁과 폐를 이롭게 하여 기침을 멈추는 작용을 발휘함 선복화 : “모든 꽃은 다 상승하지만 오직 선복화만 내려간다諸花皆升, 旋覆獨降”의 특성으로 상승했다가 다시 내려가며, 개결하기開結下氣하여 흉중 상초의 담을 다스림. 행인과 함께 화담化痰 작용을 하며 선강宣降의 구조를 형성함 ④보폐익신補肺益腎 모듈 — 기혈을 보하고 폐신을 자양하며 전반적인 조화를 도모함 금선화 : 본 처방의 화룡점정. 감한甘寒한 성질로 기혈을 보하고 폐신을 자양하며 기침을 멈추고, 해경 및 산풍열 등의 작용을 통해 전체 방제에 보補와 청淸, 승升과 강降을 겸비하게 함","master":"①병기 인식 — 내외양단內外兩端, 폐실청숙肺失淸肅, 폐위동치肺胃同治 내외양단 : 기침의 병인이 크게 외감의 풍한風寒, 풍열風熱, 풍조風燥와 내상의 담습痰濕, 화火, 허虛의 두 갈래로 나뉨 폐실청숙 : 《중의임증비요中醫臨證備要·해수咳嗽》의 “폐는 교장嬌臟이요 청숙을 주관하며 기가 거슬러 오르면 기침한다”는 이론과 《의학삼자경醫學三字經》에서 “폐는 종과 같아서 치면 울린다”는 비유를 참고하여, 외인으로 인해 발병하는 것을 ‘외당명外撞鳴’, 내인으로 인해 발병한 것을 ‘내당명內撞鳴’으로 파악함 폐위동치肺胃同治 : 《소문素問·해론咳論》의 “오장육부가 모두 기침을 일으키며 홀로 폐만 그런 것이 아니다. 오장의 오래된 기침은 육부로 전이된다. 이들은 모두 위에 모여 폐와 관통한다”는 사상을 바탕으로, 증상은 같아도 치료는 다르며 폐와 중초를 함께 다스림 ②치료의 핵심 — 선강宣降을 축軸으로 하고, 고평청윤苦平淸潤을 보輔로 함 선강과 고평청윤 : 폐기를 위로 열어주고 아래로 내려주는 선강을 축으로 삼고, 맛이 쓰고 성질이 평하며 열을 내리고 윤택하게 하는 약물을 보조로 하여 청금숙폐 및 화담지해의 효능을 발휘함 약성이 지나치게 차갑거나 뜨겁지 않고, 평담平淡함 속에 기묘한 승강의 이치를 내포하여 사계절 내내 제반 기침을 다스림 ③임상 변증 가감 — 청금숙폐지해방을 기본방으로 증에 따라 가감 외감 기침 풍한증風寒證에는 마황, 형개, 자소엽 등을 더해 선산풍한宣散風寒 풍열증風熱證에는 금은화, 연교, 금교맥, 상엽, 국화 등을 더해 산풍청열散風淸熱 풍조증風燥證에는 상백피, 이피梨皮, 백합 등을 더해 소풍윤조疏風潤燥함 내상 기침 담습증痰濕證에는 반하, 진피, 백개자, 내복자 등을 더해 조습화담燥濕化痰, 이기지해理氣止咳 담열증痰熱證에는 괄루, 천화분, 지모, 浙패모, 어성초 등을 더해 청열숙폐淸熱肅肺, 활담지해豁痰止咳 간화증肝火證에는 대합산黛蛤散, 가감사백산加減瀉白散 등을 합방하여 청폐사간淸肺瀉肝, 순기강화順氣降火 폐음허증肺陰虛證에는 사삼, 맥문동, 천문동, 현삼 등을 더해 자음윤폐滋陰潤肺, 화담지해化痰止咳","rd":"","china":"중국 제품화 현황 중국 국가약품감독관리국 허가 중성약, 약물임상시험 등록(CTR), 특허(처방명·대사명 검색)에서 이 처방의 제품·신약 임상·특허가 확인되지 않음(공개자료 검색 범위 기준). 대사의 임상 경험방(탕제) 단계로 보이며, 원내제제 여부는 공개 DB로 확인할 수 없음 시사점 범용 기침 처방으로 공개자료상 제품·특허가 확인되지 않으며, 금선화 원료 확인이 국내 개발의 첫 과제 참고문헌 [1] 양후이칭,정자오잉,루제,등.“루씨청금숙폐지해방” 임상 응용에 대한 고찰“路氏淸金肅肺止咳方”臨床應用淺析[J].세계중서의결합잡지世界中西醫結合雜志,2013,8(5):443-444+463."}}],"front":{"foreword":"<p>국의대사國醫大師는 중국 정부가 2009년부터 네 차례에 걸쳐 회차마다 30명씩, 모두 120명을 선정해 온 중국 중의학계를 대표하는 임상가입니다. 한국한의학연구원은 그동안 이들의 생애와 학술사상, 의안을 정리한 《중국국의대사》 4권을 펴내 한의계에 소개하였고, 임상과 교육 현장에서 좋은 반응을 얻었습니다.<\/p><p>국의대사의 오랜 임상 경험이 응축된 경험방은 임상 현장에서 활용도가 높을 뿐 아니라, 중국에서는 이를 바탕으로 중성약 제품화와 기전 연구, 임상 연구 등 다양한 융합 연구가 이어지고 있습니다. 그러나 국내에서는 지금까지 국의대사의 경험방을 따로 분석하여 정리한 자료가 없었습니다.<\/p><p>이번에 발간하는 「중국 국의대사 경험방 R&amp;D 인사이트」는 이러한 필요에서 기획되었습니다. 위장관계·장-뇌축·소화기, 피부·알레르기·류마티스·면역, 근신경계·퇴행성 질환 및 건강고령화, 수면·신경정신·인지, 호흡기·감염병의 다섯 가지 우선순위 질환군에서 대표적 경험방 66종을 골라, 처방의 조성과 효능, 약재 모듈로 본 처방 구성, 국의대사의 학술사상, 전통 이론의 현대 과학적 해석과 R&amp;D 제언, 최근 연구 동향, 중국 내 제품화 현황을 처방마다 같은 틀로 정리하였습니다.<\/p><p>본 책은 국의대사의 임상 사고를 이해하여 한의사가 진료에 참고하는 데 도움이 될 뿐 아니라, 한의학 연구자들이 최신 연구 동향을 파악하고 신약 후보 탐색, 한약소재 개발, 연구 모델 설계 등 새로운 연구 과제를 구상하는 기초 자료로 활용될 수 있을 것입니다. 다만 본문의 R&amp;D 제언은 후속 검증이 필요한 연구 가설이며, 실제 연구와 개발에 앞서 국내 기준에 따른 원료·안전성·유효성 검토가 함께 이루어져야 함을 밝혀 둡니다.<\/p><p>한국한의학연구원은 앞으로도 중국을 비롯한 해외 전통의학의 최신 성과를 체계적으로 수집·분석하여, 한의 임상과 연구 현장에서 바로 활용할 수 있는 자료를 꾸준히 제공하겠습니다. 이를 통해 한의학의 학문적 발전과 연구 경쟁력 강화, 나아가 국민 건강 증진에 기여할 수 있도록 최선을 다하겠습니다.<\/p><p>끝으로, 본 책의 기획과 집필, 검토에 힘써 주신 연구진과 자료 조사에 협조해 주신 관계자 여러분, 그리고 귀중한 의견을 주신 원내 연구자 여러분께 깊이 감사드립니다.<\/p><p>한국한의학연구원장고 성 규<\/p><p class=\"sig\">2026년 11월<\/p>","howto":"<dl class=\"dl\"><dt>[R&amp;D Recipe 1-1]<\/dt><dd>분야-순번 처방 번호(비교표 No와 같음)<\/dd><dt>1. 처방 아이덴티티<\/dt><dd>조성·핵심 효능·주치증·R&amp;D 포인트를 한눈에 요약<\/dd><dt>2. 처방 구성<\/dt><dd>약재를 기능별 모듈로 묶어 처방의 설계 논리를 정리(모듈 구성도를 함께 실음)<\/dd><dt>3. [Master's Thought]<\/dt><dd>대사의 병기 이해와 치료 원칙, 그 현대적 해석<\/dd><dt>4. [R&amp;D 인사이트]<\/dt><dd>전통 이론의 현대 과학적 해석과 R&amp;D 제언 표<\/dd><dt>5. [Research Evidence]<\/dt><dd>연구가 축적된 처방에 한해 최근 15년 논문 수·연구 키워드·주요 연구(2026년 5~10월 CNKI 검색)<\/dd><dt>6. [China Products]<\/dt><dd>중국 제품화 현황과 시사점<\/dd><\/dl><h4>읽을 때 유의할 점<\/h4><p class=\"note\">※ 본문은 ① 국의대사 임상 경험, ② 논문으로 보고된 실험·임상 결과, ③ 집필진이 제안한 R&amp;D 가설(R&amp;D 포인트·제언 표·시사점)의 세 층위로 이루어져 있으며, ③은 후속 검증이 필요한 가설임<\/p><p class=\"note\">※ 본 보고서의 연구 결과는 연구 유형과 근거 범위에 따라 해석하며, 비임상 결과나 예측 연구를 임상적 유효성의 확증으로 간주하지 않음 ― 네트워크 약리학·분자도킹: 표적·기전을 예측함 / 세포·동물실험: 비임상 모델에서 효과·기전이 관찰됨 / 단일군 임상 관찰: 개선 가능성이 보고됨 / 무작위 대조시험: 해당 연구 조건에서 비교 효과가 평가됨<\/p><p class=\"note\">※ R&amp;D 제언 표의 근거 유형 ― 직접 연구 근거: 해당 처방(또는 같은 조성)으로 한 임상·실험 연구 / 임상 경험 보고: 대사·제자의 치료 경험·증례 보고 / 간접 근거: 개별 약재·유사 처방·다른 질환 모델에서 나온 결과 / 제품·허가 자료: 제품 설명서·임상시험 등록· 특허 / 신규 연구가설: 전통 병기를 현대 표적으로 재해석한 집필진의 제언<\/p><p class=\"note\">※ R&amp;D 제언은 처방별 연구 성숙도에 맞춰 읽어야 함 ― 구체적 검증 설계를 제시한 11종의 처방은 대조군·평가 지표까지 적었고, 경험 보고 위주 처방은 우선 적응증 선정·후향적 증례 분석·안전성·원료 확보 같은 선행 과제가 먼저임. 모든 제언은 표준 치료를 대체하거나 늦추지 않는 것을 전제로 함<\/p><p class=\"note\">※ 원처방(대사의 경험방)과 허가 제품·개발 중 제제의 조성은 다를 수 있으므로, 제품 연구의 결과를 원처방의 근거로 그대로 옮겨 읽지 않아야 함<\/p><p class=\"note\">※ 시사점의 개발 방향은 공개자료 기준의 판단이며, 실제 개발 전 특허 패밀리·원료 적법성·기존 연구를 추가 검토해야 함<\/p>","abbr":{"intro":"※ 본문(R&D 제언 표·검증 설계·시사점 포함)에 나오는 약어와 임상 척도를 분야별로 정리한 것임. 원어와 풀이는 일반적인 정의이며, 척도의 점수 범위·판정 기준은 사용 판본에 따라 다를 수 있음","groups":[{"t":"임상 평가 척도·지표","rows":[["ACR20","American College of Rheumatology 20% response","류마티스 관절염 증상이 20% 이상 개선된 환자 비율"],["ADAS-Cog","Alzheimer's Disease Assessment Scale–Cognitive","알츠하이머병 인지 기능 평가 척도. 점수가 높을수록 저하"],["ADL","Activities of Daily Living","일상생활 수행 능력"],["ALSFRS-R","ALS Functional Rating Scale–Revised","근위축성 측삭경화증 기능 평가 척도(0~48점). 감소 속도로 진행을 봄"],["APRI·FIB-4","AST to Platelet Ratio Index·Fibrosis-4","혈액검사로 계산하는 간섬유화 지수"],["BASDAI","Bath Ankylosing Spondylitis Disease Activity Index","강직성 척추염 질병 활성도 지수"],["CAT","COPD Assessment Test","COPD 증상·삶의 질 설문(0~40점)"],["CASA-Q","Cough and Sputum Assessment Questionnaire","기침·객담 증상 평가 설문"],["CDASI","Cutaneous Dermatomyositis Disease Area and Severity Index","피부근염 피부 병변 활성도·손상 지수"],["Child-Pugh","Child-Pugh score","간경변 중증도 분류(빌리루빈·알부민·복수 등)"],["DAS28","Disease Activity Score 28","28개 관절 기준 류마티스 관절염 질병 활성도"],["DHI","Dizziness Handicap Inventory","어지럼으로 인한 장애 정도 설문"],["EASI","Eczema Area and Severity Index","습진(아토피 피부염) 면적·중증도 지수"],["ESSPRI","EULAR Sjögren's Syndrome Patient Reported Index","쇼그렌(건조) 증후군 환자 보고 증상 지수"],["FACT-F","Functional Assessment of Cancer Therapy–Fatigue","암 관련 피로 평가 설문"],["FeNO","Fractional exhaled Nitric Oxide","호기 산화질소. 호산구성(제2형) 기도 염증 지표"],["FSS","Fatigue Severity Scale","피로 심각도 척도"],["FVC·FEV let tab = store.get("tab","toc");
function renderSide(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const sb = $("#sideBody");
  if(tab==="toc"){
    let h = `<div class="grp">책 소개</div><a href="#/">처음 화면 · 비교표</a><a href="#/front/foreword">발간사</a><a href="#/front/howto">본문 읽는 법</a>`;
    h += `<div class="grp">처방 66종</div>`;
    Object.keys(FIELDS).sort().forEach(n=>{
      const ix = F.map((f,i)=>[f,i]).filter(([f])=>f.field==n);
      h += `<details class="f${n}"><summary>${n}. ${esc(FIELDS[n].name)} <small style="color:var(--muted);font-weight:400">${ix.length}</small></summary>${ix.map(([f,i])=>`<a href="${flink(f)}" data-id="${f.id}"><span class="n">${f.id}</span>${esc(f.ko)}</a>`).join("")}</details>`;
    });
    h += `<div class="grp">부록·도구</div><a href="#/front/abbr">약어·척도 풀이</a><a href="#/front/colophon">발간 정보</a><a href="#/search/">검색·필터</a><a href="#/herbs">약재로 찾기</a><a href="#/compare">비교함</a>`;
    sb.innerHTML = h;
  } else if(tab==="master"){
    sb.innerHTML = `<input class="filt" id="mf" placeholder="대사 이름 거르기"><div id="ml"></div>`;
    const draw = f=>{ $("#ml").innerHTML = masters.filter(([k,v])=>!f||(k+v.hz).includes(f)).map(([k,v])=>`<a class="li2" href="#/master/${encodeURIComponent(k)}">${esc(k)} <small style="color:var(--muted)">${esc(v.hz)}</small><span>${v.ix.length}</span></a>`).join(""); };
    draw(""); $("#mf").oninput = e=>draw(e.target.value.trim());
  } else {
    sb.innerHTML = `<input class="filt" id="hf" placeholder="약재 이름 거르기"><div id="hl"></div>`;
    const draw = f=>{ $("#hl").innerHTML = herbs.filter(([k])=>!f||k.includes(f)).slice(0,400).map(([k,v])=>`<a class="li2" href="#/herb/${encodeURIComponent(k)}">${esc(k)}<span>${v.length}</span></a>`).join(""); };
    draw(""); $("#hf").oninput = e=>draw(e.target.value.trim());
  }
  markCur();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.t; store.set("tab",tab); renderSide(); });
function markCur(){
  document.querySelectorAll("#sideBody a.cur").forEach(a=>a.classList.remove("cur"));
  const m = location.hash.match(/^#\/f\/([\d-]+)/); if(!m) return;
  const a = document.querySelector(`#sideBody a[data-id="${m[1]}"]`); if(!a) return;
  a.classList.add("cur"); if(a.parentElement.tagName==="DETAILS") a.parentElement.open = true;
  const r=a.getBoundingClientRect(), s=$(".side").getBoundingClientRect(); if(r.top<s.top||r.bottom>s.bottom) a.scrollIntoView({block:"center"});
}

function textOf(f, sc){
  if(sc==="name") return [f.id,f.ko,f.hz,f.alias,f.master_ko,f.master_hz].join(" ");
  if(sc==="herb") return f.identity.herbs.map(h=>h.raw+" "+h.base).join(" ");
  if(sc==="identity") return f.s.slice(6).join(" ");
  if(sc==="rd") return [...(f.logic||[]).map(c=>c.title+" "+c.body), ...(f.rd||[]).map(c=>c.tag+" "+c.title)].join(" ")+" "+f.s.filter(x=>x).join(" ").slice(0,0)+((f.rd||[]).map(c=>c.html.replace(/<[^>]+>/g," ")).join(" "));
  if(sc==="evidence") return (f.ss.evidence||"")+" "+(f.ss.data||"");
  if(sc) return f.ss[sc]||"";
  return f.s.join(" ")+" "+Object.values(f.ss).join(" ");
}
function snip(f, terms, sc){

  return "";

/* 비교 */
function viewCompare(){
  if(!cmp.length) return `<div class="crumb"><a href="#/">처음</a> › 비교함</div><h1 class="t">비교함</h1><div class="empty">처방 화면의 ‘비교함에 담기’로 최대 4종까지 담아 나란히 볼 수 있습니다.</div>`;
  const fs = cmp.map(id=>F[byId[id]]);
  const keys = [...new Set(fs.flatMap(f=>Object.keys(f.identity).filter(k=>!["herbs","notes"].includes(k))))];
  const common = fs.length>1? fs.map(f=>new Set(f.identity.herbs.map(h=>h.base))).reduce((a,b)=>new Set([...a].filter(x=>b.has(x)))) : new Set();
  const row = (k, fn)=>`<tr><th>${esc(k)}</th>${fs.map(f=>`<td>${fn(f)}</td>`).join("")}</tr>`;
  const ul = v=>`<ul style="margin:0;padding-left:1.1em">${(v||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="crumb"><a href="#/">처음</a> › 비교함</div><h1 class="t">비교함 <small class="note">${fs.length}종</small></h1>
  ${common.size?`<p>공통 약재: ${[...common].map(h=>`<a class="chip" href="#/herb/${encodeURIComponent(h)}">${esc(h)}</a>`).join("")}</p>`:""}
  <div class="card cmp"><table><thead><tr><th>항목</th>${fs.map(f=>`<th class="f${f.field}"><a href="${flink(f)}">${f.id} ${esc(f.ko)}</a><br><small class="note">${esc(f.master_ko)}</small> <button class="ibtn" data-rm="${f.id}" style="padding:0 6px;font-size:.75rem">빼기</button></th>`).join("")}</tr></thead><tbody>
  ${row("분야",f=>esc(f.field+". "+fname(f.field)))}${row("주요 적응증",f=>esc(f.meta["주요 적응증"]||""))}
  ${row("조성",f=>f.identity.herbs.map(h=>`<span class="${common.has(h.base)?"kw":""}">${esc(h.raw)}</span>`).join(", "))}
  ${row("모듈",f=>ul((f.modules||[]).map(m=>m.name+" — "+m.herbs.join(", "))))}
  ${keys.map(k=>row(k,f=>ul(f.identity[k]))).join("")}
  ${row("연구자료 유형",f=>evChip(f))}${row("제형·제품화",f=>esc(f.product)+"<br>"+stChip(f))}
  ${row("대사의 논리",f=>ul((f.logic||[]).map(c=>c.title)))}${row("R&D 제언",f=>ul((f.rd||[]).map(c=>c.title)))}
  </tbody></table></div>`;
}
function afterCompare(){ document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ toggleCmp(b.dataset.rm); route(); }); }
/* 앞뒤 부분 */
function viewFront(k){
  const fr = D.front;
  if(k==="foreword") return `<div class="crumb"><a href="#/">처음</a> › 원서 2쪽</div><h1 class="t">발간사</h1><div class="card flow" style="font-family:var(--serif);line-height:1.9">${fr.foreword}</div>`;
  if(k==="howto") return `<div class="crumb"><a href="#/">처음</a> › 원서 8쪽</div><h1 class="t">본문 읽는 법</h1><div class="card flow">${fr.howto}</div>`;
  if(k==="colophon") return `<div class="crumb"><a href="#/">처음</a> › 원서 341쪽</div><h1 class="t">발간 정보</h1><div class="card"><dl class="dl">${fr.colophon.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div>`;
  if(k==="abbr"){ const ab=fr.abbr; return `<div class="crumb"><a href="#/">처음</a> › 원서 336~340쪽</div><h1 class="t">약어·척도 풀이</h1><p class="note">${esc(ab.intro)}</p><div class="filters"><input id="af" placeholder="약어·원어·뜻 거르기" style="min-width:240px"><span class="note" id="an"></span></div>${ab.groups.map((g,gi)=>`<div class="card" data-g="${gi}"><h2 style="font-size:1.02rem;margin:0 0 8px;color:var(--a1)">${esc(g.t)}</h2><div class="tbl"><table><thead><tr><th>약어·용어</th><th>원어</th><th>뜻·쓰임</th></tr></thead><tbody>${g.rows.map(r=>`<tr data-s="${esc(r.join(" ").toLowerCase())}"><td style="font-weight:700;white-space:nowrap">${esc(r[0])}</td><td class="note">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}`; }
  return viewHome("");
}
function afterFront(k){ if(k!=="abbr") return; const draw=()=>{ const f=$("#af").value.trim().toLowerCase(); let n=0; document.querySelectorAll("tr[data-s]").forEach(tr=>{ const on=!f||tr.dataset.s.includes(f); tr.style.display=on?"":"none"; if(on) n++; }); document.querySelectorAll("[data-g]").forEach(c=>{ c.style.display=[...c.querySelectorAll("tr[data-s]")].some(t=>t.style.display!=="none")?"":"none"; }); $("#an").textContent=n+"개"; }; $("#af").oninput=draw; draw(); }

/* 라우터 */
function route(){
  const h = location.hash||"#/"; const m=$("#main"); let after=null, r;
  if((r=h.match(/^#\/f\/([\d]+-[\d]+)\/?(\w*)/))){ m.innerHTML=viewFormula(r[1]); after=()=>afterFormula(r[1],r[2]); const f=F[byId[r[1]]]; if(f) document.title=`${f.id} ${f.ko}${f.hz} — 국의대사 경험방 R&D 인사이트`; }
  else if((r=h.match(/^#\/search\/?(.*)$/))){ m.innerHTML=viewSearch(r[1]); after=()=>afterSearch(r[1]); }
  else if(h.startsWith("#/herbs")){ m.innerHTML=viewHerbs(); after=afterHerbs; }
  else if((r=h.match(/^#\/herb\/(.+)$/))){ m.innerHTML=viewHerb(decodeURIComponent(r[1])); }
  else if((r=h.match(/^#\/master\/(.+)$/))){ m.innerHTML=viewMaster(decodeURIComponent(r[1])); }
  else if(h.startsWith("#/compare")){ m.innerHTML=viewCompare(); after=afterCompare; }
  else if((r=h.match(/^#\/front\/(\w+)/))){ m.innerHTML=viewFront(r[1]); after=()=>afterFront(r[1]); }
  else { const qs=(h.split("?")[1])||""; m.innerHTML=viewHome(qs); after=()=>afterHome(qs); document.title="중국 국의대사 경험방 R&D 인사이트 — 한국한의학연구원(2026) 대화형 열람판"; }
  if(!h.startsWith("#/search")) $("#q").value="";
  if(!/^#\/f\/[\d-]+\/\w/.test(h)) window.scrollTo(0,0);
  if(after) after(); markCur(); document.body.classList.remove("nav-open");
}
window.addEventListener("hashchange", route);
let fs = store.get("fs",16); const applyFs=()=>document.documentElement.style.setProperty("--fs",fs+"px");
$("#fsUp").onclick=()=>{ fs=Math.min(22,fs+1); store.set("fs",fs); applyFs(); }; $("#fsDown").onclick=()=>{ fs=Math.max(13,fs-1); store.set("fs",fs); applyFs(); }; applyFs();
const th=store.get("theme",""); if(th) document.documentElement.dataset.theme=th;
$("#themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; store.set("theme",nx); };
$("#menuBtn").onclick=()=>document.body.classList.toggle("nav-open");
$("#cmpN").textContent=cmp.length; if(!["toc","master","herb"].includes(tab)) tab="toc";
renderSide(); route();
</script>
</body>
</html>

<script>
const D = /*__DATA__*/null;
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem("guoyi:"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem("guoyi:"+k,JSON.stringify(v)); }catch(e){} } };
const F = D.formulas, byId = {}; F.forEach((f,i)=>byId[f.id]=i);
const FIELDS = D.fields; const fname = n=>FIELDS[n]?FIELDS[n].name:"";
const STATUS = D.legend; const stIdx = s=>Math.max(0,STATUS.indexOf(s));
const EVS = ["연구 축적","임상·실험 보고","경험 보고"];
const evType = f=>EVS.find(e=>f.evidence.startsWith(e))||f.evidence;
const papers = f=>{ const m=f.evidence.match(/논문\s*(\d+)/); return m?+m[1]:0; };
const herbMap = new Map(); F.forEach((f,i)=>f.identity.herbs.forEach(h=>{ const k=h.base; if(!herbMap.has(k)) herbMap.set(k,[]); herbMap.get(k).push([i,h.dose]); }));
const herbs = [...herbMap.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],"ko"));
const masterMap = new Map(); F.forEach((f,i)=>{ const k=f.master_ko; if(!masterMap.has(k)) masterMap.set(k,{hz:f.master_hz,ix:[]}); masterMap.get(k).ix.push(i); });
const masters = [...masterMap.entries()].sort((a,b)=>b[1].ix.length-a[1].ix.length||a[0].localeCompare(b[0],"ko"));
let cmp = store.get("cmp",[]).filter(id=>byId[id]!==undefined);
function go(h){ if(location.hash===h) route(); else location.hash=h; }
const flink = f=>`#/f/${f.id}`;

function markCur(){

function compareTable(p){

  let rows = F.map((f,i)=>[f,i]).filter(([f])=>(!fld||f.field==fld)&&(!ev||evType(f)===ev)&&(!st||f.status===st)&&(!ms||f.master_ko===ms)&&(!tq||(f.ko+f.hz+f.master_ko+f.master_hz+f.meta["주요 적응증"]+f.product).includes(tq)));
  const key = {id:f=>f.field*100+ +f.id.split("-")[1], name:f=>f.ko, master:f=>f.master_ko, ind:f=>f.meta["주요 적응증"]||"", ev:f=>EVS.indexOf(evType(f))*10000-papers(f), prod:f=>stIdx(f.status), page:f=>f.pages[0]}[SORT.k];
  rows.sort((a,b)=>{ const x=key(a[0]), y=key(b[0]); return (x>y?1:x<y?-1:0)*SORT.d; });
  const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(l)}</option>`).join("");
  const th=(k,l)=>`<th data-k="${k}">${l}${SORT.k===k?(SORT.d>0?" ▲":" ▼"):""}</th>`;
  return `<div class="filters" id="ctf">
    <select data-p="field">${opt([["","분야 전체"],...Object.keys(FIELDS).sort().map(n=>[n,n+". "+FIELDS[n].name])],fld)}</select>
    <select data-p="ev">${opt([["","연구자료 유형 전체"],...EVS.map(e=>[e,e])],ev)}</select>
    <select data-p="st">${opt([["","제품화 단계 전체"],...STATUS.map(s=>[s,s])],st)}</select>
    <select data-p="m">${opt([["","국의대사 전체"],...masters.map(([k,v])=>[k,`${k} ${v.hz} (${v.ix.length})`])],ms)}</select>
    <input data-p="t" value="${esc(tq)}" placeholder="표 안에서 거르기"><span class="note">${rows.length}종</span></div>
   <div class="tbl"><table class="ctab"><thead><tr>${th("id","No")}${th("name","처방 (국의대사)")}${th("ind","주요 적응증")}${th("ev","확인된 연구자료 유형")}${th("prod","제형·제품화")}${th("page","쪽")}</tr></thead><tbody>
   ${rows.map(([f])=>`<tr class="f${f.field}"><td style="color:var(--acc);font-weight:700;white-space:nowrap">${f.id}</td><td><a href="${flink(f)}"><b>${esc(f.ko)}</b>${esc(f.hz)}</a><br><small class="note">${esc(f.master_ko)}${esc(f.master_hz)}</small></td><td>${esc(f.meta["주요 적응증"]||"")}</td><td>${evChip(f)}</td><td><i class="st st${stIdx(f.status)}" title="${esc(f.status)}"></i>${esc(f.product)}</td><td>${f.pages[0]}</td></tr>`).join("")}
   </tbody></table></div>`;
}

/* 검색 */
const SC = [["","전체"],["name","처방·대사 이름"],["herb","조성 약재"],["identity","아이덴티티(효능·주치·R&D 포인트)"],["master","학술사상"],["rd","R&D 제언·대사의 논리"],["evidence","연구 동향"],["china","중국 제품화·참고문헌"]];
function textOf(f, sc){
  if(sc==="name") return [f.id,f.ko,f.hz,f.alias,f.master_ko,f.master_hz].join(" ");
  if(sc==="herb") return f.identity.herbs.map(h=>h.raw+" "+h.base).join(" ");
  if(sc==="identity") return f.s.slice(6).join(" ");
  if(sc==="rd") return [...(f.logic||[]).map(c=>c.title+" "+c.body), ...(f.rd||[]).map(c=>c.tag+" "+c.title)].join(" ")+" "+f.s.filter(x=>x).join(" ").slice(0,0)+((f.rd||[]).map(c=>c.html.replace(/<[^>]+>/g," ")).join(" "));
  if(sc==="evidence") return (f.ss.evidence||"")+" "+(f.ss.data||"");
  if(sc) return f.ss[sc]||"";
  return f.s.join(" ")+" "+Object.values(f.ss).join(" ");
}
function snip(f, terms, sc){
  const parts = sc? [[SC.find(x=>x[0]===sc)[1], textOf(f,sc)]] : [["이름",textOf(f,"name")],["조성",textOf(f,"herb")],["아이덴티티",textOf(f,"identity")],["학술사상",f.ss.master||""],["R&D",textOf(f,"rd")],["연구 동향",textOf(f,"evidence")],["제품화",f.ss.china||""],["구성",f.ss.composition||""]];
  for(const [k,s] of parts){ const pos=s.indexOf(terms[0]); if(pos<0) continue; const a=Math.max(0,pos-40), b=Math.min(s.length,pos+100); let x=esc((a?"…":"")+s.slice(a,b)+(b<s.length?"…":"")); terms.forEach(w=>{ x=x.split(esc(w)).join(`<mark>${esc(w)}</mark>`); }); return `<b>${esc(k)}</b>${x}`; }
  return "";
}
function viewSearch(qs){
  const [qraw, query] = qs.split("?"); const p = new URLSearchParams(query||""); const qv = decodeURIComponent(qraw||""); $("#q").value = qv;
  const fld=p.get("field")||"", ev=p.get("ev")||"", st=p.get("st")||"", sc=p.get("sc")||"";
  const terms = qv.split(/\s+/).filter(Boolean);
  const rows = F.map((f,i)=>[f,i]).filter(([f])=>(!fld||f.field==fld)&&(!ev||evType(f)===ev)&&(!st||f.status===st)&&(!terms.length||terms.every(w=>textOf(f,sc).includes(w))));
  const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(l)}</option>`).join("");
  const filt = `<div class="filters" id="sf"><select data-p="field">${opt([["","분야 전체"],...Object.keys(FIELDS).sort().map(n=>[n,n+". "+FIELDS[n].name])],fld)}</select><select data-p="ev">${opt([["","연구자료 유형 전체"],...EVS.map(e=>[e,e])],ev)}</select><select data-p="st">${opt([["","제품화 단계 전체"],...STATUS.map(s=>[s,s])],st)}</select><select data-p="sc">${opt(SC,sc)}</select><span class="note">${rows.length}종</span></div>`;
  const body = terms.length? rows.map(([f])=>`<div class="res f${f.field}"><h3><a href="${flink(f)}">${f.id} ${esc(f.ko)}<span style="color:var(--acc)">${esc(f.hz)}</span></a> <small class="note">${esc(f.master_ko)} · ${f.pages[0]}쪽</small></h3><div class="snip">${snip(f,terms,sc)}</div></div>`).join("") : `<div class="grid">${rows.map(([f,i])=>fcard(i)).join("")}</div>`;
  return `<div class="crumb"><a href="#/">처음</a> › 검색·필터</div><h1 class="t">${terms.length?`“${esc(qv)}” 검색 결과`:"처방 찾아보기"}</h1>${filt}${body||`<div class="empty">맞는 처방이 없습니다.</div>`}`;
}
function afterSearch(qs){
  const [qraw] = qs.split("?");
  document.querySelectorAll("#sf select").forEach(el=>el.onchange=()=>{ const p=new URLSearchParams(); document.querySelectorAll("#sf [data-p]").forEach(x=>{ if(x.value) p.set(x.dataset.p,x.value); }); go(`#/search/${qraw||""}${p.toString()?"?"+p:""}`); });
}
/* 약재·대사 */
let hsel = [];
function viewHerbs(){ return `<div class="crumb"><a href="#/">처음</a> › 약재로 찾기</div><h1 class="t">약재(조성)로 찾기</h1><p class="note">처방 아이덴티티 〈조성〉의 약재 ${herbs.length}가지(앞뒤 한자 표기·용량 제외). 숫자는 그 약재가 든 처방 수. 둘 이상 고르면 모두 든 처방만 보입니다.</p><div class="filters"><input id="hq" placeholder="약재 이름" style="max-width:240px"><span id="hs"></span></div><div id="hg" style="line-height:2.1"></div><div id="hr" style="margin-top:14px"></div>`; }
function afterHerbs(){
  const draw=()=>{ const f=$("#hq").value.trim();
    $("#hg").innerHTML = herbs.filter(([k])=>!f||k.includes(f)).slice(0,f?300:140).map(([k,v])=>`<button class="chip" data-h="${esc(k)}" style="cursor:pointer;${hsel.includes(k)?"background:var(--a1);color:#fff;border-color:var(--a1)":""}">${esc(k)} <small>${v.length}</small></button>`).join("")+(f?"":` <span class="note">… 이름을 넣으면 나머지도 보입니다</span>`);
    document.querySelectorAll("#hg button").forEach(b=>b.onclick=()=>{ const h=b.dataset.h; hsel=hsel.includes(h)?hsel.filter(x=>x!==h):[...hsel,h]; draw(); });
    $("#hs").innerHTML = hsel.map(h=>`<span class="chip" style="background:var(--a1);color:#fff;border-color:var(--a1)">${esc(h)}</span>`).join("")+(hsel.length?` <a href="#" id="hc">모두 풀기</a>`:"");
    const c=$("#hc"); if(c) c.onclick=e=>{ e.preventDefault(); hsel=[]; draw(); };
    if(hsel.length){ let set=null; hsel.forEach(h=>{ const s=new Set((herbMap.get(h)||[]).map(x=>x[0])); set=set?new Set([...set].filter(x=>s.has(x))):s; }); const ix=[...set];
      $("#hr").innerHTML = `<h2 style="font-size:1.05rem">${hsel.map(esc).join(" + ")} — ${ix.length}종</h2><div class="grid">${ix.map(i=>fcard(i, F[i].identity.herbs.map(h=>h.base).join(", "))).join("")}</div>`; } else $("#hr").innerHTML="";
  };
  $("#hq").oninput=draw; draw();
}
function viewHerb(h){ const v=herbMap.get(h)||[]; return `<div class="crumb"><a href="#/">처음</a> › <a href="#/herbs">약재로 찾기</a></div><h1 class="t">${esc(h)} <small class="note">${v.length}종의 조성에 들어 있음</small></h1><div class="grid">${v.map(([i,dose])=>fcard(i,(dose?dose+" · ":"")+(F[i].meta["주요 적응증"]||""))).join("")}</div>`; }
function viewMaster(m){ const v=masterMap.get(m); if(!v) return `<div class="empty">없음</div>`; return `<div class="crumb"><a href="#/">처음</a> › 국의대사</div><h1 class="t">${esc(m)} <span class="hz" style="color:var(--a1)">${esc(v.hz)}</span> <small class="note">경험방 ${v.ix.length}종</small></h1><div class="grid">${v.ix.map(i=>fcard(i)).join("")}</div>`; }
/* 비교 */
function viewCompare(){
  if(!cmp.length) return `<div class="crumb"><a href="#/">처음</a> › 비교함</div><h1 class="t">비교함</h1><div class="empty">처방 화면의 ‘비교함에 담기’로 최대 4종까지 담아 나란히 볼 수 있습니다.</div>`;
  const fs = cmp.map(id=>F[byId[id]]);
  const keys = [...new Set(fs.flatMap(f=>Object.keys(f.identity).filter(k=>!["herbs","notes"].includes(k))))];
  const common = fs.length>1? fs.map(f=>new Set(f.identity.herbs.map(h=>h.base))).reduce((a,b)=>new Set([...a].filter(x=>b.has(x)))) : new Set();
  const row = (k, fn)=>`<tr><th>${esc(k)}</th>${fs.map(f=>`<td>${fn(f)}</td>`).join("")}</tr>`;
  const ul = v=>`<ul style="margin:0;padding-left:1.1em">${(v||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="crumb"><a href="#/">처음</a> › 비교함</div><h1 class="t">비교함 <small class="note">${fs.length}종</small></h1>
  ${common.size?`<p>공통 약재: ${[...common].map(h=>`<a class="chip" href="#/herb/${encodeURIComponent(h)}">${esc(h)}</a>`).join("")}</p>`:""}
  <div class="card cmp"><table><thead><tr><th>항목</th>${fs.map(f=>`<th class="f${f.field}"><a href="${flink(f)}">${f.id} ${esc(f.ko)}</a><br><small class="note">${esc(f.master_ko)}</small> <button class="ibtn" data-rm="${f.id}" style="padding:0 6px;font-size:.75rem">빼기</button></th>`).join("")}</tr></thead><tbody>
  ${row("분야",f=>esc(f.field+". "+fname(f.field)))}${row("주요 적응증",f=>esc(f.meta["주요 적응증"]||""))}
  ${row("조성",f=>f.identity.herbs.map(h=>`<span class="${common.has(h.base)?"kw":""}">${esc(h.raw)}</span>`).join(", "))}
  ${row("모듈",f=>ul((f.modules||[]).map(m=>m.name+" — "+m.herbs.join(", "))))}
  ${keys.map(k=>row(k,f=>ul(f.identity[k]))).join("")}
  ${row("연구자료 유형",f=>evChip(f))}${row("제형·제품화",f=>esc(f.product)+"<br>"+stChip(f))}
  ${row("대사의 논리",f=>ul((f.logic||[]).map(c=>c.title)))}${row("R&D 제언",f=>ul((f.rd||[]).map(c=>c.title)))}
  </tbody></table></div>`;
}
function afterCompare(){ document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ toggleCmp(b.dataset.rm); route(); }); }
/* 앞뒤 부분 */
function viewFront(k){
  const fr = D.front;
  if(k==="foreword") return `<div class="crumb"><a href="#/">처음</a> › 원서 2쪽</div><h1 class="t">발간사</h1><div class="card flow" style="font-family:var(--serif);line-height:1.9">${fr.foreword}</div>`;
  if(k==="howto") return `<div class="crumb"><a href="#/">처음</a> › 원서 8쪽</div><h1 class="t">본문 읽는 법</h1><div class="card flow">${fr.howto}</div>`;
  if(k==="colophon") return `<div class="crumb"><a href="#/">처음</a> › 원서 341쪽</div><h1 class="t">발간 정보</h1><div class="card"><dl class="dl">${fr.colophon.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></div>`;
  if(k==="abbr"){ const ab=fr.abbr; return `<div class="crumb"><a href="#/">처음</a> › 원서 336~340쪽</div><h1 class="t">약어·척도 풀이</h1><p class="note">${esc(ab.intro)}</p><div class="filters"><input id="af" placeholder="약어·원어·뜻 거르기" style="min-width:240px"><span class="note" id="an"></span></div>${ab.groups.map((g,gi)=>`<div class="card" data-g="${gi}"><h2 style="font-size:1.02rem;margin:0 0 8px;color:var(--a1)">${esc(g.t)}</h2><div class="tbl"><table><thead><tr><th>약어·용어</th><th>원어</th><th>뜻·쓰임</th></tr></thead><tbody>${g.rows.map(r=>`<tr data-s="${esc(r.join(" ").toLowerCase())}"><td style="font-weight:700;white-space:nowrap">${esc(r[0])}</td><td class="note">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}`; }
  return viewHome("");
}
function afterFront(k){ if(k!=="abbr") return; const draw=()=>{ const f=$("#af").value.trim().toLowerCase(); let n=0; document.querySelectorAll("tr[data-s]").forEach(tr=>{ const on=!f||tr.dataset.s.includes(f); tr.style.display=on?"":"none"; if(on) n++; }); document.querySelectorAll("[data-g]").forEach(c=>{ c.style.display=[...c.querySelectorAll("tr[data-s]")].some(t=>t.style.display!=="none")?"":"none"; }); $("#an").textContent=n+"개"; }; $("#af").oninput=draw; draw(); }

/* 라우터 */
function route(){
  const h = location.hash||"#/"; const m=$("#main"); let after=null, r;
  if((r=h.match(/^#\/f\/([\d]+-[\d]+)\/?(\w*)/))){ m.innerHTML=viewFormula(r[1]); after=()=>afterFormula(r[1],r[2]); const f=F[byId[r[1]]]; if(f) document.title=`${f.id} ${f.ko}${f.hz} — 국의대사 경험방 R&D 인사이트`; }
  else if((r=h.match(/^#\/search\/?(.*)$/))){ m.innerHTML=viewSearch(r[1]); after=()=>afterSearch(r[1]); }
  else if(h.startsWith("#/herbs")){ m.innerHTML=viewHerbs(); after=afterHerbs; }
  else if((r=h.match(/^#\/herb\/(.+)$/))){ m.innerHTML=viewHerb(decodeURIComponent(r[1])); }
  else if((r=h.match(/^#\/master\/(.+)$/))){ m.innerHTML=viewMaster(decodeURIComponent(r[1])); }
  else if(h.startsWith("#/compare")){ m.innerHTML=viewCompare(); after=afterCompare; }
  else if((r=h.match(/^#\/front\/(\w+)/))){ m.innerHTML=viewFront(r[1]); after=()=>afterFront(r[1]); }
  else { const qs=(h.split("?")[1])||""; m.innerHTML=viewHome(qs); after=()=>afterHome(qs); document.title="중국 국의대사 경험방 R&D 인사이트 — 한국한의학연구원(2026) 대화형 열람판"; }
  if(!h.startsWith("#/search")) $("#q").value="";
  if(!/^#\/f\/[\d-]+\/\w/.test(h)) window.scrollTo(0,0);
  if(after) after(); markCur(); document.body.classList.remove("nav-open");
}
window.addEventListener("hashchange", route);
let fs = store.get("fs",16); const applyFs=()=>document.documentElement.style.setProperty("--fs",fs+"px");
$("#fsUp").onclick=()=>{ fs=Math.min(22,fs+1); store.set("fs",fs); applyFs(); }; $("#fsDown").onclick=()=>{ fs=Math.max(13,fs-1); store.set("fs",fs); applyFs(); }; applyFs();
const th=store.get("theme",""); if(th) document.documentElement.dataset.theme=th;
$("#themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; store.set("theme",nx); };
$("#menuBtn").onclick=()=>document.body.classList.toggle("nav-open");
$("#cmpN").textContent=cmp.length; if(!["toc","master","herb"].includes(tab)) tab="toc";
renderSide(); route();
</script>
</body>
